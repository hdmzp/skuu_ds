<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의자료 뷰어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ef; --surface:#fff; --border:#e2ddd6;
  --ink:#1a1a2e; --muted:#6b7280;
  --accent:#1b3f8b; --accent-light:#eef2fb;
  --red:#b91c1c; --lime:#c9f24b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.7;
  display:flex; flex-direction:column; -webkit-text-size-adjust:100%;
}
.bar{
  background:var(--ink); color:#fff; padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.25); position:sticky; top:0; z-index:10;
}
.bar .back{
  color:rgba(255,255,255,.75); text-decoration:none; font-size:12.5px; font-weight:500;
  border:1px solid rgba(255,255,255,.22); padding:5px 11px; border-radius:999px; white-space:nowrap;
}
.bar .back:hover{color:#fff;background:rgba(255,255,255,.12)}
.bar h1{
  font-size:14px; font-weight:700; flex:1 1 160px; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4;
}
.bar h1 small{display:block;font-size:10.5px;font-weight:400;color:rgba(255,255,255,.6);margin-top:1px}
.acts{display:flex;gap:7px;flex-shrink:0}
.btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;
  padding:7px 13px;border-radius:8px;border:1px solid transparent;transition:.15s;
}
.btn-dl{background:var(--lime);color:#16233f}
.btn-dl:hover{background:#d8ff69}
.btn-tab{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
.btn-tab:hover{background:rgba(255,255,255,.2)}
.stage{flex:1 1 auto;position:relative;background:#3a3a44;min-height:0}
.stage iframe,.stage object{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:32px 22px;text-align:center;color:#e5e7eb;
}
.fallback p{font-size:13.5px;line-height:1.8;max-width:420px}
.fallback .fb-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.err{
  margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:22px 24px;font-size:13.5px;color:#374151;text-align:center;line-height:1.8;max-width:420px;
}
.err a{color:var(--accent);font-weight:700}
@media(max-width:520px){
  .bar h1{flex-basis:100%;order:3}
  .btn{padding:7px 11px;font-size:12px}
}
</style>
</head>
<body>

<div class="bar">
  <a class="back" id="back" href="machine-learning-week01.html">← 뒤로</a>
  <h1 id="doc-title">강의자료<small id="doc-sub"></small></h1>
  <div class="acts" id="acts"></div>
</div>

<div class="stage" id="stage"></div>

<script>
(function () {
  // 허용된 자료만 열 수 있도록 화이트리스트로 관리합니다.
  var DOCS = {
    'ml-w01-intro': {
      file: '../materials/machine-learning/ml-week01-course-intro.pdf',
      title: '기계학습특론 CHAPTER 1 — 강의소개',
      sub: '1주차 · 7페이지',
      back: 'machine-learning-week01.html'
    },
    'ml-w01-genai': {
      file: '../materials/machine-learning/ml-week01-generative-ai-image.pdf',
      title: '생성형 AI(이미지)란?',
      sub: '1주차 참고자료 · 17페이지',
      back: 'machine-learning-week01.html'
    }
  };

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  var stage = document.getElementById('stage');
  var doc = DOCS[param('doc')];

  if (!doc) {
    stage.style.background = 'var(--bg)';
    stage.innerHTML = '<div class="err">요청하신 자료를 찾을 수 없습니다.<br>' +
      '<a href="machine-learning-week01.html">← 1주차 수업내용으로 돌아가기</a></div>';
    return;
  }

  document.title = doc.title + ' | 강의자료 뷰어';
  document.getElementById('doc-title').childNodes[0].nodeValue = doc.title;
  document.getElementById('doc-sub').textContent = doc.sub;
  document.getElementById('back').setAttribute('href', doc.back);

  var name = doc.file.split('/').pop();

  var dl = document.createElement('a');
  dl.className = 'btn btn-dl';
  dl.href = doc.file;
  dl.setAttribute('download', name);
  dl.textContent = '⬇ 다운로드';

  var tab = document.createElement('a');
  tab.className = 'btn btn-tab';
  tab.href = doc.file;
  tab.target = '_blank';
  tab.rel = 'noopener';
  tab.textContent = '새 탭 ↗';

  var acts = document.getElementById('acts');
  acts.appendChild(dl);
  acts.appendChild(tab);

  // 내장 PDF 뷰어를 지원하지 않는 환경(주로 모바일)을 위한 대체 화면
  var fb = document.createElement('div');
  fb.className = 'fallback';
  fb.innerHTML = '<p>이 브라우저에서는 PDF를 바로 표시할 수 없습니다.<br>' +
    '새 탭에서 열거나 파일을 내려받아 확인해 주세요.</p>' +
    '<div class="fb-btns">' +
    '<a class="btn btn-dl" href="' + doc.file + '" download="' + name + '">⬇ 다운로드</a>' +
    '<a class="btn btn-tab" href="' + doc.file + '" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>' +
    '</div>';
  stage.appendChild(fb);

  var frame = document.createElement('iframe');
  frame.setAttribute('title', doc.title);
  frame.setAttribute('src', doc.file + '#view=FitH');
  stage.appendChild(frame);
})();
</script>

</body>
</html>
