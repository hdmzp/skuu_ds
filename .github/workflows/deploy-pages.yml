name: Deploy to GitHub Pages

on:
  push:
    # github-pages 환경의 '배포 허용 브랜치'에 main 이 없어서 main 푸시는
    # 잡 실행 전에 거부된다(로그 없이 즉시 실패). 설정을 바꾸기 전까지는
    # 이 브랜치가 유일한 배포 경로다.
    branches: ["claude/masters-course-summary-site-4vp2sc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
