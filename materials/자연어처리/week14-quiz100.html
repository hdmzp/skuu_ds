<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14주차 딥러닝 기반 질의 응답·기계 번역·문장 생성 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 14 · 자연어처리</div>
    <h1>14주차 &middot; 딥러닝 기반 질의 응답, 기계 번역 그리고 문장 생성 — 100문제</h1>
    <p class="sub">강의자료 14.1~14.9절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    14주차 강의자료(딥러닝 기반 질의 응답, 기계 번역 그리고 문장 생성) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "14.1", "diff": "기초", "q": "질의 응답(Question & Answering) 과제에 대한 설명으로 가장 적절한 것은?", "opts": ["자연어로 주어진 질문에 대해 시스템이 자연어로 정답을 제시하는 과제이다", "주어진 문서를 미리 정해진 범주로 분류하는 과제이다", "긴 문서를 짧은 분량으로 압축하여 요약하는 과제이다", "문장에서 개체명의 경계와 유형을 태깅하는 과제이다"], "a": 0, "exp": "강의자료는 질의 응답을 '자연어로 주어진 질문에 대해 시스템이 자연어로 정답을 제시하는 과제'로 정의한다."}, {"id": 2, "sec": "14.1", "diff": "기초", "q": "강의자료가 설명한 검색(Information Retrieval)과 질의 응답의 차이로 옳은 것은?", "opts": ["검색은 정답 그 자체를 주지만 질의 응답은 문서 목록만 제시한다", "검색은 관련 문서 목록을 주지만 질의 응답은 정답 그 자체를 제시한다", "검색은 자연어 질문을 받을 수 없고 질의 응답만 받을 수 있다", "검색과 질의 응답은 출력 형태가 완전히 동일하다"], "a": 1, "exp": "검색은 '관련 문서 목록'을 반환하는 반면 질의 응답은 '정답 그 자체'를 제시한다는 점이 핵심 차이다."}, {"id": 3, "sec": "14.1", "diff": "중급", "q": "정답 형태에 따른 질의 응답 과제 분류에 해당하지 않는 것은?", "opts": ["폐쇄형(Closed-domain)", "추출형(Extractive)", "선택형(Multiple-choice)", "생성형(Abstractive)"], "a": 0, "exp": "정답 형태에 따른 분류는 추출형/생성형/선택형이며, 폐쇄형은 지식 범위에 따른 분류에 속한다."}, {"id": 4, "sec": "14.1", "diff": "중급", "q": "지식 범위에 따라 질의 응답 과제를 나눌 때 사용하는 구분은?", "opts": ["폐쇄형(Closed-domain) / 개방형(Open-domain)", "지도형(Supervised) / 비지도형(Unsupervised)", "독해형(Reading Comprehension) / 검색 기반(Retrieval-based)", "추출형(Extractive) / 생성형(Abstractive)"], "a": 0, "exp": "지식 범위 기준의 분류는 폐쇄형과 개방형이다. 나머지는 정답 형태 또는 근거 제공 방식에 따른 분류다."}, {"id": 5, "sec": "14.1", "diff": "중급", "q": "근거를 제공하는 방식에 따른 질의 응답 과제의 분류로 옳은 것은?", "opts": ["추출형(Extractive) / 선택형(Multiple-choice)", "단일 문서형 / 다중 언어형", "폐쇄형(Closed-domain) / 개방형(Open-domain)", "독해형(Reading Comprehension) / 검색 기반(Retrieval-based)"], "a": 3, "exp": "근거 제공 방식에 따라 지문이 주어지는 독해형과 문서를 먼저 찾는 검색 기반으로 나뉜다."}, {"id": 6, "sec": "14.1", "diff": "중급", "q": "딥러닝 도입이 질의 응답 연구에 가져온 변화로 강의자료가 제시한 것이 아닌 것은?", "opts": ["수작업 자질(feature engineering)에 대한 의존도가 크게 감소하였다", "사전학습 언어 모델을 재사용하여 적은 데이터로도 높은 성능을 확보한다", "형태소 분석기와 규칙 사전에 대한 의존도가 오히려 크게 증가하였다", "질문과 정답 후보의 의미적 유사도를 분산 표현으로 직접 학습한다"], "a": 2, "exp": "딥러닝 도입으로 수작업 자질과 외부 언어 자원 의존도가 줄었다는 것이 강의자료의 설명이다."}, {"id": 7, "sec": "14.1", "diff": "심화", "q": "기존(규칙·통계 기반) 질의 응답 처리 과정의 순서로 올바른 것은?", "opts": ["질문 → 후보 정답 추출 → 문서 검색 → 질문 분석 → 쿼리 → 정답 추출 → 정답", "질문 → 문서 검색 → 질문 분석 → 쿼리 → 정답 추출 → 후보 정답 추출 → 정답", "질문 → 쿼리 → 질문 분석 → 후보 정답 추출 → 문서 검색 → 정답 추출 → 정답", "질문 → 질문 분석 → 쿼리 → 문서 검색 → 후보 정답 추출 → 정답 추출 → 정답"], "a": 3, "exp": "슬라이드의 흐름도는 질문 분석으로 쿼리를 만들고 문서를 검색한 뒤 후보 정답을 추출해 최종 정답을 뽑는 순서다."}, {"id": 8, "sec": "14.1", "diff": "중급", "q": "기존 질의 응답 파이프라인에서 발생하는 '오류 누적(error propagation)'에 대한 설명으로 옳은 것은?", "opts": ["단계마다 필요한 외부 리소스의 오류가 다음 단계로 전파되어 최종 성능을 떨어뜨린다", "정답 문자열의 길이가 길어질 때만 발생하는 현상이다", "학습 데이터가 늘어날수록 오류가 자동으로 상쇄되어 사라진다", "End-to-End 학습에서만 발생하는 고유한 문제이다"], "a": 0, "exp": "형태소 분석·구문 분석 등 단계별 모듈의 오류가 누적되어 최종 성능을 저하시키는 것이 error propagation이다."}, {"id": 9, "sec": "14.1", "diff": "중급", "q": "딥러닝 기반 질의 응답 과정의 특징으로 강의자료가 언급한 내용은?", "opts": ["질문과 정답 후보를 서로 다른 벡터 공간에 각각 사상해야 한다", "정답 후보를 만들기 위해 반드시 구문 분석기가 필요하다", "단계별로 별도의 손실 함수를 두어 모듈마다 따로 학습해야 한다", "초기 단어 임베딩 학습을 위한 레이블 없는 큰 코퍼스 이외에는 수작업 외부 리소스가 필요하지 않다"], "a": 3, "exp": "딥러닝 기반 질의 응답은 레이블 없는 대규모 코퍼스 외의 수작업 리소스 없이 End-to-End로 학습된다."}, {"id": 10, "sec": "14.1", "diff": "기초", "q": "딥러닝 기반 질의 응답의 한계로 강의자료가 지적한 것은?", "opts": ["대량의 학습 데이터가 필요하고 판단 근거를 해석하기 어렵다(블랙박스)", "End-to-End 학습이 불가능해 단계별 오류가 커진다", "질문 길이가 짧으면 아예 동작하지 않는다", "형태소 분석기 없이는 학습 자체가 불가능하다"], "a": 0, "exp": "대량 데이터 요구와 해석의 어려움(블랙박스)이 딥러닝 기반 질의 응답의 한계로 제시되었다."}, {"id": 11, "sec": "14.2", "diff": "기초", "q": "강의자료가 제시한 딥러닝 기반 질의 응답 모델의 종류가 아닌 것은?", "opts": ["잠재 디리클레 할당(LDA) 네트워크", "Compare-Aggregate 네트워크", "어텐션 메커니즘 기반 네트워크", "샴 네트워크(Siamese Network)"], "a": 0, "exp": "제시된 세 가지 모델은 샴 네트워크, 어텐션 기반 네트워크, Compare-Aggregate 네트워크다."}, {"id": 12, "sec": "14.2", "diff": "중급", "q": "딥러닝 기반 질의 응답 모델들의 공통 아이디어로 옳은 것은?", "opts": ["질문과 정답 후보를 하나의 문장으로 이어붙여 언어 모델 확률만 계산한다", "질문과 정답 후보를 각각 인코딩해 연관성 점수를 계산하고 점수가 가장 높은 후보를 고르는 랭킹 문제로 정식화한다", "정답 후보 집합 없이 항상 정답을 생성만 한다", "질문만 인코딩하고 정답 후보는 문자열 그대로 비교한다"], "a": 1, "exp": "세 모델 모두 질문·정답 후보 표현 간 연관성 점수를 계산해 최고 점수 후보를 고르는 랭킹 문제로 다룬다."}, {"id": 13, "sec": "14.2", "diff": "기초", "q": "샴 네트워크(Siamese Network)가 주로 사용되는 과제로 강의자료가 언급한 것은?", "opts": ["음성 신호의 잡음 제거", "문서의 토픽 개수 추정", "문장 의미 유사도 및 paraphrase 식별", "이미지의 객체 경계 상자 검출"], "a": 2, "exp": "샴 네트워크는 여러 문장을 쌍으로 사용하는 문장 의미 유사도, paraphrase 식별 등에 쓰인다."}, {"id": 14, "sec": "14.2", "diff": "기초", "q": "샴 네트워크에서 두 입력 문장을 처리하는 인코더의 특징은?", "opts": ["가중치를 공유하는 동일한 구조의 Encoder layer를 사용한다", "질문 쪽에만 인코더를 두고 정답 후보는 인코딩하지 않는다", "인코더 없이 문자열 편집 거리만 계산한다", "서로 완전히 다른 구조와 가중치를 갖는 인코더를 사용한다"], "a": 0, "exp": "샴 네트워크의 핵심은 두 입력이 가중치를 공유(shared weights)하는 동일 구조의 인코더를 통과한다는 점이다."}, {"id": 15, "sec": "14.2", "diff": "중급", "q": "샴 네트워크에서 변환된 두 벡터로부터 연관성 점수를 얻는 방법으로 강의자료가 든 것이 아닌 것은?", "opts": ["element-wise 연산", "코사인 유사도", "신경망 기반 가중합", "두 벡터의 편집 거리(edit distance) 계산"], "a": 3, "exp": "코사인 유사도, element-wise 연산, 신경망 기반 가중합이 제시되었고 편집 거리는 언급되지 않았다."}, {"id": 16, "sec": "14.2", "diff": "중급", "q": "샴 네트워크 구조도에서 Encoder로 예시된 신경망은?", "opts": ["Bi-LSTM / CNN", "의사결정트리 / 랜덤 포레스트", "GAN / VAE", "K-means / DBSCAN"], "a": 0, "exp": "슬라이드의 샴 네트워크 구조도는 Encoder를 Bi-LSTM 또는 CNN으로 표기하고 있다."}, {"id": 17, "sec": "14.2", "diff": "중급", "q": "어텐션 메커니즘 기반 모델에서 질문 표현을 만드는 방식은?", "opts": ["질문을 문자 n-gram 해시로 변환해 사용한다", "질문의 첫 단어 임베딩을 그대로 질문 표현으로 쓴다", "bi-LSTM과 pooling layer를 통해 질문 표현을 생성한다", "질문을 TF-IDF 벡터로 변환해 사용한다"], "a": 2, "exp": "모델은 bi-LSTM과 pooling layer로 질문 표현을 만든 뒤, 이를 기준으로 정답 후보에 어텐션을 적용한다."}, {"id": 18, "sec": "14.2", "diff": "중급", "q": "어텐션 기반 질의 응답 모델에서 어텐션이 하는 역할을 바르게 설명한 것은?", "opts": ["질문의 단어를 모두 동일한 가중치로 평균한다", "정답 후보 문장의 단어 중 질문과 관련 있는 단어에 더 큰 가중치를 부여한다", "정답 후보 문장에서 가장 긴 단어를 선택한다", "질문 문장의 어순을 무작위로 섞어 일반화를 높인다"], "a": 1, "exp": "질문 표현을 기준으로 어텐션을 적용해 정답 후보의 관련 단어에 더 큰 가중치를 할당한다."}, {"id": 19, "sec": "14.2", "diff": "기초", "q": "Compare-Aggregate 구조를 사용한 BiMPM 모델은 몇 개의 층으로 구성되는가?", "opts": ["7개", "3개", "12개", "5개"], "a": 3, "exp": "BiMPM은 Word Representation, Context Representation, Matching, Aggregation, Prediction의 5개 층으로 구성된다."}, {"id": 20, "sec": "14.2", "diff": "중급", "q": "BiMPM의 Matching Layer가 수행하는 일은?", "opts": ["입력 단어를 일정 차원의 벡터로 변환한다", "최종 연관성 점수 또는 라벨을 예측한다", "비교 결과를 고정 길이 벡터로 집계한다", "질문과 정답 후보의 각 시점 표현을 여러 관점(perspective)에서 비교한다"], "a": 3, "exp": "Matching Layer는 다관점(multi-perspective) 매칭을 수행하는 층이며, 나머지 보기는 각각 다른 층의 역할이다."}, {"id": 21, "sec": "14.2", "diff": "심화", "q": "BiMPM의 층을 입력에서 출력 방향으로 올바르게 나열한 것은?", "opts": ["Word Representation → Context Representation → Matching → Aggregation → Prediction", "Matching → Word Representation → Context Representation → Prediction → Aggregation", "Word Representation → Matching → Context Representation → Prediction → Aggregation", "Context Representation → Word Representation → Aggregation → Matching → Prediction"], "a": 0, "exp": "구조도는 아래에서 위로 Word Representation, Context Representation, Matching, Aggregation, Prediction 순이다."}, {"id": 22, "sec": "14.3", "diff": "기초", "q": "BERT 계열 모델로 질의 응답을 수행할 때의 입력 구성 형태는?", "opts": ["[CLS] 질문 [SEP] 지문 [SEP]", "[SEP] 질문 [CLS] 지문 [CLS]", "질문 + 지문을 공백 없이 이어붙인 단일 문자열", "[MASK] 질문 [MASK] 지문 [MASK]"], "a": 0, "exp": "BERT 계열 추출형 질의 응답은 [CLS] 질문 [SEP] 지문 [SEP] 형태로 입력을 구성한다."}, {"id": 23, "sec": "14.3", "diff": "심화", "q": "슬라이드의 예시에서 '대한민국의 수도는 서울이다'라는 지문에 대해 예측 정답을 구하는 방식은?", "opts": ["argmax P(start)부터 argmax P(end)까지의 구간을 취해 '서울'을 얻는다", "지문 전체를 정답으로 출력한 뒤 후처리로 자른다", "[CLS] 토큰의 출력 벡터를 그대로 정답 문자열로 변환한다", "P(start)와 P(end)의 평균이 가장 큰 토큰 하나를 골라 '수도'를 얻는다"], "a": 0, "exp": "예측 정답은 argmax P(start) ~ argmax P(end) 구간이며, 예시에서는 '서울'이 된다."}, {"id": 24, "sec": "14.3", "diff": "중급", "q": "추출형 질의 응답(Extractive QA)의 정답이 만족해야 하는 조건은?", "opts": ["정답은 질문 문장 안에 포함되어 있어야 한다", "정답은 반드시 지문 안의 연속된 구간(span)이어야 한다", "정답은 선택지 N개 중 하나여야 한다", "정답은 반드시 지문에 없는 새로운 문장으로 생성되어야 한다"], "a": 1, "exp": "추출형 QA의 정답은 지문 내부의 연속 구간(span)으로 제한된다."}, {"id": 25, "sec": "14.3", "diff": "기초", "q": "추출형 질의 응답의 대표 데이터셋으로 강의자료가 제시한 것은?", "opts": ["Penn Treebank, CoNLL-2003", "ImageNet, COCO", "SQuAD 1.1 / 2.0, KorQuAD 1.0 / 2.0", "WMT14, IWSLT"], "a": 2, "exp": "강의자료는 SQuAD 1.1/2.0과 KorQuAD 1.0/2.0을 대표 데이터셋으로 소개한다."}, {"id": 26, "sec": "14.3", "diff": "중급", "q": "SQuAD 2.0이 SQuAD 1.1과 구별되는 특징은?", "opts": ["'정답 없음'을 판별해야 하는 문제가 포함된다", "정답이 항상 선택지 4개 중 하나로 주어진다", "이미지와 질문이 함께 주어진다", "번역 쌍으로 구성된 병렬 코퍼스이다"], "a": 0, "exp": "SQuAD 2.0에는 지문에 정답이 없는 경우를 판별하는 문제가 포함되어 있다."}, {"id": 27, "sec": "14.3", "diff": "중급", "q": "KorQuAD 2.0의 확장 방향으로 옳은 것은?", "opts": ["문서 전체(표·리스트 포함)를 지문으로 하는 긴 문서 기계독해로 확장되었다", "질문을 영어로만 제공하도록 확장되었다", "이미지 기반 시각 질의 응답으로 확장되었다", "정답을 생성형으로만 제출하도록 확장되었다"], "a": 0, "exp": "KorQuAD 2.0은 표와 리스트를 포함한 문서 전체를 지문으로 삼는 긴 문서 기계독해로 확장되었다."}, {"id": 28, "sec": "14.3", "diff": "기초", "q": "EM(Exact Match) 지표의 정의로 옳은 것은?", "opts": ["예측 정답과 정답 문자열이 완전히 일치하는 비율", "예측 정답의 길이와 정답 길이의 비율", "예측과 정답 토큰 집합의 조화 평균", "n-gram 정밀도의 기하평균"], "a": 0, "exp": "EM은 예측과 정답 문자열이 완전히 일치하는 비율이며, 조화 평균은 F1의 정의다."}, {"id": 29, "sec": "14.3", "diff": "기초", "q": "질의 응답 평가에서 F1 점수를 계산하는 방식은?", "opts": ["예측 토큰 수를 정답 토큰 수로 나눈 값을 사용한다", "예측 문장의 n-gram 정밀도에 Brevity Penalty를 곱한다", "예측과 정답을 토큰 집합으로 보고 정밀도와 재현율의 조화 평균을 구한다", "예측과 정답 문자열의 완전 일치 여부를 0/1로 계산한다"], "a": 2, "exp": "F1은 예측·정답을 토큰 집합으로 보고 정밀도와 재현율의 조화 평균으로 계산한다."}, {"id": 30, "sec": "14.3", "diff": "심화", "q": "정답이 '서울'이고 예측이 '대한민국 서울'일 때 슬라이드 표에 제시된 EM과 F1 값은?", "opts": ["EM 0.0, F1 0.67", "EM 1.0, F1 1.00", "EM 0.0, F1 0.00", "EM 1.0, F1 0.67"], "a": 0, "exp": "문자열이 완전히 일치하지 않으므로 EM은 0.0이지만, 토큰이 부분적으로 겹쳐 F1은 0.67이다."}, {"id": 31, "sec": "14.3", "diff": "심화", "q": "정답이 '서울'인데 예측이 '부산'인 사례의 EM과 F1 값은?", "opts": ["EM 0.5, F1 0.50", "EM 0.0, F1 0.50", "EM 1.0, F1 0.00", "EM 0.0, F1 0.00"], "a": 3, "exp": "겹치는 토큰이 전혀 없으므로 EM과 F1 모두 0이다."}, {"id": 32, "sec": "14.3", "diff": "중급", "q": "동일한 질문에 여러 개의 정답이 존재할 때 점수를 계산하는 방법은?", "opts": ["모든 정답과의 점수를 평균한다", "가장 긴 정답과의 점수만 사용한다", "가장 먼저 등록된 정답만 사용한다", "각 정답과의 점수 중 최댓값을 사용한다"], "a": 3, "exp": "여러 정답이 있는 경우 각 정답에 대한 점수 중 최댓값을 취한다."}, {"id": 33, "sec": "14.4", "diff": "기초", "q": "시각 질의 응답(VQA)의 정의로 가장 적절한 것은?", "opts": ["텍스트를 입력받아 이미지를 생성하는 작업", "이미지 전체를 설명하는 한 문장을 자동으로 만들어 내는 작업", "이미지에서 사람 얼굴의 위치를 찾아내는 작업", "자유 형식의 이미지와 그 이미지에 대한 질문이 주어졌을 때 올바른 답변을 만들어 내는 작업"], "a": 3, "exp": "VQA는 이미지와 그에 대한 질문을 함께 입력받아 올바른 답을 생성하는 과제다."}, {"id": 34, "sec": "14.4", "diff": "중급", "q": "VQA와 이미지 캡셔닝의 차이로 옳은 것은?", "opts": ["캡셔닝은 추론 능력이 필요하지만 VQA는 인식만으로 충분하다", "캡셔닝은 질문을 입력으로 받지만 VQA는 이미지만 입력으로 받는다", "캡셔닝은 이미지 전체를 묘사하지만 VQA는 질문이 지정한 대상·속성·관계에 선택적으로 집중한다", "두 과제는 입력과 출력이 동일하며 학습 방법만 다르다"], "a": 2, "exp": "캡셔닝은 이미지 전반을 묘사하는 반면 VQA는 질문이 가리키는 부분에 선택적으로 집중하고 통합적 추론을 요구한다."}, {"id": 35, "sec": "14.4", "diff": "기초", "q": "VQA 데이터는 크게 어떤 두 가지 형식으로 구성되는가?", "opts": ["단문형(Short)과 장문형(Long)", "개방형(Open-ended)과 다지선다형(Multiple-choice)", "지도형(Supervised)과 강화형(Reinforced)", "추출형(Extractive)과 생성형(Abstractive)"], "a": 1, "exp": "VQA 데이터는 개방형과 다지선다형으로 구성된다."}, {"id": 36, "sec": "14.4", "diff": "중급", "q": "\"피자 위에 올려진 치즈 종류는 무엇입니까?\"라는 VQA 질문이 속하는 유형은?", "opts": ["Activity recognition(행동 인식)", "Fine-grained recognition(세밀한 인식)", "Object detection(물체 인식)", "Commonsense reasoning(상식 추론)"], "a": 1, "exp": "치즈의 세부 종류를 묻는 질문은 세밀한 인식(Fine-grained recognition) 예시로 제시되었다."}, {"id": 37, "sec": "14.4", "diff": "중급", "q": "\"자전거가 몇 대나 세워져 있습니까?\"라는 질문이 해당하는 VQA 유형은?", "opts": ["Activity recognition(행동 인식)", "Object detection(물체 인식)", "Fine-grained recognition(세밀한 인식)", "Knowledge base reasoning(지식 기반 추론)"], "a": 1, "exp": "개수를 세기 위해 물체를 찾아야 하는 질문이므로 물체 인식(Object detection) 예시다."}, {"id": 38, "sec": "14.4", "diff": "심화", "q": "\"이 피자는 채식주의자 용인가요?\"와 \"저 사람의 시력은 1.0인가요?\"가 각각 해당하는 VQA 유형은?", "opts": ["Knowledge base reasoning / Commonsense reasoning", "Commonsense reasoning / Knowledge base reasoning", "Fine-grained recognition / Object detection", "Object detection / Activity recognition"], "a": 0, "exp": "채식주의자 여부는 지식 기반 추론, 시력에 대한 질문은 상식 추론 예시로 제시되었다."}, {"id": 39, "sec": "14.4", "diff": "중급", "q": "VQA 기본 모델에서 이미지와 텍스트를 각각 벡터로 만드는 방법은?", "opts": ["이미지와 텍스트 모두 LSTM 하나로 동시에 처리한다", "이미지는 RNN으로, 텍스트는 이미지 픽셀 히스토그램으로 처리한다", "이미지는 word2vec으로, 텍스트는 CNN으로 처리한다", "이미지는 CNN을 통과시키고, 텍스트는 word2vec 임베딩의 element-wise 평균을 취한다"], "a": 3, "exp": "기본 모델은 CNN으로 이미지 벡터를, word2vec 임베딩의 element-wise 평균으로 텍스트 벡터를 만든다."}, {"id": 40, "sec": "14.4", "diff": "중급", "q": "VQA 기본 모델에서 두 벡터를 결합한 뒤 최종 정답을 얻는 과정은?", "opts": ["결합 없이 이미지 벡터만 Softmax에 넣어 정답을 얻는다", "두 벡터의 코사인 유사도만 계산하여 임계값과 비교한다", "두 벡터를 이어붙여 Beam Search로 문장을 생성한다", "같은 차원으로 맞추는 완전 연결층을 거쳐 결합한 뒤 MLP와 Softmax로 K개 정답 후보 확률을 얻는다"], "a": 3, "exp": "두 벡터를 같은 차원으로 만드는 완전 연결층을 두고 결합한 뒤, MLP+Softmax로 K개 정답 후보의 확률을 산출한다."}, {"id": 41, "sec": "14.4", "diff": "중급", "q": "VQA 다지선다형 문제 모델의 동작 방식으로 옳은 것은?", "opts": ["선택지가 N개면 N번의 이진 분류를 수행해 확률이 가장 높은 후보를 선택한다", "선택지마다 별도의 CNN을 새로 학습한다", "선택지를 무시하고 개방형으로 답을 생성한 뒤 가장 가까운 선택지를 고른다", "선택지를 모두 이어붙여 한 번의 다중 분류를 수행한다"], "a": 0, "exp": "다지선다형 모델은 선택지 수만큼 이진 분류를 반복하고 최고 확률 후보를 정답으로 삼는다."}, {"id": 42, "sec": "14.4", "diff": "중급", "q": "VQA 응용 모델에 대한 설명으로 옳지 않은 것은?", "opts": ["이미지 임베딩은 사전 학습 모델을 쓸 수 없어 항상 처음부터 학습해야 한다", "이미지 임베딩에 AlexNet, VGGNet 등 사전 학습된 CNN을 재사용한다", "이미지와 텍스트 결합에 element-wise 곱, 덧셈, concatenate 등을 사용한다", "텍스트 임베딩에 word2vec 외에 GloVe나 LSTM을 활용할 수 있다"], "a": 0, "exp": "VQA 응용 모델은 AlexNet, VGGNet 등 사전 학습된 CNN을 재사용한다고 설명되어 있다."}, {"id": 43, "sec": "14.4", "diff": "심화", "q": "최근 VQA에서 널리 사용된다고 강의자료가 언급한 결합 방식은?", "opts": ["이미지와 질문을 각각 따로 학습한 뒤 결과를 투표로 결합", "질문 문자열의 정규표현식 매칭", "이미지 영역과 질문 단어 간의 co-attention", "이미지 픽셀 값의 단순 평균"], "a": 2, "exp": "최근에는 이미지 영역과 질문 단어 사이의 co-attention을 적용하는 방식이 널리 사용된다."}, {"id": 44, "sec": "14.5", "diff": "기초", "q": "기계 번역의 정의로 옳은 것은?", "opts": ["문서에서 핵심 문장을 골라 요약문을 만드는 것", "소스 문장(Source Sentence)을 타겟 문장(Target Sentence)으로 컴퓨터가 번역하는 것", "같은 언어 안에서 문장을 짧게 바꾸어 쓰는 것", "문장을 음성 신호로 바꾸어 재생하는 것"], "a": 1, "exp": "기계 번역은 소스 문장을 타겟 문장으로 컴퓨터가 옮기는 과제다."}, {"id": 45, "sec": "14.5", "diff": "기초", "q": "강의자료가 제시한 기계 번역의 3가지 흐름은?", "opts": ["지도 기반, 비지도 기반, 강화학습 기반", "통계 기반(SMT), 어텐션 기반(ABMT), 검색 기반(RBMT)", "규칙 기반(RBMT), 사전 기반(DBMT), 음성 기반(SBMT)", "규칙 기반(RBMT), 통계 기반(SMT), 인공신경망(NMT)"], "a": 3, "exp": "기계 번역은 규칙 기반(RBMT), 통계 기반(SMT), 인공신경망 기반(NMT)의 세 흐름으로 정리된다."}, {"id": 46, "sec": "14.5", "diff": "중급", "q": "규칙 기반 기계 번역(RBMT)에 대한 설명으로 옳은 것은?", "opts": ["번역 모델과 언어 모델의 두 요소로 구성된다", "소스 문장을 형태소·구문 분석을 거쳐 타겟 언어의 문법 규칙에 맞게 변환하여 번역한다", "대용량 코퍼스의 통계 정보를 학습하여 번역한다", "입력과 출력 문장을 하나의 쌍으로 두고 신경망으로 표현을 학습한다"], "a": 1, "exp": "RBMT는 언어학적·문법적 규칙을 이용해 형태소·구문 분석을 거쳐 타겟 언어 문법에 맞게 변환하는 방식이다."}, {"id": 47, "sec": "14.5", "diff": "중급", "q": "규칙 기반 기계 번역(RBMT)의 한계로 강의자료가 지적한 것은?", "opts": ["규칙 구축에 많은 비용이 들고 새로운 언어쌍으로 확장하기 어렵다", "병렬 코퍼스가 없으면 아예 동작하지 않는다", "GPU 없이는 실행할 수 없다", "학습 데이터가 많을수록 성능이 떨어진다"], "a": 0, "exp": "RBMT는 규칙 구축 비용이 크고 새로운 언어쌍 확장이 어렵다는 한계를 갖는다."}, {"id": 48, "sec": "14.5", "diff": "중급", "q": "통계 기반 기계 번역(SMT)의 특징으로 옳은 것은?", "opts": ["인코더-디코더 신경망을 End-to-End로 학습한다", "데이터 양과 성능이 서로 무관하다", "대용량 코퍼스로부터 학습된 통계 정보로 번역하며 데이터가 많을수록 성능이 향상된다", "언어학자가 작성한 변환 규칙만으로 번역한다"], "a": 2, "exp": "SMT는 대용량 코퍼스의 통계 정보를 이용하며 데이터가 많을수록 성능이 향상된다."}, {"id": 49, "sec": "14.5", "diff": "기초", "q": "통계 기반 기계 번역(SMT)을 구성하는 두 가지 모델은?", "opts": ["인코더 모델과 디코더 모델", "어텐션 모델과 정렬 모델", "번역 모델과 언어 모델", "분류 모델과 회귀 모델"], "a": 2, "exp": "SMT는 번역 모델과 언어 모델의 두 요소로 구성된다."}, {"id": 50, "sec": "14.5", "diff": "중급", "q": "SMT에서 번역 모델과 언어 모델이 각각 담당하는 역할은?", "opts": ["번역 모델은 형태소를 분석하고, 언어 모델은 구문 트리를 만든다", "번역 모델은 어휘 사전을 만들고, 언어 모델은 단어 임베딩을 학습한다", "번역 모델은 타겟 문장의 확률을 예측하고, 언어 모델은 alignment를 추출한다", "번역 모델은 소스·타겟 문장의 alignment를 추출하고, 언어 모델은 타겟 문장의 확률을 예측한다"], "a": 3, "exp": "번역 모델은 소스-타겟 정렬(alignment)을 추출하고, 언어 모델은 타겟 문장의 확률을 예측한다."}, {"id": 51, "sec": "14.5", "diff": "중급", "q": "인공신경망 기계 번역(NMT)에 대한 설명으로 옳은 것은?", "opts": ["소스 문장을 구절 단위로 쪼개 통계적으로 정렬하는 방식", "딥러닝을 이용해 입력과 출력 문장을 하나의 쌍으로 두고 적합한 표현 및 번역 결과를 찾는 방식", "번역 모델과 언어 모델을 따로 학습해 결합하는 방식", "언어학적 규칙 사전을 수작업으로 구축하여 번역하는 방식"], "a": 1, "exp": "NMT는 딥러닝으로 입력-출력 문장 쌍의 표현과 번역 결과를 함께 학습하는 방식이다."}, {"id": 52, "sec": "14.5", "diff": "심화", "q": "딥러닝 기반 기계 번역의 발전 순서를 올바르게 나열한 것은?", "opts": ["Transformer-based NMT → CNN-based NMT → RNN-based NMT → Hierarchical Phrase SMT → Phrase-based SMT → Word-based SMT", "Word-based SMT → Phrase-based SMT → Hierarchical Phrase SMT → RNN-based NMT → CNN-based NMT → Transformer-based NMT", "Word-based SMT → RNN-based NMT → Phrase-based SMT → Hierarchical Phrase SMT → CNN-based NMT → Transformer-based NMT", "Phrase-based SMT → Word-based SMT → Hierarchical Phrase SMT → CNN-based NMT → RNN-based NMT → Transformer-based NMT"], "a": 1, "exp": "슬라이드의 흐름도는 단어 기반·구절 기반·계층적 구절 SMT를 거쳐 RNN, CNN, 트랜스포머 기반 NMT로 이어진다."}, {"id": 53, "sec": "14.5", "diff": "기초", "q": "기계 번역의 실제 응용 사례에 대한 설명으로 옳지 않은 것은?", "opts": ["현재는 mBART, NLLB, LLM 계열의 트랜스포머 기반 대규모 다국어 모델이 주류다", "Google은 GNMT(Google Neural Machine Translation)를 서비스한다", "2016년 이후 상용 번역 시스템 대부분이 규칙 기반(RBMT)으로 전환되었다", "Naver는 Papago를 서비스한다"], "a": 2, "exp": "2016년 이후 상용 번역 시스템 대부분은 RBMT가 아니라 NMT로 전환되었다."}, {"id": 54, "sec": "14.6", "diff": "기초", "q": "NMT 학습에 필요한 데이터로 강의자료가 명시한 것은?", "opts": ["Parallel Corpus(병렬 코퍼스)", "레이블이 없는 단일 언어 코퍼스만", "이미지-캡션 쌍 데이터", "형태소 분석이 완료된 트리뱅크"], "a": 0, "exp": "NMT 학습에는 소스-타겟 문장이 짝지어진 병렬 코퍼스가 필요하다."}, {"id": 55, "sec": "14.6", "diff": "기초", "q": "NMT가 Sequence to Sequence 구조라는 말의 의미는?", "opts": ["단어 하나를 입력받아 단어 하나를 출력하는 구조라는 뜻", "문장을 입력받아 문장을 출력하는 '문장 to 문장' 구조라는 뜻", "문장을 입력받아 하나의 라벨을 출력하는 구조라는 뜻", "이미지를 입력받아 문장을 출력하는 구조라는 뜻"], "a": 1, "exp": "Sequence to Sequence는 곧 문장 to 문장, 즉 한국어 문장을 영어 문장으로 옮기는 구조를 뜻한다."}, {"id": 56, "sec": "14.6", "diff": "기초", "q": "인코더-디코더 구조에서 인코더의 역할은?", "opts": ["생성된 문장의 문법 오류를 교정하는 것", "컴퓨터가 이해할 수 있는 형태로 인간의 언어를 바꾸어 주는 것", "이전 time-step까지 생성한 단어에 기반해 현재 단어를 생성하는 것", "출력 확률 분포에서 토큰을 샘플링하는 것"], "a": 1, "exp": "인코더는 인간의 언어를 컴퓨터가 다룰 수 있는 벡터 표현으로 바꾸는 역할을 한다."}, {"id": 57, "sec": "14.6", "diff": "중급", "q": "인코더-디코더 구조에서 디코더의 역할을 바르게 설명한 것은?", "opts": ["인코더 결과인 문장 임베딩 벡터와 이전 time-step까지 생성한 단어들에 기반하여 현재 time-step의 단어를 생성한다", "입력 문장의 각 단어를 벡터로 바꾸어 하나의 벡터로 압축한다", "소스 문장과 타겟 문장의 alignment 통계를 추출한다", "학습 데이터를 토큰화하고 어휘 사전을 구축한다"], "a": 0, "exp": "디코더는 문맥 벡터와 이전에 생성한 단어들을 조건으로 현재 시점의 단어를 생성한다."}, {"id": 58, "sec": "14.6", "diff": "중급", "q": "인코더-디코더 구조의 활용 분야로 강의자료가 언급한 것이 아닌 것은?", "opts": ["챗봇", "음성 인식", "이미지 픽셀 단위 잡음 제거", "요약"], "a": 2, "exp": "강의자료는 기계 번역 외에 챗봇, 요약, 음성 인식 등에 인코더-디코더가 활용된다고 설명한다."}, {"id": 59, "sec": "14.6", "diff": "중급", "q": "교사 강요(Teacher Forcing)에 대한 설명으로 옳은 것은?", "opts": ["인코더의 가중치를 고정한 채 디코더만 학습하는 기법", "학습 시 디코더 입력으로 이전 예측 대신 실제 정답 단어를 넣어 학습을 안정화하는 기법", "학습률을 매 에폭마다 강제로 절반으로 줄이는 기법", "추론 시 디코더가 정답 문장을 미리 보고 생성하는 기법"], "a": 1, "exp": "교사 강요는 학습 시 디코더 입력에 모델의 이전 예측 대신 실제 정답 단어를 넣어 학습을 안정화한다."}, {"id": 60, "sec": "14.6", "diff": "기초", "q": "Sequence to Sequence 모델에서 문장의 시작과 끝을 알리기 위해 사용하는 특수 토큰은?", "opts": ["<unk>와 <num>", "<sos>와 <eos>", "[MASK]와 [PAD]", "[CLS]와 [SEP]"], "a": 1, "exp": "Seq2Seq에서는 문장의 시작과 끝을 알리는 <sos>, <eos> 토큰을 사용한다."}, {"id": 61, "sec": "14.6", "diff": "심화", "q": "슬라이드의 Seq2Seq 동작 구조도('나는 학교에 갔다' → 'I went to school')에 대한 설명으로 옳은 것은?", "opts": ["인코더가 <eos>까지 처리해 문맥 벡터를 만들고, 디코더는 <sos>를 첫 입력으로 받아 'I'부터 생성한다", "인코더와 디코더가 같은 LSTM 셀 하나를 시간에 따라 번갈아 사용한다", "인코더가 <sos>를 첫 입력으로 받고 디코더는 <eos>부터 생성한다", "디코더는 문맥 벡터 없이 이전 출력 단어만으로 생성한다"], "a": 0, "exp": "구조도에서 인코더는 '나는/학교에/갔다/<eos>'를 처리해 문맥 벡터를 만들고, 디코더는 <sos>를 입력으로 받아 I, went, to school, <eos>를 차례로 생성한다."}, {"id": 62, "sec": "14.6", "diff": "심화", "q": "RNN 기반 NMT의 문제점으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["짧은 문장일수록 오히려 번역 품질이 급격히 떨어진다", "학습 데이터에 없는 단어(OOV)가 나오면 생략하거나 잘못 번역한다", "긴 문장이 들어오면 고정 길이 문맥 벡터의 정보 병목으로 번역이 잘 되지 않는다", "앞부분에 대해 반복 번역을 하는 경우가 생긴다"], "a": 0, "exp": "강의자료가 제시한 문제는 긴 문장 처리, OOV, 반복 번역, 병렬화 곤란이며 짧은 문장 문제는 언급되지 않았다."}, {"id": 63, "sec": "14.6", "diff": "중급", "q": "RNN 기반 NMT의 학습 속도가 느린 근본적인 이유는?", "opts": ["병렬 코퍼스를 사용할 수 없기 때문", "순차 처리 구조이므로 병렬화가 어렵기 때문", "손실 함수를 매 단어마다 새로 정의해야 하기 때문", "파라미터 수가 트랜스포머보다 항상 많기 때문"], "a": 1, "exp": "RNN은 시점을 순차적으로 처리하므로 병렬화가 어렵고 그 결과 학습 속도가 느리다."}, {"id": 64, "sec": "14.7", "diff": "기초", "q": "어텐션(Attention)이 등장하게 된 배경으로 옳은 것은?", "opts": ["디코더가 <eos> 토큰을 생성하지 못했기 때문", "하나의 고정된 벡터로 전체 맥락을 나타내는 방식이 긴 문장 처리를 어렵게 만들었기 때문", "인코더의 파라미터 수가 너무 적어 표현력이 부족했기 때문", "병렬 코퍼스를 구하기 어려웠기 때문"], "a": 1, "exp": "고정 길이 문맥 벡터의 정보 병목이 어텐션 도입의 직접적 배경이다."}, {"id": 65, "sec": "14.7", "diff": "기초", "q": "어텐션의 핵심 개념을 가장 잘 설명한 것은?", "opts": ["어떠한 시점에 어떤 부분에 집중할지 그때그때 동적으로 정하는 것", "입력 문장의 마지막 단어만 참조하는 것", "모든 입력 단어에 항상 같은 가중치를 부여하는 것", "출력 단어를 생성하기 전에 입력을 미리 정렬해 두는 것"], "a": 0, "exp": "어텐션은 각 디코딩 시점마다 입력의 어느 부분에 집중할지 동적으로 결정하는 것이 핵심이다."}, {"id": 66, "sec": "14.7", "diff": "중급", "q": "어텐션 적용 시 인코더가 디코더에 넘겨 주는 것은?", "opts": ["인코더의 손실 함수 값", "인코더 입력 단어의 원-핫 벡터", "인코더의 모든 스텝의 hidden state", "인코더 마지막 스텝의 hidden state 하나만"], "a": 2, "exp": "어텐션에서는 마지막 하나가 아니라 인코더의 모든 스텝 hidden state를 디코더에 전달한다."}, {"id": 67, "sec": "14.7", "diff": "심화", "q": "어텐션 계산 4단계를 순서대로 바르게 나열한 것은?", "opts": ["Score → Alignment → Context → Output", "Context → Score → Alignment → Output", "Alignment → Score → Output → Context", "Score → Context → Alignment → Output"], "a": 0, "exp": "슬라이드는 ① Score, ② Alignment, ③ Context, ④ Output의 4단계로 어텐션 계산을 정리한다."}, {"id": 68, "sec": "14.7", "diff": "중급", "q": "어텐션 계산의 ② Alignment 단계에 대한 설명으로 옳은 것은?", "opts": ["a_t = softmax(score)로 합이 1인 가중치 분포를 만든다", "[c_t ; s_t]를 tanh에 통과시킨다", "인코더의 hidden state를 초기화한다", "c_t = Σ a_t,i · h_i로 가중합 벡터를 만든다"], "a": 0, "exp": "Alignment 단계는 score에 softmax를 적용해 합이 1인 가중치 분포를 얻는 단계다."}, {"id": 69, "sec": "14.7", "diff": "심화", "q": "어텐션 계산의 ④ Output 단계 처리 순서로 옳은 것은?", "opts": ["[c_t ; s_t] → tanh → softmax → 다음 단어 예측", "c_t → softmax → argmax → 인코더 재입력", "[c_t ; s_t] → softmax → tanh → 다음 단어 예측", "s_t → tanh → 인코더 hidden state 갱신"], "a": 0, "exp": "Output 단계는 문맥 벡터와 디코더 상태를 결합해 tanh를 거친 뒤 softmax로 다음 단어를 예측한다."}, {"id": 70, "sec": "14.7", "diff": "중급", "q": "어텐션 점수 계산 방식으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["general", "concat/additive(Bahdanau)", "max-pooling", "dot-product(Luong)"], "a": 2, "exp": "제시된 점수 계산 방식은 dot-product(Luong), general, concat/additive(Bahdanau)이며 max-pooling은 포함되지 않는다."}, {"id": 71, "sec": "14.7", "diff": "심화", "q": "어텐션 가중치 표에서 타겟 단어 'went'가 가장 큰 가중치를 준 소스 단어와 그 값은?", "opts": ["'학교에', 0.78", "'갔다', 0.15", "'갔다', 0.77", "'나는', 0.82"], "a": 2, "exp": "표에서 went 행은 나는 0.08, 학교에 0.15, 갔다 0.77이므로 '갔다'에 0.77의 가중치를 준다."}, {"id": 72, "sec": "14.7", "diff": "심화", "q": "어텐션 가중치 표에 대한 설명으로 옳지 않은 것은?", "opts": ["각 행의 합은 softmax 결과이므로 1이 된다", "'I' 행에서 '나는'에 0.82의 가중치가 부여되었다", "색이 진할수록 큰 가중치를 의미한다", "'to school' 행에서 가장 큰 가중치는 '갔다'에 0.78로 부여되었다"], "a": 3, "exp": "'to school' 행은 나는 0.09, 학교에 0.78, 갔다 0.13이므로 가장 큰 가중치는 '학교에'에 부여된 0.78이다."}, {"id": 73, "sec": "14.7", "diff": "기초", "q": "트랜스포머를 제안한 논문과 그 핵심 주장은?", "opts": ["\"Sequence to Sequence Learning with Neural Networks\"(2014), CNN 기반 인코더 제안", "\"Neural Machine Translation by Jointly Learning to Align and Translate\"(2015), RNN 강화", "\"BERT: Pre-training of Deep Bidirectional Transformers\"(2019), 양방향 마스킹 학습", "\"Attention Is All You Need\"(2017), 순환 구조를 제거하고 어텐션만으로 인코더-디코더를 구성"], "a": 3, "exp": "트랜스포머는 2017년 \"Attention Is All You Need\"에서 순환 구조 없이 어텐션만으로 구성되었다."}, {"id": 74, "sec": "14.7", "diff": "심화", "q": "트랜스포머의 핵심 구성 요소와 역할이 잘못 연결된 것은?", "opts": ["Masked Self-Attention : 디코더가 미래 단어를 보지 못하도록 가림", "Positional Encoding : 디코더가 미래 단어를 보지 못하도록 가림", "Self-Attention : 한 문장 안의 단어들이 서로를 참조하여 문맥 표현을 만듦", "Multi-Head Attention : 여러 표현 공간에서 병렬로 어텐션을 계산한 뒤 결합"], "a": 1, "exp": "Positional Encoding은 순서 정보를 벡터에 더해 위치를 구분하는 요소이고, 미래 단어를 가리는 것은 Masked Self-Attention이다."}, {"id": 75, "sec": "14.7", "diff": "심화", "q": "트랜스포머 인코더 블록의 구성으로 옳은 것은?", "opts": ["Multi-Head Self-Attention → Add & Layer Norm → Feed Forward Network → Add & Layer Norm", "Masked Multi-Head Attention → Encoder-Decoder Attention → Feed Forward Network", "Feed Forward Network → Multi-Head Self-Attention → Positional Encoding", "Multi-Head Self-Attention → Feed Forward Network → Softmax → Linear"], "a": 0, "exp": "인코더 블록은 Multi-Head Self-Attention과 FFN을 두고 각 서브층 뒤에 Add & Layer Norm을 붙인다."}, {"id": 76, "sec": "14.7", "diff": "심화", "q": "트랜스포머 디코더 블록에만 존재하고 인코더 블록에는 없는 구성 요소는?", "opts": ["Add & Layer Norm", "Masked Multi-Head Attention과 Encoder-Decoder Attention", "Feed Forward Network", "Positional Encoding"], "a": 1, "exp": "디코더 블록에는 Masked Multi-Head Attention과 Encoder-Decoder Attention이 추가로 존재한다."}, {"id": 77, "sec": "14.7", "diff": "기초", "q": "BLEU(Bilingual Evaluation Understudy)가 측정하는 것은?", "opts": ["번역 모델의 학습 손실 값", "기계 번역 결과와 사람이 만든 참조 번역 사이의 n-gram 일치도", "번역 결과의 문법 오류 개수", "예측과 정답 토큰 집합의 조화 평균"], "a": 1, "exp": "BLEU는 기계 번역 결과와 참조 번역의 n-gram 일치도를 측정하는 지표다."}, {"id": 78, "sec": "14.7", "diff": "중급", "q": "BLEU 점수의 일반적인 계산 방식으로 옳은 것은?", "opts": ["정답과 완전히 일치하는 문장의 비율을 센다", "1~4-gram 정밀도의 기하평균에 짧은 번역을 벌하는 BP(Brevity Penalty)를 곱한다", "1~4-gram 재현율의 산술평균에 길이 보정을 더한다", "정밀도와 재현율의 조화 평균을 계산한다"], "a": 1, "exp": "BLEU는 1~4-gram 정밀도의 기하평균에 Brevity Penalty를 곱해 계산한다."}, {"id": 79, "sec": "14.7", "diff": "심화", "q": "BLEU 수식 BP = min(1, exp(1 − r/c))에서 r과 c가 의미하는 것은?", "opts": ["r은 참조 번역 길이, c는 후보 번역 길이", "r은 n-gram 정밀도, c는 n-gram 재현율", "r은 반복 횟수, c는 클래스 수", "r은 후보 번역 길이, c는 참조 번역 길이"], "a": 0, "exp": "슬라이드 수식 설명에 따르면 c는 후보 번역 길이, r은 참조 번역 길이다."}, {"id": 80, "sec": "14.7", "diff": "중급", "q": "BLEU의 한계와 보완 지표에 대한 설명으로 옳은 것은?", "opts": ["의미 유사도까지 반영하므로 별도의 보완 지표가 필요 없다", "참조 번역 없이도 계산할 수 있어 자동 평가에 널리 쓰인다", "표면적 어휘 일치만 보므로 동의어·어순 변화를 반영하지 못해 METEOR, chrF, BERTScore, COMET 등을 함께 쓴다", "짧은 번역에 유리하도록 설계되어 BP가 필요 없다"], "a": 2, "exp": "BLEU는 표면적 어휘 일치만 보므로 동의어·어순 변화를 반영하지 못하며, METEOR·chrF·BERTScore·COMET 등이 보완 지표로 쓰인다."}, {"id": 81, "sec": "14.8", "diff": "중급", "q": "통계 기반 언어 모델의 한계로 강의자료가 제시한 것이 아닌 것은?", "opts": ["훈련 코퍼스의 내용과 양에 따라 성능이 크게 좌우된다", "데이터가 늘어나도 특정 지점에서 성능이 임계치에 도달한다", "모델이 무겁고 해석이 매우 어렵다", "희소 문제(sparsity)에 대처하기 어렵다"], "a": 2, "exp": "통계 기반 언어 모델은 '해석이 쉽고 가볍다'는 장점을 갖는다고 설명되므로 무겁고 해석이 어렵다는 것은 한계가 아니다."}, {"id": 82, "sec": "14.8", "diff": "기초", "q": "자연스러운 문장 생성의 조건으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["의미적으로 말이 되어야 한다", "텍스트가 올바른 통사 구조를 지녀야 한다", "생성된 문장의 길이가 항상 일정해야 한다", "단어들 혹은 문장들 사이의 문맥이 일관되게 유지되어야 한다"], "a": 2, "exp": "제시된 조건은 통사 구조, 의미적 타당성, 문맥 일관성이며 길이 고정은 조건이 아니다."}, {"id": 83, "sec": "14.8", "diff": "기초", "q": "순환 신경망 언어 모델이 예측하는 확률로 옳은 것은?", "opts": ["P(타겟 문장 | 소스 문장) : 번역 확률", "P(w_t | w_1 ... w_t-1) : 이전 토큰들을 조건으로 한 다음 토큰의 확률", "P(정답 | 질문, 지문) : 정답 구간 확률", "P(w_1 ... w_t | w_t+1) : 이후 토큰을 조건으로 한 이전 토큰의 확률"], "a": 1, "exp": "순환 신경망 언어 모델은 이전 토큰들을 조건으로 다음 토큰 확률 P(w_t | w_1...w_t-1)을 예측한다."}, {"id": 84, "sec": "14.8", "diff": "심화", "q": "문장 생성 모델의 학습 및 생성 절차를 순서대로 나열한 것은?", "opts": ["데이터 전처리 → 모델 설계 → 모델 훈련 → 문장 생성", "모델 설계 → 데이터 전처리 → 문장 생성 → 모델 훈련", "모델 훈련 → 데이터 전처리 → 모델 설계 → 문장 생성", "데이터 전처리 → 모델 훈련 → 모델 설계 → 문장 생성"], "a": 0, "exp": "슬라이드의 절차는 ① 데이터 전처리 ② 모델 설계 ③ 모델 훈련 ④ 문장 생성 순이다."}, {"id": 85, "sec": "14.8", "diff": "중급", "q": "문장 생성 절차의 '② 모델 설계' 단계에서 설정하는 항목으로 옳은 것은?", "opts": ["코퍼스 수집, 토큰화, 어휘 사전 구축", "옵티마이저와 손실 함수 설정, 체크포인트 저장", "배치 크기, vocab 크기, 임베딩 차원, RNN 유닛 수", "체크포인트 로드 후 시작 토큰부터 순차 생성"], "a": 2, "exp": "모델 설계 단계에서는 배치 크기, vocab 크기, 임베딩 차원, RNN 유닛 수 등을 설정한다."}, {"id": 86, "sec": "14.8", "diff": "중급", "q": "어휘 사전의 토큰 단위에 대한 설명으로 옳은 것은?", "opts": ["항상 단어 기반으로 고정되어 있다", "토큰 단위는 옵티마이저 선택에 따라 결정된다", "항상 문자 기반으로 고정되어 있다", "문자 기반 / 단어 기반 / 서브워드(BPE) 중 어떤 모델을 쓰느냐에 따라 달라진다"], "a": 3, "exp": "어휘 사전의 토큰 단위는 문자 기반, 단어 기반, 서브워드(BPE) 등 모델에 따라 달라진다."}, {"id": 87, "sec": "14.8", "diff": "중급", "q": "Greedy Search의 동작 방식과 특징으로 옳은 것은?", "opts": ["logit을 T로 나누어 분포의 뾰족한 정도를 조절한다", "누적 확률 p를 넘는 최소 집합에서 샘플링한다", "상위 k개 후보 경로를 동시에 유지하여 번역·요약에 적합하다", "매 스텝 확률이 가장 높은 토큰 1개를 선택하며, 빠르지만 반복적이고 단조로운 문장을 만들기 쉽다"], "a": 3, "exp": "Greedy Search는 매 스텝 최고 확률 토큰 하나를 고르며 빠르지만 반복·단조로운 문장이 되기 쉽다."}, {"id": 88, "sec": "14.8", "diff": "기초", "q": "Beam Search에 대한 설명으로 옳은 것은?", "opts": ["확률 상위 k개 중에서만 무작위로 샘플링한다", "temperature를 조절해 분포를 평탄하게 만든다", "상위 k개 후보 경로를 동시에 유지하며, 번역·요약에 적합하지만 다양성은 낮다", "매 스텝 확률이 가장 높은 토큰 1개만 선택한다"], "a": 2, "exp": "Beam Search는 상위 k개 경로를 유지하는 방식으로 번역·요약에 적합하나 다양성은 낮다."}, {"id": 89, "sec": "14.8", "diff": "중급", "q": "Temperature를 이용한 디코딩에 대한 설명으로 옳은 것은?", "opts": ["누적 확률이 T를 넘는 최소 집합에서 샘플링한다", "logit을 T로 나누어 분포를 평탄/뾰족하게 하며, T가 커지면 다양성이 커지고 T가 작으면 보수적이 된다", "확률 상위 T개 토큰만 남기고 나머지를 제거한다", "logit을 T로 나누며, T가 커질수록 출력이 더 보수적으로 변한다"], "a": 1, "exp": "Temperature는 logit을 T로 나누어 분포 모양을 조절하며, T↑이면 다양성↑, T↓이면 보수적이다."}, {"id": 90, "sec": "14.8", "diff": "중급", "q": "Top-k Sampling의 특징으로 옳은 것은?", "opts": ["누적 확률 p를 넘는 최소 집합에서 샘플링하여 후보 수가 자동 조절된다", "매 스텝 최고 확률 토큰 하나만 결정적으로 선택한다", "상위 k개 경로를 끝까지 유지하며 최종 점수로 하나를 고른다", "확률 상위 k개 중에서만 샘플링하여 엉뚱한 토큰을 배제하며, k 선택이 중요하다"], "a": 3, "exp": "Top-k Sampling은 확률 상위 k개 후보 중에서만 샘플링하며 k 값 선택이 중요하다."}, {"id": 91, "sec": "14.8", "diff": "심화", "q": "Top-p(Nucleus) 샘플링이 Top-k Sampling과 구별되는 점은?", "opts": ["항상 고정된 개수의 후보만 남기므로 계산량이 일정하다", "확률이 가장 낮은 토큰을 우선적으로 선택한다", "누적 확률 p를 넘는 최소 집합에서 샘플링하므로 문맥에 따라 후보 수가 자동으로 조절된다", "여러 후보 경로를 동시에 유지하여 최종 경로를 비교한다"], "a": 2, "exp": "Top-p는 누적 확률 p를 넘는 최소 집합을 후보로 삼으므로 문맥에 따라 후보 수가 달라진다."}, {"id": 92, "sec": "14.8", "diff": "기초", "q": "GPT 모델에 대한 설명으로 옳은 것은?", "opts": ["OpenAI가 공개한 시리즈로 트랜스포머의 디코더 구조를 활용해 방대한 데이터로 학습한다", "이미지 분류 전용으로 설계된 합성곱 신경망이다", "순환 신경망(RNN)만으로 구성되어 병렬 학습이 불가능하다", "구글이 공개한 시리즈로 트랜스포머의 인코더 구조만 활용한다"], "a": 0, "exp": "GPT는 OpenAI가 공개한 모델로 트랜스포머 디코더 구조를 활용해 대규모 데이터로 학습한다."}, {"id": 93, "sec": "14.8", "diff": "중급", "q": "셀프 어텐션 기반 언어 모델의 남은 과제로 강의자료가 지적한 것은?", "opts": ["사실과 다른 내용을 그럴듯하게 생성하는 환각(hallucination) 문제", "어휘 사전을 만들 수 없는 문제", "문장이 항상 3단어 이하로만 생성되는 문제", "학습에 병렬화를 적용할 수 없는 문제"], "a": 0, "exp": "지식·상식에 기반한 창조적 생성의 어려움과 환각(hallucination) 문제가 남은 과제로 제시되었다."}, {"id": 94, "sec": "14.8", "diff": "심화", "q": "GPT-2 모델 크기 비교 표에서 Model Dimensionality가 1024인 모델의 Layers와 Parameters는?", "opts": ["12개 층, 117M", "24개 층, 345M", "48개 층, 1,542M", "36개 층, 762M"], "a": 1, "exp": "표에서 GPT-2 Medium은 Model Dimensionality 1024, Layers 24, Parameters 345M이다."}, {"id": 95, "sec": "14.8", "diff": "중급", "q": "모델 규모(파라미터 수·데이터·연산량)가 커질수록 성능이 예측 가능하게 향상되는 경향을 부르는 이름은?", "opts": ["교사 강요(Teacher Forcing)", "포지셔널 인코딩(Positional Encoding)", "스케일링 법칙(Scaling Law)", "브레비티 페널티(Brevity Penalty)"], "a": 2, "exp": "모델 규모 증가에 따라 성능이 예측 가능하게 향상되는 경향을 스케일링 법칙이라 한다."}, {"id": 96, "sec": "14.8", "diff": "심화", "q": "질의 응답·기계 번역·문장 생성 세 과제의 확률 정식화가 바르게 짝지어진 것은?", "opts": ["세 과제 모두 P(정답 | 질문, 지문)으로 동일하게 정식화된다", "기계 번역 P(정답 | 질문, 지문), 질의 응답 P(타겟 문장 | 소스 문장), 문장 생성 P(다음 토큰 | 이전 토큰들)", "기계 번역 P(다음 토큰 | 이 const SECTIONS = {
  "14.1": "질의 응답 개요",
  "14.2": "QA 딥러닝 모델",
  "14.3": "사전학습 QA·평가",
  "14.4": "시각 질의 응답",
  "14.5": "기계 번역 흐름",
  "14.6": "Seq2Seq 구조",
  "14.7": "어텐션·트랜스포머",
  "14.8": "문장 생성·디코딩",
  "14.9": "실습·과제·정리"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week14_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
