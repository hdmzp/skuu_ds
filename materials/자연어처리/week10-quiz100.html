<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10주차 토픽 모델링·감성 분석·기계 이해 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 10 · 자연어처리</div>
    <h1>10주차 &middot; 토픽 모델링, 감성 분석, 그리고 기계 이해 — 100문제</h1>
    <p class="sub">강의자료 10.1~10.4절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    10주차 강의자료(토픽 모델링, 감성 분석, 그리고 기계 이해) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "10.1.1", "diff": "기초", "q": "강의자료에서 토픽 모델링이 주로 사용한다고 설명한 학습 방식은 무엇인가?", "opts": ["강화 학습", "준지도 학습", "지도 학습", "비지도 학습"], "a": 3, "exp": "토픽 모델링은 학습할 토픽이 지정된 예시를 제공하지 않아도 스스로 토픽을 찾아내는 비지도 학습 알고리즘을 사용한다."}, {"id": 2, "sec": "10.1.1", "diff": "기초", "q": "토픽 모델링에서 말하는 '문서(document)'의 정의로 가장 알맞은 것은?", "opts": ["의미상 하나로 묶이는 단어들의 집합", "제목과 본문이 모두 있는 기사", "형태소 분석이 끝난 문장 하나", "반드시 한 페이지 이상인 공식 출판물"], "a": 0, "exp": "강의자료는 문서를 '의미상 하나로 묶이는 단어들의 집합'으로 정의하며, 트윗만큼 짧거나 기사만큼 길 수 있다고 설명한다."}, {"id": 3, "sec": "10.1.1", "diff": "중급", "q": "토픽 모델링에서 토픽을 '잠재적(latent)'이라고 부르는 이유로 옳은 것은?", "opts": ["어떤 토픽이 있는지 미리 알 수 없기 때문", "토픽이 항상 확률값으로 표현되기 때문", "토픽에 사람이 미리 이름을 붙여 두기 때문", "토픽이 문서보다 항상 많기 때문"], "a": 0, "exp": "강의자료는 어떤 토픽이 있는지 미리 알 수 없기 때문에 토픽이 잠재적이며 이름을 갖고 있지 않다고 설명한다."}, {"id": 4, "sec": "10.1.1", "diff": "중급", "q": "토픽 개수에 대한 강의자료의 설명으로 옳지 않은 것은?", "opts": ["토픽 개수 K는 하이퍼파라미터이다", "문서가 많거나 다양하면 토픽 개수를 늘릴 수 있다", "작은 문서 집합에서는 토픽 개수를 줄일 수도 있다", "실제로 토픽 개수는 문서 개수보다 훨씬 많아야 한다"], "a": 3, "exp": "강의자료는 실제로 토픽 개수가 문서의 개수보다 훨씬 더 적어야 한다고 명시한다."}, {"id": 5, "sec": "10.1.1", "diff": "기초", "q": "10주차 개요에서 '무엇을 묻고 답할 수 있는가?'라는 질문에 대응하는 과제는?", "opts": ["형태소 분석", "기계 독해", "감성 분석", "토픽 모델링"], "a": 1, "exp": "개요는 '무엇에 관한 글인가→토픽 모델링, 어떤 감정을 담고 있는가→감성 분석, 무엇을 묻고 답할 수 있는가→기계 독해'로 대응시킨다."}, {"id": 6, "sec": "10.1.1", "diff": "기초", "q": "강의자료가 제시한 토픽 모델링의 적용 분야가 아닌 것은?", "opts": ["음성 인식 정확도 향상", "탐색적 데이터 분석", "문서 클러스터링", "차원 축소"], "a": 0, "exp": "적용 분야로 테마 찾기, 탐색적 데이터 분석, 문서 클러스터링, 차원 축소, 역사적 분석, 추천 및 검색이 제시되었고 음성 인식은 포함되지 않는다."}, {"id": 7, "sec": "10.1.1", "diff": "중급", "q": "차원 축소 관점에서 강의자료가 든 예시로 옳은 것은?", "opts": ["단어 20,000개를 형태소 20,000개로 분해", "어휘 수 200개의 문서 벡터를 토픽 2,000개로 확장", "문서 20,000개를 문서 20개로 표본 추출", "어휘 수 20,000개의 문서 벡터를 토픽 20개의 벡터로 축약"], "a": 3, "exp": "강의자료는 어휘 수 20,000개의 문서 벡터를 토픽 20개의 벡터로 축약하는 것을 차원 축소의 예로 든다."}, {"id": 8, "sec": "10.1.1", "diff": "심화", "q": "문서 클러스터링에 K-평균 군집화를 문서 벡터에 그대로 적용할 때 생기는 문제와 강의자료가 권한 해법은?", "opts": ["클러스터 ID가 자동 부여되지 않으므로, 사람이 먼저 레이블을 붙인다", "단어 벡터의 차원이 매우 높아 거리 계산이 잘 동작하지 않으므로, 토픽 분포를 먼저 구한 뒤 그 위에서 군집화한다", "단어 순서가 반영되지 않으므로, N-gram으로 순서를 복원한 뒤 군집화한다", "문서 수가 부족하므로, 문서를 문장 단위로 잘게 쪼개 개수를 늘린다"], "a": 1, "exp": "단어 벡터는 차원이 매우 높아 거리 계산이 잘 동작하지 않으므로 토픽 분포를 구한 뒤 그 위에서 군집화하면 더 안정적인 결과를 얻는다고 설명한다."}, {"id": 9, "sec": "10.1.1", "diff": "기초", "q": "토픽 모델링의 '역사적 분석' 활용에 해당하는 예시는?", "opts": ["리뷰 텍스트의 별점과 감성 점수를 비교해 허위 리뷰를 걸러냄", "질문과 지문을 하나의 시퀀스로 연결해 인코딩", "연도별 신문 기사에 토픽 모델링을 적용해 사회적 이슈의 등장과 소멸을 관찰", "지문에서 정답 구간의 시작과 끝 위치를 예측"], "a": 2, "exp": "역사적 분석은 시기별로 문서를 나눠 토픽 분포를 비교하는 것으로, 연도별 신문 기사 분석이나 학술 논문 초록 분석이 예로 제시되었다."}, {"id": 10, "sec": "10.1.2", "diff": "기초", "q": "단어 모음(Bag of Words)에 대한 설명으로 가장 알맞은 것은?", "opts": ["단어를 의미가 비슷한 순서로 정렬한 배열", "각각의 고유 단어와 문서에서 출현하는 단어의 정수형 개수를 담고 있는 사전", "단어를 등장 순서대로 나열한 리스트", "단어 사이의 문법적 의존 관계를 표현한 트리"], "a": 1, "exp": "강의자료는 단어 모음을 각각의 고유 단어와 문서 내 출현 개수를 담은 사전으로 정의한다."}, {"id": 11, "sec": "10.1.2", "diff": "중급", "q": "문서를 단어 모음으로 취급할 때 감수해야 하는 손실은 무엇인가?", "opts": ["구조, 순서, 문법을 무시하므로 약간의 정보를 잃는다", "단어의 출현 빈도 정보를 잃는다", "어휘 사전의 크기를 알 수 없게 된다", "문서의 개수를 셀 수 없게 된다"], "a": 0, "exp": "BoW는 문서의 구조와 문법을 무시하고 단어 개수만 사용하므로 순서나 구조를 무시하는 대가로 약간의 정보를 잃는다."}, {"id": 12, "sec": "10.1.2", "diff": "기초", "q": "문서-단어 행렬(Document-Term Matrix)의 구성으로 옳은 것은?", "opts": ["행은 문서, 열은 어휘 사전의 단어, 원소는 출현 빈도", "행은 문서, 열은 토픽, 원소는 특이값", "행은 토픽, 열은 문서, 원소는 로짓", "행은 단어, 열은 토픽, 원소는 확률"], "a": 0, "exp": "문서-단어 행렬은 행이 문서, 열이 어휘 사전의 단어, 원소가 출현 빈도인 행렬이다."}, {"id": 13, "sec": "10.1.2", "diff": "중급", "q": "단순 빈도 대신 TF-IDF를 사용하는 이유로 옳은 것은?", "opts": ["문서-단어 행렬을 정방 행렬로 만들기 위해", "음수 값을 없애 확률로 해석하기 위해", "'the', '그리고'처럼 자주 등장하지만 변별력이 없는 단어에 큰 값이 부여되는 문제를 보정하기 위해", "단어의 순서 정보를 행렬에 담기 위해"], "a": 2, "exp": "단순 빈도는 자주 등장하지만 변별력 없는 단어에 큰 값을 주므로, TF-IDF가 이 문제를 보정하는 가중치 방식으로 사용된다."}, {"id": 14, "sec": "10.1.2", "diff": "중급", "q": "강의자료가 제시한 IDF의 정의로 옳은 것은?", "opts": ["IDF(t) = log(N / df(t))로, 단어 t가 등장한 문서 수가 적을수록 큰 값을 가진다", "IDF(t) = log(df(t) / N)으로, 단어가 많이 등장할수록 큰 값을 가진다", "IDF(t) = TF(t, d) / N으로, 문서 길이에 반비례한다", "IDF(t) = N × df(t)로, 전체 문서 수에 비례한다"], "a": 0, "exp": "IDF(t) = log(N / df(t))이며, 단어가 등장한 문서 수 df(t)가 적을수록 값이 커져 희귀한 단어를 강조한다."}, {"id": 15, "sec": "10.1.2", "diff": "심화", "q": "토픽 모델링 알고리즘이 공통으로 두는 가정으로 옳지 않은 것은?", "opts": ["토픽에는 단어들의 집합이 포함되어 있다", "문서는 일련의 토픽들로 구성되어 있다", "토픽은 반드시 사람이 사전에 이름과 범위를 정의해 주어야 한다", "토픽은 확인되지는 않지만 숨겨진 단어 생성기로 가정한다"], "a": 2, "exp": "강의자료의 가정은 토픽이 단어 집합을 포함하고, 문서가 토픽들로 구성되며, 토픽이 숨겨진 단어 생성기라는 것이다. 토픽에 사람이 이름을 붙이는 것은 결과 해석 단계의 일이지 알고리즘의 전제가 아니다."}, {"id": 16, "sec": "10.1.3", "diff": "기초", "q": "잠재 의미 분석(LSA)의 목표로 가장 알맞은 것은?", "opts": ["지문에서 정답 구간의 시작과 끝을 예측하는 것", "문서의 감성 극성을 -1에서 +1로 계산하는 것", "문서와 단어의 기반이 되는 잠재적인 토픽을 발견하는 것", "문장의 구문 트리를 생성하는 것"], "a": 2, "exp": "LSA는 특히 문서 색인의 의미 검색에 사용되며, 문서와 단어의 기반이 되는 잠재적인 토픽을 발견하는 것을 목표로 한다."}, {"id": 17, "sec": "10.1.3", "diff": "심화", "q": "LSA의 특이값 분해 A ≈ U × Σ × Vᵀ에서 각 행렬의 크기를 옳게 짝지은 것은? (N: 문서 수, M: 어휘 수, K: 토픽 수)", "opts": ["A(N×M), U(N×K), Σ(K×K), Vᵀ(K×M)", "A(K×K), U(N×K), Σ(N×M), Vᵀ(K×N)", "A(N×M), U(N×N), Σ(N×M), Vᵀ(M×M)", "A(M×N), U(M×K), Σ(K×K), Vᵀ(K×N)"], "a": 0, "exp": "강의자료는 A(N×M) ≈ U(N×K) × Σ(K×K) × Vᵀ(K×M)로 분해한다고 명시한다."}, {"id": 18, "sec": "10.1.3", "diff": "기초", "q": "LSA의 SVD 결과에서 Σ(시그마) 행렬의 역할은?", "opts": ["토픽 중요도를 나타내는 대각 행렬(특이값)", "문서와 단어의 원시 빈도", "각 단어의 토픽 관련도", "각 문서의 토픽 구성 비율"], "a": 0, "exp": "Σ는 토픽 중요도를 나타내는 대각 행렬로 특이값을 담는다."}, {"id": 19, "sec": "10.1.3", "diff": "중급", "q": "절단된 SVD(Truncated SVD)를 사용하는 목적으로 옳은 것은?", "opts": ["단어 순서 정보를 보존하기 위해", "새로운 문서를 추가해도 재분해가 필요 없게 하기 위해", "음수 값을 제거해 확률로 해석하기 위해", "상위 K개의 특이값만 남겨 차원을 축소하기 위해"], "a": 3, "exp": "강의자료는 상위 K개의 특이값만 남기는 절단된 SVD를 사용해 차원을 축소한다고 설명한다."}, {"id": 20, "sec": "10.1.3", "diff": "중급", "q": "LSA의 단점으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["새로운 문서가 추가되면 분해를 다시 수행해야 한다", "다의어 문제를 제대로 다루지 못한다", "토픽 개수 K를 하이퍼파라미터로 지정할 필요가 전혀 없다", "분해 결과에 음수가 포함되어 토픽을 확률로 해석하기 어렵다"], "a": 2, "exp": "LSA의 단점은 음수 포함으로 확률 해석이 어렵고, 문서 추가 시 재분해가 필요하며, 다의어를 다루지 못한다는 점이다. K 지정이 불필요하다는 것은 단점이 아니며 사실도 아니다."}, {"id": 21, "sec": "10.1.3", "diff": "기초", "q": "LSA의 실제 구현으로 강의자료가 소개한 것을 옳게 짝지은 것은?", "opts": ["transformers의 pipeline, gensim의 Word2Vec", "scikit-learn의 LatentDirichletAllocation, gensim의 LdaModel", "scikit-learn의 CountVectorizer, gensim의 CoherenceModel", "scikit-learn의 TruncatedSVD, gensim의 LsiModel"], "a": 3, "exp": "LSA는 scikit-learn의 TruncatedSVD와 gensim의 LsiModel로 구현한다고 소개되었다."}, {"id": 22, "sec": "10.1.4", "diff": "중급", "q": "LDA가 가정하는 문서 생성 과정의 순서로 옳은 것은?", "opts": ["문서의 토픽 분포 θ를 디리클레 분포에서 뽑음 → 각 단어 위치마다 토픽 z를 θ에서 뽑음 → 토픽 z의 단어 분포 φ에서 단어 w를 뽑음", "토픽-단어 분포 φ를 관측함 → 문서-토픽 분포 θ를 관측함 → 두 값을 곱해 단어를 결정함", "문서-단어 행렬을 만든 뒤 특이값 분해로 θ와 φ를 직접 계산함", "단어 w를 먼저 뽑음 → 그 단어에 맞는 토픽 z를 정함 → 문서의 토픽 분포 θ를 계산함"], "a": 0, "exp": "LDA는 θ를 디리클레 분포에서 뽑고, 단어 위치마다 토픽 z를 θ에서 뽑은 뒤, 토픽 z의 단어 분포 φ에서 실제 단어 w를 뽑는 생성 과정을 가정한다."}, {"id": 23, "sec": "10.1.4", "diff": "중급", "q": "LDA의 하이퍼파라미터 α(알파)에 대한 설명으로 옳은 것은?", "opts": ["특이값의 절단 개수를 결정한다", "토픽의 개수를 자동으로 결정한다", "문서-토픽 분포의 사전 분포를 조절하며, 작으면 문서가 소수의 토픽에 집중된다", "토픽-단어 분포의 사전 분포를 조절하며, 작으면 토픽이 소수의 단어로 뚜렷해진다"], "a": 2, "exp": "α는 문서-토픽 분포의 사전 분포를 조절하며, 값이 작으면 문서가 소수의 토픽에 집중되고 크면 여러 토픽에 고르게 퍼진다."}, {"id": 24, "sec": "10.1.4", "diff": "중급", "q": "LDA의 하이퍼파라미터 β(베타) 값을 크게 설정했을 때 나타나는 결과는?", "opts": ["토픽이 많은 단어에 퍼진다", "토픽 개수 K가 자동으로 늘어난다", "문서가 소수의 토픽에 집중된다", "토픽이 소수의 단어로 뚜렷해진다"], "a": 0, "exp": "β는 토픽-단어 분포의 사전 분포를 조절하며, 작으면 토픽이 소수의 단어로 뚜렷해지고 크면 많은 단어에 퍼진다."}, {"id": 25, "sec": "10.1.4", "diff": "기초", "q": "LDA의 추론 방법으로 강의자료가 제시한 두 가지는?", "opts": ["경사 하강법과 뉴턴법", "빔 서치와 그리디 디코딩", "깁스 샘플링과 변분 추론", "특이값 분해와 고유값 분해"], "a": 2, "exp": "LDA의 추론에는 깁스 샘플링(Gibbs Sampling)과 변분 추론(Variational Inference)이 주로 사용된다."}, {"id": 26, "sec": "10.1.4", "diff": "중급", "q": "LDA 결과 해석에 대한 설명으로 옳은 것은?", "opts": ["각 토픽의 이름은 알고리즘이 자동으로 생성해 준다", "각 문서는 반드시 하나의 토픽에만 배정된다", "각 토픽은 확률이 높은 상위 단어 목록으로 제시되며 토픽의 이름은 사람이 붙여야 한다", "각 문서의 토픽 확률 합은 토픽 개수 K와 같다"], "a": 2, "exp": "LDA에서 토픽은 상위 단어 목록으로 제시되고 이름은 사람이 붙이며, 각 문서는 토픽에 대한 확률 분포로 표현되어 합이 1이 된다."}, {"id": 27, "sec": "10.1.4", "diff": "심화", "q": "LDA의 단점으로 강의자료가 지적한 내용으로만 묶인 것은?", "opts": ["어휘 사전을 만들 수 없고, 디리클레 분포를 쓸 수 없으며, 시각화가 불가능하다", "결과에 음수가 포함되고, 문서 추가 시 재분해가 필요하며, 계산이 매우 느리다", "토픽 개수 K를 미리 정해야 하고, 짧은 문서에서 성능이 떨어지며, 단어 순서를 무시한다", "확률 해석이 불가능하고, 새로운 문서에 적용할 수 없으며, 토픽 이름을 붙일 수 없다"], "a": 2, "exp": "LDA는 K를 미리 정해야 하고 트윗 같은 짧은 문서에서 성능이 떨어지며 단어 순서를 무시해 문맥 정보를 활용하지 못한다. 음수 포함과 재분해 필요는 LSA의 단점이다."}, {"id": 28, "sec": "10.1.4", "diff": "중급", "q": "LDA의 장점으로 강의자료가 제시한 것은?", "opts": ["결과가 확률로 표현되어 해석이 직관적이고, 새로운 문서에도 학습된 모델로 토픽 분포를 추론할 수 있다", "단어 순서와 문맥을 그대로 반영할 수 있다", "토픽 개수를 지정하지 않아도 자동으로 최적값을 찾는다", "짧은 트윗에서 특히 높은 성능을 낸다"], "a": 0, "exp": "LDA는 결과가 확률로 표현되어 해석이 직관적이며, 학습된 모델로 새로운 문서의 토픽 분포도 추론할 수 있다."}, {"id": 29, "sec": "10.1.5", "diff": "중급", "q": "LSA와 LDA의 기반 이론을 옳게 짝지은 것은?", "opts": ["둘 다 선형대수의 고유값 분해", "LSA는 베이지안 확률 모형, LDA는 선형대수의 특이값 분해", "LSA는 선형대수의 특이값 분해, LDA는 베이지안 확률 모형", "둘 다 베이지안 확률 모형"], "a": 2, "exp": "LSA는 선형대수의 특이값 분해에, LDA는 베이지안 확률 모형에 기반한다."}, {"id": 30, "sec": "10.1.5", "diff": "중급", "q": "LSA와 LDA의 결과 형태를 비교한 설명으로 옳은 것은?", "opts": ["LSA는 확률 값, LDA는 음수를 포함한 실수 값을 낸다", "둘 다 정수 빈도 값을 낸다", "둘 다 0과 1 사이의 확률 값을 낸다", "LSA는 음수를 포함한 실수 값, LDA는 0 이상이고 합이 1인 확률 값을 낸다"], "a": 3, "exp": "LSA의 결과는 음수를 포함한 실수 값이고, LDA의 결과는 0 이상이며 합이 1인 확률 값이다."}, {"id": 31, "sec": "10.1.5", "diff": "기초", "q": "혼란도(Perplexity)에 대한 설명으로 옳은 것은?", "opts": ["토픽 개수 K를 자동으로 결정해 주는 알고리즘이다", "한 토픽의 상위 단어들이 함께 등장하는 정도를 나타내며 값이 낮을수록 좋다", "모델이 새로운 문서를 얼마나 잘 예측하는지를 나타내며 값이 높을수록 좋다", "모델이 새로운 문서를 얼마나 잘 예측하는지를 나타내며 값이 낮을수록 좋다"], "a": 3, "exp": "혼란도는 모델의 새로운 문서 예측 능력을 나타내는 지표로 값이 낮을수록 좋다."}, {"id": 32, "sec": "10.1.5", "diff": "중급", "q": "응집도(Coherence)에 대한 설명으로 옳지 않은 것은?", "opts": ["K를 바꿔가며 응집도 곡선을 그린 후 값이 꺾이는 지점을 선택하는 데 쓰인다", "한 토픽의 상위 단어들이 서로 얼마나 자주 함께 등장하는지를 측정한다", "gensim의 CoherenceModel로 계산한다", "값이 낮을수록 사람이 이해하기 좋은 토픽이다"], "a": 3, "exp": "응집도는 값이 높을수록 사람이 이해하기 좋은 토픽을 의미하므로, 낮을수록 좋다는 설명은 틀렸다."}, {"id": 33, "sec": "10.1.5", "diff": "심화", "q": "혼란도와 응집도의 관계에 대해 강의자료가 경고한 내용은?", "opts": ["두 지표는 항상 동일한 K를 최적으로 지목한다", "혼란도는 사람이 직접 평가해야만 계산할 수 있다", "혼란도가 낮다고 해서 사람이 보기에 좋은 토픽이라는 보장은 없다", "응집도가 높으면 혼란도도 반드시 낮아진다"], "a": 2, "exp": "강의자료는 혼란도가 낮다고 해서 사람이 보기에 좋은 토픽이라는 보장은 없다고 명시한다."}, {"id": 34, "sec": "10.1.5", "diff": "기초", "q": "gensim이 제공하는 토픽 모델링 관련 클래스로 짝지은 것으로 옳은 것은?", "opts": ["TruncatedSVD, TfidfVectorizer, CountVectorizer", "pipeline, AutoTokenizer, Trainer", "LdaModel, LsiModel, CoherenceModel", "TextBlob, VADER, NLTK"], "a": 2, "exp": "gensim은 LdaModel(LDA), LsiModel(LSI), 그리고 정확도 측정을 위한 CoherenceModel을 제공한다."}, {"id": 35, "sec": "10.1.5", "diff": "심화", "q": "한국어 토픽 모델링 시 유의 사항으로 옳지 않은 것은?", "opts": ["KoNLPy 같은 형태소 분석기로 명사를 추출하는 전처리가 필요하다", "'학교가', '학교를', '학교에'는 모두 '학교'로 정규화해야 한다", "한국어는 고립어이므로 공백 단위 분리만으로도 정규화가 충분하다", "'것', '수', '등', '때' 같은 의존명사는 제거하는 것이 좋다"], "a": 2, "exp": "한국어는 교착어이므로 공백 단위 분리만으로는 같은 단어가 여러 형태로 흩어지며, 형태소 분석기를 통한 정규화가 필요하다."}, {"id": 36, "sec": "10.2.1", "diff": "기초", "q": "감성 분석에 대한 강의자료의 정의로 가장 알맞은 것은?", "opts": ["문장의 품사를 자동으로 태깅하는 기법", "지문을 읽고 질문에 답하는 과제", "작성된 콘텐츠나 처리한 오디오에 있는 감성을 찾아내기 위해 컴퓨터를 학습시키는 NLP 분야", "문서 집합에서 잠재적인 토픽을 발견하는 비지도 학습 분야"], "a": 2, "exp": "감성 분석은 작성된 콘텐츠나 처리한 오디오에 담긴 감성을 찾아내도록 컴퓨터를 학습시키는 NLP 분야로 정의된다."}, {"id": 37, "sec": "10.2.1", "diff": "중급", "q": "강의자료가 자동화된 감성 분석이 필요하다고 든 근거는?", "opts": ["사람이 수천 건의 책이나 영화 리뷰를 읽는 것은 비현실적이기 때문", "감성은 문법 규칙으로 완벽하게 판별할 수 있기 때문", "감성 분석에는 연산 자원이 거의 들지 않기 때문", "리뷰 데이터에는 레이블이 필요 없기 때문"], "a": 0, "exp": "강의자료는 사람이 수천 건의 리뷰를 읽는 것이 비현실적이므로 바로 그 지점에서 자동화된 감성 분석이 필요하다고 설명한다."}, {"id": 38, "sec": "10.2.1", "diff": "중급", "q": "감성 분석의 성장을 좌우하는 주요 요인으로 강의자료가 제시하지 않은 것은?", "opts": ["감성이 인간의 의사 결정을 주도한다는 점", "기업이 사람들의 느낌을 이해하는 데 쓰는 온라인 콘텐츠의 빠른 성장", "문서-단어 행렬의 차원이 낮아졌기 때문", "NLP 기술의 발전에 따른 적용 범위 확장"], "a": 2, "exp": "성장 요인은 온라인 콘텐츠의 빠른 성장, 감성이 의사 결정을 주도한다는 점, 소셜 미디어 콘텐츠의 비즈니스 가치, NLP 기술의 발전 네 가지다."}, {"id": 39, "sec": "10.2.1", "diff": "기초", "q": "강의자료에서 말하는 '감정 수준'의 예로 알맞은 것은?", "opts": ["단어가 몇 번 등장했는지", "문장이 몇 개의 토픽으로 구성되는지", "사람이 슬픈지 행복한지, 만족스러운지 불만족스러운지, 관심이 있는지 없는지", "지문에서 정답 구간이 어디서 시작하는지"], "a": 2, "exp": "감정 수준은 대부분의 경우 사람이 슬픈지 행복한지, 만족스러운지 불만족스러운지, 관심이 있는지 없는지를 의미한다."}, {"id": 40, "sec": "10.2.1", "diff": "심화", "q": "고객의 감성을 이해하는 기업이 갖는 이점으로 강의자료가 설명한 것은?", "opts": ["경쟁사의 소스 코드를 확보할 수 있다", "제품 생산 원가를 직접 낮출 수 있다", "광고비 지출 없이 매출이 자동으로 증가한다", "구매 결정을 예측하고 구체화하는 데 큰 이점을 가진다"], "a": 3, "exp": "감성이 인간의 의사 결정을 주도하기 때문에, 고객의 감성을 이해하는 기업은 구매 결정을 예측하고 구체화하는 데 큰 이점을 가진다."}, {"id": 41, "sec": "10.2.2", "diff": "기초", "q": "강의자료가 제시한 감성의 유형에 해당하지 않는 것은?", "opts": ["감정", "능동성 혹은 수동성", "문법성", "주관성 혹은 객관성"], "a": 2, "exp": "감성의 유형으로 감정, 능동성 혹은 수동성, 어조, 주관성 혹은 객관성이 제시되었다."}, {"id": 42, "sec": "10.2.2", "diff": "중급", "q": "'능동성 혹은 수동성'을 판별하는 목적으로 강의자료가 든 것은?", "opts": ["텍스트의 문체를 자동으로 교정하기 위해", "의견이 실제 행동(구매, 이탈 등)으로 이어질 가능성을 가늠하기 위해", "문장이 사실인지 거짓인지 검증하기 위해", "문서의 토픽 개수를 결정하기 위해"], "a": 1, "exp": "능동성·수동성 판별은 화자의 태도를 통해 의견이 실제 행동으로 이어질 가능성을 가늠하기 위해 수행한다."}, {"id": 43, "sec": "10.2.2", "diff": "중급", "q": "'주관성 혹은 객관성' 판별에 대한 설명으로 옳은 것은?", "opts": ["문장이 개인의 의견 표현인지, 참·거짓으로 판단 가능한 사실에 가까운지를 파악한다", "특정 상황에서 자주 쓰이는 단어나 문구를 찾아낸다", "화자가 능동적인지 수동적인지를 판별한다", "문장의 긍정·부정 강도를 -1에서 +1 사이로 계산한다"], "a": 0, "exp": "주관성 판별은 텍스트가 주관적인지 객관적인지, 즉 개인의 의견 표현인지 참·거짓으로 판단할 수 있는 사실인지를 파악하는 것이다."}, {"id": 44, "sec": "10.2.2", "diff": "기초", "q": "TextBlob에서 사용하는 극성(polarity) 점수의 범위와 의미로 옳은 것은?", "opts": ["0에서 100 사이이며, 50이 중립", "-1에서 +1 사이이며, +1에 가까울수록 긍정, -1에 가까울수록 부정, 0은 중립", "-10에서 +10 사이이며, 0이 가장 긍정", "0에서 1 사이이며, 1에 가까울수록 부정"], "a": 1, "exp": "TextBlob의 극성은 -1에서 +1 범위를 사용하며 +1에 가까울수록 긍정, -1에 가까울수록 부정, 0은 중립을 뜻한다."}, {"id": 45, "sec": "10.2.2", "diff": "중급", "q": "분류 모델의 출력을 0과 1 사이의 확률로 표현할 때, 0.5 부근 값이 의미하는 것은?", "opts": ["객관적 사실만 담긴 문서", "확실한 긍정 문서", "판단이 애매한 문서", "확실한 부정 문서"], "a": 2, "exp": "확률 스케일에서는 1에 가까울수록 긍정, 0에 가까울수록 부정이며 0.5 부근은 판단이 애매한 문서를 의미한다."}, {"id": 46, "sec": "10.2.2", "diff": "심화", "q": "감성 분석의 주요 용어 중 '강도'에 대한 설명으로 옳은 것은?", "opts": ["강도 수준이 감성 점수에 포함되며, 양 극단에 대한 점수의 근접성을 보고 평가한다", "레이블이 긍정 1, 부정 0으로 지정되었는지를 확인하는 절차이다", "텍스트가 주관적인지 객관적인지를 판별하는 척도이다", "문서에 부여된 클래스의 개수를 의미한다"], "a": 0, "exp": "강도는 감성 점수에 포함되는 개념으로, 점수가 양 극단에 얼마나 가까운지를 보고 평가한다."}, {"id": 47, "sec": "10.2.2", "diff": "중급", "q": "감성 분석의 수준을 단순한 것에서 세밀한 것 순으로 옳게 나열한 것은?", "opts": ["속성 기반 감성 분석 → 문장 수준 → 문서 수준", "문서 수준 → 문장 수준 → 속성 기반 감성 분석", "속성 기반 감성 분석 → 문서 수준 → 문장 수준", "문장 수준 → 문서 수준 → 속성 기반 감성 분석"], "a": 1, "exp": "문서 수준은 리뷰 한 건에 하나의 레이블을 주는 가장 단순한 방식이고, 문장 수준을 거쳐 속성 기반(ABSA)이 가장 세밀하다."}, {"id": 48, "sec": "10.2.2", "diff": "중급", "q": "'배터리는 좋은데 화면이 어둡다'와 같은 문장을 대상 속성별로 나누어 감성을 판정하는 방식은?", "opts": ["빈칸 채우기(Cloze) 과제", "속성 기반 감성 분석(ABSA)", "문서 수준 감성 분석", "토픽 모델링"], "a": 1, "exp": "ABSA는 대상 속성별로 감성을 분리해 판정하므로 제품 개선 지점을 구체적으로 찾을 수 있어 실무 활용도가 높다."}, {"id": 49, "sec": "10.2.3", "diff": "기초", "q": "'금융 시장 감성'에 대한 강의자료의 정의로 옳은 것은?", "opts": ["거래량과 거래 대금의 비율", "주식의 이론적 내재 가치", "기업의 재무제표에 기록된 손익", "증권에 대한 투자자들의 전반적인 관점"], "a": 3, "exp": "금융 시장 감성은 증권에 대한 투자자들의 전반적인 관점이며, 뉴스나 소셜 미디어 기사에서 찾아낼 수 있다."}, {"id": 50, "sec": "10.2.3", "diff": "중급", "q": "제품 만족도 분석의 예로 강의자료가 언급한 기업과 그 활용 방식은?", "opts": ["네이버가 뉴스 기사로 기계 독해 모델을 학습", "트위터가 이모티콘으로 형태소 사전을 구축", "구글이 검색 로그를 이용해 토픽 모델을 학습", "아마존이 광범위한 제품 리뷰 데이터를 제품 개선과 감성 분석 서비스의 학습 데이터로 사용"], "a": 3, "exp": "강의자료는 아마존이 광범위한 제품 리뷰 데이터를 제품·서비스 개선과 감성 분석 서비스의 학습 데이터로 사용한다고 설명한다."}, {"id": 51, "sec": "10.2.3", "diff": "심화", "q": "제품 만족도 영역에서 감성 분석이 활용되는 방식으로 강의자료가 든 것은?", "opts": ["리뷰를 다른 언어로 번역함", "별점과 리뷰 텍스트의 불일치를 찾아내 신뢰할 수 없는 리뷰를 걸러냄", "제품 가격을 자동으로 재조정함", "리뷰 작성자의 실명을 자동으로 식별함"], "a": 1, "exp": "별점과 리뷰 텍스트의 불일치를 찾아내 신뢰할 수 없는 리뷰를 걸러내는 데도 감성 분석이 활용된다고 설명한다."}, {"id": 52, "sec": "10.2.3", "diff": "중급", "q": "소셜 미디어 감성이 감성 분석의 핵심 영역인 이유로 옳지 않은 것은?", "opts": ["기업과 단체가 소셜 미디어의 언급을 처리하고 이해할 필요성이 커졌기 때문", "소셜 미디어 텍스트는 정제되어 있어 전처리가 거의 필요 없기 때문", "거대하고 점점 증가하는 인간 언어 데이터 소스가 있기 때문", "전 세계 대부분의 사람들이 매일 상호작용하는 주요 커뮤니케이션 매체이기 때문"], "a": 1, "exp": "소셜 미디어에는 이모티콘·신조어 등 정제되지 않은 표현이 많아 오히려 감성 분석을 어렵게 만든다."}, {"id": 53, "sec": "10.2.3", "diff": "중급", "q": "브랜드 모니터링에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["기업은 부정적인 소셜 미디어 대화로 브랜드 위험에 노출되지만, 긍정적 상호작용으로 브랜드가 성장할 가능성도 있다", "브랜드 모니터링은 금융 시장 감성과 동일한 개념이다", "소셜 미디어의 확산으로 브랜드 위험은 사실상 사라졌다", "브랜드 가치는 사람의 개입 없이 자동으로 유지된다"], "a": 0, "exp": "소셜 미디어 성장으로 부정적 대화에 따른 브랜드 위험이 생겼지만 긍정적 상호작용으로 성장할 가능성도 있어, 기업들은 사람을 배치해 의견을 모니터링한다."}, {"id": 54, "sec": "10.2.3", "diff": "중급", "q": "'고객 상호작용' 응용 분야에서 감성 분석이 처리하는 데이터로 강의자료가 든 것은?", "opts": ["기업의 회계 장부와 세금 신고서", "온라인 채팅이나 전화 통화에서 생성되는 대량의 텍스트와 음성 데이터", "공장 설비의 센서 진동 신호", "제품의 설계 도면과 부품 목록"], "a": 1, "exp": "조직은 온라인 채팅이나 전화 통화 중 생성되는 대량의 텍스트와 음성 데이터를 감성 분석 도구로 처리해 만족도를 파악한다."}, {"id": 55, "sec": "10.2.4", "diff": "중급", "q": "주요 클라우드 제공업체의 NLP 감성 분석 서비스의 장점으로 옳지 않은 것은?", "opts": ["NLP 알고리즘이나 감성 분석에 대한 지식이 거의 필요하지 않다", "분석할 문서를 외부에 보내지 않아 프라이버시 보호가 뛰어나다", "알고리즘과 데이터의 자동적인 개선 및 업데이트 이점을 얻는다", "자체 연산 기능을 제공해 연산 요구 사항이 줄어든다"], "a": 1, "exp": "온라인 서비스는 분석할 문서를 서비스 측에 제공해야 하므로 프라이버시 보호가 부족하다는 것이 오히려 단점이다."}, {"id": 56, "sec": "10.2.4", "diff": "기초", "q": "강의자료가 감성 분석에 사용할 수 있는 파이썬 NLP 라이브러리로 든 예시가 아닌 것은?", "opts": ["pyLDAvis", "spaCy", "TextBlob", "NLTK"], "a": 0, "exp": "파이썬 NLP 라이브러리 예시로 NLTK, spaCy, 젠심(gensim), TextBlob이 제시되었다. pyLDAvis는 토픽 모델링 결과 시각화 도구다."}, {"id": 57, "sec": "10.2.4", "diff": "중급", "q": "전용 파이썬 NLP 라이브러리의 단점으로 강의자료가 지적한 것은?", "opts": ["설치와 사용에 반드시 클라우드 계정이 필요하다", "최신 연구를 전혀 반영하지 못한다", "복잡한 비즈니스 사용 사례에는 충분히 유연하지 않고, 프로젝트가 원하는 형태로 결과를 반환하지 않을 수 있다", "데이터셋을 전혀 제공하지 않는다"], "a": 2, "exp": "전용 NLP 라이브러리는 최신 연구와 잘 선택된 데이터셋이라는 장점이 있지만, 복잡한 비즈니스 사례에는 유연성이 부족하고 원하는 형태의 결과를 반환하지 않을 수 있다."}, {"id": 58, "sec": "10.2.4", "diff": "중급", "q": "딥러닝 라이브러리를 감성 분석에 사용할 때의 장점으로 강의자료가 강조한 것은?", "opts": ["결과가 항상 -1에서 +1 사이의 극성 값으로 나온다", "머신러닝 지식 없이도 바로 사용할 수 있다", "연산 자원과 데이터가 거의 필요 없다", "방대한 텍스트로 학습된 모델을 프로젝트 요구에 맞춰 미세 조정하는 전이 학습을 활용할 수 있다"], "a": 3, "exp": "딥러닝 라이브러리는 유연한 모델 개발이 가능하고, 방대한 텍스트로 학습된 모델을 미세 조정하는 전이 학습을 활용할 수 있다는 장점이 있다."}, {"id": 59, "sec": "10.2.4", "diff": "심화", "q": "다음 코드의 실행 결과로 강의자료에 제시된 값은?\nsentence = \"But you are late again!\"\nblob = TextBlob(sentence)\nblob.sentiment", "opts": ["Sentiment(polarity=0.0, subjectivity=1.0)", "Sentiment(polarity=-0.58, subjectivity=0.6)", "Sentiment(polarity=-0.6, subjectivity=0.58)", "Sentiment(polarity=0.58, subjectivity=0.6)"], "a": 1, "exp": "강의자료의 실행 결과는 Sentiment(polarity=-0.58, subjectivity=0.6)으로, 부정적 극성과 함께 주관성 점수를 확인할 수 있다."}, {"id": 60, "sec": "10.2.4", "diff": "기초", "q": "TextBlob 객체에서 감성 점수를 확인할 때 사용하는 속성은?", "opts": ["sentiment", "polarity_score()", "value_counts", "coherence"], "a": 0, "exp": "TextBlob 클래스의 sentiment 속성을 사용하면 polarity와 subjectivity 점수를 확인할 수 있다."}, {"id": 61, "sec": "10.2.4", "diff": "중급", "q": "VADER에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["소셜 미디어 텍스트에 특화된 규칙 기반 도구로, 이모티콘과 강조 표현을 함께 고려한다", "대규모 말뭉치로 사전학습된 트랜스포머 모델이다", "토픽 개수 K를 자동으로 결정하는 알고리즘이다", "문서-단어 행렬을 만드는 벡터라이저이다"], "a": 0, "exp": "VADER는 소셜 미디어 텍스트에 특화된 규칙 기반 도구로 이모티콘과 강조 표현을 함께 고려한다."}, {"id": 62, "sec": "10.2.5", "diff": "중급", "q": "강의자료가 사용한 감성 분석 데이터셋의 규모로 옳은 것은?", "opts": ["세 데이터셋 모두 각각 1,000문장", "Amazon·Yelp 각 748문장, IMDb 1,000문장", "Amazon 10만 문장, Yelp 5만 문장, IMDb 1,000문장", "Amazon·Yelp 각 1,000문장, IMDb 748문장"], "a": 3, "exp": "강의자료는 Amazon과 Yelp 각 1,000문장, IMDb 748문장으로 구성된 리뷰 데이터셋을 사용한다고 명시한다."}, {"id": 63, "sec": "10.2.5", "diff": "기초", "q": "강의자료의 감성 분석 데이터셋에서 레이블이 부여되는 방식으로 옳은 것은?", "opts": ["긍정적인 리뷰는 0, 부정적인 리뷰는 1", "긍정적인 리뷰는 1, 부정적인 리뷰는 0", "0에서 100 사이의 연속 점수", "긍정 +1, 중립 0, 부정 -1의 세 값"], "a": 1, "exp": "지도 학습 데이터셋에서 부정적인 리뷰는 감성 점수 0, 긍정적인 리뷰는 1을 갖는다."}, {"id": 64, "sec": "10.2.5", "diff": "기초", "q": "한국어 감성 분석 데이터셋으로 강의자료가 소개한 것은?", "opts": ["MS MARCO", "KorQuAD 1.0", "NSMC (네이버 영화 리뷰)", "SQuAD 2.0"], "a": 2, "exp": "한국어 감성 분석 데이터셋으로 NSMC(네이버 영화 리뷰)가 소개되었고, KorQuAD와 SQuAD는 기계 독해 데이터셋이다."}, {"id": 65, "sec": "10.2.5", "diff": "심화", "q": "imdb_reviews.Sentiment.value_counts()를 사용할 때 강의자료가 덧붙인 주의 사항은?", "opts": ["결측치를 자동으로 0으로 채우므로 사전에 제거해야 한다", "레이블 값을 문자열로 변환하므로 다시 정수로 캐스팅해야 한다", "빈도 내림차순으로 정렬되므로 인덱스 이름을 붙일 때 순서에 주의해야 한다", "전체 행 수가 아니라 열 수를 반환하므로 전치가 필요하다"], "a": 2, "exp": "value_counts()는 빈도 내림차순으로 정렬되므로, 결과에 인덱스 이름을 붙일 때 레이블 순서를 잘못 짝짓지 않도록 주의해야 한다."}, {"id": 66, "sec": "10.2.5", "diff": "중급", "q": "감성 분석 모델을 개발하는 과정의 순서로 옳은 것은?", "opts": ["피처 추출 → 학습/테스트 분할 → 모델 학습 → 텍스트 전처리 → 새 문서 감성 예측", "학습/테스트 분할 → 텍스트 전처리 → 피처 추출 → 모델 학습 → 새 문서 감성 예측", "텍스트 전처리 → 모델 학습 → 학습/테스트 분할 → 피처 추출 → 새 문서 감성 예측", "모델 학습 → 피처 추출 → 텍스트 전처리 → 학습/테스트 분할 → 새 문서 감성 예측"], "a": 1, "exp": "강의자료는 데이터셋 분할, 전처리, 수치형 벡터로의 피처 추출, 모델 학습, 미지 문서 예측의 5단계 순서를 제시한다."}, {"id": 67, "sec": "10.2.5", "diff": "중급", "q": "감성 분석에서 N-gram을 사용하는 이유와 ngram_range=(1, 2) 설정의 의미로 옳은 것은?", "opts": ["'not good'처럼 두 단어가 붙어야 의미가 살아나는 경우를 포착하며, 단어 하나와 두 단어 묶음을 함께 사용한다", "단어 임베딩의 차원을 1에서 2로 축소한다", "1등급과 2등급 감성만 분류하며, 중립은 제외한다", "문서 길이를 1~2문장으로 제한하며, 긴 리뷰를 잘라낸다"], "a": 0, "exp": "N-gram은 'not good'처럼 두 단어가 붙어야 의미가 사는 경우를 포착하기 위해 쓰며, ngram_range=(1, 2)는 유니그램과 바이그램을 함께 사용한다는 뜻이다."}, {"id": 68, "sec": "10.2.5", "diff": "기초", "q": "감성 모델 평가에서 정밀도(Precision)의 정의로 옳은 것은?", "opts": ["TP / (TP + FN), 실제 긍정 중 찾아낸 비율", "2 × (정밀도 × 재현율) / (정밀도 + 재현율)", "TP / (TP + FP), 긍정이라 예측한 것 중 실제 긍정의 비율", "(TP + TN) / 전체"], "a": 2, "exp": "정밀도는 TP / (TP + FP)로, 긍정이라 예측한 것 중 실제로 긍정인 비율이다. TP/(TP+FN)은 재현율이다."}, {"id": 69, "sec": "10.2.5", "diff": "중급", "q": "F1 점수의 계산식으로 옳은 것은?", "opts": ["정밀도 × 재현율", "2 × (정밀도 × 재현율) / (정밀도 + 재현율)", "(정밀도 + 재현율) / 2", "(TP + TN) / (TP + TN + FP + FN)"], "a": 1, "exp": "F1 점수는 정밀도와 재현율의 조화 평균인 2 × (정밀도 × 재현율) / (정밀도 + 재현율)이다."}, {"id": 70, "sec": "10.2.5", "diff": "심화", "q": "클래스가 불균형한 감성 데이터에서 평가 지표를 볼 때의 주의점은?", "opts": ["정확도만 보면 잘못된 판단을 할 수 있으므로 F1 점수를 함께 확인해야 한다", "재현율은 불균형 상황에서 계산할 수 없다", "혼동 행렬은 불균형 데이터에 사용할 수 없다", "F1 점수는 불균형에 취약하므로 정확도만 봐야 한다"], "a": 0, "exp": "클래스가 불균형하면 정확도만으로 잘못된 판단을 할 수 있으므로 F1 점수를 함께 확인해야 한다고 강조한다."}, {"id": 71, "sec": "10.2.5", "diff": "중급", "q": "'예측 가능한'이라는 표현이 영화 리뷰에서는 부정, 자동차 리뷰에서는 긍정으로 해석되는 현상은 감성 분석의 어떤 어려움에 해당하는가?", "opts": ["반어와 풍자", "도메인 의존성", "부정 표현", "비교 표현"], "a": 1, "exp": "같은 단어가 도메인에 따라 다른 감성을 갖는 현상이 도메인 의존성이며, 강의자료가 '예측 가능한'을 예로 든다."}, {"id": 72, "sec": "10.2.5", "diff": "심화", "q": "'정말 훌륭한 서비스네요, 두 시간 기다렸습니다'라는 문장이 감성 분석을 어렵게 만드는 이유는?", "opts": ["반어와 풍자로 표면적 표현과 실제 감성이 반대이기 때문", "이모티콘과 초성체가 섞여 있기 때문", "부정어가 감성어 앞에 붙어 극성이 뒤집히기 때문", "비교 대상이 둘이라 어느 쪽 평가인지 모호하기 때문"], "a": 0, "exp": "이 문장은 반어와 풍자의 예로, 표면상 긍정 표현이지만 실제로는 부정적인 감성을 담고 있어 판별이 어렵다."}, {"id": 73, "sec": "10.3.1", "diff": "기초", "q": "기계 독해(Machine Reading Comprehension)의 정의로 알맞은 것은?", "opts": ["주어진 지문을 읽고 그에 대한 질문에 답하는 과제", "문장을 다른 언어로 번역하는 과제", "문서 집합에서 잠재 토픽을 발견하는 과제", "텍스트의 긍정·부정 극성을 판별하는 과제"], "a": 0, "exp": "기계 독해는 주어진 지문(context)을 읽고 그에 대한 질문(question)에 답하는 과제다."}, {"id": 74, "sec": "10.3.1", "diff": "중급", "q": "세 과제를 다루는 질문으로 옳게 짝지은 것은?", "opts": ["토픽 모델링은 '어떤 태도인가', 감성 분석은 '무엇이라고 말하고 있는가', 기계 독해는 '무엇에 관한 글인가'", "토픽 모델링은 '무엇에 관한 글인가', 감성 분석은 '어떤 태도인가', 기계 독해는 '무엇이라고 말하고 있는가'", "토픽 모델링은 '무엇이라고 말하고 있는가', 감성 분석은 '무엇에 관한 글인가', 기계 독해는 '어떤 태도인가'", "세 과제 모두 '무엇에 관한 글인가'를 다룬다"], "a": 1, "exp": "강의자료는 토픽 모델링이 '무엇에 관한 글인가', 감성 분석이 '어떤 태도인가', 기계 독해가 '무엇이라고 말하고 있는가'를 다룬다고 대비한다."}, {"id": 75, "sec": "10.3.1", "diff": "중급", "q": "기계 독해가 기존 검색과 다른 점으로 강의자료가 설명한 것은?", "opts": ["기존 검색은 답을 제시하지만, 기계 독해는 문서 목록만 반환한다", "기존 검색은 지문이 필요하지만, 기계 독해는 지문 없이 동작한다", "기존 검색은 지도 학습이지만, 기계 독해는 비지도 학습이다", "기존 검색은 관련 문서 목록을 반환하지만, 기계 독해는 문서에서 답이 되는 부분을 직접 찾아 제시한다"], "a": 3, "exp": "사용자는 문서가 아니라 답을 원하므로, 기계 독해는 문서에서 답이 되는 부분을 직접 찾아 제시한다."}, {"id": 76, "sec": "10.3.1", "diff": "기초", "q": "지문의 특정 단어를 가리고 그것이 무엇인지 맞히는 기계 독해 과제 유형과 대표 데이터셋을 옳게 짝지은 것은?", "opts": ["객관식(Multiple Choice) - RACE, MCTest", "추상형(Abstractive) - MS MARCO, NarrativeQA", "빈칸 채우기(Cloze Style) - CNN/Daily Mail, CBT", "추출형(Extractive) - SQuAD, KorQuAD"], "a": 2, "exp": "빈칸 채우기는 지문의 단어를 가리고 맞히는 유형으로 CNN/Daily Mail, CBT가 대표 데이터셋이다."}, {"id": 77, "sec": "10.3.1", "diff": "중급", "q": "추출형(Extractive / Span Prediction) 기계 독해의 가정으로 옳은 것은?", "opts": ["정답이 지문 안에 연속된 구간(span)으로 존재한다고 가정하고 시작과 끝 위치를 예측한다", "정답이 여러 보기 중 하나라고 가정한다", "정답이 가려진 단어 하나라고 가정한다", "정답이 지문에 없는 표현으로 생성된다고 가정한다"], "a": 0, "exp": "추출형은 정답이 지문 안에 연속된 span으로 존재한다고 가정하고 그 시작과 끝 위치를 예측하며, 본 강의의 실습도 이 유형을 다룬다."}, {"id": 78, "sec": "10.3.1", "diff": "심화", "q": "추상형(Abstractive / Generative) 기계 독해의 특징으로 옳은 것은?", "opts": ["정답 구간의 시작과 끝 위치만 예측하므로 환각이 발생하지 않는다", "반드시 보기가 주어져야 하며 평가가 간단하다", "자동으로 대량 생성이 가능해 학습 데이터 확보가 쉽다", "지문에 없는 표현으로 답을 생성해 자연스럽지만, 사실과 다른 내용을 만드는 환각 문제가 있다"], "a": 3, "exp": "추상형은 지문에 없는 표현으로 답을 생성해 자연스러운 답변이 가능하지만 사실과 다른 내용을 만드는 환각 문제가 발생할 수 있다."}, {"id": 79, "sec": "10.3.1", "diff": "중급", "q": "SQuAD 1.1과 SQuAD 2.0의 차이로 옳은 것은?", "opts": ["SQuAD 1.1은 한국어, SQuAD 2.0은 영어 데이터셋이다", "SQuAD 2.0은 질문 수를 10만 개에서 5만 개로 줄인 축소판이다", "SQuAD 2.0은 답할 수 없는 질문 약 5만 개를 추가해 '답이 없다'고 판단하는 능력까지 평가한다", "SQuAD 2.0은 객관식 보기를 추가한 데이터셋이다"], "a": 2, "exp": "SQuAD 1.1은 약 10만 개 질문-답변 쌍으로 모든 질문에 답이 지문 안에 있고, 2.0은 답할 수 없는 질문 약 5만 개를 추가했다."}, {"id": 80, "sec": "10.3.1", "diff": "기초", "q": "SQuAD 1.1에 대한 설명으로 옳은 것은?", "opts": ["한국어 위키피디아 기반으로 표와 목록을 포함한다", "위키피디아 문단 기반으로 약 10만 개의 질문-답변 쌍으로 구성되며 모든 질문의 답이 지문 안에 존재한다", "뉴스 기사 기반으로 약 5만 개의 빈칸 채우기 문제로 구성된다", "보기 4개 중 정답을 고르는 객관식 데이터셋이다"], "a": 1, "exp": "SQuAD 1.1은 위키피디아 문단 기반의 약 10만 개 질문-답변 쌍으로, 모든 질문에 대해 답이 지문 안에 반드시 존재한다."}, {"id": 81, "sec": "10.3.1", "diff": "중급", "q": "KorQuAD에 대한 설명으로 옳은 것은?", "opts": ["영어 위키피디아를 한국어로 번역한 데이터셋이다", "객관식 보기를 포함한 한국어 독해 시험 데이터셋이다", "한국어 위키피디아 기반이며 SQuAD와 동일한 형식을 따르고, 2.0은 표와 목록이 포함된 긴 문서 전체를 대상으로 한다", "한국어 영화 리뷰의 감성 레이블을 담은 데이터셋이다"], "a": 2, "exp": "KorQuAD 1.0/2.0은 한국어 위키피디아 기반이며 SQuAD와 동일한 형식을 따르고, 2.0은 표와 목록이 포함된 긴 문서 전체를 대상으로 한다."}, {"id": 82, "sec": "10.3.1", "diff": "심화", "q": "강의자료의 SQuAD 예시에서 context = \"세종대왕은 1443년에 훈민정음을 창제하였다.\"일 때 answers의 값으로 제시된 것은?", "opts": ["{'text': '세종대왕', 'answer_start': 1443}", "{'text': '훈민정음', 'answer_start': 6}", "{'text': '1443년', 'answer_start': 6}", "{'text': '1443년', 'answer_start': 0}"], "a": 2, "exp": "예시에서 정답은 {'text': '1443년', 'answer_start': 6}으로, answer_start는 지문 내 정답의 시작 문자 위치를 뜻한다."}, {"id": 83, "sec": "10.3.2", "diff": "기초", "q": "신경망 기반 기계 독해 모델(2016~2018)에 대한 평가로 강의자료가 언급한 것은?", "opts": ["이미 사람의 성능을 넘어섰다", "지문 없이도 답을 생성할 수 있었다", "규칙 기반보다 성능이 낮아 폐기되었다", "사람 수준에는 미치지 못했으나 종단간(end-to-end) 학습의 가능성을 보여 주었다"], "a": 3, "exp": "BiDAF, DrQA 등은 사람 수준에는 미치지 못했으나 종단간 학습의 가능성을 보여 주었다고 평가된다."}, {"id": 84, "sec": "10.3.2", "diff": "심화", "q": "강의자료가 제시한 SQuAD 1.1에서의 BERT 성능 수치로 옳은 것은?", "opts": ["단일 모델이 F1 93.2, 앙상블이 F1 91.2를 기록함", "단일 모델이 EM 91.2, 앙상블이 EM 93.2를 기록해 사람과 같아짐", "단일 모델이 사람의 성능(F1 91.2)에 필적하고, 앙상블 모델은 F1 93.2로 사람을 넘어섬", "단일 모델이 F1 71.2로 사람의 91.2에 크게 못 미침"], "a": 2, "exp": "BERT는 SQuAD 1.1에서 단일 모델이 사람 성능 F1 91.2에 필적했고, 앙상블 모델은 F1 93.2로 사람을 넘어섰다."}, {"id": 85, "sec": "10.3.2", "diff": "중급", "q": "BERT 기반 기계 독해의 핵심 아이디어로 옳은 것은?", "opts": ["질문과 지문을 서로 다른 모델로 인코딩한 뒤 결과를 평균한다", "언어 일반 지식은 사전학습에서 얻고 과제별 지식만 소량 데이터로 학습하며, 출력층에 시작·끝 위치를 예측하는 선형 계층 두 개만 추가한다", "사전학습 없이 기계 독해 데이터만으로 처음부터 학습한다", "출력층에 LSTM 인코더 두 개를 새로 붙여 학습한다"], "a": 1, "exp": "BERT는 대규모 말뭉치로 사전학습한 후 기계 독해 데이터로 미세 조정하며, 출력층으로 시작·끝 위치를 예측하는 선형 계층 두 개만 추가하면 된다."}, {"id": 86, "sec": "10.3.2", "diff": "중급", "q": "BERT 기반 질의응답의 입력 구성으로 옳은 것은?", "opts": ["지문만 입력하고 질문은 출력층에서 사용한다", "[CLS] 지문 토큰들 [MASK] 질문 토큰들 형태로 만들고, 위치 임베딩만 사용한다", "[CLS] 질문 토큰들 [SEP] 지문 토큰들 [SEP] 형태로 하나의 시퀀스를 만들고, 세그먼트 임베딩으로 두 부분을 구분한다", "질문과 지문을 각각 별도의 시퀀스로 입력해 두 번 인코딩한다"], "a": 2, "exp": "입력은 [CLS] 질문 [SEP] 지문 [SEP] 형태의 단일 시퀀스이며, 세그먼트 임베딩으로 질문 부분과 지문 부분을 구분한다."}, {"id": 87, "sec": "10.3.2", "diff": "심화", "q": "BERT 질의응답의 출력 계산에 대한 설명으로 옳은 것은?", "opts": ["시작과 끝을 같은 벡터 S로 계산해 하나의 로짓만 사용한다", "각 토큰 i의 최종 은닉 벡터 hᵢ에 대해 시작 로짓 sᵢ = S·hᵢ, 끝 로짓 eᵢ = E·hᵢ를 구하고 소프트맥스를 적용한다", "각 토큰의 은닉 벡터를 평균해 하나의 문서 벡터로 만든 뒤 분류한다", "[CLS] 토큰의 벡터 하나만으로 정답 문자열을 직접 생성한다"], "a": 1, "exp": "시작 로짓 sᵢ = S·hᵢ, 끝 로짓 eᵢ = E·hᵢ (S, E는 학습되는 벡터)를 구한 뒤 소프트맥스로 각 토큰이 정답의 시작/끝일 확률을 얻는다."}, {"id": 88, "sec": "10.3.2", "diff": "중급", "q": "BERT 질의응답의 예측과 학습 방식으로 옳은 것은?", "opts": ["항상 첫 번째 토큰을 시작, 마지막 토큰을 끝으로 고정한다", "i ≥ j 조건에서 (i, j)를 선택하며, 시작 위치 손실만 사용한다", "sᵢ × eⱼ를 최소로 만드는 (i, j)를 선택하며, 평균 제곱 오차로 학습한다", "sᵢ + eⱼ를 최대로 만드는 (i, j)를 i ≤ j 조건에서 선택하며, 학습은 시작·끝 위치의 교차 엔트로피 손실 평균을 최소화한다"], "a": 3, "exp": "예측은 i ≤ j 조건에서 sᵢ + eⱼ를 최대화하는 쌍을 고르고, 학습은 정답 시작·끝 위치에 대한 교차 엔트로피 손실의 평균을 최소화한다."}, {"id": 89, "sec": "10.3.2", "diff": "심화", "q": "BERT의 최대 입력 길이(보통 512 토큰)를 넘는 긴 문서를 처리하는 방법은?", "opts": ["입력 길이 제한을 늘리기 위해 세그먼트 임베딩을 제거한다", "문서의 앞 512 토큰만 사용하고 나머지는 버린다", "겹치는 구간(stride)을 두고 잘라 여러 번 처리한 뒤 가장 점수가 높은 답을 선택한다", "문서를 요약해 512 토큰 이내로 줄인 뒤 한 번만 처리한다"], "a": 2, "exp": "긴 문서는 겹치는 구간(stride)을 두고 잘라 여러 번 처리한 뒤 가장 점수가 높은 답을 선택한다."}, {"id": 90, "sec": "10.3.3", "diff": "기초", "q": "EM(Exact Match) 지표에 대한 설명으로 옳은 것은?", "opts": ["부분적으로 맞은 답에도 점수를 주는 관대한 지표이다", "예측한 답이 정답 문자열과 완전히 일치하는 비율이며, 대소문자·관사·구두점을 제거하는 정규화 후 비교한다", "예측과 정답의 토큰 겹침 정도를 측정하는 지표이다", "정답 시작 위치의 오차를 문자 단위로 측정한 값이다"], "a": 1, "exp": "EM은 예측이 정답 문자열과 완전히 일치하는 비율이며, 대소문자·관사·구두점을 제거하는 정규화를 거친 후 비교한다."}, {"id": 91, "sec": "10.3.3", "diff": "심화", "q": "기계 독해 평가에서 정답이 여러 개 제공된 경우의 처리 방식과 EM·F1의 관계로 옳은 것은?", "opts": ["각 정답에 대해 계산한 값 중 최대값을 사용하며, F1은 부분 점수를 주므로 EM보다 관대하다", "각 정답에 대해 계산한 값의 평균을 사용하며, EM이 F1보다 관대하다", "정답이 여러 개면 해당 문항을 평가에서 제외하며, F1만 계산한다", "첫 번째 정답만 사용하며, EM과 F1은 항상 같은 값을 갖는다"], "a": 0, "exp": "정답이 여러 개면 각 정답에 대해 계산한 값 중 최대값을 쓰고, F1은 부분적으로 맞은 답에도 점수를 주므로 EM보다 관대한 지표다."}, {"id": 92, "sec": "10.3.3", "diff": "중급", "q": "HuggingFace 파이프라인으로 기계 독해를 수행할 때 사용하는 코드로 강의자료에 제시된 것은?", "opts": ["qa = LdaModel(\"question-answering\", num_topics=2)", "qa = TextBlob(\"question-answering\")", "qa = pipeline(\"question-answering\", model=\"distilbert-base-cased-distilled-squad\")", "qa = pipeline(\"sentiment-analysis\", model=\"distilbert-base-cased-distilled-squad\")"], "a": 2, "exp": "강의자료는 transformers의 pipeline으로 \"question-answering\" 태스크와 distilbert-base-cased-distilled-squad 모델을 지정해 파이프라인을 생성한다."}, {"id": 93, "sec": "10.3.3", "diff": "기초", "q": "HuggingFace 질의응답 파이프라인의 실행 결과 result에서 확인할 수 있는 키가 아닌 것은?", "opts": ["result['score']", "result['answer']", "result['start']", "result['polarity']"], "a": 3, "exp": "강의자료는 result['answer'], result['score'], result['start'], result['end']를 확인한다고 설명하며, polarity는 TextBlob 감성 분석의 값이다."}, {"id": 94, "sec": "10.3.3", "diff": "중급", "q": "RAG(검색 증강 생성)에 대한 설명으로 옳은 것은?", "opts": ["정답 구간의 시작과 끝을 예측하는 선형 계층을 추가하는 방식이다", "여러 모델의 예측을 평균 내는 앙상블 , "Devlin et al. / NAACL 2019", "Blei, Ng, Jordan / JMLR 2003"], "a": 3, "exp": "참고서적에 Blei, Ng, Jordan의 Latent Dirichlet Allocation, JMLR 2003과 Devlin et al.의 BERT, NAACL 2019가 제시되어 있다."}];

const SECTIONS = {
  "10.1.1": "토픽모델링 개요",
  "10.1.2": "BoW·문서단어행렬",
  "10.1.3": "LSA",
  "10.1.4": "LDA",
  "10.1.5": "토픽 평가·구현",
  "10.2.1": "감성분석 개요",
  "10.2.2": "감성 유형·용어",
  "10.2.3": "감성 응용분야",
  "10.2.4": "감성 분석 도구",
  "10.2.5": "데이터·학습·평가",
  "10.3.1": "기계독해 개요",
  "10.3.2": "BERT 질의응답",
  "10.3.3": "MRC 평가·동향",
  "10.4": "요약·실습"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week10_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
