<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4주차 텍스트 전처리·어휘·구문·의미 분석 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 4 · 자연어처리</div>
    <h1>4주차 &middot; 텍스트의 전처리, 어휘, 구문 그리고 의미 분석 — 100문제</h1>
    <p class="sub">강의자료 4.1~4.4절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    4주차 강의자료(텍스트의 전처리, 어휘, 구문 그리고 의미 분석) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "4.0", "diff": "기초", "q": "강의자료가 제시한 자연어처리 분석 계층의 STEP 1~4 순서로 옳은 것은?", "opts": ["전처리 → 구문 분석 → 어휘 분석 → 의미 분석", "어휘 분석 → 전처리 → 구문 분석 → 의미 분석", "의미 분석 → 구문 분석 → 어휘 분석 → 전처리", "전처리 → 어휘 분석 → 구문 분석 → 의미 분석"], "a": 3, "exp": "문서를 깨끗한 문자열로 만드는 전처리, 형태소·품사를 얻는 어휘 분석, 문법 구조를 얻는 구문 분석, 의미 표현을 얻는 의미 분석 순서의 파이프라인이다."}, {"id": 2, "sec": "4.0", "diff": "기초", "q": "자연어처리 계층 구조에서 말하는 오류 전파(error propagation)에 대한 설명으로 가장 적절한 것은?", "opts": ["각 계층이 독립적으로 동작하므로 한 계층의 오류는 다른 계층에 영향을 주지 않는다", "하위 계층의 출력이 상위 계층의 입력이 되므로 낮은 계층의 오류가 상위 계층으로 그대로 누적된다", "오류가 여러 계층에 분산되어 전체적으로는 상쇄되는 현상이다", "상위 계층에서 발생한 오류가 하위 계층의 입력을 다시 오염시키는 현상이다"], "a": 1, "exp": "띄어쓰기가 틀리면 형태소 분석이 실패하고, 품사 태깅이 틀리며, 구문 트리가 어긋나 의미 해석까지 오류가 누적된다."}, {"id": 3, "sec": "4.0", "diff": "기초", "q": "'Garbage In, Garbage Out'이라는 원칙이 전처리와 관련하여 뜻하는 바는?", "opts": ["불필요한 데이터를 많이 넣을수록 일반화 성능이 좋아진다", "입력 데이터의 품질이 모델 성능의 상한선을 결정한다", "출력이 나쁘면 학습률을 조정해 해결해야 한다", "모델의 크기가 클수록 낮은 품질의 데이터도 극복할 수 있다"], "a": 1, "exp": "전처리는 데이터 측면의 성능 개선 작업이며, 입력 품질이 모델이 도달할 수 있는 성능의 상한을 정한다."}, {"id": 4, "sec": "4.0", "diff": "중급", "q": "Chapter 4의 네 개 절 모두에서 반복해서 등장한다고 밝힌 접근법의 발전 흐름은?", "opts": ["사전 기반 → 규칙 기반 → 탐색 기반", "딥러닝 기반 → 통계 기반 → 규칙 기반", "통계 기반 → 규칙 기반 → 딥러닝 기반", "규칙 기반 → 통계·확률 기반 → 딥러닝 기반"], "a": 3, "exp": "전처리·어휘 분석·구문 분석·의미 분석 네 절 모두 규칙 기반에서 통계 기반을 거쳐 딥러닝 기반으로 발전해 온 흐름을 공유한다."}, {"id": 5, "sec": "4.1.1", "diff": "기초", "q": "다음 중 비정형 데이터(Unstructured Data)의 예로 가장 적절한 것은?", "opts": ["SNS 게시글", "고객 ID 목록", "스프레드시트에 저장된 구매 금액 열", "관계형 데이터베이스의 센서 측정값 레코드"], "a": 0, "exp": "뉴스 기사, 이메일, 메신저, SNS 게시글, 음성, 동영상, 로그가 비정형 데이터의 대표적인 예이다. 나머지는 행과 열로 정의되는 정형 데이터이다."}, {"id": 6, "sec": "4.1.1", "diff": "중급", "q": "정형 데이터에 대한 설명으로 옳지 않은 것은?", "opts": ["변칙(anomaly)과 모호함(ambiguity)이 상존하여 사용 전 반드시 정형화가 필요하다", "관계형 데이터베이스나 스프레드시트에 저장되어 정렬·집계·조인이 즉시 가능하다", "행과 열로 정의되며 각 칸의 의미가 명확하다", "일정한 규격과 스키마를 가진다"], "a": 0, "exp": "변칙과 모호함이 상존하고 정형화 과정이 필요한 쪽은 비정형 데이터이다."}, {"id": 7, "sec": "4.1.1", "diff": "기초", "q": "강의자료가 분류한 원시 텍스트(raw text)의 오류 유형 네 가지를 바르게 묶은 것은?", "opts": ["구조적 노이즈 / 의미적 오류 / 화용적 오류 / 통사적 오류", "표기 불일치 / 중복 오류 / 결측 오류 / 이상치 오류", "인코딩 오류 / 어휘 오류 / 문법 오류 / 논리 오류", "구조적 노이즈 / 인코딩 오류 / 표기 불일치 / 언어적 오류"], "a": 3, "exp": "HTML 태그 등 구조적 노이즈, 인코딩 혼용, 대소문자·전각/반각 등 표기 불일치, 띄어쓰기·맞춤법 등 언어적 오류의 네 가지로 분류한다."}, {"id": 8, "sec": "4.1.1", "diff": "중급", "q": "'ì•ˆë…•í•˜ì„¸ìš”'처럼 글자가 깨져 보이는 mojibake 현상의 직접적인 원인은?", "opts": ["어절 단위 토큰화를 적용했기 때문", "불용어가 제거되지 않았기 때문", "문장 부호가 잘못 삽입되었기 때문", "EUC-KR / CP949 / UTF-8 등 인코딩의 혼용"], "a": 3, "exp": "인코딩 오류 항목으로, 서로 다른 인코딩을 혼용해 해석하면 글자가 깨진다. 한글 자모 분리(NFD) 문제도 같은 범주에 속한다."}, {"id": 9, "sec": "4.1.1", "diff": "기초", "q": "대소문자 혼용, 전각/반각 혼용, 이모지, '좋아요오오오' 같은 반복 문자는 어떤 오류 유형에 해당하는가?", "opts": ["구조적 노이즈", "표기 불일치", "인코딩 오류", "언어적 오류"], "a": 1, "exp": "같은 의미를 여러 표기로 적어 기계에게는 서로 다른 문자열이 되는 문제로, 표기 불일치에 해당한다."}, {"id": 10, "sec": "4.1.1", "diff": "기초", "q": "전처리(preprocessing)의 정의로 가장 적절한 것은?", "opts": ["분석을 위해 비정형 데이터를 정형화하는 과정", "학습 데이터를 무작위로 나누어 검증 집합을 만드는 과정", "모델의 출력을 사람이 읽기 좋게 후처리하는 과정", "학습된 모델의 하이퍼파라미터를 조정하는 과정"], "a": 0, "exp": "분석을 위해서는 비정형 데이터가 정형화되어야 하며, 이 정형화 과정을 전처리라고 한다."}, {"id": 11, "sec": "4.1.1", "diff": "중급", "q": "전처리에 대한 설명으로 옳지 않은 것은?", "opts": ["전처리만 올바르게 해도 동일한 모델에서 상당한 성능 향상을 기대할 수 있다", "여러 문서 간 표기의 일관성이 확보되어 이후 단계의 오류를 미리 방지한다", "전처리는 많이 수행할수록 항상 성능이 좋아지므로 가능한 모든 기호를 제거해야 한다", "어휘 사전의 크기가 줄어 학습이 빨라지고 미등록어(OOV) 비율이 감소한다"], "a": 2, "exp": "감성 분석에서 이모지나 느낌표를 제거하면 오히려 중요한 신호를 잃으므로, 목적에 맞는 전처리를 설계해야 한다."}, {"id": 12, "sec": "4.1.1", "diff": "기초", "q": "텍스트 전처리 파이프라인의 표준적인 처리 순서로 옳은 것은?", "opts": ["텍스트 추출 → 정제 → 정규화 → 교정 → 토큰화", "텍스트 추출 → 토큰화 → 정제 → 정규화 → 교정", "토큰화 → 정규화 → 정제 → 교정 → 텍스트 추출", "정제 → 텍스트 추출 → 교정 → 토큰화 → 정규화"], "a": 0, "exp": "HTML·PDF·DOCX에서 본문을 뽑고, 노이즈를 제거하고, 표기를 통일한 뒤, 띄어쓰기·맞춤법을 교정하고 마지막에 토큰화한다."}, {"id": 13, "sec": "4.1.1", "diff": "심화", "q": "PDF 문서에서 텍스트를 추출하기 어려운 근본적인 이유로 강의자료가 지적한 것은?", "opts": ["PDF가 항상 이미지 형식으로만 저장되기 때문", "PDF에는 문장 부호가 저장되지 않기 때문", "글자의 좌표만 저장되어 읽기 순서가 보장되지 않기 때문", "PDF는 UTF-8 인코딩을 지원하지 않기 때문"], "a": 2, "exp": "좌표만 저장되므로 2단 편집·표·머리말이 뒤섞여 추출되며, 해결책으로 pdfplumber·PyMuPDF의 레이아웃 기반 추출과 필요 시 OCR을 든다."}, {"id": 14, "sec": "4.1.1", "diff": "중급", "q": "문서 형식별 변환 방법의 연결로 옳지 않은 것은?", "opts": ["일반 텍스트/로그 — DOM 파싱 후 텍스트 노드만 추출", "HTML 문서 — BeautifulSoup 등으로 파싱하고 boilerplate removal 활용", "PDF 문서 — pdfplumber / PyMuPDF로 레이아웃 기반 추출", "일반 텍스트/로그 — chardet 등으로 인코딩을 추정한 뒤 UTF-8로 통일"], "a": 0, "exp": "DOM 파싱은 HTML에 해당하는 해결책이며, 일반 텍스트·로그는 인코딩 추정과 제어문자 제거가 핵심이다."}, {"id": 15, "sec": "4.1.2", "diff": "기초", "q": "정규표현식(Regular Expression)에 대한 설명으로 가장 적절한 것은?", "opts": ["문장의 구문 구조를 트리로 표현하는 문법 체계이다", "단어의 의미를 벡터로 표현하는 분산 표현 기법이다", "형태소의 원형을 복원하는 사전 기반 알고리즘이다", "문자열의 '패턴'을 기술하는 형식 언어로, 패턴을 찾아 제거하거나 치환하는 데 쓰인다"], "a": 3, "exp": "정규표현식은 전처리의 정제 단계에서 가장 자주 쓰이는 패턴 기술 도구이다."}, {"id": 16, "sec": "4.1.2", "diff": "중급", "q": "정제(Cleaning) 단계의 1차 → 2차 → 3차 처리 순서로 옳은 것은?", "opts": ["목표 언어 이외 문자 제거 → 연속 공백 축약 → 구조적 노이즈 제거", "불용어 제거 → 어간 추출 → 표제어 추출", "연속 공백 축약 → 구조적 노이즈 제거 → 목표 언어 이외 문자 제거", "구조적 노이즈 제거 → 목표 언어 이외 문자 제거 → 연속 공백·줄바꿈 축약"], "a": 3, "exp": "1차로 HTML 태그·URL·이메일·전화번호 등을 없애고, 2차로 타 언어 문자와 특수문자를 없앤 뒤, 3차로 연속 공백을 하나로 줄인다."}, {"id": 17, "sec": "4.1.2", "diff": "기초", "q": "정규표현식 re.sub(r'<[^>]+>', '', t) 가 수행하는 작업은?", "opts": ["HTML 태그 제거", "한글과 영문만 남기기", "연속 공백 축약", "URL 제거"], "a": 0, "exp": "꺾쇠로 둘러싸인 부분을 찾아 삭제하는 패턴으로, 강의자료에서 HTML 태그 제거용으로 제시되었다."}, {"id": 18, "sec": "4.1.2", "diff": "중급", "q": "정제 시 노이즈를 '제거'하지 않고 URL은 <URL>, 숫자는 <NUM>, 이메일은 <EMAIL>로 '치환'하는 이유는?", "opts": ["정규표현식이 삭제 연산을 지원하지 않기 때문", "치환이 제거보다 계산량이 항상 적기 때문", "정보의 존재 자체는 보존할 수 있기 때문", "치환하면 어휘 사전이 반드시 커지기 때문"], "a": 2, "exp": "치환하면 구체적인 값은 지우면서도 '여기에 URL이 있었다'는 정보는 남길 수 있다."}, {"id": 19, "sec": "4.1.2", "diff": "기초", "q": "유니코드 정규화 방식 NFKC의 역할로 옳은 것은?", "opts": ["불용어를 자동으로 제거한다", "단어를 서브워드 단위로 분할한다", "전각 문자(ＡＢＣ)를 반각(ABC)으로, 호환 문자를 표준 문자로 통일한다", "한글 완성형을 반드시 조합형으로 분해한다"], "a": 2, "exp": "NFC/NFD가 완성형과 조합형의 문제라면, NFKC는 호환 문자와 전각/반각 표기를 표준형으로 통일한다."}, {"id": 20, "sec": "4.1.2", "diff": "심화", "q": "다음 코드의 출력으로 옳은 것은?\ntext = \"한글\"; nfd = unicodedata.normalize(\"NFD\", text); nfc = unicodedata.normalize(\"NFC\", nfd)\nprint(text, len(text)); print(nfd, len(nfd)); print(nfc, len(nfc))", "opts": ["한글 2 / 한글 6 / 한글 2", "한글 2 / 한글 4 / 한글 2", "한글 2 / 한글 2 / 한글 2", "한글 6 / 한글 2 / 한글 6"], "a": 0, "exp": "NFD는 '한글'을 자모 6개로 분해하므로 길이가 6이 되고, 다시 NFC로 결합하면 원래대로 길이 2가 된다."}, {"id": 21, "sec": "4.1.2", "diff": "중급", "q": "macOS에서 만든 한글 파일명이 Windows에서 깨져 보이는 원인으로 강의자료가 든 것은?", "opts": ["반복 문자 축약이 적용되지 않았기 때문", "한글이 완성형(NFC)과 조합형(NFD)으로 모두 표현될 수 있기 때문", "파일명에 전각 문자가 포함되어 있기 때문", "파일 시스템이 대소문자를 구분하지 않기 때문"], "a": 1, "exp": "유니코드 정규화 항목의 대표 사례로, NFC와 NFD의 표현 차이 때문에 같은 이름이 다른 문자열로 취급된다."}, {"id": 22, "sec": "4.1.2", "diff": "중급", "q": "대소문자 통일(case folding)을 적용하지 않는 것이 바람직한 경우는?", "opts": ["정보 검색에서 색인어를 만드는 경우", "'Apple'과 'apple'을 같은 토큰으로 보려는 경우", "고유명사의 구분이 필요한 과제", "어휘 사전의 크기를 줄이려는 경우"], "a": 2, "exp": "대소문자를 없애면 고유명사와 일반명사의 구분이 사라지므로, 그 구분이 필요한 과제에서는 적용하지 않는다."}, {"id": 23, "sec": "4.1.2", "diff": "기초", "q": "토큰(token)에 대한 설명으로 가장 적절한 것은?", "opts": ["분석의 기본 단위이며, 무엇을 토큰으로 삼을지는 설계의 문제이다", "항상 공백으로 구분된 어절과 일치하는 단위이다", "반드시 하나의 문자로 이루어진 최소 단위이다", "문장의 구문 구조를 표시하는 비단말 기호이다"], "a": 0, "exp": "토큰은 분석의 기본 단위로, 단어·형태소·서브워드 중 무엇을 쓸지는 과제에 따라 설계한다."}, {"id": 24, "sec": "4.1.2", "diff": "중급", "q": "영어 토큰화에서 발생하는 문제와 예시의 연결로 옳지 않은 것은?", "opts": ["축약형 문제 — don't → do + n't", "교착어 문제 — '학교에서는'을 학교 + 에서 + 는으로 분리", "마침표 문제 — U.S.A.의 마침표는 문장 끝이 아님", "소유격 문제 — John's → John + 's"], "a": 1, "exp": "'학교에서는'의 분해는 한국어 토큰화의 문제이며, 영어 토큰화의 네 문제는 축약형·소유격·하이픈·마침표이다."}, {"id": 25, "sec": "4.1.2", "diff": "중급", "q": "한국어를 어절 단위로 토큰화할 때 생기는 가장 큰 문제는?", "opts": ["공백이 전혀 존재하지 않아 어절을 나눌 수 없다", "'학교에서', '학교에서는', '학교를'이 모두 다른 토큰이 되어 어휘가 폭발한다", "조사와 어미가 항상 독립된 단어로 띄어 쓰인다", "한 어절이 언제나 정확히 하나의 형태소로만 이루어진다"], "a": 1, "exp": "한국어는 교착어라 어절 하나에 여러 형태소가 결합하므로, 어절 단위 토큰화는 어휘 폭발을 낳는다. 그래서 형태소 단위 토큰화가 표준이다."}, {"id": 26, "sec": "4.1.2", "diff": "중급", "q": "불용어(Stopword) 제거에 대한 설명으로 옳지 않은 것은?", "opts": ["'the, is, at'이나 '은, 는, 이, 가'처럼 빈도는 높지만 변별력이 낮은 단어를 제거한다", "정보 검색이나 토픽 모델링에서는 효과적이다", "감성 분석에서도 'not'을 반드시 제거해야 정확도가 올라간다", "어휘 사전의 크기를 줄이는 효과가 있다"], "a": 2, "exp": "감성 분석에서 'not'을 제거하면 문장의 의미가 뒤집히므로 주의해야 한다."}, {"id": 27, "sec": "4.1.2", "diff": "중급", "q": "어간 추출(Stemming)과 표제어 추출(Lemmatization)의 비교로 옳은 것은?", "opts": ["Stemming은 규칙 기반으로 빠르지만 결과가 실제 단어가 아닐 수 있고, Lemmatization은 사전과 품사 정보를 쓰므로 느리지만 정확하다", "두 기법 모두 품사 정보를 요구하지 않는다", "Lemmatization은 항상 Stemming보다 빠르다", "Stemming은 사전을 반드시 필요로 하고 Lemmatization은 규칙만으로 동작한다"], "a": 0, "exp": "Stemming은 접사를 규칙으로 잘라내고, Lemmatization은 사전과 품사 정보로 기본형(lemma)을 찾는다. 품사를 지정하지 않으면 was → wa 같은 비단어가 나올 수 있다."}, {"id": 28, "sec": "4.1.2", "diff": "심화", "q": "Porter Stemmer의 처리 결과에 대한 설명으로 옳은 것은?", "opts": ["모든 단어가 사전에 실린 실제 단어로 변환된다", "am / are / is를 be로 바꾼다", "production / products는 product가 되지만, automates / automation은 automat이 아니라 autom이 된다", "better를 good으로 바꾼다"], "a": 2, "exp": "Stemming은 규칙 기반이라 결과가 실제 단어가 아닐 수 있다. am/are/is → be, better → good은 품사 정보를 쓰는 Lemmatization의 예이다."}, {"id": 29, "sec": "4.1.3", "diff": "기초", "q": "\"아버지가방에들어가신다\"와 \"무지개같은사람\" 같은 고전적인 예가 보여주는 것은?", "opts": ["맞춤법 오류가 띄어쓰기보다 더 치명적이라는 점", "형태소 분석기가 항상 정확하다는 점", "띄어쓰기 하나가 문장 전체의 의미를 바꿀 수 있다는 점", "한국어에는 띄어쓰기 규범이 존재하지 않는다는 점"], "a": 2, "exp": "'아버지가 방에'와 '아버지 가방에'처럼 띄어쓰기 위치가 문장 의미를 완전히 바꾸므로, 띄어쓰기 교정은 중의성 해소의 핵심 작업이다."}, {"id": 30, "sec": "4.1.3", "diff": "기초", "q": "한국어 띄어쓰기 교정의 세 가지 접근으로 강의자료가 제시한 것은?", "opts": ["규칙 기반 / 통계·확률 기반 / 딥러닝 기반", "형태소 기반 / 어절 기반 / 문장 기반", "지도학습 / 비지도학습 / 강화학습", "사전 기반 / 번역 기반 / 검색 기반"], "a": 0, "exp": "띄어쓰기 교정 역시 규칙 → 통계 → 딥러닝의 공통 흐름을 따른다."}, {"id": 31, "sec": "4.1.3", "diff": "중급", "q": "규칙 기반 띄어쓰기 교정의 특징으로 옳지 않은 것은?", "opts": ["어휘 지식 구축·관리 비용이 커서 유지·보수가 어렵다", "형태소 분석기와 어휘 지식·문법 규칙 등의 휴리스틱을 사용한다", "왜 그렇게 교정했는지 설명할 수 있고 학습 데이터가 필요 없다", "학습 말뭉치의 크기가 클수록 정확도가 자동으로 향상된다"], "a": 3, "exp": "말뭉치 규모에 따라 성능이 올라가는 것은 통계·확률 기반 방법의 특징이다. 규칙 기반은 오히려 중의적 구간이나 오타에서 성능이 크게 저하된다."}, {"id": 32, "sec": "4.1.3", "diff": "심화", "q": "통계·확률 기반 띄어쓰기 교정에서 추정하는 확률 P(space | c(i-2), c(i-1), c(i), c(i+1)) 의 의미로 옳은 것은?", "opts": ["앞뒤 음절들이 주어졌을 때 위치 i에 공백이 올 확률", "문장 전체가 문법적으로 옳을 확률", "어절 i가 명사일 확률", "오타 c(i)가 원래 어떤 문자였을 확률"], "a": 0, "exp": "말뭉치에서 자동 추출한 음절 n-gram 정보를 이용해 각 음절 사이에 공백이 놓일 확률을 추정한다."}, {"id": 33, "sec": "4.1.3", "diff": "기초", "q": "입력 '아버지가방에들어가셨다'에 대해 통계 기반 교정기가 후보별 확률을 아래와 같이 계산했을 때 최종 선택 결과는?\n아버지가 방에 들어가셨다 0.71 / 아버지 가방에 들어가셨다 0.24 / 아버지가방에 들어가셨다 0.05", "opts": ["아버지가 방에 들어가셨다", "아버지가방에 들어가셨다", "세 후보를 모두 출력한다", "아버지 가방에 들어가셨다"], "a": 0, "exp": "통계 기반 방법은 후보 중 확률이 가장 높은 것을 선택하므로 0.71인 첫 번째 후보가 선택된다."}, {"id": 34, "sec": "4.1.3", "diff": "중급", "q": "딥러닝 기반 띄어쓰기 교정은 문제를 어떤 형태로 정식화하는가?", "opts": ["문장의 구문 트리를 생성하는 파싱", "단어를 벡터로 사상하는 임베딩 학습", "어절 전체를 다른 어절로 번역하는 기계 번역", "각 음절 뒤에 공백이 오는지(1) 오지 않는지(0)를 예측하는 음절 단위 이진 분류(sequence labeling)"], "a": 3, "exp": "'아버지가방에'는 아(0) 버(0) 지(0) 가(1) 방(0) 에(1)로 레이블링되며, Bi-LSTM+CRF, CNN, Transformer 계열이 사용된다."}, {"id": 35, "sec": "4.1.4", "diff": "기초", "q": "철자 오류 유형 중 '그래서 → 그서래', 'the → hte'처럼 인접한 두 문자의 순서가 뒤바뀐 경우를 무엇이라 하는가?", "opts": ["생략(Deletion)", "삽입(Insertion)", "대체(Substitution)", "전치(Transposition)"], "a": 3, "exp": "인접한 두 문자의 순서가 뒤바뀌는 오류가 전치이며, 이를 허용하면 Damerau-Levenshtein 거리가 된다."}, {"id": 36, "sec": "4.1.4", "diff": "중급", "q": "철자 오류 유형과 예시의 연결로 옳지 않은 것은?", "opts": ["전치(Transposition) — the → hte", "대체(Substitution) — 감사합니다 → 감사합다", "생략(Deletion) — the → th", "삽입(Insertion) — the → ther"], "a": 1, "exp": "'감사합니다 → 감사합다'는 있어야 할 문자를 빠뜨린 생략의 예이다. 대체의 예는 the → thw, 학교 → 학꾜이다."}, {"id": 37, "sec": "4.1.4", "diff": "중급", "q": "편집 거리에 대한 설명으로 옳은 것은?", "opts": ["편집 거리는 항상 두 문자열 중 긴 쪽의 길이와 같다", "편집 거리는 두 문자열의 길이 차이를 뜻한다", "삽입·생략·대체만 허용하면 Levenshtein distance, 전치까지 허용하면 Damerau-Levenshtein distance이다", "전치까지 허용하는 것이 Levenshtein distance이다"], "a": 2, "exp": "편집 연산의 최소 횟수가 편집 거리이며, 허용하는 연산의 종류에 따라 두 거리로 나뉜다."}, {"id": 38, "sec": "4.1.4", "diff": "심화", "q": "kitten을 sitting으로 바꿀 때의 Levenshtein 편집 거리와 그 근거로 옳은 것은?", "opts": ["4 — 두 문자열의 길이 차이 1에 대체 3회를 더함", "3 — k를 s로 대체, e를 i로 대체, 마지막에 g를 삽입", "2 — k를 s로 대체, g를 삽입", "1 — 전치 한 번으로 변환 가능"], "a": 1, "exp": "kitten → sitten → sittin → sitting의 세 연산이 최소이며, DP 행렬의 마지막 칸 D[6][7] = 3 이 곧 편집 거리이다."}, {"id": 39, "sec": "4.1.4", "diff": "심화", "q": "편집 거리 계산의 동적 계획법 점화식에서 D[i][j]를 구하는 식으로 옳은 것은? (cost는 두 문자가 같으면 0, 다르면 1)", "opts": ["D[i-1][j-1] + cost 만 사용", "min( D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + cost )", "min( D[i-1][j], D[i][j-1] ) + cost", "max( D[i-1][j] + 1, D[i][j-1] + 1, D[i-1][j-1] + cost )"], "a": 1, "exp": "삽입·삭제·대체 세 경로 중 최솟값을 취하며, 초기 조건은 D[i][0] = i, D[0][j] = j 이다. 시간·공간 복잡도는 O(m·n)이다."}, {"id": 40, "sec": "4.1.4", "diff": "중급", "q": "철자 교정의 오류 감지 단계에서 real-word error가 non-word error보다 어려운 이유는?", "opts": ["편집 거리 계산이 불가능하기 때문", "사전에는 있으나 문맥상 틀린 단어이므로 문맥을 보는 언어 모델이 필요하기 때문", "한국어에는 존재하지 않는 오류이기 때문", "사전 탐색 속도가 느리기 때문"], "a": 1, "exp": "'컴퓨더'처럼 사전에 없는 단어는 찾기 쉽지만, '학교에 갔다'와 '학교에 같다'처럼 둘 다 사전에 있는 경우는 문맥 판단이 필요하다."}, {"id": 41, "sec": "4.1.4", "diff": "심화", "q": "통계·확률 기반 맞춤법 교정의 잡음 채널 모형 ĉ = argmax P(w | c) · P(c) 에서 각 항의 역할로 옳은 것은?", "opts": ["P(c)는 후보 집합의 크기를 뜻한다", "P(w | c)는 언어 모델, P(c)는 오타 모델이다", "두 항 모두 편집 거리만으로 계산된다", "P(w | c)는 오타 모델(channel model), P(c)는 언어 모델(prior)이다"], "a": 3, "exp": "P(w|c)는 c를 쓰려다 w로 잘못 칠 확률로 편집 거리와 자판 인접성으로 추정하고, P(c)는 그 단어가 등장할 사전 확률로 말뭉치 빈도나 n-gram으로 추정한다."}, {"id": 42, "sec": "4.1.4", "diff": "심화", "q": "w = 'acress'에 대해 P(w|c)P(c)를 계산한 결과 across 2.8e-9, actress 2.7e-9, acres 1.0e-9 였다. 이 예가 시사하는 바는?", "opts": ["오타 모델보다 언어 모델이 항상 더 중요함을 보여준다", "편집 거리 2 이상의 후보를 포함해야 함을 보여준다", "계산 결과가 가장 큰 후보가 언제나 정답임을 보여준다", "모형은 across를 선택하지만 실제 정답은 actress였으며, 유니그램 사전확률만으로는 문맥을 반영하지 못한다"], "a": 3, "exp": "문맥을 반영하려면 P(c)를 n-gram으로 계산해야 하며, 그렇게 하면 real-word error도 교정할 수 있다."}, {"id": 43, "sec": "4.1.4", "diff": "기초", "q": "서브워드 토큰화가 도입된 가장 큰 이유는?", "opts": ["구문 트리의 깊이를 줄이기 위해", "불용어를 자동으로 제거하기 위해", "단어 단위 토큰화의 미등록어(OOV) 문제와 어휘 폭발을 해결하기 위해", "문장 분할의 정확도를 높이기 위해"], "a": 2, "exp": "어휘 사전에 없는 단어를 모두 <UNK>로 처리하는 한계와, 교착어의 활용형 폭발로 인한 사전 크기-OOV 딜레마를 해결하기 위한 방법이다."}, {"id": 44, "sec": "4.2.1", "diff": "기초", "q": "어휘 분석을 구성하는 두 가지 절차로 옳은 것은?", "opts": ["토큰화와 불용어 제거", "형태소 분석과 품사 태깅", "의미역 결정과 중의성 해소", "구구조 분석과 의존 분석"], "a": 1, "exp": "형태소 분석으로 최소 의미 단위를 확정하고, 품사 태깅으로 각 단위의 문법적 역할을 결정한다."}, {"id": 45, "sec": "4.2.1", "diff": "기초", "q": "형태소(Morpheme)의 정의로 가장 적절한 것은?", "opts": ["공백으로 구분되는 문자열의 단위", "더 이상 분해될 수 없는, 최소한의 의미를 갖는 단위", "하나의 의미만을 갖는 문장 성분", "문장에서 서술어 역할을 하는 단위"], "a": 1, "exp": "형태소는 최소 의미 단위이며, 자립성에 따라 자립/의존, 의미에 따라 실질/형식으로 분류된다."}, {"id": 46, "sec": "4.2.1", "diff": "중급", "q": "형태소 분류에 대한 설명으로 옳지 않은 것은?", "opts": ["조사와 어미는 자립 형태소에 속한다", "자립 형태소에는 명사, 대명사, 수사, 관형사, 부사, 감탄사가 있다", "형식(문법) 형태소는 문법적 관계나 기능만을 나타낸다", "실질(어휘) 형태소는 구체적인 대상이나 동작을 나타낸다"], "a": 0, "exp": "조사·어간·어미·접사는 반드시 다른 형태소에 붙어야 하는 의존 형태소이다."}, {"id": 47, "sec": "4.2.1", "diff": "심화", "q": "\"하늘이 매우 푸르렀다\"의 형태소 분석 결과에 대한 설명으로 옳은 것은?", "opts": ["'매우'는 의존·형식 형태소이다", "3어절이 그대로 3개 형태소가 된다", "'이'는 자립·실질 형태소이다", "3어절이 하늘/이/매우/푸르/었/다의 6개 형태소로 분해된다"], "a": 3, "exp": "하늘(자립·실질), 이(의존·형식, 주격 조사), 매우(자립·실질), 푸르(의존·실질, 어간), 었(의존·형식, 과거 시제), 다(의존·형식, 종결 어미)로 6개이다."}, {"id": 48, "sec": "4.2.1", "diff": "기초", "q": "형태소 분석의 절차를 순서대로 바르게 나열한 것은?", "opts": ["형태소 분리 → 원형 복원 → 후보 선택", "원형 복원 → 형태소 분리 → 후보 선택", "후보 선택 → 형태소 분리 → 원형 복원", "형태소 분리 → 후보 선택 → 원형 복원"], "a": 0, "exp": "단어에서 형태소를 분리하고, 형태론적 변형이 일어난 형태소의 원형을 찾은 뒤, 결합 조건에 따라 옳은 분석 후보를 선택한다."}, {"id": 49, "sec": "4.2.1", "diff": "심화", "q": "'구웠다 → 굽 + 었 + 다', '들어 → 듣 + 어'와 같은 사례가 특히 어렵게 만드는 형태소 분석 단계는?", "opts": ["원형 복원 — 불규칙 활용 때문에 표층형과 기본형이 크게 달라지기 때문", "형태소 분리 — 어절 경계가 불명확하기 때문", "후보 선택 — 결합 조건이 없기 때문", "품사 태깅 — 태그셋이 크기 때문"], "a": 0, "exp": "ㅂ 불규칙, ㄷ 불규칙 등으로 표층형과 기본형이 달라져 STEP 2(원형 복원)가 한국어에서 특히 어렵다."}, {"id": 50, "sec": "4.2.1", "diff": "중급", "q": "'감기는'이 [감기(명사)+는], [감(동사)+기+는], [감기(동사)+는]으로 분석될 수 있는 현상은 형태소 분석의 어느 단계에서 발생하는 문제인가?", "opts": ["토큰화 — 공백이 없어 발생한다", "후보 선택 — 하나의 어절이 여러 방식으로 분석될 수 있어 중의성이 발생한다", "원형 복원 — 불규칙 활용 때문에 발생한다", "형태소 분리 — 최소 의미 단위를 찾지 못해 발생한다"], "a": 1, "exp": "STEP 3(후보 선택)에서 중의성이 발생하며, 그래서 형태소 분석은 품사 태깅과 함께 수행된다."}, {"id": 51, "sec": "4.2.1", "diff": "중급", "q": "영어와 한국어의 형태소 분석 차이에 대한 설명으로 옳지 않은 것은?", "opts": ["한국어는 교착어라 '학교에서는'이 학교 + 에서 + 는의 3형태소가 된다", "한국어는 어절과 단어가 대체로 일치하여 공백 분리만으로도 상당 부분 해결된다", "'Computers'는 'Computer' + 's'로 두 개의 형태소로 분석된다", "영어는 굴절 요소를 가진 분석어에 가까워 기능어가 독립 단어로 분리된다"], "a": 1, "exp": "어절과 단어가 대체로 일치하는 쪽은 영어이며, 한국어는 어절 ≠ 단어이므로 전용 형태소 분석기가 반드시 필요하다."}, {"id": 52, "sec": "4.2.1", "diff": "중급", "q": "한국어 형태소 분석 라이브러리에 대한 설명으로 옳지 않은 것은?", "opts": ["Kiwi는 KoNLPy가 제공하는 5종 분석기 중 하나로 포함되어 있다", "KoNLPy는 Hannanum·Kkma·Komoran·Mecab·Okt 5종을 하나의 파이썬 인터페이스로 제공한다", "Kkma는 가장 상세한 태그셋(약 56종)을 갖지만 속도가 느리다", "Mecab-ko는 C++/CRF 기반으로 매우 빠르지만 설치가 다소 번거롭다"], "a": 0, "exp": "Kiwi는 KoNLPy에 포함되지 않은 독립 패키지(kiwipiepy)로, 띄어쓰기 교정·문장 분리·오탈자 대응이 내장되어 있다."}, {"id": 53, "sec": "4.2.1", "diff": "심화", "q": "\"아버지가 방에 들어가신다\"에 대한 Okt와 Kiwi의 분석 결과가 다른 이유로 가장 적절한 것은?", "opts": ["입력 문장의 띄어쓰기가 틀렸기 때문", "Okt가 한국어를 지원하지 않기 때문", "한쪽 분석기가 명백히 오류를 내기 때문", "분석기마다 사전·태그셋·분석 단위가 달라 어미 분해 수준 등이 달라지기 때문"], "a": 3, "exp": "Okt는 '들어가신다/Verb'로 묶지만 Kiwi는 들어가/VV, 시/EP, ᆫ다/EF로 분해한다. 절대적인 정답은 없으므로 자신의 데이터로 비교 실험해야 한다."}, {"id": 54, "sec": "4.2.2", "diff": "기초", "q": "품사 분류에서 명사·대명사·수사가 속하며 문장에서 주어·목적어가 되는 갈래는?", "opts": ["수식언", "용언", "관계언", "체언"], "a": 3, "exp": "체언은 주체 기능을 하며, 용언은 동사·형용사, 수식언은 관형사·부사, 독립언은 감탄사, 관계언은 조사이다."}, {"id": 55, "sec": "4.2.2", "diff": "중급", "q": "관계언(조사)에 대한 설명으로 옳지 않은 것은?", "opts": ["격조사(이/가, 을/를), 보조사(은/는, 도), 접속조사(와/과)로 나뉜다", "다른 성분과 문법적 관계를 맺지 않는 독립 기능을 한다", "조사가 문법 관계를 직접 표시하므로 한국어는 어순이 비교적 자유롭다", "체언 뒤에 붙어 문법적 관계를 표시한다"], "a": 1, "exp": "다른 성분과 문법적 관계를 맺지 않는 것은 독립언(감탄사)의 특징이다."}, {"id": 56, "sec": "4.2.2", "diff": "중급", "q": "세종 태그셋의 태그와 의미의 연결로 옳지 않은 것은?", "opts": ["VV / VA — 동사 / 형용사", "JKS — 목적격 조사", "NNG / NNP — 일반 명사 / 고유 명사", "EP / EF — 선어말 어미 / 종결 어미"], "a": 1, "exp": "JKS는 주격 조사(이·가)이고, 목적격 조사(을·를)는 JKO이다."}, {"id": 57, "sec": "4.2.2", "diff": "중급", "q": "Penn Treebank 태그셋에 대한 설명으로 옳은 것은?", "opts": ["NN / NNS는 명사의 단수 / 복수를 구분하며, VB / VBD / VBZ는 동사 원형 / 과거 / 3인칭단수를 구분한다", "JJ는 부사, RB는 형용사를 나타낸다", "NN / NNS는 일반 명사 / 고유 명사를 구분한다", "한국어 형태소 분석기에서 표준으로 사용하는 태그셋이다"], "a": 0, "exp": "Penn Treebank는 영어 태그셋이며 JJ가 형용사(quick), RB가 부사(quickly)이다. 한국어는 세종 태그셋을 주로 쓴다."}, {"id": 58, "sec": "4.2.2", "diff": "기초", "q": "다국어 비교 연구에 사용되는 국제 표준 품사 체계로, NOUN·VERB·ADJ·ADP 등 17종의 태그를 사용하는 것은?", "opts": ["UPOS (Universal Dependencies)", "Penn Treebank", "WordNet", "세종 태그셋"], "a": 0, "exp": "Universal Dependencies의 UPOS 17종은 다국어 비교 연구를 위한 국제 표준 태그 체계이다."}, {"id": 59, "sec": "4.2.2", "diff": "기초", "q": "품사 태깅에 대한 설명으로 가장 적절한 것은?", "opts": ["문장을 구성소 단위로 묶어 트리를 만드는 작업이다", "한 토큰에 가능한 모든 품사를 나열해 두는 작업이다", "각 토큰에 정확히 하나의 품사를 부여하는 작업으로, 필연적으로 중의성 해소를 수반한다", "단어를 벡터 공간에 사상하는 작업이다"], "a": 2, "exp": "같은 단어라도 문맥에 따라 품사가 달라지므로, 좌우 문맥을 고려해 가장 그럴듯한 태그 열을 찾는 순차 레이블링 문제가 된다."}, {"id": 60, "sec": "4.2.2", "diff": "심화", "q": "'나는 학교에 간다'와 '새가 하늘을 나는 모습'에서 '나는'의 태깅 결과로 옳은 것은?", "opts": ["앞은 날/VV + 는/ETM, 뒤는 나/NP + 는/JX 이다", "둘 다 나/NP + 는/JX 이다", "앞은 나/NP + 는/JX, 뒤는 날/VV + 는/ETM 이다", "둘 다 날/VV + 는/ETM 이다"], "a": 2, "exp": "형태론적 중의성의 대표 예로, 문맥을 보아야 대명사 '나'인지 동사 '날다'인지 구분할 수 있다."}, {"id": 61, "sec": "4.2.2", "diff": "중급", "q": "규칙·지식 기반 품사 태깅에 대한 설명으로 옳지 않은 것은?", "opts": ["제약 문법(Constraint Grammar)은 가능한 태그 중 불가능한 것을 제거해 나간다", "수동 구축은 시간·노력이 많이 들어 지식 병목(knowledge bottleneck) 현상이 발생한다", "통계 기반이 다루지 못하는 부분을 규칙으로 교정할 수 있다는 장점이 있다", "Brill Tagger는 언어 전문가가 규칙을 전부 수동으로 작성하는 대표적인 방식이다"], "a": 3, "exp": "Brill Tagger는 최소한의 규칙에서 출발해 말뭉치로부터 규칙을 학습하는 자동/반자동 구축의 예이며, 코퍼스 의존적이라는 단점이 있다."}, {"id": 62, "sec": "4.2.2", "diff": "심화", "q": "HMM 기반 품사 태깅 수식 argmax Π P(wi | ti) · P(ti | ti-1) 에서 각 확률의 이름으로 옳은 것은?", "opts": ["두 항 모두 전이 확률이다", "P(wi | ti)는 전이 확률, P(ti | ti-1)은 방출 확률이다", "P(wi | ti)는 방출 확률(emission), P(ti | ti-1)은 전이 확률(transition)이다", "P(ti | ti-1)은 사전 확률, P(wi | ti)는 사후 확률이다"], "a": 2, "exp": "방출 확률은 태그 '명사'가 단어 '학교'로 실현될 확률, 전이 확률은 관형사 다음에 명사가 올 확률처럼 태그 사이의 연쇄 확률이다."}, {"id": 63, "sec": "4.2.2", "diff": "중급", "q": "HMM 품사 태깅에서 지수적으로 많은 태그 열 중 최적해를 효율적으로 찾기 위해 사용하는 알고리즘과 그 복잡도는?", "opts": ["비터비(Viterbi) 알고리즘, O(n·|T|²)", "CYK 알고리즘, O(n³)", "빔 서치, O(n)", "Chu-Liu/Edmonds 알고리즘, O(n²)"], "a": 0, "exp": "비터비 알고리즘은 동적 계획법으로 O(n·|T|²)에 최적 태그 열을 구하며, HMM 태깅은 정확도 95% 이상을 달성한다."}, {"id": 64, "sec": "4.2.2", "diff": "중급", "q": "강의자료가 제시한 한국어 품사 태깅의 성능 추이로 옳은 것은?", "opts": ["규칙 기반 약 98% → HMM/CRF 약 97% → BERT 기반 약 90%", "BERT 기반이 등장하면서 미등록어 오류가 완전히 사라졌다", "모든 접근법이 동일하게 약 95% 수준이다", "규칙 기반 약 90% → HMM/CRF 약 95~96% → Bi-LSTM-CRF 약 97% → BERT 기반 약 98% 이상"], "a": 3, "exp": "접근법이 발전할수록 성능이 향상되지만, 미등록어·구어체에서는 여전히 오류가 발생한다."}, {"id": 65, "sec": "4.2.2", "diff": "중급", "q": "형태소 분석 및 품사 태깅의 활용 분야에 대한 설명으로 옳지 않은 것은?", "opts": ["구문 분석이 끝난 뒤 그 결과를 검증하는 후처리 단계로만 사용된다", "기계 번역에서 원문의 문법 정보를 파악해 대역어를 선택하는 데 사용된다", "텍스트 마이닝에서 명사·동사만 추출해 키워드 분석과 토픽 모델링을 수행한다", "정보 검색에서 조사와 어미를 제거하고 실질 형태소만 색인하면 검색 품질이 향상된다"], "a": 0, "exp": "형태소 분석과 품사 태깅은 오히려 구문 분석 단계의 전처리 과정으로 간주되며, 자연어처리 전반의 기반 기술로 쓰인다."}, {"id": 66, "sec": "4.3.1", "diff": "기초", "q": "구문 분석(syntactic parsing)의 목표로 가장 적절한 것은?", "opts": ["단어의 최소 의미 단위를 분리하는 것", "자연어 문장의 문법적 구조를 구문 문법에 따라 자동으로 분석하는 것", "문장에 등장한 단어의 의미를 사전에서 고르는 것", "문서에서 노이즈를 제거하는 것"], "a": 1, "exp": "어휘 분석이 '단어'를 확정했다면, 구문 분석은 그 단어들이 어떻게 연결되는가를 밝혀 기계 번역·정보 검색 등에서 의미 분석을 돕는다."}, {"id": 67, "sec": "4.3.1", "diff": "중급", "q": "구구조 문법과 의존 문법의 차이를 바르게 설명한 것은?", "opts": ["의존 문법은 어순이 고정적인 언어에만 적용할 수 있다", "구구조 문법은 지배소-의존소 관계를, 의존 문법은 구성소 관계를 기술한다", "두 문법 모두 내부 노드로 구(NP, VP)를 사용한다", "구구조 문법은 '무엇이 무엇과 묶이는가'를, 의존 문법은 '무엇이 무엇에 걸리는가'를 기술한다"], "a": 3, "exp": "구구조 문법은 구성소(constituent) 관계에, 의존 문법은 의존(dependency) 관계에 기반한다."}, {"id": 68, "sec": "4.3.1", "diff": "기초", "q": "의존 문법에서 절의 중심이 되는 단어와 그에 의존하는 단어를 각각 무엇이라 하는가?", "opts": ["루트와 리프", "지배소(head)와 의존소(dependent)", "구성소와 수식어", "비단말 기호와 단말 기호"], "a": 1, "exp": "의존 트리에서 단어는 노드가 되고 에지는 지배소 → 의존소의 의존 관계를 나타낸다."}, {"id": 69, "sec": "4.3.1", "diff": "기초", "q": "구성소(constituent)의 정의로 옳은 것은?", "opts": ["다른 단어에 의존하는 단어", "문법 규칙의 좌변에 오는 기호", "문장에서 서술어 역할을 하는 단어", "한 개의 단위처럼 기능하는 일련의 단어"], "a": 3, "exp": "구구조 문법은 단어들이 모여 구를 이루고, 이런 구와 단어의 계층 관계로 문장이 이루어진다고 본다."}, {"id": 70, "sec": "4.3.1", "diff": "심화", "q": "\"철수가 사과를 먹었다\"의 구구조를 (S (NP 철수가) (VP (NP 사과를) (V 먹었다))) 로 표기했을 때, 이에 대응하는 문맥 자유 문법 규칙으로 옳은 것은?", "opts": ["S → VP NP, VP → V NP", "S → NP V, VP → NP NP", "S → NP NP V, VP → V", "S → NP VP, VP → NP V"], "a": 3, "exp": "괄호 표기에서 S가 NP와 VP로, VP가 NP와 V로 전개되고 있다. 비단말 기호는 S·NP·VP·V, 단말 기호는 실제 단어, 시작 기호는 S이다."}, {"id": 71, "sec": "4.3.1", "diff": "중급", "q": "의존 트리(dependency tree)의 특징으로 옳지 않은 것은?", "opts": ["구(NP, VP) 같은 내부 노드가 추가되어 노드 수가 단어 수보다 많다", "한국어 의존 구문 분석에서는 지배소가 의존소보다 뒤에 온다고 가정한다", "노드 수가 단어 수와 같다", "문장의 최종 지배소는 대개 서술어이다"], "a": 0, "exp": "내부 노드가 생기는 것은 구구조 트리이며, 의존 트리는 각 단어가 하나의 노드가 되어 노드 수 = 단어 수이다."}, {"id": 72, "sec": "4.3.1", "diff": "심화", "q": "\"철수가 빨간 사과를 먹었다\"의 의존 분석에서 에지 관계로 옳은 것은?", "opts": ["철수가 → 먹었다 (주어, NP_SBJ)", "빨간 → 사과를 (수식, VP_MOD)", "사과를 → 먹었다 (목적어, NP_OBJ)", "사과를 → 빨간 (수식, VP_MOD)"], "a": 3, "exp": "에지는 지배소 → 의존소 방향이며, 먹었다 → 철수가(NP_SBJ), 먹었다 → 사과를(NP_OBJ), 사과를 → 빨간(VP_MOD)이다."}, {"id": 73, "sec": "4.3.1", "diff": "중급", "q": "구문 중의성의 대표 유형과 예시의 연결로 옳지 않은 것은?", "opts": ["등위 접속 중의성 — '늙은 남자와 여자'", "명사구 경계 중의성 — '한국 대학 축구 연맹'의 묶음 방식", "어휘적 중의성 — '배'가 신체인지 과일인지 선박인지", "부착 중의성 — 'I saw the man with a telescope'"], "a": 2, "exp": "어휘적 중의성은 4.4절의 단어 의미 중의성이며, 구문 중의성의 대표 유형은 부착·등위 접속·명사구 경계 중의성이다."}, {"id": 74, "sec": "4.3.1", "diff": "심화", "q": "문장이 길어질수록 가능한 구문 트리 수가 폭발적으로 증가하는 현상을 설명하는 수로, 단어 4개면 5개, 6개면 42개, 9개면 1,430개의 이진 트리가 생기는 것은?", "opts": ["피보나치 수", "카탈란 수(Catalan number)", "조화 수", "팩토리얼"], "a": 1, "exp": "모든 후보를 나열할 수 없으므로 확률·학습 기반의 선택이 필요하다는 근거가 된다."}, {"id": 75, "sec": "4.3.2", "diff": "중급", "q": "문맥 자유 문법 G = (N, Σ, R, S)의 각 구성 요소로 옳은 것은?", "opts": ["N은 노드 수, Σ는 에지 수, R은 규칙 수, S는 문장 수", "N은 단말 기호 집합, Σ는 비단말 기호 집합, R은 시작 기호, S는 생성 규칙", "N은 비단말 기호 집합, Σ는 단말 기호 집합, R은 생성 규칙, S는 시작 기호", "N은 명사구, Σ는 문장, R은 루트, S는 주어"], "a": 2, "exp": "구구조 문법은 자연어 문장을 하위 구성소로 나누는 문법이며, 이 네 요소로 정의된다."}, {"id": 76, "sec": "4.3.2", "diff": "중급", "q": "구구조 파싱 알고리즘에 대한 설명으로 옳지 않은 것은?", "opts": ["상향식(Bottom-up)은 단어에서 출발해 규칙을 거꾸로 적용한다", "차트 파싱(CYK, Earley)은 부분 결과를 표에 저장해 중복 계산을 제거한다", "하향식(Top-down)은 단어에서 출발해 규칙을 거꾸로 적용한다", "하향식은 S에서 출발해 규칙을 전개하며 문장과 맞춰본다"], "a": 2, "exp": "단어에서 출발하는 것은 상향식이며, 하향식은 시작 기호 S에서 출발한다. 차트 파싱은 동적 계획법을 이용한다."}, {"id": 77, "sec": "4.3.2", "diff": "중급", "q": "확률적 구구조 문법(PCFG)에 대한 설명으로 옳은 것은?", "opts": ["각 규칙에 조건부 확률을 부여하여 P(T) = Π P(A → β | A)로 트리 확률을 계산하고, 확률이 가장 높은 트리를 선택한다", "중의성이 있는 문장은 분석할 수 없다", "모든 규칙의 확률이 동일하다고 가정한다", "확률은 반드시 사람이 손으로 지정해야 한다"], "a": 0, "exp": "트리뱅크로부터 규칙의 조건부 확률을 계산하거나 EM(inside-outside)으로 갱신하며, 확률 CYK로 최대 확률 트리를 찾는다."}, {"id": 78, "sec": "4.3.2", "diff": "심화", "q": "PCFG의 한계와 그 보완책으로 옳은 것은?", "opts": ["트리뱅크 없이도 학습되므로 과적합이 심하며 정규화로 보완한다", "규칙 확률을 계산할 수 없어 규칙 기반으로 되돌아가야 한다", "규칙 확률이 문맥과 무관하게 고정되어 어휘 정보(lexical head)를 반영하지 못하며, Lexicalized PCFG로 보완한다", "확률이 항상 1을 넘어 정규화가 필요하다"], "a": 2, "exp": "규칙 단위 확률만으로는 어휘별 선호를 표현할 수 없어, 규칙에 핵심어 정보를 얹은 Lexicalized PCFG가 제안되었다."}, {"id": 79, "sec": "4.3.2", "diff": "중급", "q": "구구조 구문 분석의 대표 자원과 성능에 대한 설명으로 옳은 것은?", "opts": ["Penn Treebank는 한국어 트리뱅크이다", "세종 구문 분석 말뭉치는 영어 자원이다", "Penn Treebank는 약 100만 어절 규모의 영어 구구조 트리뱅크이며, F1은 영어 PCFG 약 73%, 현대 신경망 파서 약 95% 수준이다", "PCFG의 F1이 신경망 파서보다 높다"], "a": 2, "exp": "영어는 Penn Treebank, 한국어는 세종 구문 분석 말뭉치가 대표 자원이며, labeled bracketing F1으로 성능을 측정한다."}, {"id": 80, "sec": "4.3.2", "diff": "중급", "q": "전이 기반(transition-based) 구문 분석의 장점과 한계로 옳은 것은?", "opts": ["규칙을 사람이 작성해야 하지만 중의성 해소가 자동으로 된다", "전역 최적을 보장하지만 O(n³)의 계산 비용이 든다", "항상 문장 전체의 문법 구조를 고려하므로 오류 전파가 없다", "단어 수에 선형적인 액션(O(n))으로 매우 빠르지만, 지역적 결정이라 오류 전파와 장거리 의존에 취약하다"], "a": 3, "exp": "SHIFT, REDUCE 등의 액션을 한 단어씩 선택하는 방식이라 빠르지만, 한 번의 잘못된 액션이 이후 모든 결정에 영향을 준다."}, {"id": 81, "sec": "4.3.2", "diff": "심화", "q": "전이 기반 파싱의 지역적 결정 문제를 보완하기 위한 기법이 아닌 것은?", "opts": ["최대 신장 트리(MST)를 구하는 Chu-Liu/Edmonds 알고리즘", "상위 k개 후보를 동시에 유지하는 빔 서치(beam search)", "잘못된 상태에서도 최선의 액션을 학습하는 동적 오라클", "BERT로 문장 전체를 표현한 뒤 액션을 선택하는 사전학습 인코더"], "a": 0, "exp": "Chu-Liu/Edmonds는 그래프 기반 파싱에서 최적 트리를 찾는 알고리즘이다. 나머지 셋이 전이 기반의 보완 기법으로 제시되었다."}, {"id": 82, "sec": "4.3.2", "diff": "중급", "q": "의존 트리가 만족해야 하는 조건으로 강의자료가 제시한 세 가지는?", "opts": ["사영성 / 지배소 후위 / 어절 단위", "비순환 / 이진성 / 완전 그래프", "단일 지배소 / 비순환 / 연결성", "단일 지배소 / 사영성 / 이진성"], "a": 2, "exp": "루트를 제외한 모든 노드는 정확히 하나의 지배소를 갖고, 순환이 없으며, 루트에서 모든 노드에 도달할 수 있어야 한다. 사영성은 별도의 성질이다."}, {"id": 83, "sec": "4.3.2", "diff": "중급", "q": "그래프 기반(Graph-based) 의존 구문 분석의 특징으로 옳은 것은?", "opts": ["모든 단어 쌍의 의존 관계에 점수를 매긴 뒤 최대 신장 트리를 찾으므로 장거리 의존에 강하지만 O(n²)~O(n³) 비용이 든다", "규칙을 사람이 직접 작성해야 하므로 학습 데이터가 필요 없다", "트리 조건을 만족하지 않는 결과를 출력한다", "단어를 하나씩 스택과 버퍼로 처리하여 O(n)에 동작한다"], "a": 0, "exp": "완전 그래프에서 Chu-Liu/Edmonds로 MST를 구하며, Biaffine attention 파서(Dozat & Manning, 2017)가 대표적이다."}, {"id": 84, "sec": "4.4.1", "diff": "기초", "q": "의미 분석의 주요 과제로 강의자료가 제시하지 않은 것은?", "opts": ["띄어쓰기 교정", "단어 의미 중의성 해소(WSD)", "의미역 결정(SRL)", "개체명 인식과 상호참조 해결"], "a": 0, "exp": "띄어쓰기 교정은 4.1절의 전처리 과제이다. 의미 분석의 과제는 WSD, SRL, 의미 표현, 개체명 인식·상호참조 해결이다."}, {"id": 85, "sec": "4.4.1", "diff": "중급", "q": "Chomsky의 \"Colorless green ideas sleep furiously\"가 보여주는 바는?", "opts": ["형태소 분석 없이도 의미 분석이 가능하다", "문법적으로 완벽해도 의미적으로는 성립하지 않을 수 있어, 구문 분석만으로는 의미를 보장할 수 없다", "영어는 구구조 문법으로 분석할 수 없다", "문법적으로 틀린 문장도 의미는 통할 수 있다"], "a": 1, "exp": "구문 분석의 결과 위에서 '이 문장이 실제로 무엇을 뜻하는가'를 밝히는 의미 분석이 필요한 이유를 보여주는 고전적 예이다."}, {"id": 86, "sec": "4.4.1", "diff": "기초", "q": "다의어(polysemy)와 동음이의어(homonymy)의 차이로 옳은 것은?", "opts": ["둘 다 구조적 중의성에 속한다", "다의어는 의미들이 서로 관련되어 있고, 동음이의어는 형태만 같고 의미는 무관하다", "다의어는 형태만 같고 의미는 무관하며, 동음이의어는 의미가 서로 관련된다", "다의어는 한국어에만, 동음이의어는 영어에만 존재한다"], "a": 1, "exp": "'손'(신체 부위/일손/도움)은 다의어, '배'(신체/과일/선박)와 'bank'(은행/강둑)는 동음이의어의 예이다."}, {"id": 87, "sec": "4.4.1", "diff": "중급", "q": "\"창문 좀 열어 줄 수 있어?\"가 능력에 대한 질문으로도, 요청으로도 해석되는 것은 어떤 중의성인가?", "opts": ["어휘적 중의성", "구조적 중의성", "형태론적 중의성", "화용적 중의성"], "a": 3, "exp": "발화 상황과 화자의 의도에 따라 달라지는 중의성이 화용적 중의성이며, '그것 좀 줘'의 지시 표현처럼 상호참조 해결이 필요한 경우도 여기에 속한다."}, {"id": 88, "sec": "4.4.1", "diff": "중급", "q": "\"나는 울면서 떠나는 그녀를 배웅했다\"에서 우는 사람이 '나'인지 '그녀'인지 모호한 것은 어떤 중의성인가?", "opts": ["인코딩 중의성", "구조적 중의성", "어휘적 중의성", "화용적 중의성"], "a": 1, "exp": "부사절이 어디에 부착되는가에 따라 해석이 달라지는 부착 중의성으로, 4.3절의 구문 중의성과 같은 현상이며 해소에 의미 정보가 필요하다."}, {"id": 89, "sec": "4.4.1", "diff": "기초", "q": "단어 의미 중의성 해소(WSD)에 대한 설명으로 옳은 것은?", "opts": ["사전에 정의된 의미 목록(sense inventory)을 전제로 문장 내 중의적 어휘를 알맞은 의미와 매칭하는 문제이다", "오타를 찾아 올바른 철자로 바꾸는 문제이다", "단어를 형태소 단위로 분해하는 문제이다", "문장 구조가 여러 개일 때 하나를 고르는 문제이다"], "a": 0, "exp": "한국어는 표준국어대사전·KorLex, 영어는 WordNet을 의미 목록으로 주로 사용한다."}, {"id": 90, "sec": "4.4.1", "diff": "중급", "q": "WordNet에 대한 설명으로 옳은 것은?", "opts": ["형태소 분석기의 일종이다", "문맥 임베딩을 학습하는 신경망 모델이다", "한국어 의미 부착 말뭉치이다", "단어를 동의어 집합(synset) 단위로 묶고 상하위어·부분어 관계로 연결한 영어 어휘 의미망이다"], "a": 3, "exp": "bass.n.01(낮은 음역)과 bass.n.08(농어)처럼 의미별 synset을 제공한다. 한국어 대응 자원으로는 KorLex, 우리말샘, 세종 의미 부착 말뭉치가 있다."}, {"id": 91, "sec": "4.4.1", "diff": "심화", "q": "Lesk 알고리즘의 동작 원리로 옳은 것은?", "opts": ["의미가 레이블링된 데이터로 분류기를 학습하여 의미를 예측한다", "문맥 벡터를 군집화하여 의미를 자동으로 발견한다", "중의어의 각 의미에 대한 사전 정의문(gloss)과 주변 문맥 단어의 중복 개수를 세어 겹침이 가장 큰 의미를 선택한다", "소량의 시드에서 출발해 레이블을 확장한다"], "a": 2, "exp": "지식 기반 방법으로 레이블 데이터가 필요 없다는 장점이 있으나, 사전 정의문이 짧아 겹침 정보가 부족하다는 한계가 있다."}, {"id": 92, "sec": "4.4.1", "diff": "심화", "q": "'하나의 담화에는 하나의 의미', '하나의 연어에는 하나의 의미'라는 가정으로 소량의 시드에서 레이블을 확장하는 준지도 기법은?", "opts": ["Lesk 알고리즘", "Brill Tagger", "Yarowsky 알고리즘", "Biaffine 파서"], "a": 2, "exp": "레이블 부족 문제를 완화하는 절충 방법이며, 문맥 벡터를 군집화하는 의미 유도(sense induction)도 같은 범주에 속한다."}, {"id": 93, "sec": "4.4.2", "diff": "중급", "q": "Word2Vec·GloVe 같은 정적 임베딩이 WSD에서 갖는 근본적 한계와 그 해결책으로 옳은 것은?", "opts": ["한 단어에 하나의 벡터만 부여해 다의어를 구분할 수 없으며, ELMo·BERT 같은 문맥 임베딩이 문맥마다 다른 벡터를 생성해 해결했다", "학습 속도가 느려 사용할 수 없으며, 규칙 기반으로 되돌아가 해결했다", "문맥을 지나치게 반영해 의미가 흐려지며, 정적 임베딩으로 되돌려 해결했다", "벡터 차원이 너무 커서 계산할 수 없으며, 차원 축소로 해결했다"], "a": 0, "exp": "'배가 아프다'의 '배'와 '배를 탔다'의 '배'가 서로 다른 벡터로 표현되므로, 각 의미의 대표 벡터와 비교하여 WSD를 수행할 수 있다."}, {"id": 94, "sec": "4.4.2", "diff": "기초", "q": "\"You shall know a word by the company it keeps.\" (J.R. Firth, 1957)가 요약하는 가설은?", "opts": ["의미역 기준 — 하나의 명사구는 오직 하나의 의미역만 갖는다", "지배소 후위 가설 — 지배소는 의존소의 오른쪽에 온다", "사영성 가설 — 의존 에지는 서로 교 };
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week4_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
