<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2주차 자연어처리를 위한 수학과 언어학 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 2 · 자연어처리</div>
    <h1>2주차 &middot; 자연어처리를 위한 수학과 언어학 — 100문제</h1>
    <p class="sub">강의자료 2.1~2.8절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    2주차 강의자료(자연어처리를 위한 수학과 언어학의 기본 원리) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "2.1", "diff": "기초", "q": "자연어처리에서 확률이 필요한 이유로 가장 적절한 것은?", "opts": ["컴퓨터의 저장 공간을 아끼기 위해서", "언어에는 규칙이 전혀 없어 무작위로 처리해야 하기 때문", "문장을 사람이 직접 번역하기 위해서", "사람의 언어는 불확실한 현상으로 이루어져 있어 이를 정량적으로 분석·예측해야 하기 때문"], "a": 3, "exp": "\"사과\" 다음에 \"맛있다\"가 올 가능성처럼 언어는 불확실한 현상이며, 확률은 이를 정량적으로 분석·예측하게 해 주는 언어다."}, {"id": 2, "sec": "2.1", "diff": "중급", "q": "언어모델이 확률 모델이라는 말의 의미로 가장 적절한 것은?", "opts": ["문장에 포함된 단어의 개수를 세어 문장의 길이를 예측한다.", "단어의 철자 오류만을 확률적으로 교정한다.", "입력 문장을 규칙에 따라 그대로 변환한다.", "앞의 단어들을 조건으로 다음 단어의 확률분포 P(다음 단어 | 앞의 단어들)를 예측한다."], "a": 3, "exp": "언어모델은 앞의 단어들이 주어졌을 때 다음 단어의 확률분포를 예측하며, 분류·번역·요약은 가장 확률이 높은 출력을 선택한다."}, {"id": 3, "sec": "2.1", "diff": "기초", "q": "동전 두 개를 던질 때의 표본공간(sample space) Ω로 옳은 것은?", "opts": ["{HH, HT, TH, TT}", "{H, T}", "{HH, TT}", "{0, 1, 2}"], "a": 0, "exp": "표본공간은 일어날 수 있는 모든 경우의 집합이므로 동전 두 개를 던지면 {HH, HT, TH, TT}가 된다."}, {"id": 4, "sec": "2.1", "diff": "중급", "q": "확률 변수(random variable)에 대한 설명으로 옳은 것은?", "opts": ["항상 0과 1 사이의 값만 갖는 상수이다.", "표본공간 그 자체를 가리키는 집합이다.", "확률값을 무작위로 뽑아 주는 난수 생성기이다.", "표본공간의 각 표본점(결과)을 하나의 실수에 대응시키는 함수이다."], "a": 3, "exp": "확률 변수는 X : Ω → ℝ 형태의 함수로, 예를 들어 HH → 2, HT → 1, TH → 1, TT → 0으로 대응시킨다."}, {"id": 5, "sec": "2.1", "diff": "중급", "q": "이산 확률 변수(discrete random variable)에 대한 설명으로 옳은 것은?", "opts": ["확률밀도함수(PDF)로 분포를 표현하며 한 점의 확률은 0이다.", "취할 수 있는 값이 셀 수 있으며 확률질량함수(PMF) P(X=x)로 분포를 표현한다.", "항상 정규분포를 따른다.", "전체 넓이가 항상 0이 되도록 정규화된다."], "a": 1, "exp": "단어·품사 등 대부분의 언어 단위는 이산 확률 변수이며 PMF로 표현한다."}, {"id": 6, "sec": "2.1", "diff": "심화", "q": "연속 확률 변수에 대한 설명으로 옳은 것은?", "opts": ["확률질량함수(PMF)를 사용하며 각 점의 확률을 직접 읽을 수 있다.", "임베딩 값이나 모델 파라미터는 연속 확률 변수로 볼 수 없다.", "확률밀도함수(PDF)를 사용하며 특정 한 점의 확률은 0이고, 구간의 확률은 그 구간의 넓이(적분)로 구한다.", "전체 넓이의 합이 0이 되도록 정의된다."], "a": 2, "exp": "연속 확률 변수는 PDF로 표현하며 한 점의 확률은 0, 구간의 확률은 적분값이고 전체 넓이는 1이다. 임베딩 값·모델 파라미터가 그 예다."}, {"id": 7, "sec": "2.1", "diff": "기초", "q": "결합확률 P(X, Y)의 의미로 옳은 것은?", "opts": ["두 사건이 동시에 일어날 확률", "두 사건이 서로 배타적일 확률", "X가 일어났다는 조건 아래 Y가 일어날 확률", "다른 변수를 모두 합해서 얻는 확률"], "a": 0, "exp": "결합확률 P(X, Y)는 두 사건이 동시에 일어날 확률이다."}, {"id": 8, "sec": "2.1", "diff": "중급", "q": "주변확률(marginal probability)을 얻는 방법으로 옳은 것은?", "opts": ["결합분포에서 다른 변수를 모두 더해(marginalization) 없앤다.", "확률값에 로그를 취한다.", "조건부확률을 그대로 사용한다.", "두 확률을 서로 곱한다."], "a": 0, "exp": "주변확률 P(X)는 결합분포에서 나머지 변수들을 모두 합해(marginalization) 얻는다."}, {"id": 9, "sec": "2.1", "diff": "기초", "q": "조건부확률 P(Y|X)의 의미로 옳은 것은?", "opts": ["Y가 일어났을 때 X가 일어날 확률", "X와 Y가 독립일 확률", "X가 일어났다는 조건 아래 Y가 일어날 확률", "X와 Y가 동시에 일어날 확률"], "a": 2, "exp": "조건부확률 P(Y|X)는 X라는 조건이 주어졌을 때 Y가 일어날 확률이다."}, {"id": 10, "sec": "2.1", "diff": "중급", "q": "연쇄법칙(chain rule)으로 문장의 확률을 분해한 식으로 옳은 것은?", "opts": ["P(w₁,…,wₙ) = ∏ᵢ P(wᵢ)", "P(w₁,…,wₙ) = P(w₁) + P(w₂) + … + P(wₙ)", "P(w₁,…,wₙ) = ∏ᵢ P(wᵢ | w₁,…,wᵢ₋₁)", "P(w₁,…,wₙ) = Σᵢ P(wᵢ | wᵢ₋₁)"], "a": 2, "exp": "조건부확률을 반복 적용하면 연쇄법칙을 얻고, 문장의 확률을 앞 단어들을 조건으로 한 조건부확률의 곱으로 분해할 수 있다."}, {"id": 11, "sec": "2.1", "diff": "심화", "q": "연쇄법칙을 그대로 사용해 문장의 확률을 계산하기 어려운 이유는?", "opts": ["조건부확률이 정의되지 않기 때문", "문장의 단어 순서를 알 수 없기 때문", "앞 단어 전체를 조건으로 하면 경우의 수가 폭발해 확률을 추정할 수 없기 때문", "확률의 곱이 항상 1보다 커지기 때문"], "a": 2, "exp": "앞 단어 전체를 조건으로 삼으면 조합의 수가 폭발해 코퍼스에서 그 확률을 추정하는 것이 불가능해진다."}, {"id": 12, "sec": "2.1", "diff": "기초", "q": "두 사건 A, B가 독립(independent)일 때 성립하는 식은?", "opts": ["P(A, B) = P(A) P(B)", "P(A, B) = P(A) / P(B)", "P(A|B) = P(B|A)", "P(A, B) = P(A) + P(B)"], "a": 0, "exp": "두 사건이 독립이면 결합확률이 각 확률의 곱과 같다."}, {"id": 13, "sec": "2.1", "diff": "중급", "q": "마르코프 가정(Markov assumption)에 대한 설명으로 옳은 것은?", "opts": ["단어들이 모두 서로 독립이라고 가정한다.", "문장의 모든 단어를 조건으로 사용해야 한다고 가정한다.", "바로 앞의 n-1개 단어만 보면 충분하다고 가정하며, n=2면 bigram, n=3이면 trigram 모델이 된다.", "단어의 순서를 무시하고 빈도만 본다고 가정한다."], "a": 2, "exp": "마르코프 가정은 바로 앞 n-1개 단어만 조건으로 삼는 단순화로, 현실을 단순화하지만 계산 가능한 모델을 만들어 준다."}, {"id": 14, "sec": "2.1", "diff": "심화", "q": "Transformer 기반 언어모델과 마르코프 가정의 관계로 옳은 것은?", "opts": ["마르코프 가정과 무관하게 단어 빈도만 사용한다.", "마르코프 가정을 완화하여 긴 문맥을 직접 다룬다.", "마르코프 가정을 더 강하게 적용해 바로 앞 한 단어만 본다.", "마르코프 가정을 그대로 유지해 trigram으로 동작한다."], "a": 1, "exp": "Transformer 기반 언어모델은 앞 n-1개만 본다는 마르코프 가정을 완화해 긴 문맥을 직접 다룬다."}, {"id": 15, "sec": "2.1", "diff": "중급", "q": "베이즈 정리의 역할을 가장 잘 설명한 것은?", "opts": ["분포 사이의 거리를 측정한다.", "두 사건이 독립인지 검정한다.", "관측된 증거 E를 이용해 가설 H에 대한 믿음(사전확률)을 사후확률로 갱신한다.", "확률변수의 평균과 분산을 계산한다."], "a": 2, "exp": "베이즈 정리는 사전확률 P(H)에 우도 P(E|H)를 반영해 사후확률 P(H|E)로 갱신하는 규칙이다."}, {"id": 16, "sec": "2.1", "diff": "심화", "q": "나이브 베이즈 문서 분류에서 '순진하게(naive)' 가정하는 내용은?", "opts": ["단어의 순서가 확률에 결정적 영향을 준다고 가정한다.", "클래스가 주어졌을 때 문서 안의 단어들이 서로 조건부 독립이라고 가정한다.", "문서의 길이가 모두 같다고 가정한다.", "모든 클래스의 사전확률이 항상 같다고 가정한다."], "a": 1, "exp": "P(c|d) ∝ P(c)P(d|c)에서 P(d|c)를 계산할 때 단어들이 조건부 독립이라고 '순진하게' 가정한다."}, {"id": 17, "sec": "2.1", "diff": "기초", "q": "주사위 한 개를 던질 때 눈의 수 X의 기댓값 E(X)는?", "opts": ["2.5", "6.0", "3.5", "3.0"], "a": 2, "exp": "E(X) = 1·1/6 + 2·1/6 + … + 6·1/6 = 21/6 = 3.5로, 값과 그 값이 나올 확률의 가중평균이다."}, {"id": 18, "sec": "2.1", "diff": "중급", "q": "분산(variance)이 나타내는 것은?", "opts": ["값들이 평균에서 얼마나 흩어져 있는지", "두 변수의 의존성", "값과 확률의 가중평균", "확률의 총합"], "a": 0, "exp": "분산은 값들이 평균에서 흩어진 정도를 나타내며, 기댓값은 평균과 같은 역할을 한다."}, {"id": 19, "sec": "2.1", "diff": "중급", "q": "이항분포와 다항분포에 대한 설명으로 옳은 것은?", "opts": ["이항분포 B(n,p)는 성공 확률 p인 베르누이 시행을 n번 반복할 때의 성공 횟수 분포이고, 다항분포는 결과가 k가지인 경우로 일반화한 것이다.", "다항분포의 평균은 항상 0이다.", "이항분포는 연속 확률 분포에 속한다.", "다항분포는 결과가 두 가지인 경우이고, 이항분포는 k가지인 경우이다."], "a": 0, "exp": "다항분포는 이항분포의 일반화이며, E(xᵢ)=n·pᵢ, Var(xᵢ)=n·pᵢ(1-pᵢ)이다. 문서의 단어 빈도 벡터와 언어모델의 출력 분포가 대표적이다."}, {"id": 20, "sec": "2.1", "diff": "기초", "q": "정규분포(가우시안 분포)에 대한 설명으로 옳은 것은?", "opts": ["이산 확률 분포의 하나로 확률질량함수로 표현된다.", "단어 출현 빈도가 따르는 대표적인 분포이다.", "파라미터가 하나뿐이며 항상 평균이 0이다.", "연속 확률 분포의 하나로 평균 μ와 표준편차 σ 두 파라미터로 결정된다."], "a": 3, "exp": "정규분포는 평균 μ와 표준편차 σ로 결정되는 연속 분포이며, 신경망 가중치 초기화나 임베딩 값의 분포에 널리 쓰인다."}, {"id": 21, "sec": "2.1", "diff": "심화", "q": "Zipf의 법칙이 자연어처리에 주는 함의로 옳은 것은?", "opts": ["단어 빈도가 정규분포를 따르므로 평균과 표준편차만으로 모델링할 수 있다.", "모든 단어가 비슷한 빈도로 나타나므로 희소성 문제가 없다.", "드문 단어일수록 자주 등장하므로 상위 단어를 무시해도 된다.", "단어 빈도가 매우 치우친 롱테일 분포를 따르므로 데이터 희소성이 생기며, 이것이 스무딩과 서브워드 분절의 배경이 된다."], "a": 3, "exp": "상위 소수 단어가 전체 출현의 대부분을 차지하고 대부분의 단어는 매우 드문 롱테일 분포가 데이터 희소성의 근본 원인이다."}, {"id": 22, "sec": "2.2", "diff": "기초", "q": "최대우도추정(MLE)의 정의로 옳은 것은?", "opts": ["파라미터를 무작위로 초기화하는 방법", "사전지식을 반영해 사후확률을 최대화하는 파라미터를 선택하는 방법", "관측된 데이터가 나타날 확률(우도)을 가장 크게 만드는 파라미터 θ를 선택하는 방법", "데이터를 정규분포로 변환하는 방법"], "a": 2, "exp": "MLE는 관측 데이터의 우도 P(D|θ)를 최대화하는 θ를 고르는 추정 원리다."}, {"id": 23, "sec": "2.2", "diff": "중급", "q": "MLE에서 우도 대신 로그우도를 최대화하는 이유로 가장 적절한 것은?", "opts": ["로그를 취하면 최댓값의 위치가 바뀌어 더 좋은 해를 얻기 때문", "로그를 취해야만 미분이 가능해지기 때문", "로그우도가 항상 확률값이 되기 때문", "확률의 곱은 값이 매우 작아지므로 로그를 취해 계산을 안정적으로 만들기 위해"], "a": 3, "exp": "확률의 곱은 값이 급격히 작아지므로 보통 로그를 취한 로그우도를 최대화한다(최댓값의 위치는 바뀌지 않는다)."}, {"id": 24, "sec": "2.2", "diff": "중급", "q": "코퍼스에서 C(\"자연어 처리\") = 30, C(\"자연어\") = 50일 때 MLE로 추정한 P(처리 | 자연어)는?", "opts": ["0.3", "0.5", "1.67", "0.6"], "a": 3, "exp": "MLE 추정값은 빈도의 비율이므로 30 / 50 = 0.6이다."}, {"id": 25, "sec": "2.2", "diff": "중급", "q": "n-gram 확률 추정에서 MLE의 한계로 옳은 것은?", "opts": ["데이터가 많아질수록 추정값이 불안정해진다.", "확률값이 항상 1을 넘어 정규화할 수 없다.", "관측되지 않은 사건의 확률이 0이 되어, 한 번도 못 본 bigram이 하나라도 있으면 문장 전체의 확률이 0이 된다.", "사전분포를 반드시 지정해야 계산할 수 있다."], "a": 2, "exp": "MLE는 빈도가 0인 사건에 확률 0을 주므로, 곱으로 계산되는 문장 확률 전체가 0이 되어 버린다."}, {"id": 26, "sec": "2.2", "diff": "기초", "q": "최대사후확률추정(MAP)에 대한 설명으로 옳은 것은?", "opts": ["데이터를 사용하지 않고 사전분포만으로 파라미터를 정한다.", "사전지식을 전혀 사용하지 않고 우도만 최대화한다.", "사전지식(prior)을 함께 고려하여 사후확률을 최대화하는 θ를 선택한다.", "항상 MLE보다 큰 우도값을 갖는 θ를 고른다."], "a": 2, "exp": "MAP는 우도 P(D|θ)에 사전분포 P(θ)를 곱한 값을 최대화하는 θ를 선택한다."}, {"id": 27, "sec": "2.2", "diff": "중급", "q": "데이터의 양에 따른 MLE와 MAP의 관계로 옳은 것은?", "opts": ["데이터가 많아질수록 MAP와 MLE의 차이가 커진다.", "데이터가 적을 때는 사전분포가 추정값을 안정적인 쪽으로 끌어당기고, 데이터가 많아지면 우도가 지배적이 되어 MLE와 거의 같아진다.", "데이터의 양과 관계없이 두 추정은 항상 동일하다.", "데이터가 적을수록 MLE가 더 안정적이다."], "a": 1, "exp": "데이터가 적을 때 사전분포가 보정 역할을 하고, 데이터가 많아지면 우도가 지배해 MAP는 MLE에 수렴한다."}, {"id": 28, "sec": "2.2", "diff": "중급", "q": "Add-k 스무딩에 대한 설명으로 옳은 것은?", "opts": ["확률이 0인 사건을 아예 제거해 버린다.", "모든 사건에 가상의 빈도 k를 더해 주며, k=1인 경우를 라플라스(add-one) 스무딩이라 한다.", "k값이 커질수록 MLE에 가까워진다.", "빈도가 큰 사건에서만 k를 빼 준다."], "a": 1, "exp": "Add-k 스무딩은 모든 사건에 가상 빈도 k를 더해 0 확률을 없애며, k=1이면 라플라스(add-one) 스무딩이다."}, {"id": 29, "sec": "2.2", "diff": "심화", "q": "스무딩이 MAP 추정과 동치라고 말하는 이유로 가장 적절한 것은?", "opts": ["\"모든 사건은 조금씩은 가능하다\"는 사전 믿음을 가상의 빈도로 반영한 것이기 때문", "스무딩이 확률의 합을 1보다 크게 만들기 때문", "스무딩이 데이터를 전혀 사용하지 않기 때문", "스무딩이 우도만을 최대화하기 때문"], "a": 0, "exp": "가상 빈도를 더하는 것은 \"모든 사건은 조금씩 가능하다\"는 사전분포를 반영하는 것과 같으므로 MAP 추정과 동치다."}, {"id": 30, "sec": "2.2", "diff": "중급", "q": "실무에서 사용하는 더 정교한 스무딩 기법으로 강의자료가 제시한 것은?", "opts": ["BLEU, ROUGE", "Word2Vec, GloVe", "Adam, RMSProp", "Kneser-Ney, Good-Turing"], "a": 3, "exp": "Add-k보다 정교한 스무딩으로 Kneser-Ney, Good-Turing 등이 실무에서 쓰인다."}, {"id": 31, "sec": "2.2", "diff": "심화", "q": "스무딩에 대응하는 딥러닝에서의 개념으로 강의자료가 제시한 것은?", "opts": ["경사 하강법", "학습률 스케줄링", "가중치 감쇠(weight decay), 라벨 스무딩 등의 정규화", "배치 정규화와 드롭아웃만"], "a": 2, "exp": "사전지식으로 추정을 안정화한다는 점에서 스무딩은 딥러닝의 가중치 감쇠·라벨 스무딩 같은 정규화에 대응한다."}, {"id": 32, "sec": "2.2", "diff": "중급", "q": "MLE와 MAP의 목적함수를 바르게 비교한 것은?", "opts": ["MLE는 P(D|θ)P(θ)를, MAP는 P(D|θ)를 최대화한다.", "둘 다 P(θ)만을 최대화한다.", "MLE는 P(D|θ)를, MAP는 P(D|θ)P(θ)를 최대화한다.", "MLE는 P(θ|D)를, MAP는 P(θ)를 최대화한다."], "a": 2, "exp": "MLE의 목적함수는 우도 P(D|θ), MAP의 목적함수는 우도에 사전분포를 곱한 P(D|θ)P(θ)다."}, {"id": 33, "sec": "2.2", "diff": "중급", "q": "MLE와 MAP의 특징 비교로 옳지 않은 것은?", "opts": ["자연어처리에서 MLE의 예는 n-gram 빈도 비율, MAP의 예는 Add-k 스무딩이다.", "MLE는 사전지식을 사용하지 않는다.", "MAP는 데이터가 적을 때 과적합과 0 확률 문제가 더 심해진다.", "MAP는 사전분포 P(θ)로 사전지식을 반영한다."], "a": 2, "exp": "데이터가 적을 때 과적합·0 확률 문제가 생기는 쪽은 MLE이고, MAP는 사전분포가 보정해 주어 안정적이다."}, {"id": 34, "sec": "2.3", "diff": "기초", "q": "정보이론의 출발점에 대한 설명으로 옳은 것은?", "opts": ["촘스키가 제안한 이론으로, 형식문법에서 출발했다.", "베이즈가 제안한 이론으로, 사후확률 갱신에서 출발했다.", "Shannon이 제안한 이론으로, 데이터의 압축률과 전송률을 최대화하는 수학적 모델에서 출발했다.", "Zipf가 제안한 이론으로, 단어 빈도 분포에서 출발했다."], "a": 2, "exp": "정보이론은 Shannon이 데이터의 압축률과 전송률을 최대화하기 위한 수학적 모델로 제안했다."}, {"id": 35, "sec": "2.3", "diff": "기초", "q": "정보량(self-information)에 대한 설명으로 옳은 것은?", "opts": ["정보량은 항상 음수이다.", "잘 일어나지 않는 사건일수록 정보량이 크다.", "모든 사건의 정보량은 동일하다.", "자주 일어나는 사건일수록 정보량이 크다."], "a": 1, "exp": "\"오늘 해가 떴다\"는 정보량이 낮고, \"7월에 눈이 왔다\"처럼 드문 사건일수록 정보량이 크다."}, {"id": 36, "sec": "2.3", "diff": "기초", "q": "엔트로피(entropy)에 대한 설명으로 옳은 것은?", "opts": ["확률변수가 갖는 정보량의 평균적인 기댓값으로, 값이 높을수록 불확실성이 높다.", "확률변수가 가질 수 있는 값의 개수를 뜻한다.", "두 분포 사이의 거리를 재는 지표이다.", "값이 높을수록 예측이 쉬워진다는 뜻이다."], "a": 0, "exp": "엔트로피는 정보량의 평균적인 기댓값이며, 값이 높을수록 불확실성이 높다."}, {"id": 37, "sec": "2.3", "diff": "중급", "q": "엔트로피와 분포의 모양에 대한 설명으로 옳은 것은?", "opts": ["분포가 한쪽으로 치우칠수록 엔트로피가 커진다.", "분포의 모양과 엔트로피는 무관하다.", "엔트로피는 선택지의 개수와 무관하다.", "분포가 균등할수록(예측하기 어려울수록) 엔트로피가 커진다."], "a": 3, "exp": "앞뒤 확률이 같은 동전(0.5, 0.5)은 1.00 bits로 가장 불확실하고, 편향된 동전(0.9, 0.1)은 0.47 bits로 낮아진다."}, {"id": 38, "sec": "2.3", "diff": "심화", "q": "강의자료의 엔트로피 계산 예제에 대한 설명으로 옳지 않은 것은?", "opts": ["앞뒤 같은 동전 (0.5, 0.5)의 엔트로피는 1.00 bits이다.", "거의 확정된 동전 (0.99, 0.01)은 엔트로피가 가장 커서 예측이 가장 어렵다.", "공정한 주사위(1/6 × 6)의 엔트로피는 약 2.58 bits로, 선택지가 많을수록 커진다.", "편향된 동전 (0.9, 0.1)의 엔트로피는 약 0.47 bits로 비교적 예측 가능하다."], "a": 1, "exp": "(0.99, 0.01)은 엔트로피가 약 0.08 bits로 가장 작으며 결과가 거의 확실하다."}, {"id": 39, "sec": "2.3", "diff": "중급", "q": "결합 엔트로피 H(X,Y)와 조건부 엔트로피 H(Y|X)의 의미를 바르게 설명한 것은?", "opts": ["H(X,Y)는 두 확률 변수를 함께 볼 때의 불확실성, H(Y|X)는 X를 알고 난 뒤에도 남아 있는 Y의 불확실성이다.", "H(X,Y)는 X를 알고 난 뒤 남은 불확실성, H(Y|X)는 두 변수를 함께 볼 때의 불확실성이다.", "둘 다 두 분포 사이의 차이를 재는 지표이다.", "둘 다 항상 같은 값을 갖는다."], "a": 0, "exp": "결합 엔트로피는 두 변수를 함께 볼 때의 불확실성, 조건부 엔트로피는 한쪽을 알고 난 뒤 남은 불확실성이다."}, {"id": 40, "sec": "2.3", "diff": "중급", "q": "상호정보량 I(X;Y)의 의미로 옳은 것은?", "opts": ["두 변수의 결합 엔트로피의 합", "X를 알게 되어 줄어드는 Y의 불확실성, 즉 두 변수의 의존성", "분포 P를 분포 Q로 표현할 때 필요한 평균 비트 수", "확률변수가 취할 수 있는 값의 개수"], "a": 1, "exp": "상호정보량은 X를 알게 되면서 줄어드는 Y의 불확실성으로, 두 변수의 의존성을 나타낸다."}, {"id": 41, "sec": "2.3", "diff": "중급", "q": "PMI(점별 상호정보량)에 대한 설명으로 옳은 것은?", "opts": ["두 단어가 우연보다 얼마나 자주 함께 나타나는가를 나타내며, 연어 추출과 PPMI 행렬 구성에 쓰인다.", "두 분포의 차이를 재는 비대칭 지표이다.", "한 단어가 전체 코퍼스에서 몇 번 등장했는가를 나타낸다.", "문서의 길이를 정규화하는 가중치이다."], "a": 0, "exp": "PMI는 두 단어의 공기(共起)가 우연 수준보다 얼마나 잦은지를 재며, \"미역\"-\"국\"은 PMI가 높고 \"미역\"-\"컴퓨터\"는 낮다."}, {"id": 42, "sec": "2.3", "diff": "심화", "q": "\"미역\"-\"국\"의 PMI가 \"미역\"-\"컴퓨터\"의 PMI보다 높은 이유로 가장 적절한 것은?", "opts": ["PMI가 단어의 의미를 직접 사전에서 찾아 계산하기 때문", "\"미역\"과 \"국\"이 각각의 출현 확률에서 기대되는 것보다 훨씬 자주 함께 나타나기 때문", "\"미역\"이 \"컴퓨터\"보다 코퍼스에서 더 자주 등장하기 때문", "\"국\"이 \"컴퓨터\"보다 글자 수가 적기 때문"], "a": 1, "exp": "PMI는 두 단어의 공기 빈도를 각자의 출현 확률로 정규화하므로, 우연보다 훨씬 자주 붙어 나오는 연어에서 값이 커진다."}, {"id": 43, "sec": "2.3", "diff": "중급", "q": "교차 엔트로피 H(P,Q)의 의미로 옳은 것은?", "opts": ["참 분포 P를 모델 분포 Q로 표현할 때 필요한 평균 비트 수", "두 분포가 독립인 정도", "모델 분포 Q 자체의 불확실성", "확률변수의 평균값"], "a": 0, "exp": "교차 엔트로피는 참 분포 P를 모델 분포 Q로 표현할 때 드는 평균 비트 수이며, 딥러닝 분류·언어모델 학습의 표준 손실함수다."}, {"id": 44, "sec": "2.3", "diff": "심화", "q": "교차 엔트로피를 줄이는 것과 KL-divergence를 줄이는 것이 같은 이유는?", "opts": ["두 지표가 서로 무관하기 때문", "KL-divergence가 항상 0이기 때문", "교차 엔트로피가 항상 KL-divergence보다 작기 때문", "H(P,Q) = H(P) + KL(P∥Q)인데 P는 데이터가 정해 주는 고정 분포라 H(P)가 상수이기 때문"], "a": 3, "exp": "H(P,Q) = H(P) + KL(P∥Q)이고 H(P)는 데이터가 정해 주는 상수이므로, 교차 엔트로피 최소화는 KL 최소화와 같다."}, {"id": 45, "sec": "2.3", "diff": "중급", "q": "KL-divergence에 대한 설명으로 옳은 것은?", "opts": ["값이 클수록 두 분포가 일치한다는 뜻이다.", "두 분포가 얼마나 다른지 측정하며 항상 0 이상이고, 비대칭이므로 거리가 아니라 발산이라 부른다.", "두 분포 사이의 대칭적인 거리(distance)이므로 순서를 바꿔도 값이 같다.", "음수 값을 가질 수 있다."], "a": 1, "exp": "KL-divergence는 항상 0 이상이고 값이 낮을수록 두 분포가 일치하며, 비대칭이라 거리가 아닌 발산이라 부른다."}, {"id": 46, "sec": "2.3", "diff": "중급", "q": "KL-divergence가 활용되는 사례로 강의자료가 제시한 것은?", "opts": ["지식 증류, 강화학습(PPO)의 정책 제약", "단어 임베딩의 초기화", "문서의 TF-IDF 가중치 계산", "문장의 형태소 분석"], "a": 0, "exp": "KL-divergence는 지식 증류와 강화학습(PPO)의 정책 제약 등에서 널리 쓰인다."}, {"id": 47, "sec": "2.3", "diff": "기초", "q": "Perplexity(PPL)에 대한 설명으로 옳은 것은?", "opts": ["두 분포의 비대칭 발산을 나타내는 지표이다.", "교차 엔트로피에 로그를 한 번 더 취한 값으로, 높을수록 좋은 모델이다.", "교차 엔트로피를 지수로 되돌린 값으로, 낮을수록 좋은 언어모델이다.", "모델 파라미터의 개수를 나타내는 지표이다."], "a": 2, "exp": "Perplexity는 언어모델의 표준 평가 지표로, 교차 엔트로피를 지수로 되돌린 값이며 낮을수록 좋다."}, {"id": 48, "sec": "2.3", "diff": "중급", "q": "Perplexity의 직관적 해석으로 가장 적절한 것은?", "opts": ["모델이 다음 단어를 고를 때 평균 몇 개의 후보 사이에서 헷갈리는가", "모델이 한 문장을 처리하는 데 걸리는 시간", "모델이 학습에 사용한 문장의 총 개수", "모델이 사용하는 어휘 사전의 크기"], "a": 0, "exp": "PPL은 \"모델이 다음 단어를 고를 때 평균 몇 개의 후보 사이에서 헷갈리는가\"로 해석할 수 있다."}, {"id": 49, "sec": "2.4", "diff": "기초", "q": "자연어처리에서 단어와 문장을 벡터로 바꾸는 이유로 옳은 것은?", "opts": ["벡터로 바꾸면 맞춤법 오류가 자동으로 교정되기 때문", "벡터가 사람이 읽기에 더 편하기 때문", "벡터가 문자열보다 저장 공간을 적게 쓰기 때문", "컴퓨터는 문자열을 그대로 계산할 수 없기 때문"], "a": 3, "exp": "컴퓨터는 문자열을 그대로 계산할 수 없으므로 단어와 문장을 수치 벡터로 바꾸어야 한다."}, {"id": 50, "sec": "2.4", "diff": "중급", "q": "원-핫 표현과 분산 표현(임베딩)의 비교로 옳은 것은?", "opts": ["원-핫은 단순하지만 차원이 크고 의미 정보를 담지 못하며, 분산 표현은 조밀한 저차원 벡터로 의미의 유사성을 기하 구조로 표현한다.", "분산 표현은 각 차원이 특정 단어 하나에 대응한다.", "원-핫 표현은 단어 사이의 의미적 유사도를 잘 반영한다.", "원-핫은 조밀한 저차원 벡터이고, 분산 표현은 희소한 고차원 벡터이다."], "a": 0, "exp": "원-핫은 차원이 크고 의미 정보를 담지 못하지만, 분산 표현은 조밀한 저차원 벡터로 의미 유사성을 기하적으로 표현한다."}, {"id": 51, "sec": "2.4", "diff": "기초", "q": "노름(norm)에 대한 설명으로 옳은 것은?", "opts": ["벡터의 길이를 뜻하며, 문서가 길수록 빈도 벡터의 노름이 커진다.", "두 벡터의 방향 일치 정도를 나타내는 스칼라이다.", "벡터를 다른 공간으로 옮기는 변환이다.", "두 벡터가 이루는 각도를 뜻한다."], "a": 0, "exp": "노름은 벡터의 길이로, 문서가 길수록 단어 빈도 벡터의 노름이 커진다."}, {"id": 52, "sec": "2.4", "diff": "중급", "q": "내적(dot product)에 대한 설명으로 옳은 것은?", "opts": ["두 벡터의 크기와 방향의 일치 정도를 함께 반영하는 스칼라 값이다.", "결과가 항상 벡터인 연산이다.", "두 벡터의 길이만을 반영하는 값이다.", "두 벡터의 각도만을 반영하는 값이다."], "a": 0, "exp": "내적은 크기와 방향의 일치 정도를 함께 반영하며, 방향만 보려면 노름으로 나눈 코사인 유사도를 쓴다."}, {"id": 53, "sec": "2.4", "diff": "중급", "q": "코사인 유사도를 사용하는 가장 큰 이유는?", "opts": ["내적을 두 벡터의 노름으로 나누어 각도만 남기므로, 문서 길이나 빈도 크기의 영향을 제거할 수 있기 때문", "항상 0 또는 1의 값만 갖기 때문", "벡터의 차원 수를 줄여 주기 때문", "계산이 내적보다 훨씬 빠르기 때문"], "a": 0, "exp": "코사인 유사도는 길이의 영향을 제거하고 \"의미의 방향\"만 비교하므로 검색·문서 유사도·임베딩 기반 추천에 널리 쓰인다."}, {"id": 54, "sec": "2.4", "diff": "중급", "q": "행렬(matrix)의 역할에 대한 설명으로 옳은 것은?", "opts": ["확률분포를 정규화하는 함수이다.", "벡터의 길이를 재는 스칼라 값이다.", "여러 벡터를 한꺼번에 다루거나, 벡터를 다른 공간으로 옮기는 선형변환의 역할을 한다.", "단어를 사전 순으로 정렬하는 자료구조이다."], "a": 2, "exp": "행렬은 여러 벡터를 한꺼번에 다루거나 벡터를 다른 공간으로 옮기는 변환이다."}, {"id": 55, "sec": "2.4", "diff": "심화", "q": "임베딩 조회(lookup)를 선형대수로 설명한 것으로 옳은 것은?", "opts": ["임베딩 행렬의 역행렬을 구해 단어를 복원한다.", "원-핫 벡터끼리 내적해 유사도를 구한다.", "원-핫 벡터에 임베딩 행렬을 곱하면 해당 단어의 행이 선택된다.", "임베딩 행렬의 모든 행을 더해 평균을 낸다."], "a": 2, "exp": "원-핫 벡터에 임베딩 행렬을 곱하는 연산은 해당 단어에 대응하는 행 하나를 선택하는 것과 같다."}, {"id": 56, "sec": "2.4", "diff": "중급", "q": "신경망의 한 층(layer)을 선형대수로 표현한 것으로 옳은 것은?", "opts": ["확률의 곱 + 로그 변환", "특이값 분해 + 정규화", "행렬 곱만으로 구성", "행렬 곱 + 편향 + 비선형 함수"], "a": 3, "exp": "신경망의 한 층은 행렬 곱에 편향을 더하고 비선형 함수를 적용하는 구조이며, 여러 문장을 행렬로 쌓아 GPU에서 배치 처리한다."}, {"id": 57, "sec": "2.4", "diff": "중급", "q": "단어-문서 행렬(Term-Document Matrix)에 대한 설명으로 옳은 것은?", "opts": ["단어의 품사 정보를 담은 사전이다.", "문서 집합을 단어 × 문서 행렬로 표현하면 텍스트가 선형대수의 대상이 된다.", "한 문서를 여러 개의 스칼라 값으로 요약한 것이다.", "문장의 구문 구조를 나타낸 트리이다."], "a": 1, "exp": "문서 집합을 단어 × 문서 행렬로 표현하면 텍스트를 벡터·행렬 연산으로 다룰 수 있게 된다."}, {"id": 58, "sec": "2.4", "diff": "중급", "q": "TF-IDF의 핵심 아이디어로 옳은 것은?", "opts": ["모든 문서에 흔하게 나오는 단어의 가중치를 높인다.", "단어의 길이가 길수록 가중치를 높인다.", "자주 나오지만 모든 문서에 흔한 단어의 가중치를 낮춘다.", "문서에 한 번도 나오지 않은 단어의 가중치를 높인다."], "a": 2, "exp": "TF-IDF는 tf(t,d) × log(N/df(t)) 형태로, 여러 문서에 흔한 단어의 가중치를 낮춰 변별력 있는 단어를 부각한다."}, {"id": 59, "sec": "2.4", "diff": "심화", "q": "TF-IDF 식 tfidf(t,d) = tf(t,d) × log(N / df(t))에서 df(t)가 커질 때 나타나는 변화는?", "opts": ["log(N/df(t)) 값이 커져 그 단어의 가중치가 높아진다.", "tf(t,d) 값이 함께 커진다.", "log(N/df(t)) 값이 작아져 그 단어의 가중치가 낮아진다.", "가중치가 변하지 않는다."], "a": 2, "exp": "df(t)는 그 단어를 포함한 문서 수이므로, 흔한 단어일수록 df가 커지고 log(N/df) 즉 IDF가 작아져 가중치가 낮아진다."}, {"id": 60, "sec": "2.4", "diff": "중급", "q": "단어-문서 행렬에 차원 축소가 필요한 이유로 옳은 것은?", "opts": ["단어의 순서를 복원해야 하기 때문", "행렬이 매우 크고 희소하므로 핵심 의미 구조만 남기고 압축할 필요가 있기 때문", "행렬의 값이 모두 0이어서 계산할 수 없기 때문", "행렬이 항상 정방행렬이어야 하기 때문"], "a": 1, "exp": "단어-문서 행렬은 크고 희소하므로 SVD 등으로 핵심 의미 구조만 남겨 압축한다."}, {"id": 61, "sec": "2.4", "diff": "중급", "q": "특이값 분해(SVD)를 이용한 잠재 의미 분석(LSA)에 대한 설명으로 옳은 것은?", "opts": ["단어의 품사 정보를 이용해 차원을 줄이는 방법이다.", "상위 k개의 특이값만 남겨 차원을 줄이면, 표면 형태가 달라도 문맥이 비슷한 단어의 유사도를 잡아낼 수 있다.", "모든 특이값을 남겨야 의미 구조가 드러난다.", "문서의 길이를 정규화하는 기법이다."], "a": 1, "exp": "SVD로 상위 k개 특이값만 남기면 LSA가 되며, 문맥이 비슷한 단어가 같은 축으로 모여 표면 형태가 달라도 유사도를 포착한다."}, {"id": 62, "sec": "2.4", "diff": "심화", "q": "LSA(SVD 기반 잠재 의미 분석)의 한계로 강의자료가 지적한 것은?", "opts": ["희소한 행렬을 전혀 다룰 수 없다는 문제가 있다.", "단어의 빈도 정보를 전혀 사용할 수 없다는 문제가 있다.", "문맥이 비슷하다는 이유로 동의어뿐 아니라 반의어도 함께 모이는 문제가 있다.", "차원을 줄일수록 계산량이 오히려 늘어난다는 문제가 있다."], "a": 2, "exp": "문맥이 비슷한 단어가 같은 축으로 모이므로, 동의어뿐 아니라 반의어까지 함께 모이는 것이 한계로 지적된다."}, {"id": 63, "sec": "2.4", "diff": "심화", "q": "소프트맥스가 확률과 선형대수가 만나는 지점이라고 설명하는 이유로 옳은 것은?", "opts": ["벡터의 노름을 계산해 길이를 정규화하기 때문", "분자는 문맥 벡터와 단어 벡터의 내적(선형대수)이고, 분모는 전체 어휘에 대한 정규화로 확률의 합을 1로 만들기 때문", "분자와 분모 모두 확률의 곱으로만 이루어져 있기 때문", "행렬의 특이값을 이용해 차원을 줄이기 때문"], "a": 1, "exp": "소프트맥스는 내적으로 만든 점수를 전체 어휘에 대해 정규화해 확률분포로 바꾼다. 즉 언어모델은 선형대수로 점수를 만들고, 확률로 해석하며, 교차 엔트로피로 학습한다."}, {"id": 64, "sec": "2.5", "diff": "기초", "q": "언어의 층위를 아래(구체)에서 위(추상)로 바르게 나열한 것은?", "opts": ["형태론 → 음운론 → 의미론 → 통사론 → 화용론", "음운론 → 형태론 → 통사론 → 의미론 → 화용론", "화용론 → 의미론 → 통사론 → 형태론 → 음운론", "통사론 → 형태론 → 음운론 → 화용론 → 의미론"], "a": 1, "exp": "언어는 소리(음운론)에서 맥락(화용론)까지 음운론 → 형태론 → 통사론 → 의미론 → 화용론의 층위로 이루어지며 위로 갈수록 추상적이다."}, {"id": 65, "sec": "2.5", "diff": "중급", "q": "언어의 층위와 그 내용의 연결로 옳지 않은 것은?", "opts": ["의미론(Semantics) — 단어/문장의 의미", "음운론(Phonology) — 소리 / 음절", "통사론(Syntax) — 맥락 · 화행 · 함축", "형태론(Morphology) — 형태소 · 어절 · 품사"], "a": 2, "exp": "맥락·화행·함축은 화용론(Pragmatics)의 내용이다. 통사론은 구구조·의존구조를 다룬다."}, {"id": 66, "sec": "2.5", "diff": "기초", "q": "자연어처리 연구에 언어학이 필요한 이유로 가장 적절한 것은?", "opts": ["언어학 없이는 확률 계산이 불가능하기 때문", "무엇을 모델링할 것인지 정하려면 언어의 구조와 단위를 알아야 하기 때문", "언어학이 코퍼스를 자동으로 수집해 주기 때문", "언어학이 컴퓨터의 연산 속도를 높여 주기 때문"], "a": 1, "exp": "수학은 불확실한 언어를 확률·벡터로 계산하게 해 주고, 언어학은 무엇을 모델링할 것인가 — 언어의 구조와 단위 — 를 알려 준다."}, {"id": 67, "sec": "2.5", "diff": "중급", "q": "언어의 층위에 대한 설명으로 옳은 것은?", "opts": ["층위가 높아질수록 더 구체적이고 물리적인 단위를 다룬다.", "각 층위마다 대응되는 자연어처리 과제가 존재한다.", "층위는 서로 독립적이어서 어느 하나만 다루면 충분하다.", "자연어처리는 음운론 층위만을 다룬다."], "a": 1, "exp": "언어는 소리에서 맥락까지 여러 층위로 이루어지며, 각 층위마다 대응되는 자연어처리 과제가 있다."}, {"id": 68, "sec": "2.6", "diff": "기초", "q": "음절(syllable)의 정의로 옳은 것은?", "opts": ["한 개 이상의 형태소가 모여 구성된 단위", "의미를 가지는 가장 작은 단위", "언어를 말하고 들을 때 하나의 덩어리로 여겨지는 최소 발화 단위", "문법적 성질에 따라 단어를 분류한 갈래"], "a": 2, "exp": "음절은 말하고 들을 때 하나의 덩어리로 인식되는 최소 발화 단위이며, 자연어처리에서는 \"음\", \"절\" 같은 한 글자 단위를 말한다."}, {"id": 69, "sec": "2.6", "diff": "중급", "q": "한국어 음절의 구성에 대한 설명으로 옳은 것은?", "opts": ["자음 단독으로도 음절을 이룰 수 있다.", "초성과 종성은 모음, 중성은 자음이다.", "초성·중성·종성으로 이루어지는 것이 기본이며, 초성과 종성은 자음, 중성은 모음이고 모음 단독 음절도 가능하다.", "반드시 초성·중성·종성이 모두 있어야 한다."], "a": 2, "exp": "한국어 음절은 초성(자음)·중성(모음)·종성(자음)이 기본이며, 종성이 없거나 모음 단독으로도 음절이 성립한다."}, {"id": 70, "sec": "2.6", "diff": "기초", "q": "형태소(morpheme)의 정의로 옳은 것은?", "opts": ["띄어쓰기로 구분되는 단위이다.", "의미를 가지는 가장 작은 단위로, 더 쪼개면 기능이나 의미를 갖지 않게 된다.", "문장에서 주체가 되는 자리에 쓰이는 단어이다.", "하나의 덩어리로 발화되는 최소 소리 단위이다."], "a": 1, "exp": "형태소는 의미를 가지는 가장 작은 단위로, 더 쪼개면 기능이나 의미를 잃는다."}, {"id": 71, "sec": "2.6", "diff": "중급", "q": "실질 형태소(어휘 형태소)에 해당하는 것으로만 묶인 것은?", "opts": ["명사·대명사·수사·관형사·부사·감탄사, 그리고 용언의 어간", "어미와 접사", "조사·어미·접사", "조사와 선어말 어미"], "a": 0, "exp": "실질적인 의미를 갖는 것이 실질(어휘) 형태소이고, 조사·어미·접사처럼 문법적 기능을 하는 것이 형식(문법) 형태소다."}, {"id": 72, "sec": "2.6", "diff": "중급", "q": "이형태(allomorph)에 대한 설명으로 옳은 것은?", "opts": ["의미를 갖지 않는 최소 소리 단위이다.", "형태소가 여러 개 결합해 어절을 이루는 것이다.", "서로 다른 두 형태소가 같은 의미를 갖는 것이다.", "하나의 형태소가 환경에 따라 다른 모습으로 나타나는 것이다. (예: 이/가, 을/를)"], "a": 3, "exp": "이형태는 하나의 형태소가 환경에 따라 다른 모습으로 실현되는 것으로, 주격 조사 '이/가', 목적격 조사 '을/를'이 대표적이다."}, {"id": 73, "sec": "2.6", "diff": "심화", "q": "\"철수가 학교에 갔다\"의 형태소 분석 결과에 대한 설명으로 옳은 것은?", "opts": ["'철수'와 '학교'는 형식 형태소이다.", "'철수(NNP)·학교(NNG)·가(동사 어간)'는 실질 형태소이고, '가(주격조사)·에(부사격조사)·았(선어말어미)·다(종결어미)'는 형식 형태소이다.", "한 어절이 반드시 하나의 형태소에만 대응한다.", "'가', '에', '았', '다'는 모두 실질 형태소이다."], "a": 1, "exp": "철수/NNP + 가/JKS + 학교/NNG + 에/JKB + 가/VV + 았/EP + 다/EF로 분석되며, 명사와 동사 어간이 실질 형태소, 조사와 어미가 형식 형태소다."}, {"id": 74, "sec": "2.6", "diff": "기초", "q": "어절에 대한 설명으로 옳은 것은?", "opts": ["한 개 이상의 형태소가 모여 구성된 단위로, 글에서는 띄어쓰기 단위와 거의 일치한다.", "의미를 가지는 가장 작은 단위이다.", "초성·중성·종성으로 이루어진 발화 단위이다.", "문법적 성질에 따라 나눈 단어의 갈래이다."], "a": 0, "exp": "어절은 한 개 이상의 형태소가 모인 단위로, 발화할 때 끊어 말하는 단위이며 글에서는 띄어쓰기 단위와 거의 일치한다."}, {"id": 75, "sec": "2.6", "diff": "심화", "q": "교착어인 한국어에서 어절을 그대로 어휘 단위로 사용할 때 생기는 문제는?", "opts": ["조사가 계속 붙어 어절의 종류가 폭발적으로 많아지고 미등록어(OOV)가 급증한다.", "어절마다 의미가 하나로 고정되어 중의성이 사라진다.", "어절의 종류가 지나치게 적어 표현력이 부족해진다.", "띄어쓰기 정보를 전혀 활용할 수 없게 된다."], "a": 0, "exp": "\"학교\" + \"에서\" + \"는\"처럼 조사가 계속 붙어 어절 종류가 폭발하므로 OOV가 급증하며, 형태소 분석이나 서브워드 분절이 필요하다."}, {"id": 76, "sec": "2.6", "diff": "심화", "q": "영어와 한국어의 토큰화 난이도 차이에 대한 설명으로 옳은 것은?", "opts": ["영어는 굴절이 약화되어 분석적 성격이 강하고 기능어가 독립 단어로 분리되므로 공백 토큰화만으로도 상당 부분 처리된다.", "두 언어 모두 토큰화 난이도에 차이가 없다.", "한국어는 기능어가 독립 단어로 분리되어 공백 토큰화로 충분하다.", "영어도 교착어이므로 한국어와 동일한 형태소 분석이 반드시 필요하다."], "a": 0, "exp": "영어는 굴절어이지만 굴절이 약화되어 분석적 성격이 강하고 기능어가 독립 단어로 분리되므로 공백 토큰화만으로 상당 부분 처리할 수 있다."}, {"id": 77, "sec": "2.6", "diff": "중급", "q": "한국어 품사 분류 기준과 그 결과의 연결로 옳은 것은?", "opts": ["의미에 따라 가변어와 불변어, 형태에 따라 9품사로 나눈다.", "기능에 따라 5언, 의미에 따라 9품사, 형태에 따라 가변어와 불변어로 나눈다.", "기능에 따라 9품사, 의미에 따라 5언으로 나눈다.", "형태에 따라 5언, 기능에 따라 가변어와 불변어로 나눈다."], "a": 1, "exp": "기능에 따라 체언·수식언·관계언·독립언·용언의 5언, 의미에 따라 명사·대명사·수사·관형사·부사·조사·감탄사·동사·형용사의 9품사, 형태에 따라 가변어와 불변어로 나눈다."}, {"id": 78, "sec": "2.6", "diff": "중급", "q": "5언과 그 설명의 연결로 옳지 않은 것은?", "opts": ["관계언 — 자립 형태소에 붙어 문법적 관계를 나타내는 의존 형태소인 조사", "체언 — 문장에서 주체가 되는 자리에 쓰이는 명사·대명사·수사", "용언 — 어미를 활용하여 서술어 기능을 하는 동사·형용사", "독립언 — 체언 앞에서 체언을 꾸며 주는 관형사"], "a": 3, "exp": "독립언은 다른 성분과 관계없이 독립적으로 쓰이는 감탄사다. 체언을 꾸미는 관형사는 수식언에 속한다."}, {"id": 79, "sec": "2.6", "diff": "중급", "q": "조사(관계언)의 하위 분류로 옳은 것은?", "opts": ["종결어미, 연결어미, 전성어미", "격조사, 접속조사, 보조사", "성상 관형사, 지시 관형사, 수 관형사", "자동사, 타동사, 보조동사"], "a": 1, "exp": "조사는 격조사(주격·목적격·관형격·부사격·호격·보격·서술격), 접속조사, 보조사로 나뉜다."}, {"id": 80, "sec": "2.6", "diff": "중급", "q": "수식언에 대한 설명으로 옳은 것은?", "opts": ["수식언은 조사가 붙어야만 쓰일 수 있다.", "관형사는 체언 앞에서 체언을 꾸미고, 부사는 주로 용언이나 문장 전체를 꾸민다.", "수식언은 활용하여 서술어 기능을 한다.", "관형사는 용언을 꾸미고, 부사는 체언을 꾸민다."], "a": 1, "exp": "관형사는 체언 앞에서 체언을 꾸미고(성상·지시·수 관형사), 부사는 주로 용언이나 문장 전체를 꾸민다."}, {"id": 81, "sec": "2.6", "diff": "중급", "q": "용언의 구성과 어미에 대한 설명으로 옳은 것은?", "opts": ["어말 어미에는 시제 선어말 어미와 높임 선어말 어미가 있다.", "용언은 변하지 않는 어간과 변하는 어미로 이루어지며, 어미는 어말 어미와 선어말 어미로 나뉜다.", "용언은 어간 없이 어미로만 이루어진다.", "선어말 어미는 어절의 맨 끝에 온다."], "a": 1, "exp": "용언은 어간 + 어미로 이루어지며, 어말 어미는 종결·연결·전성 어미로, 선어말 어미는 시제(-았/었-, -겠-)와 높임(-시-) 등으로 나뉜다."}, {"id": 82, "sec": "2.6", "diff": "심화", "q": "용언의 활용이 한국어 자연어처리에 주는 영향으로 옳은 것은?", "opts": ["표면형이 하나로 고정되어 분석이 오히려 쉬워진다.", "표면형의 종류가 매우 많아지므로 형태소 분석기의 원형 복원 단계가 필요하며, 이는 영어의 lemmatization에 대응한다.", "활용 때문에 조사를 분리할 필요가 없어진다.", "활용은 의미에 영향을 주지 않으므로 무시해도 된다."], "a": 1, "exp": "활용 때문에 표면형이 매우 많아지므로 형태소 분석기가 원형을 복원하며, 이는 영어의 lemmatization에 대응한다."}, {"id": 83, "sec": "2.6", "diff": "기초", "q": "품사 태깅(POS tagging)의 정의로 옳은 것은?", "opts": ["문맥을 보고 각 형태소에 올바른 품사를 부여하는 과제", "단어를 벡터로 변환하는 과제", "문장의 감성을 판별하는 과제", "문장을 어절 단위로 나누는 과제"], "a": 0, "exp": "품사 태깅은 문맥을 고려해 각 형태소에 올바른 품사를 부여하는 과제다."}, {"id": 84, "sec": "2.6", "diff": "심화", "q": "\"나는 학생이다\"와 \"새가 하늘을 나는다\"에서 '나는'의 분석이 달라지는 것이 보여 주는 것은?", "opts": ["형태소 분석은 문맥을 볼 필요가 없다는 점", "한국어에는 중의성이 존재하지 않는다는 점", "표기가 같아도 문맥에 따라 분석 결과가 달라지므로 자동 품사 태깅이 필요하다는 점", "품사 태깅이 사전 검색만으로 해결된다는 점"], "a": 2, "exp": "앞의 '나는'은 나/NP + 는/JX(대명사 + 보조사), 뒤의 '나는'은 날/VV + 는/ETM(동사 어간 + 관형형어미)로 분석되므로 문맥 기반 자동 분석이 필요하다."}, {"id": 85, "sec": "2.6", "diff": "중급", "q": "한국어 형태소 분석기의 태그셋에 대한 설명으로 옳은 것은?", "opts": ["Komoran과 Mecab-ko는 세종 태그셋을 따르고, Okt는 자체 태그셋을 사용한다.", "태그셋은 분석기마다 달라도 태그 이름이 항상 같다.", "모든 한국어 형태소 분석기가 동일한 세종 태그셋을 사용한다.", "Okt가 세종 태그셋을 따르고 Komoran은 자체 태그셋을 쓴다."], "a": 0, "exp": "대표 태그셋인 세종 태그셋은 Komoran·Mecab-ko가 따르며, Okt는 자체 태그셋을 사용한다."}, {"id": 86, "sec": "2.7", "diff": "기초", "q": "구구조(phrase structure)에 대한 설명으로 옳은 것은?", "opts": ["문장 요소들이 서로 결합하여 이루는 계층적 구조로, 수형도나 괄호 표기로 나타낸다.", "단어를 문법적 성질에 따라 분류한 체계이다.", "단어들이 서로 지배소-의존소 관계로 연결된 구조이다.", "문장의 의미역을 표시한 구조이다."], "a": 0, "exp": "구구조는 문장 요소들이 결합해 이루는 계층 구조이며, 구성 요소들이 선행 관계와 지배 관계를 맺고 수형도나 괄호로 표기된다."}, {"id": 87, "sec": "2.7", "diff": "중급", "q": "구구조 분석이 특히 많이 쓰이는 언어의 특징은?", "opts": ["형태소가 결합하지 않는 고립어", "문자 체계가 표음문자인 언어", "한국어처럼 어순이 비교적 자유로운 언어", "영어처럼 단어 배열(어순)이 비교적 고정된 언어"], "a": 3, "exp": "구구조 분석은 단어 배열이 비교적 고정된 영어와 같은 언어의 분석에 많이 쓰인다."}, {"id": 88, "sec": "2.7", "diff": "중급", "q": "문맥자유문법(CFG)에 대한 설명으로 옳은 것은?", "opts": ["확률을 이용해 다음 단어를 예측하는 모델이다.", "단어 사이의 의존 관계를 화살표로 표시한 것이다.", "단어를 벡터로 바꾸는 규칙의 집합이다.", "구구조를 다시 쓰기 규칙(rewriting rule)의 집합으로 형식화한 것으로, 유한한 규칙으로 무한한 문장을 생성할 수 있다."], "a": 3, "exp": "CFG는 S → NP VP와 같은 다시 쓰기 규칙의 집합으로 구구조를 형식화하며, 유한한 규칙으로 무한한 문장을 생성하는 생성 문법이다."}, {"id": 89, "sec": "2.7", "diff": "심화", "q": "CFG 규칙 중 전치사구(PP)를 만드는 규칙으로 옳은 것은?", "opts": ["PP → V NP", "PP → P NP", "PP → Det N", "PP → NP VP"], "a": 1, "exp": "강의자료의 CFG 규칙에서 PP → P NP이며, S → NP VP, NP → Det N, NP → NP PP, VP → V NP 등이 함께 제시된다."}, {"id": 90, "sec": "2.7", "diff": "중급", "q": "\"I saw the man with glasses\"가 구조적 중의성의 예인 이유는?", "opts": ["하나의 문장이 '안경을 낀 남자를 보았다'와 '안경을 끼고 남자를 보았다'라는 둘 이상의 구구조를 가질 수 있기 때문", "문장의 화자가 누구인지 알 수 없기 때문", "'saw'라는 단어가 여러 뜻을 갖기 때문", "문장이 문법적으로 잘못되었기 때문"], "a": 0, "exp": "전치사구 'with glasses'가 'the man'에 붙느냐 'saw'에 붙느냐에 따라 서로 다른 구구조가 만들어진다."}, {"id": 91, "sec": "2.7", "diff": "기초", "q": "의존구조(dependency structure)에 대한 설명으로 옳은 것은?", "opts": ["단어의 의미역을 표시한 것이다.", "단어를 문법적 성질에 따라 분류한 것이다.", "문장 요소들이 결합해 계층적 구를 이룬다고 본다.", "문장의 단어들이 서로 의존 관계를 이루어 구문을 형성한다고 보며, 각 단어는 지배소(head)와 의존소(dependent)의 관계로 연결된다."], "a": 3, "exp": "의존구조는 단어들 사이의 지배소(head)-의존소(dependent) 관계로 문장의 구문을 나타낸다."}, {"id": 92, "sec": "2.7", "diff": "중급", "q": "한국어에서 구구조보다 의존 구문 분석이 주로 이용되는 이유는?", "opts": ["한국어는 형태소가 결합하지 않는 고립어이기 때문", "한국어에는 구(phrase)라는 단위가 없기 때문", "한국어는 어순이 비교적 자유롭기 때문", "의존 구문 분석이 항상 더 빠르기 때문"], "a": 2, "exp": "어순이 비교적 자유로운 한국어에서는 고정된 배열을 전제하는 구구조보다 단어 사이의 의존 관계를 보는 분석이 더 적합하다."}, {"id": 93, "sec": "2.7", "diff": "중급", "q": "의존 구문 분석의 두 가지 대표적 접근으로 옳은 것은?", "opts": ["추출 기반과 생성 기반", "규칙 기반과 사전 기반", "지도 학습과 비지도 학습", "그래프 기반(Graph-based)과 전이 기반(Transition-based)"], "a": 3, "exp": "의존 구문 분석에는 그래프 기반과 전이 기반의 두 가지 대표적 접근이 있다."}, {"id": 94, "sec": "2.7", "diff": "심화", "q": "그래프 기반과 전이 기반 의존 구문 분석의 비교로 옳지 않은 것은?", "opts": ["전이 기반은 순차적 결정 때문에 오류 전파 가능성이 있다.", "전이 기반은 Shift/Reduce 행동을 순차적으로 결정하며 O(n)으로 빠르다.", "그래프 기반은 전역 최적이라 긴 문장에 유리하지만 O(n²)~O(n³)로 느리다.", "전이 기반은 모든 후보 트리 중 최고 점수 트리를 전역적으로 선택한다."], "a": 3, "exp": "모든 후보 트리 중 최고 점수 트리를 전역적으로 선택하는 것은 그래프 기반(Eisner, MST)이다. 전이 기반(Arc-standard, Arc-eager)은 Shift/Reduce를 지역적·순차적으로 결정한다."}, {"id": 95, "sec": "2.8", "diff": "기초", "q": "의미론(Semantics)에 대한 설명으로 옳은 것은?", "opts": ["단어·문장·발화가 실제로 가리키는 의미와 그 관계를 다룬다.", "언어 사용자와 발화 맥락을 고려해 언어의 사용을 다룬다.", "말소리의 최소 단위와 음절 구조를 다룬다.", "문장의 계층적 구조와 단어의 배열을 다룬다."], "a": 0, "exp": "의미론은 단어·문장·발화가 가리키는 의미와 그 관계를 다루며, 어휘 의미 관계(동의·반의·상하위·부분)와 WordNet·KorLex 같은 자원을 포함한다."}, {"id": 96, "sec": "2.8", "diff": "중급", "q": "\"사료가 개를 먹었습니다\"라는 문장이 보여 주는 것은?", "opts": ["문법 규칙을 어기면 의미도 사라진다는 점", "화용론적 맥락이 없으면 문장이 성립하지 않는다는 점", "의미론과 통사론이 완전히 같은 층위라는 점", "문법적으로 옳아도 의미적으로 부자연스러울 수 있다는 점"], "a": 3, "exp": "이 문장은 문법적으로 완벽하지만 의미적으로 부자연스러우며, 문법성과 의미의 자연스러움이 별개임을 보여 준다."}, {"id": 97, "sec": "2.8", "diff": "중급", "q": "의미역(semantic role)과 의미역 결정(SRL)에 대한 설명으로 옳은 것은?", "opts": ["서술어에 대해 각 명사구가 담당하는 의미적 역할이며, SRL은 \"누가 누구에게 무엇을 하였는가\"를 밝히는 과제이다.", "단어의 품사를 문맥에 따라 부여하는 과제이다.", "문장을 계층적 구구조로 분석하는 과제이다.", "두 단어가 함께 나타나는 빈도를 계산하는 과제이다."], "a": 0, "exp": "의미역은 행위자·대상·수혜자·장소·도구 등 서술어에 대한 명사구의 의미적 역할이며, SRL은 이를 밝히는 과제다."}, {"id": 98, "sec": "2.8", "diff": "심화", "q": "\"철수가 도서관에서 영희에게 책을 주었다\"의 의미역 분석으로 옳은 것은?", "opts": ["철수가 = 행위자(Agent), 영희에게 = 수혜자(Beneficiary), 책을 = 대상(Theme), 도서관에서 = 장소(Location)", "철수가 = 대상(Theme), 책을 = 행위자(Agent), 영희에게 = 장소(Location)", "영희에게 = 행위자(Agent), 철수가 = 수혜자(Beneficiary)", "도서관에서 = 도구(Instrument), 책을 = 장소(Location)"], "a": 0, "exp": "동작을 수행하는 주체가 행위자, 동작의 대상이 되는 사람이 수혜자, 영향을 받는 사물이 대상, 사건이 일어난 곳이 장소다."}, {"id": 99, "sec": "2.8", "diff": "중급", "q": "어휘 중의성과 단어 의미 중의성 해소(WSD)에 대한 설명으로 옳은 것은?", "opts": ["\"배\"가 과일·신체·선박으로 해석되듯 같은 단어가 문맥에 따라 다른 의미를 갖는 것이 어휘 중의성이고, WSD는 문맥을 이용해 올바른 의미를 고르는 과제이다.", "어휘 중의성은 문장 구조가 여러 갈래로 분석되는 현상이다.", "분포 가설은 WSD와 아무런 관련이 없다.", "WSD는 단어를 품사에 따라 분류하는 과제이다."], "a": 0, "exp": "\"배\"처럼 한 단어가 문맥에 따라 다른 의미를 갖는 것이 어휘 중의성이며, 분포 가설은 이 문제를 통계적으로 다루는 출발점이자 임베딩의 이론적 근거다."}, {"id": 100, "sec": "2.8", "diff": "기초", "q": "화용론(Pragmatics)에 대한 설명으로 옳은 것은?", "opts": ["음절과 형태소의 결합 규칙을 다룬다.", "단어와 문장이 가리키는 고정된 의미만을 다룬다.", "문장의 구구조와 의존구조를 다룬다.", "말하는 이·듣는 이·시간·장소로 구성되는 맥락 속에서 언어의 사용을 다루며, 대화 시스템과 챗봇에서 특히 중요하다."], "a": 3, "exp": "화용론은 언어 사용자와 발화 맥락을 고려하며, 의도 파악·문맥 유지·공손성 등 대화 시스템과 챗봇에서 특히 중요하다."}];

  "2.1":"확률의 기초",

  "2.3":"정보이론과 엔트로피",

  "2.5":"언어학 개요",

  "2.8":"의미론과 화용론"
};

const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week2_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
