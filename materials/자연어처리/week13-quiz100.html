<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13주차 딥러닝 기반 형태소 분석·품사 태깅·개체명 인식 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 13 · 자연어처리</div>
    <h1>13주차 &middot; 딥러닝 기반 형태소 분석과 품사 태깅, 단어 의미 분석, 그리고 개체명 인식 — 100문제</h1>
    <p class="sub">강의자료 13.1~13.17절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    13주차 강의자료(딥러닝 기반 형태소 분석과 품사 태깅, 단어 의미 분석, 그리고 개체명 인식) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "13.1", "diff": "기초", "q": "강의자료에서 '왜 딥러닝인가'의 근거로 제시한 규칙 기반·통계 기반 방법의 공통 한계는 무엇인가?", "opts": ["학습에 사용할 말뭉치가 전혀 필요 없다는 점", "GPU 없이는 추론이 불가능하다는 점", "출력이 항상 시퀀스 형태로만 나온다는 점", "사람이 자질(feature)을 직접 설계해야 한다는 점"], "a": 3, "exp": "규칙·통계 기반 방법은 사람이 자질을 직접 설계해야 하며, 딥러닝은 이 자질 표현을 스스로 학습한다는 점이 대비된다."}, {"id": 2, "sec": "13.1", "diff": "기초", "q": "딥러닝 도입 이후 형태소 분석, 품사 태깅, 개체명 인식이 공통적으로 어떤 문제로 통합되어 다루어지는가?", "opts": ["시퀀스 레이블링 문제", "군집화(clustering) 문제", "회귀(regression) 문제", "이진 분류 문제"], "a": 0, "exp": "강의자료는 세 과제가 모두 입력 열에 레이블 열을 붙이는 시퀀스 레이블링 문제로 통합된다고 설명한다."}, {"id": 3, "sec": "13.1", "diff": "중급", "q": "딥러닝 기반 언어 분석이 자질 표현을 얻는 방식으로 옳은 것은?", "opts": ["자질 템플릿을 사람이 설계해 CRF에 넘겨준다", "대규모 말뭉치로부터 자질 표현을 스스로 학습한다", "언어학 전문가가 만든 규칙 사전을 그대로 읽어들인다", "형태소 사전의 빈도표를 그대로 자질로 사용한다"], "a": 1, "exp": "딥러닝은 대규모 말뭉치에서 자질 표현을 스스로 학습한다는 점이 이전 방법과의 핵심 차이다."}, {"id": 4, "sec": "13.2", "diff": "기초", "q": "강의자료에서 정의한 '형태소 분석'에 가장 가까운 설명은?", "opts": ["두 언어 사이의 번역쌍을 정렬하는 것", "형태소를 비롯해 어근, 접두사, 접미사, 품사 등 다양한 언어적 속성의 구조를 파악하는 것", "문장 사이의 의미적 함의 관계를 판정하는 것", "문서를 주제별로 자동 분류하는 것"], "a": 1, "exp": "형태소 분석은 형태소·어근·접두사·접미사·품사 등 언어적 속성의 구조를 파악하는 작업으로 정의된다."}, {"id": 5, "sec": "13.2", "diff": "기초", "q": "자연언어 분석의 첫 단계로서 형태소 분석이 수행하는 작업은?", "opts": ["입력 문자열의 감성 극성을 판정하는 작업", "입력 문자열을 형태소 열로 바꾸는 작업", "입력 문자열을 벡터 하나로 요약하는 작업", "입력 문자열을 음성 신호로 바꾸는 작업"], "a": 1, "exp": "형태소 분석은 자연언어 분석의 첫 단계로 입력 문자열을 형태소 열로 변환한다."}, {"id": 6, "sec": "13.2", "diff": "기초", "q": "품사 태깅(POS tagging)에 대한 설명으로 옳은 것은?", "opts": ["문장의 구문 트리를 만드는 작업이다", "형태소를 합쳐 하나의 어절로 되돌리는 작업이다", "형태소 분석을 하기 전에 미리 문장의 주제를 정하는 작업이다", "형태소 분석을 한 결과를 토대로 각 형태소에 태그를 다는 작업이다"], "a": 3, "exp": "품사 태깅은 형태소 분석 결과를 토대로 태그를 붙이는 후속 작업이다."}, {"id": 7, "sec": "13.2", "diff": "기초", "q": "강의자료가 제시한 세종 품사 태그의 대분류에 해당하지 않는 것은?", "opts": ["숙어", "어근", "부호", "체언"], "a": 0, "exp": "대분류는 체언·용언·관형사·부사·감탄사·조사·어미·접사·어근·부호·한글 이외로 나뉘며 '숙어'는 포함되지 않는다."}, {"id": 8, "sec": "13.2", "diff": "기초", "q": "세종 품사 태그 차트에서 태그 'NNP'가 가리키는 것은?", "opts": ["의존 명사", "일반 명사", "고유 명사", "대명사"], "a": 2, "exp": "차트에서 NNG는 일반 명사, NNP는 고유 명사, NNB는 의존 명사, NP는 대명사이다."}, {"id": 9, "sec": "13.2", "diff": "중급", "q": "세종 품사 태그 차트에서 대분류 '용언'에 속하는 태그가 아닌 것은?", "opts": ["VCP", "VV", "VA", "NR"], "a": 3, "exp": "용언에는 VV(동사), VA(형용사), VX(보조 용언), VCP(긍정 지정사), VCN(부정 지정사)이 속하며 NR(수사)은 체언이다."}, {"id": 10, "sec": "13.2", "diff": "중급", "q": "강의자료의 예시에서 문장 '나는 밥을 먹는다'의 형태소 분석 결과로 옳은 것은?", "opts": ["나는 + 밥을 + 먹는다", "나 + 는 + 밥 + 을 + 먹 + 는 + 다", "나 + 는 + 밥을 + 먹는 + 다", "나 + 는밥 + 을먹 + 는다"], "a": 1, "exp": "슬라이드의 예시는 '나 + 는 + 밥 + 을 + 먹 + 는 + 다'의 7개 형태소로 분석한다."}, {"id": 11, "sec": "13.2", "diff": "심화", "q": "'나는 밥을 먹는다'의 품사 태깅 예시에서 조사 '을'에 붙은 태그는?", "opts": ["JX", "JKS", "JKO", "JKB"], "a": 2, "exp": "예시는 나/NP + 는/JX + 밥/NNG + 을/JKO + 먹/VA + 는/EPT + 다/EFN 이며 '을'은 목적격 조사 JKO이다."}, {"id": 12, "sec": "13.2", "diff": "심화", "q": "'나는 밥을 먹는다'의 품사 태깅 예시에서 '먹'과 '다'에 각각 붙은 태그를 옳게 짝지은 것은?", "opts": ["먹/VA, 다/EFN", "먹/NNG, 다/EP", "먹/VV, 다/EFQ", "먹/VX, 다/EC"], "a": 0, "exp": "강의자료 예시는 먹/VA, 는/EPT, 다/EFN으로 태깅되어 있다."}, {"id": 13, "sec": "13.2", "diff": "기초", "q": "강의자료가 예로 든 어절 '잡히셨겠더라'는 몇 개의 형태소로 분해되는가?", "opts": ["6개", "4개", "3개", "8개"], "a": 0, "exp": "'잡-', '-히-', '-시-', '-었-', '-겠-', '-더라'의 6개 형태소로 나뉜다."}, {"id": 14, "sec": "13.2", "diff": "중급", "q": "한국어에서 영어처럼 어절 단위로만 나누어서는 형태소 단위 분리가 되지 않는 근본 이유는?", "opts": ["한국어에는 띄어쓰기 규칙이 존재하지 않기 때문", "한국어에는 품사 개념이 없기 때문", "한국어의 어순이 자유롭기 때문", "한국어가 교착어로 하나의 어근에 하나 이상의 접사·조사가 붙어 단어를 이루기 때문"], "a": 3, "exp": "한국어는 교착어라 어근에 접사·조사가 결합해 한 어절을 이루므로 어절 분리만으로는 형태소가 나뉘지 않는다."}, {"id": 15, "sec": "13.2", "diff": "기초", "q": "규칙 기반 형태소 분석 및 품사 태깅의 단점으로 강의자료가 지적한 것은?", "opts": ["학습 데이터가 있어야만 동작해 소량 자원 언어에 쓸 수 없다", "언어학적 규칙이 많고 복잡해 어렵고 지식이 많이 필요하다", "단어 임베딩을 학습하는 데 시간이 오래 걸린다", "GPU 연산량이 커서 실시간 처리가 불가능하다"], "a": 1, "exp": "규칙 기반은 전문가가 언어 규칙에 따라 직접 분석해야 하므로 규칙이 복잡하고 지식이 많이 필요하다는 단점이 있다."}, {"id": 16, "sec": "13.3", "diff": "기초", "q": "KoNLPy에 대한 설명으로 가장 적절한 것은?", "opts": ["한국어 음성을 텍스트로 바꿔 주는 음성 인식 패키지", "파이썬 환경에서 여러 한국어 형태소 분석기를 모아 편리하게 쓸 수 있게 만든 패키지", "한국어 문장을 영어로 번역해 주는 신경망 번역 패키지", "세종 말뭉치를 내려받아 관리하는 데이터 배포 서버"], "a": 1, "exp": "KoNLPy는 파이썬에서 여러 한국어 형태소 분석기를 모아 편리하게 사용하도록 만든 패키지이다."}, {"id": 17, "sec": "13.3", "diff": "기초", "q": "강의자료가 KoNLPy에서 제공한다고 소개한 형태소 분석기가 아닌 것은?", "opts": ["한나눔", "코모란", "Stanford CoreNLP", "꼬꼬마"], "a": 2, "exp": "KoNLPy는 한나눔, 꼬꼬마, 코모란, Mecab 등을 제공한다고 소개되어 있다."}, {"id": 18, "sec": "13.3", "diff": "기초", "q": "분석기마다 품사 태그 종류와 방법이 달라 이를 비교·확인할 때 참고하라고 소개된 자료는?", "opts": ["세종 품사 태그 차트", "Penn Treebank tagset", "Korean POS tag comparison chart", "CoNLL-2003 annotation guide"], "a": 2, "exp": "강의자료는 분석기 간 태그 비교를 위해 'Korean POS tag comparison chart'를 참고하라고 안내한다."}, {"id": 19, "sec": "13.3", "diff": "중급", "q": "강의자료가 제시한 형태소 분석기 선택 기준에 해당하지 않는 것은?", "opts": ["학습에 사용한 손실 함수의 종류", "태그셋의 세밀도", "사용자 사전 지원 여부", "처리 속도"], "a": 0, "exp": "선택 기준은 처리 속도, 태그셋 세밀도, 사용자 사전 지원 여부, 신조어·구어체 처리 능력이다."}, {"id": 20, "sec": "13.3", "diff": "중급", "q": "슬라이드의 KoNLPy 사용 예시에서 '아버지가 방에 들어가신다'를 분석했을 때 Kkma가 '아버지'에 붙인 태그는?", "opts": ["NNG", "NP", "NNP", "Noun"], "a": 0, "exp": "예시 실행 결과에서 Okt는 ('아버지','Noun'), Kkma와 Komoran은 ('아버지','NNG')로 태깅한다."}, {"id": 21, "sec": "13.3", "diff": "중급", "q": "같은 예시에서 Okt가 조사 '가'에 붙인 태그는 무엇인가?", "opts": ["Noun", "JX", "JKS", "Josa"], "a": 3, "exp": "Okt는 태그 체계가 달라 조사를 'Josa'로 표기하고, Kkma·Komoran은 'JKS'로 표기한다."}, {"id": 22, "sec": "13.4", "diff": "기초", "q": "은닉 마르코프 모델(HMM)의 일반적 구조에서 x(t)가 의미하는 것은?", "opts": ["시간 t에서 관측된 값", "시간 t의 출력 임베딩", "시간 t의 전이 확률", "시간 t에서의 은닉 상태"], "a": 3, "exp": "그림에서 x(t)는 시간 t의 은닉 상태, y(t)는 표면적으로 관측된 값이다."}, {"id": 23, "sec": "13.4", "diff": "기초", "q": "HMM 구조에서 y(t)에 대한 설명으로 옳은 것은?", "opts": ["시간 t의 학습률이다", "시간 t의 손실 값이다", "시간 t에서 표면적으로 관측된 값이다", "시간 t의 은닉 상태이다"], "a": 2, "exp": "y(t)는 관측값이며 은닉 상태 x(t)로부터 생성된다."}, {"id": 24, "sec": "13.4", "diff": "중급", "q": "HMM에서 은닉 상태 x(t)는 어떤 변수로부터 직접적인 영향을 받는가?", "opts": ["가장 마지막 상태 x(T)", "바로 전 단계인 x(t-1)", "전체 관측열 y(1)~y(T)", "동일 시점의 관측값 y(t)"], "a": 1, "exp": "x(t)는 오직 바로 전 단계 x(t-1)로부터만 직접 영향을 받으며, 그 이전 상태들은 연쇄적으로 내재된다."}, {"id": 25, "sec": "13.4", "diff": "기초", "q": "CRF(Conditional Random Field)가 시퀀스 라벨링에 많이 쓰이는 이유로 강의자료가 든 특성은?", "opts": ["문장을 하나의 벡터로 압축해 주기 때문", "어떤 배열을 입력으로 받으면 그와 같은 길이의 결과를 반환하기 때문", "레이블 없이도 학습이 가능한 비지도 모델이기 때문", "입력보다 항상 짧은 요약 결과를 반환하기 때문"], "a": 1, "exp": "CRF는 입력 배열과 같은 길이의 결과를 반환하므로 시퀀스 라벨링에 적합하다."}, {"id": 26, "sec": "13.4", "diff": "기초", "q": "강의자료가 제시한 CRF의 장점으로 옳은 것은?", "opts": ["학습 없이도 최적 태그열을 찾을 수 있다", "미등록어를 자동으로 사전에 등록해 준다", "자질 템플릿을 설계할 필요가 전혀 없다", "이전 상태를 확인할 수 있고 문맥을 직접 이용해 형태소 분석에서 더 좋은 성능을 보인다"], "a": 3, "exp": "CRF는 이전 상태를 확인할 수 있고 문맥을 직접 이용하기 때문에 형태소 분석에서 더 좋은 성능을 보인다."}, {"id": 27, "sec": "13.4", "diff": "중급", "q": "HMM의 한계로 강의자료가 지적한 내용은?", "opts": ["전이 행렬을 학습할 수 없어 태그열 제약을 반영하지 못한다", "입력 길이와 출력 길이가 달라 시퀀스 라벨링에 쓸 수 없다", "관측 독립 가정 때문에 풍부한 문맥 자질을 활용하기 어렵다", "자질 수가 늘어나도 학습 비용이 전혀 늘지 않는다"], "a": 2, "exp": "HMM은 관측 독립 가정 때문에 풍부한 문맥 자질을 쓰기 어렵고 미등록어(OOV) 처리에도 취약하다."}, {"id": 28, "sec": "13.4", "diff": "심화", "q": "HMM과 CRF의 '공통 한계'와 그 해결책으로 강의자료가 제시한 것은?", "opts": ["태그열 제약을 반영하지 못하며, Viterbi 디코딩으로 해결한다", "학습 속도가 느려 대규모 말뭉치를 쓸 수 없으며, 병렬 처리로 해결한다", "단어를 이산 기호로 다루어 의미적 유사성을 반영하지 못하며, 임베딩과 신경망의 분산 표현으로 해결한다", "출력 길이를 맞추지 못하며, 패딩으로 해결한다"], "a": 2, "exp": "두 방법 모두 단어를 이산 기호로 다뤄 의미적 유사성을 반영하지 못하는데, 분산 표현(distributed representation)이 이를 해결한다."}, {"id": 29, "sec": "13.5", "diff": "기초", "q": "한국어 형태소 분석·품사 태깅 학습에 가장 많이 쓰이는 말뭉치로 소개된 것은?", "opts": ["KLUE 벤치마크", "CoNLL-2003 말뭉치", "세종 말뭉치", "Penn Treebank"], "a": 2, "exp": "'21세기 세종계획' 연구의 일환으로 만들어진 세종 말뭉치가 가장 많이 사용된다고 소개된다."}, {"id": 30, "sec": "13.5", "diff": "기초", "q": "'21세기 세종계획'이 시행된 기간으로 옳은 것은?", "opts": ["1988년부터 1997년까지", "2001년부터 2010년까지", "2010년부터 2019년까지", "1998년부터 2007년까지"], "a": 3, "exp": "21세기 세종계획은 1998년부터 2007년까지 시행된 국어 정보화 중장기 발전 계획이다."}, {"id": 31, "sec": "13.5", "diff": "중급", "q": "세종 말뭉치의 구성으로 강의자료가 열거한 것에 해당하지 않는 것은?", "opts": ["문어", "역사", "구어", "음성"], "a": 3, "exp": "세종 말뭉치는 문어, 구어, 병렬(한영·한일), 역사 말뭉치로 구성된다고 소개된다."}, {"id": 32, "sec": "13.5", "diff": "중급", "q": "한국어 형태소 분석기 학습의 기준 데이터로 많이 쓰이는 말뭉치와 그 배포처를 옳게 짝지은 것은?", "opts": ["구어 말뭉치 — 국립국어원", "형태 분석 말뭉치 — 한국정보화진흥원", "형태 분석 말뭉치 — 국립국어원", "병렬 말뭉치 — 국립국어원"], "a": 2, "exp": "형태소 단위 정보가 추가된 '형태 분석 말뭉치'가 기준 데이터이며 국립국어원 홈페이지에서 내려받을 수 있다."}, {"id": 33, "sec": "13.5", "diff": "중급", "q": "강의자료가 소개한 딥러닝 기반 형태소 분석·품사 태깅 방법 네 가지에 포함되지 않는 것은?", "opts": ["Character-Level Bidirectional LSTM-CRF 방식", "Sequence-to-sequence 방식", "Feed Forward Neural Network 방식", "Latent Dirichlet Allocation 방식"], "a": 3, "exp": "네 가지 방법은 FFNN, seq2seq, CNN, Character-Level Bi-LSTM-CRF이며 LDA는 주제 모델링 기법이다."}, {"id": 34, "sec": "13.5", "diff": "중급", "q": "FFNN 방식의 품사 태깅에서 최종적으로 태그를 결정하는 연산은?", "opts": ["출력값을 kNN에 넣어 가장 가까운 태그를 고른다", "출력값에 argmax를 계산해 가장 높은 점수의 태그를 선택한다", "출력값에 Maxpooling을 적용해 태그를 고른다", "출력값에 Viterbi 알고리즘을 적용해 경로를 찾는다"], "a": 1, "exp": "FFNN 방식은 은닉층·출력층을 통과한 결과에 argmax를 취해 가장 높은 점수의 태그를 붙인다."}, {"id": 35, "sec": "13.5", "diff": "중급", "q": "Sequence-to-sequence 방식에 대한 설명으로 옳은 것은?", "opts": ["임의 길이의 시퀀스를 다른 종류의 시퀀스로 변환하는 확률 모델이며 end-to-end로 학습한다", "은닉층이 없는 선형 모델이다", "추가 정보인 자질 템플릿에 의존해 학습한다", "입력과 출력의 길이가 반드시 같아야 하는 결정론적 모델이다"], "a": 0, "exp": "seq2seq는 임의 길이 시퀀스를 다른 시퀀스로 변환하는 확률 모델로, 추가 정보에 의존하지 않고 end-to-end로 학습한다."}, {"id": 36, "sec": "13.5", "diff": "심화", "q": "어텐션 기반 인코더-디코더로 한국어 형태소를 분석할 때 입력과 출력을 옳게 짝지은 것은?", "opts": ["입력: 형태소 사전 / 출력: 자질 템플릿", "입력: 품사 태그열 / 출력: 원문 음절", "입력: 어절 단위 원문 / 출력: 문장 벡터", "입력: 음절 단위로 분리된 한국어 원문 / 출력: 한국어 음절 및 품사 태그"], "a": 3, "exp": "슬라이드의 그림처럼 INPUT은 음절 단위 원문이고 OUTPUT은 음절과 품사 태그가 붙은 열이다."}, {"id": 37, "sec": "13.5", "diff": "중급", "q": "CNN 방식의 형태소 분석·품사 태깅에서 강의자료가 제시한 설정으로 옳은 것은?", "opts": ["음절 임베딩 크기 7, 윈도우 크기 5, 커널 크기 4인 필터 3개", "음절 임베딩 크기 3, 윈도우 크기 4, 커널 크기 5인 필터 7개", "음절 임베딩 크기 5, 윈도우 크기 7, 커널 크기 3인 필터 4개", "음절 임베딩 크기 128, 윈도우 크기 80, 커널 크기 3인 필터 256개"], "a": 2, "exp": "강의자료는 임베딩 크기 5, 윈도우 크기 7, 커널 크기 3인 필터 4개를 사용한 컨볼루션을 소개한다."}, {"id": 38, "sec": "13.5", "diff": "중급", "q": "CNN 방식에서 컨볼루션을 거친 특징에 적용한 뒤 은닉층·출력층으로 넘기는 연산은?", "opts": ["Dropout", "Softmax 정규화", "Maxpooling", "Layer normalization"], "a": 2, "exp": "컨볼루션 특징에 Maxpooling을 적용한 뒤 은닉층과 출력층을 거쳐 최종 태그가 결정된다."}, {"id": 39, "sec": "13.5", "diff": "기초", "q": "강의자료가 소개한 대표적 신경망 태깅 구조 Bi-LSTM-CRF의 3단 구성 순서로 옳은 것은?", "opts": ["임베딩 → Bi-LSTM → CRF", "Bi-LSTM → 임베딩 → CRF", "임베딩 → CRF → Bi-LSTM", "CRF → Bi-LSTM → 임베딩"], "a": 0, "exp": "Bi-LSTM-CRF는 임베딩, Bi-LSTM, CRF의 3단 구성으로 되어 있다."}, {"id": 40, "sec": "13.5", "diff": "중급", "q": "Bi-LSTM-CRF에서 softmax 대신 CRF 층을 두는 이유로 옳은 것은?", "opts": ["softmax는 토큰마다 독립 예측하므로 O 다음에 I-PER이 오는 불가능한 태그열도 만들 수 있기 때문", "softmax는 양방향 문맥을 반영하지 못하기 때문", "softmax는 확률값을 출력하지 못하기 때문", "softmax는 임베딩을 학습하지 못하기 때문"], "a": 0, "exp": "softmax는 토큰별 독립 예측이라 불가능한 전이도 허용하지만, CRF는 전이 행렬 A를 학습해 태그열 제약을 반영한다."}, {"id": 41, "sec": "13.5", "diff": "심화", "q": "Bi-LSTM-CRF의 점수 함수 s(x, y) = ΣA(y_{i-1}, y_i) + ΣP(i, y_i)에서 두 항이 뜻하는 것은?", "opts": ["정밀도와 재현율의 합", "순방향 손실과 역방향 손실의 합", "전이 점수와 방출 점수의 합", "학습률과 정규화 항의 합"], "a": 2, "exp": "A는 태그 간 전이 점수, P는 각 위치의 방출 점수이며 s(x,y)는 이 둘의 합이다."}, {"id": 42, "sec": "13.5", "diff": "심화", "q": "Bi-LSTM-CRF의 학습과 추론에 대한 설명으로 옳은 것은?", "opts": ["학습은 정답 경로 점수를 높이고 모든 경로 합(log-sum-exp)을 낮추며, 추론은 Viterbi로 O(L·T²)에 최대 점수 경로를 찾는다", "학습은 모든 경로 점수를 동일하게 만들고, 추론은 완전 탐색으로 O(T^L)에 경로를 찾는다", "학습은 kNN으로 이루어지고, 추론은 Maxpooling으로 이루어진다", "학습은 방출 점수만 최적화하고, 추론은 argmax를 토큰별로 적용한다"], "a": 0, "exp": "학습은 정답 경로 점수를 높이고 log-sum-exp로 계산한 전체 경로 합을 낮추며, 추론은 Viterbi 알고리즘이 O(L·T²)로 최적 경로를 찾는다."}, {"id": 43, "sec": "13.7", "diff": "기초", "q": "기존 기계학습 기반 자연어처리의 문제로 강의자료가 지적한 것은?", "opts": ["특징을 자동으로 학습해 해석이 어렵다", "모듈마다 적합한 특징을 추출하고 최적 조합을 찾는 데 많은 시간이 필요하다", "가중치를 계산할 수 없어 학습이 불가능하다", "학습에 사용할 알고리즘이 존재하지 않는다"], "a": 1, "exp": "사람이 특징을 추출하고 최적 조합을 찾는 데 많은 시간이 들어, 이를 추상화하는 심층학습이 연구되었다."}, {"id": 44, "sec": "13.7", "diff": "중급", "q": "한국어 의미역 분석에서 높은 성능을 위해 가장 많이 사용되는 특징으로 소개된 것은?", "opts": ["문장 길이 정보", "구문 분석 정보", "문자 n-gram 빈도", "문서의 주제 분포"], "a": 1, "exp": "LSTM 입력으로 단어열을 쓸 수 있지만, 높은 성능의 의미역 분석에는 구문 분석 정보가 가장 많이 사용된다."}, {"id": 45, "sec": "13.7", "diff": "중급", "q": "구문 분석 정보가 의미역 결정에서 높은 성능을 보이는 이유는?", "opts": ["말뭉치의 빈도 통계를 그대로 담기 때문", "술어와 논항 사이의 의존관계 정보를 포함하기 때문", "문서 수준의 주제 정보를 포함하기 때문", "단어의 철자 오류를 교정해 주기 때문"], "a": 1, "exp": "구문 분석 정보에는 술어와 논항 사이의 의존관계가 담겨 있어 의미역 결정에 유리하다."}, {"id": 46, "sec": "13.7", "diff": "기초", "q": "BERT의 base 모델과 Large 모델이 각각 몇 개의 트랜스포머 인코더로 구성되어 있는가?", "opts": ["24개와 48개", "8개와 16개", "6개와 12개", "12개와 24개"], "a": 3, "exp": "강의자료는 BERT base와 Large가 각각 12개, 24개의 트랜스포머 인코더로 구성된다고 설명한다."}, {"id": 47, "sec": "13.7", "diff": "중급", "q": "BERT 내 트랜스포머 인코더의 멀티 헤드 어텐션에 대한 설명으로 옳은 것은?", "opts": ["어텐션 대신 컨볼루션을 헤드 개수만큼 반복한다", "하나의 가중치 행렬을 헤드마다 공유하고 결과를 평균한다", "서로 다른 가중치 행렬로 헤드 개수만큼 어텐션을 계산한 뒤 concatenation한다", "헤드마다 서로 다른 입력 문장을 받아 결과를 더한다"], "a": 2, "exp": "멀티 헤드 어텐션은 서로 다른 가중치 행렬로 헤드 수만큼 어텐션을 계산하고 결과를 concatenation한다."}, {"id": 48, "sec": "13.7", "diff": "심화", "q": "BERT의 입력 임베딩 구성에 대한 설명으로 옳지 않은 것은?", "opts": ["[SEP] 토큰으로 구분되는 두 문장을 0과 1로 구분하는 세그먼트 임베딩을 만든다", "포지션 임베딩으로 문장 내 단어의 위치 정보를 나타낸다", "Glove 벡터를 그대로 토큰 임베딩으로 사용한다", "WordPiece를 적용한 토큰 임베딩을 사용하고 첫 토큰은 [CLS]로 둔다"], "a": 2, "exp": "BERT는 WordPiece 토큰 임베딩·세그먼트 임베딩·포지션 임베딩 세 가지를 사용하며, Glove 벡터를 쓰는 것은 지식 상호 보완 중의성 해소 모델의 Context·Gloss 모듈이다."}, {"id": 49, "sec": "13.7", "diff": "중급", "q": "의미역 분석에서 BERT를 활용하는 방식과 사전학습 방법으로 옳은 것은?", "opts": ["세 가지 임베딩으로 학습한 결과를 LSTM-CRF의 입력으로 사용하며, 사전학습은 MLM과 NSP로 이루어진다", "BERT 출력을 CNN의 입력으로 사용하며, 사전학습은 Maxpooling으로 이루어진다", "BERT 출력을 HMM의 관측값으로 사용하며, 사전학습은 argmax로 이루어진다", "세 가지 임베딩을 kNN의 입력으로 사용하며, 사전학습은 Viterbi로 이루어진다"], "a": 0, "exp": "BERT는 Masked Language Model과 Next Sentence Prediction으로 학습하며 그 결과를 LSTM-CRF의 입력으로 사용한다."}, {"id": 50, "sec": "13.8", "diff": "기초", "q": "강의자료가 제시한 심층학습 기반 단어 중의성 해소 방법 두 가지는?", "opts": ["지도 학습 모델과 강화 학습 모델", "레이블된 데이터를 이용한 모델과 지식 상호 보완 모델", "규칙 기반 모델과 통계 기반 모델", "형태소 기반 모델과 음절 기반 모델"], "a": 1, "exp": "중의 해소 방법은 (1) 레이블된 데이터를 이용한 모델, (2) 지식 상호 보완 모델의 두 가지로 소개된다."}, {"id": 51, "sec": "13.8", "diff": "기초", "q": "맥락 벡터를 표현하는 방법 중 가장 많이 쓰이는 모델로 소개된 것은?", "opts": ["결정 트리", "은닉 마르코프 모델", "양방향 순환신경망", "단방향 컨볼루션 신경망"], "a": 2, "exp": "맥락 벡터 표현에는 양방향 순환신경망이 가장 많이 쓰인다고 설명한다."}, {"id": 52, "sec": "13.8", "diff": "중급", "q": "BERT-kNN에 대한 설명으로 옳은 것은?", "opts": ["gloss 정보를 처음으로 활용해 기존 모델을 크게 앞선 최신 모델이다", "kNN으로 학습한 벡터를 BERT에 입력하는 사후 처리 기법이다", "BERT 문맥 벡터에 kNN을 적용하는, 사전학습 모델을 이용한 대표적 초기 접근이다", "레이블 없이 학습하는 비지도 중의성 해소 모델이다"], "a": 2, "exp": "BERT-kNN은 BERT 문맥 벡터에 kNN을 적용하는 방식으로, 사전학습 모델을 이용한 대표적 초기 접근이다."}, {"id": 53, "sec": "13.8", "diff": "중급", "q": "BERT-kNN 이후 gloss 정보를 함께 사용해 더 높은 성능을 보고한 모델로 언급된 것은?", "opts": ["HMM, CRF, MEMM", "BEM, ESCHER, ConSeC", "Word2vec, Glove, FastText", "BERT, RoBERTa, ELECTRA"], "a": 1, "exp": "강의자료는 gloss 정보를 함께 쓰는 BEM·ESCHER·ConSeC 등이 이후 더 높은 성능을 보고했다고 서술한다."}, {"id": 54, "sec": "13.8", "diff": "심화", "q": "BERT-kNN 모델의 처리 과정에 대한 설명으로 옳은 것은?", "opts": ["의미가 레이블링된 단어를 그대로 입력하고, 출력 벡터를 gloss 벡터로 치환한다", "의미가 레이블링된 단어는 원래 단어로 되돌려 입력하고, 출력된 단어 벡터를 의미 벡터로 치환한다", "레이블을 제거한 뒤 Bi-LSTM으로 학습해 전이 행렬을 만든다", "레이블링된 단어만 골라 kNN을 학습한 뒤 BERT를 미세조정한다"], "a": 1, "exp": "의미 레이블이 붙은 단어는 원래 단어로 변환해 입력하고, 그 단어의 출력 벡터를 의미 벡터로 치환한 뒤 kNN으로 의미를 결정한다."}, {"id": 55, "sec": "13.8", "diff": "중급", "q": "Luo et al. 논문에서 제안한 지식 상호 보완 단어 중의성 해소 모델을 구성하는 네 모듈은?", "opts": ["Input, Hidden, Output, Pooling", "Encoder, Decoder, Attention, Softmax", "Embedding, LSTM, CRF, Viterbi", "Context, Gloss, Memory, Scoring"], "a": 3, "exp": "이 모델은 Context, Gloss, Memory, Scoring의 4개 모듈로 구성된다."}, {"id": 56, "sec": "13.8", "diff": "중급", "q": "지식 상호 보완 모델에서 Context 모듈과 Gloss 모듈이 공통으로 사용하는 단어 입력 벡터는?", "opts": ["Glove 벡터", "BERT 세그먼트 임베딩", "WordPiece 임베딩", "one-hot 벡터"], "a": 0, "exp": "Context와 Gloss 모듈은 모두 Glove 벡터를 단어 입력 벡터로 사용하며 Bi-LSTM으로 표상한다."}, {"id": 57, "sec": "13.8", "diff": "심화", "q": "지식 상호 보완 모델의 Memory 모듈과 Scoring 모듈의 역할을 옳게 설명한 것은?", "opts": ["Memory는 Glove 벡터를 저장하고, Scoring은 전이 행렬을 학습해 태그열을 결정한다", "Memory는 Attention 값을 계산해 이전 메모리로 현재 메모리를 반복 갱신하고, Scoring은 Context 벡터와 마지막 Attention 결과로 의미를 선택한다", "Memory는 문장을 음절로 분해하고, Scoring은 Viterbi로 최적 경로를 찾는다", "Memory는 gloss를 확장하고, Scoring은 kNN으로 최근접 이웃을 찾는다"], "a": 1, "exp": "Memory 모듈은 Attention을 계산하며 메모리를 반복 갱신하고, Scoring 모듈은 Context 벡터와 마지막 Attention 결과로 중의성 단어의 의미를 고른다."}, {"id": 58, "sec": "13.8", "diff": "중급", "q": "'배' 중의성 해소 예시에서 '배를 타고 섬에 들어갔다'에 대응하는 의미 레이블은?", "opts": ["배_02 (선박)", "배_03 (신체)", "배_01 (과일)", "배_04 (배수)"], "a": 0, "exp": "예시는 '사과보다 배가 더 달다'를 배_01(과일), '배를 타고 섬에 들어갔다'를 배_02(선박), '과식해서 배가 아프다'를 배_03(신체)으로 연결한다."}, {"id": 59, "sec": "13.9", "diff": "기초", "q": "BIO 태깅 체계에서 각 기호의 의미를 옳게 짝지은 것은?", "opts": ["B: 개체 내부, I: 개체 시작, O: 개체 끝", "B: 개체 시작, I: 개체 내부, O: 개체 아님", "B: 개체 끝, I: 단일 토큰 개체, O: 개체 내부", "B: 개체 경계, I: 개체 무시, O: 개체 시작"], "a": 1, "exp": "BIO는 B(개체 시작), I(개체 내부), O(개체 아님)로 구성된다."}, {"id": 60, "sec": "13.9", "diff": "기초", "q": "BIOES 태깅 체계가 BIO에 추가로 도입한 태그와 그 목적은?", "opts": ["E(개체 확장)와 S(문장 시작)를 추가해 문장 경계를 표시한다", "E(개체 끝)와 S(부분 개체)를 추가해 중첩 개체를 표현한다", "E(개체 끝)와 S(단일 토큰 개체)를 추가해 경계 정보를 명확히 한다", "E(오류)와 S(생략)를 추가해 잘못된 태그를 표시한다"], "a": 2, "exp": "BIOES는 E(개체 끝)와 S(단일 토큰 개체)를 추가해 개체 경계 정보를 더 명확히 한다."}, {"id": 61, "sec": "13.9", "diff": "중급", "q": "한국어 개체명 인식에서 어절보다 형태소·음절 단위 태깅이 유리한 이유는?", "opts": ["조사가 붙어 어절 경계와 개체 경계가 일치하지 않기 때문", "형태소 단위가 어절보다 개수가 적어 계산이 빠르기 때문", "한국어 어절이 항상 하나의 개체명이기 때문", "음절 단위에서는 미등록어가 발생하지 않기 때문"], "a": 0, "exp": "한국어는 조사가 붙기 때문에 어절 단위보다 형태소·음절 단위 태깅이 개체 경계를 잡기에 유리하다."}, {"id": 62, "sec": "13.9", "diff": "중급", "q": "신경망 NER 연구의 전반적 동향으로 강의자료가 서술한 변화는?", "opts": ["Word2vec 소개 이후 수동 구성 자질 벡터가 단어 임베딩으로 대체되었다", "사전과 어휘 벡터가 완전히 사라지고 규칙 기반으로 회귀했다", "단어 임베딩이 다시 수동 자질 벡터로 대체되었다", "CRF가 사라지고 HMM이 표준으로 자리 잡았다"], "a": 0, "exp": "Word2vec이 소개되면서 수동으로 구성한 자질 벡터가 단어 임베딩으로 대체되는 것이 전반적 동향이었다."}, {"id": 63, "sec": "13.9", "diff": "중급", "q": "사전 훈련된 임베딩이 모델 성능에 특히 큰 영향을 미치는 언어로 언급된 것은?", "opts": ["한국어·중국어처럼 띄어쓰기만으로 단어 경계를 확정하기 어려운 언어", "아랍어·히브리어처럼 오른쪽에서 왼쪽으로 쓰는 언어", "라틴어·산스크리트어처럼 사용자가 적은 언어", "영어·프랑스어처럼 굴절이 적은 언어"], "a": 0, "exp": "띄어쓰기만으로 단어 경계를 확정하기 어려운 한국어·중국어에서 사전 훈련된 임베딩의 영향이 특히 크다고 소개된다."}, {"id": 64, "sec": "13.9", "diff": "중급", "q": "한국어 개체명 인식 학습 데이터를 준비할 때 유의점으로 옳은 것은?", "opts": ["어절 단위 태깅만 사용해야 하며 형태소 단위는 허용되지 않는다", "개체명 유형 체계는 국제 표준으로 통일되어 있어 변환이 필요 없다", "개체명 유형 체계가 말뭉치마다 다르고, 태깅 단위를 학습·평가에서 일관되게 맞춰야 한다", "태깅 단위는 학습과 평가에서 서로 다르게 두는 것이 성능에 유리하다"], "a": 2, "exp": "PER·LOC·ORG·DAT 등 유형 체계가 말뭉치마다 다르고, 어절/형태소/음절 태깅 단위를 학습·평가에서 일관되게 유지해야 한다."}, {"id": 65, "sec": "13.9", "diff": "중급", "q": "개체명 인식 평가에서 토큰 단위 정확도를 쓰면 안 되는 이유는?", "opts": ["정확도는 0과 1 사이 값을 갖지 못하기 때문", "O 태그의 비중이 커서 성능이 과대평가되기 때문", "토큰 수가 문장마다 달라 계산이 불가능하기 때문", "토큰 단위 정확도는 경계 오류를 지나치게 엄격히 벌하기 때문"], "a": 1, "exp": "대부분의 토큰이 O 태그이므로 토큰 단위 정확도는 성능을 과대평가한다."}, {"id": 66, "sec": "13.9", "diff": "기초", "q": "개체명 인식에서 권장되는 평가 지표와 계산 도구를 옳게 짝지은 것은?", "opts": ["퍼플렉시티 — NLTK", "경계와 유형이 모두 일치한 개체만 인정하는 개체 단위 F1 — seqeval", "토큰 단위 정확도 — seqeval", "개체 단위 F1 — KoNLPy"], "a": 1, "exp": "경계와 유형이 모두 맞은 개체만 정답으로 인정하는 개체 단위 F1을 사용하며 seqeval 같은 라이브러리로 계산한다."}, {"id": 67, "sec": "13.10", "diff": "중급", "q": "단어 단위 구조의 NER 모델에서 단어 임베딩을 정방향과 역방향으로 한 번씩 넣는 이유는?", "opts": ["정방향만으로는 임베딩을 학습할 수 없기 때문", "역방향 입력이 패딩을 자동으로 제거해 주기 때문", "단방향 정보만 쓰는 모델보다 양방향 정보를 활용한 모델의 성능이 더 좋았기 때문", "양방향 입력이 계산량을 절반으로 줄여 주기 때문"], "a": 2, "exp": "양방향 정보를 활용한 모델이 단방향 모델보다 좋은 성능을 달성했기 때문에 데이터를 양방향으로 넣는다."}, {"id": 68, "sec": "13.10", "diff": "중급", "q": "단어 단위 구조 그림에서 'New York is a long way'에 부여된 레이블 열로 옳은 것은?", "opts": ["B-LOC I-LOC O O O O", "B-PER I-PER O O O O", "O B-LOC I-LOC O O O", "B-LOC B-LOC O O O O"], "a": 0, "exp": "그림에서 New는 B-LOC, York는 I-LOC이고 나머지 단어는 모두 O로 태깅되어 있다."}, {"id": 69, "sec": "13.10", "diff": "중급", "q": "문자 단위 구조의 NER 모델 처리 과정으로 옳은 것은?", "opts": ["단어 레이블을 먼저 예측한 뒤 이를 문자 레이블로 분해한다", "문자 단위 연속 데이터를 RNN에 통과시켜 각 문자의 레이블을 예측한 뒤 문자 레이블을 단어 레이블로 변환한다", "문자 단위 입력을 CRF에만 통과시켜 단어 경계를 결정한다", "문자 임베딩을 평균 내어 문장 하나의 레이블만 예측한다"], "a": 1, "exp": "문장을 문자 열로 보고 RNN으로 각 문자의 레이블을 예측한 뒤 모델의 후처리로 문자 레이블을 단어 레이블로 변환한다."}, {"id": 70, "sec": "13.10", "diff": "심화", "q": "문자 단위 구조가 Penn Treebank(PTB) 데이터셋에서 달성했다고 소개된 POS 태깅 정확도는?", "opts": ["83.1%", "97.8%", "92.4%", "99.2%"], "a": 1, "exp": "강의자료는 PTB에서 여러 언어에 해당 표현을 사용해 97.8%의 정확도로 POS Task 최고 성능을 달성했다고 서술한다."}, {"id": 71, "sec": "13.10", "diff": "기초", "q": "단어 + 문자 단위를 결합한 NER 시스템의 장점으로 강의자료가 든 것은?", "opts": ["문자 임베딩을 사람이 직접 설계할 수 있다", "도메인별 지식이나 리소스를 따로 정의해 둘 필요가 없다", "학습 데이터가 전혀 필요 없다", "CRF 층을 반드시 제거할 수 있다"], "a": 1, "exp": "단어+문자 결합 시스템은 도메인별 지식이나 리소스를 따로 정의하지 않아도 되는 강력한 NER 시스템으로 자리 잡았다."}, {"id": 72, "sec": "13.10", "diff": "심화", "q": "단어 + 문자 단위 구조의 두 가지 기본 모델에 대한 설명으로 옳은 것은?", "opts": ["첫 번째는 문자를 LSTM으로, 두 번째는 문자를 컨볼루션으로 처리하며 둘 다 마지막에 Maxpooling을 쓴다", "두 모델 모두 CRF를 쓰지 않고 argmax로 태그를 결정한다", "첫 번째는 문자를 컨볼루션으로 표현해 단어와 합친 뒤 Bi-LSTM과 softmax/CRF를 쓰고, 두 번째는 각 단어의 문자를 LSTM으로 처리해 단어 임베딩과 연결한 뒤 다시 Bi-LSTM과 softmax/CRF를 쓴다", "첫 번째는 단어만, 두 번째는 문자만 사용해 서로 독립적으로 학습한다"], "a": 2, "exp": "첫 번째 모델은 단어와 컨볼루션 기반 문자 표현을 합쳐 Bi-LSTM 뒤 softmax/CRF를, 두 번째 모델은 문자 LSTM으로 만든 표현을 단어 임베딩과 연결해 문장 수준 Bi-LSTM 뒤 softmax/CRF를 사용한다."}, {"id": 73, "sec": "13.15", "diff": "기초", "q": "사전학습 언어모델 기반 토큰 분류 미세조정에서 사용한다고 소개된 한국어 모델이 아닌 것은?", "opts": ["KLUE-RoBERTa", "KoELECTRA", "KoBERT", "Glove-Ko"], "a": 3, "exp": "강의자료는 KoBERT, KoELECTRA, KLUE-RoBERTa 등 한국어 사전학습 모델을 예로 든다."}, {"id": 74, "sec": "13.15", "diff": "중급", "q": "토큰 분류(Token Classification) 미세조정 방식에 대한 설명으로 옳은 것은?", "opts": ["문장 전체를 하나의 벡터로 만들어 단일 태그만 예측한다", "각 서브워드 토큰 위에 선형 분류기를 붙여 태그를 예측하고, 상단에 CRF를 얹으면 태그열 제약도 반영한다", "CRF를 붙이면 태그열 제약을 반영할 수 없게 된다", "서브워드가 아니라 반드시 어절 단위로만 분류기를 붙인다"], "a": 1, "exp": "각 서브워드 토큰 위에 선형 분류기를 붙이고, 상단에 CRF를 추가하면 태그열 제약까지 반영할 수 있다."}, {"id": 75, "sec": "13.15", "diff": "중급", "q": "강의자료가 든 '남은 과제'에 해당하지 않는 것은?", "opts": ["미등록어·신조어 처리 문제", "뉴스에서 의료·법률로의 도메인 이동 문제", "Viterbi 알고리즘의 계산 복잡도를 O(1)로 줄이는 문제", "중첩 개체명(nested NER)과 태그 체계 불일치 문제"], "a": 2, "exp": "남은 과제로는 미등록어·신조어, 도메인 이동, 중첩 개체명과 태그 체계 불일치가 제시된다."}, {"id": 76, "sec": "13.15", "diff": "중급", "q": "최신 동향에 대한 설명으로 옳은 것은?", "opts": ["LLM의 프롬프트 기반 소량 학습과 생성(seq2seq) 접근이 나오지만, 속도·비용 때문에 경량 Bi-LSTM·BERT 태거가 실무에서 여전히 널리 쓰인다", "LLM 기반 방법이 속도와 비용 면에서도 우수해 경량 태거를 완전히 대체했다", "few-shot 개체명 인식은 사전학습 언어모델에서는 불가능하다", "형태소 분석을 생성 문제로 푸는 접근은 아직 시도된 바 없다"], "a": 0, "exp": "few-shot NER과 생성 기반 접근이 등장했지만 속도와 비용 때문에 경량 Bi-LSTM·BERT 태거가 실무에서 계속 쓰인다."}, {"id": 77, "sec": "13.16", "diff": "기초", "q": "실습 1의 목적으로 옳은 것은?", "opts": ["WordNet 사전 정의로 단어 중의성을 해소하는 것", "오픈 라이브러리인 KoNLPy를 이용해 분석기별 품사 태깅 결과를 비교하는 것", "CoNLL-2003 데이터로 개체명 인식 모델을 만드는 것", "AllenNLP로 의미역을 예측하는 것"], "a": 1, "exp": "실습 1은 KoNLPy를 이용해 여러 분석기의 품사 태깅 결과를 비교하는 것이 목적이다."}, {"id": 78, "sec": "13.16", "diff": "중급", "q": "실습 1에서 문장 '집에 가면 감자 좀 쪄줄래?'를 okt로 분석했을 때 '쪄줄래'에 붙은 태그는?", "opts": ["VV", "Verb", "Noun", "EFQ"], "a": 1, "exp": "okt 결과는 ('쪄줄래','Verb')로, 어미까지 분해하지 않고 하나의 동사로 처리한다."}, {"id": 79, "sec": "13.16", "diff": "심화", "q": "실습 1에서 kkma가 '쪄줄래'를 분석한 결과로 옳은 것은?", "opts": ["('찌','VV'), ('어','ECS'), ('주','VXV'), ('ㄹ래','EFQ')", "('찌','VV'), ('어','EC'), ('주','VX'), ('ㄹ래','EF')", "('쪄줄래','Verb')", "('찌','P'), ('어','E'), ('줄','P'), ('래','E')"], "a": 0, "exp": "kkma는 ('찌','VV'),('어','ECS'),('주','VXV'),('ㄹ래','EFQ')로 분해하며, 두 번째 보기는 komoran, 세 번째는 okt, 네 번째는 hannanum의 결과이다."}, {"id": 80, "sec": "13.16", "diff": "심화", "q": "실습 1에서 '감자'를 두 형태소로 잘못 쪼개어 ('감','P'), ('자','E')로 분석한 분석기는?", "opts": ["kkma", "komoran", "hannanum", "okt"], "a": 2, "exp": "hannanum만 '감자'를 ('감','P'),('자','E')로 분해했고, kkma는 NNG, komoran은 NNP, okt는 Noun으로 하나의 명사 처리했다."}, {"id": 81, "sec": "13.16", "diff": "중급", "q": "실습 1의 실행 결과에서 서로 동일한 분석 결과를 보인 두 분석기는?", "opts": ["komoran과 twitter", "kkma와 komoran", "hannanum과 okt", "okt와 twitter"], "a": 3, "exp": "Okt는 예전 Twitter 분석기의 후신이므로 okt와 twitter의 형태소 분석 결과가 동일하게 출력된다."}, {"id": 82, "sec": "13.16", "diff": "기초", "q": "실습 2의 목적으로 옳은 것은?", "opts": ["NLTK를 이용한 개체명 정보 추출", "KoNLPy 분석기별 태깅 결과 비교", "Bi-LSTM으로 개체명 인식 모델 학습", "WordNet의 사전 정의(gloss) 정보를 이용한 Lesk 알고리즘 실습"], "a": 3, "exp": "실습 2는 WordNet의 사전 정의 정보를 이용하는 Lesk 알고리즘 실습이다."}, {"id": 83, "sec": "13.16", "diff": "심화", "q": "실습 2에서 문장 'They eat a meal'에 대해 단어 'eat'의 Best sense로 출력된 값은?", "opts": ["Synset('take.v.02')", "Synset('eat.v.01')", "Synset('meal.n.01')", "Synset('eat.v.02')"], "a": 3, "exp": "실행 결과는 Sense: eat.v.02, Best sense: Synset('eat.v.02')로 출력된다."}, {"id": 84, "sec": "13.16", "diff": "심화", "q": "실습 2의 compute_overlap 함수가 반환하는 값의 의미로 옳은 것은?", "opts": ["signature와 context의 합집합 크기", "signature와 context의 코사인 유사도", "signature에서 불용어를 뺀 gloss와 context의 교집합 크기", "gloss 토큰 수에서 context 토큰 수를 뺀 값"], "a": 2, "exp": "compute_overlap은 gloss = signature.difference(stopwords) 후 len(gloss.intersection(context))를 반환하며, 예시에서는 2가 출력된다."}, {"id": 85, "sec": "13.16", "diff": "중급", "q": "실습 3에서 NLTK로 개체명 정보를 추출하기 위해 진행한 단계 순서로 옳은 것은?", "opts": ["개체명으로 분석 → 토큰 단위로 분리 → 형태소로 분석", "형태소로 분석 → 토큰 단위로 분리 → 개체명으로 분석", "문장을 토큰 단위로 분리 → 분리된 단어를 형태소로 분석 → 형태소로 분리된 단어를 개체명으로 분석", "토큰 단위로 분리 → 개체명으로 분석 → 형태소로 분석"], "a": 2, "exp": "토큰화 → 형태소(품사) 분석 → 개체명 분석의 세 단계로 진행한다."}, {"id": 86, "sec": "13.16", "diff": "중급", "q": "실습 3에서 사용한 NLTK 함수와 역할을 옳게 짝지은 것은?", "opts": ["nltk.pos_tag()는 문장을 단어로 분리하고 nltk.word_tokenize()는 품사를 붙인다", "nltk.word_tokenize()는 품사를 붙이고 nltk.pos_tag()는 개체명을 출력한다", "nltk.ne_chunk()는 문장을 단어로 분리하고 nltk.pos_tag()는 개체명을 출력한다", "nltk.word_tokenize()는 문장을 단어로 분리하고 nltk.ne_chunk()는 개체명을 출력한다"], "a": 3, "exp": "word_tokenize는 토큰화, pos_tag는 품사 태깅, ne_chunk는 개체명 출력을 담당하며 ne_chunk의 입력은 형태소가 분리된 데이터이다."}, {"id": 87, "sec": "13.16", "diff": "심화", "q": "실습 3의 pos_tag 결과에서 'Boris'와 '31'에 붙은 태그를 옳게 짝지은 것은?", "opts": ["Boris: VBD, 31: DT", "Boris: NNP, 31: NNP", "Boris: NN, 31: CD", "Boris: NNP, 31: CD"], "a": 3, "exp": "출력은 ('Boris','NNP'), ('31','CD')이며 CD는 기수(cardinal number)를 뜻한다."}, {"id": 88, "sec": "13.16", "diff": "중급", "q": "실습 4(심층학습 기반 의미역 실습)에서 사용한 도구로 옳은 것은?", "opts": ["seqeval의 f1_score 함수를 불러와 사용한다", "keras의 Tokenizer로 정수 인코딩을 수행한다", "allennlp의 Predictor로 사전학습된 bert-base-srl 모델을 불러와 사용한다", "KoNLPy의 Komoran 분석기를 불러와 사용한다"], "a": 2, "exp": "실습 4는 allennlp.predictors.predictor의 Predictor로 bert-base-srl 모델을 내려받아 의미역을 예측한다."}, {"id": 89, "sec": "13.16", "diff": "기초", "q": "실습 5에서 사용한 CoNLL-2003 데이터의 한 줄 구성으로 옳은 것은?", "opts": ["[단어][품사][청크][개체명]", "[단어][의미역][품사]", const SECTIONS = {
  "13.1": "발전 흐름",
  "13.2": "형태소·품사 개요",
  "13.3": "KoNLPy 도구",
  "13.4": "HMM·CRF",
  "13.5": "딥러닝 태깅",
  "13.7": "의미역 분석",
  "13.8": "중의성 해소",
  "13.9": "NER·BIO 태깅",
  "13.10": "NER 신경망 구조",
  "13.15": "사전학습·동향",
  "13.16": "실습",
  "13.17": "과제·요약"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week13_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
