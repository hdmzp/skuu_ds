<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9주차 질의 응답·기계 번역·대화 시스템 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 9 · 자연어처리</div>
    <h1>9주차 &middot; 질의 응답, 기계 번역, 그리고 대화 시스템 — 100문제</h1>
    <p class="sub">강의자료 9.1~9.3절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    9주차 강의자료(질의 응답, 기계 번역, 그리고 대화 시스템) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "9.1.1", "diff": "기초", "q": "강의자료에서 정의한 질의응답(Question Answering)에 가장 부합하는 설명은?", "opts": ["키워드에 관련된 문서 목록을 순위화하여 제시하는 기술", "긴 문서를 짧은 요약문으로 압축하는 기술", "한 언어의 문장을 같은 의미의 다른 언어 문장으로 바꾸는 기술", "사용자의 자연어 질문에 부합하는 정답을 문서로부터 찾아 제시하는 기술"], "a": 3, "exp": "질의응답은 자연어 질문에 대해 시스템이 문서에서 정답을 찾아 제시하는 기술로, 문서 목록만 주는 정보 검색과 구별된다."}, {"id": 2, "sec": "9.1.1", "diff": "기초", "q": "정보 검색(IR)과 질의응답(QA)의 비교표에서 QA의 '출력'에 해당하는 것은?", "opts": ["색인된 역파일 구조", "질의 확장에 사용할 키워드 집합", "문서·웹페이지 순위 목록", "정답 문자열 또는 문장"], "a": 3, "exp": "표에서 IR의 출력은 문서·웹페이지 순위 목록이고, QA의 출력은 '마하트마 간디'와 같은 정답 문자열 또는 문장이다."}, {"id": 3, "sec": "9.1.1", "diff": "중급", "q": "정보 검색과 질의응답의 '사용자 부담' 항목을 바르게 비교한 것은?", "opts": ["IR은 정답을 바로 확인하고, QA는 문서를 직접 읽어야 한다", "IR은 문서를 직접 읽어야 하고, QA는 정답을 바로 확인한다(근거 확인은 필요)", "QA는 근거 확인이 전혀 필요 없어 사용자 부담이 0이다", "IR과 QA 모두 사용자가 문서를 직접 읽어야 한다"], "a": 1, "exp": "표에 따르면 IR은 사용자가 문서를 직접 읽어야 하지만 QA는 정답을 바로 확인할 수 있으며, 다만 근거 확인은 필요하다."}, {"id": 4, "sec": "9.1.1", "diff": "중급", "q": "질의응답 기술의 발전 과정을 시기순으로 바르게 나열한 것은?", "opts": ["제한 도메인 → TREC QA 트랙 → 기계독해(MRC)·BERT Reader → DPR·RAG", "제한 도메인 → DPR·RAG → TREC QA 트랙 → 기계독해(MRC)", "기계독해(MRC) → 제한 도메인 → TREC QA 트랙 → DPR·RAG", "TREC QA 트랙 → 제한 도메인 → DPR·RAG → 기계독해(MRC)"], "a": 0, "exp": "1960년대 제한 도메인(BASEBALL 등) → 1999년 TREC QA 트랙 → 2016년 기계독해·BERT Reader → 2020년 DPR·RAG 순으로 발전하였다."}, {"id": 5, "sec": "9.1.1", "diff": "기초", "q": "TREC 질의응답 트랙의 등장으로 특히 발전한 질문 처리 기술은?", "opts": ["음성 합성의 운율 제어", "사실 기반(factoid) 질문 처리", "서술형 이유 설명 문장 생성", "다국어 제로샷 번역"], "a": 1, "exp": "TREC QA 트랙의 등장으로 사실 기반(factoid) 질문 처리 기술이 발전하였고, 이후 오픈 도메인으로 확장되었다."}, {"id": 6, "sec": "9.1.1", "diff": "기초", "q": "질의응답 시스템 분류에서 '문서의 구간을 그대로 뽑아 정답을 만드는' 방식은?", "opts": ["추출형(Extractive)", "지식 기반(Knowledge-based)", "폐쇄 도메인(Closed-domain)", "생성형(Abstractive)"], "a": 0, "exp": "정답 생성 방식 기준에서 추출형은 문서의 구간을 그대로 추출하고, 생성형은 문서를 종합해 새 문장을 만든다."}, {"id": 7, "sec": "9.1.1", "diff": "심화", "q": "'간디는 왜 비폭력을 택했나?'라는 질문은 질의응답 분류 기준상 무엇의 예시인가?", "opts": ["Factoid 질문", "Closed-domain 질문", "Non-factoid 질문", "추출형 정답 생성"], "a": 2, "exp": "'언제 태어났나'와 같이 사실을 묻는 것이 Factoid이고, 이유·설명을 요구하는 '왜' 질문은 Non-factoid로 분류된다."}, {"id": 8, "sec": "9.1.2", "diff": "기초", "q": "정보 검색 기반 질의응답의 3단계 처리 과정 순서로 옳은 것은?", "opts": ["정답 처리 → 질문 처리 → 문서 처리", "질문 처리 → 문서 처리 → 정답 처리", "문서 처리 → 질문 처리 → 정답 처리", "질문 처리 → 정답 처리 → 문서 처리"], "a": 1, "exp": "IR 기반 QA는 질문 처리(question processing), 문서 처리(document processing), 정답 처리(answer processing)의 3단계로 구성된다."}, {"id": 9, "sec": "9.1.2", "diff": "중급", "q": "IR 기반 질의응답의 오류 전파(error propagation)를 설명한 예로 옳은 것은?", "opts": ["각 단계가 완전히 독립적이므로 앞 단계 오류는 뒤 단계에 영향을 주지 않는다", "질문 처리에서 정답유형을 '인물'로 잘못 판단하면 정답 처리에서 올바른 후보를 찾지 못한다", "정답 검증에서 발생한 오류가 질문 처리 단계로 되돌아가 재분류된다", "색인 문서 수가 늘어날수록 검색 속도가 느려진다"], "a": 1, "exp": "각 단계는 앞 단계 결과를 단서로 사용하므로 앞선 오류가 뒤로 전파된다. 정답유형 오분류가 정답후보 추출 실패로 이어지는 것이 대표 예시다."}, {"id": 10, "sec": "9.1.2", "diff": "기초", "q": "질문 처리 단계에 포함되는 세부 작업으로만 묶인 것은?", "opts": ["질문유형 분류, 정답유형 분류, 질의 재생성", "문서 검색, 문장 검색, 관련도 순위화", "정답후보 추출, 정답 순위화, 정답 검증", "색인 구축, 색인 압축, 결과 캐싱"], "a": 0, "exp": "질문 처리 단계는 질문유형 분류·정답유형 분류·질의 재생성으로 구성되며, 나머지는 문서 처리와 정답 처리 단계의 작업이다."}, {"id": 11, "sec": "9.1.2", "diff": "기초", "q": "의문사 '언제(When)'에 대응하는 정답 유형 제약으로 표에 제시된 것은?", "opts": ["수량, 금액, 비율", "날짜, 시간, 기간", "장소, 지명, 국가", "인물, 기관, 단체"], "a": 1, "exp": "표에서 '언제/When'은 날짜·시간·기간을, '누가'는 인물·기관·단체를, '어디'는 장소·지명·국가를 정답 유형 제약으로 갖는다."}, {"id": 12, "sec": "9.1.2", "diff": "심화", "q": "의문사와 정답유형의 관계에 대한 설명으로 옳은 것은?", "opts": ["의문사만 확인하면 정답유형이 항상 하나로 확정된다", "의문사는 정답유형 판단과 무관하며 검색어 추출에만 쓰인다", "정답유형을 먼저 확정한 뒤에야 의문사를 추출할 수 있다", "의문사는 중요한 단서이지만 정답유형을 완전히 결정짓지는 못하며 제약 정보로 활용된다"], "a": 3, "exp": "강의자료는 의문사가 정답유형 결정의 중요한 단서지만 완전히 결정짓지는 못하고 다양한 정답유형에 대한 제약 정보로 활용된다고 설명한다."}, {"id": 13, "sec": "9.1.2", "diff": "기초", "q": "질의 재생성(query reformulation) 단계의 목적으로 옳은 것은?", "opts": ["질문 내 주요 키워드와 문장 패턴을 인식해 검색용 질의를 새로 생성한다", "사용자의 음성 신호를 텍스트로 변환한다", "정답 후보들의 최종 순위를 확정한다", "지식베이스의 트리플을 새로 추가한다"], "a": 0, "exp": "질문은 단문이라 검색에 바로 쓰기 불리하므로, 키워드·패턴을 인식해 문서 검색용 질의를 새로 만드는 것이 질의 재생성이다."}, {"id": 14, "sec": "9.1.2", "diff": "중급", "q": "'인도의 독립 운동을 이끈 사람은 누구인가?'에 대해 강의자료가 제시한 재생성 질의는?", "opts": ["간디 AND 생년월일", "(간디, 생년월일, ?x)", "독립 OR 운동 OR 사람 OR 인도", "인도 AND 독립운동 AND 지도자 (유의어 확장)"], "a": 3, "exp": "불용어 제거와 유의어·상위어 확장을 적용해 '인도 AND 독립운동 AND 지도자'로 재생성된 예가 제시되었다."}, {"id": 15, "sec": "9.1.2", "diff": "기초", "q": "불리언(Boolean) 검색 모델의 한계로 옳은 것은?", "opts": ["단어 가중치를 실수로 계산하느라 속도가 매우 느리다", "문서 길이 정규화를 과도하게 적용해 긴 문서를 배제한다", "의미 임베딩을 사용하므로 결과 해석이 어렵다", "일치 여부만 표시하므로 어떤 문서가 더 중요한지 순위를 매길 수 없다"], "a": 3, "exp": "불리언 모델은 질의어 출현 여부만 표시해 순위화가 불가능하고 결과 개수가 많아 질의를 다듬는 전문적 능력이 필요하다."}, {"id": 16, "sec": "9.1.2", "diff": "중급", "q": "tf-idf(t, d) = tf(t, d) × log( N / df(t) ) 에서 df(t)가 의미하는 것은?", "opts": ["단어 t가 출현한 문서의 수", "단어 t의 문서 d 내 출현 빈도", "전체 문서 컬렉션의 크기", "문서 d에 포함된 전체 단어 수"], "a": 0, "exp": "N은 전체 문서 수, df(t)는 단어 t가 나타난 문서 수이며, tf(t,d)가 문서 내 빈도이다. log(N/df)가 희귀성을 나타낸다."}, {"id": 17, "sec": "9.1.2", "diff": "중급", "q": "벡터 공간 모델에서 질의 벡터와 문서 벡터를 비교해 문서를 순위화할 때 사용하는 유사도는?", "opts": ["길이 벌점(BP)", "Slot Error Rate", "편집 거리", "코사인 유사도"], "a": 3, "exp": "sim(q, d) = cos(vq, vd) = (vq·vd)/(|vq||vd|) 로 정의되는 코사인 유사도로 문서를 순위화한다."}, {"id": 18, "sec": "9.1.2", "diff": "심화", "q": "질의 '독립 운동가'와 문서 '민족 해방 지도자'가 표면형 차이로 매칭되지 않는 문제를 무엇이라 하는가?", "opts": ["오류 전파(error propagation)", "데이터 희소성(data sparsity)", "어휘 불일치(lexical gap)", "빈도 포화(saturation)"], "a": 2, "exp": "TF-IDF·BM25 같은 단어 일치 기반 검색의 한계가 어휘 불일치이며, 이것이 밀집 검색(DPR)의 출발점이 되었다."}, {"id": 19, "sec": "9.1.2", "diff": "심화", "q": "정답 처리 단계의 절차를 순서대로 바르게 나열한 것은?", "opts": ["정답 유형 확인 → 형태소 분석·개체명 태깅 → 같은 범주의 후보 추출 → 후보 순위화 → 최종 정답 제시", "후보 추출 → 정답 유형 확인 → 형태소 분석 → 최종 정답 제시 → 후보 순위화", "최종 정답 제시 → 후보 순위화 → 후보 추출 → 정답 유형 확인 → 형태소 분석", "형태소 분석 → 정답 유형 확인 → 후보 순위화 → 후보 추출 → 최종 정답 제시"], "a": 0, "exp": "정답 처리는 정답 유형 확인부터 시작해 태깅, 동일 범주 후보 추출, 순위화를 거쳐 최종 정답을 제시하는 순서로 진행된다."}, {"id": 20, "sec": "9.1.2", "diff": "중급", "q": "정답후보 추출 예시에서 후보 '1950년'이 제외된 이유로 옳은 것은?", "opts": ["문서에서 두 번 이상 반복 등장했기 때문", "개체명 태그가 DATE여서 정답유형 PERSON과 일치하지 않기 때문", "질의 키워드를 지나치게 많이 포함하기 때문", "개체명 인식 자체가 실패했기 때문"], "a": 1, "exp": "질문의 정답유형이 인물(PERSON)이므로 DATE 태그인 '1950년'과 TERM 태그인 '비폭력 저항'은 정답유형 불일치로 제외되었다."}, {"id": 21, "sec": "9.1.2", "diff": "심화", "q": "정답후보 예시에서 '나렌드라 모디'가 1위가 아니라 2위로 순위화된 이유로 가장 적절한 것은?", "opts": ["검색된 문장에 등장하지 않기 때문", "개체명 태그가 PERSON이 아니기 때문", "정답유형은 일치하지만 포함한 질의 키워드가 '인도'뿐이어서 키워드 중복성이 낮기 때문", "정답유형이 DATE로 분류되었기 때문"], "a": 2, "exp": "순위화 기준은 정답유형 일치, 질의 키워드 포함, 재생성 질의와의 유사도이다. '마하트마 간디'는 '독립 운동, 인도'를 모두 포함해 1위가 된다."}, {"id": 22, "sec": "9.1.3", "diff": "기초", "q": "지식 기반 질의응답(Knowledge-based QA)에 대한 설명으로 옳은 것은?", "opts": ["자연어 질문을 논리형이나 SPARQL 같은 질의어로 변환해 구조화된 지식베이스에서 정답을 찾는다", "검색된 문서를 프롬프트에 넣어 생성 모델이 정답 문장을 만든다", "질문과 문서를 같은 임베딩 공간의 벡터로 만들어 내적으로 유사도를 계산한다", "문서 집합을 색인해 BM25로 검색한 뒤 정답 구간을 추출한다"], "a": 0, "exp": "지식 기반 QA는 의미 분석(semantic parsing)으로 질문을 지식베이스 질의로 바꾸어 정답을 찾는 방식이다. 나머지는 IR 기반·DPR·RAG의 설명이다."}, {"id": 23, "sec": "9.1.3", "diff": "중급", "q": "지식 기반 질의응답의 단점으로 강의자료가 지적한 것은?", "opts": ["지식베이스 구축 비용이 크고 지식베이스에 없는 질문에는 답할 수 없다", "반드시 대규모 병렬 코퍼스를 필요로 한다", "날짜·수치 같은 사실형 질문에 특히 약하다", "정답의 근거를 추적하기가 매우 어렵다"], "a": 0, "exp": "지식 기반 QA는 정답이 정확하고 근거 추적이 쉬운 장점이 있으나, 구축 비용과 coverage 문제가 단점으로 지적된다."}, {"id": 24, "sec": "9.1.3", "diff": "중급", "q": "BERT 기반 기계독해(MRC)의 입력 형식으로 강의자료가 제시한 것은?", "opts": ["[CLS] 질문 [SEP] 지문 [SEP]", "질문 + 정답 + 지문을 이어붙인 형태", "[BOS] 지문 [EOS] 만 입력", "[CLS] 지문 [MASK] 질문"], "a": 0, "exp": "MRC는 [CLS] 질문 [SEP] 지문 [SEP] 형태로 함께 입력하고 각 토큰의 은닉 벡터에 선형층을 붙여 start/end 확률을 계산한다."}, {"id": 25, "sec": "9.1.3", "diff": "심화", "q": "기계독해에서 예측 정답 구간을 결정하는 방식으로 옳은 것은?", "opts": ["지문 전체 문장의 생성 확률을 최대화한다", "start와 end를 각각 독립적으로 최대화하고 위치 제약을 두지 않는다", "argmax P(start=i)·P(end=j), 단 i ≤ j", "argmax P(start=i)·P(end=j), 단 i ≥ j"], "a": 2, "exp": "시작 위치가 끝 위치보다 앞에 있어야 하므로 i ≤ j 제약 아래 두 확률의 곱을 최대화하는 구간을 예측한다."}, {"id": 26, "sec": "9.1.3", "diff": "중급", "q": "기계독해(MRC) 방식의 한계로 옳은 것은?", "opts": ["사전학습 언어모델을 활용할 수 없다", "지문 없이 정답을 만들어내므로 환각이 심하다", "정답 근거를 지문에서 확인할 수 없어 검증이 불가능하다", "정답이 지문 안에 문자열로 존재해야 하므로 추론형 질문에 약하다"], "a": 3, "exp": "MRC는 정답 근거가 지문에 명시되어 검증이 가능한 것이 장점이지만, 정답이 지문에 문자열로 있어야 한다는 것이 한계다."}, {"id": 27, "sec": "9.1.3", "diff": "기초", "q": "오픈 도메인 QA의 Retriever–Reader 구조에 대한 설명으로 옳은 것은?", "opts": ["검색기가 후보 문서를 좁히고 독해기가 그 안에서 정답을 추출한다", "검색기가 정답을 생성하고 독해기는 문법만 교정한다", "검색기와 독해기가 동시에 정답 문자열을 투표로 결정한다", "독해기가 먼저 정답을 만든 뒤 검색기가 근거 문서를 찾는다"], "a": 0, "exp": "Retriever(TF-IDF/BM25/DPR)가 후보 문서를 좁히고 Reader(BERT MRC)가 정답과 근거를 추출하는 2단계 구조이다."}, {"id": 28, "sec": "9.1.3", "diff": "심화", "q": "밀집 검색(dense retrieval, DPR)이 희소 검색(BM25) 대비 갖는 이점으로 옳은 것은?", "opts": ["길이 벌점을 적용해 짧은 문서를 자동으로 제외한다", "단어 일치 기반이라 검색 결과의 해석이 더 쉽다", "색인 없이 전체 문서를 전수 조사하므로 누락이 없다", "표면형이 달라도 의미가 비슷하면 검색되어 어휘 불일치 문제를 완화한다"], "a": 3, "exp": "DPR은 질문과 문서를 같은 임베딩 공간의 벡터로 만들어 내적으로 유사도를 계산하므로 표면형이 달라도 의미가 비슷하면 검색된다. 해석 용이성은 희소 검색의 장점이다."}, {"id": 29, "sec": "9.1.3", "diff": "중급", "q": "RAG(Retrieval-Augmented Generation)의 장점으로 옳은 것은?", "opts": ["근거 문서를 제시하지 않으므로 응답이 간결해진다", "모델을 재학습하지 않고도 최신 문서·사내 문서를 반영할 수 있다", "검색 품질이 나빠도 생성 품질은 항상 유지된다", "지식베이스를 사람이 구축하지 않아도 정답이 언제나 정확하다"], "a": 1, "exp": "RAG는 재학습 없이 최신·사내 문서를 반영하고, 근거 문서를 함께 제시해 환각을 줄이며 출처 확인이 가능하다는 장점이 있다."}, {"id": 30, "sec": "9.1.3", "diff": "심화", "q": "RAG 사용 시 유의점으로 강의자료가 언급한 것은?", "opts": ["RAG를 쓰면 환각이 원리적으로 발생하지 않는다", "근거 문서를 많이 넣을수록 정확도가 항상 올라간다", "생성 모델이 충분히 크면 검색 단계가 불필요해진다", "검색 품질이 낮으면 생성 결과도 함께 나빠진다(garbage in, garbage out)"], "a": 3, "exp": "RAG는 검색 품질에 성능이 좌우되며, 근거에 없는 내용을 생성하지 않도록 프롬프트와 검증 단계를 설계해야 한다."}, {"id": 31, "sec": "9.1.3", "diff": "중급", "q": "정답(gold)이 '마하트마 간디'인데 예측(pred)이 '간디'일 때, 강의자료 표에 제시된 EM과 토큰 F1 값은?", "opts": ["EM 0, 토큰 F1 0.00", "EM 0, 토큰 F1 0.67", "EM 1, 토큰 F1 0.67", "EM 1, 토큰 F1 1.00"], "a": 1, "exp": "완전 일치가 아니므로 EM은 0이지만 토큰이 부분적으로 겹치므로 토큰 F1은 0.67이 된다."}, {"id": 32, "sec": "9.1.3", "diff": "심화", "q": "생성형 질의응답의 평가에 대한 설명으로 옳지 않은 것은?", "opts": ["사람 평가나 LLM 심사(LLM-as-a-judge)를 함께 사용한다", "근거 제시 여부(attribution)도 중요한 평가 항목이다", "정답 표현이 다양해도 EM만으로 충분히 평가할 수 있다", "ROUGE·BERTScore 같은 지표를 병행한다"], "a": 2, "exp": "생성형 QA는 정답 표현이 다양하므로 EM/F1만으로는 부족하며 ROUGE·BERTScore·사람 평가·LLM 심사를 병행한다."}, {"id": 33, "sec": "9.2.1", "diff": "기초", "q": "강의자료가 정의한 '번역'에 해당하는 것은?", "opts": ["음성 신호를 문자로 받아 적는 작업", "긴 문장을 핵심만 남겨 짧게 줄이는 작업", "질문에 대한 정답을 문서에서 찾는 작업", "하나의 언어로 쓰인 글을 같은 의미를 나타내는 다른 언어의 글로 변환하는 작업"], "a": 3, "exp": "번역은 한 언어의 글을 같은 의미의 다른 언어 글로 변환하는 작업이며, 이를 컴퓨터에 맡긴 것이 기계번역이다."}, {"id": 34, "sec": "9.2.1", "diff": "기초", "q": "'나는 사과를 먹었다 → I ate an apple' 예시가 보여주는 기계번역의 난점은?", "opts": ["어순 차이(SOV vs SVO)", "문화·관용 표현", "형태론 차이", "어휘 중의성"], "a": 0, "exp": "한국어는 SOV, 영어는 SVO이므로 단어 순서대로 옮기면 문장이 성립하지 않는다는 어순 차이의 예시다."}, {"id": 35, "sec": "9.2.1", "diff": "기초", "q": "'배'가 문맥에 따라 ship / pear / stomach로 번역되는 현상은 어떤 난점인가?", "opts": ["어순 차이", "어휘 중의성", "형태론 차이", "대응 단위 불일치"], "a": 1, "exp": "한 단어가 여러 의미를 가져 문맥으로 판단해야 하는 것이 어휘 중의성이다."}, {"id": 36, "sec": "9.2.1", "diff": "중급", "q": "'to the conference → 컨퍼런스에'가 예시하는 기계번역의 난점은?", "opts": ["대응 단위 불일치", "문화·관용 표현", "형태론 차이", "어휘 중의성"], "a": 0, "exp": "영어의 여러 단어가 한국어의 한 어절로 옮겨지는 것처럼, 한 단어가 여러 단어(구)로 번역되고 그 역도 성립하는 대응 단위 불일치이다."}, {"id": 37, "sec": "9.2.1", "diff": "기초", "q": "규칙 기반 기계번역(RBMT)에 대한 설명으로 옳은 것은?", "opts": ["언어학적·문법적 규칙으로 분석하고 번역한 뒤 목표 언어 문법에 맞게 다듬는다", "검색된 문서를 프롬프트에 넣어 번역문을 생성한다", "병렬 코퍼스에서 확률을 추정해 가장 확률이 높은 문장을 고른다", "인코더와 디코더 신경망으로 종단간 학습을 수행한다"], "a": 0, "exp": "RBMT는 형태소·구문 분석 후 핵심 단어를 목표 언어로 번역하고 목표 언어의 문법 규칙에 맞게 정제하며, 통사적·의미론적 구조를 함께 분석한다."}, {"id": 38, "sec": "9.2.1", "diff": "중급", "q": "Vauquois 삼각형에서 원문을 깊은 분석 없이 곧바로 역문으로 옮기는 가장 얕은 전략은?", "opts": ["전이 방식(transfer)", "역번역(back-translation) 방식", "중간 언어(interlingua) 방식", "직접 방식(direct)"], "a": 3, "exp": "직접 방식은 원문(Source)에서 역문(Target)으로 바로 가고, 전이 방식은 구문 구조 수준에서, interlingua는 의미 표현을 거쳐 중간 언어로 변환한다."}, {"id": 39, "sec": "9.2.1", "diff": "심화", "q": "Vauquois 삼각형에서 분석을 깊게 할수록 나타나는 현상으로 옳은 것은?", "opts": ["언어쌍별 규칙은 줄지만 분석 난도가 높아진다", "언어쌍별 규칙과 분석 난도가 모두 늘어난다", "언어쌍별 규칙과 분석 난도가 모두 줄어든다", "언어쌍별 규칙은 늘지만 분석 난도는 낮아진다"], "a": 0, "exp": "분석을 깊게 해 중간 언어에 가까워질수록 언어쌍별로 따로 만들 규칙은 줄어들지만 그만큼 분석 자체가 어려워진다."}, {"id": 40, "sec": "9.2.1", "diff": "중급", "q": "규칙 기반 기계번역의 장점으로 볼 수 없는 것은?", "opts": ["문법 규칙을 반드시 지키므로 번역문의 문법이 꽤 정확하다", "언어쌍이 늘어나도 규칙을 자동으로 학습하므로 확장성이 높다", "한 언어의 규칙에 대응하는 다른 언어의 규칙을 적용해 문장을 옮긴다", "규칙이 명시적이라 오류의 원인을 추적하고 수정하기 쉽다"], "a": 1, "exp": "규칙과 사전을 언어쌍마다 사람이 직접 구축해야 하므로 확장성이 낮은 것이 RBMT의 한계다."}, {"id": 41, "sec": "9.2.1", "diff": "심화", "q": "한국어를 대상으로 한 규칙 기반 번역의 어려움으로 강의자료가 든 것은?", "opts": ["한국어에는 어휘 중의성이 전혀 존재하지 않는다", "형태소가 결합하며 형태가 바뀌어 분석이 어렵고 오분석의 여파가 결과물까지 이어진다", "한국어 병렬 코퍼스가 세계에서 가장 풍부해 규칙이 무의미하다", "한국어는 어순이 고정되어 있어 규칙을 만들 필요가 없다"], "a": 1, "exp": "한국어는 형태소 결합으로 형태가 변해 분석이 어렵고, 잘못된 분석의 여파가 번역 결과까지 이어져 결과물이 쓸모없어지는 경우가 잦았다."}, {"id": 42, "sec": "9.2.2", "diff": "기초", "q": "통계 기반 기계번역(SMT)의 정의로 옳은 것은?", "opts": ["원문을 중간 언어로 바꾼 뒤 규칙으로 다시 목표 언어로 옮기는 방법", "언어학자가 작성한 변환 규칙을 순서대로 적용해 번역하는 방법", "질문 유형을 분류해 문서에서 정답을 추출하는 방법", "대량의 예제 문장으로 두 언어 사이의 상관관계를 통계 분석한 모델로 번역을 제시하는 방법"], "a": 3, "exp": "SMT는 대량의 예제 문장으로 두 언어의 상관관계를 통계적으로 분석한 모델을 만들어 번역하는 방법으로, 사람이 규칙을 쓰는 대신 데이터가 규칙을 대신한다."}, {"id": 43, "sec": "9.2.2", "diff": "기초", "q": "통계 기반 기계번역이 규칙 기반과 달리 반드시 필요로 하는 것은?", "opts": ["두 언어로 같은 내용을 뜻하는 문장이 쌍으로 연결된 병렬 코퍼스", "개체명이 태깅된 단일 언어 코퍼스", "구조화된 지식베이스 트리플", "언어쌍별로 사람이 작성한 문법 규칙 사전"], "a": 0, "exp": "기계가 코퍼스를 통해 번역을 학습해야 하므로 문장쌍이 연결된 병렬 코퍼스(parallel corpus)가 필수적이다."}, {"id": 44, "sec": "9.2.2", "diff": "중급", "q": "병렬 코퍼스 크기에 따른 번역 품질 예시 그래프에서 코퍼스가 10만 문장쌍일 때의 점수로 제시된 값은?", "opts": ["12.4", "23.5", "31.2", "19.8"], "a": 0, "exp": "그래프는 10만 12.4, 50만 19.8, 100만 23.5, 500만 28.9, 1000만 31.2로 제시되어 코퍼스가 커질수록 품질이 오르되 증가폭은 둔화됨을 보여준다."}, {"id": 45, "sec": "9.2.2", "diff": "중급", "q": "P(F | E) = count(E, F) / count(E) 를 이용해 최종 번역문을 선택하는 식으로 옳은 것은?", "opts": ["F* = argmin_F P(F | E)", "F* = argmax_F P(F | E)", "F* = argmax_F P(E)", "E* = argmax_E P(F | E)"], "a": 1, "exp": "모든 프랑스어 문장 후보에 대해 확률을 구한 뒤 가장 높은 것을 고르므로 F* = argmax_F P(F|E) 이다."}, {"id": 46, "sec": "9.2.2", "diff": "중급", "q": "문장 단위 조건부 확률만으로는 기계번역을 수행할 수 없는 이유로 옳은 것은?", "opts": ["코퍼스가 커질수록 모든 확률이 0으로 수렴하기 때문", "입력 문장이 코퍼스에 존재하지 않으면 확률조차 구할 수 없다(data sparsity)", "병렬 코퍼스를 아예 만들 수 없기 때문", "조건부 확률 값이 음수가 될 수 있기 때문"], "a": 1, "exp": "우리가 세상의 모든 문장을 알 수 없으므로 코퍼스에 없는 입력 문장은 확률을 구할 수 없다는 데이터 희소성 문제가 있다."}, {"id": 47, "sec": "9.2.2", "diff": "심화", "q": "'코퍼스를 무작정 키우면 문제가 해결된다'는 주장에 대한 강의자료의 반박으로 옳은 것은?", "opts": ["코퍼스가 커지면 계산 시간이 무한대가 되기 때문", "품질 좋은 사람 번역 문장쌍은 시간·비용이 크고 언어는 무한하므로 모든 문장을 담은 병렬 코퍼스는 만들 수 없다", "코퍼스가 커지면 번역 품질이 오히려 떨어지기 때문", "코퍼스가 커지면 규칙 기반 방식으로 되돌아가야 하기 때문"], "a": 1, "exp": "좋은 품질의 사람 번역 문장쌍 구축에는 큰 비용이 들고 언어가 무한하다는 특성 때문에 완전한 병렬 코퍼스는 절대 만들 수 없다."}, {"id": 48, "sec": "9.2.2", "diff": "중급", "q": "잡음 통로 모델(Noisy Channel Model)에서 베이즈 정리를 적용해 정리한 최종 형태는?", "opts": ["F* = argmax_F P(F | E) · P(E)", "F* = argmax_F P(E) · P(F | E)", "F* = argmax_F P(E | F) · P(F)", "F* = argmax_F P(E | F) / P(F)"], "a": 2, "exp": "P(F|E) = P(E|F)P(F)/P(E) 에서 P(E)를 제거하면 F* = argmax_F P(E|F)·P(F) 가 된다."}, {"id": 49, "sec": "9.2.2", "diff": "중급", "q": "잡음 통로 모델에서 P(E)를 argmax 계산에서 제거할 수 있는 이유는?", "opts": ["P(E)는 F의 선택에 영향을 주지 않기 때문", "P(E)를 계산할 방법이 전혀 없기 때문", "P(E)가 언어 모델과 동일한 값이기 때문", "P(E)의 값이 항상 1이기 때문"], "a": 0, "exp": "입력 E는 고정되어 있으므로 P(E)는 어떤 F를 고르든 같은 값이라 argmax 결과에 영향을 주지 않는다."}, {"id": 50, "sec": "9.2.2", "diff": "심화", "q": "잡음 통로 모델의 두 구성 요소와 학습 자료를 바르게 연결한 것은?", "opts": ["두 모델 모두 단일 언어 코퍼스만으로 학습한다", "번역 모델 P(E|F)는 단일 언어 코퍼스에서, 언어 모델 P(F)는 병렬 코퍼스에서 학습한다", "번역 모델 P(E|F)는 병렬 코퍼스에서, 언어 모델 P(F)는 단일 언어 코퍼스에서 학습한다", "번역 모델과 언어 모델 모두 병렬 코퍼스에서만 학습한다"], "a": 2, "exp": "번역 모델은 두 언어 단어·구의 대응 관계를 병렬 코퍼스에서 학습하고, 언어 모델은 목표 언어의 자연스러움을 단일 언어 코퍼스에서 학습한다."}, {"id": 51, "sec": "9.2.2", "diff": "기초", "q": "잡음 통로 모델에서 언어 모델 P(F)가 담당하는 역할은?", "opts": ["입력 문장의 형태소 분석", "두 언어 단어·구 사이의 대응 관계", "정답 후보에 대한 개체명 태깅", "목표 언어 문장의 어순·활용 등 자연스러움"], "a": 3, "exp": "언어 모델이 목표 언어 문장의 자연스러움을 담당하므로 어순과 활용에 관한 문제를 크게 완화한다."}, {"id": 52, "sec": "9.2.2", "diff": "중급", "q": "단어 정렬(word alignment) 정보를 얻는 방법으로 강의자료가 제시한 것은?", "opts": ["병렬 코퍼스에 항상 정렬 태그가 포함되어 제공된다", "BLEU 점수를 역산해 정렬을 복원한다", "규칙 기반 변환 사전에서 직접 조회한다", "사람이 표시해 주지 않으므로 EM 알고리즘으로 반복 추정한다(IBM Model 1~5)"], "a": 3, "exp": "정렬 정보는 주어지지 않으므로 IBM Model 1~5에서 EM 알고리즘으로 반복 추정한다."}, {"id": 53, "sec": "9.2.2", "diff": "심화", "q": "단어 정렬의 형태에 대한 설명으로 옳은 것은?", "opts": ["1:1뿐 아니라 1:다, 다:1, 교차(reordering)로도 나타나며 이것이 어순 차이를 모델링하는 방법이다", "항상 1:1 대응만 허용되며 예외는 오류로 처리한다", "교차 정렬은 반드시 제거해야 하는 잡음이다", "정렬은 목표 언어 문장을 생성한 이후에만 계산할 수 있다"], "a": 0, "exp": "정렬은 1:다, 다:1, 교차로 나타나며, 교차(reordering)가 바로 어순 차이를 모델링하는 방법이다."}, {"id": 54, "sec": "9.2.2", "diff": "중급", "q": "단어 정렬 결과를 모아 만드는 것으로, 구 기반 번역의 출발점이 되는 자료 구조는?", "opts": ["구 번역 표(phrase table)", "위치 인코딩 행렬", "역파일 색인", "어텐션 가중치 행렬"], "a": 0, "exp": "정렬 결과를 모아 구 번역 표(phrase table)를 만드는 것이 구 기반 번역의 출발점이다."}, {"id": 55, "sec": "9.2.2", "diff": "중급", "q": "구 기반 번역 예시에서 'in France'에 대응하는 한국어 번역으로 제시된 것은?", "opts": ["프랑스로 가는", "프랑스에", "프랑스에서 열리는", "프랑스의"], "a": 2, "exp": "예시에서 Tomorrow→내일, I will fly→나는 비행기로 간다, to the conference→컨퍼런스에, in France→프랑스에서 열리는 으로 묶여 번역되었다."}, {"id": 56, "sec": "9.2.2", "diff": "심화", "q": "통계 모델을 이용한 실제 번역(디코딩) 과정의 순서로 옳은 것은?", "opts": ["입력 문장 → 구 분할 → 구별 번역 후보 생성 → 빔 탐색으로 조합 탐색 → 어순 재배열 → 최종 번역문", "입력 문장 → 빔 탐색 → 구 분할 → 어순 재배열 → 번역 후보 생성 → 최종 번역문", "입력 문장 → 어순 재배열 → 구 분할 → 빔 탐색 → 번역 후보 생성 → 최종 번역문", "입력 문장 → 번역 후보 생성 → 어순 재배열 → 구 분할 → 빔 탐색 → 최종 번역문"], "a": 0, "exp": "디코딩은 구 분할, 구별 번역 후보 생성, 빔 탐색 조합, 어순 재배열 순으로 진행되며 순서 조절은 마지막 단계에서 이루어진다."}, {"id": 57, "sec": "9.2.2", "diff": "중급", "q": "디코딩에서 모든 경우를 계산하지 않고 빔 탐색(beam search)을 사용하는 이유는?", "opts": ["번역 모델 점수를 무시하기 위해서", "언어 모델 점수를 사용하지 않기 위해서", "정답 번역이 언제나 하나뿐이기 때문", "가능한 조합의 수가 폭발적으로 늘어나 전수 계산이 불가능하기 때문"], "a": 3, "exp": "구별 번역 후보를 조합하면 경우의 수가 폭발적으로 증가하므로 상위 후보만 유지하는 빔 탐색을 사용한다."}, {"id": 58, "sec": "9.2.2", "diff": "중급", "q": "구 기반 통계 번역의 디코딩에서 최종 점수를 구성하는 요소로 옳은 것은?", "opts": ["BLEU 점수와 chrF 점수의 산술평균", "EM과 F1의 조화평균", "Slot Error Rate의 역수", "번역 모델 점수 · 언어 모델 점수 · 구 재배열 점수의 가중합"], "a": 3, "exp": "번역 모델 점수, 언어 모델 점수, 구 재배열 점수를 가중합한 값이 최종 점수가 된다."}, {"id": 59, "sec": "9.2.3", "diff": "기초", "q": "BLEU 점수에 대한 정의로 옳은 것은?", "opts": ["기계 번역문과 참조 번역문의 n-gram 일치 비율(정밀도)을 기하평균한 뒤 짧은 번역에 벌점을 주는 지표", "시스템이 잘못 채운 슬롯의 비율을 나타내는 지표", "기계 번역문의 재현율을 산술평균해 구하는 지표", "번역문에 남은 문법 오류의 개수를 세는 지표"], "a": 0, "exp": "BLEU = BP · exp(Σ w_n log p_n) 으로, n-gram 정밀도의 기하평균에 길이 벌점 BP를 곱한 값이다."}, {"id": 60, "sec": "9.2.3", "diff": "중급", "q": "BLEU의 길이 벌점 BP에 대한 설명으로 옳은 것은? (c=후보 길이, r=참조 길이)", "opts": ["BP는 n-gram 정밀도의 기하평균과 같은 값이다", "c와 무관하게 BP는 항상 1이다", "c > r이면 BP = 1이고, c ≤ r이면 BP = exp(1 − r/c)이다", "c > r이면 BP = exp(1 − r/c)이고, c ≤ r이면 BP = 1이다"], "a": 2, "exp": "후보가 참조보다 길면 벌점이 없어 BP=1이고, 짧거나 같으면 exp(1 − r/c)로 벌점을 준다."}, {"id": 61, "sec": "9.2.3", "diff": "중급", "q": "BLEU의 n-gram 정밀도 p_n 계산에서 clipping을 적용하는 이유는?", "opts": ["같은 n-gram을 중복해서 세지 않도록 하기 위해", "동의어를 정답으로 인정하기 위해", "어순 변화를 점수에 반영하기 위해", "문장 길이를 정규화하기 위해"], "a": 0, "exp": "clipping은 후보가 같은 n-gram을 반복해 정밀도를 부풀리는 것을 막는 장치다. 길이 문제는 BP가, 동의어·어순은 다른 지표가 담당한다."}, {"id": 62, "sec": "9.2.3", "diff": "중급", "q": "참조 'the cat is on the mat', 후보 'the cat is on mat'일 때 강의자료가 제시한 2-gram 정밀도 p_2 값은?", "opts": ["1/2 = 0.500", "3/4 = 0.750", "2/3 = 0.667", "5/5 = 1.000"], "a": 1, "exp": "후보의 2-gram은 4개이고 그중 3개가 참조와 일치하므로 p_2 = 3/4 = 0.750 이다. 1.000은 p_1, 0.667은 p_3, 0.500은 p_4 값이다."}, {"id": 63, "sec": "9.2.3", "diff": "심화", "q": "위 BLEU 계산 예시에서 BP와 최종 BLEU 값은 각각 얼마인가?", "opts": ["BP = 1.000, BLEU ≈ 0.71", "BP = exp(1 − 6/5) ≈ 0.819, BLEU ≈ 0.82", "BP ≈ 0.667, BLEU ≈ 0.50", "BP = exp(1 − 6/5) ≈ 0.819, BLEU ≈ 0.58"], "a": 3, "exp": "후보 길이 5, 참조 길이 6이므로 BP = exp(1 − 6/5) ≈ 0.819이고, BLEU = 0.819 × (1·0.75·0.667·0.5)^(1/4) ≈ 0.58 이다."}, {"id": 64, "sec": "9.2.3", "diff": "심화", "q": "BLEU의 한계와 보완 지표에 대한 설명으로 옳지 않은 것은?", "opts": ["문장 단위로 계산한 BLEU는 코퍼스 단위보다 신뢰도가 높다", "어순 변화와 동의어를 제대로 반영하지 못한다", "COMET·BERTScore는 의미 임베딩에 기반한 지표다", "chrF는 문자 단위 n-gram을 사용하는 보완 지표다"], "a": 0, "exp": "강의자료는 문장 단위 BLEU 점수의 신뢰도가 낮다고 지적한다. 나머지는 모두 옳은 설명이다."}, {"id": 65, "sec": "9.2.4", "diff": "기초", "q": "seq2seq(인코더–디코더) 기계번역 구조에 대한 설명으로 옳은 것은?", "opts": ["단어 정렬을 사람이 미리 표시해 주어야 학습이 가능하다", "디코더가 원문을 압축하고 인코더가 번역문을 생성한다", "구 번역 표와 재배열 규칙을 명시적으로 사용해 조합한다", "인코더가 원문 전체를 하나의 문맥 벡터로 압축하고 디코더가 그 벡터로부터 번역문을 한 단어씩 생성한다"], "a": 3, "exp": "seq2seq는 별도의 정렬·구 표·재배열 규칙 없이 병렬 코퍼스만으로 종단간 학습이 가능한 구조다."}, {"id": 66, "sec": "9.2.4", "diff": "중급", "q": "seq2seq의 한계로 지적된 정보 병목(information bottleneck)은 무엇인가?", "opts": ["병렬 코퍼스를 구할 수 없는 문제", "긴 문장의 정보를 고정 길이 벡터 하나에 담기 어려운 문제", "어휘 사전이 무한히 커지는 문제", "디코더가 순차 계산을 수행하지 못하는 문제"], "a": 1, "exp": "인코더가 원문 전체를 고정 길이 문맥 벡터 하나로 압축하기 때문에 긴 문장에서 정보 손실이 발생하며, 이를 어텐션으로 해결하였다."}, {"id": 67, "sec": "9.2.4", "diff": "중급", "q": "어텐션(attention)의 계산 과정을 바르게 나타낸 것은?", "opts": ["score(s, h) = s·h → α = softmax(score) → c = Σ α · h", "c = s·h 값을 그대로 문맥 벡터로 사용", "α를 학습하지 않고 모든 은닉 상태에 균등한 값을 고정 사용", "α = s·h → score = softmax(α) → c = Σ score"], "a": 0, "exp": "디코더 상태 s와 인코더 은닉 상태 h의 점수를 구해 softmax로 가중치 α를 만들고, 가중합으로 문맥 벡터 c를 계산한다."}, {"id": 68, "sec": "9.2.4", "diff": "심화", "q": "어텐션 가중치 표에서 디코더가 'ate'를 생성할 때 가장 큰 가중치를 받은 원문 단어와 그 값은?", "opts": ["사과를, 0.86", "사과를, 0.14", "먹었다, 0.80", "나는, 0.82"], "a": 2, "exp": "표에서 ate 행은 나는 0.06, 사과를 0.14, 먹었다 0.80이므로 '먹었다'에 가장 큰 가중치가 부여된다. 0.82는 I–나는, 0.86은 an apple–사과를의 값이다."}, {"id": 69, "sec": "9.2.4", "diff": "심화", "q": "어텐션 가중치를 통계 기반 번역과 연결지어 설명한 것으로 옳은 것은?", "opts": ["구 번역 표를 그대로 가져다 쓰는 것이다", "통계 기반 번역의 '언어 모델'을 대체한 것으로 볼 수 있다", "통계 기반 번역의 '빔 탐색'을 대체한 것으로 볼 수 있다", "통계 기반 번역의 '단어 정렬'을 학습으로 대체한 것으로 볼 수 있다"], "a": 3, "exp": "어텐션 가중치는 통계 번역의 단어 정렬을 학습으로 대체한 것이며, 교차 정렬(어순 차이)이 가중치 분포로 자연스럽게 표현된다."}, {"id": 70, "sec": "9.2.4", "diff": "중급", "q": "Transformer에 대한 설명으로 옳지 않은 것은?", "opts": ["순서 정보는 위치 인코딩 없이 순환 구조를 통해 자연스럽게 전달된다", "RNN의 순차 계산을 제거하고 셀프 어텐션만으로 문맥을 표현한다", "오늘날 상용 번역기와 대규모 언어모델의 공통 기반 구조이다", "병렬 학습이 가능해지고 장거리 의존 관계를 잘 포착한다"], "a": 0, "exp": "Transformer는 순환 구조를 제거했기 때문에 순서 정보를 위치 인코딩(positional encoding)으로 주입해야 한다."}, {"id": 71, "sec": "9.2.4", "diff": "중급", "q": "역번역(back-translation)에 대한 설명으로 옳은 것은?", "opts": ["미등록어를 서브워드 단위로 분절하는 기법이다", "하나의 모델로 여러 언어쌍을 동시에 학습하는 기법이다", "번역문을 원문으로 되돌려 BLEU 점수를 계산하는 평가 기법이다", "단일 언어 코퍼스를 번역해 가짜 병렬 코퍼스를 만들어 학습 데이터를 증강한다"], "a": 3, "exp": "역번역은 단일 언어 코퍼스를 번역해 가짜 병렬 코퍼스를 만들어 학습 데이터를 늘리는 실무 기법이다."}, {"id": 72, "sec": "9.2.4", "diff": "기초", "q": "서브워드 분절(BPE, SentencePiece)의 효과로 옳은 것은?", "opts": ["생성 모델의 환각을 원천적으로 제거한다", "어휘 사전을 유한하게 유지하면서 미등록어(OOV)를 처리한다", "문장 단위 조건부 확률을 직접 계산할 수 있게 한다", "어순 재배열 규칙을 자동으로 생성한다"], "a": 1, "exp": "서브워드 분절은 어휘 사전을 유한하게 유지하면서 OOV를 처리하며, 한국어의 교착어적 특성에도 효과적이다."}, {"id": 73, "sec": "9.3.1", "diff": "기초", "q": "강의자료가 정의한 대화 시스템에 해당하는 것은?", "opts": ["한 언어의 문장을 다른 언어로 옮기는 시스템", "음성을 텍스트로 변환하는 전용 시스템", "자연어를 사용해 인간과 대화하는 시스템", "문서를 검색해 순위를 매기는 시스템"], "a": 2, "exp": "대화 시스템은 자연어를 사용해 인간과 대화하는 시스템이며, 대화의 주도권에 따라 사용자 주도와 시스템 주도로 나뉜다."}, {"id": 74, "sec": "9.3.1", "diff": "중급", "q": "시스템 주도 대화 시스템의 특징으로 옳은 것은?", "opts": ["슬롯이라는 개념을 전혀 사용하지 않는다", "사용자가 원하는 것을 자유롭게 질문해 유연하지만 이해 실패 위험이 크다", "시스템이 필요한 정보를 차례로 질문해 안정적이지만 대화가 경직된다", "주도권이 매 턴마다 무작위로 바뀐다"], "a": 2, "exp": "'몇 명 예약하시겠습니까?'처럼 시스템이 필요한 정보를 차례로 묻는 방식은 안정적이지만 대화가 경직된다. 두 번째 보기는 사용자 주도 시스템의 특징이다."}, {"id": 75, "sec": "9.3.1", "diff": "기초", "q": "강의자료가 든 '인공지능 스피커 제품'의 예로 볼 수 없는 것은?", "opts": ["구글 네스트", "아마존 에코(Alexa)", "KT 기가지니", "애플 시리"], "a": 3, "exp": "애플 시리는 스마트폰 음성 비서의 예로 분류되었고, 아마존 에코·구글 네스트·KT 기가지니·네이버 Clova가 인공지능 스피커 제품의 예로 제시되었다."}, {"id": 76, "sec": "9.3.1", "diff": "기초", "q": "대화 시스템 전체 구성도의 모듈 처리 순서로 옳은 것은?", "opts": ["ASR → NLU → DM → NLG → TTS", "NLU → DM → ASR → NLG → TTS", "NLU → ASR → DM → TTS → NLG", "ASR → DM → NLU → NLG → TTS"], "a": 0, "exp": "사용자 발화가 음성 인식(ASR), 자연어 이해(NLU), 대화 관리(DM), 자연어 생성(NLG), 음성 합성(TTS)을 거쳐 시스템 음성으로 출력된다."}, {"id": 77, "sec": "9.3.1", "diff": "중급", "q": "모듈 표에서 DM(대화 관리)의 핵심 과제로 제시된 것은?", "opts": ["듣기 편한 운율·음색 생성", "의도 분류와 슬롯 채우기", "문맥 관리, 생략 복원, 예외 처리", "잡음·발음 변이에 강한 인식"], "a": 2, "exp": "표에서 DM은 의미 표현을 시스템 행동으로 바꾸며 문맥 관리·생략 복원·예외 처리를 핵심 과제로 한다. 의도 분류·슬롯 채우기는 NLU의 과제다."}, {"id": 78, "sec": "9.3.1", "diff": "기초", "q": "슬롯 채우기(slot filling)에 대한 설명으로 옳은 것은?", "opts": ["예매 장소·상영 시간·티켓 수 등의 슬롯을 만들고 그 값을 채우는 형식으로 의미를 표현하는 것", "발화 문장 전체를 하나의 범주로 분류하는 것", "음성 신호를 텍스트로 변환하는 것", "생성된 문장을 사람과 비슷한 음성으로 합성하는 것"], "a": 0, "exp": "자연어 이해 시스템은 발화에서 슬롯을 만들고 값을 채우는 방식으로 의미 표현을 만드는데 이를 슬롯 채우기라 한다."}, {"id": 79, "sec": "9.3.1", "diff": "기초", "q": "'토요일 저녁 7시에 강남에서 아바타 성인 2장 예매해줘'의 슬롯 분석에서 장소(location) 슬롯의 값은?", "opts": ["토요일", "성인 2명", "아바타", "강남"], "a": 3, "exp": "예시에서 title=아바타, location=강남, date=토요일, time=저녁 7시, count=성인 2명으로 슬롯이 채워진다."}, {"id": 80, "sec": "9.3.1", "diff": "중급", "q": "위 발화 예시에서 의도(intent)로 제시된 값은?", "opts": ["ticket_cancel", "movie_booking", "weather_query", "restaurant_booking"], "a": 1, "exp": "영화 예매 발화이므로 의도는 movie_booking으로 분류된다."}, {"id": 81, "sec": "9.3.1", "diff": "심화", "q": "의도 분류와 슬롯 채우기의 문제 유형을 바르게 짝지은 것은?", "opts": ["의도 분류와 슬롯 채우기 모두 문장 분류 문제", "의도 분류 = 문장 분류 문제, 슬롯 채우기 = BIO 태그 시퀀스 라벨링 문제", "의도 분류 = 시퀀스 라벨링 문제, 슬롯 채우기 = 문장 분류 문제", "의도 분류와 슬롯 채우기 모두 회귀 문제"], "a": 1, "exp": "의도 분류는 문장 전체를 하나의 범주로 분류하는 문장 분류이고, 슬롯 채우기는 각 토큰에 BIO 태그를 붙이는 시퀀스 라벨링(개체명 인식과 같은 틀)이다."}, {"id": 82, "sec": "9.3.1", "diff": "중급", "q": "의도 분류와 슬롯 채우기의 학습에 대한 설명으로 옳은 것은?", "opts": ["의도 분류는 각 토큰마다 태그를 붙이는 문제다", "슬롯 채우기는 개체명 인식과 전혀 다른 틀을 사용한다", "두 과제는 상호 간섭이 심해 반드시 별도 모델로 학습해야 한다", "두 과제를 하나의 신경망으로 함께 학습(joint learning)하면 성능이 향상된다"], "a": 3, "exp": "강의자료는 두 과제를 하나의 신경망으로 함께 학습(joint learning)하면 성능이 향상된다고 설명한다."}, {"id": 83, "sec": "9.3.2", "diff": "중급", "q": "규칙 기반 대화 관리 접근의 장점과 단점을 바르게 짝지은 것은?", "opts": ["장점은 유연함·자동 개선, 단점은 대량 데이터 필요", "장점은 예측 가능·소량 데이터, 단점은 확장·유지보수 비용", "장점과 단점 모두 학습 데이터 양과는 무관하다", "장점은 결과의 불투명성, 단점은 지나친 예측 가능성"], "a": 1, "exp": "규칙 기반은 예측 가능하고 소량 데이터로 가능하지만 확장·유지보수 비용이 크다. 유연·자동 개선과 대량 데이터·불투명성은 데이터 기반 접근의 특징이다."}, {"id": 84, "sec": "9.3.2", "diff": "중급", "q": "데이터 기반 대화 관리에 해당하는 기법으로만 묶인 것은?", "opts": ["BPE, SentencePiece", "강화학습(POMDP), 신경망 대화 상태 추적", "BM25, TF-IDF", "유한 상태 오토마타(FSA), Frame 기반"], "a": 1, "exp": "대화 관리는 규칙 기반(FSA·Frame)과 데이터 기반(강화학습 POMDP·신경망 DST)으로 나뉜다."}, {"id": 85, "sec": "9.3.2", "diff": "중급", "q": "유한 상태 오토마타(FSA) 기반 대화 관리의 특징으로 옳지 않은 것은?", "opts": ["상태 수가 늘어나면 전이 규칙이 폭발적으로 증가한다", "실무에서 간단한 ARS·주문 봇에는 여전히 널리 사용된다", "시스템이 대화를 주도하므로 안정적이고 구현이 단순하다", "사용자가 정해진 순서를 벗어난 발화를 해도 유연하게 처리할 수 있다"], "a": 3, "exp": "FSA는 '아, 날짜를 바꿀게요'처럼 순서를 벗어난 발화를 처리하기 어렵다는 것이 대표적인 한계다."}, {"id": 86, "sec": "9.3.2", "diff": "심화", "q": "Frame 기반 대화 관리의 동작 방식으로 옳은 것은?", "opts": ["슬롯 개념 없이 자유 생성만으로 응답을 만든다", "규칙 간 우선순위에 따라 비어 있는 슬롯에 대해 사용자에게 질문하며 문맥을 이해한다", "보상 신호로 정책을 학습해 다음 행동을 결정한다", "상태 전이 그래프만으로 문맥을 표현하고 슬롯은 쓰지 않는다"], "a": 1, "exp": "Frame 기반은 규칙과 우선순위를 두고 빈 슬롯을 사용자에게 물어 채우며, 사용자가 주도하는 mixed initiative 형태도 가능하다."}, {"id": 87, "sec": "9.3.2", "diff": "중급", "q": "Frame 기반 대화 관리 예시 표에서 '도착지' 슬롯에 대한 시스템 행동으로 제시된 것은?", "opts": ["우선순위 2 → 도착지 확보 후 질문", "우선순위 1 → '어디로 가십니까?' 라고 질문", "기본값 사용, 필요 시 확인", "채워짐 → 질문하지 않음"], "a": 1, "exp": "출발지는 서울로 채워져 질문하지 않고, 비어 있는 도착지가 우선순위 1로 먼저 질문되며, 날짜는 우선순위 2, 인원은 기본값 1명을 사용한다."}, {"id": 88, "sec": "9.3.2", "diff": "기초", "q": "강화학습 기반 대화 관리에 대한 설명으로 옳은 것은?", "opts": ["지식베이스 트리플을 SPARQL로 조회해 응답을 만든다", "BLEU 점수를 보상으로 사용해 번역 품질을 학습한다", "대화를 '상태–행동–보상'의 순차 의사결정 문제로 보고 정책(policy)을 학습한다", "모든 슬롯이 채워질 때까지 고정된 규칙으로 질문을 반복한다"], "a": 2, "exp": "데이터 기반의 대표 방법인 강화학습은 대화를 상태–행동–보상의 순차 의사결정 문제로 보고 목표 달성 시 보상을 주어 정책을 학습한다."}, {"id": 89, "sec": "9.3.2", "diff": "심화", "q": "강화학습 기반 대화 관리의 보상 설계와 발전 방향에 대한 설명으로 옳은 것은?", "opts": ["보상 없이 지도학습만으로 정책을 학습한다", "작업 성공에 +, 턴 수에 − 보상을 주며, 불확실한 인식·이해 결과를 확률 분포로 다루는 POMDP 기반으로 발전했다", "작업이 실패했을 때만 보상을 부여한다", "턴 수가 많을수록 더 큰 보상을 주어 대화를 길게 유도한다"], "a": 1, "exp": "보상은 작업 성공에 +, 턴 수에 −를 주며, 불확실한 결과를 확률 분포로 다루는 POMDP 기반 대화 관리로 발전하고 사용자 시뮬레이터로 학습 데이터를 확보한다."}, {"id": 90, "sec": "9.3.3", "diff": "기초", "q": "대화 시스템의 평가 방식으로 강의자료가 크게 두 가지로 제시한 것은?", "opts": ["Slot Error Rate와 End-to-end evaluation", "BLEU와 chrF", "EM과 토큰 F1", "Perplexity와 길이 벌점(BP)"], "a": 0, "exp": "대화 시스템 평가는 슬롯 채우기의 정확성을 보는 Slot Error Rate와 대화 전체의 목적 달성을 보는 End-to-end evaluation으로 나뉜다."}, {"id": 91, "sec": "9.3.3", "diff": "중급", "q": "'Make an appointment with Chris at 10:30 in Gates 104' 예시에서 TIME 슬롯만 11:30으로 잘못 채워졌을 때 Slot Error Rate는?", "opts": ["0", "1/2 = 0.50" 의응답·기계번역·대화시스템 세 응용을 관통하는 공통 파이프라인으로 제시된 것은?", "opts": ["이해 → 생성 → 탐색·정렬", "이해(Understand) → 탐색·정렬 → 생성(Generate)", "생성 → 이해 → 탐색·정렬", "탐색·정렬 → 생성 → 이해"], "a": 1, "exp": "세 응용 모두 입력을 이해하고(NLU), 필요한 정보를 찾아 정렬한 뒤, 자연어로 출력(NLG)하는 뼈대를 공유한다."}, {"id": 99, "sec": "9.4", "diff": "중급", "q": "'이해 → 탐색·정렬 → 생성' 정리표에서 기계번역의 '탐색·정렬'에 해당하는 것은?", "opts": ["대화 상태 추적 · 정책 결정", "목표 언어 문장 출력", "단어 정렬 · 어텐션 · 빔 탐색", "질문유형·정답유형 분류"], "a": 2, "exp": "표에서 기계번역의 이해는 형태소·구문 분석/인코딩, 탐색·정렬은 단어 정렬·어텐션·빔 탐색, 생성은 목표 언어 문장이다."}, {"id": 100, "sec": "9.4", "diff": "심화", "q": "강의 개요 표에서 9.2 기계 번역의 평가 지표로 제시된 것은?", "opts": ["EM · F1", "Perplexity · ROUGE", "BLEU · chrF · COMET", "Slot Error Rate · End-to-end 평가"], "a": 2, "exp": "개요 표는 질의응답의 평가 지표로 EM·F1, 기계번역은 BLEU·chrF·COMET, 대화시스템은 Slot Error Rate·End-to-end 평가를 제시한다."}];

const KEY = "nlp_week9_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
