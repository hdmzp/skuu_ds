<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1주차 자연어처리 개요 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 1 · 자연어처리</div>
    <h1>1주차 &middot; 자연어처리 개요 — 100문제</h1>
    <p class="sub">강의자료 1.1~1.6절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    1주차 강의자료(자연어처리 개요) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "1.1", "diff": "기초", "q": "자연어(Natural Language)에 대한 설명으로 옳은 것은?", "opts": ["컴퓨터가 내부적으로 연산에 사용하는 기계어를 가리킨다.", "사람들이 일상생활에서 자연스럽게 사용하는 언어를 말한다.", "사람이 특정 목적을 위해 설계한 프로그래밍 언어를 말한다.", "수식과 기호로만 이루어진 형식 언어를 뜻한다."], "a": 1, "exp": "자연어는 한국어·영어처럼 사람이 일상에서 쓰는 언어이고, 프로그래밍 언어나 수식은 사람이 설계한 인공어(Artificial Language)에 해당한다."}, {"id": 2, "sec": "1.1", "diff": "기초", "q": "인공어(Artificial Language)의 예로 가장 적절한 것은?", "opts": ["한국어와 영어", "지역 방언과 은어", "일상 대화에서 쓰이는 관용구", "프로그래밍 언어와 수식"], "a": 3, "exp": "인공어는 사람이 목적에 맞게 설계한 언어로, 프로그래밍 언어와 수식이 대표적이다. 방언·은어·관용구는 모두 자연어의 일부다."}, {"id": 3, "sec": "1.1", "diff": "기초", "q": "자연어처리(NLP)의 정의로 가장 적절한 것은?", "opts": ["사람이 프로그래밍 언어를 더 쉽게 배우도록 돕는 교육 분야", "문서를 이미지로 변환해 보관하는 전자문서 기술 분야", "컴퓨터 하드웨어의 연산 속도를 높이는 최적화 기법", "컴퓨터가 자연어를 이해하거나 생성할 수 있도록 하는 학문 및 기술 분야"], "a": 3, "exp": "NLP는 컴퓨터가 사람의 언어를 이해(NLU)하거나 생성(NLG)할 수 있게 하는 학문·기술 분야다."}, {"id": 4, "sec": "1.1", "diff": "중급", "q": "자연어처리의 학문적 성격에 대한 설명으로 옳은 것은?", "opts": ["인공지능·기계학습·언어학·형식언어와 컴파일러 이론이 겹치는 학제간 영역이다.", "컴파일러 이론과는 역사적으로 아무 관련이 없다.", "통계학과는 무관하며 규칙 작성만을 다루는 분야이다.", "언어학에서만 파생된 단일 학문 분야이다."], "a": 0, "exp": "자연어처리는 인공지능·기계학습·언어학·형식언어와 컴파일러 이론에서 비롯된 학제간 영역이다."}, {"id": 5, "sec": "1.1", "diff": "기초", "q": "오늘날 대부분의 자연어처리는 주로 어떤 방법으로 수행되는가?", "opts": ["기계학습, 특히 딥러닝 기법", "사전 검색에 기반한 단순 단어 치환", "정규표현식만을 이용한 패턴 매칭", "사람이 손으로 작성한 문법 규칙"], "a": 0, "exp": "오늘날 자연어처리는 대부분 기계학습, 그중에서도 딥러닝 기법으로 수행된다."}, {"id": 6, "sec": "1.1", "diff": "중급", "q": "자연어를 컴퓨터로 처리할 때 반드시 거쳐야 하는 과정은?", "opts": ["언어를 기계어로 컴파일하는 과정", "언어를 반드시 음성으로 바꾸는 과정", "언어를 수치(벡터)로 바꾸는 과정", "언어를 이미지로 바꾸는 과정"], "a": 2, "exp": "컴퓨터는 수치만 계산할 수 있으므로, 언어를 수치로 바꾸는 단계(벡터화)가 반드시 필요하다."}, {"id": 7, "sec": "1.1", "diff": "기초", "q": "자연어 이해(NLU)와 자연어 생성(NLG)의 설명으로 옳은 것은?", "opts": ["NLG는 주로 의도 분류나 개체명 인식만을 다루며 번역은 포함되지 않는다.", "NLU는 사람이 작성한 텍스트를 기계가 분석하여 그 의미나 의도를 파악하는 과정이다.", "NLU의 대표적인 하위 과제로는 요약과 대화 응답 생성이 있다.", "NLG는 기계가 외부의 입력 없이 무작위로 문장을 나열하는 과정이다."], "a": 1, "exp": "NLU는 입력된 언어의 의미·의도를 파악하는 과정이다. NLG는 주어진 정보(수치·구조적 데이터·문맥)를 바탕으로 문장을 만들어 내며, 요약·대화 응답 생성은 NLG 쪽 과제다."}, {"id": 8, "sec": "1.1", "diff": "중급", "q": "\"전화 실행해\"라는 입력을 NLU가 처리할 때 파악하는 요소를 바르게 짝지은 것은?", "opts": ["동작(intent) = 음성 합성, 대상(slot) = 실행", "동작(intent) = 문장 생성, 대상(slot) = 사용자", "동작(intent) = 전화, 대상(slot) = 다른 프로그램 호출", "동작(intent) = 다른 프로그램 호출, 대상(slot) = 전화"], "a": 3, "exp": "NLU는 무엇을 할지(intent)와 무엇에 대해 할지(slot)를 뽑아낸다. 여기서는 intent가 '다른 프로그램 호출', slot이 '전화'이며, 실제로 전화 앱이 실행되면 입력을 잘 처리한 것이다."}, {"id": 9, "sec": "1.1", "diff": "기초", "q": "NLU의 대표적인 하위 과제로만 묶인 것은?", "opts": ["데이터-투-텍스트, 대화 응답 생성, 문장 생성", "의도 분류, 개체명 인식, 구문 분석, 상호참조 해결", "요약, 번역, 이미지 캡셔닝", "광고 문구 작성, 시나리오 초안 작성, 코드 생성"], "a": 1, "exp": "NLU의 대표 하위 과제는 의도 분류, 개체명 인식, 구문 분석, 의미역 결정, 상호참조 해결이다."}, {"id": 10, "sec": "1.1", "diff": "기초", "q": "NLG의 대표적인 하위 과제로만 묶인 것은?", "opts": ["구문 분석, 상호참조 해결, 품사 태깅", "의도 분류, 개체명 인식, 의미역 결정", "요약, 번역, 데이터-투-텍스트, 이미지 캡셔닝", "형태소 분석, 띄어쓰기 교정, 철자 검사"], "a": 2, "exp": "NLG의 대표 하위 과제는 요약, 번역, 데이터-투-텍스트, 대화 응답 생성, 이미지 캡셔닝이다."}, {"id": 11, "sec": "1.1", "diff": "심화", "q": "번역과 요약을 NLG의 하위 과제로 분류하는 근거로 가장 적절한 것은?", "opts": ["이해와 생성이 모두 필요하지만 최종 출력이 문장이기 때문", "입력을 이해하는 과정이 전혀 필요 없기 때문", "규칙 기반으로만 처리할 수 있는 과제이기 때문", "입력이 언제나 수치 데이터이기 때문"], "a": 0, "exp": "번역·요약은 입력을 이해하는 단계와 문장을 만드는 단계가 모두 필요하지만, 출력이 문장이므로 생성(NLG) 쪽으로 분류한다."}, {"id": 12, "sec": "1.1", "diff": "중급", "q": "날씨 정보를 \"이번 주는 지난주보다 6도가량 더 덥겠습니다\"로 전달하는 방식이 보여 주는 것은?", "opts": ["생성된 문장에는 원본 데이터가 전혀 필요하지 않다는 점", "자연어 생성이 단순한 수치 나열보다 사람에게 빠르고 직관적으로 전달된다는 점", "자연어 이해가 수치 계산을 완전히 대체할 수 있다는 점", "수치를 그대로 나열하는 방식이 언제나 더 우월하다는 점"], "a": 1, "exp": "\"지난주 평균 21도, 이번주 평균 27도\"라는 수치 나열보다 자연어로 요약해 준 문장을 사람은 훨씬 빠르게 이해한다."}, {"id": 13, "sec": "1.1", "diff": "중급", "q": "텍스트 분석(Text Analytics)에 대한 설명으로 옳은 것은?", "opts": ["자연어처리와 완전히 동일한 개념으로 서로 구별되지 않는다.", "음성 데이터만을 대상으로 하는 분석 기법이다.", "텍스트 데이터에서 의미 있는 인사이트를 추출하고 질문에 답하는 방법이다.", "반드시 문장의 의미를 이해해야만 수행할 수 있는 작업이다."], "a": 2, "exp": "텍스트 분석은 텍스트에서 인사이트를 뽑아내는 방법으로, 집계·통계만으로 답할 수 있는 질문도 포함한다는 점에서 자연어처리와 구별된다."}, {"id": 14, "sec": "1.1", "diff": "심화", "q": "통화·SMS 기록 파일에서 \"누구와 가장 오래 통화했는가\"를 구하는 작업의 성격으로 옳은 것은?", "opts": ["새로운 문장을 만들어야 하므로 NLG에 해당한다.", "개체명 인식이 반드시 필요하므로 NLU에 해당한다.", "문장의 의미를 파악해야 하므로 자연어처리에 해당한다.", "통화 지속시간 필드를 집계하면 되므로 텍스트 분석에 해당한다."], "a": 3, "exp": "의미를 몰라도 필드 값을 집계하는 것만으로 답할 수 있으므로 텍스트 분석이다."}, {"id": 15, "sec": "1.1", "diff": "심화", "q": "같은 통화 기록에서 \"이 문자의 의도가 일정 변경 요청인가\"를 판단하는 작업의 성격으로 옳은 것은?", "opts": ["전화번호를 정렬하는 것만으로 해결된다.", "통화 지속시간 필드만 확인하면 된다.", "단순 집계로 해결되므로 텍스트 분석에 해당한다.", "언어의 의미를 알아야 하므로 자연어처리에 해당한다."], "a": 3, "exp": "메시지 본문의 의미와 의도를 파악해야 하므로 자연어처리(특히 NLU의 의도 분류)에 해당한다."}, {"id": 16, "sec": "1.1", "diff": "중급", "q": "강의자료에서 제시한 통화 기록 파일의 필드 구성에 대한 설명으로 옳지 않은 것은?", "opts": ["3번째 필드는 voice_call 또는 sms로 데이터 유형을 나타낸다.", "4번째 필드의 연락처 이름은 연락처에 없으면 비어 있을 수 있다.", "1~2번째 필드는 전화를 걸거나 SMS를 보낸 날짜와 시각이다.", "5번째 필드에는 데이터 유형과 관계없이 항상 메시지 본문이 들어간다."], "a": 3, "exp": "5번째 필드는 voice_call이면 통화 지속시간, sms면 메시지 본문으로 유형에 따라 달라진다."}, {"id": 17, "sec": "1.1", "diff": "기초", "q": "자연어처리가 다루는 범위에 대한 설명으로 옳은 것은?", "opts": ["영어 등 일부 언어만을 대상으로 하는 분야이다.", "오직 문자로 기록된 텍스트만을 대상으로 한다.", "기계 번역 분야만을 다루는 좁은 영역이다.", "텍스트에 국한되지 않으며 음성 인식·합성도 그 영역에 포함된다."], "a": 3, "exp": "자연어처리는 텍스트뿐 아니라 음성 인식(STT)과 음성 합성(TTS)까지 포함하는 넓은 영역이다."}, {"id": 18, "sec": "1.2", "diff": "기초", "q": "1950년 앨런 튜링이 발표한 논문과 그 핵심 내용으로 옳은 것은?", "opts": ["「Syntactic Structures」에서 형식문법 체계를 처음 제시했다.", "「Computing Machinery and Intelligence」에서 '기계는 생각할 수 있는가'라는 질문을 대화로 사람과 구별되는지의 문제로 바꾸었다.", "「Attention Is All You Need」에서 트랜스포머 구조를 제안했다.", "ALPAC 보고서를 작성해 기계번역의 성과를 혹평했다."], "a": 1, "exp": "튜링은 1950년 논문에서 '기계는 생각할 수 있는가'를 '대화로 사람과 구별되지 않는가'라는 검증 가능한 물음(튜링 테스트)으로 바꾸었다."}, {"id": 19, "sec": "1.2", "diff": "중급", "q": "1954년 조지타운–IBM 실험에 대한 설명으로 옳은 것은?", "opts": ["영어를 러시아어로 번역하는 신경망 모델을 최초로 학습시켰다.", "실험이 완전히 실패해 규칙 기반 연구가 즉시 중단되었다.", "통계적 기계번역(SMT)의 최초 상용화 사례였다.", "러시아어 문장 60여 개를 영어로 자동 번역해 시연했고, 지나친 낙관론을 불러왔다."], "a": 3, "exp": "조지타운–IBM 실험은 \"3~5년이면 기계번역이 해결된다\"는 낙관론을 낳았으나 곧 한계에 부딪혔다."}, {"id": 20, "sec": "1.2", "diff": "중급", "q": "1957년 촘스키의 『Syntactic Structures』가 자연어처리에 끼친 영향으로 옳은 것은?", "opts": ["단어 임베딩의 수학적 기초를 제공했다.", "대규모 코퍼스 구축 방법론을 확립했다.", "형식문법을 제시해 이후 구문분석 연구의 토대가 되었다.", "어텐션 메커니즘의 개념을 처음 제안했다."], "a": 2, "exp": "촘스키의 형식문법은 이후 구문분석(파싱) 연구의 이론적 토대가 되었다."}, {"id": 21, "sec": "1.2", "diff": "중급", "q": "1966년 ALPAC 보고서가 가져온 결과로 옳은 것은?", "opts": ["통계 기반 번역 모델을 국제 표준으로 채택하게 했다.", "기계번역의 성과를 혹평해 연구 예산이 급감하는 첫 번째 겨울을 불러왔다.", "기계번역 연구에 대규모 예산이 새로 투입되는 계기가 되었다.", "신경망 기반 번역 연구의 시작을 알렸다."], "a": 1, "exp": "ALPAC 보고서는 기계번역의 성과를 혹평했고, 그 결과 연구 예산이 급감하는 첫 번째 겨울이 왔다."}, {"id": 22, "sec": "1.2", "diff": "기초", "q": "규칙 기반 시대(1960~1980년대)의 접근 방식으로 옳은 것은?", "opts": ["사람이 문법 규칙과 사전을 직접 작성해 언어를 처리한다.", "신경망이 표현(representation)까지 스스로 학습한다.", "대량의 코퍼스에서 확률을 추정해 언어를 처리한다.", "대규모 사전학습 후 미세조정으로 과제를 푼다."], "a": 0, "exp": "규칙 기반 시대에는 사람이 문법 규칙과 사전을 손으로 작성했다."}, {"id": 23, "sec": "1.2", "diff": "기초", "q": "ELIZA(1966, Weizenbaum)에 대한 설명으로 옳은 것은?", "opts": ["블록 세계 안에서 명령을 이해하고 수행한 대화 시스템이다.", "패턴 매칭으로 상담사를 흉내 낸 최초의 챗봇이다.", "신경망 기반으로 대화를 생성한 최초의 모델이다.", "통계적 기계번역을 구현한 시스템이다."], "a": 1, "exp": "ELIZA는 \"나는 ~ 때문에 우울해요\" → \"왜 ~ 때문에 우울하다고 느끼나요?\"처럼 패턴 매칭으로 되묻는 최초의 챗봇이다."}, {"id": 24, "sec": "1.2", "diff": "중급", "q": "SHRDLU(1971, Winograd)의 특징으로 옳은 것은?", "opts": ["블록 세계 안에서 명령을 이해하고 수행한 대화 시스템이다.", "단어 임베딩을 학습한 최초의 신경망 모델이다.", "러시아어–영어 번역을 시연한 기계번역 시스템이다.", "품사 태깅에 은닉 마르코프 모델을 도입한 시스템이다."], "a": 0, "exp": "SHRDLU는 제한된 블록 세계 안에서 명령을 이해하고 수행한 규칙 기반 대화 시스템이다."}, {"id": 25, "sec": "1.2", "diff": "중급", "q": "규칙 기반 접근의 근본적인 한계로 가장 적절한 것은?", "opts": ["학습 비용이 막대하고 환각 현상이 발생한다.", "학습에 대량의 라벨 데이터가 반드시 필요하다.", "예외를 처리하는 규칙이 기하급수적으로 늘어나 유지·확장이 사실상 불가능하다.", "결과를 전혀 해석할 수 없어 신뢰하기 어렵다."], "a": 2, "exp": "규칙 기반의 한계는 예외 처리 규칙의 폭발적 증가로 인한 확장 곤란이다. 해석 가능성과 소량 데이터로도 동작한다는 점은 오히려 장점이었다."}, {"id": 26, "sec": "1.2", "diff": "기초", "q": "통계 기반 시대(1990~2000년대)의 핵심 아이디어로 옳은 것은?", "opts": ["대규모 사전학습 모델을 미세조정해 과제를 풀자.", "규칙을 사람이 쓰지 말고, 대량의 코퍼스에서 확률을 추정하자.", "표현까지 신경망이 자동으로 학습하게 하자.", "문법 규칙을 더 정교하게 손으로 작성하자."], "a": 1, "exp": "통계 기반 시대는 컴퓨팅 성능 향상과 디지털 코퍼스 축적을 배경으로, 사람이 쓴 규칙 대신 데이터에서 확률을 추정하는 방향으로 전환했다."}, {"id": 27, "sec": "1.2", "diff": "중급", "q": "n-gram 언어모델의 동작 방식으로 옳은 것은?", "opts": ["형태소를 사람이 만든 규칙에 따라 분해한다.", "앞의 n-1개 단어로 다음 단어가 나올 확률을 계산한다.", "어텐션 가중치로 입력의 중요한 부분을 결정한다.", "문장 전체를 하나의 벡터로 인코딩한 뒤 디코딩한다."], "a": 1, "exp": "n-gram 언어모델은 직전 n-1개 단어를 조건으로 다음 단어의 확률을 추정한다."}, {"id": 28, "sec": "1.2", "diff": "중급", "q": "통계 기반 자연어처리의 대표 기법으로 볼 수 없는 것은?", "opts": ["word2vec을 이용한 단어 임베딩 학습", "CRF 기반 개체명 인식", "IBM 번역 모델 등 통계적 기계번역(SMT)", "은닉 마르코프 모델(HMM) 기반 품사 태깅"], "a": 0, "exp": "word2vec은 2013년 신경망 시대의 대표 기법이다. HMM·CRF·SMT가 통계 기반 시대의 대표 기법이다."}, {"id": 29, "sec": "1.2", "diff": "중급", "q": "통계 기반 방법의 한계로 지적된 것은?", "opts": ["특징을 사람이 설계해야 할 필요가 전혀 없음", "예외를 처리하는 규칙이 기하급수적으로 늘어남", "학습과 운영에 드는 비용이 막대함", "희소성(sparsity) 문제와 긴 문맥의 의존 관계를 반영하기 어려움"], "a": 3, "exp": "통계 기반 방법은 학습 데이터에 나타나지 않은 조합을 다루기 어려운 희소성 문제와, 긴 문맥 의존 관계 반영의 어려움이 한계였다."}, {"id": 30, "sec": "1.2", "diff": "기초", "q": "신경망 시대(2013~2017년)의 핵심 특징으로 옳은 것은?", "opts": ["코퍼스에서 단어 빈도를 세어 확률을 추정한다.", "사람이 자질(feature)을 직접 설계해 성능을 끌어올린다.", "특징을 사람이 설계하지 않고 표현(representation)까지 데이터로부터 학습한다.", "규칙과 사전을 더 정교하게 작성해 예외를 처리한다."], "a": 2, "exp": "신경망 시대의 전환점은 특징공학(feature engineering) 없이 표현 자체를 데이터로부터 학습한다는 점이다."}, {"id": 31, "sec": "1.2", "diff": "중급", "q": "연구와 연도가 바르게 짝지어진 것은?", "opts": ["2015년 BERT — 양방향 사전학습 모델 제안", "2013년 word2vec — 대규모 코퍼스로 단어 임베딩을 효율적으로 학습", "2013년 Seq2Seq — 입력 문장을 인코딩하고 출력 문장을 디코딩", "2014년 Transformer — 어텐션만으로 구성된 구조 제안"], "a": 1, "exp": "word2vec은 2013년, Seq2Seq는 2014년, Attention은 2015년, Transformer는 2017년, BERT는 2018년(NAACL 2019 게재)이다."}, {"id": 32, "sec": "1.2", "diff": "중급", "q": "Seq2Seq(2014)와 Attention(2015)에 대한 설명으로 옳은 것은?", "opts": ["둘 다 사전학습 후 미세조정 패러다임에 속하는 기법이다.", "둘 다 규칙 기반 번역 시스템을 개선하기 위해 제안된 기법이다.", "Seq2Seq는 입력을 벡터로 인코딩해 출력을 디코딩하고, Attention은 디코딩 시 입력의 어느 부분을 볼지 가중치로 결정한다.", "Seq2Seq는 어텐션 가중치를 계산하는 기법이고, Attention은 인코더-디코더 구조를 뜻한다."], "a": 2, "exp": "Seq2Seq는 인코더-디코더 구조, Attention은 디코딩 시 입력의 어느 부분에 집중할지를 가중치로 정하는 기법이다."}, {"id": 33, "sec": "1.2", "diff": "기초", "q": "2017년 「Attention Is All You Need」가 제안한 트랜스포머의 핵심으로 옳은 것은?", "opts": ["순환구조 없이 어텐션만으로 구성해 병렬 학습이 가능해졌다.", "규칙 사전을 자동으로 생성하는 방법을 제시했다.", "n-gram 확률을 더 정확히 추정하는 방법을 제시했다.", "순환신경망(RNN)을 더 깊게 쌓아 성능을 높였다."], "a": 0, "exp": "트랜스포머는 순환구조를 제거하고 어텐션만으로 구성해 병렬 학습을 가능하게 했고, 이로써 모델과 데이터 규모를 크게 키울 수 있게 되었다."}, {"id": 34, "sec": "1.2", "diff": "중급", "q": "BERT와 GPT에 대한 설명으로 옳은 것은?", "opts": ["2018년에 각각 이해 중심·생성 중심 모델로 등장해 사전학습 후 미세조정 패러다임을 확립했다.", "둘 다 순환신경망(RNN)만으로 구성되어 있다.", "BERT는 생성 중심, GPT는 이해 중심 모델로 설계되었다.", "둘 다 통계 기반 시대를 대표하는 기법이다."], "a": 0, "exp": "BERT는 이해 중심, GPT는 생성 중심으로 2018년에 등장했으며 사전학습–미세조정 패러다임을 확립했다."}, {"id": 35, "sec": "1.2", "diff": "중급", "q": "2020년 이후 대규모 언어모델의 흐름에 대한 설명으로 옳지 않은 것은?", "opts": ["소수의 예시만으로 과제를 수행하는 in-context learning이 나타났다.", "모델 규모가 커질수록 미세조정 없이는 어떤 과제도 수행할 수 없게 되었다.", "2022년 ChatGPT는 지시학습과 인간 피드백 강화학습으로 대화 품질을 크게 높였다.", "2023년 이후 멀티모달·추론 특화 모델, 검색 증강 생성(RAG), 에이전트로 확장되고 있다."], "a": 1, "exp": "오히려 모델 규모가 커지면서 미세조정 없이 소수 예시만으로 과제를 수행하는 in-context learning이 가능해졌다."}, {"id": 36, "sec": "1.1", "diff": "중급", "q": "정형 데이터와 비정형 데이터에 대한 설명으로 옳은 것은?", "opts": ["정형 데이터는 문장·문단·발화로 이루어져 있고, 비정형 데이터는 숫자와 범주값 중심이다.", "비정형 데이터는 형식이 명확해 별도 전처리 없이 바로 모델에 넣을 수 있다.", "리뷰·뉴스·대화는 행-열로 정리된 대표적인 정형 데이터이다.", "정형 데이터는 키-값이나 행-열로 정리되어 바로 계산할 수 있고, 비정형 데이터는 정해진 형식이 없어 수치로 바꾸는 과정이 필요하다."], "a": 3, "exp": "매출표·센서 로그처럼 행-열로 정리된 것이 정형 데이터이고, 리뷰·뉴스·대화처럼 형식이 없는 것이 비정형 데이터로 수치 변환이 필요하다."}, {"id": 37, "sec": "1.1", "diff": "기초", "q": "강의자료가 제시한 세상 데이터의 구성에 대한 설명으로 옳은 것은?", "opts": ["세상 데이터의 약 80%는 비정형이며 그 대부분이 '언어'다.", "세상 데이터의 약 80%는 정형이며 자연어처리의 필요성은 크지 않다.", "비정형 데이터의 대부분은 센서 로그와 매출표이다.", "비정형 데이터는 전체의 5% 미만으로 매우 드물다."], "a": 0, "exp": "세상 데이터의 약 80%가 비정형이고 그 대부분이 언어라는 점이 자연어처리가 중요한 이유다."}, {"id": 38, "sec": "1.2", "diff": "중급", "q": "자연어처리 패러다임과 시기가 바르게 짝지어진 것은?", "opts": ["규칙 기반 1950~1980s — 통계 기반 2013~2017 — 딥러닝 기반 1990~2000s — 사전학습·LLM 2018~현재", "규칙 기반 1950~1980s — 통계 기반 1990~2000s — 딥러닝 기반 2013~2017 — 사전학습·LLM 2018~현재", "규칙 기반 1990~2000s — 통계 기반 1950~1980s — 딥러닝 기반 2018~현재 — 사전학습·LLM 2013~2017", "규칙 기반 2013~2017 — 통계 기반 1950~1980s — 딥러닝 기반 1990~2000s — 사전학습·LLM 2018~현재"], "a": 1, "exp": "태동기(1950년대)를 포함한 규칙 기반은 1950~1980년대, 통계 기반은 1990~2000년대, 딥러닝 기반은 2013~2017년, 사전학습·LLM은 2018년부터 현재까지다."}, {"id": 39, "sec": "1.2", "diff": "중급", "q": "패러다임별 대표 기법의 연결로 옳지 않은 것은?", "opts": ["사전학습·LLM — Transformer, BERT, GPT", "규칙 기반 — 정규표현식, CFG, 전문가 시스템", "통계 기반 — word2vec, RNN, LSTM, CNN", "딥러닝 기반 — word2vec, RNN, LSTM, CNN"], "a": 2, "exp": "word2vec·RNN·LSTM·CNN은 딥러닝 기반의 대표 기법이다. 통계 기반의 대표 기법은 n-gram, HMM, IBM 번역모델이다."}, {"id": 40, "sec": "1.2", "diff": "심화", "q": "각 패러다임의 장점을 잘못 설명한 것은?", "opts": ["통계 기반의 장점은 특징공학이 불필요하고 성능이 매우 높다는 점이다.", "딥러닝 기반의 장점은 특징공학이 불필요하고 성능이 높다는 점이다.", "사전학습·LLM의 장점은 범용성과 소수 예시 학습(few-shot)이 가능하다는 점이다.", "규칙 기반의 장점은 해석이 가능하고 소량 데이터로도 동작한다는 점이다."], "a": 0, "exp": "특징공학 불필요·높은 성능은 딥러닝 기반의 장점이다. 통계 기반의 장점은 통계적 일반화와 견고함이다."}, {"id": 41, "sec": "1.2", "diff": "중급", "q": "사전학습·LLM 패러다임의 한계로 지적된 것은?", "opts": ["예외 처리 규칙의 폭증과 확장 곤란", "대량의 라벨 데이터가 반드시 필요하다는 점", "막대한 비용과 환각·편향 문제", "희소성 문제와 장거리 의존 관계의 약함"], "a": 2, "exp": "사전학습·LLM의 한계는 막대한 학습·운영 비용과 환각(hallucination)·편향 문제다."}, {"id": 42, "sec": "1.2", "diff": "심화", "q": "한국어 자연어처리의 흐름에 대한 설명으로 옳은 것은?", "opts": ["2014년 21세기 세종계획이 시작되어 국가 코퍼스를 구축했다.", "2000년대에 KoBERT와 KorQuAD가 공개되어 한국어 사전학습이 시작되었다.", "1998년에 HyperCLOVA와 KoGPT가 공개되어 한국어 대규모 언어모델 시대가 열렸다.", "1998~2007년 21세기 세종계획으로 국가 코퍼스를 구축했고, 2014년 KoNLPy 공개로 파이썬 한국어 처리가 보편화되었다."], "a": 3, "exp": "21세기 세종계획(1998~2007) → KKMA·한나눔 등 형태소 분석기(2000년대) → KoNLPy 공개(2014) → KoBERT·KorQuAD(2019) → HyperCLOVA·KoGPT(2021~) 순이다."}, {"id": 43, "sec": "1.3", "diff": "기초", "q": "강의자료가 제시한, 자연어를 복잡하게 만드는 세 가지 원인은?", "opts": ["어휘 부족, 문법 오류, 오탈자", "희소성, 과적합, 기울기 소실", "중의성, 규칙의 예외, 언어의 유연성과 확장성", "연산 속도, 저장 공간, 네트워크 지연"], "a": 2, "exp": "중의성(Ambiguity), 규칙의 예외(Exception), 유연성과 확장성(Productivity)이 자연어를 어렵게 만드는 세 가지 원인이다."}, {"id": 44, "sec": "1.3", "diff": "기초", "q": "중의성(Ambiguity)의 정의로 가장 적절한 것은?", "opts": ["유한한 규칙으로 무한한 문장을 만들어 낼 수 있는 성질", "같은 표현이라도 함께 쓰인 단어와 맥락에 따라 해석이 달라지는 성질", "시간이 지나면서 단어가 생기고 사라지는 성질", "규칙으로 정리해도 항상 예외가 남는 성질"], "a": 1, "exp": "중의성은 같은 표현이 함께 쓰인 단어와 맥락에 따라 다르게 해석되는 성질이다."}, {"id": 45, "sec": "1.3", "diff": "중급", "q": "\"눈이 온다\"와 \"눈이 크다\"에서 '눈'의 뜻이 달라지는 현상은 어떤 중의성인가?", "opts": ["형태적 중의성", "구조적 중의성", "어휘적 중의성", "화용적 중의성"], "a": 2, "exp": "한 단어가 여러 뜻을 가져 생기는 중의성이 어휘적 중의성이다."}, {"id": 46, "sec": "1.3", "diff": "중급", "q": "구조적 중의성에 대한 설명으로 옳은 것은?", "opts": ["띄어쓰기 오류 때문에만 생기는 중의성이다.", "한 단어가 여러 뜻을 가져서 생기는 중의성이다.", "문장 구조를 여러 갈래로 분석할 수 있어 생기는 중의성이다.", "맥락과 화자의 의도에 따라 의미가 달라져 생기는 중의성이다."], "a": 2, "exp": "구조적 중의성은 동일한 단어 나열이 서로 다른 구문 구조로 분석될 수 있어 생긴다."}, {"id": 47, "sec": "1.3", "diff": "심화", "q": "\"나는 작은 소녀의 인형을 보았다\"가 구조적 중의성의 예인 이유로 옳은 것은?", "opts": ["'인형'이라는 단어가 여러 뜻을 갖기 때문", "'작은'이 '소녀'를 수식하는 해석과 '인형'을 수식하는 해석이 모두 가능하기 때문", "'보았다'의 시제가 과거인지 현재인지 알 수 없기 때문", "'나는'이 동사로도 명사로도 해석되기 때문"], "a": 1, "exp": "해석①은 소녀가 작다, 해석②는 인형이 작다로, 동일한 단어 나열이 서로 다른 구문 구조(명사구 묶음)로 분석된다."}, {"id": 48, "sec": "1.3", "diff": "중급", "q": "\"창문 열려 있네\"라는 말이 상황에 따라 '닫아 달라'는 요청으로 해석되는 것은 어떤 중의성인가?", "opts": ["통사적 중의성", "화용적 중의성", "구조적 중의성", "어휘적 중의성"], "a": 1, "exp": "맥락과 화자의 의도에 따라 의미가 달라지는 것이 화용적 중의성이다."}, {"id": 49, "sec": "1.3", "diff": "심화", "q": "중의성의 유형과 예시의 연결로 옳지 않은 것은?", "opts": ["구조적 중의성 — \"눈이 온다\" / \"눈이 크다\"", "어휘적 중의성 — 한 단어가 여러 뜻을 가짐", "화용적 중의성 — \"창문 열려 있네\" = 닫아 달라는 요청", "구조적 중의성 — \"작은 소녀의 인형\""], "a": 0, "exp": "\"눈이 온다\"/\"눈이 크다\"는 한 단어가 여러 뜻을 갖는 어휘적 중의성의 예다."}, {"id": 50, "sec": "1.3", "diff": "기초", "q": "\"발이 넓다\"가 '아는 사람이 많다'를 뜻하는 현상은 무엇의 예인가?", "opts": ["구조적 중의성 — 구문 분석이 여러 갈래인 경우", "관용구 — 규칙으로 설명되지 않는 예외", "불규칙 활용 — 어간이 형태를 바꾸는 예외", "신조어 — 시간에 따라 새로 생긴 표현"], "a": 1, "exp": "\"발이 넓다\"는 발의 실제 너비와 무관하게 굳어진 관용구로, 규칙의 예외에 해당한다."}, {"id": 51, "sec": "1.3", "diff": "중급", "q": "강의자료에서 관용구의 예로 제시된 것이 아닌 것은?", "opts": ["듣다 → 들어요", "국수를 먹다 = 결혼하다", "발이 넓다 = 아는 사람이 많다", "미역국을 먹다 = 시험에 떨어지다"], "a": 0, "exp": "\"듣다 → 들어요\"는 관용구가 아니라 불규칙 활용의 예다."}, {"id": 52, "sec": "1.3", "diff": "중급", "q": "\"듣다 → 들어요\", \"짓다 → 지어요\"가 보여 주는 언어 현상은?", "opts": ["유한한 규칙으로 무한한 문장을 만드는 확장성", "맥락에 따라 의도가 달라지는 화용적 중의성", "단어가 여러 뜻을 갖는 어휘적 중의성", "규칙으로 정리해도 항상 남는 불규칙 활용(예외)"], "a": 3, "exp": "단어와 형태소의 결합 방식을 규칙으로 정리해도 불규칙 활용 같은 예외가 항상 존재한다."}, {"id": 53, "sec": "1.3", "diff": "심화", "q": "규칙의 예외가 존재한다는 사실이 주는 시사점으로 가장 적절한 것은?", "opts": ["예외는 한국어에만 나타나므로 영어 처리에는 문제가 없다.", "예외를 규칙으로 일일이 열거하는 접근은 확장되지 않으므로 데이터 기반 학습이 필요하다.", "예외가 있는 표현은 자연어처리 대상에서 제외해야 한다.", "예외 사전을 충분히 크게 만들면 모든 언어 현상을 규칙으로 처리할 수 있다."], "a": 1, "exp": "예외를 일일이 규칙으로 열거하는 방식은 확장되지 않으며, 이것이 데이터 기반 학습으로 전환한 핵심 이유다."}, {"id": 54, "sec": "1.3", "diff": "기초", "q": "언어의 유연성과 확장성(Productivity)에 대한 설명으로 옳은 것은?", "opts": ["규칙으로 정리해도 예외가 남는다는 성질", "유한한 단어와 규칙을 조합해 사실상 무한한 문장을 만들 수 있다는 성질", "언어마다 문자 체계가 다르다는 성질", "같은 표현이 맥락에 따라 다르게 해석된다는 성질"], "a": 1, "exp": "Productivity는 유한한 단어와 규칙의 조합으로 무한에 가까운 문장을 만들어 낼 수 있는 성질이다."}, {"id": 55, "sec": "1.3", "diff": "중급", "q": "\"The young man closed the door\" → \"The young man closed the old wooden door\"라는 예시가 보여 주는 것은?", "opts": ["수식어와 내포절을 계속 붙이면 문장 길이에 이론적 제한이 없다는 점", "영어는 한국어보다 문장 구조가 단순하다는 점", "문장이 길어질수록 의미가 반드시 모호해진다는 점", "형용사를 넣으면 문장의 의미가 완전히 달라진다는 점"], "a": 0, "exp": "형용사나 내포절을 계속 붙일 수 있으므로 문장 길이는 이론적으로 제한이 없다."}, {"id": 56, "sec": "1.3", "diff": "중급", "q": "신조어·유행어의 등장이 자연어처리에 주는 영향으로 옳은 것은?", "opts": ["규칙 기반 시스템에서는 문제가 되지만 학습 기반 모델에는 전혀 영향이 없다.", "일반화된 규칙으로 설명하기 어렵고 학습 데이터를 빠르게 낡게 만든다.", "어휘 수가 늘어나므로 모델 성능이 자동으로 향상된다.", "시간이 지나도 언어는 변하지 않으므로 영향이 없다."], "a": 1, "exp": "신조어·유행어는 계속 생기고 안 쓰이는 단어는 사라지는데, 이런 변화는 규칙으로 설명하기 어렵고 학습 데이터를 빠르게 낡게 만든다."}, {"id": 57, "sec": "1.3", "diff": "중급", "q": "한국어가 교착어라는 점이 자연어처리에 주는 함의로 옳은 것은?", "opts": ["조사와 어미가 없어 어순만으로 문장 성분을 판단할 수 있다.", "단어의 형태가 절대 변하지 않으므로 띄어쓰기 단위로 처리하면 충분하다.", "한 어절이 항상 하나의 형태소에 대응한다.", "체언에 조사, 어간에 어미가 계속 붙어 한 어절이 여러 형태소로 이루어지므로 형태소 분석이 선행되어야 한다."], "a": 3, "exp": "\"학교에서는\" = 학교 + 에서 + 는처럼 한 어절이 여러 형태소로 구성되므로 형태소 분석이 먼저 필요하다."}, {"id": 58, "sec": "1.3", "diff": "중급", "q": "\"아버지가방에들어가신다\"라는 예가 보여 주는 한국어의 난점은?", "opts": ["높임법이 다양해 표현이 여러 가지라는 점", "조사가 생략되면 의미를 알 수 없다는 점", "어순이 자유로워 주어를 찾기 어렵다는 점", "띄어쓰기가 의미를 바꿀 수 있으며 띄어쓰기 오류도 흔하다는 점"], "a": 3, "exp": "띄어쓰기에 따라 \"아버지가 방에\"와 \"아버지 가방에\"로 뜻이 달라지며, 실제 텍스트에는 띄어쓰기 오류가 흔하다."}, {"id": 59, "sec": "1.3", "diff": "심화", "q": "한국어 자연어처리가 어려운 이유로 강의자료에서 제시하지 않은 것은?", "opts": ["교착어라서 한 어절이 여러 형태소로 구성된다.", "영어에 비해 공개된 학습용 코퍼스와 벤치마크가 지나치게 많아 선택이 어렵다.", "높임법과 종결어미가 다양해 같은 의미도 표현이 여러 가지다.", "어순이 비교적 자유롭고 주어·목적어가 자주 생략된다."], "a": 1, "exp": "오히려 영어에 비해 공개된 한국어 코퍼스와 벤치마크의 양이 적다는 점이 어려움으로 제시되었다."}, {"id": 60, "sec": "1.3", "diff": "기초", "q": "자연어처리가 어려운 근본적인 배경으로 옳은 것은?", "opts": ["컴퓨터의 저장 공간이 문장을 담기에 부족하기 때문", "자연어는 수치가 아니라 사람의 언어이며 복잡하고 불확실한데, 컴퓨터는 수치를 입력으로 받기 때문", "사람마다 사용하는 문자 체계가 완전히 다르기 때문", "자연어에는 규칙이 전혀 존재하지 않기 때문"], "a": 1, "exp": "컴퓨터는 수치를 입력으로 받으므로 복잡하고 불확실한 언어를 수치로 바꾸는 단계가 필요하며, 여기서 여러 어려움이 발생한다."}, {"id": 61, "sec": "1.4", "diff": "기초", "q": "기계 번역(Machine Translation)의 발전 과정을 순서대로 바르게 나열한 것은?", "opts": ["신경망 기반(NMT) → 규칙 기반(RBMT) → 통계 기반(SMT) → LLM 기반", "규칙 기반(RBMT) → 신경망 기반(NMT) → 통계 기반(SMT) → LLM 기반", "통계 기반(SMT) → 규칙 기반(RBMT) → 신경망 기반(NMT) → LLM 기반", "규칙 기반(RBMT) → 통계 기반(SMT) → 신경망 기반(NMT) → LLM 기반"], "a": 3, "exp": "기계 번역은 RBMT → SMT → NMT → LLM 기반 순으로 발전했으며, 현재는 문서 전체의 문맥과 문체까지 고려하는 방향으로 나아가고 있다."}, {"id": 62, "sec": "1.4", "diff": "중급", "q": "기계 번역 분야에 남아 있는 과제로 강의자료가 제시한 것은?", "opts": ["저자원 언어, 전문 용어, 문화적 맥락과 관용 표현의 번역", "글자를 화면에 출력하는 인코딩 문제", "번역 결과를 파일로 저장하는 방법", "번역 서비스의 사용자 인터페이스 설계"], "a": 0, "exp": "저자원 언어, 전문 용어, 문화적 맥락과 관용 표현의 번역이 여전히 어려운 과제로 남아 있다."}, {"id": 63, "sec": "1.4", "diff": "기초", "q": "기계 독해(MRC, Machine Reading Comprehension)에 대한 설명으로 옳은 것은?", "opts": ["원문에서 중요한 문장을 골라 이어 붙이는 과제이다.", "문서에서 개체명을 뽑아 지식 그래프를 만드는 과제이다.", "텍스트를 음성으로 변환해 읽어 주는 과제이다.", "주어진 지문을 읽고 질문에 답하는 과제이며 KorQuAD가 대표적인 데이터셋이다."], "a": 3, "exp": "MRC는 주어진 지문을 읽고 질문에 답하는 과제이며, 한국어 대표 데이터셋으로 KorQuAD가 있다."}, {"id": 64, "sec": "1.4", "diff": "중급", "q": "검색 증강 생성(RAG)에 대한 설명으로 옳은 것은?", "opts": ["언어모델의 파라미터를 늘려 지식을 더 많이 암기시키는 방식이다.", "검색으로 찾은 문서를 언어모델에 넣어 근거 있는 답을 생성하는 방식이다.", "검색 결과를 사람이 직접 요약해 제공하는 방식이다.", "질문을 여러 언어로 번역해 검색 범위를 넓히는 방식이다."], "a": 1, "exp": "RAG는 검색으로 찾은 문서를 언어모델의 입력에 넣어 근거가 있는 답을 만들게 하는 방식이다."}, {"id": 65, "sec": "1.4", "diff": "중급", "q": "정보 추출(Information Extraction)에 속하는 과제로만 묶인 것은?", "opts": ["추출 요약, 생성 요약, 문체 변환", "맞춤법 교정, 띄어쓰기 교정, 오타 수정", "음성 인식, 음성 합성, 화자 분리", "개체명 인식(NER), 관계 추출, 사건 추출"], "a": 3, "exp": "정보 추출은 개체명 인식·관계 추출·사건 추출을 통해 지식 그래프를 구축하는 분야다."}, {"id": 66, "sec": "1.4", "diff": "중급", "q": "정보 추출의 활용 사례로 가장 적절한 것은?", "opts": ["계약서에서 당사자·금액·기한을 자동으로 추출하고, 뉴스에서 인물·기업 관계를 추적한다.", "오디오북과 내비게이션 안내 음성을 생성한다.", "원문을 이해한 뒤 새로운 문장으로 다시 써서 요약문을 만든다.", "고객 리뷰의 긍정·부정 태도를 판별해 여론을 모니터링한다."], "a": 0, "exp": "계약서에서 당사자·금액·기한을 뽑거나 뉴스에서 인물·기업 관계를 추적하는 것이 정보 추출의 대표적 활용이다."}, {"id": 67, "sec": "1.4", "diff": "기초", "q": "텍스트 분류(Text Classification)의 활용 사례로 가장 적절한 것은?", "opts": ["지문을 읽고 질문에 답하기", "스팸 메일 필터, 뉴스 카테고리 분류, 문의 메일의 부서 자동 배정", "계약서에서 금액과 기한을 뽑아내기", "입력 문장을 다른 언어로 옮기기"], "a": 1, "exp": "스팸 필터, 뉴스 카테고리 분류, 문의 메일의 부서 자동 배정이 텍스트 분류의 대표 사례이며, 1주차 실습 과제이기도 하다."}, {"id": 68, "sec": "1.4", "diff": "기초", "q": "감성 분석(Sentiment Analysis)에 대한 설명으로 옳은 것은?", "opts": ["원문을 짧게 줄여 핵심만 남기는 과제이다.", "두 문서가 얼마나 비슷한지를 수치로 계산하는 과제이다.", "텍스트에 담긴 긍정·부정·중립의 태도를 판별하는 과제이다.", "텍스트에서 인물·기관 등의 개체명을 찾아내는 과제이다."], "a": 2, "exp": "감성 분석은 텍스트에 담긴 긍정·부정·중립의 태도를 판별하며, 상품평 선별·브랜드 여론 모니터링·고객 지원 우선순위 결정에 쓰인다."}, {"id": 69, "sec": "1.4", "diff": "심화", "q": "\"배송은 빠른데 품질은 별로\"라는 리뷰를 다루기에 가장 적합한 기법은?", "opts": ["추출 요약", "개체명 인식", "문서 단위의 단일 감성 분류", "속성 기반 감성 분석"], "a": 3, "exp": "한 문장 안에서 속성(배송/품질)별로 감성이 다르므로, 세분화된 형태인 속성 기반 감성 분석이 적합하다."}, {"id": 70, "sec": "1.4", "diff": "중급", "q": "텍스트 유사도의 활용 사례로 가장 적절한 것은?", "opts": ["음성을 텍스트로 받아쓰기", "계약서에서 당사자 이름 추출하기", "중복 문서 탐지, 표절 검사, 유사 질문 추천", "스팸 메일 걸러내기"], "a": 2, "exp": "텍스트 유사도는 중복 문서 탐지, 표절 검사, 유사 질문 추천 등에 활용된다."}, {"id": 71, "sec": "1.4", "diff": "중급", "q": "추출 요약과 생성 요약의 차이로 옳은 것은?", "opts": ["추출 요약은 원문에서 중요한 문장을 골라 이어 붙이고, 생성 요약은 원문을 이해한 뒤 새로운 문장으로 다시 쓴다.", "둘은 명칭만 다를 뿐 처리 방식은 완전히 동일하다.", "추출 요약은 번역을 거치고, 생성 요약은 번역 없이 수행한다.", "추출 요약은 새로운 문장을 만들고, 생성 요약은 원문 문장을 그대로 뽑아 이어 붙인다."], "a": 0, "exp": "추출 요약은 원문 문장을 선택해 이어 붙이는 방식, 생성 요약은 이해한 내용을 새로운 문장으로 다시 쓰는 방식이다."}, {"id": 72, "sec": "1.4", "diff": "기초", "q": "문서 요약의 활용 사례로 가장 적절한 것은?", "opts": ["웹 검색어 오타 교정", "스팸 메일 필터링", "포털 뉴스 요약, 회의록 정리, 논문 초록 생성", "상품평의 긍정·부정 판별"], "a": 2, "exp": "포털 뉴스 요약, 회의록 정리, 논문 초록 생성이 문서 요약의 대표적 활용이다."}, {"id": 73, "sec": "1.4", "diff": "기초", "q": "텍스트 생성(Text Generation)의 응용으로 보기 어려운 것은?", "opts": ["소설·시나리오 초안 작성", "코드 생성", "글쓰기 보조와 광고 문구 작성", "스팸 메일을 걸러내어 수신함을 정리하는 일"], "a": 3, "exp": "스팸 메일 필터링은 텍스트 분류에 해당한다. 글쓰기 보조·광고 문구·소설 초안·코드 생성이 텍스트 생성의 응용이다."}, {"id": 74, "sec": "1.4", "diff": "중급", "q": "STT와 TTS의 구분으로 옳은 것은?", "opts": ["STT는 문서를 요약하고, TTS는 문서를 분류한다.", "STT는 텍스트를 음성으로 바꾸고, TTS는 음성을 텍스트로 바꾼다.", "STT는 음성을 텍스트로 바꾸고, TTS는 텍스트를 음성으로 바꾼다.", "STT와 TTS 모두 텍스트를 다른 언어로 번역하는 기술이다."], "a": 2, "exp": "STT(Speech-To-Text)는 시리·빅스비·회의 받아쓰기 등, TTS(Text-To-Speech)는 오디오북·내비게이션 안내·접근성 지원에 쓰인다."}, {"id": 75, "sec": "1.4", "diff": "중급", "q": "산업별 자연어처리 활용 사례의 연결로 옳지 않은 것은?", "opts": ["커머스 — 상품평 분석과 고객 문의 자동 응대", "교육 — 판례 검색과 계약서 조항 검토", "금융 — 공시·리포트 분석과 상담 챗봇", "의료 — 진료 기록 요약과 의학 논문 검색"], "a": 1, "exp": "판례 검색과 계약서 조항 검토는 법률 분야의 사례다. 교육 분야는 자동 채점, 작문 피드백, 맞춤형 학습 콘텐츠 생성이다."}, {"id": 76, "sec": "1.4", "diff": "중급", "q": "공공·미디어 분야의 자연어처리 활용 사례로 강의자료가 제시한 것은?", "opts": ["이상거래 관련 문서 심사", "민원 분류, 사실관계 점검, 표제 자동 생성", "판례 검색과 법리 추출", "진료 기록 요약과 환자 문진 보조"], "a": 1, "exp": "공공·미디어 분야에서는 민원 분류, 사실관계 점검, 표제 자동 생성 등에 활용된다."}, {"id": 77, "sec": "1.4", "diff": "심화", "q": "강의자료가 제시한 글로벌 자연어처리 시장 전망에 대한 설명으로 옳은 것은?", "opts": ["2028년을 정점으로 시장이 축소될 것으로 전망된다.", "시장 규모가 정체되어 2031년까지 큰 변화가 없을 것으로 전망된다.", "연평균 성장률(CAGR)이 약 29%로, 2022년 약 160억 달러에서 2031년 약 2,500억 달러 규모로 성장할 것으로 전망된다.", "연평균 성장률이 약 5%로 완만하게 성장할 것으로 전망된다."], "a": 2, "exp": "전망치는 조사기관별로 차이가 있으나, 대략 연평균 29% 수준으로 2022년 160억 달러 → 2031년 2,500억 달러의 빠른 성장이 예상된다."}, {"id": 78, "sec": "1.5", "diff": "기초", "q": "자연어처리 파이프라인의 단계 순서로 옳은 것은?", "opts": ["원문 텍스트 → 전처리 → 토큰화 → 벡터화 → 모델 → 후처리 → 응용 서비스", "원문 텍스트 → 토큰화 → 전처리 → 모델 → 벡터화 → 후처리 → 응용 서비스", "원문 텍스트 → 벡터화 → 토큰화 → 전처리 → 모델 → 후처리 → 응용 서비스", "원문 텍스트 → 모델 → 전처리 → 토큰화 → 벡터화 → 후처리 → 응용 서비스"], "a": 0, "exp": "자연어처리 시스템은 전처리(정제·정규화) → 토큰화(형태소 분석) → 벡터화(특징 표현) → 모델(학습·추론) → 후처리(결과 생성) 순으로 연결된 파이프라인 구조를 갖는다."}, {"id": 79, "sec": "1.5", "diff": "중급", "q": "파이프라인의 '전처리' 단계에서 주로 하는 일은?", "opts": ["텍스트의 정제와 정규화", "모델 파라미터의 최적화", "최종 결과를 서비스 형태로 노출", "단어를 실수 벡터로 변환"], "a": 0, "exp": "전처리 단계는 원문 텍스트를 정제하고 정규화해 이후 단계가 다룰 수 있는 형태로 만든다."}, {"id": 80, "sec": "1.5", "diff": "중급", "q": "파이프라인의 '토큰화' 단계에 해당하는 작업은?", "opts": ["단어를 밀집 벡터로 바꾸는 작업", "손실 함수를 정의하고 학습하는 작업", "모델 출력에서 최종 응답을 만드는 작업", "형태소 분석 등 문장을 처리 단위로 나누는 작업"], "a": 3, "exp": "토큰화 단계에서는 형태소 분석 등을 통해 문장을 모델이 다룰 처리 단위로 나눈다. (3주차에서 자세히 다룬다)"}, {"id": 81, "sec": "1.5", "diff": "중급", "q": "파이프라인의 '벡터화' 단계의 역할로 옳은 것은?", "opts": ["학습된 모델을 실제 서비스에 투입한다.", "문장의 오탈자와 특수문자를 제거한다.", "토큰을 모델이 계산할 수 있는 특징 표현(수치 벡터)으로 바꾼다.", "모델의 성능을 평가하고 오류를 분석한다."], "a": 2, "exp": "벡터화는 토큰을 특징 표현, 즉 수치 벡터로 바꾸는 단계다."}, {"id": 82, "sec": "1.5", "diff": "기초", "q": "딥러닝 기반 자연어처리 연구·개발의 여섯 단계를 순서대로 나열한 것은?", "opts": ["데이터 확보 → 목적 정의 → 학습 → 모델 설계 → 배포 → 검증", "목적 정의 → 모델 설계 → 학습 → 데이터 확보 → 배포 → 검증", "모델 설계 → 목적 정의 → 데이터 확보 → 검증 → 학습 → 배포", "목적 정의 → 데이터 확보 → 모델 설계 → 학습 → 검증 → 배포"], "a": 3, "exp": "① 목적 정의 → ② 데이터 확보 → ③ 모델 설계 → ④ 학습 → ⑤ 검증 → ⑥ 배포 순이며, 검증에서 문제가 발견되면 ②~④를 반복한다."}, {"id": 83, "sec": "1.5", "diff": "중급", "q": "⑤ 검증 단계에서 성능 문제가 발견되었을 때의 일반적인 대응은?", "opts": ["① 목적 정의 단계를 건너뛰고 곧바로 배포한다.", "② 데이터 확보 ~ ④ 학습 단계를 다시 반복한다.", "모델을 그대로 두고 서비스 화면만 수정한다.", "검증을 생략하고 다음 과제로 넘어간다."], "a": 1, "exp": "검증에서 문제가 발견되면 데이터 확보·모델 설계·학습(②~④)을 반복하며 개선한다."}, {"id": 84, "sec": "1.5", "diff": "중급", "q": "연구·개발 여섯 단계와 그 내용의 연결로 옳지 않은 것은?", "opts": ["① 목적 정의 — 무엇을 풀 것인가", "④ 학습 — 성능 평가와 오류 분석", "⑥ 배포 — 실제 서비스 투입", "② 데이터 확보 — 코퍼스 구축·수집"], "a": 1, "exp": "성능 평가와 오류 분석은 ⑤ 검증 단계의 내용이다. ④ 학습은 코퍼스로 파라미터를 최적화하는 단계다."}, {"id": 85, "sec": "1.5", "diff": "기초", "q": "코퍼스(Corpus, 말뭉치)에 대한 설명으로 옳은 것은?", "opts": ["통계·딥러닝 기반 자연어처리에서 사용하는 대규모 문장 모음이다.", "형태소 분석 규칙을 정리한 문법서이다.", "모델의 파라미터를 저장한 가중치 파일이다.", "텍스트를 벡터로 바꾸는 알고리즘의 이름이다."], "a": 0, "exp": "코퍼스는 대규모 문장 모음으로, 목적에 따라 품사·개체명·감성 등 분석 결과를 함께 붙이기도 한다."}, {"id": 86, "sec": "1.5", "diff": "중급", "q": "코퍼스의 종류에 대한 설명으로 옳은 것은?", "opts": ["주석이 달린 코퍼스를 '병렬 코퍼스', 번역쌍을 담은 것을 '태깅된 코퍼스'라 한다.", "코퍼스에는 문장만 담을 수 있으며 주석은 붙일 수 없다.", "주석이 달린 코퍼스를 '태깅된 코퍼스', 번역쌍을 담은 것을 '병렬 코퍼스'라 한다.", "병렬 코퍼스는 같은 언어의 문장을 두 벌로 담은 것을 말한다."], "a": 2, "exp": "품사·개체명·감성 등의 주석이 붙은 것이 태깅된 코퍼스, 번역쌍을 담은 것이 병렬 코퍼스다."}, {"id": 87, "sec": "1.5", "diff": "심화", "q": "코퍼스가 중요한 이유로 옳은 것은?", "opts": ["코퍼스는 규칙 기반 시스템에서만 필요하다.", "딥러닝 모델의 성능은 데이터의 양과 품질에 크게 좌우되며, 편향된 코퍼스로 학습하면 모델도 그 편향을 재현한다.", "코퍼스의 크기와 모델 성능은 서로 무관하다.", "편향된 코퍼스로 학습해도 모델은 편향을 스스로 교정한다."], "a": 1, "exp": "데이터의 양과 품질이 성능을 좌우하며, 편향된 코퍼스는 모델이 그 편향을 그대로 재현하게 만든다."}, {"id": 88, "sec": "1.5", "diff": "중급", "q": "대표적인 한국어 코퍼스로만 묶인 것은?", "opts": ["Penn Treebank, Brown Corpus, Reuters", "세종 코퍼스, 모두의 말뭉치, KorQuAD, NSMC", "ImageNet, COCO, CIFAR-10, MNIST", "IMDB, SQuAD, GLUE, WikiText"], "a": 1, "exp": "세종 코퍼스, 모두의 말뭉치(국립국어원), KorQuAD, NSMC(네이버 영화 리뷰)가 대표적인 한국어 코퍼스다."}, {"id": 89, "sec": "1.5", "diff": "기초", "q": "단어 임베딩(Word Embedding)에 대한 설명으로 옳은 것은?", "opts": ["문장에서 불필요한 조사를 제거하는 과정이다.", "단어를 사전 순으로 정렬해 색인을 만드는 과정이다.", "학습된 모델을 서비스에 배포하는 과정이다.", "각 단어(형태소)를 실수 벡터로 변환하는 전처리 과정이다."], "a": 3, "exp": "단어 임베딩은 각 단어(형태소)를 실수 벡터로 바꾸는 전처리 과정이다."}, {"id": 90, "sec": "1.5", "diff": "중급", "q": "잘 학습된 단어 임베딩 공간의 성질로 옳은 것은?", "opts": ["모든 단어가 서로 같은 거리만큼 떨어져 균등하게 배치된다.", "비슷한 의미의 단어는 가까이 놓이고, 비슷한 관계의 단어쌍은 같은 방향에 놓인다.", "벡터의 차원 수가 단어의 개수와 항상 같아야 한다.", "단어의 철자가 비슷할수록 반드시 가까이 놓인다."], "a": 1, "exp": "임베딩 공간에서는 의미가 비슷한 단어가 가까이 놓이고, 관계가 비슷한 단어쌍은 같은 방향의 벡터 차이를 갖는다."}, {"id": 91, "sec": "1.5", "diff": "기초", "q": "챗봇(대화 엔진) 파이프라인의 네 단계를 순서대로 나열한 것은?", "opts": ["생성 → 파싱 → 분석 → 실행", "분석 → 파싱 → 실행 → 생성", "파싱 → 생성 → 분석 → 실행", "파싱 → 분석 → 생성 → 실행"], "a": 3, "exp": "사용자 발화 → ① 파싱 → ② 분석 → ③ 생성 → ④ 실행 → 응답 발 const SECTIONS = {
  "1.1":"자연어처리란 무엇인가",
  "1.2":"자연어처리의 역사",
  "1.3":"자연어처리가 어려운 이유",
  "1.4":"주요 응용 분야",
  "1.5":"시스템은 어떻게 만들어지는가",
  "1.6":"한계와 윤리적 쟁점"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "nlp_week1_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
