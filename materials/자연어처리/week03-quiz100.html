<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3주차 토큰화·품사 태깅·정규화 — 100문제 풀이</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 3 · 자연어처리</div>
    <h1>3주차 &middot; 토큰화, 품사 태깅, 불용어 제거, 텍스트 정규화 — 100문제</h1>
    <p class="sub">강의자료 3.0~3.13절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    3주차 강의자료(토큰화·품사 태깅·불용어 제거·텍스트 정규화) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "3.0", "diff": "기초", "q": "전처리가 필요한 이유로 가장 적절한 것은?", "opts": ["전처리를 해야만 문서를 저장할 수 있기 때문", "사람이 텍스트를 읽기 쉽게 만들기 위해서", "원시 텍스트는 컴퓨터에게 단순한 문자의 나열일 뿐이고, 모델은 숫자만 이해하므로 텍스트를 수치로 바꿔야 하기 때문", "원시 텍스트의 파일 용량이 지나치게 크기 때문"], "a": 2, "exp": "사람이 쓴 문장은 컴퓨터에게 문자의 나열일 뿐이며, 머신러닝 모델은 숫자만 이해하므로 텍스트를 수치로 바꾸는 과정이 필요하다."}, {"id": 2, "sec": "3.0", "diff": "중급", "q": "원시 텍스트가 가진 문제와 그 예시의 연결로 옳지 않은 것은?", "opts": ["표기 변형 — \"USA\", \"U.S.A.\", \"United States\"가 같은 대상을 가리킴", "의미 기여도 차이 — \"Natureal\", \"Processin\"처럼 사전에 없는 형태", "불필요한 정보 — HTML 태그, URL, 이모지, 반복 문자(\"ㅋㅋㅋㅋㅋ\")", "형태 변화 — \"study / studies / studying\"이 서로 다른 단어로 취급됨"], "a": 1, "exp": "\"Natureal\", \"Processin\"은 철자 오류의 예다. 의미 기여도 차이는 \"the\", \"is\", \"of\"처럼 의미를 거의 담지 않는 단어를 말한다."}, {"id": 3, "sec": "3.0", "diff": "기초", "q": "전처리를 한 문장으로 정의한 것으로 가장 적절한 것은?", "opts": ["잡음을 줄이고 같은 의미를 같은 표현으로 모으는 작업", "문장을 더 길고 자세하게 늘리는 작업", "텍스트를 사람이 읽기 좋은 문체로 다듬는 작업", "모델의 파라미터를 최적화하는 작업"], "a": 0, "exp": "전처리는 원시 텍스트의 잡음을 줄이고, 같은 의미를 같은 표현으로 모으는 작업이다."}, {"id": 4, "sec": "3.0", "diff": "중급", "q": "전처리 파이프라인의 성격에 대한 설명으로 옳은 것은?", "opts": ["모델 학습이 끝난 뒤에 적용하는 후처리 과정이다.", "한 가지 기법만 잘 선택하면 나머지는 필요 없는 구조이다.", "서로 독립적인 기법들을 순서에 상관없이 적용하면 되는 구조이다.", "하나의 기법이 아니라 여러 단계가 순서대로 연결된 구조이며, 각 단계는 앞 단계의 출력을 입력으로 받는다."], "a": 3, "exp": "전처리는 여러 단계가 순서대로 연결된 파이프라인이며, 각 단계가 앞 단계의 출력을 받아 점진적으로 텍스트를 정제한다."}, {"id": 5, "sec": "3.0", "diff": "중급", "q": "강의자료의 NLP 텍스트 전처리 파이프라인 순서로 옳은 것은?", "opts": ["원시 텍스트 → 정제 → 정규화 → 토큰화 → 품사 태깅 → 불용어 제거 → 어간/표제어 → 피처 표현(수치 벡터)", "원시 텍스트 → 피처 표현 → 정제 → 정규화 → 토큰화 → 품사 태깅 → 불용어 제거 → 어간/표제어", "원시 텍스트 → 불용어 제거 → 어간/표제어 → 토큰화 → 품사 태깅 → 정제 → 정규화 → 피처 표현", "원시 텍스트 → 토큰화 → 정제 → 품사 태깅 → 정규화 → 어간/표제어 → 불용어 제거 → 피처 표현"], "a": 0, "exp": "정제(Cleaning) → 정규화(Normalization) → 토큰화 → 품사 태깅 → 불용어 제거 → 어간/표제어 추출 → 피처 표현(수치 벡터)의 순서로 연결된다."}, {"id": 6, "sec": "3.0", "diff": "기초", "q": "전처리의 최종 목적으로 가장 적절한 것은?", "opts": ["텍스트를 모델이 학습할 수 있는 수치 표현으로 바꾸는 것", "텍스트의 분량을 최대한 줄이는 것", "텍스트를 다른 언어로 번역하는 것", "텍스트의 문법 오류를 모두 바로잡는 것"], "a": 0, "exp": "전처리의 목표는 텍스트를 모델이 학습할 수 있는 수치 표현으로 바꾸는 것이다."}, {"id": 7, "sec": "3.1", "diff": "기초", "q": "토큰화(tokenization)의 정의로 가장 적절한 것은?", "opts": ["텍스트에서 불필요한 기호를 제거하는 절차이다.", "단어를 사전에 실린 기본형으로 바꾸는 절차이다.", "각 단어에 품사를 부여하는 절차이다.", "텍스트를 분석의 기본 단위인 토큰으로 나누는 절차이며, 무엇을 토큰으로 볼지는 목적에 따른 설계 결정이다."], "a": 3, "exp": "토큰화는 텍스트를 분석의 기본 단위로 나누는 절차이며, 단어·문자·서브워드·형태소가 모두 토큰이 될 수 있다."}, {"id": 8, "sec": "3.1", "diff": "기초", "q": "\"I am reading a book.\"을 토큰화한 결과로 옳은 것은?", "opts": ["['Iamreadingabook']", "['I am reading a book.']", "['I', 'am', 'reading', 'a', 'book', '.']", "['I am', 'reading a', 'book.']"], "a": 2, "exp": "한 번에 하나씩 토큰을 추출하며, 이렇게 얻은 토큰을 유니그램(unigram)이라 한다. 마침표도 하나의 토큰이 된다."}, {"id": 9, "sec": "3.1", "diff": "중급", "q": "토큰(token)과 타입(type)의 차이로 옳은 것은?", "opts": ["토큰과 타입은 같은 개념의 다른 이름이다.", "토큰은 중복을 제거한 단위이고, 타입은 중복을 포함한 단위이다.", "토큰은 텍스트에 실제로 등장한 개별 단위(중복 포함)이고, 타입은 서로 다른 토큰의 종류(중복 제거)로 어휘 사전을 구성한다.", "토큰은 문장 단위이고, 타입은 문서 단위이다."], "a": 2, "exp": "토큰은 실제 등장한 개별 단위(중복 포함), 타입은 서로 다른 토큰의 종류이며 어휘 사전(vocabulary)을 이룬다."}, {"id": 10, "sec": "3.1", "diff": "중급", "q": "토큰화가 모든 후속 처리의 전제 조건이라고 말하는 이유로 옳은 것은?", "opts": ["토큰화를 하면 텍스트의 의미가 자동으로 결정되기 때문", "품사 태깅·불용어 제거·어간 추출이 모두 토큰 단위로 동작하고, 토큰이 잘못 나뉘면 이후 모든 단계의 결과가 어긋나기 때문(오류 전파)", "토큰화 없이는 텍스트를 화면에 출력할 수 없기 때문", "토큰화가 모델의 학습 속도를 결정하기 때문"], "a": 1, "exp": "후속 단계가 모두 토큰 단위로 동작하므로 토큰이 잘못 나뉘면 오류가 이후 단계로 전파된다. 또 어휘 사전을 만들어야 각 단어에 고유 인덱스를 줄 수 있다."}, {"id": 11, "sec": "3.1", "diff": "중급", "q": "토큰화 단위 선택에 대한 설명으로 옳지 않은 것은?", "opts": ["문자 단위는 OOV가 발생하지만 시퀀스가 짧아 계산이 효율적이다.", "서브워드 단위는 두 방식의 절충안으로 현대 모델의 표준이 되었다.", "단어 단위는 직관적이지만 어휘가 커지고 OOV가 발생한다.", "문자 단위는 OOV는 없지만 시퀀스가 길어지고 의미 단위가 사라진다."], "a": 0, "exp": "문자 단위는 OOV가 없는 대신 시퀀스가 길어지고 의미 단위가 사라진다는 것이 단점이다."}, {"id": 12, "sec": "3.1", "diff": "기초", "q": "n-그램에 대한 설명으로 옳은 것은?", "opts": ["토큰 두 개를 묶으면 트라이그램, 세 개를 묶으면 바이그램이라 한다.", "토큰 두 개를 묶으면 바이그램(bigram), 세 개를 묶으면 트라이그램(trigram)이라 한다.", "n-그램은 항상 문장 전체를 하나의 단위로 본다.", "n-그램은 단어의 품사를 묶는 방식이다."], "a": 1, "exp": "한 번에 두 개를 묶으면 바이그램, 세 개를 묶으면 트라이그램이며, 하나씩은 유니그램이다."}, {"id": 13, "sec": "3.1", "diff": "중급", "q": "n-그램을 사용하는 이유로 가장 적절한 것은?", "opts": ["단어 하나만으로는 알 수 없는 순서·문맥 정보를 담을 수 있기 때문 (예: \"not good\", \"New York\")", "철자 오류를 자동으로 교정할 수 있기 때문", "어휘 사전의 크기를 줄일 수 있기 때문", "문장의 길이를 짧게 만들 수 있기 때문"], "a": 0, "exp": "\"not good\"은 바이그램으로 볼 때 비로소 부정 의미가 드러나고, \"New York\"처럼 두 단어가 한 개체를 이루는 경우도 잡아낸다."}, {"id": 14, "sec": "3.1", "diff": "심화", "q": "n-그램의 한계로 옳지 않은 것은?", "opts": ["멀리 떨어진 단어 사이의 의존 관계는 여전히 포착하지 못한다.", "n이 커질수록 가능한 조합 수가 지수적으로 늘어나 희소성 문제가 생긴다.", "n이 커질수록 가능한 조합 수가 줄어들어 표현력이 떨어진다.", "학습 데이터에 없던 조합은 확률이 0이 되어 스무딩이 필요하다."], "a": 2, "exp": "n이 커질수록 조합 수는 지수적으로 늘어나 희소성이 심해진다. 실무에서는 보통 n=2~3을 사용한다."}, {"id": 15, "sec": "3.1", "diff": "중급", "q": "토큰화가 어려운 대표 사례와 그 이유의 연결로 옳지 않은 것은?", "opts": ["구두점 — \"Mr. Smith went to Washington.\"에서 'Mr.'을 분리하면 의미가 손상됨", "URL·이메일 — \"http://a.com/b?c=1\"을 '/'마다 자르면 무의미해짐", "복합 개체 — \"3.14, 1,000원, C++\"에서 소수점과 쉼표를 어떻게 처리할지 애매함", "축약형 — \"don't, I'm, it's\"를 do + n't로 나눌지 결정해야 함"], "a": 2, "exp": "\"3.14, 1,000원, C++\"은 숫자·기호 사례다. 복합 개체는 \"United States\", \"New York\"처럼 두 단어가 하나의 개체를 이루는 경우다."}, {"id": 16, "sec": "3.1", "diff": "중급", "q": "NLTK 토크나이저에 대한 설명으로 옳은 것은?", "opts": ["word_tokenize는 Treebank 기반으로 가장 널리 쓰이고, TweetTokenizer는 해시태그·멘션·이모티콘을 한 토큰으로 보존한다.", "토크나이저는 어떤 데이터에서든 정답이 하나로 정해져 있다.", "WordPunctTokenizer는 해시태그와 이모티콘을 보존하도록 설계되었다.", "RegexpTokenizer는 규칙을 지정할 수 없고 항상 같은 방식으로 동작한다."], "a": 0, "exp": "정답은 하나가 아니며 데이터 성격과 목적에 맞는 토크나이저를 골라야 한다. WordPunctTokenizer는 문자와 기호를 무조건 분리한다."}, {"id": 17, "sec": "3.1", "diff": "심화", "q": "\"Don't stop!\"에 대한 토크나이저별 결과로 옳은 것은?", "opts": ["두 토크나이저 모두 [\"Don't\", 'stop', '!']로 동일하게 나눈다.", "word_tokenize는 ['Don', \"'\", 't', ...]로, WordPunctTokenizer는 ['Do', \"n't\", ...]로 나눈다.", "두 토크나이저 모두 축약형을 처리하지 못해 오류를 낸다.", "word_tokenize는 ['Do', \"n't\", 'stop', '!']로, WordPunctTokenizer는 ['Don', \"'\", 't', 'stop', '!']로 나눈다."], "a": 3, "exp": "Treebank 기반 word_tokenize는 축약형을 Do + n't로 분리하고, WordPunctTokenizer는 문자와 기호를 무조건 분리해 Don + ' + t가 된다."}, {"id": 18, "sec": "3.1", "diff": "중급", "q": "RegexpTokenizer(r\"[A-Za-z]+\")를 \"Contact: hong@ex.com, 010-1234-5678\"에 적용한 결과로 옳은 것은?", "opts": ["['Contact:', 'hong@ex.com', '010-1234-5678']", "['Contact', 'hong', 'ex', 'com']", "['010-1234-5678']", "['Contact', 'hong@ex.com']"], "a": 1, "exp": "[A-Za-z]+는 영문 알파벳 연속만 추출하므로 숫자·기호가 모두 분리되어 ['Contact', 'hong', 'ex', 'com']이 된다."}, {"id": 19, "sec": "3.1", "diff": "심화", "q": "\"NLP is fun. It is used in many fields. Dr. Kim works at A.I. Lab.\"에 sent_tokenize를 적용하면 4문장이 나오는 이유는?", "opts": ["punkt가 마침표를 모두 문장 경계로 처리하기 때문", "word_tokenize가 먼저 실행되어 문장을 나누기 때문", "입력 텍스트에 실제로 4개의 문장이 들어 있기 때문", "\"Dr.\"는 punkt의 약어 사전에 있어 유지되지만 \"A.I.\"는 사전에 없어 문장 경계로 잘못 나뉘기 때문"], "a": 3, "exp": "punkt는 학습된 약어 사전으로 경계를 판단하므로 미등록 약어 \"A.I.\"에서 오분리가 발생한다. 도메인 약어는 abbrev_types에 직접 등록해야 한다."}, {"id": 20, "sec": "3.1", "diff": "중급", "q": "단어 단위 토큰화의 OOV 문제에 대한 설명으로 옳은 것은?", "opts": ["보지 못한 단어를 사전에 자동으로 추가한다.", "학습 시 보지 못한 단어를 모두 [UNK]로 처리해 정보를 완전히 잃는다.", "OOV는 문자 단위 토큰화에서만 발생하는 문제이다.", "보지 못한 단어를 문자 단위로 자동 분해해 처리한다."], "a": 1, "exp": "단어 단위 토큰화는 사전에 없는 단어를 모두 [UNK]로 바꾸므로 정보가 완전히 손실된다."}, {"id": 21, "sec": "3.1", "diff": "중급", "q": "서브워드 토큰화의 핵심 아이디어로 옳은 것은?", "opts": ["자주 등장하는 문자열은 통째로 두고, 드문 문자열은 더 작은 조각으로 분해한다.", "모든 단어를 항상 문자 하나하나로 분해한다.", "단어를 품사별로 나누어 저장한다.", "모든 단어를 통째로 두고 사전에 없으면 버린다."], "a": 0, "exp": "\"unhappiness\"를 단어 단위로는 [UNK]가 되지만 서브워드로는 un + happi + ness로 나눠 의미 일부를 보존한다."}, {"id": 22, "sec": "3.1", "diff": "중급", "q": "BPE(Byte Pair Encoding)의 동작 방식으로 옳은 것은?", "opts": ["가장 자주 함께 등장하는 문자 쌍을 반복적으로 병합하며, 원하는 어휘 크기에 도달할 때까지 반복한다.", "사전을 참조해 단어의 기본형을 찾는다.", "병합 후 언어 모델 우도가 가장 크게 증가하는 쌍을 선택한다.", "가장 드물게 등장하는 문자 쌍을 반복적으로 분리한다."], "a": 0, "exp": "BPE는 빈도가 가장 높은 인접 쌍을 반복 병합하며, low·lower·newest 예시에서 (e,s)→es, (es,t)→est, (l,o)→lo, (lo,w)→low 순으로 병합된다."}, {"id": 23, "sec": "3.1", "diff": "심화", "q": "서브워드 알고리즘의 특징 연결로 옳지 않은 것은?", "opts": ["SentencePiece — 공백까지 하나의 기호(▁)로 취급해 언어에 독립적으로 동작", "BPE — 빈도가 가장 높은 인접 쌍을 병합하며 GPT 계열에서 사용", "WordPiece — 단어 중간 조각에 \"##\" 접두어를 붙이며 BERT 계열에서 사용", "BPE — 병합 후 언어 모델 확률(우도)이 가장 크게 증가하는 쌍을 선택하며 BERT 계열에서 사용"], "a": 3, "exp": "우도가 가장 크게 증가하는 쌍을 선택하는 것은 WordPiece다. BPE는 빈도가 가장 높은 인접 쌍을 병합하며 GPT 계열에서 쓰인다."}, {"id": 24, "sec": "3.1", "diff": "중급", "q": "SentencePiece가 한국어·일본어·중국어에 특히 유리한 이유는?", "opts": ["단어 중간 조각에 \"##\"를 붙여 구분하기 때문", "공백까지 하나의 기호로 취급해 사전 토큰화가 필요 없기 때문", "항상 문자 단위로만 분해하기 때문", "형태소 분석기를 내부에 포함하고 있기 때문"], "a": 1, "exp": "SentencePiece는 공백까지 기호(▁)로 취급해 언어에 독립적으로 동작하며 사전 토큰화가 필요 없다. 한국어에서는 SentencePiece(Unigram/BPE)가 사실상 표준이다."}, {"id": 25, "sec": "3.1", "diff": "중급", "q": "\"나는 학교에서 책을 읽었다\"를 공백(어절) 기준과 형태소 기준으로 나눈 결과 비교로 옳은 것은?", "opts": ["두 방식의 결과는 한국어에서 항상 동일하다.", "공백 기준은 ['나는','학교에서','책을','읽었다']로 조사·어미가 붙어 어휘가 폭발하고, 형태소 기준은 ['나','는','학교','에서','책','을','읽','었','다']로 어휘가 축소된다.", "형태소 기준은 조사와 어미를 분리하지 않는다.", "공백 기준이 형태소 기준보다 항상 어휘 수가 적다."], "a": 1, "exp": "한국어는 교착어라 하나의 어간에 조사·어미가 계속 결합하므로, 어절 기준으로는 어휘가 폭발하고 형태소 기준으로 나눠야 어휘가 줄어든다."}, {"id": 26, "sec": "3.1", "diff": "심화", "q": "한국어에서 형태소 분석기를 이용한 토큰화가 필요한 이유로 강의자료가 제시하지 않은 것은?", "opts": ["띄어쓰기 규칙이 느슨하고 실제 문서에서 자주 어긋나기 때문", "같은 형태가 품사에 따라 다른 의미를 가지기 때문 (\"배\": 과일/신체/선박/배수)", "하나의 어간에 조사·어미가 계속 결합해 어절의 종류가 폭발하기 때문", "한국어는 어순이 완전히 고정되어 있어 위치만으로 품사를 알 수 있기 때문"], "a": 3, "exp": "어순 고정은 한국어의 특징이 아니며 제시된 이유도 아니다. 교착어 특성, 느슨한 띄어쓰기, 형태의 다의성이 형태소 분석이 필요한 이유다."}, {"id": 27, "sec": "3.1", "diff": "심화", "q": "\"아버지가방에들어가신다\"의 형태소 분석 결과에 대한 설명으로 옳은 것은?", "opts": ["'아버지 / 가방 / 에 / 들어가신다'가 올바른 분해이다.", "띄어쓰기가 없으면 어떤 분석기도 분해할 수 없다.", "두 분해 결과는 의미가 동일하다.", "'아버지 / 가방 / 에 / 들어가신다'는 잘못된 분해이고, '아버지 / 가 / 방 / 에 / 들어가 / 신다'가 올바른 분해이다."], "a": 3, "exp": "띄어쓰기가 잘못되면 완전히 다른 의미로 분해될 수 있으며, 형태소 분석기(Okt·Komoran·Mecab·Kiwi)는 문맥과 사전을 이용해 올바른 분해를 찾는다."}, {"id": 28, "sec": "3.1", "diff": "중급", "q": "한국어 형태소 분석기 설치·실행 환경에 대한 설명으로 옳은 것은?", "opts": ["KoNLPy의 Okt·Komoran·Hannanum·Kkma는 자바(JVM)가 필요하고, Kiwi는 pip 설치만으로 동작한다.", "Kiwi는 자바 설치가 반드시 필요하다.", "KoNLPy의 모든 분석기는 pip 설치만으로 동작한다.", "Mecab-ko는 별도 설치 없이 바로 사용할 수 있다."], "a": 0, "exp": "KoNLPy의 Okt·Komoran·Hannanum·Kkma는 JVM이 필요하고, Mecab-ko는 별도 바이너리 설치가 필요하며, Kiwi는 pip 설치만으로 동작하고 속도가 빠르다."}, {"id": 29, "sec": "3.2", "diff": "기초", "q": "품사 태깅(POS Tagging)의 정의로 옳은 것은?", "opts": ["의미 없는 단어를 제거하는 프로세스", "문장을 토큰으로 나누는 프로세스", "문장 내의 각 토큰에 해당하는 품사를 부여하는 프로세스", "단어를 사전의 기본형으로 바꾸는 프로세스"], "a": 2, "exp": "POS는 Part-of-Speech(품사)를 뜻하며, 품사 태깅은 각 토큰에 품사를 부여해 관심 있는 품사만 골라 분석할 수 있게 한다."}, {"id": 30, "sec": "3.2", "diff": "중급", "q": "Penn Treebank 태그셋에 대한 설명으로 옳은 것은?", "opts": ["태그가 5개뿐이라 외우기 쉽다.", "형태소마다 여러 개의 태그를 동시에 부여하는 체계이다.", "한국어 품사 태깅의 표준 체계로 총 36개 태그로 구성된다.", "영어 품사 태깅에서 가장 널리 쓰이는 표준 체계로 총 36개 태그로 구성된다."], "a": 3, "exp": "Penn Treebank 태그셋은 영어 품사 태깅의 표준으로 총 36개 태그이며, 앞 두 글자(NN/VB/JJ/RB)만 알아도 대부분 처리할 수 있다."}, {"id": 31, "sec": "3.2", "diff": "중급", "q": "Penn Treebank 태그와 그 의미의 연결로 옳지 않은 것은?", "opts": ["DT — 한정사", "JJR — 형용사 비교급", "NNP — 고유 명사 단수", "VBZ — 동사 원형"], "a": 3, "exp": "VBZ는 현재형(3인칭 단수)이고, 동사 원형은 VB다. VBD는 과거형, VBG는 동명사·현재분사, VBN은 과거분사, VBP는 현재형(비3인칭)이다."}, {"id": 32, "sec": "3.2", "diff": "심화", "q": "\"I am reading NLP Fundamentals\"에 nltk.pos_tag()를 적용한 결과로 옳은 것은?", "opts": ["[('I','NNP'), ('am','VB'), ('reading','NN'), ('NLP','JJ'), ('Fundamentals','RB')]", "[('I','DT'), ('am','IN'), ('reading','VBG'), ('NLP','CC'), ('Fundamentals','CD')]", "[('I','PRP'), ('am','VBZ'), ('reading','VBN'), ('NLP','NNS'), ('Fundamentals','NNP')]", "[('I','PRP'), ('am','VBP'), ('reading','VBG'), ('NLP','NNP'), ('Fundamentals','NNS')]"], "a": 3, "exp": "PRP는 인칭대명사, VBP는 현재형(비3인칭) 동사, VBG는 동명사·현재분사(여기서는 현재분사), NNP는 고유명사, NNS는 복수명사다."}, {"id": 33, "sec": "3.2", "diff": "중급", "q": "품사 태깅이 표제어 추출의 정확도를 높이는 예로 옳은 것은?", "opts": ["품사를 지정하면 표제어 추출이 항상 실패한다.", "품사 정보는 표제어 추출과 무관하다.", "lemmatize('saw')는 'see'가 되지만 품사를 주면 'saw'가 된다.", "lemmatize('saw')는 'saw'가 되지만 lemmatize('saw', pos='v')는 'see'가 된다."], "a": 3, "exp": "품사를 지정하지 않으면 명사로 간주되어 'saw'가 그대로 남지만, 동사로 지정하면 'see'라는 올바른 표제어를 얻는다."}, {"id": 34, "sec": "3.2", "diff": "중급", "q": "품사 태깅의 활용에 대한 설명으로 옳지 않은 것은?", "opts": ["키워드 추출에서는 명사(NN*)만 남기면 문서의 주제어를 얻을 수 있다.", "감성 분석에서는 명사(NN*)가 감성 극성의 핵심 단서가 된다.", "\"book\"이 명사인지 동사인지에 따라 의미 후보가 달라지므로 WSD의 1차 단서가 된다.", "NER은 보통 품사 태깅 결과를 입력으로 받아 개체 후보를 찾는다."], "a": 1, "exp": "감성 분석에서 감성 극성의 핵심 단서는 형용사(JJ)와 부사(RB)다. 명사는 키워드·주제어 추출에 쓰인다."}, {"id": 35, "sec": "3.2", "diff": "중급", "q": "품사 태깅 방법론의 발전 순서와 특징으로 옳은 것은?", "opts": ["신경망 기반 → 규칙 기반 → 통계 기반", "통계 기반 → 규칙 기반 → 신경망 기반", "규칙 기반 → 신경망 기반 → 통계 기반", "규칙 기반 → 통계 기반(HMM, CRF) → 신경망 기반(BiLSTM-CRF, Transformer)"], "a": 3, "exp": "\"-ly로 끝나면 부사\" 같은 규칙 기반에서, 전이 확률을 학습하는 통계 기반(HMM·CRF)을 거쳐, 문맥 전체를 보는 신경망 기반으로 발전했다."}, {"id": 36, "sec": "3.2", "diff": "중급", "q": "NLTK의 기본 품사 태거가 사용하는 방식은?", "opts": ["평균 퍼셉트론(averaged perceptron) 기반", "은닉 마르코프 모델(HMM) 기반", "BiLSTM-CRF 기반", "순수 규칙 기반"], "a": 0, "exp": "NLTK의 기본 태거는 평균 퍼셉트론(averaged perceptron) 기반이다."}, {"id": 37, "sec": "3.2", "diff": "심화", "q": "신경망 기반 품사 태깅의 성능과 그 함의로 옳은 것은?", "opts": ["현재 영어 기준 97% 이상의 정확도를 보이지만 100%는 아니므로 태깅 오류가 후속 단계에 전파될 수 있다.", "문맥을 보지 않고 단어별로 독립 판단하므로 빠르다.", "정확도가 100%에 도달해 오류 전파를 걱정할 필요가 없다.", "규칙 기반보다 정확도가 낮아 실무에서 잘 쓰이지 않는다."], "a": 0, "exp": "신경망 기반 태깅은 문맥 전체를 보고 영어 기준 97% 이상의 정확도를 보이지만 100%는 아니므로 오류 전파에 유의해야 한다."}, {"id": 38, "sec": "3.2", "diff": "중급", "q": "한국어 세종 태그셋의 태그와 의미의 연결로 옳지 않은 것은?", "opts": ["JKS — 목적격조사", "VA — 형용사", "NNG — 일반명사", "EF — 종결어미"], "a": 0, "exp": "JKS는 주격조사이고 목적격조사는 JKO다. JX는 보조사, EP는 선어말어미, EC는 연결어미, MAG는 일반부사, MM은 관형사, SF는 마침표다."}, {"id": 39, "sec": "3.2", "diff": "심화", "q": "영어와 한국어 품사 태깅의 결정적 차이로 옳은 것은?", "opts": ["두 언어 모두 단어 하나에 태그 하나가 붙는다.", "한국어는 어절 하나에 태그 하나가 붙지만, 영어는 단어가 여러 조각으로 분해된다.", "영어는 단어 하나에 태그 하나가 붙지만, 한국어는 어절 하나가 여러 형태소로 분해되어 각각 태그를 갖는다.", "한국어는 품사 태깅 자체가 불가능하다."], "a": 2, "exp": "영어는 \"reading\" = VBG처럼 단어 하나에 태그 하나지만, 한국어는 '들어가신다' → 들어가/VV + 시/EP + ㄴ다/EF처럼 어절이 여러 형태소로 분해된다."}, {"id": 40, "sec": "3.3", "diff": "기초", "q": "불용어(Stop word)에 대한 설명으로 옳은 것은?", "opts": ["문장의 구성을 지원하기 위해 사용하는 일반적인 단어로, 의미에 큰 영향을 주지 않아 제거하는 경우가 많다.", "사전에 없어 [UNK]로 처리되는 단어이다.", "문서에서 가장 중요한 주제어를 가리키는 단어이다.", "철자 오류가 있는 단어이다."], "a": 0, "exp": "불용어는 a, am, the, is, of처럼 문장 구성을 돕지만 의미에 큰 영향을 주지 않는 단어로, 분석 시 제거하는 경우가 많다."}, {"id": 41, "sec": "3.3", "diff": "중급", "q": "NLTK 불용어 리스트에 대한 설명으로 옳은 것은?", "opts": ["stopwords.words(\"english\")로 198개의 영어 불용어 목록을 얻을 수 있고, 한국어는 지원하지 않는다.", "영어 불용어 목록은 축약형을 포함하지 않는다.", "불용어 목록은 사용자가 수정할 수 없다.", "stopwords.words(\"korean\")으로 한국어 불용어 목록을 얻을 수 있다."], "a": 0, "exp": "영어 불용어는 198개이며 축약형(you're, you've)도 포함되므로 축약형 복원 이후에 제거해야 한다. stopwords.fileids()로 지원 언어를 확인할 수 있고 한국어는 미포함이다."}, {"id": 42, "sec": "3.3", "diff": "심화", "q": "불용어 제거 시 w.lower()를 적용해야 하는 이유는?", "opts": ["lower()를 적용해야 토큰화가 정상 동작하기 때문", "불용어 목록이 대문자로만 저장되어 있기 때문", "lower()를 적용하지 않으면 문장 첫 글자가 대문자인 \"I\", \"It\"이 제거되지 않기 때문", "lower()가 축약형을 자동으로 복원해 주기 때문"], "a": 2, "exp": "NLTK 불용어 목록은 소문자로 되어 있어, 소문자 변환 없이 비교하면 대문자로 시작하는 \"I\", \"It\" 등이 걸러지지 않는다."}, {"id": 43, "sec": "3.3", "diff": "심화", "q": "\"I am learning Python. It is one of the most popular languages\"에서 NLTK 기본 불용어를 제거한 결과로 옳은 것은?", "opts": ["I learning Python . It one popular languages", "learning Python . one popular languages", "learning Python . popular languages", "Python languages"], "a": 1, "exp": "\"am\", \"is\", \"of\", \"the\", \"most\" 등이 제거되지만 \"one\"은 NLTK 기본 목록에 없어 그대로 남는다."}, {"id": 44, "sec": "3.3", "diff": "중급", "q": "불용어 제거가 오히려 해로운 경우로 옳지 않은 것은?", "opts": ["질의응답·검색에서 \"to be or not to be\"는 모두 불용어라 문장 자체가 사라진다.", "문서 분류에서 주제어를 뽑을 때는 불용어를 남겨야 정확도가 올라간다.", "감성 분석에서 \"not\", \"no\", \"never\"를 지우면 의미가 정반대가 된다.", "구문 분석에서 기능어가 사라지면 문장 구조를 복원할 수 없다."], "a": 1, "exp": "주제어 추출은 오히려 불용어 제거가 도움이 되는 대표적인 경우다. 감성 분석·질의응답·구문 분석에서는 해로울 수 있다."}, {"id": 45, "sec": "3.3", "diff": "심화", "q": "\"this is not good\"에서 불용어를 그대로 제거했을 때 생기는 문제는?", "opts": ["문장의 길이가 늘어나 계산량이 커진다.", "\"good\"만 남아 긍정으로 오분류될 수 있다.", "\"not\"만 남아 문장이 무의미해진다.", "토큰화가 실패해 오류가 발생한다."], "a": 1, "exp": "부정어 \"not\"이 기본 불용어 목록에 있어 제거되면 \"good\"만 남아 의미가 정반대로 뒤집힌다."}, {"id": 46, "sec": "3.3", "diff": "중급", "q": "사전학습 모델(BERT 등)에서 불용어 처리에 대한 일반적인 관행은?", "opts": ["전통적 방식보다 더 공격적으로 불용어를 제거한다.", "문맥 정보를 스스로 학습하므로 불용어를 제거하지 않는 것이 일반적이다.", "불용어만 남기고 나머지를 제거한다.", "불용어를 [UNK]로 치환해 사용한다."], "a": 1, "exp": "BERT 등 사전학습 모델은 문맥 정보를 스스로 학습하므로 불용어를 제거하지 않는 것이 일반적이다."}, {"id": 47, "sec": "3.3", "diff": "중급", "q": "불용어 처리에 대한 실무 권장 사항으로 옳은 것은?", "opts": ["기본 리스트를 절대 수정하지 않고 그대로 사용한다.", "기본 리스트를 그대로 쓰지 말고 도메인에 맞게 추가·제외 목록을 관리한다.", "불용어 목록은 학습 데이터에서 자동으로만 생성해야 한다.", "불용어는 모든 과제에서 반드시 제거한다."], "a": 1, "exp": "예를 들어 감성 분석에서는 {\"not\",\"no\",\"nor\"}를 목록에서 빼고, 도메인 불용어 {\"said\",\"would\",\"also\"}는 추가하는 식으로 관리한다."}, {"id": 48, "sec": "3.3", "diff": "심화", "q": "한국어 불용어 제거에서 품사 기준 필터링을 권장하는 이유와 방법으로 옳은 것은?", "opts": ["품사 기준 필터링은 세종 태그셋에서만 가능하고 Okt에서는 불가능하다.", "조사와 어미를 남기고 명사만 제거하는 것이 표준이다.", "리스트 방식이 항상 품사 방식보다 정확하다.", "리스트보다 품사로 거르는 편이 유지보수에 유리하며, 세종 태그셋에서는 조사(J*)·어미(E*)·기호(S*)를 접두어로 걸러낸다."], "a": 3, "exp": "세종 태그셋(Mecab-ko·Komoran)은 J*·E*·S* 접두어로 거르고, Okt는 자체 태그셋이므로 남길 품사(Noun·Verb·Adjective)를 지정한다."}, {"id": 49, "sec": "3.4", "diff": "기초", "q": "텍스트 정규화(text normalization)의 정의로 옳은 것은?", "opts": ["문장을 토큰으로 나누는 과정", "텍스트에서 불용어를 제거하는 과정", "다르게 표기되지만 의미적으로 동일한 표현을 하나의 표준 형식으로 바꾸는 과정", "각 토큰에 품사를 부여하는 과정"], "a": 2, "exp": "뭄바이와 봄베이, US와 United States, does와 doing의 기본형 do처럼 동일한 의미의 다른 표기를 표준형으로 모으는 과정이다."}, {"id": 50, "sec": "3.4", "diff": "중급", "q": "대소문자 통일(case folding)의 장점과 주의점으로 옳은 것은?", "opts": ["어휘 크기가 커지지만 고유명사를 정확히 보존할 수 있다.", "대소문자를 통일하면 의미 손실이 전혀 없다.", "\"Apple\", \"APPLE\", \"apple\"을 하나로 모아 어휘 크기를 줄이지만, \"US(미국)\"와 \"us(우리)\"가 구분되지 않는다.", "한국어에서 특히 중요한 정규화 기법이다."], "a": 2, "exp": "case folding은 어휘 크기를 줄이지만 \"US(미국)\"와 \"us(우리)\", \"Apple(회사)\"과 \"apple(과일)\"의 구분을 잃는다."}, {"id": 51, "sec": "3.4", "diff": "심화", "q": "한글의 유니코드 정규화(NFC/NFD)에 대한 설명으로 옳은 것은?", "opts": ["NFC와 NFD로 저장된 문자열은 항상 == 비교에서 같다고 판정된다.", "한글은 완성형(NFC)과 조합형(NFD) 두 가지로 저장될 수 있어 겉보기에 같아도 다른 문자열이 된다.", "NFD로 저장하면 문자열 길이가 항상 더 짧아진다.", "유니코드 정규화는 영어 텍스트에서만 필요하다."], "a": 1, "exp": "\"한글\"을 NFC와 NFD로 각각 저장하면 a == b가 False이고 길이도 2와 6으로 달라진다."}, {"id": 52, "sec": "3.4", "diff": "중급", "q": "정규표현식 r\"(.)\\1{2,}\"를 r\"\\1\\1\"로 치환하는 규칙의 목적은?", "opts": ["HTML 태그를 제거하는 것", "\"ㅋㅋㅋㅋ\"처럼 3회 이상 반복된 문자를 2회로 줄이는 것", "연속된 공백을 하나로 합치는 것", "URL을 제거하는 것"], "a": 1, "exp": "(.)\\1{2,}는 같은 문자가 3회 이상 반복된 패턴을 잡아 두 번으로 줄인다 (\"ㅋㅋㅋㅋ\" → \"ㅋㅋ\")."}, {"id": 53, "sec": "3.4", "diff": "심화", "q": "정규표현식 정제 규칙을 적용할 때 순서를 고려해야 하는 이유로 옳은 것은?", "opts": ["특수문자를 먼저 지우면 URL 패턴이 깨져 URL 제거 규칙이 동작하지 않기 때문", "규칙의 순서는 결과에 영향을 주지 않지만 속도만 달라지기 때문", "정규표현식은 한 번에 하나만 적용할 수 있기 때문", "순서를 바꾸면 오류가 발생해 프로그램이 멈추기 때문"], "a": 0, "exp": "HTML 태그 → URL → 이메일 → 특수문자 → 반복 문자 → 연속 공백 순으로 적용해야 하며, 특수문자를 먼저 지우면 URL 패턴이 깨진다."}, {"id": 54, "sec": "3.4", "diff": "중급", "q": "강의자료의 clean() 함수에서 특수문자·이모지를 제거하는 규칙에 대한 주의사항으로 옳은 것은?", "opts": ["특수문자 제거는 항상 가장 먼저 수행해야 한다.", "호환 자모만 보존되므로 NFD 조합형 자모는 삭제된다 — 따라서 NFC 정규화를 먼저 해야 한다.", "특수문자 제거는 유니코드 정규화와 아무 관련이 없다.", "NFD 정규화를 먼저 해야 자모가 보존된다."], "a": 1, "exp": "[^가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9\\s.,!?] 패턴은 호환 자모만 보존하므로 NFD 조합형 자모는 지워진다. 따라서 NFC 정규화를 먼저 수행해야 한다."}, {"id": 55, "sec": "3.4", "diff": "중급", "q": "규칙 기반 치환(replace)의 장단점으로 옳은 것은?", "opts": ["동작이 예측 가능하고 도메인 지식을 반영할 수 있지만, 규칙이 늘면 관리가 어렵고 부분 문자열 오치환 위험이 있다.", "동작을 예측할 수 없지만 항상 정확한 결과를 준다.", "규칙이 많아질수록 관리가 쉬워지고 오치환 위험도 사라진다.", "도메인 지식을 전혀 반영할 수 없다는 것이 단점이다."], "a": 0, "exp": "규칙 기반은 예측 가능하고 도메인 지식을 반영할 수 있으나, 규칙 수가 늘면 관리가 어렵고 부분 문자열 오치환 위험이 있다."}, {"id": 56, "sec": "3.4", "diff": "심화", "q": "\"BUS\".replace(\"US\", \"United States\")의 결과로 옳은 것은?", "opts": ["\"BUS\" — 단어 경계를 인식해 치환되지 않음", "오류가 발생해 실행되지 않음", "\"BUnited States\" — 부분 문자열 오치환의 대표적 예", "\"United States\" — 전체가 치환됨"], "a": 2, "exp": "replace는 단어 경계를 보지 않고 부분 문자열을 그대로 치환하므로 \"BUS\"가 \"BUnited States\"가 되는 오치환이 발생한다."}, {"id": 57, "sec": "3.5", "diff": "기초", "q": "철자 수정(spelling correction)이 필요한 이유로 옳은 것은?", "opts": ["오타가 있으면 문장을 화면에 출력할 수 없기 때문", "오타가 있으면 품사 태깅 결과가 항상 같아지기 때문", "오타가 있으면 같은 단어가 서로 다른 토큰으로 취급되어 어휘가 불필요하게 커지기 때문", "오타가 있으면 토큰화 자체가 실패하기 때문"], "a": 2, "exp": "오타는 같은 단어를 서로 다른 토큰으로 만들어 어휘를 불필요하게 키우며, 사전에 있는 단어 중 가장 가까운 단어로 바꿔 주는 것이 기본 원리다."}, {"id": 58, "sec": "3.5", "diff": "중급", "q": "autocorrect의 Speller로 \"Ntural Luanguage teh Processin deals with insights\"를 교정한 결과에 대한 설명으로 옳은 것은?", "opts": ["교정이 전혀 이루어지지 않는다.", "모든 오타가 완벽하게 수정된다.", "문장 전체가 하나의 토큰으로 합쳐진다.", "대부분의 오타는 수정되지만 \"teh\"는 완전히 복원되지 않는다."], "a": 3, "exp": "\"Natural Language teh Processing deals with insights\"가 되어 대부분 수정되지만 \"teh\"는 복원되지 않았다."}, {"id": 59, "sec": "3.5", "diff": "심화", "q": "편집 거리 기반 철자 수정의 한계로 옳지 않은 것은?", "opts": ["문맥을 무시하므로 \"I eight an apple\"의 \"eight\"는 철자상 정답이라 교정되지 않는다.", "사전에 없는 단어는 아예 인식하지 못해 프로그램이 중단된다.", "사람 이름·브랜드명·신조어를 오타로 판단해 잘못 고칠 수 있다.", "사전 전체와 거리를 계산하므로 대용량 문서에서는 속도 부담이 크다."], "a": 1, "exp": "문맥 무시, 고유명사 오인, 속도가 한계로 제시되었다. 사전에 없다고 프로그램이 중단되지는 않는다."}, {"id": 60, "sec": "3.5", "diff": "중급", "q": "철자 수정의 대안으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["SymSpell — 삭제 기반 인덱싱으로 수천 배 빠른 근사 검색", "도메인 사전 등록 — 고유명사와 전문 용어를 미리 추가", "문맥 인식 교정 — 언어 모델(BERT 등)로 앞뒤 문맥까지 고려", "불용어 목록을 확장해 오타를 함께 제거하는 방법"], "a": 3, "exp": "대안으로 SymSpell, 문맥 인식 교정, 도메인 사전 등록이 제시되었다."}, {"id": 61, "sec": "3.5", "diff": "중급", "q": "철자 수정을 적용할 때의 실무 판단으로 옳은 것은?", "opts": ["철자 수정은 토큰화보다 먼저 수행해야만 한다.", "모든 종류의 텍스트에서 반드시 적용해야 한다.", "SNS·리뷰 데이터에서는 효과가 크지만, 정제된 문서에서는 생략해도 무방하다.", "정제된 문서일수록 효과가 크므로 반드시 적용해야 한다."], "a": 2, "exp": "오타가 많은 SNS·리뷰 데이터에서는 효과가 크지만, 이미 정제된 문서에서는 생략해도 무방하다."}, {"id": 62, "sec": "3.6", "diff": "기초", "q": "어간 추출(stemming)의 동작 방식으로 옳은 것은?", "opts": ["사전(WordNet)을 참조해 실제 기본형을 찾으므로 느리지만 정확하다.", "사전을 참조하지 않고 정해진 규칙으로 접미사를 잘라내므로 매우 빠르지만 결과가 실제 단어가 아닐 수 있다.", "단어의 품사를 먼저 판별한 뒤 기본형을 찾는다.", "단어를 문자 단위로 분해해 빈도가 높은 조각을 병합한다."], "a": 1, "exp": "어간 추출은 규칙으로 접미사를 잘라내는 방식이라 빠르지만 \"battling → battl\"처럼 사전에 없는 형태가 나올 수 있다."}, {"id": 63, "sec": "3.6", "diff": "심화", "q": "어간 추출이 굴절형과 파생형을 다루는 방식으로 옳은 것은?", "opts": ["products(굴절형)와 production(파생형)을 구분하지 않고 잘라내므로 모두 product가 된다.", "두 형태를 각각 다른 기본형으로 구분해 준다.", "파생형만 처리하고 굴절형은 원형 그대로 남긴다.", "굴절형만 처리하고 파생형은 원형 그대로 남긴다."], "a": 0, "exp": "어간 추출은 굴절형과 파생형을 구분하지 않고 접미사를 잘라내며, 이것이 표제어 추출과의 결정적 차이다."}, {"id": 64, "sec": "3.6", "diff": "중급", "q": "Porter Stemmer의 구조에 대한 설명으로 옳은 것은?", "opts": ["2단계에 걸쳐 사전을 조회한다.", "5단계에 걸쳐 접미사를 순차적으로 제거한다.", "품사 태깅 결과를 입력으로 받아 단계를 결정한다.", "단계 구분 없이 한 번에 모든 접미사를 제거한다."], "a": 1, "exp": "Porter Stemmer는 1a·1b·2·3·4·5의 5단계에 걸쳐 접미사를 순차적으로 제거한다."}, {"id": 65, "sec": "3.6", "diff": "심화", "q": "Porter 알고리즘의 규칙과 예시의 연결로 옳지 않은 것은?", "opts": ["2단계 : ATIONAL → ATE (relational → relate)", "5단계 : ICAL → IC (electrical → electric)", "1a단계 : SSES → SS (caresses → caress), IES → I (ponies → poni)", "3단계 : FUL·NESS 제거 (hopeful → hope, goodness → good)"], "a": 1, "exp": "ICAL → IC는 3단계 규칙이다. 5단계는 남은 E를 제거하는 단계로 rate → rat이 되지 않도록 조건을 포함한다."}, {"id": 66, "sec": "3.6", "diff": "중급", "q": "어간 추출기별 \"generously\"의 처리 결과로 옳은 것은?", "opts": ["PorterStemmer → gener, LancasterStemmer → gen, SnowballStemmer → generous", "PorterStemmer → generous, LancasterStemmer → gener, SnowballStemmer → gen", "세 어간 추출기 모두 generously를 그대로 둔다.", "세 어간 추출기 모두 generous로 동일하게 처리한다."], "a": 0, "exp": "Lancaster가 가장 공격적이라 결과가 가장 짧고, Snowball(Porter2)은 Porter의 과도 축약을 보완한다."}, {"id": 67, "sec": "3.6", "diff": "중급", "q": "어간 추출에서 과도한 축약(over-stemming)이 일으키는 문제는?", "opts": ["사전 조회 횟수가 늘어난다.", "같은 단어가 여러 형태로 흩어져 어휘가 커진다.", "처리 속도가 크게 느려진다.", "서로 다른 단어가 하나로 합쳐져 의미가 훼손된다."], "a": 3, "exp": "과도한 축약은 서로 다른 단어를 하나로 합쳐(over-stemming) 의미를 훼손한다. SnowballStemmer는 한국어를 지원하지 않는다."}, {"id": 68, "sec": "3.6", "diff": "중급", "q": "PorterStemmer로 \"battling\"을 처리한 결과와 그 의미로 옳은 것은?", "opts": ["battle — 사전에 있는 올바른 기본형이 나온다.", "battling — 변화 없이 그대로 유지된다.", "fight — 의미가 같은 다른 단어로 바뀐다.", "battl — 사전에 없는 형태가 생기는 어간 추출의 한계를 보여 준다."], "a": 3, "exp": "규칙만 적용하므로 \"battling → battl\", \"was → wa\" 같은 비단어가 생기며, 이 한계를 보완한 것이 표제어 추출이다."}, {"id": 69, "sec": "3.7", "diff": "기초", "q": "표제어 추출(lemmatization)에 대한 설명으로 옳은 것은?", "opts": ["사전을 참조하지 않고 빈도만으로 기본형을 정한다.", "규칙으로 접미사를 잘라내므로 빠르지만 비단어가 생길 수 있다.", "품사 정보를 사용할 수 없어 어간 추출보다 부정확하다.", "사전(WordNet)을 참조하고 품사 정보를 함께 사용해 실제 기본형을 찾으므로 정확하지만 속도가 느리다."], "a": 3, "exp": "표제어 추출은 WordNet 사전과 품사 정보를 이용해 언어학적으로 타당한 기본형을 찾지만, 사전 조회로 인해 어간 추출보다 느리다."}, {"id": 70, "sec": "3.7", "diff": "기초", "q": "표제어(lemma)의 정의로 옳은 것은?", "opts": ["품사 태그가 부여된 토큰", "사전에 표제 항목으로 올라 있는 형태 (was, is, are → be)", "규칙으로 접미사를 제거하고 남은 문자열", "문서에서 가장 자주 등장하는 단어"], "a": 1, "exp": "표제어는 사전에 표제 항목으로 실린 형태로, 언어학적으로 타당한 기본형이라 사람이 읽어도 자연스럽다."}, {"id": 71, "sec": "3.7", "diff": "심화", "q": "어간 추출과 표제어 추출의 결과 비교로 옳은 것은?", "opts": ["\"was\"는 두 방식 모두 be가 된다.", "\"better\"는 어간 추출로 good, 표제어 추출로 better가 된다.", "\"better\"는 어간 추출로 better, 표제어 추출로 good이 되고, \"was\"는 각각 wa와 be가 된다.", "\"studies\"와 \"studying\"은 두 방식 모두 서로 다른 결과가 된다."], "a": 2, "exp": "studies·studying은 어간 추출로 studi, 표제어 추출로 study가 되며, better → better/good, battling → battl/battle, was → wa/be가 된다."}, {"id": 72, "sec": "3.7", "diff": "중급", "q": "WordNetLemmatizer에서 lemmatize(\"was\")가 \"wa\"가 되는 이유는?", "opts": ["표제어 추출이 어간 추출과 동일하게 동작하기 때문", "WordNet 사전에 \"was\"가 없기 때문", "입력이 소문자가 아니기 때문", "품사를 지정하지 않으면 명사로 간주하기 때문"], "a": 3, "exp": "품사를 지정하지 않으면 명사로 간주해 잘못 판단하며, lemmatize(\"was\", pos=\"v\")로 지정하면 \"be\"가 나온다."}, {"id": 73, "sec": "3.7", "diff": "중급", "q": "실무에서 표제어 추출의 정확도를 높이는 정석적인 방법은?", "opts": ["표제어 추출 전에 어간 추출을 먼저 적용한다.", "pos_tag() 결과를 WordNet 품사로 변환해 lemmatize에 함께 전달한다.", "사전을 참조하지 않고 규칙만 사용한다.", "모든 단어를 동사(pos=\"v\")로 지정해 처리한다."], "a": 1, "exp": "pos_tag() 결과를 WordNet 품사(ADJ/VERB/ADV/NOUN)로 변환해 함께 전달하는 것이 정석이다."}, {"id": 74, "sec": "3.8", "diff": "기초", "q": "개체명(named entity)에 대한 설명으로 옳은 것은?", "opts": ["문법적 기능만 하는 조사와 어미를 말한다.", "사람·기관·장소·날짜처럼 고유한 대상을 가리키는 표현으로, 일반적으로 사전에 없어 별도 처리가 필요하다.", "문서에서 가장 자주 등장하는 일반 명사를 말한다.", "철자 오류가 있는 단어를 말한다."], "a": 1, "exp": "개체명은 고유한 대상을 가리키는 표현으로 사전에 없는 경우가 많으며, NER의 목표는 이를 식별해 미리 정의한 범주에 매핑하는 것이다."}, {"id": 75, "sec": "3.8", "diff": "중급", "q": "BIO 태깅 체계에 대한 설명으로 옳은 것은?", "opts": ["O는 개체의 시작 토큰을 나타낸다.", "B-XXX는 개체의 내부 토큰, I-XXX는 개체의 시작 토큰을 나타낸다.", "BIO 태깅은 하나의 토큰으로 이루어진 개체만 표현할 수 있다.", "B-XXX는 개체의 시작 토큰, I-XXX는 개체의 내부 토큰, O는 개체가 아님을 나타낸다."], "a": 3, "exp": "BIO는 여러 토큰에 걸친 개체를 표현하는 표준 방식으로, New/B-LOC York/I-LOC City/I-LOC is/O big/O처럼 태깅한다."}, {"id": 76, "sec": "3.8", "diff": "심화", "q": "\"New York City is big\"의 올바른 BIO 태깅으로 옳은 것은?", "opts": ["New/B-LOC York/B-LOC City/B-LOC is/O big/O", "New/O York/O City/O is/O big/O", "New/I-LOC York/I-LOC City/I-LOC is/B-LOC big/O", "New/B-LOC York/I-LOC City/I-LOC is/O big/O"], "a": 3, "exp": "개체의 첫 토큰만 B-, 이어지는 토큰은 I-를 붙이고, 개체가 아닌 토큰은 O로 표시한다."}, {"id": 77, "sec": "3.8", "diff": "중급", "q": "대표 개체 범주의 연결로 옳지 않은 것은?", "opts": ["PRODUCT — 비율", "LOC / GPE — 지명·행정구역", "ORG — 기관·회사", "PERSON — 인명"], "a": 0, "exp": "비율은 PERCENT다. PRODUCT는 제품명이며, 이 밖에 DATE(날짜), TIME(시각), MONEY(금액)가 있다."}, {"id": 78, "sec": "3.8", "diff": "중급", "q": "개체명 인식의 활용 분야로 강의자료가 제시하지 않은 것은?", "opts": ["지식 그래프 구축", "문장 경계 인식", "정보 추출과 검색 질의 이해", "개인정보 비식별화"], "a": 1, "exp": "NER은 정보 추출, 검색 질의 이해, 문서 자동 분류, 개인정보 비식별화, 지식 그래프 구축에 활용된다."}, {"id": 79, "sec": "3.9", "diff": "기초", "q": "단어 중의성 해결(WSD)이 다루는 문제로 옳은 것은?", "opts": ["문서를 문장 단위로 나누는 문제", "오타가 있는 단어를 올바른 철자로 고치는 문제", "고유명사를 찾아 범주에 매핑하는 문제", "철자가 같은 두 개 이상의 단어가 상황에 따라 서로 다른 의미를 갖는 문제"], "a": 3, "exp": "\"사귀는 친구를 보면 그 사람을 알 수 있다\"처럼 단어의 의미도 함께 쓰인 다른 단어(문맥)에 따라 달라진다."}, {"id": 80, "sec": "3.9", "diff": "중급", "q": "Lesk 알고리즘의 기본 아이디어로 옳은 것은?", "opts": ["사전에 실린 각 의미의 정의문(gloss)과 문맥 단어의 겹침을 세어, 가장 많이 겹치는 의미를 선택한다.", "단어의 품사만 보고 의미를 결정한다.", "단어의 출현 빈도가 가장 높은 의미를 항상 선택한다.", "신경망으로 문맥 임베딩을 학습해 의미를 분류한다."], "a": 0, "exp": "Lesk는 각 의미의 정의문과 문맥 단어의 겹침(overlap)을 세어 가장 많이 겹치는 의미를 정답으로 고른다."}, {"id": 81, "sec": "3.9", "diff": "심화", "q": "\"I went to the bank to deposit money\"에 lesk()를 적용했을 때 금융기관 의미를 놓치는 이유는?", "opts": ["WordNet에 금융기관 의미가 등재되어 있지 않기 때문", "입력 문장에 \"bank\"라는 단어가 없기 때문", "품사를 명시하지 않으면 lesk()가 동작하지 않기 때문", "단순 Lesk는 정의문 단어의 겹침만 세기 때문에 생기는 알고리즘의 한계"], "a": 3, "exp": "단순 Lesk는 정의문 단어의 겹침만 세므로 문맥의 의미를 제대로 반영하지 못해 엉뚱한 의미를 고를 수 있다."}, {"id": 82, "sec": "3.10", "diff": "기초", "q": "문장 경계 인식(Sentence Boundary Detection)이 중요한 이유로 옳은 것은?", "opts": ["문장 경계가 어휘 사전의 크기를 결정하기 때문", "문장 경계를 알아야 품사 태그를 정할 수 있기 때문", "요약·번역·질의응답이 모두 문장 단위 입력을 전제로 하기 때문", "문장 경계를 알아야 철자 오류를 찾을 수 있기 때문"], "a": 2, "exp": "문서를 문장 단위로 정확히 나누는 작업으로, 요약·번역·질의응답이 모두 문장 단위 입력을 전제하므로 매우 중요하다."}, {"id": 83, "sec": "3.10", "diff": "심화", "q": "\"Dr. Kim joined A.I. Lab in 2020. The price is $3.14. Visit www.ex.com now!\"에 sent_tokenize를 적용한 결과에 대한 설명으로 옳은 것은?", "opts": ["$3.14와 www.ex.com은 올바로 유지되지만, 미등록 약어 A.I.가 경계로 오인되어 4문장이 된다.", "$3.14와 www.ex.com에서도 모두 잘못 잘려 6문장이 된다.", "약어가 포함된 문장은 아예 출력되지 않는다.", "3문장으로 정확히 나뉜다."], "a": 0, "exp": "PunktSentenceTokenizer는 학습된 약어 사전으로 경계를 판단하므로, 사전에 없는 약어 A.I.에서 오분리가 일어난다."}, {"id": 84, "sec": "3.10", "diff": "중급", "q": "한국어 문장 경계 인식에 대한 설명으로 옳은 것은?", "opts": ["한국어는 마침표만 보면 되므로 영어용 도구를 그대로 써도 된다.", "한국어는 종결어미(-다, -요, -까)를 활용하므로 Kiwi의 split_into_sents()가 유리하다.", "한국어 문장 경계는 띄어쓰기만으로 판단할 수 있다.", "한국어에는 문장 경계 개념이 없다."], "a": 1, "exp": "한국어는 종결어미를 활용하므로, 이를 반영하는 Kiwi의 split_into_sents()가 영어용 punkt보다 유리하다."}, {"id": 85, "sec": "3.11", "diff": "중급", "q": "강의자료가 제시한 전처리의 권장 순서로 옳은 것은?", "opts": ["불용어 제거 → 표제어 추출 → POS 태깅 → 정제", "표제어 추출 → 정제 → 토큰화 → POS 태깅", "토큰화 → 불용어 제거 → 정제 → 표제어 추출", "정제·정규화 → 토큰화 → POS 태깅 → 표제어 추출"], "a": 3, "exp": "권장 순서로는 \"was\" → be(정확)를 얻지만, 잘못된 순서(불용어 제거 → 표제어 추출 → POS 태깅 → 정제)로는 \"was\" → wa(부정확)가 된다."}, {"id": 86, "sec": "3.11", "diff": "중급", "q": "표제어 추출을 POS 태깅 뒤에 수행해야 하는 이유는?", "opts": ["POS 태깅이 표제어를 입력으로 받기 때문", "표제어 추출이 품사 정보를 필요로 하기 때문", "표제어 추출이 토큰화보다 먼저 실행되어야 하기 때문", "순서와 무관하지만 관행상 그렇게 하기 때문"], "a": 1, "exp": "표제어 추출은 품사 정보를 사용해야 정확하므로 POS 태깅 뒤에 수행해야 한다."}, {"id": 87, "sec": "3.11", "diff": "심화", "q": "전처리 순서 설계의 핵심 원칙으로 옳지 않은 것은?", "opts": ["소문자 변환을 먼저 하면 개체명 인식(NER) 성능이 크게 향상된다.", "정답은 없으며 과제와 후속 모델에 따라 순서·포함 여부를 설계해야 한다.", "표제어 추출은 품사 정보를 필요로 하므로 POS 태깅 뒤에 수행한다.", "불용어를 먼저 지우면 문맥이 사라져 POS 태깅·구문 분석이 부정확해진다."], "a": 0, "exp": "소문자 변환을 먼저 하면 대문자 단서가 사라져 개체명 인식(NER) 성능이 크게 떨어진다."}, {"id": 88, "sec": "3.11", "diff": "심화", "q": "통합 파이프라인 preprocess() 함수의 단계 순서로 옳은 것은?", "opts": ["소문자 변환 → 표제어 추출 → 토큰화 → 정제 → 품사 태깅 → 불용어 제거", "유니코드 정규화 → 정제(clean) → 소문자 변환 → 토큰화 → 품사 태깅 → 불용어 제거 → 표제어 추출", "정제 → 토큰화 → 표제어 추출 → 품사 태깅 → 불용어 제거 → 유니코드 정규화", "토큰화 → 유니코드 정규화 → 품사 태깅 → 정제 → 소문자 변환 → 표제어 추출 → 불용어 제거"], "a": 1, "exp": "⓪ unicodedata.normalize(\"NFC\") → ① clean() → ② lower() → ③ word_tokenize() → ④ pos_tag() → ⑤ 불용어 제거 → ⑥ lemmatize() 순이다."}, {"id": 89, "sec": "3.11", "diff": "심화", "q": "preprocess(\"The children were studying NLP books!\")의 결과로 옳은 것은?", "opts": ["['child', 'study', 'nlp', 'book']", "['child', 'be', 'study', 'nlp', 'book', '!']", "['the', 'children', 'were', 'studying', 'nlp', 'books']", "['children', 'studying', 'books']"], "a": 0, "exp": "정제·소문자 변환 후 불용어(the, were)와 비알파벳(!)이 제거되고, 품사 정보를 이용한 표제어 추출로 children→child, studying→study, books→book이 된다."}, {"id": 90, "sec": "3.12", "diff": "중급", "q": "전통적 파이프라인과 사전학습 모델(BERT·GPT) 시대 전처리의 비교로 옳은 것은?", "opts": ["사전학습 시대에는 소문자 변환이 필수가 되었다.", "전통적으로는 단어 단위 토큰화·불용어 제거·어간/표제어 추출이 필수였지만, 사전학습 시대에는 서브워드 토큰화를 쓰고 불용어를 유지하며 원형 복원이 불필요하다.", "사전학습 시대에는 불용어 제거가 더 엄격하게 요구된다.", "사전학습 시대에는 단어 단위 토큰화가 표준이 되었다."], "a": 1, "exp": "사전학습 시대에는 서브워드 토큰화(BPE 등), 불용어 유지(문맥 정보), 원형 복원 불필요, 대소문자 보존(cased 모델), 모델이 표현을 학습, 문맥 임베딩 표현이 특징이다."}, {"id": 91, "sec": "3.12", "diff": "중급", "q": "전통적 파이프라인의 텍스트 표현 방식으로 옳은 것은?", "opts": ["문맥 임베딩 표현과 모델이 학습한 표현", "서브워드 토큰 임베딩만 사용", "BoW · TF-IDF 표현과 수작업 피처 설계", "원-핫 표현만 사용하며 피처 설계는 하지 않음"], "a": 2, "exp": "전통적 파이프라인은 수작업 피처 설계와 BoW·TF-IDF 표현을, 사전학습 시대는 모델이 학습한 문맥 임베딩 표현을 사용한다."}, {"id": 92, "sec": "3.12", "diff": "심화", "q": "사전학습 모델 시대에도 전처리가 여전히 중요한 이유로 옳은 것은?", "opts": ["사전학습 모델이 토큰화를 수행하지 못하기 때문", "노이즈 제거·인코딩 정규화·중복 제거·도메인 정제는 어떤 모델에도 반드시 필요하기 때문", "사전학습 모델이 불용어를 처리하지 못하기 때문", "사전학습 모델이 대소문자를 구분하지 못하기 때문"], "a": 1, "exp": "관행은 달라졌지만 노이즈 제거, 인코딩 정규화, 중복 제거, 도메인 정제는 어떤 모델에도 반드시 필요하다."}, {"id": 93, "sec": "3.13", "diff": "기초", "q": "NLP 프로젝트의 6단계를 순서대로 나열한 것은?", "opts": ["데이터 전처리 → 데이터 수집 → 모델 개발 → 피처 추출 → 모델 배포 → 모델 평가", "데이터 수집 → 피처 추출 → 데이터 전처리 → 모델 개발 → 모델 배포 → 모델 평가", "피처 추출 → 데이터 수집 → 데이터 전처리 → 모델 평가 → 모델 const KEY = "nlp_week3_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
