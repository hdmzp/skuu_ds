>에서 '기계학습적 시점'이 다루는 핵심 지표로 제시된 것은?","o":["보안","정확도","공평성","운용·보수성"],"a":1,"e":"기계학습적 시점은 괄호로 '(정확도)'가 명시되어 있으며, 보안·운용보수성은 시스템적 시점, 공평성은 사회적 시점에 해당한다."},{"w":7,"id":68,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.2>의 '시스템적 시점'에 포함된 항목들로 옳은 것은?","o":["공평성, 책임성, 투명성","정확도, 재현율, 정밀도","가용성, 운용·보수성, 성능·확장성, 보안","해석 가능성, 설명 책임, 윤리성"],"a":2,"e":"시스템적 시점에는 가용성, 운용·보수성, 성능·확장성, 보안이 열거되어 있다."},{"w":7,"id":69,"sec":"7.6","d":"초급","x":"강의자료의 그림 필요","q":"<그림 1.2>에서 '사회적 시점'으로 제시된 세 가지 요소는?","o":["공평성, 책임성, 투명성","가용성, 보안, 확장성","정확도, 속도, 비용","재현성, 이식성, 확장성"],"a":0,"e":"사회적 시점은 공평성, 책임성, 투명성으로 구성되며 강의의 별도 슬라이드에서도 이 세 가지를 다룬다."},{"w":7,"id":70,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.3> '불공평한 예측 결과를 초래하는 바이어스의 예'에서 바이어스가 개입하는 흐름으로 옳은 것은?","o":["학습 바이어스 → 샘플링 바이어스 → 가공 바이어스 → 공평한 예측","역사적·샘플링 바이어스 → 학습 데이터의 가공 바이어스 → AI의 학습 바이어스 → 불공평한 예측","가공 바이어스 → 역사적 바이어스 → 샘플링 바이어스 → 불공평한 예측","샘플링 바이어스만이 유일하게 불공평한 예측을 초래한다"],"a":1,"e":"실제 데이터 단계의 역사적·샘플링 바이어스가 학습 데이터의 가공 바이어스로, 다시 AI의 학습 바이어스로 이어져 최종적으로 불공평한 예측을 낳는다."},{"w":7,"id":71,"sec":"7.6","d":"초급","x":null,"q":"AI의 '책임성'과 '투명성'에 각각 대응하는 영어 표현을 바르게 짝지은 것은?","o":["책임성 - Transparency, 투명성 - Accountability","책임성 - Reliability, 투명성 - Fairness","책임성 - Fairness, 투명성 - Accountability","책임성 - Accountability, 투명성 - Transparency"],"a":3,"e":"강의자료는 'AI의 책임성 (Accountability)', 'AI의 투명성 (Transparency)'으로 표기하고 있다."},{"w":7,"id":72,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.4>가 나타내는 트레이드오프의 두 축은 무엇인가?","o":["학습 속도와 예측 속도","알고리즘 설명 가능성과 대응 가능한 문제의 복잡성","데이터 양과 파라미터 수","훈련 오차와 검증 오차"],"a":1,"e":"<그림 1.4>는 가로축을 '알고리즘 설명 가능성', 세로축을 '대응 가능한 문제의 복잡성'으로 두고 둘 사이의 트레이드오프를 보여준다."},{"w":7,"id":73,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.4>에서 알고리즘 설명 가능성이 가장 높은 쪽에 위치한 것은?","o":["딥러닝","부스팅 모델","의사결정 나무","규칙 기반"],"a":3,"e":"곡선의 오른쪽 끝(설명 가능성 최고, 복잡성 대응 최저)에는 규칙 기반이 위치한다."},{"w":7,"id":74,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.4>에서 대응 가능한 문제의 복잡성이 가장 높은 것은?","o":["딥러닝","선형/로지스틱 회귀","의사결정 나무","규칙 기반"],"a":0,"e":"딥러닝이 가장 복잡한 문제에 대응할 수 있지만 그만큼 알고리즘 설명 가능성은 가장 낮다."},{"w":7,"id":75,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.4>의 알고리즘들을 설명 가능성이 낮은 것부터 높은 순서로 바르게 나열한 것은?","o":["규칙 기반 → 선형/로지스틱 회귀 → 의사결정 나무 → 부스팅 모델 → 딥러닝","딥러닝 → 부스팅 모델 → 의사결정 나무 → 선형/로지스틱 회귀 → 규칙 기반","의사결정 나무 → 딥러닝 → 규칙 기반 → 부스팅 모델 → 선형/로지스틱 회귀","선형/로지스틱 회귀 → 규칙 기반 → 딥러닝 → 의사결정 나무 → 부스팅 모델"],"a":1,"e":"곡선을 따라 딥러닝, 부스팅 모델, 의사결정 나무, 선형/로지스틱 회귀, 규칙 기반 순으로 설명 가능성이 높아지고 대응 가능한 문제의 복잡성은 낮아진다."},{"w":7,"id":76,"sec":"7.6","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 '설명 가능성이 높은 알고리즘'으로 함께 제시한 두 가지는?","o":["의사결정트리와 로지스틱 회귀","XGBoost와 MLP","딥러닝과 부스팅 모델","랜덤 포레스트와 SVM"],"a":0,"e":"설명 가능성이 높은 알고리즘으로 의사결정트리와 로지스틱 회귀가, 낮은 알고리즘으로 XGBoost와 MLP가 제시된다."},{"w":7,"id":77,"sec":"7.6","d":"중급","x":"강의자료 내용 필요","q":"강의자료가 알고리즘의 설명 가능성을 살펴볼 때 공통적으로 사용한 두 가지 관점은?","o":["학습 속도와 메모리 사용량","1. 예측에서 중요한 항목, 2. 각 입력에 대한 예측 근거","1. 데이터 수집 비용, 2. 라벨링 난이도","1. 하이퍼파라미터 수, 2. 층의 깊이"],"a":1,"e":"의사결정트리, 로지스틱 회귀, XGBoost 모두 '예측에서 중요한 항목'과 '각 입력에 대한 예측 근거'라는 두 관점으로 설명 가능성을 검토한다."},{"w":7,"id":78,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.5> 의사결정 트리의 사례에서 최상위(루트) 분기 조건으로 사용된 항목은?","o":["월 점포 방문 횟수 > 10회","쿠폰 사용 여부","평균 이용금액 > 30,000원","월 점포 방문 횟수 > 5회"],"a":2,"e":"루트 노드는 '평균 이용금액 > 30,000원'이며, 이후 쿠폰 사용 여부나 월 점포 방문 횟수로 가지가 갈라져 회원일 확률을 보여준다."},{"w":7,"id":79,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.6> '의사결정 트리 복잡성과 해석 복잡성의 관계'가 시사하는 바로 가장 적절한 것은?","o":["트리는 깊어질수록 각 예측의 근거 경로가 길고 복잡해져 해석이 어려워진다","트리는 깊어질수록 항상 해석이 쉬워진다","얕은 트리는 예측 근거를 전혀 제시하지 못한다","트리의 깊이는 해석 가능성과 무관하다"],"a":0,"e":"얕은 트리와 깊은 트리를 나란히 비교해, 트리 구조가 복잡해질수록 해석 복잡성도 함께 커진다는 점을 보여준다."},{"w":7,"id":80,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.7>과 함께 제시된 로지스틱 회귀의 확률 식으로 옳은 것은?","o":["P(y='yes') = a₁x₁ + a₂x₂ + ... + aₙxₙ + β","P(y='yes') = 1 / (1 + e^-(a₁x₁ + a₂x₂ + ... + aₙxₙ + β))","P(y='yes') = e^(a₁x₁ + ... + aₙxₙ)","P(y='yes') = Σ|a_i x_i| + β"],"a":1,"e":"로지스틱 회귀는 선형 결합 a₁x₁+…+aₙxₙ+β를 시그모이드 함수에 넣어 확률로 변환한다."},{"w":7,"id":81,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.7>에서 입력이 1차원이고 a=10일 때 시그모이드 함수의 입출력 관계를 바르게 설명한 것은?","o":["출력이 -1에서 1 사이를 진동한다","출력이 입력에 정비례하는 직선이다","출력이 0과 1 사이에서 S자 곡선을 그리며 완만하게 증가한다","출력이 계단처럼 0에서 1로 순간적으로만 바뀐다"],"a":2,"e":"그래프는 0에서 1 사이 값을 갖는 S자(시그모이드) 곡선을 보여주며, 이 덕분에 로지스틱 회귀의 출력을 확률로 해석할 수 있다."},{"w":7,"id":82,"sec":"7.6","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 '설명 가능성이 낮은 알고리즘'으로 다뤄진 것끼리 묶인 것은?","o":["의사결정트리와 규칙 기반","선형회귀와 로지스틱 회귀","XGBoost와 MLP","kNN과 선형회귀"],"a":2,"e":"설명 가능성이 낮은 알고리즘으로 XGBoost(부스팅 계열)와 MLP(다층 퍼셉트론)가 제시된다."},{"w":7,"id":83,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.8> '앙상블 학습 모델의 대표적 차이'에서 부스팅(Boosting)의 특징으로 옳은 것은?","o":["여러 샘플로 만든 예측을 독립적으로 만들어 한 번에 취합한다","앞선 모델의 예측 오류를 정정해 나가며 순차적으로 모델을 쌓아 최종 예측을 만든다","단일 트리만 사용하므로 해석이 매우 쉽다","학습 데이터를 사용하지 않고 규칙만으로 예측한다"],"a":1,"e":"그림에서 배깅은 여러 샘플의 예측을 병렬로 취합하는 반면, 부스팅은 예측 → 오류 정정 → 다음 모델 학습을 반복해 최종 예측을 만든다. 이런 구조 때문에 XGBoost는 설명 가능성이 낮다."},{"w":7,"id":84,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.9> 퍼셉트론의 구조에 대한 설명으로 옳은 것은?","o":["입력에 가중치를 곱해 합한 z = Σw_i x_i 를 활성화 함수 g에 통과시켜 y = g(z)를 출력한다","입력을 그대로 출력으로 내보내며 가중치가 없다","입력 간 거리를 계산해 가장 가까운 입력을 출력한다","출력값을 입력으로 되돌려 순환 구조를 만든다"],"a":0,"e":"퍼셉트론은 z = Σw_i x_i 를 구한 뒤 시그모이드·Tanh·ReLU 등의 활성화 함수 g를 적용해 y = g(z)를 출력하며, 이러한 퍼셉트론이 다층으로 쌓인 것이 MLP이다."},{"w":7,"id":85,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.10> 'MLP 해석의 어려움'에 대한 설명으로 옳은 것은?","o":["입력에 가까운 층일수록 해석이 어렵고 출력에 가까운 층일수록 쉽다","입력에 가까운 층은 구체적인 입력에 가중치를 부여해 집계하므로 알기 쉬우나, 출력에 가까운 층은 복잡하게 가중치가 부여된 입력을 받아 해석하기 힘들다","모든 층의 해석 난이도가 동일하다","층의 개수와 무관하게 MLP는 해석이 쉽다"],"a":1,"e":"입력에 가까운 층은 구체적인 입력에 가중치를 부여한 후 집계하므로 평가하여 알기 쉬운 반면, 출력에 가까운 층은 이미 복잡하게 가공된 입력을 받으므로 해석이 어렵다."},{"w":7,"id":86,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.11> 여신 심사의 업무 프로세스 순서로 옳은 것은?","o":["본심사 → 가심사 → 변제 확인 → 계약/융자","가심사 → 본심사 → 계약/융자 → 변제 확인","계약/융자 → 가심사 → 본심사 → 변제 확인","가심사 → 계약/융자 → 본심사 → 변제 확인"],"a":1,"e":"여신 심사는 가심사 → 본심사 → 계약/융자 → 변제 확인의 순서로 진행되며, 변제 확인 단계에서 심사 오류를 확인한다."},{"w":7,"id":87,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.11>에서 '본심사' 단계가 심사하는 항목으로 제시된 것은?","o":["담보 물건의 시세와 감가상각","심사 담당자의 근속 연수","신청자의 학력과 경력","지불 능력의 유무와 계속성 유무"],"a":3,"e":"본심사에서는 '지불 능력의 유무'와 '계속성 유무'를 심사한다고 표시되어 있다."},{"w":7,"id":88,"sec":"7.7","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.11>에서 신청 내용 이외에 심사에 활용되는 정보로 제시된 것은?","o":["차입 용도와 수입 정보","외부보증회사의 심사 결과와 거래 이력","신청자의 SNS 활동 기록","심사 담당자의 주관적 인상"],"a":1,"e":"차입 용도·수입 정보는 '신청 시의 정보'이고, 외부보증회사의 심사 결과와 거래 이력이 '신청 내용 이외의 정보'로 구분되어 있다."},{"w":7,"id":89,"sec":"7.7","d":"초급","x":"강의자료의 그림 필요","q":"<그림 12.1> 'AI 활용 상황의 분류'에서 사용된 두 축은 무엇인가?","o":["실수 허용 정도(조금의 실수도 허용되지 않음 ↔ 다소의 오차는 허용됨)와 자동화 정도(사람이 보정 ↔ 전자동)","데이터 양과 모델 크기","학습 시간과 추론 시간","정확도와 설명 가능성"],"a":0,"e":"세로축은 '조금의 실수도 허용되지 않음 ↔ 다소의 오차는 허용됨', 가로축은 '사람이 보정 ↔ 전자동'이며, 이에 따라 네 사분면의 난이도가 달라진다."},{"w":7,"id":90,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 12.1>에서 난이도가 ★★★(가장 높음)로 표시된 사분면은?","o":["제1사분면","제2사분면","제3사분면","제4사분면"],"a":0,"e":"전자동이면서 조금의 실수도 허용되지 않는 제1사분면이 난이도 ★★★로 가장 어렵다."},{"w":7,"id":91,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 12.1>에서 난이도가 ★☆☆로 가장 낮게 표시된 사분면은?","o":["제1사분면","제2사분면","제3사분면","제4사분면"],"a":2,"e":"사람이 보정하면서 다소의 오차도 허용되는 제3사분면이 난이도 ★☆☆로 가장 낮다. 제2·제4사분면은 모두 ★★☆이다."},{"w":7,"id":92,"sec":"7.7","d":"초급","x":null,"q":"자율 주행 레벨 표에서 레벨 3의 명칭으로 옳은 것은?","o":["부분 주행 자동화","조건부 주행 자동화","고속 주행 자동화","완전 주행 자동화"],"a":1,"e":"레벨 0 비자율주행, 1 주행 지원, 2 부분 주행 자동화, 3 조건부 주행 자동화, 4 고속 주행 자동화, 5 완전 주행 자동화이다."},{"w":7,"id":93,"sec":"7.7","d":"중급","x":null,"q":"자율 주행 레벨 표에서 주체(운전 책임)가 '운전자'로 표시된 레벨은?","o":["레벨 0, 1, 2","레벨 0, 1, 2, 3","레벨 3, 4, 5","레벨 1, 2, 3, 4"],"a":0,"e":"레벨 0~2까지는 주체가 운전자이고, 레벨 3~5는 주체가 자동차(자율 주행 시스템)로 바뀐다."},{"w":7,"id":94,"sec":"7.7","d":"중급","x":null,"q":"자율 주행 레벨 표에서 주체가 '자동차(자율 주행 시스템)'로 바뀌기 시작하는 레벨과 그 명칭은?","o":["레벨 2, 부분 주행 자동화","레벨 3, 조건부 주행 자동화","레벨 4, 고속 주행 자동화","레벨 5, 완전 주행 자동화"],"a":1,"e":"레벨 3(조건부 주행 자동화)부터 주체가 자동차(자율 주행 시스템)가 되며, 이 지점부터 AI 판단에 대한 설명 책임이 크게 부각된다."},{"w":7,"id":95,"sec":"7.7","d":"중급","x":"강의자료 내용 필요","q":"'설명이 필요한 비즈니스 상황'으로 강의자료가 열거하지 않은 것은?","o":["법적 소송을 가정한 설명과 설득","중대한 의사결정을 할 때의 설명과 설득","클러스터링에 의한 카테고리 라벨의 설명과 설득","모델의 학습 속도를 단축하기 위한 설명과 설득"],"a":3,"e":"열거된 상황은 법적 소송을 가정한 경우, 중대한 의사결정 시, 클러스터링에 의한 카테고리 라벨, 처음부터 정형화된 설명 내용으로 결정할 때이다."},{"w":7,"id":96,"sec":"7.7","d":"초급","x":null,"q":"'비즈니스상 필요한 설명 분류' 표에서 대상자가 '모델 개발자'일 때의 목적으로 제시된 것은?","o":["모델의 동작을 알고 개선함","설명 책임을 다함","시책 입안 및 관련 힌트를 얻음","모델이 정확히 동작함을 설명함"],"a":0,"e":"모델 개발자의 목적은 '모델의 동작을 알고 개선함'이며 주요 방법은 XAI이다."},{"w":7,"id":97,"sec":"7.7","d":"심화","x":null,"q":"'비즈니스상 필요한 설명 분류' 표에서 대상자가 '최종 사용자 사회'일 때의 목적과 주요 방법을 바르게 짝지은 것은?","o":["모델의 동작 개선 - XAI만 사용","의사결정을 위한 증가 - 과거의 판단과 비교","설명 책임 - 실험·정밀도 리포트 제시, 최초 상정 내용과 문제 발생 시 차이를 제시","모델이 정확히 동작함을 설명 - 사람의 판단이나 모델 밖에서의 구축"],"a":2,"e":"최종 사용자 사회에 대해서는 '설명 책임'을 목적으로 하며, 실험·정밀도 리포트 제시와 최초 상정 내용과 문제 발생 시의 차이 제시가 주요 방법으로 제시된다."},{"w":7,"id":98,"sec":"7.7","d":"중급","x":null,"q":"'정밀도와 설명 능력의 Trade Off' 단원이 전달하는 핵심 메시지로 옳은 것은?","o":["복잡한 사상의 설명은 근본적으로 복잡하므로 XAI에 과도한 기대는 금물이다","XAI를 쓰면 어떤 복잡한 모델도 간단히 설명할 수 있다","정밀도가 높아지면 설명 능력도 함께 높아진다","설명 능력을 포기하면 정밀도도 함께 떨어진다"],"a":0,"e":"'복잡한 사상의 설명은 근본적으로 복잡하다'와 'XAI에 과도한 기대는 금물'이 이 단원의 두 소제목이다.","s":["설명 트레이드오프"]},{"w":7,"id":99,"sec":"7.7","d":"심화","x":"강의자료의 그림 필요","q":"<그림 12.3>·<그림 12.4>가 보여주는 '새로운 것에 대한 사람들의 반응'과 XAI의 관계로 옳은 것은?","o":["XAI는 불안을 느끼는 모든 사람을 예외 없이 설득할 수 있다","XAI는 불안한 사람 중에서도 모델을 이해하고 싶은 사람에게만 도움이 될 수 있어, 그 외의 불안을 느끼는 사람에게는 다른 설명 방법도 고려해야 한다","사람들은 모두 내부 구조까지 제대로 이해하고 싶어 한다","불안을 느끼는 사람은 설명 대상에서 제외해야 한다"],"a":1,"e":"두 원이 겹치는 부분(내부 구조를 이해하고 싶으면서 불안한 사람)에만 XAI가 도움이 될 수 있고, 나머지 불안을 느끼는 사람에게는 별도의 설명 방안이 필요하다는 점을 보여준다."},{"w":7,"id":100,"sec":"7.7","d":"심화","x":null,"q":"mRNA 백신과 AI 모델을 비교한 표에서 '기능이나 효과를 이해하고 싶은 사람'에게 AI 모델 측이 제공해야 할 설명으로 제시된 것은?","o":["모델 학습 및 예측 알고리즘 동작의 설명","예측 정밀도의 정량적 평가 공유와 상정된 최악의 경우 공유","실무에서 실적을 쌓고 매스미디어 등에서 소개","모델 소스코드 전체의 공개"],"a":1,"e":"내부 구조까지 알고 싶은 사람에게는 알고리즘 동작 설명을, 기능·효과를 이해하고 싶은 사람에게는 예측 정밀도의 정량적 평가와 최악의 경우 공유를, 그 외의 사람에게는 실적 쌓기와 소개를 대응 방안으로 제시한다."}],"links":{"2|2.1":"machine-learning-week02.html#vec","2|2.2":"machine-learning-week02.html#data","2|2.3":"machine-learning-week02.html#dot","2|2.4":"machine-learning-week02.html#mat","2|2.5":"machine-learning-week02.html#diff","2|2.6":"machine-learning-week02.html#prob","2|2.7":"machine-learning-week02.html#numpy","3|3.1":"machine-learning-week03.html#reg","3|3.2":"machine-learning-week03.html#data","3|3.3":"machine-learning-week03.html#slr","3|3.4":"machine-learning-week03.html#loss","3|3.5":"machine-learning-week03.html#gd","3|3.6":"machine-learning-week03.html#multi","4|4.1":"machine-learning-week04.html#review","4|4.2":"machine-learning-week04.html#feature","4|4.3":"machine-learning-week04.html#rule","4|4.4":"machine-learning-week04.html#disc","4|4.5":"machine-learning-week04.html#logit","4|4.6":"machine-learning-week04.html#train","5|5.1":"machine-learning-week05.html#review","5|5.2":"machine-learning-week05.html#struct","5|5.3":"machine-learning-week05.html#forward","5|5.4":"machine-learning-week05.html#learn","5|5.5":"machine-learning-week05.html#gates","5|5.6":"machine-learning-week05.html#llm","5|5.7":"machine-learning-week05.html#align","6|6.1":"machine-learning-week06.html#xor","6|6.2":"machine-learning-week06.html#mlp","6|6.3":"machine-learning-week06.html#layers","6|6.4":"machine-learning-week06.html#loss","6|6.5":"machine-learning-week06.html#backprop","6|6.6":"machine-learning-week06.html#procedure","7|7.1":"machine-learning-week07.html#instance","7|7.2":"machine-learning-week07.html#vote","7|7.3":"machine-learning-week07.html#dist","7|7.4":"machine-learning-week07.html#algo","7|7.5":"machine-learning-week07.html#reg","7|7.6":"machine-learning-week07.html#xai","7|7.7":"machine-learning-week07.html#persuade","1|":"machine-learning-week01.html","2|":"machine-learning-week02.html","3|":"machine-learning-week03.html","4|":"machine-learning-week04.html","5|":"machine-learning-week05.html","6|":"machine-learning-week06.html","7|":"machine-learning-week07.html"},"concepts":{"1-1":"핵심 · 1주차 자료는 생성형 AI를 설명하기 전에 판별 모델과 생성 모델을 나란히 놓고 시작한다. 판별 모델은 주어진 것을 가려내고, 생성 모델은 없던 것을 만들어 낸다는 목표 차이가 이후 내용 전체의 기준이 된다.\n함정 · 2·3·4번은 학습 방식이나 구조에 따른 분류로, 이 자료가 내세운 '무엇을 출력하는가'의 대비가 아니다.","1-2":"핵심 · 판별 모델은 입력 이미지를 받아 그것이 어느 범주에 속하는지 판정한다. 그림의 'cat | dog'는 후보 범주이고, 출력은 그중 하나에 대한 판정(또는 확률)이다.\n함정 · 1번 새 이미지와 3번 노이즈는 생성 모델 쪽 그림 요소이고, 4번 해상도 향상은 이 그림과 관계가 없다.","1-3":"핵심 · 생성 모델은 무작위 노이즈를 출발점으로 삼아 이미지를 만든다. 노이즈가 매번 달라지므로 같은 모델에서도 서로 다른 샘플이 나온다.\n함정 · 1번 사진과 2번 레이블은 판별 모델의 입력·출력이다. 4번 평균 이미지는 그림에 없는 개념이다.","1-4":"핵심 · 생성 모델의 출력은 학습 데이터를 베낀 것이 아니라 새로 만든 이미지다. 판별 모델이 레이블·확률을 내놓는 것과 정반대 방향이라는 점을 기억해 둔다.\n함정 · 1번 레이블과 2번 확률 0.83은 판별 모델의 출력이고, 3번 경계선 지도는 생성 제어에서 쓰는 입력 조건이다.","1-5":"핵심 · 판별 모델은 관측(이미지)을 받아 레이블이나 확률을 내놓고, 생성 모델은 노이즈를 받아 이미지를 내놓는다. 화살표 방향을 '이미지→판정'과 '노이즈→이미지'로 외워 두면 변형 문제에도 대응할 수 있다.\n함정 · 2번은 두 모델의 방향을 뒤바꿔 놓았고, 3·4번은 두 모델을 같은 변환으로 뭉뚱그렸다.","1-6":"핵심 · 학습정리는 생성형 AI(이미지)를 '가상의 세계를 흉내내는 모델'이라고 한 문장으로 요약한다. 실제 데이터가 있을 법한 세계를 모사해 새 데이터를 만든다는 뜻이다.\n함정 · 1번과 4번은 정답을 맞히는 판별 모델의 성격이고, 3번 압축은 이 자료에서 다루지 않는다.","1-7":"핵심 · '흉내낸다'는 말은 실제 데이터가 따르는 분포를 배워 그 분포에서 그럴듯한 새 데이터를 뽑아낸다는 뜻이다. 복제가 아니라 모사라는 점이 핵심이다.\n함정 · 1번은 판별 모델의 능력이고, 4번은 학습 데이터를 그대로 재생하는 것이라 '새 데이터 생성'과 어긋난다.","1-8":"핵심 · 판별 모델은 레이블이 붙은 관측으로 학습해 새 관측의 정답 확률을 예측한다. 노이즈에서 이미지를 샘플링하는 것은 생성 모델만의 동작이다.\n함정 · 1·2·3번은 모두 판별 모델의 올바른 특징이다. '옳지 않은 것'을 고르는 문제이므로 생성 모델 쪽 설명인 4번이 답이 된다.","1-9":"핵심 · 생성 모델은 관측 데이터의 확률 분포를 배우고, 노이즈를 이용해 그 분포에서 새 샘플을 만든다. 따라서 출력은 레이블이 아니라 이미지 같은 샘플이다.\n함정 · 2·3·4번은 모두 생성 모델의 올바른 설명이다. 클래스 레이블을 출력하는 것은 판별 모델이므로 1번이 틀린 진술이다.","1-10":"핵심 · 판별 모델의 출력은 미리 정해진 후보 범주 중 어느 쪽인지에 대한 판정이다. 'cat | dog'는 그 후보 둘을 나란히 적은 것이다.\n함정 · 1번 합성 이미지는 생성 모델의 결과물이고, 3번과 4번은 출력이 아니라 데이터나 내부 표현에 가깝다.","1-11":"핵심 · 판별 모델은 x가 주어졌을 때 y의 확률, 곧 범주를 가르는 경계를 배운다. 생성 모델은 x가 이루는 분포 자체를 배워 거기서 샘플링한다. 데이터가 같아도 학습 목표가 다르면 산출물이 달라진다.\n함정 · 1번 파라미터 수는 본질적 차이가 아니고, 2번은 레이블이 필요한 쪽을 뒤바꿨다. 4번처럼 생성 모델도 학습을 거친다.","1-12":"핵심 · 관측을 보고 '보행자인가 아닌가'의 확률을 내는 문제는 전형적인 판별 과제다. 출력이 새 데이터인지, 판정·확률인지로 두 모델을 구분하면 된다.\n함정 · 1·2번은 새 데이터를 만드는 생성 모델 쪽 설명이고, 3번 image-to-image는 이미지를 이미지로 바꾸는 생성 응용이다.","1-13":"핵심 · 존재하지 않는 풍경을 새로 만들어 내는 것은 생성 모델의 일이며, 텍스트를 조건으로 쓰므로 text-to-image 응용에 해당한다.\n함정 · 2번 판별 모델과 3번 분류기는 주어진 이미지를 판정할 뿐 새 이미지를 만들지 않는다. 4번 레이블링 도구도 생성과는 무관하다.","1-14":"핵심 · 판별 모델의 학습 데이터는 (관측, 레이블) 쌍이고, 생성 모델의 학습 데이터는 관측만으로 이루어진다. 생성 모델은 정답 맞히기가 아니라 데이터 분포를 배우는 것이 목적이기 때문이다.\n함정 · 1·4번은 두 그림을 같게 보았고, 3번은 레이블이 붙은 쪽을 뒤바꿨다.","1-15":"핵심 · '판별 vs 생성' 개념도는 Semantic Scholar의 논문 그림 페이지를 출처로 밝힌다. 이어지는 판별·생성 모델 상세 그림 두 장은 O'Reilly의 Generative Deep Learning 1장을 출처로 삼는다.\n함정 · 2번 O'Reilly는 뒤쪽 상세 그림의 출처라서 헷갈리기 쉽다. 1·4번은 이 슬라이드에 표기되지 않았다.","1-16":"핵심 · '무엇을 맞히는가'와 '무엇을 만들어내는가'라는 목표 차이가 이후 image-to-image, text-to-image, 영상 생성까지 모든 응용의 출발점이 된다. 그래서 자료는 이 구분부터 세운다.\n함정 · 1번은 근거 없는 우열 비교이고, 2번과 달리 두 모델은 학습 목표부터 다르다. 3번처럼 생성 모델이 판별 모델의 하위 종류인 것도 아니다.","1-17":"핵심 · 판별 모델은 '주어진 몇몇 관측 x를 통해 정답 y가 나올 확률을 예측'하는 모델로 정의된다. 출력이 확률이라는 점과 정답 y가 있어야 한다는 점이 핵심이다.\n함정 · 2번은 생성 모델의 정의이고, 3번 노이즈→이미지도 생성 모델의 동작이다. 4번 화질 개선은 이 정의와 관계가 없다.","1-18":"핵심 · 판별 모델의 학습 데이터에서 그림은 관측, 옆의 숫자 1/0은 정답 레이블이다. 여기서는 1이 반 고흐 작품, 0이 다른 화가의 작품을 뜻한다.\n함정 · 1번 픽셀 값은 그림 자체에 들어 있는 정보이고, 3번 확률 분포와 4번 학습률은 데이터에 붙는 표시가 아니다.","1-19":"핵심 · 'An observation'은 학습 데이터의 그림 한 장, 곧 관측 x를 가리킨다. 판별 모델은 이 관측과 레이블 y의 쌍으로 학습한다.\n함정 · 1번 예측 확률은 학습 뒤의 출력이고, 2번 숫자는 레이블이다. 4번 파라미터는 모델 내부에 있어 그림에 직접 표시되지 않는다.","1-20":"핵심 · 판별 모델은 새 그림에 대해 'Prediction 0.83, likely to be Van Gogh'처럼 확률로 답한다. 0.83은 반 고흐일 가능성이 높다는 뜻일 뿐 확정 판정이 아니다.\n함정 · 1·2·3번은 숫자를 섞어 만든 오답이다. 그림에 표시된 값은 0.83이다.","1-21":"핵심 · 판별 모델의 출력 0.83은 '이 입력이 반 고흐 작품일 확률'이다. 모델 전체의 정확도나 학습 횟수가 아니라 입력 하나에 대한 확신의 정도를 나타낸다.\n함정 · 3번 정확도는 여러 샘플에 대한 평가 지표라 입력 하나의 출력과 다르다. 2번 데이터 수와 4번 에폭은 이 값과 관계가 없다.","1-22":"핵심 · 판별 모델 예시에서 레이블 1은 반 고흐 작품(별이 빛나는 밤, 해바라기 등)에, 0은 다른 화가의 작품에 붙는다. 과제는 '반 고흐인가 아닌가'를 가리는 이진 판별이다.\n함정 · 1번 모나리자는 0 쪽의 다른 화가 그림이고, 3·4번은 이 예시와 무관하다.","1-23":"핵심 · 판별 모델은 양성(1)과 음성(0)을 모두 보아야 둘을 가르는 기준을 세울 수 있다. 레이블 0 데이터는 '무엇이 반 고흐가 아닌지'를 알려 준다.\n함정 · 1·2번처럼 예측을 막거나 확률을 1로 만드는 역할은 하지 않는다. 4번처럼 학습 속도를 높이는 것도 0 데이터의 목적이 아니다.","1-24":"핵심 · 판별 모델의 흐름은 레이블이 붙은 학습 데이터 → 학습 → 새 관측에 대한 예측이다. 생성 모델은 학습 뒤에 예측 대신 노이즈를 이용한 샘플링이 온다는 점이 다르다.\n함정 · 2번은 생성 모델의 샘플링 흐름이고, 1·3번은 순서가 뒤섞여 있거나 판별 모델에 없는 단계를 넣었다.","1-25":"핵심 · 학습이 끝난 판별 모델은 처음 보는 입력에도 학습한 기준을 적용해 정답일 확률을 계산한다. 이것이 그림의 Prediction 단계다.\n함정 · 2번 새 그림 그리기는 생성 모델의 일이다. 3번처럼 입력을 학습 데이터에 자동으로 넣거나 4번처럼 노이즈를 제거하는 단계는 없다.","1-26":"핵심 · 판별 모델은 관측 x와 정답 y를 비교해 예측과 정답의 차이를 줄이는 방식으로 학습한다. 레이블이 없으면 비교할 기준이 사라져 확률 예측을 배울 수 없다.\n함정 · 1번처럼 관측을 입력하는 것 자체는 가능하다. 3번 확률 고정과 4번 노이즈 생성은 레이블 유무와 관계가 없다.","1-27":"핵심 · 판별 모델의 출력은 확정된 답이 아니라 확신의 정도를 나타내는 확률이다. 0.83은 반 고흐일 가능성이 높지만 불확실성이 0.17만큼 남아 있다는 뜻이다.\n함정 · 1번처럼 반드시 맞혔다고 단정할 수 없고, 2번 새 그림 생성은 생성 모델의 일이다. 4번처럼 0 데이터가 불필요하다는 근거도 되지 않는다.","1-28":"핵심 · 판별 모델 그림에서 Training 화살표는 레이블이 붙은 학습 데이터를 판별 모델로 잇는다. 그다음 Prediction 화살표가 새 관측에 대한 예측(0.83)으로 이어진다.\n함정 · 1번 Generated Samples와 2번 Random noise는 생성 모델 그림의 요소다. 3번은 예측 단계의 요소들을 잘못 짝지었다.","1-29":"핵심 · 판별 모델과 생성 모델의 상세 그림 두 장은 모두 O'Reilly의 Generative Deep Learning 1장을 출처로 삼는다. 첫 '판별 vs 생성' 개념도의 출처(Semantic Scholar)와 구분해야 한다.\n함정 · 2·3·4번은 유명한 머신러닝 교재지만 이 슬라이드의 출처로 표기되지 않았다.","1-30":"핵심 · 판별 모델 정의 'x를 통해 y가 나올 확률을 예측'에서 x는 입력 관측, y는 맞혀야 할 정답이다. 확률로 쓰면 'x가 주어졌을 때 y의 확률'이 된다.\n함정 · 1번은 x와 y를 뒤바꿨고, 3번 노이즈→이미지는 생성 모델 쪽 기호 해석이다. 4번은 정의와 관계가 없다.","1-31":"핵심 · 범주가 둘뿐이면 각 범주의 확률을 더하면 1이 된다. 따라서 반 고흐가 아닐 확률은 1 − 0.83 = 0.17이다.\n함정 · 1번은 같은 값을 반복했을 뿐이고, 2번 0.50은 근거 없는 중간값이다. 4번 0은 0.83이 확정 판정이라고 착각한 것이다.","1-32":"핵심 · 판별 모델은 학습 때 본 사례를 기준으로 경계를 세운다. 학습 분포를 벗어난 입력, 예컨대 처음 보는 화풍이 들어오면 출력 확률을 그대로 믿기 어렵다.\n함정 · 1번과 달리 판별 모델은 레이블이 있어야 학습된다. 2번 새 그림 생성은 생성 모델의 일이고, 3번처럼 입력을 처리하지 못하는 것은 아니다.","1-33":"핵심 · 생성 모델은 '관측된 데이터 x를 토대로 확률 분포를 만들고, 그 분포에서 샘플링'한다. 분포를 배우는 단계와 거기서 뽑아내는 단계로 나누어 기억해 둔다.\n함정 · 2번은 판별 모델의 정의다. 3번 정렬 저장과 4번 레이블 정리는 분포를 학습하는 것과 거리가 멀다.","1-34":"핵심 · 생성 모델 예시는 말 사진으로 학습하고 새 말 이미지를 만들어 낸다. 판별 모델 예시가 명화(반 고흐)를 다룬 것과 소재가 다르다.\n함정 · 1번 고양이는 첫 '판별 vs 생성' 개념도의 소재이고, 3번 명화는 판별 모델 예시의 소재다.","1-35":"핵심 · 생성 모델은 학습이 끝난 뒤 랜덤 노이즈를 재료로 삼아 분포에서 샘플을 뽑는다. 노이즈가 결과의 다양성을 만든다.\n함정 · 1번 레이블과 2번 확률 0.83은 판별 모델 쪽 요소이고, 4번 Canny edge는 생성 제어 사례에서 쓰는 구조 조건이다.","1-36":"핵심 · 생성 모델의 결과물은 Generated Samples, 곧 새로 만들어진 샘플이다. 판별 모델의 결과물이 Prediction(확률)인 것과 짝지어 기억한다.\n함정 · 1번 Training data와 3번 An observation은 입력 쪽 요소이고, 2번 Prediction은 판별 모델의 출력이다.","1-37":"핵심 · 생성 모델은 무작위 노이즈를 출발점으로 삼기 때문에 같은 모델에서도 매번 다른 샘플이 나온다. 노이즈를 바꿔 가며 뽑는 것이 곧 분포에서의 샘플링이다.\n함정 · 2·3번은 노이즈의 역할과 관계가 없다. 4번처럼 확률을 고정하는 것은 판별 모델의 출력 이야기다.","1-38":"핵심 · 생성 모델의 흐름은 학습 데이터 → 학습 → (랜덤 노이즈와 함께) 샘플링 → 생성 샘플이다. 학습 이후 단계가 판별 모델의 Prediction 대신 Sampling이라는 점이 다르다.\n함정 · 1번은 노이즈가 학습보다 앞서 있고 레이블링이 끼어 있다. 3·4번은 순서가 뒤섞였거나 판별 모델의 요소가 섞여 있다.","1-39":"핵심 · 생성 모델의 목표는 정답을 맞히는 것이 아니라 관측 x가 이루는 분포를 익히는 것이다. 그래서 학습 데이터에 레이블이 필수적이지 않다.\n함정 · 1번처럼 레이블이 반드시 필요한 것은 판별 모델이다. 2번 말 사진에도 레이블은 붙일 수 있고, 4번 노이즈와 레이블은 서로 관계가 없다.","1-40":"핵심 · 생성 모델은 원본을 복사하지 않고 학습한 분포에서 새 점을 뽑는다. 그래서 결과가 학습 데이터와 닮았지만 똑같지는 않다.\n함정 · 1번 해상도, 2번 데이터 절반 사용, 3번 레이블 오류는 '원본과 다른 이유'를 설명하지 못한다. 차이는 샘플링이라는 원리에서 나온다.","1-41":"핵심 · 샘플링은 확률적 선택이다. 같은 분포에서 여러 번 뽑으면 결과가 매번 달라질 수 있고, 이것이 생성 모델이 다양한 결과물을 내는 근거다.\n함정 · 2번 고정 출력과 3번 원본 복사는 샘플링의 의미와 반대다. 4번 레이블 값 출력은 판별 모델의 성격이다.","1-42":"핵심 · 판별 모델의 출력은 정답 확률(예: 0.83)이고, 생성 모델의 출력은 생성 샘플(새 이미지)이다. 입력도 각각 관측 이미지와 노이즈로 서로 다르다.\n함정 · 1번은 두 출력을 뒤바꿨다. 3번 노이즈는 생성 모델의 입력이고, 4번처럼 생성 모델에 출력이 없는 것도 아니다.","1-43":"핵심 · 생성형 AI의 목적은 독창적인 새 콘텐츠를 만드는 것이다. 학습 데이터를 외워 그대로 내놓으면 분포를 배운 것이 아니라 복제한 것이 되어 그 목적에 어긋난다.\n함정 · 1번 속도와 2번 레이블은 암기의 문제점과 관계가 없다. 4번처럼 분포를 아예 만들 수 없게 되는 것도 아니다.","1-44":"핵심 · 생성 모델 그림에서 'An observation'은 학습 데이터 안의 말 사진 한 장을 가리킨다. 판별 모델 그림과 달리 그 옆에 레이블 숫자가 붙지 않는다.\n함정 · 1번 생성된 이미지는 출력이고, 2번 노이즈는 샘플링의 재료다. 3번 파라미터는 그림에 표시되지 않는다.","1-45":"핵심 · 생성 모델의 산출물은 학습 데이터에 없던 새 샘플이다. '확률이나 경계를 출력하는가, 새 데이터를 출력하는가'로 두 모델을 가른다.\n함정 · 2번 확률과 3번 결정 경계는 판별 모델의 산출물이다. 4번 데이터 개수는 모델의 출력이 아니다.","1-46":"핵심 · 생성 결과의 다양성은 노이즈의 무작위성에서 나온다. 거꾸로 말하면 노이즈와 조건이 같을 때는 같은 샘플이 나오는 것이 자연스럽다.\n함정 · 3번은 '샘플링은 늘 다르다'는 말을 과하게 일반화했다. 다름의 원인은 노이즈이므로 노이즈가 같으면 결과도 같다. 1번 원본 복사와 4번 레이블 출력은 생성 모델의 동작이 아니다.","1-47":"핵심 · 생성 모델은 학습한 분포에서 새 샘플을 계속 뽑을 수 있다. 그래서 원본과 비슷하지만 서로 다른 데이터를 늘리는 데이터 증강에 활용할 수 있다.\n함정 · 1번 관측→레이블 변환은 판별 모델의 일이고, 2번 삭제와 4번 확률 조작은 증강과 관계가 없다.","1-48":"핵심 · 생성 모델은 관측 데이터의 분포를 흉내낸다. 학습 데이터가 한쪽으로 치우치면 학습한 분포도 치우치고, 생성 결과도 그 편향을 그대로 물려받는다.\n함정 · 1번은 반대 방향의 결과다. 2번 레이블 오류와 3번 확률 고정은 생성 모델과 관계가 없다.","1-49":"핵심 · 두 모델 모두 학습 데이터 → Training → 모델까지는 같다. 그 뒤가 판별 모델은 Prediction, 생성 모델은 노이즈와 함께하는 Sampling으로 갈린다.\n함정 · 2번 Random noise와 4번 Sampling은 생성 모델에만, 3번 Prediction 0.83은 판별 모델에만 있는 단계다.","1-50":"핵심 · 자료는 생성형 AI를 '독창적인 콘텐츠를 생성할 수 있는 컴퓨터 모델을 중심으로 하는 인공지능의 한 분야'로 정의한다. 핵심어는 독창적 콘텐츠, 컴퓨터 모델, AI의 한 분야다.\n함정 · 1번 분류는 판별 모델의 일이고, 3번 검색과 4번 렌더링은 '새 콘텐츠 생성'과 다르다.","1-51":"핵심 · 정의문은 생성형 AI가 대규모 언어 모델, 신경망, 머신러닝의 힘을 활용해 인간의 창의성을 모방한 새 콘텐츠를 만든다고 서술한다. 세 요소는 AI⊃ML⊃DL로 이어지는 기술 계보와도 맞물린다.\n함정 · 1번은 다른 AI 기법들이고, 2·4번은 인프라와 하드웨어라 정의문에 나오는 '힘'이 아니다.","1-52":"핵심 · 정의문에 따르면 생성형 AI는 '인간의 창의성을 모방한 새로운 콘텐츠'를 만든다. 계산이나 인식이 아니라 창작 능력을 흉내낸다는 점이 판별 모델과 다르다.\n함정 · 1·2번 기억력과 계산 속도는 전통적인 컴퓨터의 강점이고, 3번 시각 인지는 판별 모델(분류)에 더 가깝다.","1-53":"핵심 · 생성형 AI는 학습 데이터를 바탕으로 하되 그것을 검색하거나 복제하지 않고 새 결과물을 만든다. 정의문의 '독창적인 콘텐츠'는 바로 이 점을 강조한다.\n함정 · 2번 해상도는 품질의 문제이고, 3번은 생성 주체가 모델이라는 정의와 어긋난다. 4번처럼 텍스트에만 한정되지도 않는다.","1-54":"핵심 · 정의 슬라이드에는 장난감 오리를 보여 주며 여러 언어의 표현과 발음을 묻는 영상 장면이 들어 있다. 이미지를 이해하고 언어로 새 답을 만드는 생성형 AI를 보여 주는 예시다.\n함정 · 1·3·4번은 인식이나 자동화 사례로, 이 슬라이드에 실리지 않았고 판별 과제에 더 가깝다.","1-55":"핵심 · 오리 예시 화면에는 Spanish: pato, French: canard, Korean: 오리처럼 언어별 표현이 나열된다. 하나의 대상을 보고 여러 언어로 답을 생성하는 능력을 보여 준다.\n함정 · 1·2·4번은 화면에 나오지 않는 정보다. 이 장면의 핵심은 다국어 응답 생성이다.","1-56":"핵심 · 오리 예시는 보여 준 물체를 이해하고 여러 언어의 표현과 발음을 새로 만들어 답한다. 이미지와 언어를 함께 다루는 생성 능력을 보여 준다.\n함정 · 1번 분류만 하는 것은 판별 모델이고, 2번처럼 텍스트만 다루는 장면도 아니다. 3번 정답 레이블은 생성형 AI가 동작하는 조건이 아니다.","1-57":"핵심 · 생성형 AI는 인공지능 안에 포함되는 하위 영역이다. 1주차 포함 관계도 AI ⊃ ML ⊃ DL ⊃ 생성형 AI로 그리며, 바깥 원일수록 넓은 개념이다.\n함정 · 3번은 포함 관계를 뒤집었다. 정의문은 머신러닝과 신경망을 활용한다고 밝히므로 2·4번도 틀렸다.","1-58":"핵심 · 생성형 AI의 결과물은 이미지·영상·그림처럼 새로 만든 콘텐츠다. 입력이 고양이인지 개인지 알려 주는 판정은 판별 모델의 예측 출력이라 생성 결과물로 보기 어렵다.\n함정 · 1·3·4번은 텍스트·프롬프트·참조 이미지를 조건으로 새 콘텐츠를 만든 것이라 모두 생성형 AI의 결과물이다.","1-59":"핵심 · 1장은 판별 vs 생성 대비 → 판별 모델 → 생성 모델 → 생성형 AI 정의 순으로 전개된다. 대비로 시작해 각각을 풀어 본 뒤 정의로 묶는 구조다. 응용 사례는 그다음 2장에서 다룬다.\n함정 · 1·2번은 정의와 응용의 위치가 뒤바뀌었고, 4번은 단원 순서가 아니다.","1-60":"핵심 · 생성형 AI 정의 슬라이드는 YouTube 영상(오리 예시 장면)을 참조 출처로 밝힌다. 판별·생성 그림은 O'Reilly와 Semantic Scholar, 응용 사례는 arXiv·GitHub 등으로 출처가 슬라이드마다 다르다.\n함정 · 1·2번은 다른 슬라이드에서 쓰인 출처라 헷갈리기 쉽다.","1-61":"핵심 · 정의문의 '컴퓨터 모델을 중심으로 하는'은 콘텐츠를 만드는 주체가 학습된 모델이라는 점을 분명히 한다. 사람이 직접 만드는 것이 아니라 모델이 데이터에서 배운 분포로 생성한다.\n함정 · 2번 하드웨어 강조와 3번 사람이 직접 만든다는 해석은 정의와 맞지 않는다. 모델은 데이터로 학습하므로 4번도 틀렸다.","1-62":"핵심 · text-to-image에서는 텍스트 프롬프트가 생성의 조건이 된다. 언어 모델이 문장의 의미를 이해해 이미지 생성 과정으로 연결하므로, 이미지 생성에도 언어 모델이 중요하다.\n함정 · 1번 픽셀 저장, 3번 노이즈 생성, 4번 레이블 변환은 언어 모델의 역할이 아니다.","1-63":"핵심 · '가상의 세계를 흉내내는 모델'은 비유로, '독창적인 콘텐츠를 생성'은 정의로 같은 능력을 표현한 것이다. 데이터 분포를 모사하니 그럴듯한 새 콘텐츠가 나온다는 한 가지 원리를 두 방식으로 말한다.\n함정 · 1번처럼 모순되지 않고, 2번처럼 서로 다른 모델을 가리키지도 않는다. 둘 다 생성 모델에 대한 서술이다.","1-64":"핵심 · 변환 이름은 '입력-to-출력'으로 붙는다. 인물 사진을 넣어 만화풍 그림을 얻으면 입력과 출력이 모두 이미지이므로 image-to-image다.\n함정 · 3번 text-to-image는 텍스트가 조건일 때다. 이 사례의 입력은 실제 사진이다. 1번 영상 출력과 2번 노이즈→텍스트는 이 사례와 관계가 없다.","1-65":"핵심 · 캐릭터 변환 사례는 malnyun_faces와 toonify라는 GitHub 프로젝트를 출처로 든다. 실사 얼굴을 웹툰·만화풍으로 바꾸는 image-to-image 응용이다.\n함정 · 2번 MagicAnimate·DreamPose는 영상 생성 제어 사례이고, 3번 ControlNet은 생성 제어, 4번 freepik·aitimes는 이미지 출처와 기사 출처다.","1-66":"핵심 · image-to-image는 원본 이미지를 조건으로 받아, 인물의 정체성과 구도 같은 구조는 유지하고 화풍·스타일만 바꾼 이미지를 내놓는다.\n함정 · 1번은 text-to-image이고, 3번 이미지→레이블은 판별 모델이다. 4번 노이즈→텍스트는 이 주차에서 다루지 않는다.","1-67":"핵심 · 애니메이션 뮤직비디오는 텍스트(가사·설명)를 조건으로 영상 장면을 만든 사례로, 자료에서 text-to-image 항목에 분류된다. 분류 기준은 출력 형식이 아니라 생성의 조건(입력)이다.\n함정 · 1번 image-to-image는 캐릭터 변환 사례이고, 결과가 영상이라고 2번 video-to-video로 고르기 쉽지만 자료의 분류와 다르다.","1-68":"핵심 · 애니메이션 뮤직비디오 화면에는 '그 AI 작사 그 AI 작곡'과 'TRACK 01 새로운 시작'이 보인다. 가사와 곡까지 AI로 만든 콘텐츠라는 점이 강조된다.\n함정 · 1번은 배너광고의 고지 문구이고, 2번 Input human pose는 생성 제어 예시, 3번은 MagicAnimate 설명이다.","1-69":"핵심 · 광고/디자인 분야의 사례는 생성형 AI 기술로 만든 '온라인 배너광고'다. 텍스트로 원하는 광고 이미지를 만드는 text-to-image 응용에 속한다.\n함정 · 2·3·4번은 심사·번역·예측처럼 생성이 아닌 과제이거나 자료에 나오지 않는 결과물이다.","1-70":"핵심 · '위 이미지는 AI로 생성되었습니다'라는 문구는 광고 이미지가 실제 촬영물이 아닌 생성물임을 소비자에게 알리는 표기다. 생성 이미지가 사실처럼 보일수록 이런 고지가 중요해진다.\n함정 · 1번 저작권자, 3번 촬영 장소, 4번 초상권 계약은 이 문구가 담은 내용이 아니다.","1-71":"핵심 · 생성 이미지는 실제 인물이나 상황을 찍은 것이 아니므로, 소비자가 실제 장면으로 오인하지 않게 하려면 고지가 필요하다. 생성형 AI가 사실적일수록 커지는 윤리적 쟁점이다.\n함정 · 1번 속도, 2번 해상도, 4번 데이터 양은 기술적 문제로, 고지 관행이 생긴 이유와 무관하다.","1-72":"핵심 · 개인화 사례 그림은 사전학습된 text-to-image 확산 모델, 곧 Pretrained T2I Diffuser를 가운데 둔다. 여기에 참조 이미지·구조 조건·노이즈를 넣어 특정 대상을 다시 그린다.\n함정 · 1번은 판별 모델이고, 2번 MagicAnimate는 영상 생성 사례다. 3번 Canny는 생성 제어의 윤곽선 조건 이름일 뿐이다.","1-73":"핵심 · 개인화 그림에서 확산 모델의 입력은 참조 이미지(Ref Image), 선택적 구조 조건, 초기 노이즈다. 참조 이미지로 대상의 정체성을, 노이즈로 다양성을 만든다.\n함정 · 2번 레이블과 3번 확률 0.83은 판별 모델의 요소이고, 4번 말·고양이 사진은 판별·생성 개념도의 소재다.","1-74":"핵심 · Text Prompt 위의 금지 표시는 텍스트 없이 참조 이미지와 구조 조건만으로 생성할 수 있다는 뜻이다. 일반 text-to-image와 달리 '이 대상'을 이미지로 직접 지정한다는 것이 개인화의 특징이다.\n함정 · 1번은 정반대 해석이고, 3·4번은 금지 표시의 의미와 관계가 없다.","1-75":"핵심 · 개인화 사례의 참조 이미지는 우주복을 입고 백마를 탄 인물이다. 생성 결과는 같은 대상의 정체성을 유지한 채 구도와 장면을 바꿔 변주한다.\n함정 · 1번 사슴은 Canny edge 생성 제어 예시, 2번 요리사는 human pose 예시의 프롬프트에서 나온 소재다.","1-76":"핵심 · AI 휴먼 모델 사례의 가상 인간은 '로지'로, 광고로 얼굴을 알린 뒤 가수로 데뷔했다. 실존 인물 없이 생성 기술로 만든 인물이 상업 활동을 하는 예다.\n함정 · 1·2·3번은 실존했던 화가와 그림 이름이다. 반 고흐는 판별 모델 예시에 나온다.","1-77":"핵심 · 가상인간 로지는 광고에서 먼저 얼굴을 알리고 이후 가수로 데뷔했다. 생성형 AI 인물이 광고에서 엔터테인먼트로 활동 영역을 넓혀 가는 흐름을 보여 준다.\n함정 · 2·3·4번은 뉴스 자막에 나오지 않는 경로다. 순서는 '광고 → 가수'다.","1-78":"핵심 · AI 휴먼 모델은 생성 모델로 만든 인물이라 실제 인물을 촬영하지 않고도 원하는 콘셉트의 이미지·영상을 만들 수 있다. 광고 산업에서 비용과 유연성 면의 이점이 크다.\n함정 · 1번 생성 모델도 학습 데이터가 필요하다. 3번 효과 보장과 4번 판별 모델 대체는 근거 없는 과장이다.","1-79":"핵심 · image-to-image와 text-to-image는 생성의 조건, 곧 입력이 이미지인지 텍스트인지로 나뉜다. 이름의 앞부분이 입력, 뒷부분이 출력이다.\n함정 · 1번 출력 형식으로 나누지 않으므로 영상 사례도 text-to-image에 들어간다. 2번 모델 종류와 4번 데이터 양은 분류 기준이 아니다.","1-80":"핵심 · 자료에서 text-to-image 항목에는 애니메이션 뮤직비디오, 광고/디자인(배너광고), 개인화, 생성 제어가 묶인다. 캐릭터 변환만 image-to-image이고, AI 휴먼·댄스/패션·영화는 별도 항목이다.\n함정 · 1·2·3번은 모두 image-to-image인 캐릭터 변환을 포함하므로 텍스트 조건끼리 묶은 것이 아니다.","1-81":"핵심 · 캐릭터 변환은 원본 인물 사진을 입력으로 받아 그 인물의 특징을 유지한 그림을 내놓는다. 입력도 출력도 이미지이므로 image-to-image로 분류된다.\n함정 · 2번 텍스트가 유일한 입력이면 text-to-image다. 3번 노이즈만 쓰는 것은 무조건 생성이고, 4번 레이블 출력은 판별 모델이다.","1-82":"핵심 · 응용 사례는 캐릭터·광고·개인화·생성 제어 같은 정지 이미지에서 시작해 댄스/패션 영상과 영화 영상 생성으로 넓어진다. 이미지에서 영상으로 확장되는 흐름이다.\n함정 · 1번 판별 성능은 응용 사례의 주제가 아니고, 3번은 방향을 뒤집었다. 4번 음성 인식은 다루지 않는다.","1-83":"핵심 · 개인화는 참조 이미지로 특정 대상을 지정해, 그 정체성을 유지하면서 다양한 장면과 구도를 만든다. 일반 text-to-image가 텍스트 설명에 맞는 '아무' 대상을 그리는 것과 다르다.\n함정 · 1번 흑백은 근거가 없고, 2번처럼 텍스트를 전혀 못 쓰는 것은 아니다(선택 사항일 뿐). 사전학습 모델을 쓰므로 4번도 틀렸다.","1-84":"핵심 · 생성 제어 슬라이드의 사슴 예시는 Canny edge(윤곽선) 이미지를 구조 조건으로 쓴다. 윤곽선이 형태를 고정하고, 텍스트 프롬프트가 화풍과 세부를 정한다.\n함정 · 1번 pose는 사람 예시의 조건이고, 2번 노이즈만으로는 구조를 제어할 수 없다. 3번 레이블은 판별 모델의 요소다.","1-85":"핵심 · 생성 제어 슬라이드의 사람 예시는 human pose(자세 뼈대) 정보를 구조 조건으로 쓴다. 자세가 고정되고 프롬프트에 따라 인물과 배경이 바뀐다.\n함정 · 2번 Canny edge는 사슴 예시의 조건이다. 3번 말 사진과 4번 배너광고는 다른 슬라이드의 소재다.","1-86":"핵심 · 생성 제어에서는 조건 이미지(윤곽선·자세)가 구조를 고정하고, 텍스트 프롬프트는 화풍과 설정만 바꾼다. Default 결과도 조건의 구조를 그대로 따른다.\n함정 · 1번처럼 Default가 조건을 무시하지 않고, 3번처럼 프롬프트가 구조를 바꾸지도 않는다. 4번 결과는 텍스트가 아니라 이미지다.","1-87":"핵심 · 구조 조건으로 준 자세는 어떤 프롬프트를 넣어도 유지된다. \"chef in kitchen\"이든 \"Lincoln statue\"든 같은 포즈 위에서 인물과 배경만 바뀐다.\n함정 · 1번 옷 색과 2번 조명은 프롬프트에 따라 바뀌는 요소다. 4번 파일 크기는 생성 제어와 관계가 없다.","1-88":"핵심 · 생성 제어의 효용은 윤곽선이나 자세 같은 조건으로 결과의 구조와 구도를 의도대로 고정할 수 있다는 점이다. 노이즈만 쓰는 생성은 결과를 예측하기 어렵지만, 조건을 주면 세부 표현만 바뀐다.\n함정 · 1번 데이터 양 감소, 2번 레이블링 자동화, 3번 판별 정확도 향상은 생성 제어의 목적이 아니다.","1-89":"핵심 · 사슴 예시의 프롬프트는 'masterpiece of fairy tale, giant deer, golden antlers'와 '..., quaint city Galic'이다. 같은 윤곽선에 서로 다른 프롬프트를 주어 화풍만 바꾼다.\n함정 · 2번 chef in kitchen은 사람 자세 예시의 프롬프트이고, 3번은 MagicAnimate 설명, 4번은 뮤직비디오 곡명이다.","1-90":"핵심 · Video 생성 제어 사례는 댄스(MagicAnimate)와 패션(DreamPose) 두 주제를 다룬다. 둘 다 자세 시퀀스를 조건으로 정지 이미지를 움직이는 영상으로 만든다.\n함정 · 1번 영화는 별도의 'Video 생성' 항목이다. 3번 캐릭터·개인화는 이미지 사례이고, 4번 분류·회귀는 생성이 아니다.","1-91":"핵심 · MagicAnimate는 참조 이미지를 모션 시퀀스에 맞춰 애니메이션하면서 시간적 일관성(temporal consistency)을 지키는 것을 목표로 한다. 프레임이 바뀌어도 인물의 외형이 유지되어야 한다.\n함정 · 1번 음악 생성, 2번 해상도 향상, 4번 분류는 MagicAnimate의 목표가 아니다.","1-92":"핵심 · MagicAnimate 예시의 각 묶음은 참조 이미지(Reference), 모션 정보(Motion), 결과 애니메이션(Animation)으로 배열된다. 대상은 참조 이미지에서, 움직임은 모션에서 가져온다.\n함정 · 1번과 2번은 학습·평가 용어로 이 그림과 관계가 없다. 3번은 생성 제어에서 쓰는 조건의 종류다.","1-93":"핵심 · DreamPose는 Input Image(옷 입은 인물 사진)와 Input Pose Sequence(자세 시퀀스)를 받아 그 인물이 움직이는 영상을 만든다. 대상과 움직임을 각각 다른 입력으로 지정하는 구조다.\n함정 · 2번 Canny edge와 프롬프트는 이미지 생성 제어의 입력이고, 3·4번의 레이블·예측 확률은 판별 모델의 요소다.","1-94":"핵심 · 영상은 프레임이 연속된 것이므로 프레임 사이에 인물의 얼굴과 의상이 유지되어야 자연스럽다. 이 일관성을 지키는 것이 영상 생성의 핵심 과제다.\n함정 · 1번 용량과 4번 학습 속도는 일관성과 무관하다. 3번과 달리 자세 정보는 영상을 만드는 핵심 조건이라 없애지 않는다.","1-95":"핵심 · DreamPose는 이미지 한 장과 자세 시퀀스로 영상을 만든다. 패션에서는 옷 사진 한 장으로 모델이 걸으며 옷을 입어 보이는 착용 영상을 만드는 데 쓸 수 있다.\n함정 · 1번 가격 예측, 2번 방문객 수 세기, 4번 재질 분류는 모두 판별·예측 과제라 생성 기술의 활용이 아니다.","1-96":"핵심 · 응용 사례의 마지막 항목은 'Video 생성 : 영화'로, AI로 제작한 사극풍 영상이 예시로 실렸다. 정지 이미지에서 시작한 응용이 긴 영상 콘텐츠까지 확장된 끝점이다.\n함정 · 1·2·3번은 이 자료의 응용 사례 목록에 없는 분야다.","1-97":"핵심 · 학습정리는 '1. 생성형 AI(이미지)란?'과 '2. 생성형 AI(이미지) 응용 사례' 두 대단원으로 정리된다. 1장은 개념(판별/생성, 정의), 2장은 사례를 다룬다.\n함정 · 2번 판별 모델/생성 모델은 1장 안의 세부 항목이다. 3·4번은 이 자료의 구성과 맞지 않는다.","1-98":"핵심 · 응용 사례는 image-to-image 캐릭터 → text-to-image(뮤직비디오, 광고/디자인, 개인화, 생성 제어) → AI 휴먼 모델 → Video 생성 제어(댄스/패션) → 영화 순이다. 이미지에서 영상으로 넓어지는 흐름을 잡으면 순서가 따라온다.\n함정 · 1·3·4번은 이 흐름을 거스르거나 순서를 뒤섞었다.","1-99":"핵심 · 이 주차는 판별과 생성의 차이에서 출발해 생성형 AI의 정의를 세우고, 이미지부터 영상까지 응용으로 확장한다. 데이터 분포를 흉내내 새 콘텐츠를 만드는 생성 모델이 중심축이다.\n함정 · 1·2번은 판별 모델이나 레이블링에 초점을 맞춰 자료의 방향과 맞지 않는다. 4번 압축 표준은 다루지 않는다.","1-100":"핵심 · 출처 슬라이드는 제작 이미지의 출처로 kr.freepik.com을 밝힌다. 자료 곳곳의 그림은 O'Reilly·Semantic Scholar·arXiv·GitHub 등 슬라이드별 출처를 따로 표기한다.\n함정 · 1·2번은 개별 사례 슬라이드의 출처이고, 3번 aitimes는 기사 출처라 제작 이미지의 출처와 다르다.","2-1":"핵심 · 같은 '벡터'도 보는 관점에 따라 정의가 다르다. 컴퓨터 과학은 실수 성분이 나열된 1차원 배열로, 물리는 크기와 방향을 가진 양으로 본다. 차원이 늘면 2차원 배열은 행렬, n차원 배열은 텐서가 된다.\n함정 · 2번은 물리 관점, 1번은 행렬, 4번은 텐서의 정의라서 관점과 대상을 섞은 오답이다.","2-2":"핵심 · 물리에서 벡터는 크기와 방향을 함께 가진 양이다. 방향은 화살표로 그리고 크기는 화살표 길이, 즉 수치로 나타낸다. 이 직관이 뒤에서 노름(크기)과 사잇각(방향)으로 이어진다.\n함정 · 2번과 3번은 크기나 방향 중 하나만 남겼고, 4번은 순서가 있다는 벡터의 성질과 정면으로 어긋난다.","2-3":"핵심 · 벡터는 값의 모임이지만 집합과 달리 성분의 순서가 의미를 가진다. [3, 2]와 [2, 3]은 다른 벡터이고, 특징벡터에서도 몇 번째 성분이 어떤 특징인지가 고정돼 있다.\n함정 · 1·2·3번은 중복 금지, 개수 3개, 정수 제한을 붙였는데 벡터에는 그런 제약이 없다.","2-4":"핵심 · 전치(T)는 행과 열을 맞바꾸는 연산이다. 열벡터에 T를 붙이면 행벡터가 되고, 다시 붙이면 원래대로 돌아온다. 그래서 내적을 u^T v처럼 '행벡터 × 열벡터' 꼴로 쓸 수 있다.\n함정 · 1번은 부호 반전, 3번은 정규화, 4번은 내적처럼 스칼라를 만드는 연산과 혼동한 것이다.","2-5":"핵심 · 성분이 n개인 실수 벡터는 n차원 실수 공간 R^n의 원소다. 지수 n은 성분 개수이고 R은 각 성분이 실수라는 뜻이다. 행렬은 R^(m×n)처럼 두 개의 크기를 쓴다.\n함정 · 1번 R^(n×n)은 정방 행렬의 공간이고, 3번 N은 자연수라 실수 성분을 담지 못하며, 4번은 차원을 하나 줄였다.","2-6":"핵심 · 교안의 표기 규칙은 벡터는 굵은 소문자(x), 행렬은 굵은 대문자(A)다. 벡터는 (x1, x2, x3)이나 <x1, x2, x3>로도 쓰고, 행렬과 함께 다룰 때는 세로로 세운 열벡터를 기본으로 한다.\n함정 · 1~3번은 모두 교안에 나온 표기이고, 4번만 대문자를 벡터에 붙여 행렬 표기와 뒤바꿨다.","2-7":"핵심 · 벡터는 기하학적으로 두 가지로 읽는다. 첫째는 n차원 공간의 한 점(좌표)이고, 둘째는 원점에서 그 점으로 향하는 방향이다. 데이터 하나가 특징 공간의 점이 된다는 생각이 여기서 나온다.\n함정 · 2번은 노름, 3번은 행렬 분해, 4번은 확률 분포의 이야기라 기하학적 해석과 관계없다.","2-8":"핵심 · 2차원 벡터 [a b]^T에서 첫 성분은 가로(x축), 둘째 성분은 세로(y축) 이동량이다. 양수면 오른쪽·위, 음수면 왼쪽·아래로 간다. 그래서 [3 2]^T는 오른쪽 3, 위로 2다.\n함정 · 2번과 3번은 두 성분의 역할을 뒤바꿨고, 1번은 부호를 반대로 읽었다.","2-9":"핵심 · 벡터 덧셈은 같은 위치 성분끼리 더하고, 스칼라 곱은 모든 성분에 같은 실수를 곱한다. 결과는 둘 다 원래와 같은 크기의 벡터다. 성분끼리 곱해 모두 더해 스칼라가 나오면 그건 내적이다.\n함정 · 2번은 한 벡터 안의 성분끼리 더했고, 4번은 내적을 덧셈으로 착각했으며, 1번은 곱과 합을 뒤섞었다.","2-10":"핵심 · 벡터 뺄셈도 성분별로 계산하며 x−y와 y−x는 부호만 반대인 서로 다른 벡터다. x−y = [1+2, 2−3, 3−6] = [3, −1, −3]이다. 음수 성분을 뺄 때 부호를 놓치지 않는 것이 관건이다.\n함정 · 2번은 x+y의 결과를 그대로 적어 놓은 것이다. 4번 y−x = [−3, 1, 3]은 x−y의 부호를 뒤집은 값이라 옳다.","2-11":"핵심 · 훈련 데이터는 모델이 풀어야 할 임무에 대해 수집한 데이터다. 모델은 이 데이터를 보고 인자(가중치)를 조정해 학습한다. 학습이 끝난 뒤 성능을 재려고 따로 떼어 둔 것은 테스트(검증) 데이터다.\n함정 · 1번은 테스트 데이터, 2번은 가중치 초기화용 난수, 3번은 이론적 가상 데이터라 '수집한 실제 데이터'가 아니다.","2-12":"핵심 · D = {(xi, yi)}(i=1..N)는 '관측값 N개로 된 샘플'이라는 뜻이다. i는 몇 번째 관측값인지 가리키는 번호이고, 각 관측값은 특징벡터 xi와 레이블 yi의 쌍이다. 교안에서 반드시 외우라고 강조한 표기다.\n함정 · 2번은 i와 N의 역할을 바꿨고, 3번은 같은 값을 반복 측정한다고, 4번은 모델이 N개라고 잘못 읽었다.","2-13":"핵심 · 관측값 (xi, yi)에서 xi는 입력 특징을 모은 특징벡터, yi는 맞혀야 할 정답으로 참값·레이블·목표값이라 부른다. 지도학습은 xi를 넣었을 때 yi가 나오도록 모델을 학습하는 일이다.\n함정 · 2번은 둘을 뒤바꿨고, 3·4번의 목적함수·기울기·가중치·오프셋은 모델이나 학습 쪽 용어라 데이터 구성 요소가 아니다.","2-14":"핵심 · 특징벡터의 성분 수는 관측값을 설명하는 특징의 개수와 같다. 나이·성별·이름·학교코드 네 가지면 xi는 4차원이다. 레이블의 가짓수는 문제 유형이 정하며, 이진분류면 두 값 중 하나다.\n함정 · 1~3번은 특징 개수와 레이블 개수를 섞거나 뒤바꿨다. 특징 수(4)와 클래스 수(2)는 서로 독립이다.","2-15":"핵심 · 노름은 벡터 하나를 받아 0 이상의 스칼라 하나를 돌려주는 함수로, 벡터의 '크기(길이)'를 잰다. 어떤 방식으로 재느냐에 따라 l1, l2, l∞ 노름이 나뉜다.\n함정 · 1번 두 벡터의 각도는 내적과 cos로 구한다. 3번 순서 뒤집기나 4번 회전은 벡터를 벡터로 바꾸는 연산이라 스칼라를 내는 노름과 다르다.","2-16":"핵심 · 노름은 세 성질을 만족해야 한다. 상수배하면 크기도 |a|배가 되고(스케일링), 두 벡터 합의 크기는 각 크기의 합 이하이며(삼각 부등식), 값은 항상 0 이상이다(양의 함수).\n함정 · 3번은 등호를 강요한 '선형성'이다. 실제로는 부등식만 성립하며, 등호는 두 벡터가 같은 방향일 때만 된다.","2-17":"핵심 · lp 노름은 각 성분의 절댓값을 p제곱해 더한 뒤 1/p 제곱한다. p=1이면 절댓값의 합, p=2면 제곱합의 제곱근(유클리드 길이), p→∞면 가장 큰 절댓값만 남는다. 절댓값은 노름에만 붙고 내적에는 붙지 않는다.\n함정 · 3번은 절댓값과 p제곱을 빠뜨렸고, 1번과 4번은 p를 곱셈 계수로 잘못 썼다.","2-18":"핵심 · l∞ 노름은 성분의 절댓값 중 가장 큰 값이다. lp에서 p를 키우면 가장 큰 성분이 나머지를 압도하기 때문에 최댓값만 남는다. 세 노름을 '합(l1)·제곱합의 루트(l2)·최댓값(l∞)'으로 묶어 기억한다.\n함정 · 2번은 l1, 3번은 l2 노름이고, 4번 0이 아닌 성분 개수는 흔히 l0라 부르는 다른 척도다.","2-19":"핵심 · 같은 벡터라도 노름마다 값이 다르다. [1,2,3]이면 l1은 1+2+3=6, l2는 √(1+4+9)=√14, l∞는 최댓값 3이다. 계산 순서를 정확히 하고, 어느 노름을 묻는지부터 확인한다.\n함정 · 1번은 순서를 뒤바꿨고, 2번은 l1 대신 l2를, 4번은 l∞ 대신 l2를 넣었다.","2-20":"핵심 · l2 노름은 각 성분을 제곱해 더한 뒤 제곱근을 취한다. 제곱하면 음수 부호가 사라지므로 (−2)²=4다. √(4+9+36)=√49=7처럼 완전제곱수가 나오도록 출제되는 경우가 많다.\n함정 · 1번 11은 절댓값의 합인 l1이고, 2번은 l1에 루트를 씌운 혼합 오답, 3번 6은 최댓값인 l∞다.","2-21":"핵심 · 내적은 같은 위치 성분끼리 곱해 모두 더한 스칼라로, u^T v나 <u, v>로도 쓴다. 절댓값 없이 계산하므로 음수가 될 수 있고, 그 부호가 두 벡터의 방향 관계를 알려 준다.\n함정 · 2번은 더하지 않은 성분별 곱(아다마르 곱)으로 결과가 벡터다. 4번 u v^T는 행렬이 나오는 외적이고, 3번은 곱 대신 합을 썼다.","2-22":"핵심 · u·v = ||u|| ||v|| cos θ에서 ||·||는 l2 노름(유클리드 길이)이고 θ는 두 벡터 사이의 각이다. 강의에서 '노름은 2차가 기본'이라고 강조했듯 내적과 각도를 다룰 때는 l2를 쓴다.\n함정 · 1번 l1이나 3번 l∞는 이 식에 쓰지 않는다. 4번처럼 θ를 크기의 비로 보면 cos의 의미가 사라진다.","2-23":"핵심 · 내적은 순서를 바꿔도 값이 같은 대칭 연산이다. 성분별 곱 ui·vi = vi·ui이므로 u^T v = v^T u가 된다. 둘 다 '행벡터 × 열벡터'라 결과는 스칼라다.\n함정 · 1번은 부호가 바뀐다고 했고, 2번은 노름의 합을 썼다. 3번 u v^T는 행렬이 되는 외적이며 일반적으로 v u^T와도 다르다.","2-24":"핵심 · u·v = ||u|| ||v|| cos θ의 양변을 두 l2 노름의 곱으로 나누면 cos θ = (u·v)/(||u|| ||v||)가 된다. 각도 자체는 arccos로 구한다. 1이면 같은 방향, 0이면 직교, −1이면 반대 방향이다.\n함정 · 1번은 분자와 분모를 뒤집었고, 2번은 분모를 곱이 아닌 합으로, 4번은 분자를 내적이 아닌 벡터 합으로 썼다.","2-25":"핵심 · 직교는 두 벡터의 사잇각이 90도라는 뜻이다. cos 90° = 0이므로 내적도 0이 된다. 반대로 영벡터가 아닌 두 벡터의 내적이 0이면 직교한다고 판정할 수 있다.\n함정 · 1번 크기가 같음은 노름 이야기이고, 2번 같은 방향은 cos θ = 1인 경우다. 3번 합이 영벡터면 서로 반대 방향(cos θ = −1)이다.","2-26":"핵심 · 기계학습은 관측값을 벡터로 표현하므로 두 벡터의 cos θ로 유사한 정도를 잴 수 있다. 크기는 무시하고 방향만 비교하기 때문에 문서·임베딩 비교에 자주 쓰인다. 1에 가까울수록 비슷하다.\n함정 · 1번 성분 개수 비교나 3번 노름 변환은 유사도와 무관하고, 4번 레이블 자동 부여는 유사도를 활용한 응용이지 목적 그 자체가 아니다.","2-27":"핵심 · 내적은 성분별 곱의 합이다. 1·(−2) + 2·3 + 3·6 = −2 + 6 + 18 = 22. 음수 성분을 곱할 때 부호를 살려야 하며, 노름과 달리 절댓값을 씌우지 않는다.\n함정 · 4번 26은 −2를 +2로 계산한 값이고, 1번은 부호를 통째로 뒤집었다. 2번 7은 y의 l2 노름이라 다른 개념이다.","2-28":"핵심 · 코사인 유사도는 내적을 두 l2 노름의 곱으로 나눈 값이라 벡터 길이의 영향이 빠진다. 내적이 크더라도 상대 벡터가 길면 cos는 작아질 수 있다. 비교할 때는 반드시 정규화한 값으로 본다.\n함정 · 2번은 내적 크기만, 3번은 노름 크기만 보고 판단했다. 둘 다 방향 비교라는 코사인 유사도의 핵심을 놓쳤다.","2-29":"핵심 · 초평면은 주변 공간보다 차원이 하나 낮은 부분 공간이다. n차원 공간에서 n−1차원이며, 공간을 두 개의 절반 공간으로 가른다. 이 '가른다'는 성질 때문에 분류의 결정 경계로 쓰인다.\n함정 · 1번은 차원이 같고 3번은 하나 크다고 해 정의와 반대다. 4번처럼 2차원으로 고정되지 않고 공간 차원에 따라 달라진다.","2-30":"핵심 · 초평면 차원은 항상 공간 차원 − 1이다. 2차원 평면에서는 직선(1차원)이, 3차원 공간에서는 평면(2차원)이 공간을 둘로 나눈다. '초평면'이라는 이름에도 차원이 높으면 평면을 넘어선다는 뜻이 담겨 있다.\n함정 · 1번은 2·3차원의 짝을 뒤바꿨고, 2번은 한 차원씩 더 낮췄으며, 3번은 공간과 같은 차원이라 공간을 가르지 못한다.","2-31":"핵심 · 선형 분류에서 초평면 w·x + b = 0은 두 클래스를 가르는 결정 경계다. 새 관측값 x를 넣어 w·x + b의 부호가 양인지 음인지만 보면 클래스가 정해진다. w와 b는 훈련 데이터로 학습한다.\n함정 · 2번 정규화, 3번 데이터 개수, 4번 차원 증가는 초평면이 하는 일이 아니다. 초평면은 '판정 기준선' 역할만 한다.","2-32":"핵심 · 법선벡터 w와 초평면 위 한 점 x0가 있으면 w^T(x − x0) = 0이 초평면 식이다. 전개하면 w·x + b = 0 꼴이 되고 b = −w^T x0다. 원점에서 초평면까지 거리는 |b|/||w||로, 법선 길이로 나눠 정규화한 값이다.\n함정 · 1번은 b 부호가 틀렸고, 2번은 w를 바꿨으며, 4번은 x2 계수 부호가 틀렸다. 거리도 나눗셈이어야 한다.","2-33":"핵심 · 행렬은 수나 식을 m개의 가로 행과 n개의 세로 열로 배열한 것이다. 크기는 m×n 또는 (m, n)으로 쓰고 굵은 대문자로 나타낸다. 벡터는 1차원 배열, 행렬은 2차원 배열이라는 차이를 기억한다.\n함정 · 1번은 벡터, 2번은 내적 결과(스칼라), 4번은 초평면의 정의다.","2-34":"핵심 · 행렬 덧셈은 크기가 같은 두 행렬에서 같은 위치 성분끼리 더한다. 결과 크기도 그대로다. 행렬 곱처럼 행과 열을 엮지 않으므로 칸마다 하나씩만 맞춰 보면 된다.\n함정 · 1번은 한 행렬만 남겼고, 2번은 둘째 행 첫 칸을 1+7=8이 아닌 7로, 3번은 첫 행 셋째 칸 1+5=6을 1로 잘못 적었다.","2-35":"핵심 · AB가 정의되려면 A의 열 수와 B의 행 수가 같아야 한다. (n×k)·(k×m)처럼 가운데 k가 맞으면 결과는 바깥 크기 n×m이 된다. A의 행벡터와 B의 열벡터를 내적하므로 두 길이가 같아야 하기 때문이다.\n함정 · 1번은 덧셈 조건이고, 3번은 행과 열을 거꾸로 봤다. 4번처럼 정방 행렬일 필요는 없다.","2-36":"핵심 · 행렬 곱은 일반적으로 교환 법칙이 성립하지 않아 AB ≠ BA다. AB가 정의돼도 BA는 크기가 안 맞을 수 있고, 둘 다 정의돼도 값이 다른 경우가 대부분이다. 곱셈 순서 자체가 의미를 가진다.\n함정 · 3번처럼 정방 행렬이어도 일반적으로 다르다. 4번의 성분별 곱은 아다마르 곱으로 행렬 곱과 별개 연산이다.","2-37":"핵심 · (AB)ij는 A의 i번째 행과 B의 j번째 열의 내적이다. 2×3과 3×2를 곱하면 2×2가 된다. 첫 행 [2,3,4]와 둘째 열 [1000,100,10]의 내적은 2000+300+40 = 2340이다.\n함정 · 1번은 (1,2)를 잘못 더했고, 3번은 (2,1)을 1로 계산했다. 둘째 행 [1,0,0]과 첫째 열 [0,1,0]의 내적은 0이다.","2-38":"핵심 · 전치는 행과 열을 맞바꾸는 연산으로 (A^T)ij = Aji다. m×n 행렬을 전치하면 n×m이 되고, i번째 행이 i번째 열로 옮겨 간다. 두 번 전치하면 원래 행렬로 돌아온다.\n함정 · 1번은 부호 반전, 3번은 아무것도 바뀌지 않음, 4번은 성분별 역수로, 위치를 바꾸는 전치와 무관하다.","2-39":"핵심 · 곱의 전치는 순서가 뒤집혀 (AB)^T = B^T A^T다. 크기를 따져 보면 이해된다. A가 n×k, B가 k×m이면 (AB)^T는 m×n이고, 이를 만들 수 있는 곱은 B^T(m×k)·A^T(k×n)뿐이다.\n함정 · 덧셈의 전치(2번), 이중 전치(3번), 결합 법칙(4번)은 모두 옳은 속성이다. 1번만 순서를 그대로 둬서 틀렸다.","2-40":"핵심 · 정방 행렬은 행 수와 열 수가 같은 n×n 행렬이다. 역행렬, 항등행렬, 직교 행렬은 모두 정방 행렬을 전제로 정의된다. 모양에 대한 정의라는 점이 다른 특수 행렬과 다르다.\n함정 · 2번은 직교 행렬, 4번은 대각 행렬의 정의이고, 1번처럼 모든 원소가 1인 행렬은 따로 부르는 이름이 없다.","2-41":"핵심 · 항등행렬 In은 대각 성분이 1이고 나머지가 0인 n×n 정방 행렬이다. 어떤 행렬에 곱해도 AI = IA = A로 값이 그대로 남아 숫자 1과 같은 역할을 한다. 강의는 이 성질이 마스킹에 쓰인다고 설명했다.\n함정 · 1번 전부 1인 행렬은 곱하면 값이 바뀐다. 3번과 4번은 1의 위치가 대각선이 아니다.","2-42":"핵심 · A(m×n)·x(n×1)의 결과는 길이 m인 열벡터이고, i번째 성분은 A의 i번째 행 ai와 x의 내적 ai^T x다. 행 하나마다 내적 하나씩 계산한다고 보면 크기와 의미가 함께 정리된다.\n함정 · 1·2번은 결과 길이를 n으로 착각했고, 3번은 결과를 행렬로 봤다. 바깥 크기만 남으므로 m×1이다.","2-43":"핵심 · A(n×k)·B(k×m) = C(n×m)이다. 가운데 k가 맞아야 하고 결과에는 바깥 크기가 남는다. C의 (i, j) 성분은 A의 i번째 행과 B의 j번째 열의 내적이다. 크기 규칙과 성분 계산을 한 세트로 기억한다.\n함정 · 1번은 가운데 크기만 남겼고, 2번은 성분별 곱(아다마르 곱)으로 봤으며, 4번은 크기와 행·열 역할을 뒤집었다.","2-44":"핵심 · 행렬 덧셈은 같은 위치 성분끼리 더하며 결과 크기는 변하지 않는다. 음수 성분은 부호 그대로 더한다. 3+(−1)=2, 4+3=7처럼 칸마다 차근차근 계산한다.\n함정 · 2번은 마지막 칸 4+3을 6으로 잘못 더했고, 3번은 A−B를 계산했으며, 4번은 성분별 곱을 했다.","2-45":"핵심 · A가 2×3, B가 3×2면 가운데 3이 맞아 곱이 정의되고 결과는 2×2다. 각 성분은 A의 행과 B의 열의 내적이다. (2,2) 성분은 [3,1,4]·[5,1,2] = 15+1+8 = 24다.\n함정 · 2번은 (2,2)를 잘못 계산했고, 3번은 성분 배치를 뒤집었다. 4번은 크기가 맞는데도 정의되지 않는다고 했다.","2-46":"핵심 · 역행렬은 정방 행렬 A에 곱했을 때 항등행렬을 만드는 행렬로 A^(−1)A = AA^(−1) = I다. 수에서 a·(1/a) = 1인 것과 같은 역할이며, 왼쪽에서 곱하든 오른쪽에서 곱하든 I가 나와야 한다.\n함정 · 1번은 덧셈으로, 2번은 영행렬로 정의했다. 4번 A^(−1) = A^T는 직교 행렬에만 성립하는 특수한 경우다.","2-47":"핵심 · 역행렬을 두 번 취하면 원래 행렬로 돌아온다. 곱의 역행렬은 전치처럼 순서가 뒤집혀 (AB)^(−1) = B^(−1)A^(−1)이다. AB·B^(−1)A^(−1) = A(BB^(−1))A^(−1) = I로 확인할 수 있다.\n함정 · 1번은 곱의 순서를 그대로 뒀고, 2번과 3번은 이중 역행렬을 A^T나 I로 잘못 적었다.","2-48":"핵심 · 큰 행렬의 역행렬은 계산량이 많고, 수치 오차가 쌓여 결과가 불안정해질 수 있다. 그래서 실제로는 역행렬을 직접 구하기보다 다른 방법으로 우회하는 경우가 많다. 전치로 대신할 수 있는 것은 직교 행렬뿐이다.\n함정 · 1번과 3번은 비용과 안정성 문제를 부정했고, 4번은 직교 행렬에서만 되는 일을 모든 행렬로 일반화했다.","2-49":"핵심 · 직교 행렬은 역행렬이 전치행렬과 같은 정방 행렬로 A^T A = AA^T = I를 만족한다. 열벡터들이 서로 직교하고 길이가 1이라서 이런 성질이 생긴다. 역행렬을 전치만으로 구할 수 있어 계산이 쉽다.\n함정 · 1번은 이진 행렬, 2번은 특이 행렬, 4번은 직사각 행렬의 설명이다. 직교 행렬은 반드시 역행렬이 존재한다.","2-50":"핵심 · 텐서는 스칼라를 n차원으로 배열한 것이고, 축의 개수를 차수라 한다. 스칼라는 0차, 벡터는 1차, 행렬은 2차 텐서다. 강의에서는 3차원부터 흔히 텐서라고 부른다고 덧붙였다.\n함정 · 2번처럼 3차원만 가리키지 않으며, 3번은 차수를 하나씩 올렸다. 4번 정방 여부는 텐서 정의와 무관하다.","2-51":"핵심 · RGB 이미지는 너비·높이·채널 세 축을 가진 3차 텐서다. 채널 축 크기 3이 빨강·초록·파랑을 뜻하므로 224×224×3처럼 쓴다. 여러 장을 묶은 배치에 축이 하나 더 붙으면 4차 텐서가 된다.\n함정 · 2번은 흑백 이미지처럼 채널 축을 빠뜨렸고, 1번은 축을 하나로 펼쳤다. 4번의 시간 축은 동영상일 때나 붙는다.","2-52":"핵심 · 벡터에 실수 계수를 곱해 더한 a1·b1 + a2·b2를 선형 결합이라 한다. 결과는 같은 크기의 벡터다. 선형 결합으로 0을 만들 수 있는지에 따라 선형 독립과 종속이 갈린다.\n함정 · 1번 내적과 4번 노름은 결과가 스칼라이고, 3번 아다마르 곱은 계수 없이 성분끼리 곱한다.","2-53":"핵심 · 선형 독립은 a1v1 + … + akvk = 0이 모든 계수가 0일 때만 성립하는 경우다. 어느 벡터도 나머지 벡터의 조합으로 만들 수 없다는 뜻이다. 판정 기준은 벡터끼리의 합이나 곱이 아니라 계수다.\n함정 · 1번은 선형 종속의 정의다. 3번 직교는 독립의 충분조건일 뿐 정의가 아니며, 4번 노름은 관계가 없다.","2-54":"핵심 · 선형 종속은 0이 아닌 계수가 섞인 조합으로도 a1v1 + … + akvk = 0을 만들 수 있는 경우다. 결국 어떤 벡터가 다른 벡터들의 조합으로 표현된다는 뜻이다. v1=[1,0], v2=[2,0]이면 2v1 − v2 = 0이라 종속이다.\n함정 · 2번은 선형 독립의 정의다. 3번 개수 조건이나 4번 직교는 정의가 아니며, 직교하는 영 아닌 벡터들은 오히려 독립이다.","2-55":"핵심 · 도함수는 x가 h만큼 변할 때 함수값 변화량 f(x+h) − f(x)를 h로 나눈 뒤 h→0 극한을 취한 값이다. x에서의 순간 변화율, 즉 그래프 접선의 기울기로 해석한다.\n함정 · 2번은 분자를 차가 아닌 합으로, 4번은 분자와 분모를 뒤집었다. 1번은 f(h)를 빼고 x로 나눠 변화율 형태가 아니다.","2-56":"핵심 · f'(a)가 극한값으로 존재하면 f는 a에서 미분 가능하다. 구간 [a, b]의 모든 점에서 도함수가 존재해야 그 구간에서 미분 가능하다고 한다. 점 단위 정의를 구간 전체로 넓힌 것이다.\n함정 · 1번은 정의를 부정했고, 2번은 한 점만으로 구간 전체를 단정했다. 3번은 사실과도 다르다. |x|처럼 연속이어도 미분 불가능한 점이 있다.","2-57":"핵심 · 상수는 변하지 않으므로 도함수가 0이고, 선형 함수 ax는 기울기가 일정해 도함수가 a다. 이 두 규칙에 거듭제곱 규칙을 더하면 다항식은 모두 항별로 미분할 수 있다.\n함정 · 2번은 원래 함수를 그대로 남겼고, 3번은 상수 미분을 1로 썼으며, 4번은 선형 함수의 기울기까지 0으로 지웠다.","2-58":"핵심 · 거듭제곱 규칙 d/dx(x^n) = n·x^(n−1)은 지수를 앞으로 내려 곱하고 지수를 하나 줄인다. x³ → 3x², x² → 2x처럼 적용하며, n=1이면 선형 함수 규칙과도 맞아떨어진다.\n함정 · 1번은 계수 n을 빠뜨렸고, 2번은 지수를 늘렸으며, 4번은 적분과 비슷한 형태로 착각했다.","2-59":"핵심 · e^x는 미분해도 자기 자신인 특별한 함수이고, 자연로그 log(x)의 도함수는 1/x다. 둘 다 손실 함수나 확률 계산에서 자주 등장해 미분할 일이 많으니 그대로 외워 둔다.\n함정 · 1번과 4번은 거듭제곱 규칙을 지수 함수에 억지로 적용했고, 3번은 역수와 원래 변수를 뒤바꿨다.","2-60":"핵심 · 곱의 규칙은 (gh)' = g·h' + g'·h다. '한쪽은 그대로, 다른 쪽은 미분'한 두 항을 더한다고 기억하면 된다. 도함수끼리 곱하는 것으로는 성립하지 않는다.\n함정 · 1번은 도함수끼리 곱했고, 3번은 합의 미분 규칙과 혼동했다. 2번은 원래 곱에 도함수 곱을 더한 엉뚱한 형태다.","2-61":"핵심 · 연쇄 법칙은 합성 함수 g(h(x))를 미분할 때 바깥 함수의 도함수를 안쪽 값 h(x)에서 구하고 안쪽 함수의 도함수를 곱한다. 역전파가 층마다 미분을 곱해 가며 오차를 뒤로 보내는 것이 바로 이 원리다.\n함정 · 1번은 바깥 함수를 x에서 미분했고, 2번은 곱 대신 합을, 4번은 바깥 함수를 미분하지 않고 그대로 뒀다.","2-62":"핵심 · 2계 도함수는 1계 도함수를 한 번 더 미분한 것으로 d²f/dx²로 쓴다. 변화율이 다시 얼마나 변하는지, 즉 그래프가 위로 볼록한지 아래로 볼록한지를 알려 준다.\n함정 · 2번은 미분을 제곱으로 착각했고, 3번은 반대 연산인 적분이다. 4번은 서로 다른 두 변수로 편미분하는 혼합 편미분이다.","2-63":"핵심 · 함수가 물체의 변위(위치)를 나타낸다면 1차 도함수는 속도, 2차 도함수는 가속도다. 2차 미분은 변화율이 얼마나 변하는지를 수치로 나타낸다. 강의에서도 '위치→속도→가속도'로 직관을 잡았다.\n함정 · 1번은 미분하지 않은 위치 자체이고, 3번은 미분과 적분 방향을 뒤바꿨다. 2번처럼 항상 0이 되지는 않는다.","2-64":"핵심 · 다변량 함수는 변수 여러 개로 된 n차원 벡터를 입력받아 스칼라 하나를 내는 함수(f: R^n → R)다. 손실 함수가 대표적이다. 가중치 벡터 전체를 넣으면 오차값 하나가 나온다.\n함정 · 1번은 입출력이 뒤바뀐 벡터값 함수이고, 3번처럼 2차원으로 제한되지 않으며, 4번 행렬 입출력 함수는 다른 범주다.","2-65":"핵심 · 편미분 ∂y/∂xi는 i번째 변수 xi에만 h를 더해 움직이고 나머지는 고정한 채 구한 변화율이다. 여러 변수 중 하나의 영향만 떼어 보는 것이 핵심이다. 이렇게 구한 편미분을 모으면 기울기 벡터가 된다.\n함정 · 2번은 모든 변수를 한꺼번에 움직였고, 1번은 형태가 맞지 않는다. 3번은 분자와 분모를 뒤집었다.","2-66":"핵심 · 편미분을 실제로 계산할 때는 xi를 뺀 나머지 변수를 상수로 보고 xi에 대해서만 평범하게 미분한다. 예를 들어 f = x1²·x2를 x1로 편미분하면 x2를 상수로 두어 2x1·x2가 된다.\n함정 · 4번은 고정할 변수와 미분할 변수를 뒤바꿨다. 1번처럼 모두 미분해 더하지 않으며, 2번처럼 모두 상수로 두면 0이 된다.","2-67":"핵심 · 기울기(gradient)는 각 변수에 대한 편미분을 모아 만든 벡터 ∇f = [∂f/∂x1, …, ∂f/∂xn]^T다. 입력과 같은 차원을 가지며 함수가 가장 가파르게 증가하는 방향을 가리킨다. 경사하강법은 그 반대 방향으로 내려간다.\n함정 · 2번처럼 합쳐서 스칼라로 만들지 않는다. 3번 2계 편미분 행렬은 헤시안이고, 4번은 미분과 무관하다.","2-68":"핵심 · 기울기는 ∇(나블라, 델)로 쓰고 ∇x f(x)는 '벡터 x에 대한 f의 기울기'라고 읽는다. 기계학습에서는 이 기울기를 이용해 w ← w − η∇w처럼 가중치를 갱신한다. 딥러닝 논문에 자주 나오는 기호다.\n함정 · 1번 Σ는 합 기호이고, 3번 ∂는 편미분 하나를 나타내는 기호다. 4번은 전치(T)와 혼동했다.","2-69":"핵심 · 목적함수는 학습 목표를 수치로 표현한 함수다. 최소화 문제에서는 비용 함수·손실 함수·오류 함수라고도 부르며, 학습은 이 값을 가장 작게 만드는 인자(w, b)를 찾는 일이다.\n함정 · 2번은 이름만 다른 같은 개념을 별개라고 했다. 3번 학습 시간이나 4번 데이터 개수는 목적함수가 재는 대상이 아니다.","2-70":"핵심 · 경사하강법은 목적함수의 기울기를 구해 그 반대 방향으로 인자를 조금씩 옮기며 최적값을 찾는 방법이다. 경사가 가장 급한 내리막을 따라 손실이 줄어드는 쪽으로 가는 셈이다. 갱신 식은 w ← w − η∇w다.\n함정 · 1번 데이터 섞기, 2번 역행렬 계산, 3번 정규화는 모두 기울기로 인자를 탐색하는 일과 관계없다.","2-71":"핵심 · 임계점은 f'(x) = 0인 점이다. 도함수 부호가 음→양으로 바뀌면 최소, 양→음이면 최대이고, 양쪽 부호가 같으면 안장점이다. 최소와 최대를 묶어 극점이라 한다. 기울기가 0이라고 모두 최솟값은 아니다.\n함정 · 1번은 함숫값 f(x)가 0인 점(근)과 혼동했고, 3번은 2계 도함수 조건과 섞었다. 4번은 정의되지 않는 점이라 했다.","2-72":"핵심 · 임계점에서 f'' > 0이면 아래로 볼록해 최소, f'' < 0이면 위로 볼록해 최대다. f'' = 0이면 이것만으로 판정할 수 없다. x³처럼 안장점일 수도, x⁴처럼 최소일 수도 있다. 다변량에도 같은 개념이 적용된다.\n함정 · 1번은 부호와 결과를 뒤바꾸고 f''=0을 안장점으로 단정했다. 2번과 4번은 2계 도함수 판정법 자체를 부정했다.","2-73":"핵심 · 전역 최소는 정의역 전체에서 가장 작은 값이고, 지역 최소는 주변 작은 범위에서만 가장 작은 값이다. 기계학습의 목적 함수에는 지역 최소가 여러 개 있어서, 경사하강법이 한 곳에 빠지면 빠져나오기 어렵다.\n함정 · 1번은 지역 최소의 정의를 전역에 붙였다. 2번은 지역 최소가 하나라 했고, 4번은 쉽게 탈출한다고 해서 사실과 반대다.","2-74":"핵심 · 확률 변수는 표본 공간의 각 결과에 수를 대응시키는 함수다. 이름은 '변수'지만 정체는 함수라는 점이 핵심이다. 그 변수가 특정 값을 가질 확률을 알려 주는 함수는 확률 분포로 따로 부른다.\n함정 · 4번은 확률 분포, 3번은 공리의 정의다. 1번은 확률값 하나를 말한 것으로 함수가 아니다.","2-75":"핵심 · 주사위 눈은 1~6처럼 값을 셀 수 있으므로 이산형 확률 변수이고, 확률은 PMF로 각 값에 직접 매긴다. 사건은 {X = 5}, 확률은 P(X = 5)로 쓴다. 적분으로 확률을 구하는 것은 연속형일 때다.\n함정 · 1~3번은 교안의 정의역과 표기 그대로라 옳다. 4번은 주사위를 연속형으로 잘못 분류했다.","2-76":"핵심 · 확률 분포는 확률 변수가 각 값을 가질 확률을 알려 주는 함수이고, X ~ P(·)는 'X가 분포 P를 따른다'고 읽는다. 강의에서 가장 중요한 표기로 꼽은 P(X)와 ~ 기호는 생성 모델 논문에도 계속 나온다.\n함정 · 2번은 확률 변수의 정의를 분포에 붙였고 ~를 독립으로 읽었다. 3·4번은 평균, 분산, 정의역 크기와 혼동했다.","2-77":"핵심 · 이산형 확률 변수는 가질 수 있는 값이 유한하거나 1, 2, 3, …처럼 셀 수 있다. 동전 결과나 특정 눈이 나올 때까지 던진 횟수가 그 예다. 횟수는 끝이 없어도 셀 수 있으면 이산형이다.\n함정 · 1번 각도, 3번 키, 4번 시간은 값 사이가 끊김 없이 이어지는 연속 확률 변수의 예다.","2-78":"핵심 · 연속 확률 변수는 값이 끊김 없이 이어져서 어떤 구간에도 무한히 많은 값이 있다. 그래서 한 점의 확률은 0이고, 확률은 PDF를 구간에서 적분해 구한다. 교안의 예는 시침과 분침 사이의 각도다.\n함정 · 1·2·3번은 정수, 유한, 셀 수 있음처럼 모두 이산형 확률 변수의 특징이다.","2-79":"핵심 · 확률의 공리는 세 가지다. 모든 사건의 확률은 0 이상이고, 표본 공간 전체의 확률은 1이며, 서로소인 사건의 합집합 확률은 각 확률의 합이다. 덧셈 공리에는 '겹치지 않는다'는 조건이 반드시 붙는다.\n함정 · 1번은 서로소 조건을 지웠다. 겹치는 부분이 있으면 두 번 더해지므로 P(A1∩A2)를 빼야 한다.","2-80":"핵심 · PMF(확률 질량 함수)는 이산형 확률 변수의 각 값에 확률을 직접 매기는 함수다. 두 주사위 합 X라면 x ∈ {2, …, 12} 각각의 P(X = x)를 주며, 모두 더하면 1이 된다. 연속형은 PDF를 쓴다.\n함정 · 1번은 PDF의 설명이다. 2번 기대값과 4번 분산은 분포에서 계산하는 요약값이지 분포 함수 자체가 아니다.","2-81":"핵심 · 연속 확률 변수에서는 한 점의 확률이 0이므로, 구간 [a, b]에 들어갈 확률을 PDF를 그 구간에서 적분해 구한다. 그래프로 보면 밀도 곡선 아래 넓이가 확률이고, 전체 넓이는 1이다.\n함정 · 2번처럼 끝점 값을 더해서는 넓이가 나오지 않는다. 3번은 PMF와 미분을 썼고, 4번은 균등 분포에서만 맞는 특수한 경우다.","2-82":"핵심 · 기대값은 함숫값을 확률로 가중한 평균이다. 이산형은 Σ P(X)·f(X)로 더하고, 연속형은 ∫ P(X)·f(X) dX로 적분한다. '확률 × 값'의 구조는 같고 합이냐 적분이냐만 다르다.\n함정 · 1번은 합과 적분을 뒤바꿨고, 2번은 확률 가중을 빠뜨렸으며, 3번은 f(X)를 빠뜨려 확률의 총합(=1)만 남았다.","2-83":"핵심 · 분산은 값이 기대값에서 얼마나 퍼져 있는지를 나타내며, 편차 f(X) − E[f(X)]를 제곱한 값의 기대값이다. 제곱하는 이유는 양·음 편차가 서로 상쇄되지 않게 하기 위해서다. 보통 σ²으로 쓴다.\n함정 · 1번은 기대값 자체이고, 2번은 제곱과 기대를 빼먹었으며, 4번은 기대값의 제곱이다. E[X²] − (E[X])²과 헷갈리지 않는다.","2-84":"핵심 · 표준 편차는 분산의 제곱근으로 σ = √Var(X)다. 분산은 제곱을 거친 값이라 원래 단위의 제곱이 되므로, 루트를 씌워 원래 단위로 되돌린 것이 표준 편차다. 퍼짐을 직관적으로 읽을 때 쓴다.\n함정 · 1번은 분산을 한 번 더 제곱했고, 4번은 역수를 취했다. 3번 기대값은 중심을, 표준 편차는 퍼짐을 나타낸다.","2-85":"핵심 · 여러 확률 변수를 동시에 관측해 묶은 것을 다변량 확률 변수라 하고, 이를 벡터로 쓰면 확률 벡터라 한다. 자동차 한 대를 가격·배기량·연비·생산연도 네 확률 변수로 표현하는 것이 그 예다.\n함정 · 1번은 한 변수를 반복 관측한 것이라 다변량이 아니고, 2번처럼 두 개로 제한되지 않는다. 4번 정렬은 정의와 무관하다.","2-86":"핵심 · 결합 확률 p(x, y)는 X와 Y가 동시에 각 값을 가질 확률이다. 확률이므로 모든 값이 0 이상이고, 가능한 모든 (x, y) 쌍의 확률을 더하면 1이어야 한다. 단일 변수 분포의 조건이 그대로 확장된 것이다.\n함정 · 2번은 확률 범위를 벗어났고, 4번은 음수를 허용했다. 3번처럼 두 확률을 빼서는 결합 확률이 나오지 않는다.","2-87":"핵심 · 주변 확률 분포는 결합 분포에서 관심 없는 변수를 모두 더해(연속이면 적분해) 지운 단일 변수 분포다. P(X=x) = Σy P(X=x, Y=y)이며, 이 과정을 주변화라 한다. 표의 행이나 열 합계를 내는 것과 같다.\n함정 · 1번은 독립일 때의 곱 분해이고, 3번은 조건부 확률의 설명이다. 4번 최댓값 선택은 주변화가 아니다.","2-88":"핵심 · 조건부 확률 P(X|Y)는 Y가 이미 일어났다는 조건에서 X의 확률이다. 결합 확률을 조건 사건의 확률로 나눠 P(X, Y)/P(Y)로 구한다. 조건이 되는 쪽이 분모로 간다는 점이 핵심이며, 이 식을 뒤집으면 베이즈 정리가 된다.\n함정 · 1번 곱은 독립일 때의 결합 확률이고, 2번은 분자와 분모를 뒤집었으며, 3번은 나눗셈 대신 뺄셈을 썼다.","2-89":"핵심 · 곱셈 규칙 P(X, Y) = P(Y|X)P(X) = P(X|Y)P(Y)에서 두 식을 같다고 놓고 P(Y)로 나누면 베이즈 정리 P(X|Y) = P(Y|X)P(X)/P(Y)가 나온다. 조건의 방향을 뒤집는 공식이다.\n함정 · 1번은 분자의 P(X)를 P(Y)로 바꿨고, 3번은 식을 통째로 뒤집었다. 2번은 독립 가정의 곱과 합을 섞었다.","2-90":"핵심 · 베르누이 분포는 결과가 0 또는 1 하나인 이진 확률 변수의 분포다. P(X=1) = p, P(X=0) = 1−p이고, 이를 합쳐 p^x(1−p)^(1−x)로 쓴다. x에 1이나 0을 넣어 보면 두 경우가 그대로 나온다.\n함정 · 1번과 4번은 균등 분포의 설명이고, 3번은 평균과 분산으로 정의되는 가우시안 분포의 설명이다.","2-91":"핵심 · 균등 분포는 가능한 모든 값이 같은 확률을 갖는 분포다. 1부터 n까지 값을 취하면 각 확률이 1/n이고 X ~ U(n)으로 쓴다. n = 5면 각 값의 확률은 0.2다.\n함정 · 2번은 베르누이 분포, 3번은 가우시안 분포다. 4번은 값이 커질수록 확률이 줄어드는 분포라 '모두 같다'는 균등 분포와 정반대다.","2-92":"핵심 · 가우시안(정규) 분포는 평균 μ와 분산 σ² 두 인자로 정해지며 X ~ N(μ, σ²)로 쓴다. 평균에서 가장 높고 좌우 대칭인 종 모양이며, σ²이 클수록 넓게 퍼진다. 밀도 함수의 지수 부분에 (x−μ)²/(2σ²)가 들어간다.\n함정 · 1번은 연속 균등 분포, 2번은 베르누이 분포다. 4번은 분산을 빠뜨려 퍼짐을 표현할 수 없다.","2-93":"핵심 · import numpy as np는 numpy를 불러오면서 np라는 별칭을 붙이는 관례다. 이후 numpy.array 대신 np.array로 줄여 쓴다. as 뒤에 오는 것이 별칭이라는 순서를 기억한다.\n함정 · 1번 from … import *는 별칭 없이 이름을 통째로 가져오는 다른 문법이다. 3번은 순서를 뒤집었고, 4번 include는 C 언어 문법이다.","2-94":"핵심 · ndim은 배열이 몇 겹(차원)인지 알려 준다. 대괄호 수를 세면 되며, 괄호 없는 스칼라는 0, 한 겹인 벡터는 1, 두 겹인 행렬은 2다. 1.처럼 점이 붙으면 실수형이라는 것도 함께 알아 둔다.\n함정 · 1번과 2번은 스칼라를 1차원으로 셌다. 4번은 전체를 하나씩 낮춰 셌다.","2-95":"핵심 · shape은 각 축에 원소가 몇 개인지 알려 준다. 행 2개·열 3개면 (2, 3)이다. 대괄호가 한 겹인 [1,2,3]은 1차원 벡터라 (3,)이고, 두 겹인 [[1,2,3]]은 1행 3열 행렬이라 (1, 3)이다.\n함정 · 2번은 대괄호 두 겹을 벡터로 봤다. 1번은 행과 열을 뒤바꿨고, 3번은 행렬을 1차원으로 펼친 크기다.","2-96":"핵심 · np.zeros는 0으로, np.ones는 1로, np.full은 지정한 값으로 채운 배열을 만든다. np.arange(n)은 0부터 n−1까지의 정수다. np.random.random은 실행할 때마다 다른 난수를 내며, 같은 값을 원하면 시드를 고정한다.\n함정 · 2번 ones는 1로 채운다. 3번은 '0부터 시작'을 놓쳐 0~9가 아닌 1~10이라 했고, 4번은 난수의 성질과 반대다.","2-97":"핵심 · reshape는 원소 수를 유지한 채 배열 모양만 바꾼다. 그래서 새 모양의 원소 수 곱이 원래 원소 수와 같아야 한다. 인자로 −1을 주면 나머지 인자와 전체 원소 수로부터 그 축의 크기를 자동으로 계산한다.\n함정 · 2번은 10 = 5×2라 문제없이 된다. 3번 −1은 1로 만드는 것이 아니라 크기를 추정하라는 뜻이고, 1번 정렬은 sort의 일이다.","2-98":"핵심 · 슬라이싱 a[시작:끝:간격]에서 끝 인덱스는 포함하지 않는다. 음수 인덱스는 뒤에서부터 센다. a[:-8]은 0부터 뒤에서 8번째(인덱스 2) 직전까지라 [0 1]이고, a[-4:]는 마지막 4개다.\n함정 · 4번은 a[2:]의 결과로, :-8과 -8:의 방향을 혼동했다. 1~3번은 간격 2, 역순, 뒤에서 4개라는 올바른 결과다.","2-99":"핵심 · NumPy에서 *는 같은 위치 원소끼리 곱하는 아다마르 곱이라 결과 크기가 입력과 같다. 수학의 행렬 곱은 @ 또는 np.matmul로, (N×M)@(M×K) = N×K가 된다. 3×2 * 3×2가 3×2로 나오는 것이 아다마르 곱이라는 증거다.\n함정 · 1번은 두 연산을 같다고 했고, 3번은 역할을 뒤바꿨다. 4번처럼 *가 스칼라를 내지는 않으며, 원소별 곱의 결과는 배열이다.","2-100":"핵심 · np.transpose(a, [0, 2, 1])은 축 순서를 지정한 대로 바꾸는 전치이며, 여기서는 축 1과 축 2를 맞바꾼다. 값 자체는 그대로 두고 배치만 바꾼다. axis는 연산할 축, vstack·hstack은 쌓는 방향을 정한다.\n함정 · 3번은 전치를 정렬(np.sort)과 혼동했다. 1번 축 기준 합, 2번 쌓기, 4번 브로드캐스팅은 모두 옳은 설명이다.","3-1":"핵심 · 이 장은 선형 회귀 하나를 다룬다. 입력 하나로 직선을 맞추는 단순 선형 회귀에서 시작해 손실함수와 경사하강법을 거쳐, 특징이 여러 개인 다중 선형 회귀로 넓혀 가는 흐름이다.\n함정 · 2~4번(SVM·군집화·강화학습)은 이번 주 범위에 없는 다른 주제다.","3-2":"핵심 · 3주차 학습 목표는 회귀의 개념, 단순 선형 회귀와 손실함수, 경사하강법, 다중 선형 회귀 네 가지다. 모델을 정하고 손실로 틀린 정도를 잰 뒤 경사하강법으로 손실을 줄인다는 한 줄 흐름으로 묶어 기억하면 된다.\n함정 · 4번 의사결정나무는 이번 주에 다루지 않는다.","3-3":"핵심 · 답이 거리·가격처럼 연속적인 크기이면 회귀다. 이미지 예시에서 거리를 파랑(가까움)에서 빨강(멂)까지 색의 농도로 칠한 것은 픽셀마다 실수 값을 예측한 결과다.\n함정 · 1번 분류는 물체 종류별로 다른 색을 칠한 쪽이고, 3·4번은 정답 값이 없는 비지도 방법이다.","3-4":"핵심 · 분류는 답이 이름표(범주)인 문제다. 픽셀마다 '자동차·도로·사람' 같은 범주를 붙이면 세그멘테이션이 되고, 색은 크기가 아니라 종류를 구별하는 표시일 뿐이다.\n함정 · 1번 회귀는 거리처럼 연속값을 색의 농도로 나타낸 쪽이다.","3-5":"핵심 · 회귀와 분류는 둘 다 지도학습이고, 출력의 종류로 갈린다. 답이 숫자의 크기(가격·거리·몸무게)이면 회귀, 이름표(개/고양이, 스팸/정상)이면 분류다. 같은 이미지를 픽셀 단위로 다뤄도 출력이 무엇이냐에 따라 문제 유형이 달라진다.\n함정 · 3번처럼 회귀를 비지도학습으로 보면 틀린다. 2·4번처럼 표현 방식으로 구분하는 것도 기준이 아니다.","3-6":"핵심 · 집값 예시는 회귀의 두 관심사를 보여 준다. 크기와 가격이 어떤 관계인지 묻는 '관계', 새 크기에서 가격이 얼마일지 묻는 '예측'이다. 뒤에 나오는 회귀의 두 목적(예측·해석)과 같은 이야기다.\n함정 · 4번 탐색/활용은 강화학습, 2번은 전처리 용어다.","3-7":"핵심 · 회귀의 관심사는 두 가지다. 변수 사이의 경향(커지면 같이 커지는가)을 묻는 것은 관계(해석) 측면이고, 특정 입력값에 대한 출력값을 묻는 것은 예측 측면이다. 질문에 구체적인 숫자 입력이 있는지를 보면 구분된다.\n함정 · 1번 예측은 '크기가 1,202일 때'처럼 특정 입력을 줄 때다.","3-8":"핵심 · 구체적인 새 입력값(1,202)을 주고 출력값을 묻는 질문은 예측 측면이다. 반면 '크기가 크면 가격도 높은가'처럼 변화의 경향을 묻는 질문은 관계(해석) 측면이다.\n함정 · 1번 관계는 특정 값이 아니라 두 변수의 경향을 물을 때 해당한다.","3-9":"핵심 · 집값 표에서 입력 x는 크기(feet²), 출력 y는 가격(1,000$ 단위)이다. 가격 460은 46만 달러를 뜻한다. 단위를 함께 읽어야 회귀 계수가 '크기 1 feet²당 가격 몇 천 달러'인지 해석할 수 있다.\n함정 · 3·4번처럼 가격을 1$ 단위로 읽으면 값이 천 배 작아진다.","3-10":"핵심 · 집값 표는 (크기, 가격) 쌍으로 이뤄진 지도학습 데이터다. 2,104→460, 1,416→232, 1,534→315, 852→178이며 가격 단위는 1,000$다. 크기가 클수록 가격이 대체로 높아지는 경향이 보인다.\n함정 · 232·315·178은 다른 행의 가격이다.","3-11":"핵심 · 집값 표는 각 행이 입력과 정답이 짝지어진 (x_i, y_i) 한 쌍이다. 2,104→460, 1,416→232, 1,534→315, 852→178로, 크기가 커질수록 가격이 대체로 오른다.\n함정 · 2번은 순서를 뒤집었고, 1·4번은 다른 행의 가격을 섞었다.","3-12":"핵심 · 회귀는 독립 변수와 종속 변수의 관계를 분석하고, 새 입력의 출력을 예측하며, 독립 변수가 종속 변수에 주는 효과를 이해하는 방법이다. 모두 입력과 정답 쌍이 있는 지도학습이다.\n함정 · 4번 군집 나누기는 정답 없이 데이터를 묶는 비지도학습(군집화)이다.","3-13":"핵심 · 회귀의 기본 설정은 입력 x_i∈ℝ^d(실수 d개짜리 벡터), 출력 y_i∈ℝ(실수 하나, 스칼라)다. 산점도에서 가로축이 입력, 세로축이 출력이다. 기호를 정확히 읽는 것이 손실·경사하강법 식을 읽는 출발점이다.\n함정 · 2번 입력은 x_i 쪽이고, 3·4번 파라미터와 학습률은 축이 아니다.","3-14":"핵심 · ℝ^d에서 d는 입력 특징의 개수다. 가로축 하나에 입력, 세로축에 출력을 그린 2차원 산점도라면 입력 특징은 하나뿐이므로 d=1이다. 특징이 늘면 그림 하나로 그릴 수 없는 고차원이 된다.\n함정 · 3번 2는 그래프 축 개수(입력+출력)를 센 것이고, 4번 N은 데이터 개수다.","3-15":"핵심 · 지도학습 데이터셋은 입력 x_i와 정답 y_i가 짝지어진 쌍 N개의 모음, 즉 {(x_i, y_i)}_{i=1}^N이다. 정답이 함께 있어야 예측과의 차이(손실)를 계산할 수 있다.\n함정 · 1번은 정답이 없는 비지도 데이터다. 2번은 파라미터, 4번은 예측값이다.","3-16":"핵심 · 데이터셋 표기에서 N은 관측값의 개수(데이터셋 크기), d는 관측값 하나를 이루는 특징의 수(차원)다. 표로 보면 N은 행의 수, d는 특징 열의 수다.\n함정 · 2번 특징 벡터의 차원은 d다. 3·4번은 데이터셋 표기와 관계가 없다.","3-17":"핵심 · 표기의 기본은 N과 d의 구분이다. N은 데이터 개수(표의 행 수), d는 관측값 하나를 이루는 특징 수(열 수)이자 x_i∈ℝ^d의 차원이다. 단순 선형 회귀는 d=1인 경우다.\n함정 · 1번 데이터 개수는 N이다. 3·4번 반복 횟수나 손실 최솟값은 데이터셋 표기와 무관하다.","3-18":"핵심 · x_ij의 첫 첨자 i는 몇 번째 관측값(표의 행)인지, 둘째 첨자 j는 그 관측값의 몇 번째 특징(열)인지를 가리킨다. 그래서 x_ij는 i번째 데이터의 j번째 특징값 하나, 즉 스칼라다.\n함정 · 1번 출력은 y_i이고, 2번은 첨자 역할을 거꾸로 읽었다.","3-19":"핵심 · 출력은 벡터인 다변량 출력도 가능하지만 이 장에서는 y_i∈ℝ, 실수 하나로 한정한다. 입력은 d차원 벡터, 출력은 스칼라라는 것이 이 장의 기본 설정이다.\n함정 · 1번 0/1 값은 이진 분류의 출력이다. 2번 d차원 벡터는 입력 x_i 쪽 설명이다.","3-20":"핵심 · 입력 변수는 특징(Feature) 또는 독립 변수라고 부르고, 출력 변수는 종속 변수(목표값, Target)라고 부른다. 독립 변수의 값에 따라 종속 변수가 정해진다고 보는 것이다.\n함정 · 1번은 출력 변수의 다른 이름이고, 3번은 모델 파라미터, 4번은 예측과 정답의 차이다.","3-21":"핵심 · 출력 변수는 종속 변수라고도 하며, 정답·라벨·Target으로 부르기도 한다. 입력(독립 변수, 특징)에 따라 값이 결정된다는 뜻에서 '종속'이라는 이름이 붙었다.\n함정 · 2·3번은 입력 쪽 이름이고, 4번 학습률은 경사하강법의 보폭이다.","3-22":"핵심 · 회귀의 목적은 두 가지다. 새 입력에 대한 출력을 맞히는 예측 측면, 입력이 변할 때 출력이 어떻게 변하는지 이해하는 해석(관계) 측면이다. 계수의 부호와 크기를 읽는 것이 해석 측면이다.\n함정 · 2번 분류·군집은 다른 문제 유형이고, 1·3번은 회귀의 목적이 아니다.","3-23":"핵심 · 질문에 구체적인 입력값(170cm)이 있고 그때의 출력값을 묻는다면 예측 측면이다. '키가 크면 몸무게도 무거운가'처럼 변화의 경향을 묻는다면 해석(관계) 측면이다.\n함정 · 2번 해석은 특정 값이 아니라 경향을 물을 때 해당한다. 3·4번은 회귀의 목적이 아니다.","3-24":"핵심 · 회귀의 두 목적은 예측과 해석(관계)이다. 특정 입력의 출력값을 묻는 것은 예측이고, 입력이 변하면 출력이 어떻게 변하는지 묻는 것은 해석이다. 해석에서 읽어 내는 것은 상관관계일 뿐 인과는 아니다.\n함정 · 1번 예측이 되려면 '170cm일 때 몇 kg'처럼 구체적인 입력이 있어야 한다.","3-25":"핵심 · 회귀에서 학습이란 훈련 데이터로 입력을 넣으면 적합한 출력을 내는 함수, 즉 독립 변수와 종속 변수의 관계를 표현하는 함수를 찾는 과정이다. 선형 회귀에서는 그 함수를 직선으로 정해 두고 파라미터만 찾는다.\n함정 · 3번 손실은 최대가 아니라 최소로 만든다.","3-26":"핵심 · 훈련 데이터셋이 학습 과정을 거치면 함수 f가 나온다. 이 함수는 입력 x_i를 받아 정답 y_i에 가까운 값을 내도록 만들어진 것이다. 학습이 끝나면 새 입력을 이 함수에 넣어 추론(예측)한다.\n함정 · 1번 학습률은 사람이 정하는 값이고, 3번 x_i는 함수에 넣는 입력이다.","3-27":"핵심 · 학습의 목표는 모든 훈련 데이터 i에 대해 함수 값 f(x_i)가 정답 y_i에 가깝도록 하는 것이다. '같다'가 아니라 '근사(≈)'인 이유는 실제 데이터에 잡음이 있어 완전히 일치시킬 수 없기 때문이다.\n함정 · 3번은 입력과 출력을 거꾸로 썼다.","3-28":"핵심 · 상관관계는 두 변수가 함께 변하는 경향일 뿐이고, 한쪽이 다른 쪽의 원인이라는 인과관계와는 다르다. 회귀가 찾는 것은 상관관계다.\n함정 · 1번처럼 상관이 높다고 인과가 성립하지는 않는다. 숨은 제3의 요인이 두 변수를 함께 움직일 수도 있기 때문이다.","3-29":"핵심 · 회귀는 데이터에서 변수 사이의 상관관계를 찾을 뿐이다. 계수가 크다고 'x가 y를 일으킨다'고 결론 내리면 안 되고, 인과를 주장하려면 실험이나 인과 추론 설계가 따로 필요하다.\n함정 · 3번 독립 변수는 여러 개일 수 있고(다중 회귀), 1·4번은 강의에서 주의점으로 든 내용이 아니다.","3-30":"핵심 · 지구 평균 기온이 오르는 동안 해적 수가 줄어 두 그래프가 직선처럼 맞아 보이지만, 해적이 줄어서 기온이 오른 것은 아니다. 상관이 뚜렷해도 인과로 해석하면 안 된다는 것을 보여 주는 대표 사례다.\n함정 · 1번처럼 인과관계를 증명하려는 예시가 아니다.","3-31":"핵심 · 단순 선형 회귀는 입력의 차원이 1(d=1)일 때의 선형 모델이다. 특징 하나로 직선 f_w(x)=w_0+w_1x를 맞추며, 특징이 여러 개이면 다중 선형 회귀가 된다.\n함정 · 1번 출력 개수는 기준이 아니다(이 장의 출력은 늘 스칼라). 4번 파라미터는 w_0, w_1 두 개다.","3-32":"핵심 · 단순 선형 회귀 모델은 f_w(x_i)=w_0+w_1x_i, 절편 w_0와 기울기 w_1로 정해지는 직선이다. 학교에서 배운 y=ax+b와 같은 식으로, a가 w_1(가중치), b가 w_0(편향)에 해당한다.\n함정 · 2번은 x²항이 있어 직선이 아니다. 3·4번도 입력에 대해 선형인 직선 형태가 아니다.","3-33":"핵심 · 단순 선형 회귀의 파라미터 벡터는 w=[w_0 w_1]^T로 2개다. 절편 w_0와 기울기 w_1이 직선 하나를 결정한다. 특징이 d개인 다중 회귀로 가면 w_0~w_d, 즉 d+1개가 된다.\n함정 · 1·4번은 절편이나 기울기 하나를 빠뜨렸고, 2번은 특징이 2개일 때의 개수다.","3-34":"핵심 · 모델의 파라미터(매개변수)는 가중치(Weight)라고도 부른다. 입력에 곱해지는 기울기 w_1이 대표적인 가중치이고, 절편 w_0는 편향(Bias)이라고도 한다. 학습이란 결국 이 값들을 찾는 일이다.\n함정 · 2번 학습률은 사람이 정하는 하이퍼파라미터이고, 3번 특징은 입력값이다.","3-35":"핵심 · 입력은 원래 x_i∈ℝ^d인 벡터인데, d=1이면 성분이 하나뿐이라 x_i=[x_i1]을 그냥 실수 x_i로 써도 된다. 단순 선형 회귀에서 굵은 벡터 표기 대신 스칼라 표기를 쓰는 이유다.\n함정 · 2번 N은 데이터 개수라 입력 차원과 관계가 없다. 3번 출력이 스칼라인 것은 y_i 쪽 이야기다.","3-36":"핵심 · f_w(x)=w_0+w_1x에서 w_0는 x=0일 때의 값, 즉 직선이 세로축과 만나는 절편이다. 기울기 w_1은 x가 1 늘 때 출력이 얼마나 변하는지를 나타낸다. 두 값이 함께 직선의 위치와 기울기를 정한다.\n함정 · 1번 기울기는 w_1이다. 3번 손실 최솟값은 파라미터 공간에서 따지는 값이다.","3-37":"핵심 · 직선에서 x가 1만큼 늘 때 출력이 변하는 양이 기울기 w_1이다. 그래서 w_1은 '입력 한 단위당 출력 변화량'으로 해석되고, 다중 회귀에서는 각 가중치가 같은 의미를 갖는다.\n함정 · 1번 w_0는 절편이고, 2번 α는 경사하강법의 학습률이다.","3-38":"핵심 · f(x_i)는 모델이 계산한 예측값이라 ŷ_i('와이 햇')로도 쓴다. 정답 y_i와 예측 ŷ_i의 차이가 오차이고, 이를 모아 손실함수를 만든다. 실습 코드의 y_pred가 바로 ŷ다.\n함정 · 1번 L은 손실함수, 2번 α는 학습률, 3번 w_i는 파라미터 기호다.","3-39":"핵심 · 단순 선형 회귀 모델은 독립 변수(x)와 종속 변수(y)의 관계를 직선으로 나타낸다. 기울기는 x가 늘 때 y가 얼마나 변하는지, 절편은 x=0일 때의 기준값을 보여 준다.\n함정 · 2·3번 분산이나 확률 분포는 이 모델이 직접 그리는 대상이 아니고, 4번 데이터 개수와도 무관하다.","3-40":"핵심 · 파라미터가 정해지면 모델은 구체적인 직선이 된다. w_0=50, w_1=0.06이면 f_w(x)=50+0.06x이고, x=2000을 넣으면 50+0.06×2000=50+120=170이다.\n함정 · 1번은 기울기 항을 빠뜨렸고, 3번은 w_0와 w_1의 자리를 바꿨다. 4번은 부호가 틀렸다.","3-41":"핵심 · w_0=0이면 모델은 원점을 지나는 직선 f(x)=w_1x가 된다. 예측은 입력에 가중치를 곱하기만 하면 되므로 0.5×2=1이다. 파라미터가 하나뿐이라 손실을 w_1에 대한 1차원 곡선으로 그릴 수 있다.\n함정 · 4번은 곱하지 않고 더했고, 2번은 입력값을 그대로 쓴 것이다.","3-42":"핵심 · 직선은 기울기와 절편 두 값으로 결정되므로, 입력이 1차원이어도 파라미터는 w_0와 w_1 두 개다. w_0가 없으면 직선이 늘 원점을 지나야 해서 크기가 0이어도 값이 0이 아닌 데이터를 표현하지 못한다.\n함정 · 3번 학습률은 파라미터가 아니라 사람이 정하는 하이퍼파라미터다. 1번 출력은 스칼라 하나다.","3-43":"핵심 · 손실함수(Loss function)는 비용함수(Cost function), 훈련 목적함수라고도 부른다. 모두 모델의 예측이 정답과 얼마나 다른지를 하나의 숫자로 재는 함수다.\n함정 · 1번 활성화 함수는 신경망 뉴런의 출력에 적용하는 비선형 함수로, 손실함수와는 다른 개념이다.","3-44":"핵심 · 손실함수는 파라미터 w를 학습하는 기준이다. 어떤 w를 넣으면 오차가 얼마인지 알려 주므로, 이 값을 최소로 만드는 w를 찾는 것이 학습이 된다.\n함정 · 1번 차원 축소나 3번 데이터 증강은 손실함수의 역할이 아니다. 4번 범주 변환은 분류 모델의 출력 처리다.","3-45":"핵심 · 손실함수는 훈련 데이터에서 예측값 f_w(x_i)와 정답 y_i가 얼마나 다른지를 재는 값이다. 값이 작을수록 예측이 정답에 가깝다는 뜻이고, 그래서 손실을 최소로 만드는 w를 찾는다.\n함정 · 1번 파라미터 수나 4번 데이터 수는 손실 값의 의미와 관계가 없다. 데이터가 많다고 손실이 작아지지는 않는다.","3-46":"핵심 · 손실함수의 출발점은 훈련 데이터를 이용해 예측 f_w(x_i)가 정답 y_i에 가까워지도록 w를 정하자는 것이다. '가까움'을 숫자로 재기 위해 오차를 제곱해 평균 낸 MSE 같은 손실을 정의한다.\n함정 · 1~3번은 셔플·차원 고정·정규화로 데이터를 다루는 이야기이고, 파라미터를 정하는 기준이 아니다.","3-47":"핵심 · 단순 선형 회귀의 손실은 MSE, L(w)=(1/N)Σ(f_w(x_i)−y_i)²다. 오차를 제곱해 부호를 없애고, 모두 더한 뒤 N으로 나눠 평균을 낸다.\n함정 · 2번은 제곱이 없어 양과 음의 오차가 서로 상쇄된다. 3번은 차이가 아니라 합이고, 4번은 차이가 아니라 곱이다.","3-48":"핵심 · 1/N을 곱하면 오차 제곱의 합이 데이터 한 개당 평균이 된다. 그래서 데이터 수가 달라도 손실을 같은 척도로 비교할 수 있다. 최소가 되는 w의 위치는 1/N이 있든 없든 같다.\n함정 · 1번 손실은 최소화의 대상이고, 3번 학습률 조절은 1/N의 역할이 아니다.","3-49":"핵심 · 최적 파라미터 w*는 손실을 가장 작게 만드는 w, 즉 w*=argmin_w L(w)다. argmin은 최솟값 자체가 아니라 최솟값을 만드는 '위치(w)'를 돌려준다는 점이 중요하다.\n함정 · 1번 argmax는 손실을 최대로 만드는 w다. 2·4번은 손실을 나누거나 더한 값일 뿐 최적 위치가 아니다.","3-50":"핵심 · MSE=(1/N)Σ(f_w(x_i)−y_i)²는 오차를 제곱해 평균 낸 값이다. 제곱 덕분에 큰 오차가 더 크게 벌점을 받고, 미분하면 2(ŷ−y)로 깔끔하게 떨어져 경사하강법에 쓰기 좋다.\n함정 · 1번은 절댓값을 쓴 MAE다. 2번은 1/N이 빠진 제곱합이고, 3번은 차이가 아니라 합을 제곱했다.","3-51":"핵심 · MAE=(1/N)Σ|f_w(x_i)−y_i|는 오차의 절댓값을 평균 낸 값이다. 오차가 커져도 벌점이 비례해서만 늘어나므로, 제곱을 쓰는 MSE보다 이상치의 영향을 덜 받는다.\n함정 · 2번은 MSE다. 3번은 절댓값을 다시 제곱했고 1/N도 빠졌다. 4번 세제곱은 부호가 남는다.","3-52":"핵심 · MSE와 MAE는 둘 다 1/N로 평균을 내고, 오차를 처리하는 방식만 다르다. MSE는 제곱해 큰 오차를 크게 벌주고 미분이 쉬우며, MAE는 절댓값이라 이상치에 덜 민감하다.\n함정 · 1번처럼 평균 여부로 갈리는 것이 아니다. 3·4번처럼 쓰임새가 갈리지도 않으며, 둘 다 회귀 손실이다.","3-53":"핵심 · 회귀의 대표 손실함수는 MSE(평균 제곱 오차)와 MAE(평균 절대 오차)다. 다른 손실함수도 많지만 이 둘이 기본이고, 이 장의 경사하강법은 미분이 쉬운 MSE를 쓴다.\n함정 · 1번은 분류에서 쓰는 손실이고, 4번 정확도·재현율은 분류 평가 지표다.","3-54":"핵심 · 손실함수는 MSE와 MAE 외에도 다양하지만, 회귀에서는 이 둘이 대표적이다. 어떤 손실이든 파라미터 w의 함수이며, 값이 작을수록 예측이 정답에 가깝다.\n함정 · 1번 MSE만 있는 것이 아니다. 2번 손실은 w에 따라 달라지고, 3번 값이 클수록 예측이 부정확하다.","3-55":"핵심 · w_0=0으로 고정하면 모델은 원점을 지나는 f(x)=w_1x가 되고, 손실 L(w_1)=(1/N)Σ(w_1x_i−y_i)²는 w_1 하나의 함수가 된다. 파라미터가 하나라 손실을 2차원 포물선으로 그릴 수 있다.\n함정 · 2번은 w_0를 남겼고 제곱도 없다. 4번은 손실 식이 아니라 최적화 목표를 쓴 것이다.","3-56":"핵심 · 파라미터가 w_1 하나여도 목표는 같다. 손실 L(w_1)을 가장 작게 만드는 w_1을 찾는 것, 즉 w_1*=argmin L(w_1)이다. 손실 곡선의 바닥이 가리키는 가로축 위치가 답이다.\n함정 · 1번 argmax는 손실을 키우는 방향이다. 3번은 모델 출력을 최소화하는 식이라 목표가 다르다.","3-57":"핵심 · MSE는 '예측 → 오차 → 제곱 → 평균' 순서로 계산한다. w_1=0.5이면 예측은 0.5, 1, 1.5, 오차는 −0.5, −1, −1.5, 제곱은 0.25, 1, 2.25다. 합 3.5를 N=3으로 나누면 약 1.17이다.\n함정 · 4번 3.5는 N으로 나누기 전의 제곱합이다.","3-58":"핵심 · w_1=1이면 f(x)=x가 세 점 (1,1),(2,2),(3,3)을 모두 지나므로 오차가 전부 0이고 MSE도 0이다. 손실이 0이 되는 w_1=1이 이 데이터의 최적 파라미터다. w_1이 1에서 멀어질수록 손실이 커진다.\n함정 · 1번 약 1.17은 w_1=0.5일 때의 값이다.","3-59":"핵심 · 두 그래프는 보는 공간이 다르다. f_w(x)는 w를 고정한 채 x에 따른 예측을 그린 데이터 공간의 직선이고, L(w)는 데이터를 고정한 채 w에 따른 손실을 그린 파라미터 공간의 곡선이다. 파라미터 공간의 점 하나가 데이터 공간의 직선 하나에 대응한다.\n함정 · 2번은 두 그래프를 거꾸로 설명했다.","3-60":"핵심 · MSE는 w_0, w_1에 대한 2차식이라 손실을 3차원으로 그리면 아래로 볼록한 그릇 모양이 된다. 바닥이 하나뿐인 볼록 함수라서 경사하강법으로 내려가면 그 최솟값에 도달할 수 있다.\n함정 · 4번은 위아래가 뒤집힌 모양이다. 1·3번 평면이나 계단은 제곱 오차에서 나올 수 없다.","3-61":"핵심 · 등고선은 그릇 모양 손실 곡면을 위에서 내려다본 그림이다. 같은 곡선 위의 점은 손실 값이 같고, 안쪽 곡선으로 갈수록 손실이 작아지며 중심이 최솟값이다.\n함정 · 1번은 바깥쪽 곡선의 설명이다. 2·4번 발산이나 학습률은 등고선이 나타내는 값이 아니다.","3-62":"핵심 · 등고선의 중심(Minimum)은 손실을 가장 작게 만드는 (w_0, w_1)이다. 그 파라미터로 그린 직선이 데이터 공간에서 훈련 데이터의 추세를 가장 잘 따라간다. 파라미터 공간의 점이 데이터 공간의 직선과 대응한다는 관점이다.\n함정 · 3번 이 지점의 기울기는 최대가 아니라 0이다.","3-63":"핵심 · 경사하강법은 손실 L(w)를 최소화하는 w*=[w_0* w_1*]^T를 찾는 반복 절차다. 정답을 한 번에 구하는 대신, 현재 위치에서 손실이 줄어드는 방향으로 조금씩 w를 옮긴다.\n함정 · 2번 최대화는 경사상승법이다. 3·4번 데이터 수나 차원을 바꾸는 것은 목적이 아니다.","3-64":"핵심 · 가장 단순한 방법은 후보 w를 몇 개 정해 손실을 비교하는 것이다. 하지만 어떤 범위를 얼마나 촘촘히 볼지 정하기 어렵고, 파라미터가 늘면 후보 수가 폭발한다. 그래서 기울기를 따라 이동하는 경사하강법을 쓴다.\n함정 · 1번 손실 계산은 가능하다. 문제는 후보를 고르는 일이다.","3-65":"핵심 · 한 점에서의 기울기는 그 점에서 그은 접선의 기울기, 즉 미분값이다. 기울기의 부호는 함수가 증가하는지 감소하는지를, 크기는 얼마나 가파른지를 알려 준다.\n함정 · 1번 함수값 자체나 2번 평균은 기울기가 아니다. 4번 최솟값에서는 오히려 기울기가 0이다.","3-66":"핵심 · 기울기는 함수를 가장 크게 증가시키는 방향을 가리킨다. 손실을 줄이려면 그 반대인 음의 기울기(−∂L/∂w) 방향으로 가야 하고, 이것이 경사하강법이 '−'를 쓰는 이유다.\n함정 · 1번은 음의 기울기 방향의 설명이다. 2번 값이 변하지 않는 방향은 등고선을 따라가는 방향이다.","3-67":"핵심 · 기울기 ∂L/∂w는 손실이 가장 빠르게 커지는 방향이므로, 부호를 뒤집은 −∂L/∂w가 손실을 가장 빠르게 줄이는 방향이다. 이 방향으로 조금씩 움직이는 것이 경사하강이다.\n함정 · 2번은 −를 붙이기 전 기울기의 방향이다. 4번 학습률은 방향이 아니라 보폭을 정한다.","3-68":"핵심 · 경사하강법은 (1) 초기값 w를 정해 출발하고, (2) 종료조건을 만족할 때까지 손실이 줄어드는 방향으로 w를 반복 갱신한다. 출발점이 있어야 그 위치의 기울기를 계산할 수 있다.\n함정 · 3번 최솟값을 미리 알면 경사하강법이 필요 없다. 4번 학습률이 0이면 w가 전혀 움직이지 않는다.","3-69":"핵심 · 경사하강법은 임의의 초기값에서 출발하며, 교안은 예시로 w_0=0, w_1=1을 들었다. 초기값은 정답이 아니라 출발점일 뿐이고, 이후 기울기를 따라 반복 갱신하며 최솟값으로 다가간다.\n함정 · 1·2·4번은 교안이 예로 든 값이 아니다. 초기값은 경우에 따라 달라질 수 있다.","3-70":"핵심 · 두 번째 단계는 반복이다. 현재 w에서 기울기를 구하고, 손실이 줄어드는 방향(음의 기울기)으로 w를 갱신하며, 종료조건을 만족할 때까지 이를 되풀이한다.\n함정 · 1번은 증가 방향인 데다 한 번만 한다. 2번 학습률을 매번 두 배로 늘리는 규칙은 없다.","3-71":"핵심 · 손실 곡면을 산이라고 보면, 경사하강법은 지금 서 있는 곳에서 가장 가파른 내리막(음의 기울기)을 골라 한 걸음씩 내려가는 방법이다. 산 전체를 보지 않고 발밑의 경사만으로 방향을 정한다.\n함정 · 2번 정상 찾기는 반대 방향이고, 4번처럼 모든 위치를 계산하는 것은 후보 탐색 방식이다.","3-72":"핵심 · 경사하강법은 세 가지 질문으로 정리된다. 어디서 시작하나(초기화), 어느 방향으로 가나(기울기), 얼마큼 가나(학습률)다. '시작'은 초기화에 해당하고, 초기값에 따라 결과가 달라질 수 있다.\n함정 · 1번 기울기는 방향, 3번 학습률은 이동량에 대응한다.","3-73":"핵심 · 업데이트 방향은 기울기가 정한다. 정확히는 손실을 가장 빠르게 줄이는 음의 기울기 방향이다. 세 질문은 시작(초기화), 방향(기울기), 이동량(학습률)으로 짝지어진다.\n함정 · 2번 학습률은 방향이 아니라 보폭을 정한다. 4번 손실함수는 기울기를 계산하는 대상이다.","3-74":"핵심 · 한 번에 얼마나 움직일지는 학습률 α가 정한다. 실제 이동량은 α×기울기라서, 같은 기울기에서도 α가 크면 크게, 작으면 작게 움직인다. α는 사람이 정하는 하이퍼파라미터다.\n함정 · 1번 기울기는 방향을 정하고, 2번 초기화는 시작 위치를 정한다.","3-75":"핵심 · 경사하강법의 세 질문은 시작 위치(초기화), 업데이트 방향(기울기), 이동량(학습률)이다. 갱신식 w←w−α∂L/∂w에서 시작 w가 초기화, ∂L/∂w가 방향, α가 보폭에 해당한다고 대응시키면 외우기 쉽다.\n함정 · 4번은 방향과 이동량을 뒤바꿨고, 2·3번은 짝을 모두 섞었다.","3-76":"핵심 · 경사하강법은 출발점 근처의 기울기만 보고 내려가므로, 초기값에 따라 도착하는 지점이 달라질 수 있다. 손실 곡면이 울퉁불퉁하면 지역 최솟값에 갇힐 수 있어서 초기 상태가 중요한 이슈다.\n함정 · 1번은 볼록한 MSE 곡면에서만 기대할 수 있는 일이고, 3·4번처럼 정해진 규칙은 없다.","3-77":"핵심 · 갱신식은 '새 값 = 현재 값 − 학습률 × 기울기'다. w_0←w_0−α∂L/∂w_0에서 −는 손실이 줄어드는 방향으로 가게 하고, α는 보폭을 정한다. w_0와 w_1은 같은 단계에서 함께 갱신한다.\n함정 · 1번 +는 손실이 커지는 방향이다. 2번은 α가 빠졌고, 4번은 α를 엉뚱하게 w_0에 곱했다.","3-78":"핵심 · 각 파라미터는 자기 자신에 대한 편미분으로 갱신한다. w_1←w_1−α∂L/∂w_1처럼 학습률과 기울기를 곱한 값을 현재 값에서 뺀다. 이 형태는 파라미터가 늘어도 똑같다.\n함정 · 1번 +는 손실을 키운다. 2번은 w_0에 대한 편미분을 썼고, 3번은 빼지 않고 곱했다.","3-79":"핵심 · 갱신식에서 α는 학습률(보폭), ∂L/∂w_1은 기울기(방향과 경사의 크기)다. α는 사람이 미리 정하는 하이퍼파라미터이고, 기울기는 매 단계 데이터로 계산한다.\n함정 · 2번 기울기는 편미분 항 쪽이다. 3번 손실 값은 L(w) 자체로, 갱신식에 직접 들어가지 않는다.","3-80":"핵심 · 경사하강법은 정해진 종료조건을 만족할 때까지 갱신을 반복한다. 반복 횟수를 정해 두는 for 루프, 손실 변화가 충분히 작아질 때까지 도는 while 루프가 대표적이다.\n함정 · 1번 손실이 증가할 때까지가 아니라 줄어드는 쪽으로 반복한다. 4번 기울기는 최소점에 가까울수록 0에 가까워진다.","3-81":"핵심 · 갱신식 w_1←w_1−α∂L/∂w_1에서 α는 늘 양수다. 기울기가 양수이면 최솟값의 오른쪽에 있다는 뜻이므로 w_1이 작아져 왼쪽으로 이동한다. 기울기 부호와 관계없이 −α×기울기는 항상 최솟값 쪽을 가리킨다.\n함정 · 1번은 기울기가 음수일 때의 결과다. 4번 부호가 바뀌는지는 크기에 달린 일이지 규칙이 아니다.","3-82":"핵심 · 기울기가 음수이면 최솟값의 왼쪽에 있다는 뜻이다. 음수를 빼면 더하는 것과 같으므로 w_1이 커져 오른쪽, 즉 최솟값 쪽으로 이동한다. 부호가 어떻든 경사하강법은 손실이 줄어드는 쪽으로 움직인다.\n함정 · 1번은 기울기가 양수일 때다. 3번 변하지 않는 것은 기울기가 0일 때다.","3-83":"핵심 · 학습률 α는 한 번 갱신할 때의 보폭이다. 너무 작으면 한 걸음이 작아 최솟값에 도달하기까지 반복이 많이 필요하다. 즉 학습이 천천히 진행되지만 방향은 맞다.\n함정 · 2번 발산은 α가 너무 클 때 생긴다. 3번 기울기는 α가 아니라 현재 위치에서 정해진다.","3-84":"핵심 · α가 너무 크면 한 걸음에 최솟값을 지나쳐 반대편으로 넘어가고, 그 과정이 반복되며 진동하거나 손실이 오히려 커져 발산한다. 적당한 α는 너무 느리지도, 튕겨 나가지도 않는 값이다.\n함정 · 1번 느려지는 것은 α가 너무 작을 때다. 3번처럼 크다고 정확히 도달하지는 않는다.","3-85":"핵심 · 기울기가 0인 곳에서는 갱신량 α×0=0이라 w가 더 움직이지 않는다. 그곳이 지역 최솟값이나 평평한 구간이어도 멈추므로, 전역 최솟값을 보장하지 못한다는 것이 경사하강법의 한계다. 그래서 초기값이 중요하다.\n함정 · 2번처럼 멈춘 곳이 반드시 최솟값은 아니다. 1번 학습률은 자동으로 바뀌지 않는다.","3-86":"핵심 · 기울기는 미분 df(x)/dx로 구하며, x를 Δx만큼 움직일 때 f가 변하는 비율 Δf/Δx에서 Δx를 0으로 보낸 접선의 기울기다. 경사하강법은 이 값을 각 파라미터에 대해 편미분으로 구해 쓴다.\n함정 · 1번 함수값이나 3번 평균은 기울기가 아니다. 2번 Δx만으로는 변화율을 알 수 없다.","3-87":"핵심 · 다중 선형 회귀는 여러 특징으로 하나의 출력을 예측한다. 집값 예시의 특징은 크기, 방의 수, 층 수, 집 연식 네 가지(d=4)이고 가격이 출력 y다. 특징마다 가중치가 하나씩 붙는다.\n함정 · 3번 소유자의 나이는 표에 없는 특징이다.","3-88":"핵심 · 다중 회귀 표는 한 행이 데이터 하나(x_i, y_i)이고, 특징 네 개(크기·방·층·연식)와 가격이 들어 있다. 첫 행 (2104, 5, 1, 45)의 가격은 460(1,000$ 단위)이다. 단순 회귀 표와 크기·가격 값이 같다.\n함정 · 232·315·178은 다른 행의 가격이다.","3-89":"핵심 · 표에서 한 행이 x_i 하나, 열이 각 특징이다. 크기 852인 행은 방의 수 2, 층 수 1, 집 연식 36, 가격 178이다. 행과 열을 짚는 것이 곧 x_ij 표기를 읽는 연습이다.\n함정 · 1번은 1,534행의 일부, 3번은 2,104행, 4번은 1,416행의 가격을 섞었다.","3-90":"핵심 · 다중 회귀에서 x_i는 i번째 훈련 데이터의 입력 전체, 즉 특징 벡터(표의 한 행)이다. x_ij는 그 벡터의 j번째 성분, 즉 i번째 데이터의 j번째 특징값(한 칸)이다.\n함정 · 1번 출력은 y_i이고 파라미터는 w_j다. 2번 특징 수는 d, 데이터 수는 N이다.","3-91":"핵심 · 다중 선형 회귀는 특징마다 가중치를 곱해 더하고 절편 w_0를 더한다. 특징이 4개면 f_w(x_i)=w_0+w_1x_i1+w_2x_i2+w_3x_i3+w_4x_i4이고, 파라미터는 d+1=5개다.\n함정 · 1번은 특징을 서로 곱해 선형이 아니고, 2번은 입력이 없다. 3번은 단순 선형 회귀 식이다.","3-92":"핵심 · 선형 모델의 각 가중치는 다른 특징을 고정했을 때 해당 특징이 1 늘면 출력이 얼마나 변하는지를 나타낸다. x_i4(연식)의 계수가 −2이면 연식이 1년 늘 때 예측 가격이 2(천 달러) 줄어든다.\n함정 · 2번은 부호를 반대로 읽었다. 4번 −2는 특징값이 아니라 가중치다.","3-93":"핵심 · 다중 회귀 예측은 각 특징에 가중치를 곱해 모두 더한다. 80+0.1×1000+0.01×200+5×2−2×40=80+100+2+10−80=112다. 음수 계수 항은 빼야 한다.\n함정 · 4번 192는 −2×40을 빼지 않고 더한 값이다. 1·3번은 중간 계산에서 실수한 값이다.","3-94":"핵심 · x_i0=1이라는 가짜 특징을 하나 추가하면 절편도 w_0x_i0 꼴이 되어 모든 항이 w_jx_ij로 같아진다. 그래서 전체 식을 내적 w^Tx_i 하나로 쓸 수 있다. 실습의 설계행렬에 1로 된 열을 붙이는 것이 같은 원리다.\n함정 · 1번 w_0=0은 절편을 없애 버리는 것이다.","3-95":"핵심 · x_i0=1을 맨 앞에 추가하면 입력은 [x_i0 x_i1 … x_id]^T, 파라미터는 [w_0 w_1 … w_d]^T가 되어 둘 다 성분이 d+1개다. 차원이 같아야 내적 w^Tx_i를 계산할 수 있다.\n함정 · 2·3번처럼 한쪽만 d+1차원이면 내적이 정의되지 않는다. 1번은 x_i0를 추가하기 전의 입력 차원이다.","3-96":"핵심 · x_i0=1로 두면 f_w(x_i)=Σ_{j=0}^d w_jx_ij=w^Tx_i, 즉 파라미터 벡터와 입력 벡터의 내적 하나로 쓸 수 있다. 특징이 몇 개든 같은 식으로 표현되고, 코드에서는 행렬 곱 X@w 한 번으로 계산된다.\n함정 · 3번은 절편만 남긴 식이다. 2·4번은 내적이 아니라서 스칼라 예측값이 나오지 않는다.","3-97":"핵심 · 다중 선형 회귀의 손실도 단순 회귀와 같은 MSE, L(w)=(1/N)Σ(f_w(x_i)−y_i)²다. 바뀐 것은 모델이 f_w(x_i)=w^Tx_i가 되었다는 점뿐이고, 손실의 형태와 의미는 그대로다.\n함정 · 1번은 1/N이 빠진 절댓값 합이고, 3번은 제곱이 없으며 오차 대신 합을 썼다. 4번은 예측이 빠졌다.","3-98":"핵심 · 다중 회귀에서도 각 파라미터는 자기 자신에 대한 편미분으로 갱신한다. w_j←w_j−α∂L/∂w_j를 j=0부터 d까지 모든 파라미터에 동시에 적용한다.\n함정 · 1번 +는 손실이 커지는 방향이다. 2번은 모든 w_j를 w_0의 기울기로 갱신하는 오류다. 4번은 현재 값 w_j를 빠뜨렸다.","3-99":"핵심 · (f_w(x_i)−y_i)²를 w_j로 미분하면 제곱에서 2가 나오고, 연쇄법칙으로 f_w(x_i)=w^Tx_i의 w_j 편미분인 x_ij가 곱해진다. 그래서 ∂L/∂w_j=(2/N)Σ(f_w(x_i)−y_i)x_ij다. w_0에서는 x_i0=1이라 x_ij가 사라진 꼴이 된다.\n함정 · 3번은 2가 빠졌고, 1·2번은 x_ij가 빠졌다(w_0에만 맞는 식).","3-100":"핵심 · 단순 회귀와 다중 회귀의 경사하강법은 틀이 같다. 반복문 안에서 학습률과 편미분으로 각 파라미터를 갱신한다. 차이는 갱신할 파라미터가 w_0, w_1 두 개인지, w_0부터 w_d까지 d+1개인지뿐이다.\n함정 · 1~3번처럼 어느 한쪽이 기울기나 학습률, 갱신을 쓰지 않는 일은 없다.","4-1":"핵심 · 단순 선형회귀는 입력이 실수 하나뿐이라 예측값이 절편 w₀와 기울기 w₁로 이루어진 1차식 w₀ + w₁xᵢ가 된다. 그래프로 보면 직선 하나로 데이터를 설명하는 모델이다.\n함정 · 2번은 제곱항이 들어간 다항식이고, 3번처럼 σ를 씌우면 로지스틱 회귀가 된다.","4-2":"핵심 · 모델 식에서 xᵢ는 데이터가 주는 입력이고, w₀와 w₁은 모델이 어떻게 동작할지를 정하는 인자(파라미터)다. 학습이란 바로 이 인자 값을 데이터로부터 정하는 과정이다.\n함정 · 1번 손실값은 인자를 평가한 결과이고, 4번 레이블은 분류에서 정답에 해당한다.","4-3":"핵심 · 학습은 손실함수 L(w)가 가장 작아지는 w를 찾는 최적화 문제로 표현되며, 이를 w* = argmin L(w)로 쓴다. 손실은 예측이 얼마나 틀렸는지를 재므로 작을수록 좋다.\n함정 · 4번처럼 손실을 최대화하면 오히려 가장 나쁜 모델을 찾는 셈이고, 1번처럼 0으로 고정할 수는 없다.","4-4":"핵심 · 선형회귀의 손실은 각 관측의 오차(ŷᵢ − yᵢ)를 제곱해 평균한 평균제곱오차(MSE)다. 제곱을 하므로 오차의 부호가 상쇄되지 않고 큰 오차일수록 더 크게 벌을 받는다.\n함정 · 1번의 로그 확률 합은 로지스틱 회귀의 우도 쪽 개념이고, 3번은 가중치 크기라 오차와 무관하다.","4-5":"핵심 · 경사하강법은 손실이 줄어드는 방향, 즉 기울기의 반대 방향으로 인자를 조금씩 옮긴다. 그래서 현재 값에서 학습률 α × 편미분을 빼는 w ← w − α·∂L/∂w 꼴이 된다.\n함정 · 1번은 미분이 아니라 손실값 자체를 더하고, 3번은 현재 값 w₀를 빼먹어 이전 위치를 잃어버린다.","4-6":"핵심 · argmin L(w)는 '손실을 최소로 만드는 w'라는 목표를 적은 기호일 뿐이고, 경사하강법은 그 w를 실제로 찾아가는 반복 절차다. 한 번에 공식으로 푸는 대신 갱신을 되풀이해 최솟값에 다가간다.\n함정 · 1번은 최댓값과 해석적 공식이라는 두 군데가 틀렸고, 2번·3번은 셔플·차원 축소라는 다른 기법이다.","4-7":"핵심 · 다중 선형회귀는 특징이 d개일 때 각 특징에 고유 가중치를 곱해 모두 더하고 절편 w₀를 더한다. 특징마다 결과에 미치는 영향의 크기를 가중치가 따로 나타낸다.\n함정 · 2번은 곱셈 결합이라 선형이 아니고, 3번에는 가중치가 아예 없으며, 4번은 첫 특징 하나만 제곱해 쓴다.","4-8":"핵심 · 특징 벡터 맨 앞에 상수 1을 붙여 [1 xᵢ₁ … x_id]ᵀ로 두면 w₀·1 = w₀가 되어 절편이 내적 안으로 들어간다. 그래서 절편을 따로 쓰지 않고 ŷᵢ = wᵀxᵢ 한 줄로 표기할 수 있다.\n함정 · 4번 정규화는 값의 범위를 맞추는 전처리일 뿐 표기와는 관계없고, 1번처럼 가중치를 같게 둘 필요도 없다.","4-9":"핵심 · 분류는 여러 특성 값으로 설명되는 개체가 미리 정해진 클래스 중 어디에 속하는지 맞히는 작업이다. 출력이 연속값인 회귀와 달리, 분류의 출력은 이산적인 레이블이다.\n함정 · 2번은 회귀의 정의이고, 1번 군집과 4번 차원 축소는 레이블이 없는 비지도 학습 작업이다.","4-10":"핵심 · 분류는 클래스 목록이 사전에 정해져 있고 모든 개체가 그중 정확히 하나에 속한다고 전제한다. 그래서 학습 데이터의 레이블도 그 목록 안의 값으로만 주어진다.\n함정 · 2번은 반대로 모든 개체를 같은 특징 집합으로 설명해야 하고, 3번처럼 2개로 제한되지 않으며 4번처럼 학습 중에 클래스가 새로 생기지도 않는다.","4-11":"핵심 · 분류 데이터 D는 (특징 벡터 xᵢ, 레이블 yᵢ) 쌍 N개로 이루어지며, yᵢ는 {C₁, …, C_K} 중 하나다. 레이블이 유한한 이산값이라는 점이 회귀와 갈리는 지점이다.\n함정 · 1~3번은 모두 맞는 설명이고, yᵢ가 실수 전체 범위를 갖는 것은 회귀의 정답 형태다.","4-12":"핵심 · yᵢ ∈ {C₁, …, C_K}에서 K는 사전에 식별된 클래스의 개수다. 특징 개수는 d, 데이터 개수는 N이므로 기호마다 무엇을 세는지 구분해 두어야 한다.\n함정 · 1번 특징 개수는 d, 3번 학습 데이터 개수는 N이며, 4번 반복 횟수는 경사하강법 쪽 개념이다.","4-13":"핵심 · 두 클래스 문제에서는 먼저 C₁ = 스팸, C₂ = 스팸 아님처럼 기호를 정해 두고, 실제 데이터에서는 C₁을 1, C₂를 0이라는 숫자로 적는다. 이 1/0 표기가 뒤에서 베르누이 분포와 CE 식에 그대로 쓰인다.\n함정 · 1번처럼 둘 다 1로 두면 구분이 안 되고, 3번의 −1/+1은 이 강의의 표기가 아니다.","4-14":"핵심 · 레이블을 1과 0으로 적는 것은 학습 데이터를 표기하고 관리할 때 구체적인 숫자가 편하기 때문이다. 숫자 자체에 크기의 의미가 있는 것은 아니고 그저 클래스 이름표 역할을 한다.\n함정 · 1번처럼 확률을 저장하는 것이 아니며, 3번·4번처럼 클래스 수나 특징 공간 차원을 바꾸지도 않는다.","4-15":"핵심 · 모든 개체를 같은 특징들로 관측하면 각 개체를 특징 값을 순서대로 늘어놓은 벡터 하나로 나타낼 수 있다. 이것이 특징 벡터이며 관측 하나당 벡터 하나가 대응한다.\n함정 · 1번 가중치 벡터는 모델의 인자 w이고, 2번은 기울기 벡터, 4번은 레이블 모음이라 관측 값 자체가 아니다.","4-16":"핵심 · 특징 벡터는 정해진 순서대로 특징 값을 채워 만든다. 여기서는 [학과 코드, 평점] 순서이므로 인공지능학과(1), 평점 3.8이면 [1 3.8]ᵀ이 된다.\n함정 · 2번은 성분 순서를 뒤집었고, 3번은 평점을, 4번은 학과 코드를 잘못 넣었다.","4-17":"핵심 · 같은 규칙 [학과 코드, 평점]을 그대로 적용하면 수학과는 3, 평점은 4.0이므로 [3 4.0]ᵀ이다. 특징 벡터는 순서와 코드표가 고정되어 있어야 개체끼리 비교가 가능하다.\n함정 · 2번·4번은 학과 코드를 1, 2로 잘못 옮겼고, 3번은 물리학과 코드 4에 평점까지 바뀌었다.","4-18":"핵심 · 학과처럼 범주로 된 정보는 컴퓨터가 계산할 수 있도록 1, 2, 3, 4 같은 숫자로 바꿔 표현한다. 이때 숫자는 이름표일 뿐이라 크기나 순서의 의미는 없다.\n함정 · 3번처럼 우열을 나타내는 것이 아니며, 1번 단위 맞추기나 2번 차원 축소와도 관계없다.","4-19":"핵심 · 특징 공간은 특징 벡터들을 점으로 찍어 보는 공간이며, 각 좌표축이 특징 하나에 대응한다. 분류는 이 공간을 클래스별 영역으로 나누는 문제로 바꿔 볼 수 있다.\n함정 · 2번 손실함수 곡면은 인자 공간에서 그리는 것이고, 4번 레이블 표는 데이터 저장 형태일 뿐이다.","4-20":"핵심 · 특징 공간의 차원은 특징 벡터의 성분 개수 d와 같다. 특징이 하나 늘면 좌표축이 하나 늘어나는 셈이다.\n함정 · 4번처럼 관측 값 개수 N과 혼동하기 쉽지만, N은 공간에 찍히는 점의 개수일 뿐 차원과는 무관하다.","4-21":"핵심 · 특징 벡터의 성분 값이 곧 좌표이므로, 관측 값 하나는 d차원 특징 공간의 점 하나로 표시된다. 데이터 전체는 그 공간에 흩어진 점들의 모임이 된다.\n함정 · 4번 직선은 오히려 공간을 나누는 구분선 쪽 개념이고, 1번 확률 분포는 여러 관측을 모았을 때의 이야기다.","4-22":"핵심 · 특징 공간의 좌표축은 관측한 특징 하나하나다. 대학생을 학과와 평점으로 관측했으니 두 축은 학과와 평점(학점)이 되고, 공간은 2차원이다.\n함정 · 4번의 클래스 레이블은 축이 아니라 점의 색이나 모양으로 표시되는 정보이고, 1번·3번은 관측하지 않은 특징이다.","4-23":"핵심 · 특징 공간의 차원은 관측하는 특징의 개수로 정해진다. 학과·평점에 학년이 더해져 특징이 3개가 되면 각 개체는 3차원 공간의 점이 된다.\n함정 · 4번처럼 2차원에 머무르지 않으며, 특징이 늘었다고 2번처럼 차원이 줄어들 이유도 없다.","4-24":"핵심 · 특징 벡터의 성분은 학과 코드 같은 정수나 평점 3.8 같은 실수 등 어떤 수치든 될 수 있다. 0/1로만 적는 것은 레이블 쪽 약속이지 특징 값의 제약이 아니다.\n함정 · 1~3번은 모두 맞는 설명이다. 4번은 특징과 레이블의 표기 규칙을 섞어 버린 오답이다.","4-25":"핵심 · 개체마다 관측한 특징 값들을 모아 놓은 것이 데이터다. 이 데이터에서 모델은 손실을 줄이는 방향으로 가중치를 학습한다.\n함정 · 1번 학습률, 3번 손실함수, 4번 가중치 벡터는 모두 학습 알고리즘이나 모델 쪽 요소라 관측에서 직접 나오지 않는다.","4-26":"핵심 · 특징 벡터의 성분 값이 특징 공간의 좌표이므로, 성분 값이 다르면 서로 다른 점으로 찍힌다. 두 학생은 같은 2차원 공간에 있되 좌표만 다르다.\n함정 · 2번 레이블은 점의 위치가 아니라 표시 방식에 영향을 주고, 3번처럼 두 개체의 차원이 다를 수는 없다.","4-27":"핵심 · 관측 하나는 특징 벡터 하나이고, 그 벡터는 특징 공간의 한 점이다. 공간의 차원은 벡터 성분 개수 d로 정해지며 데이터 개수나 클래스 수와는 관계없다.\n함정 · 1번 구분선은 판별 함수 g(x) = 0이 만드는 것이고, 2번 클래스 수와 3번 데이터 수 N은 차원을 정하지 않는다.","4-28":"핵심 · 인공지능학과의 학과 코드는 1이므로 세 학생의 특징 벡터 첫 성분은 모두 1이고 평점만 2.2, 3.8, 3.9로 다르다. 그림에서는 학과 축 1 위에 세로로 늘어선 점들이 된다.\n함정 · 1번은 수학과 학생 [3 4.0]ᵀ이 섞였고, 2번·4번은 학과 코드를 2, 3으로 잘못 넣었다.","4-29":"핵심 · 수강 여부 같은 두 클래스 레이블은 수강 = 1, 미수강 = 0처럼 숫자로 적는다. 스팸 예제와 같은 1/0 표기 규칙이다.\n함정 · 3번은 1과 0을 거꾸로 붙였고, 1번 −1/+1이나 2번 확률값은 이 예제의 표기가 아니다.","4-30":"핵심 · 조사 결과 인공지능학과 학생은 아무도 정수론을 듣지 않았으므로 셋 다 미수강 레이블 0을 갖는다. 같은 학과 학생들이 같은 클래스로 모이기 때문에 학과 축으로 두 클래스가 갈린다.\n함정 · 2번의 1은 수강생 레이블이고, 4번처럼 학생마다 다르지 않다.","4-31":"핵심 · 수학과 코드는 3이므로 세 학생의 첫 성분은 모두 3이고 평점은 2.2, 4.0, 3.2다. 첫 성분이 학과, 둘째가 평점이라는 순서가 고정되어 있다는 점을 기억하면 된다.\n함정 · 1번은 물리학과(4), 3번은 인공지능학과(1) 코드이고, 4번은 한 학생만 코드가 달라 일관성이 없다.","4-32":"핵심 · 선형 구분 가능한 데이터에서는 두 클래스를 가르는 직선이 하나로 정해지지 않고 여러 개가 가능하다. 그래서 어떤 기준으로 '좋은' 경계를 고를지가 학습 방법마다 달라진다.\n함정 · 2번처럼 선마다 특징을 따로 맡는 것이 아니며, 4번처럼 항상 두 개가 필요한 것도 아니다.","4-33":"핵심 · 확률 분포 기반 분류는 체조 동아리 회원/비회원이라는 두 클래스의 몸무게 분포를 비교해 소속을 판단하는 예제로 설명된다. 특징 공간을 나누는 정수론 예제와 대비되는 두 번째 접근이다.\n함정 · 2번·3번은 선형 판별 함수 예제이고, 4번 스팸은 레이블 표기를 설명할 때 쓴 예다.","4-34":"핵심 · 체조 동아리 예제는 회원과 비회원의 몸무게 분포 히스토그램을 이용한다. 몸무게라는 특징 하나만 쓰므로 1차원 특징 공간 위의 분류 문제다.\n함정 · 1번 평점·4번 학과는 정수론 예제의 특징이고, 2번 키는 이 예제에 등장하지 않는다.","4-35":"핵심 · 사후 확률 P(C₁|x)는 관측 x를 본 뒤 그 개체가 C₁에 속할 가능성을 나타내는 조건부 확률이다. 분류 규칙은 결국 이 값을 클래스끼리 비교하는 것이다.\n함정 · 1번은 사전확률 P(C₁), 3번은 우도 P(x|C₁), 4번은 결합확률 P(C₁, x)로, 조건이 걸린 방향이 각각 다르다.","4-36":"핵심 · 베이즈 규칙은 P(C₁|x) = P(C₁, x)/P(x)에서 출발해 분자를 우도 × 사전확률로, 분모 P(x)를 두 클래스에 대한 합으로 풀어 쓴 것이다. 그래서 분모는 '분자 + 다른 클래스의 같은 항'이 된다.\n함정 · 2번은 사전확률을 곱하지 않고 나눴고, 1번·3번은 곱셈과 덧셈 구조부터 틀렸다.","4-37":"핵심 · 클래스가 C₁, C₂ 둘뿐이면 x가 어느 한쪽에는 반드시 속하므로 두 사후 확률의 합은 1이다. 따라서 P(C₂|x) = 1 − P(C₁|x)이며, 로지스틱 회귀에서는 1 − σ(wᵀx)가 된다.\n함정 · 3번 역수나 4번 음수는 확률의 범위 0~1을 벗어날 수 있어 확률이 될 수 없다.","4-38":"핵심 · 확률 기반 분류 규칙은 두 사후 확률을 비교해 큰 쪽 클래스를 고르는 것이다. P(C₁|x) > P(C₂|x)이면 C₁, 아니면 C₂로 결정한다.\n함정 · 1번은 우도 P(x|C₁)를, 2번은 x와 무관한 사전확률을 비교하므로 관측을 반영한 사후 확률 비교가 아니다. 3번은 부등호 방향이 반대다.","4-39":"핵심 · 두 클래스에서는 P(C₂|x) = 1 − P(C₁|x)이므로 P(C₁|x) > 1 − P(C₁|x)를 정리하면 P(C₁|x) > 0.5가 된다. 그래서 로지스틱 회귀의 예측은 확률 0.5를 기준으로 자른다.\n함정 · 2번·3번은 사전확률·우도와 비교하는 다른 조건이고, 4번은 확률이 1을 넘을 수 없어 성립하지 않는다.","4-40":"핵심 · 사후 확률을 베이즈 규칙으로 계산하려면 사전확률 P(C₁), P(C₂)와 우도 P(x|C₁), P(x|C₂)가 있어야 한다. 이 네 값만 있으면 분자와 분모를 모두 채울 수 있다.\n함정 · 3번 학습률 α는 경사하강법에서 보폭을 정하는 값이라 확률 계산과는 관계없다.","4-41":"핵심 · 모든 개체가 C₁ 또는 C₂에 속하므로 x의 주변확률 P(x)는 두 결합확률의 합 P(C₁, x) + P(C₂, x)로 나뉜다. 각 결합확률을 우도 × 사전확률로 바꾸면 베이즈 규칙의 분모가 된다.\n함정 · 1번 사후 확률의 합은 x와 무관하게 1이고, 2번 차나 4번 곱은 '둘 중 하나'를 합하는 확률 규칙에 맞지 않는다.","4-42":"핵심 · 히스토그램은 체조부 소속과 미소속 학생들의 몸무게를 구간별 비율로 나타낸 것으로, 클래스별 P(x|C) 모양을 눈으로 보여 준다. 두 분포가 겹치는 정도를 보면 분류가 얼마나 어려운지 감이 온다.\n함정 · 2번 학점이나 3번 시간 변화는 이 예제의 축이 아니고, 4번은 학습 곡선이다.","4-43":"핵심 · 선형 판별 함수는 가중치 벡터 w와 특징 벡터 x의 내적 g(x) = wᵀx로 정의된다. 바이어스가 x₀ = 1로 들어가 있어 결국 w₀ + w₁x₁ + … + w_dx_d와 같다.\n함정 · 1번 σ(x)는 로지스틱 함수, 3번은 로그 오드 형태이고, 2번은 거리 계산이라 선형 판별이 아니다.","4-44":"핵심 · 특징 d개에 바이어스용 성분 x₀ = 1을 하나 더 붙이므로 x는 d + 1개 성분이 된다. 내적이 성립하려면 w도 같은 길이여야 하므로 w₀ ~ w_d의 d + 1개다.\n함정 · 1번은 바이어스를 빠뜨렸고, 3번·4번처럼 두 벡터 길이가 다르면 내적을 계산할 수 없다.","4-45":"핵심 · 특징 벡터에 바이어스 자리 x₀를 만들어 1로 고정하면 w₀x₀ = w₀가 되어 절편이 내적에 흡수된다. 학습되는 것은 w₀이고 x₀는 늘 1이다.\n함정 · 1번처럼 학습하는 것은 x₀가 아니라 w₀이고, 3번처럼 0으로 두면 절편이 사라진다.","4-46":"핵심 · w·x와 wᵀx는 같은 연산, 즉 두 벡터의 대응 성분을 곱해 모두 더하는 내적을 나타낸다. 결과는 벡터가 아니라 스칼라 하나다.\n함정 · 1번 외적은 벡터를 돌려주고, 3번 성분별 나눗셈이나 4번 합성곱은 전혀 다른 연산이다.","4-47":"핵심 · wᵀx = w₀x₀ + w₁x₁ + w₂x₂ + w₃x₃이고 x₀ = 1이므로 첫 항은 w₀가 된다. 바이어스를 내적에 넣는 표기를 풀어 보면 다시 익숙한 절편 + 가중합 꼴로 돌아온다.\n함정 · 1번은 w₀를 빠뜨렸고, 2번은 특징을 곱하지 않았으며, 4번은 첨자를 한 칸씩 어긋나게 짝지었다.","4-48":"핵심 · 이진 분류는 개체가 C₁, C₂ 두 클래스 중 하나에 속하는 분류다. '이진'은 클래스가 2개라는 뜻이지 입력 차원이나 특징 개수를 가리키지 않는다.\n함정 · 2번·3번은 '2'를 특징 쪽에 갖다 붙인 오해이고, 4번은 일반적인 다중 클래스 분류다.","4-49":"핵심 · 선형 판별 함수는 부호로 클래스를 정한다. g(x) > 0이면 C₁, 그 외(0 이하)면 C₂이며, g(x) = 0인 점들이 경계다. 로지스틱 회귀에서 σ(wᵀx) > 0.5와 wᵀx > 0이 같은 조건이라는 것도 여기서 이어진다.\n함정 · 2번은 기준을 1로 잘못 잡았고, 3번은 부등호가 반대, 4번은 경계 위 점만 C₁으로 본다.","4-50":"핵심 · g(x) = 0이 만드는 경계는 특징 공간보다 한 차원 낮은 도형이다. 2차원 공간은 1차원인 선(직선)으로 두 영역이 나뉜다.\n함정 · 1번 평면은 3차원, 2번 초평면은 4차원 이상, 3번 점은 1차원 공간의 경계다.","4-51":"핵심 · 1차원 특징 공간은 수직선이므로 그 위의 점 하나(구분점)를 기준으로 양쪽 두 영역으로 갈린다. 몸무게 하나로 동아리 회원을 가르는 경우가 이에 해당한다.\n함정 · 4번 선은 2차원, 1번 평면은 3차원 공간을 나누는 도형이다.","4-52":"핵심 · 3차원 특징 공간은 2차원 도형인 평면으로 나뉜다. 경계는 늘 공간보다 한 차원 낮다는 규칙을 기억하면 된다.\n함정 · 1번 선은 2차원 공간의 경계이고, 3번 구는 곡면이라 선형 판별 함수로는 만들어지지 않는다.","4-53":"핵심 · 4차원 이상의 공간에서도 g(x) = 0은 공간을 둘로 나누는 한 차원 낮은 경계이며, 이를 초평면(hyperplane)이라 부른다. 눈으로 그릴 수 없을 뿐 선·평면을 일반화한 같은 개념이다.\n함정 · 1번 선, 2번 평면, 4번 점은 각각 2·3·1차원 공간의 경계다.","4-54":"핵심 · 경계의 모양은 1차원-점, 2차원-선, 3차원-평면, 4차원 이상-초평면으로 대응한다. 모두 특징 공간보다 한 차원 낮은 도형이라는 공통 규칙이 있다.\n함정 · 1·3·4번은 맞는 대응이다. 4차원 이상에서는 선이 아니라 초평면이 경계다.","4-55":"핵심 · 구분선은 g(x)를 0으로 두어 얻는다. 정수론 예제에서는 학과 x₁에 20, 학점 x₂에 3을 곱하고 36을 빼는 g(x) = 20x₁ + 3x₂ − 36 = 0이 경계다. 이 선 위쪽(양수)이 수강생, 아래쪽(음수)이 미수강생 영역이다.\n함정 · 2번은 두 계수를 뒤바꿨고, 3번은 부호가 틀렸다.","4-56":"핵심 · w는 바이어스를 맨 앞에 두는 [w₀ w₁ w₂]ᵀ 순서로 적는다. g(x) = −36 + 20x₁ + 3x₂이므로 w₀ = −36, w₁ = 20, w₂ = 3이다.\n함정 · 3번은 바이어스를 맨 뒤에 놓았고, 1번은 바이어스 부호를 잃었으며, 2번은 계수 순서도 섞였다.","4-57":"핵심 · 판별 함수에 특징 값을 대입하면 경계의 어느 쪽인지 알 수 있다. 20×1 + 3×3.8 − 36 = 20 + 11.4 − 36 = −4.6으로 음수이므로 C₂(미수강) 영역이다.\n함정 · 1번 양수는 20×1을 크게 잡는 등 계산을 틀렸을 때 나오고, 3번 0은 경계 위에 있다는 뜻이다.","4-58":"핵심 · 20×3 + 3×2.2 − 36 = 60 + 6.6 − 36 = 30.6으로 양수이므로 수학과 학생은 수강생 쪽(C₁)에 놓인다. 학과 계수 20이 커서 학과 코드가 결과를 크게 좌우한다.\n함정 · 2번 −4.6은 인공지능학과 학생 [1 3.8]ᵀ의 값이고, 4번은 부호를 거꾸로 했다.","4-59":"핵심 · g(x) = 0을 만족하는 점들의 모임이 두 클래스를 나누는 결정 경계다. 그 한쪽은 g > 0(C₁), 다른 쪽은 g < 0(C₂) 영역이 된다.\n함정 · 1번 클래스 중심이나 3번 사후 확률 1과는 관계없다. 로지스틱 회귀에서 g = 0은 오히려 확률이 0.5인 지점이다.","4-60":"핵심 · 판별 함수의 부호가 곧 예측 클래스다. 정수론 예제에서는 g(x)가 양수면 수강생, 음수면 미수강생으로 구분한다.\n함정 · 4번처럼 g(x) 값으로 학점을 예측하는 것은 회귀 문제이고, 1·2번 학과 수나 학생 수와는 무관하다.","4-61":"핵심 · 판별 함수 분류는 두 단계다. 먼저 학습 데이터로 w*를 정하고(학습), 그다음 새 관측 x′에 대해 g(x′)의 부호로 클래스를 예측한다(추론).\n함정 · 1번·2번은 학습 전에 예측부터 하는 순서 뒤바뀜이고, 3번은 w를 학습하지 않아 판별 함수가 의미를 잃는다.","4-62":"핵심 · 선형 판별 함수 분류에서 학습이 정하는 대상은 판별 함수의 동작을 결정하는 가중치 벡터 w다. 로지스틱 회귀도 w를 정하는 여러 접근법 가운데 하나다.\n함정 · 1번 N, 2번 차원 d, 4번 K는 데이터와 문제 설정에서 주어지는 값이라 학습으로 바뀌지 않는다.","4-63":"핵심 · 선형 판별 함수 g(x) = wᵀx 하나로 두 클래스를 오류 없이 나눌 수 있을 때 데이터가 선형 구분 가능하다고 한다. 한 클래스는 모두 g > 0, 다른 클래스는 모두 g < 0이 되는 w가 존재해야 한다.\n함정 · 1번·4번처럼 차원이나 클래스 수만으로 정해지지 않으며, 3번은 점들이 일직선에 놓인다는 다른 이야기다.","4-64":"핵심 · '정확한 구분'은 한 클래스의 모든 관측에서 g(x) > 0, 다른 클래스의 모든 관측에서 g(x) < 0이 되는 상태다. 단 하나라도 반대쪽에 있으면 정확한 구분이 아니다.\n함정 · 2번 절반 이상은 다수결 기준에 불과하고, 3번 g = 0은 모든 점이 경계 위에 있다는 뜻이며 4번 평균은 개별 점의 위치를 보장하지 않는다.","4-65":"핵심 · 선형 구분 가능할 때 경계 g(x) = 0은 특징 벡터 성분 수에 따라 선(2차원), 평면(3차원), 초평면(고차원)이 된다. 모두 선형식이라 곧은 경계다.\n함정 · 2번 점은 1차원일 때만 해당하고, 3번 곡선은 선형 판별 함수로 만들 수 없다.","4-66":"핵심 · 선형 경계는 특징 공간을 g > 0과 g < 0의 두 영역으로 나눈다. 이진 분류에서는 각 영역이 하나의 클래스에 대응한다.\n함정 · 4번처럼 관측 수만큼 나누지 않으며, 1번 회전이나 2번 확률 공간 변환은 경계가 하는 일이 아니다.","4-67":"핵심 · 로지스틱(시그모이드) 함수는 σ(x) = 1/(1 + e^(−x))이며, 분자·분모에 e^x를 곱하면 e^x/(1 + e^x)와 같다. 어떤 실수를 넣어도 0~1 사이 값이 나오는 S자 곡선이다.\n함정 · 3번은 지수의 부호가 바뀌어 1 − σ(x)가 되고, 1번은 softplus라는 다른 함수다.","4-68":"핵심 · 로지스틱 함수가 널리 쓰이는 이유는 실수 전체를 0과 1 사이로 사상해 확률처럼 해석할 수 있고, 미분이 가능해 경사하강법을 적용할 수 있기 때문이다. 미분 결과도 σ(1 − σ)로 간단하다.\n함정 · 1번처럼 출력이 0 또는 1만 나오는 것이 아니라 그 사이 연속값이며, 2번 단조 감소는 반대로 단조 증가다.","4-69":"핵심 · 1/(1 + e^(−x))의 분자와 분모에 e^x를 곱하면 e^x/(e^x + 1)이 된다. 같은 함수를 두 가지로 쓸 줄 알아야 미분 과정과 P(C₂|x) 식을 따라갈 수 있다.\n함정 · 3번 e^(−x)/(1 + e^x)는 값이 다른 식이고, 4번은 역수를 뒤집은 꼴이라 1보다 커진다.","4-70":"핵심 · 시그모이드는 미분해도 자기 자신으로 표현된다. dσ/dx = σ(x){1 − σ(x)}이므로 출력값만 알면 기울기를 바로 계산할 수 있어 학습과 신경망 역전파에서 편하다.\n함정 · 2번 1 − σ(x)는 한쪽 인수만 남겼고, 3번은 더하면 늘 1이 되어 미분일 수 없다.","4-71":"핵심 · σ = e^x/(1 + e^x)를 몫의 미분으로 풀면 {e^x(1 + e^x) − e^x·e^x}/(1 + e^x)²이고, 분자가 e^x로 정리되어 e^x/(1 + e^x)²가 된다. 이를 e^x/(1 + e^x) × 1/(1 + e^x)로 쪼개면 σ(1 − σ)다.\n함정 · 2번은 σ 자체이고, 3번은 분자와 분모가 뒤집혔다.","4-72":"핵심 · x = 0을 넣으면 e⁰ = 1이므로 σ(0) = 1/(1 + 1) = 0.5다. 그래서 wᵀx = 0인 결정 경계에서 예측 확률이 정확히 0.5가 된다.\n함정 · 2번 0과 4번 1은 x가 −∞, +∞로 갈 때 다가가는 극한값이고, 1번 −1은 출력 범위 밖이다.","4-73":"핵심 · 로지스틱 함수는 입력이 아무리 커도 1에, 아무리 작아도 0에 다가갈 뿐 그 사이를 벗어나지 않는다. 그래서 출력을 확률로 해석할 수 있다.\n함정 · 4번 −1~1은 tanh의 범위이고, 2번 실수 전체는 σ를 씌우기 전 wᵀx의 범위다.","4-74":"핵심 · 로지스틱 함수의 첫 번째 활용은 출력이 0~1이라는 점을 이용해 특정 사건이나 카테고리가 일어날 확률을 표현하는 것이며, 이것이 로지스틱 회귀다. 선형식 wᵀx에 σ를 씌워 P(C₁|x)로 쓴다.\n함정 · 2번 차원 축소나 3번 학습률 조절, 4번 결측치 처리는 로지스틱 함수의 역할이 아니다.","4-75":"핵심 · 로지스틱 함수의 두 번째 활용은 인공신경망에서 뉴런 출력을 비선형으로 바꿔 주는 활성화 함수다. 이때는 함수값과 함께 미분 σ(1 − σ)가 역전파 계산에 쓰인다.\n함정 · 2번 정규화 도구는 StandardScaler 같은 전처리의 몫이고, 1번 군집 수 결정이나 3번 특징 선택과도 관계없다.","4-76":"핵심 · 오드는 사건이 일어날 확률을 일어나지 않을 확률로 나눈 값 p/(1 − p)다. p가 0.5면 1, p가 1에 가까울수록 한없이 커진다.\n함정 · 3번은 분자·분모를 뒤집어 '일어나지 않을' 쪽의 오드가 되고, 1번 곱이나 4번 로그는 정의가 다르다.","4-77":"핵심 · 오드는 p/(1 − p)로 계산한다. 3의 배수가 아닌 눈(1, 2, 4, 5)은 p = 2/3이므로 (2/3)/(1/3) = 2, 즉 일어날 가능성이 안 일어날 가능성의 두 배다.\n함정 · 3번 2/3은 확률 p 그대로이고, 2번 1/2은 오드를 뒤집어 계산한 값이다.","4-78":"핵심 · 로그 오드(logit)는 오드에 자연로그를 취한 ln{p/(1 − p)}다. 확률 0~1을 실수 전체로 펼쳐 주므로 선형식 wᵀx와 같은 범위가 되고, 시그모이드의 역함수이기도 하다.\n함정 · 3번은 분자 p를 빼먹었고, 4번 p ln p는 엔트로피 쪽 항이다.","4-79":"핵심 · 로지스틱 회귀의 핵심 아이디어는 로그 오드를 선형 함수 wᵀx로 근사하는 것이다. 로그 오드는 실수 전체 범위를 가지므로 선형식으로 표현하기에 알맞다.\n함정 · 1번처럼 제곱 손실로 쓰지 않고, 2번·4번처럼 무시하거나 상수로 두면 입력에 따라 확률이 달라지지 않는다.","4-80":"핵심 · p = 0.5면 오드는 0.5/0.5 = 1이고 ln 1 = 0이므로 로그 오드는 0이다. 거꾸로 wᵀx = 0이면 σ(0) = 0.5라는 사실과 같은 이야기다.\n함정 · 2번 1은 로그를 취하기 전의 오드 값이고, 3번 0.5는 확률 p 자체다.","4-81":"핵심 · 이진 분류의 접근법 1은 특징 공간을 경계로 분할하는 것(선형 판별 함수)이고, 접근법 2는 두 사후 확률 P(C₁|x), P(C₂|x)를 비교하는 것이다. 로지스틱 회귀는 접근법 2를 선형식으로 구현한 모델이다.\n함정 · 4번은 접근법 1의 설명이며, 2번·3번은 분류 접근법이 아니다.","4-82":"핵심 · 확률 p 자리에 사후 확률 P(C₁|x)를 넣으면 로그 오드는 ln{P(C₁|x)/(1 − P(C₁|x))}다. 오드에 ln을 씌운 형태라는 정의만 기억하면 된다.\n함정 · 2번은 ln이 빠진 오드이고, 1번은 오드가 아닌 확률에 바로 로그를 취했다.","4-83":"핵심 · 로지스틱 회귀는 C₁의 로그 오드를 선형식으로 둔다. 즉 ln{P(C₁|x)/(1 − P(C₁|x))} = wᵀx이며, 이를 P(C₁|x)에 대해 풀면 σ(wᵀx)가 된다.\n함정 · 1번처럼 확률을 직접 wᵀx로 두면 0~1 범위를 벗어나고, 4번은 오드가 아닌 확률에 로그를 취했다.","4-84":"핵심 · 양변에 지수를 취하면 P/(1 − P) = e^(wᵀx)이고, 이를 P에 대해
