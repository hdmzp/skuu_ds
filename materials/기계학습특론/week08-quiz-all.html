 보여 주는 세 열의 구성은 무엇인가?","o":["Input / Output / Loss","Train / Valid / Test","Edge / Pose / Depth","Reference / Motion / Animation"],"a":3,"e":"각 묶음은 참조 이미지, 모션 정보, 그리고 그 둘을 합쳐 만든 애니메이션 결과 순으로 배열되어 있다."},{"w":1,"id":93,"sec":"1.6","d":"중급","x":"강의자료의 그림 필요","q":"DreamPose 예시 그림에서 모델에 주어지는 두 가지 입력은 무엇인가?","o":["Input Image와 Input Pose Sequence","Canny edge와 텍스트 프롬프트","랜덤 노이즈와 레이블","참조 이미지와 예측 확률"],"a":0,"e":"그림 왼쪽에 Input Image(옷을 입은 인물 사진)와 Input Pose Sequence(자세 시퀀스)가 표시되어 있다."},{"w":1,"id":94,"sec":"1.6","d":"심화","x":null,"q":"영상 생성에서 시간적 일관성(temporal consistency)이 중요한 이유는 무엇인가?","o":["파일 용량을 줄이기 위해","프레임마다 인물이나 의상이 달라져 영상이 어색해지는 것을 막기 위해","자세 정보를 제거하기 위해","학습 속도를 높이기 위해"],"a":1,"e":"영상은 여러 프레임의 연속이므로, 프레임 사이에 대상의 정체성과 외형이 유지되어야 자연스러운 결과가 된다."},{"w":1,"id":95,"sec":"1.6","d":"중급","x":null,"q":"패션 분야에서 DreamPose와 같은 기술의 활용으로 가장 자연스러운 것은?","o":["옷의 가격을 예측하는 일","매장 방문객 수를 세는 일","옷 사진 한 장으로 모델이 움직이는 착용 영상을 만드는 일","옷의 재질을 자동으로 분류하는 일"],"a":2,"e":"입력 이미지와 자세 시퀀스로 영상을 만드는 기술이므로, 정지 사진을 착용 영상으로 바꾸는 데 쓰일 수 있다."},{"w":1,"id":96,"sec":"1.6","d":"초급","x":null,"q":"응용 사례의 마지막 항목으로 제시된 Video 생성 분야는 무엇인가?","o":["게임","교육","의료","영화"],"a":3,"e":"마지막 응용 슬라이드의 제목은 'Video 생성 : 영화'이며, AI로 제작한 사극풍 영상 장면이 예시로 실려 있다."},{"w":1,"id":97,"sec":"1.6","d":"중급","x":"강의자료 내용 필요","q":"학습정리 슬라이드가 제시한 두 개의 대단원은 무엇인가?","o":["생성형 AI(이미지)란? / 생성형 AI(이미지) 응용 사례","판별 모델 / 생성 모델","이미지 생성 / 영상 편집","데이터 수집 / 모델 배포"],"a":0,"e":"학습정리는 1번 '생성형 AI(이미지)란?'과 2번 '생성형 AI(이미지) 응용 사례'로 정리되어 있다."},{"w":1,"id":98,"sec":"1.6","d":"심화","x":null,"q":"학습정리에 나열된 응용 사례 항목의 순서로 옳은 것은?","o":["AI 휴먼 모델 → 캐릭터 변환 → 영화","캐릭터 변환 → 애니메이션 뮤직비디오 → 광고/디자인·개인화·생성 제어 → AI 휴먼 모델 → 댄스/패션 영상 → 영화","영화 → 댄스/패션 → 광고 → 캐릭터","광고 → 캐릭터 → 영화 → 개인화"],"a":1,"e":"학습정리 2번 항목은 image-to-image 캐릭터부터 시작해 Video 생성 영화로 끝나는 순서로 나열되어 있다."},{"w":1,"id":99,"sec":"1.6","d":"심화","x":"강의자료 내용 필요","q":"이 주차 강의자료 전체를 관통하는 메시지로 가장 적절한 것은?","o":["판별 모델의 정확도를 높이는 기법을 익혀야 한다","레이블링 비용을 줄이는 방법이 핵심이다","데이터 분포를 흉내내는 생성 모델이 이미지에서 영상까지 새로운 콘텐츠 제작 전반으로 확장되고 있다","이미지 압축 표준을 이해하는 것이 중요하다"],"a":2,"e":"자료는 판별과 생성의 차이에서 출발해 생성형 AI의 정의를 세우고, 이미지와 영상 전반의 응용 사례로 확장해 간다."},{"w":1,"id":100,"sec":"1.6","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 제작 이미지의 출처로 마지막에 밝힌 사이트는 어디인가?","o":["arxiv.org","github.com","aitimes.com","kr.freepik.com"],"a":3,"e":"출처 슬라이드에 '제작 이미지 출처 https://kr.freepik.com/'이 표기되어 있다."},{"w":2,"id":1,"sec":"2.1","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 컴퓨터 과학의 관점으로 정의한 벡터(Vector)는 무엇인가?","o":["행과 열의 형태로 수나 식을 배열한 것","크기와 방향을 동시에 가지는 물리량","실수 값을 갖는 성분으로 구성된 1차원 배열","스칼라를 성분으로 갖는 n차원 배열"],"a":2,"e":"컴퓨터 과학에서는 벡터를 실수 값을 갖는 성분으로 구성된 1차원 배열로 정의한다. 크기와 방향은 물리 관점의 정의이고, 행과 열의 배열은 행렬, n차원 배열은 텐서의 정의이다."},{"w":2,"id":2,"sec":"2.1","d":"초급","x":"강의자료 내용 필요","q":"물리 관점에서 벡터를 설명한 강의자료의 내용으로 옳은 것은?","o":["크기와 방향을 가진 값이며, 방향은 화살표로 크기는 수치 값으로 표현한다","방향만 가지며 크기는 정의되지 않는다","크기만 가지며 방향은 좌표축의 이름으로만 구분한다","순서가 없는 값들의 모임으로 표현된다"],"a":0,"e":"물리에서 벡터는 크기와 방향을 가진 값으로, 방향은 화살표로 표기하고 크기는 수치 값으로 표현한다."},{"w":2,"id":3,"sec":"2.1","d":"중급","x":null,"q":"벡터를 \"값의 모임\"으로 볼 때, 일반적인 집합과 구별되는 벡터의 중요한 성질은 무엇인가?","o":["구성하는 값이 모두 서로 달라야 한다","구성하는 값의 개수가 항상 3개로 제한된다","구성하는 값이 반드시 정수여야 한다","벡터를 구성하는 값에는 순서가 존재한다"],"a":3,"e":"강의자료는 벡터가 값의 모임이지만 그 값들에는 순서가 존재한다는 점을 명시하고 있다. 성분의 중복이나 개수, 자료형에는 제약이 없다."},{"w":2,"id":4,"sec":"2.1","d":"초급","x":null,"q":"벡터 x에 대한 전치(Transpose) 연산 x^T의 역할로 옳은 것은?","o":["벡터의 모든 성분의 부호를 반대로 바꾼다","열벡터를 행벡터로, 행벡터를 열벡터로 변환한다","벡터의 크기를 1로 정규화한다","벡터를 하나의 스칼라 값으로 변환한다"],"a":1,"e":"전치 연산은 열벡터(column vector)를 행벡터(row vector)로, 또는 행벡터를 열벡터로 변환한다."},{"w":2,"id":5,"sec":"2.1","d":"초급","x":null,"q":"n개의 성분을 갖는 \"n벡터\" x가 존재하는 공간을 옳게 표현한 것은?","o":["x ∈ R^(n×n)","x ∈ R^n (R은 실수를 의미)","x ∈ N^n (N은 자연수를 의미)","x ∈ R^(n-1)"],"a":1,"e":"N개의 성분이 있는 일반 형식의 벡터는 n차원 공간 x ∈ R^n 에 존재하며, 여기서 R은 실수를 의미한다."},{"w":2,"id":6,"sec":"2.1","d":"중급","x":"강의자료 내용 필요","q":"강의자료가 제시한 벡터의 표현 방식에 대한 설명으로 옳지 않은 것은?","o":["x = (x1, x2, x3) 와 같은 형태로 표현하기도 한다","x = < x1, x2, x3 > 와 같은 형태로 표현하기도 한다","행렬과 함께 다루어질 때는 성분을 세로로 쌓은 열벡터 형태로 표현한다","벡터는 굵은 영문 대문자로 표기하는 것이 원칙이다"],"a":3,"e":"강의자료는 벡터를 굵은 소문자로, 행렬을 굵은 영문 대문자로 표기한다고 명시한다. 나머지 세 가지는 모두 자료에 제시된 벡터의 표현 방식이다."},{"w":2,"id":7,"sec":"2.1","d":"초급","x":null,"q":"벡터의 첫 번째 기하학적 해석에 해당하는 것은?","o":["n차원 공간의 점으로 벡터를 표시하는 것","벡터를 스칼라 값으로 매핑하는 함수로 보는 것","벡터를 행렬의 행으로 분해하는 것","벡터를 확률 분포의 매개변수로 보는 것"],"a":0,"e":"벡터의 첫 번째 해석은 \"공간의 점\"으로, n차원 공간의 점으로 n벡터를 표시하는 것이다. 두 번째 해석은 \"공간에서의 방향\"이다."},{"w":2,"id":8,"sec":"2.1","d":"중급","x":"강의자료 내용 필요","q":"강의자료에서 벡터 v = [3  2]^T 의 방향을 설명한 내용으로 옳은 것은?","o":["왼쪽 3단계, 아래로 2단계","오른쪽 2단계, 위로 3단계","위로 3단계, 오른쪽 2단계","오른쪽 3단계, 위로 2단계"],"a":3,"e":"첫 번째 성분 3은 가로 방향(오른쪽 3단계), 두 번째 성분 2는 세로 방향(위로 2단계)을 의미한다."},{"w":2,"id":9,"sec":"2.1","d":"중급","x":null,"q":"두 벡터 x1 = [x11  x12]^T, x2 = [x21  x22]^T 의 합과 n벡터 x에 대한 실수 a의 스칼라 곱을 옳게 표현한 것은?","o":["x1 + x2 = [x11·x21  x12·x22]^T, ax = [a+x1  ...  a+xn]^T","x1 + x2 = [x11+x12  x21+x22]^T, ax = [ax1  ...  axn]^T","x1 + x2 = [x11+x21  x12+x22]^T, ax = [ax1  ...  axn]^T","x1 + x2 = x11x21 + x12x22 (스칼라), ax = a(x1 + ... + xn)"],"a":2,"e":"벡터 덧셈은 같은 위치의 성분끼리 더하고, 스칼라 곱은 모든 성분에 실수 a를 곱한다. 성분끼리 곱해 스칼라를 만드는 것은 내적이다."},{"w":2,"id":10,"sec":"2.1","d":"심화","x":null,"q":"R^3의 벡터 x = [1  2  3]^T, y = [-2  3  6]^T 에 대한 연산 결과로 옳지 않은 것은?","o":["x + y = [-1  5  9]^T","x - y = [-1  5  9]^T","(-3)x = [-3  -6  -9]^T","y - x = [-3  1  3]^T"],"a":1,"e":"x - y = [1-(-2), 2-3, 3-6] = [3  -1  -3]^T 이다. [-1  5  9]^T 는 x + y 의 결과이므로 두 번째 보기가 옳지 않다."},{"w":2,"id":11,"sec":"2.2","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 정의한 훈련 데이터(training data)는 무엇인가?","o":["학습이 끝난 모델의 성능을 측정하기 위해 따로 떼어 둔 데이터","모델의 인자를 무작위로 초기화하기 위해 생성하는 난수의 모임","확률 분포로부터 이론적으로 유도한 가상의 데이터","모델이 해결해야 하는 해당 임무에 대하여 수집한 데이터"],"a":3,"e":"원하는 임무를 잘 해결하는 모델을 찾으려면 그 임무에 대한 데이터가 확보되어야 하는데, 해당 임무에 대하여 수집한 데이터를 훈련 데이터라고 한다."},{"w":2,"id":12,"sec":"2.2","d":"중급","x":null,"q":"훈련 데이터 표기 D = {(xi, yi)}(i=1..N) 이 의미하는 바로 옳은 것은?","o":["N개의 관측 값으로 구성된 샘플이며, i번째 관측 값이 (xi, yi)로 구성된다","i개의 관측 값이 각각 N개의 특징으로 표현된다","동일한 관측 값 (xi, yi)를 N번 반복하여 측정한다","N개의 서로 다른 모델을 동시에 학습시킨다"],"a":0,"e":"이 표기는 모델에게 주어진 훈련 데이터가 N개의 관측 값으로 구성된 샘플이고, i번째 관측 값이 (xi, yi)로 구성됨을 의미한다.","s":["훈련 데이터 D"]},{"w":2,"id":13,"sec":"2.2","d":"초급","x":null,"q":"훈련 데이터의 관측 값 (xi, yi)에서 xi와 yi를 부르는 이름을 옳게 짝지은 것은?","o":["xi: 특징벡터 / yi: 참값, 레이블, 목표 값","xi: 레이블 / yi: 특징벡터","xi: 목적함수 / yi: 기울기","xi: 가중치 / yi: 오프셋"],"a":0,"e":"xi는 특징벡터라고 부르고, yi는 참값·레이블·목표 값 등으로 호칭한다.","s":["훈련 데이터 D"]},{"w":2,"id":14,"sec":"2.2","d":"중급","x":"강의자료 내용 필요","q":"강의자료의 학생 분류 예시에서, 관측 값을 \"나이\", \"성별\", \"이름\", \"학교코드\"로 설명하고 레이블은 이진분류로 부여할 때 옳은 설명은?","o":["특징벡터는 2개 성분, 레이블은 5개 카테고리를 갖는다","특징벡터는 5개 성분, 레이블은 4개 카테고리를 갖는다","특징벡터는 4개 성분이고 레이블도 4개 값 중 하나를 갖는다","특징벡터 xi는 4개의 성분으로 표시되고, 레이블 yi에는 \"학생\" 또는 \"학생 아님\"이 부여된다"],"a":3,"e":"관측 값을 설명하는 특징이 4개이므로 특징벡터는 4개 성분을 갖고, 이진분류이므로 레이블에는 \"학생\" 또는 \"학생 아님\" 두 값 중 하나가 부여된다."},{"w":2,"id":15,"sec":"2.2","d":"초급","x":null,"q":"벡터 노름(Norm)에 대한 설명으로 옳은 것은?","o":["두 벡터 사이의 각도를 계산하여 반환하는 함수이다","벡터를 스칼라 값으로 매핑하는 함수이며 벡터 크기의 척도이다","벡터의 성분 순서를 뒤집는 연산이다","벡터를 다른 벡터로 회전시키는 선형 변환이다"],"a":1,"e":"노름은 벡터를 스칼라 값으로 매핑하는 함수이며, 벡터 크기의 척도로 사용된다.","s":["벡터 노름"]},{"w":2,"id":16,"sec":"2.2","d":"심화","x":"강의자료 내용 필요","q":"노름 f 가 충족해야 하는 속성으로 강의자료가 제시한 것이 아닌 것은?","o":["스케일링(Scaling): f(ax) = |a|f(x) (a는 임의의 실수)","삼각 부등식(Triangle inequality): f(x + y) ≤ f(x) + f(y)","선형성: 모든 x, y에 대하여 f(x + y) = f(x) + f(y) 가 항상 성립","양의 함수: f(x) ≥ 0"],"a":2,"e":"강의자료가 제시한 노름의 속성은 스케일링, 삼각 부등식, 양의 함수 세 가지이다. 덧셈에 대한 등식(선형성)은 요구되지 않으며, 실제로는 부등식 형태의 삼각 부등식만 성립한다."},{"w":2,"id":17,"sec":"2.2","d":"중급","x":null,"q":"벡터 x의 일반적인 lp 노름 ||x||_p 를 옳게 표현한 것은? (p는 실수)","o":["(1/p)·(합 i |xi|)","(합 i=1..n |xi|^p)^(1/p)","(합 i=1..n xi)^(1/p)","p · max{|x1|, ..., |xn|}"],"a":1,"e":"lp 노름은 각 성분의 절대값을 p제곱하여 모두 더한 뒤 1/p 제곱을 취한 값으로 정의된다.","s":["벡터 노름"]},{"w":2,"id":18,"sec":"2.2","d":"중급","x":null,"q":"l∞ 노름 ||x||_∞ 의 정의로 옳은 것은?","o":["벡터 x를 구성하는 성분의 절대값 중 가장 큰 값","벡터를 구성하는 모든 성분의 절대값의 합","벡터 성분의 제곱합의 제곱근","벡터 성분 중 0이 아닌 값의 개수"],"a":0,"e":"||x||_∞ = max{|x1|, ..., |xn|} 이며, 벡터 x를 구성하는 성분의 절대값 중 가장 큰 값이다. 절대값의 합은 l1, 제곱합의 제곱근은 l2 노름이다."},{"w":2,"id":19,"sec":"2.2","d":"중급","x":null,"q":"x = [1  2  3]^T 일 때 ||x||_1 과 ||x||_∞ 의 값을 순서대로 옳게 구한 것은?","o":["3, 6","√14, 3","6, 3","6, √14"],"a":2,"e":"||x||_1 = |1|+|2|+|3| = 6 이고, ||x||_∞ = max{1, 2, 3} = 3 이다. 참고로 ||x||_2 = √14 이다.","s":["벡터 노름"]},{"w":2,"id":20,"sec":"2.2","d":"심화","x":null,"q":"y = [-2  3  6]^T 에 대하여 ||y||_2 의 값은?","o":["11","√11","6","7"],"a":3,"e":"||y||_2 = √((-2)^2 + 3^2 + 6^2) = √(4+9+36) = √49 = 7 이다. 절대값의 합인 11은 ||y||_1 에 해당한다."},{"w":2,"id":21,"sec":"2.3","d":"초급","x":null,"q":"두 벡터 u, v의 내적을 성분으로 표현한 식으로 옳은 것은?","o":["u · v = u^T v = 합 i (ui · vi)","u · v = [u1v1, ..., unvn]^T","u · v = 합 i (ui + vi)","u · v = u v^T"],"a":0,"e":"내적은 두 벡터의 같은 위치 성분끼리 곱한 값을 모두 더한 스칼라이며, u^T v 로도 표기하고 <u, v> 로도 종종 표시한다.","s":["내적·코사인"]},{"w":2,"id":22,"sec":"2.3","d":"중급","x":null,"q":"내적을 u · v = ||u|| ||v|| cos(θ) 로 표현할 때, 사용되는 노름과 θ의 의미로 옳은 것은?","o":["l1 노름을 사용하며, θ는 u가 좌표축과 이루는 각이다","l2 노름을 사용하며, θ는 u벡터와 v벡터의 사잇각이다","l∞ 노름을 사용하며, θ는 항상 90도이다","노름의 종류와 무관하며, θ는 두 벡터 크기의 비를 의미한다"],"a":1,"e":"내적은 L2 노름을 사용하므로 ||u|| = ||u||_2, ||v|| = ||v||_2 이며, θ는 두 벡터의 사잇각이다.","s":["내적·코사인"]},{"w":2,"id":23,"sec":"2.3","d":"초급","x":null,"q":"내적 연산이 대칭 연산임을 나타내는 식으로 옳은 것은?","o":["u · v = -(v · u)","u · v = ||u|| + ||v||","u · v = u v^T = v u^T","u · v = u^T v = v^T u = v · u"],"a":3,"e":"내적은 대칭 연산이므로 계산 순서를 바꾸어도 값이 같다. 즉 u · v = u^T v = v^T u = v · u 이다."},{"w":2,"id":24,"sec":"2.3","d":"중급","x":null,"q":"내적의 정의로부터 유도되는 cos(θ)의 계산식으로 옳은 것은?","o":["cos(θ) = (||u|| ||v||) / (u · v)","cos(θ) = (u · v) / (||u|| + ||v||)","cos(θ) = (u · v) / (||u|| ||v||)","cos(θ) = (u + v) / (||u|| ||v||)"],"a":2,"e":"u · v = ||u|| ||v|| cos(θ) 의 양변을 ||u|| ||v|| 로 나누면 cos(θ) = (u · v) / (||u|| ||v||) 를 얻는다.","s":["내적·코사인"]},{"w":2,"id":25,"sec":"2.3","d":"초급","x":null,"q":"두 벡터 u, v가 서로 \"직교\"한다는 것의 의미로 옳은 것은?","o":["두 벡터의 크기(노름)가 서로 같다","두 벡터가 완전히 같은 방향을 가리킨다","두 벡터의 합이 영벡터가 된다","사잇각이 90도를 이루며, 이때 u · v = 0 이다"],"a":3,"e":"사잇각이 90도를 이루는 두 벡터를 서로 직교한다고 하며, u와 v가 직교하면 내적 u · v = 0 이 된다."},{"w":2,"id":26,"sec":"2.3","d":"중급","x":null,"q":"기계학습에서 코사인 유사성(Cosine similarity)을 사용하는 목적으로 옳은 것은?","o":["벡터의 성분 개수 차이를 계산하기 위해","벡터 형태로 표현된 두 관측값 사이의 cos(θ) 값으로 두 관측값의 유사 정도를 수치화하기 위해","벡터의 노름을 l1에서 l2로 변환하기 위해","훈련 데이터의 레이블을 자동으로 부여하기 위해"],"a":1,"e":"기계학습에서는 관측값을 벡터로 표현하므로, 두 벡터의 cos(θ) 값을 이용하여 두 관측값의 유사 정도를 수치화할 수 있다."},{"w":2,"id":27,"sec":"2.3","d":"중급","x":null,"q":"x = [1  2  3]^T, y = [-2  3  6]^T 일 때 내적 x · y 의 값은?","o":["-22","7","22","26"],"a":2,"e":"x · y = 1·(-2) + 2·3 + 3·6 = -2 + 6 + 18 = 22 이다."},{"w":2,"id":28,"sec":"2.3","d":"심화","x":null,"q":"x = [1  2  3]^T 에 대하여 y = [-2  3  6]^T 와 z = [1  2  4]^T 중 코사인 유사도가 더 큰 벡터와 그 근거로 옳은 것은?","o":["z — cos값이 17/(√14·√21) ≈ 0.99 로 y의 22/(√14·7) ≈ 0.84 보다 크기 때문","y — 내적이 22로 x · z = 17 보다 크기 때문","y — ||y||_2 = 7 이 ||z||_2 = √21 보다 크기 때문","두 벡터의 코사인 유사도가 완전히 동일하여 판단할 수 없음"],"a":0,"e":"코사인 유사도는 내적을 두 벡터의 L2 노름의 곱으로 나눈 값이므로 내적 크기만으로 비교하면 안 된다. z의 값 약 0.99가 y의 약 0.84보다 크므로 x는 z와 더 가깝다.","s":["내적·코사인"]},{"w":2,"id":29,"sec":"2.3","d":"초급","x":null,"q":"초평면(hyperplane)의 정의로 옳은 것은?","o":["차원이 주변 공간과 항상 동일한 부분 공간","차원이 주변 공간보다 하나 작은 부분 공간","차원이 주변 공간보다 하나 큰 부분 공간","차원이 항상 2로 고정된 부분 공간"],"a":1,"e":"초평면은 차원이 주변 공간보다 하나 작은 부분 공간이며, n차원 벡터 공간에서 n-1 차원을 가지고 공간을 두 개의 절반 공간으로 나눈다.","s":["초평면"]},{"w":2,"id":30,"sec":"2.3","d":"중급","x":null,"q":"공간의 차원과 그 공간에서의 초평면을 옳게 짝지은 것은?","o":["2차원 공간 → 평면 / 3차원 공간 → 직선","2차원 공간 → 점 / 3차원 공간 → 직선","n차원 공간 → n차원 / 3차원 공간 → 3차원 입체","2차원 공간 → 직선 / 3차원 공간 → 평면 / n차원 공간 → n-1 차원"],"a":3,"e":"이차원 공간에서 초평면은 직선(일차원), 3차원 공간에서는 평면(이차원)이며, 일반적으로 n차원 공간에서는 n-1 차원을 갖는다."},{"w":2,"id":31,"sec":"2.3","d":"중급","x":null,"q":"이진 분류 문제에서 초평면 w · x + b = 0 이 하는 역할로 옳은 것은?","o":["두 클래스를 구분하는 결정 경계이며, w · x + b > 0 인지 여부를 검사하여 관측 값의 소속 클래스를 결정한다","관측 값의 노름을 항상 1로 정규화하는 역할을 한다","훈련 데이터의 개수 N을 결정하는 역할을 한다","특징벡터의 차원을 하나 늘려주는 역할을 한다"],"a":0,"e":"머신러닝에서 초평면은 선형 분류에 사용되는 결정 경계(decision boundary)이며, w · x + b > 0 인지 검사하여 클래스 레이블을 모르는 관측 값의 소속 클래스를 결정한다. w와 b의 값은 학습 데이터에 기반하여 결정된다.","s":["초평면"]},{"w":2,"id":32,"sec":"2.3","d":"심화","x":null,"q":"w = [2  1]^T, x0 = [1  -1]^T 로 정의되는 초평면을 w · (x - x0) = 0 으로부터 구한 식과, 원점에서 초평면까지의 거리 표현을 옳게 짝지은 것은?","o":["2x1 + x2 + 1 = 0 / 거리 = ||w|| / |b|","x1 + 2x2 - 1 = 0 / 거리 = |b| · ||w||","2x1 + x2 - 1 = 0 / 거리 = |b| / ||w||","2x1 - x2 - 1 = 0 / 거리 = ||w|| · |b|"],"a":2,"e":"w^T(x - x0) = 2(x1 - 1) + 1·(x2 + 1) = 2x1 + x2 - 1 = 0 이며, 이는 오프셋 b = -1 인 w · x + b = 0 과 같다. 원점에서 초평면까지의 거리는 |b| / ||w|| 이다."},{"w":2,"id":33,"sec":"2.4","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 정의한 행렬(Matrix)은 무엇인가?","o":["실수 값을 갖는 성분으로 구성된 1차원 배열","두 벡터의 내적으로 정의되는 하나의 스칼라 값","m개의 가로 행과 n개의 세로 열의 형태로 수나 식을 배열한 것","차원이 주변 공간보다 하나 작은 부분 공간"],"a":2,"e":"행렬은 m개의 가로 행과 n개의 세로 열의 형태로 수나 식을 배열한 것이며, 크기는 m × n 또는 (m, n)으로 표기하고 굵은 영문 대문자로 표시한다."},{"w":2,"id":34,"sec":"2.4","d":"중급","x":null,"q":"행렬 덧셈 [[1, 3, 1], [1, 0, 0]] + [[0, 0, 5], [7, 5, 0]] 의 결과로 옳은 것은?","o":["[[0, 0, 5], [7, 0, 0]]","[[1, 3, 6], [7, 5, 0]]","[[1, 3, 1], [8, 5, 0]]","[[1, 3, 6], [8, 5, 0]]"],"a":3,"e":"행렬의 덧셈은 (A ± B)ij = Aij ± Bij 로 같은 위치의 성분끼리 더한다. 따라서 [[1+0, 3+0, 1+5], [1+7, 0+5, 0+0]] = [[1, 3, 6], [8, 5, 0]] 이다."},{"w":2,"id":35,"sec":"2.4","d":"초급","x":null,"q":"두 행렬의 곱 AB가 정의되기 위한 조건으로 옳은 것은?","o":["두 행렬의 행의 수와 열의 수가 각각 서로 같아야 한다","왼쪽 행렬의 열 수가 오른쪽 행렬의 행 수와 같아야 한다","왼쪽 행렬의 행 수가 오른쪽 행렬의 열 수와 같아야 한다","두 행렬이 모두 정방 행렬이어야 한다"],"a":1,"e":"행렬 곱셈은 왼쪽 행렬의 열 수가 오른쪽 행렬의 행 수와 같은 경우에만 정의된다.","s":["행렬 곱"]},{"w":2,"id":36,"sec":"2.4","d":"중급","x":"강의자료 내용 필요","q":"행렬 곱셈의 교환 법칙에 대한 강의자료의 설명으로 옳은 것은?","o":["일반적으로 AB ≠ BA 이다","항상 AB = BA 가 성립한다","A와 B가 정방 행렬이면 항상 AB = BA 가 성립한다","AB는 A와 B의 같은 위치 성분끼리 곱한 결과이므로 AB = BA 이다"],"a":0,"e":"행렬 곱셈은 일반적으로 교환 법칙이 성립하지 않아 AB ≠ BA 이다. 성분별 곱셈은 행렬 곱셈이 아니라 아다마르 곱에 해당한다."},{"w":2,"id":37,"sec":"2.4","d":"심화","x":null,"q":"[[2, 3, 4], [1, 0, 0]] · [[0, 1000], [1, 100], [0, 10]] 의 결과로 옳은 것은?","o":["[[3, 1110], [0, 1000]]","[[2340, 3], [1000, 0]]","[[3, 2340], [1, 1000]]","[[3, 2340], [0, 1000]]"],"a":3,"e":"(AB)11 = 2·0 + 3·1 + 4·0 = 3, (AB)12 = 2·1000 + 3·100 + 4·10 = 2340, (AB)21 = 1·0 + 0 + 0 = 0, (AB)22 = 1·1000 + 0 + 0 = 1000 이다."},{"w":2,"id":38,"sec":"2.4","d":"초급","x":null,"q":"행렬의 전치(Transpose) 연산을 정의하는 식으로 옳은 것은?","o":["(A^T)ij = -Aij","(A^T)ij = Aji","(A^T)ij = Aij","(A^T)ij = 1 / Aij"],"a":1,"e":"전치는 행렬 A의 행과 열을 교환하는 연산이므로 (A^T)ij = Aji 이다. 예를 들어 [[1,2,3],[0,-6,7]]의 전치는 [[1,0],[2,-6],[3,7]] 이 된다."},{"w":2,"id":39,"sec":"2.4","d":"심화","x":"강의자료 내용 필요","q":"강의자료가 제시한 행렬의 중요 속성 중 옳지 않은 것은?","o":["(AB)^T = A^T B^T","(A + B)^T = A^T + B^T","(A^T)^T = A","A(BC) = (AB)C"],"a":0,"e":"곱의 전치는 순서가 뒤바뀌어 (AB)^T = B^T A^T 가 된다. 나머지 세 가지는 모두 강의자료가 제시한 옳은 속성이다."},{"w":2,"id":40,"sec":"2.4","d":"초급","x":null,"q":"정방 행렬(Square matrix)의 정의로 옳은 것은?","o":["모든 원소가 1인 행렬","역행렬이 전치행렬과 같은 행렬","행과 열의 수가 동일한 행렬","대각 원소를 제외한 모든 원소가 0인 행렬"],"a":2,"e":"정방 행렬은 행과 열의 수가 동일한 행렬이다. 역행렬이 전치행렬과 같은 것은 직교 행렬의 정의이다."},{"w":2,"id":41,"sec":"2.4","d":"중급","x":null,"q":"항등행렬 I_n 에 대한 설명으로 옳은 것은?","o":["모든 원소가 1인 n × n 행렬이다","n × n 정방 행렬 중 aii = 1 (1 ≤ i ≤ n)이고 그 외 원소는 모두 0인 행렬이다","첫 번째 행만 1이고 나머지 원소는 0인 행렬이다","대각 원소가 0이고 나머지 원소가 1인 행렬이다"],"a":1,"e":"항등행렬은 n × n 정방 행렬 중 대각 성분 aii가 1이고 그 외 원소는 0인 행렬이다. 예를 들어 I3 = [[1,0,0],[0,1,0],[0,0,1]] 이다."},{"w":2,"id":42,"sec":"2.4","d":"중급","x":null,"q":"행렬 A ∈ R^(m×n) 를 행 벡터의 모음으로 표시할 때, 행렬-벡터 곱 Ax (x ∈ R^n)에 대한 설명으로 옳은 것은?","o":["Ax는 길이 n의 행벡터이며 i번째 요소는 ai + x 이다","Ax는 길이 n의 열벡터이며 i번째 요소는 ||ai|| ||x|| 이다","Ax는 m × n 행렬이며 각 요소는 aij · xj 이다","Ax는 길이 m의 열벡터이며 i번째 요소는 내적 ai^T x 이다"],"a":3,"e":"행렬-벡터 곱은 길이 m의 열벡터이며 i번째 요소는 A의 i번째 행 벡터와 x의 내적 ai^T x 이다. 크기로 보면 A(m × n) · x(n × 1) = Ax(m × 1) 이다."},{"w":2,"id":43,"sec":"2.4","d":"중급","x":null,"q":"A ∈ R^(n×k), B ∈ R^(k×m) 일 때 C = AB 의 크기와 성분의 의미로 옳은 것은?","o":["C는 k × k 이며, Cij 는 A의 i번째 열과 B의 j번째 행의 합이다","C는 n × k 이며, Cij 는 A와 B의 같은 위치 성분의 곱이다","C는 n × m 이며, Cij 는 A의 i번째 행과 B의 j번째 열의 내적이다","C는 m × n 이며, Cij 는 B의 i번째 행과 A의 j번째 열의 내적이다"],"a":2,"e":"행렬-행렬 곱은 A(n × k) · B(k × m) = C(n × m) 이며, C의 (i, j) 성분은 A의 i번째 행 벡터와 B의 j번째 열 벡터의 내적 ai^T bj 이다.","s":["행렬 곱"]},{"w":2,"id":44,"sec":"2.4","d":"중급","x":null,"q":"A = [[1, 2, 3], [3, 1, 4]], B = [[5, 2, 2], [-1, 3, 3]] 일 때 A + B 는?","o":["[[6, 4, 5], [2, 4, 7]]","[[6, 4, 5], [2, 4, 6]]","[[-4, 0, 1], [4, -2, 1]]","[[5, 4, 6], [-3, 3, 12]]"],"a":0,"e":"같은 위치의 성분끼리 더하면 [[1+5, 2+2, 3+2], [3+(-1), 1+3, 4+3]] = [[6, 4, 5], [2, 4, 7]] 이다."},{"w":2,"id":45,"sec":"2.4","d":"심화","x":null,"q":"A = [[1, 2, 3], [3, 1, 4]], B = [[2, 5], [6, 1], [-1, 2]] 일 때 AB 는?","o":["[[11, 13], [8, 24]]","[[11, 13], [8, 20]]","[[13, 11], [24, 8]]","크기가 맞지 않아 정의되지 않는다"],"a":0,"e":"A는 2 × 3, B는 3 × 2 이므로 AB는 2 × 2 이다. (AB)11 = 1·2+2·6+3·(-1) = 11, (AB)12 = 1·5+2·1+3·2 = 13, (AB)21 = 3·2+1·6+4·(-1) = 8, (AB)22 = 3·5+1·1+4·2 = 24 이다.","s":["행렬 곱"]},{"w":2,"id":46,"sec":"2.4","d":"초급","x":null,"q":"정방 행렬 A의 역행렬 A^(-1) 을 정의하는 식으로 옳은 것은?","o":["A^(-1) + A = I","A^(-1) A = 0","A^(-1) A = A A^(-1) = I","A^(-1) = A^T 가 모든 정방 행렬에 대해 성립"],"a":2,"e":"정방 행렬 A에 대하여 곱하였을 때 항등행렬을 만드는 행렬을 역행렬이라 하며 A^(-1) A = A A^(-1) = I 로 정의된다."},{"w":2,"id":47,"sec":"2.4","d":"중급","x":"강의자료 내용 필요","q":"역행렬의 특성으로 강의자료가 제시한 것을 옳게 나열한 것은?","o":["(A^(-1))^(-1) = A^(-1), (AB)^(-1) = A^(-1) B^(-1)","(A^(-1))^(-1) = A^T, (AB)^(-1) = AB","(A^(-1))^(-1) = I, (AB)^(-1) = B^(-1) A","(A^(-1))^(-1) = A, (AB)^(-1) = B^(-1) A^(-1)"],"a":3,"e":"역행렬을 두 번 취하면 원래 행렬로 돌아오고, 곱의 역행렬은 전치와 마찬가지로 순서가 뒤바뀌어 (AB)^(-1) = B^(-1) A^(-1) 이 된다."},{"w":2,"id":48,"sec":"2.4","d":"중급","x":"강의자료 내용 필요","q":"큰 행렬의 역행렬을 구하는 것에 대한 강의자료의 설명으로 옳은 것은?","o":["행렬의 크기와 무관하게 계산 비용이 항상 일정하다","계산 비용이 많이 들며 수치적 불안정성을 초래할 수 있다","계산이 매우 빠르며 언제나 수치적으로 안정적이다","전치 연산으로 언제나 대체할 수 있어 별도의 비용이 들지 않는다"],"a":1,"e":"강의자료는 큰 행렬의 역행렬을 찾는 것은 계산 비용이 많이 들고 수치적 불안정성을 초래할 수 있다고 설명한다. 전치로 대체할 수 있는 것은 직교 행렬에 한정된다."},{"w":2,"id":49,"sec":"2.4","d":"중급","x":null,"q":"직교 행렬(orthogonal matrix)의 정의로 옳은 것은?","o":["모든 원소가 0 또는 1로만 구성된 행렬","역행렬이 존재하지 않는 행렬","역행렬이 전치행렬과 같은 행렬, 즉 A^(-1) = A^T 인 행렬","행과 열의 수가 서로 다른 행렬"],"a":2,"e":"행렬의 역행렬이 전치행렬과 같으면 직교 행렬이라고 하며, 이때 A^T A = A A^T = I 가 성립한다."},{"w":2,"id":50,"sec":"2.4","d":"초급","x":null,"q":"텐서(tensor)와 그 차수에 대한 설명으로 옳은 것은?","o":["텐서는 스칼라의 n차원 배열이며, 벡터는 1차 텐서, 행렬은 2차 텐서이다","텐서는 항상 3차원 배열만을 의미한다","벡터는 2차 텐서이고 행렬은 3차 텐서이다","텐서는 정방 행렬만을 가리키는 용어이다"],"a":0,"e":"텐서는 스칼라의 n차원 배열이며 벡터 v ∈ R^n 은 1차 텐서, 행렬 A ∈ R^(m×n) 은 2차 텐서이다. 4차 텐서는 T ∈ R^(n1×n2×n3×n4) 로 표기한다."},{"w":2,"id":51,"sec":"2.4","d":"중급","x":null,"q":"RGB 이미지를 텐서로 표현할 때에 대한 설명으로 옳은 것은?","o":["1차 텐서이며 축은 픽셀 인덱스 하나뿐이다","2차 텐서이며 축은 너비와 높이이다","4차 텐서이며 축은 너비, 높이, 채널, 시간이다","3차 텐서이며 축은 너비, 높이, 채널이다(예: 224 × 224 × 3)"],"a":3,"e":"RGB 이미지는 3차원 배열이므로 3차 텐서이며, 3개의 축은 너비, 높이, 채널에 해당한다. 채널 축은 빨간색·녹색·파란색의 색상 채널을 의미한다.","s":["텐서"]},{"w":2,"id":52,"sec":"2.4","d":"초급","x":null,"q":"벡터 b1, b2 와 실수 a1, a2 에 대하여 a1·b1 + a2·b2 를 무엇이라고 하는가?","o":["b1 과 b2 의 내적","b1 과 b2 의 선형 결합(Linear combination)","b1 과 b2 의 아다마르 곱","b1 과 b2 의 노름"],"a":1,"e":"벡터에 실수를 곱하여 더한 형태 a1·b1 + a2·b2 를 두 벡터의 선형 결합(Linear combination)이라고 한다."},{"w":2,"id":53,"sec":"2.4","d":"중급","x":null,"q":"벡터들 v1, ..., vk 가 선형 독립이라는 것의 정의로 옳은 것은?","o":["a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 조합이 하나라도 존재할 때","a1·v1 + ... + ak·vk = 0 이 a1 = ... = ak = 0 일 때만 성립할 때","모든 벡터쌍의 내적이 0일 때","모든 벡터의 노름이 1로 같을 때"],"a":1,"e":"선형 독립은 a1·v1 + ... + ak·vk = 0 이라는 관계가 모든 계수가 0일 때만 성립하는 경우를 뜻한다. 모든 벡터쌍의 내적이 0인 것은 직교로, 선형 독립의 정의와는 다르다.","s":["선형 독립·종속"]},{"w":2,"id":54,"sec":"2.4","d":"심화","x":null,"q":"벡터들의 집합 v1, ..., vk 가 선형 종속(Linearly dependent) 관계에 있다는 것의 정의로 옳은 것은?","o":["a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 a1, ..., ak 가 존재한다","a1·v1 + ... + ak·vk = 0 이 모든 계수가 0일 때만 성립한다","벡터들의 개수 k가 벡터의 차원 n보다 작다","모든 벡터가 서로 직교한다"],"a":0,"e":"선형 종속은 모든 계수가 0인 자명한 경우 외에도 a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 계수가 존재하는 경우를 말한다. 모든 계수가 0일 때만 성립하면 선형 독립이다.","s":["선형 독립·종속"]},{"w":2,"id":55,"sec":"2.5","d":"초급","x":null,"q":"함수 f: R → R 에 대한 도함수(derivative) f'(x)의 정의로 옳은 것은?","o":["f'(x) = lim(h→0) [f(x) - f(h)] / x","f'(x) = lim(h→0) [f(x + h) + f(x)] / h","f'(x) = lim(h→0) [f(x + h) - f(x)] / h","f'(x) = lim(h→0) h / [f(x + h) - f(x)]"],"a":2,"e":"도함수는 x가 h만큼 변할 때의 함수값 변화량을 h로 나눈 값의 h → 0 극한으로 정의되며, x에 대한 f(x)의 순간 변화율로 해석할 수 있다."},{"w":2,"id":56,"sec":"2.5","d":"중급","x":"강의자료 내용 필요","q":"미분 가능성에 대한 강의자료의 설명으로 옳은 것은?","o":["f'(a)가 존재하지 않아도 f는 a에서 미분 가능하다","f가 구간 [a, b]의 어느 한 점에서만 미분 가능하면 그 구간 전체에서 미분 가능하다","f가 연속이면 항상 미분 가능하다고 강의자료에 정의되어 있다","f'(a)가 극한 값으로 존재하면 f는 a에서 미분 가능하며, f'(c)가 모든 c ∈ [a, b]에 대해 존재하면 그 구간에서 미분 가능하다"],"a":3,"e":"강의자료는 f'(a)가 극한 값으로 존재할 때 f가 a에서 미분 가능하고, f'(c)가 구간 [a, b]의 모든 c에 대해 존재하면 그 구간에서 미분 가능하다고 정의한다."},{"w":2,"id":57,"sec":"2.5","d":"초급","x":null,"q":"명시적 함수의 도함수 계산 규칙 중 옳은 것을 짝지은 것은?","o":["상수의 미분: d/dx (c) = 0, 선형 함수의 미분: d/dx (ax) = a","상수의 미분: d/dx (c) = c, 선형 함수의 미분: d/dx (ax) = ax","상수의 미분: d/dx (c) = 1, 선형 함수의 미분: d/dx (ax) = x","상수의 미분: d/dx (c) = 0, 선형 함수의 미분: d/dx (ax) = 0"],"a":0,"e":"상수의 도함수는 0이고, 선형 함수 ax의 도함수는 계수 a가 된다."},{"w":2,"id":58,"sec":"2.5","d":"초급","x":null,"q":"거듭제곱 규칙(Power rule)을 옳게 표현한 것은?","o":["d/dx (x^n) = x^(n-1)","d/dx (x^n) = n·x^(n+1)","d/dx (x^n) = n·x^(n-1)","d/dx (x^n) = (1/n)·x^n"],"a":2,"e":"거듭제곱 규칙은 d/dx (x^n) = n·x^(n-1) 이다."},{"w":2,"id":59,"sec":"2.5","d":"중급","x":null,"q":"지수 함수와 로그 함수의 미분 규칙을 옳게 짝지은 것은?","o":["d/dx (e^x) = x·e^(x-1), d/dx log(x) = log(x)/x","d/dx (e^x) = e^x, d/dx log(x) = 1/x","d/dx (e^x) = 1/e^x, d/dx log(x) = x","d/dx (e^x) = e^(x-1), d/dx log(x) = -1/x"],"a":1,"e":"지수 함수 e^x 는 미분해도 그대로 e^x 이고, 로그 함수 log(x)의 도함수는 1/x 이다."},{"w":2,"id":60,"sec":"2.5","d":"중급","x":null,"q":"곱의 규칙(Product rule)을 옳게 표현한 것은?","o":["d/dx [g(x)·h(x)] = (dg/dx)(x) · (dh/dx)(x)","d/dx [g(x)·h(x)] = g(x)·h(x) + (dg/dx)(x)·(dh/dx)(x)","d/dx [g(x)·h(x)] = (dg/dx)(x) + (dh/dx)(x)","d/dx [g(x)·h(x)] = g(x)·(dh/dx)(x) + (dg/dx)(x)·h(x)"],"a":3,"e":"곱의 규칙은 앞의 함수를 그대로 두고 뒤를 미분한 항과, 앞을 미분하고 뒤를 그대로 둔 항의 합이다. 도함수끼리 곱하는 형태는 성립하지 않는다."},{"w":2,"id":61,"sec":"2.5","d":"심화","x":null,"q":"연쇄 법칙(Chain rule)을 옳게 표현한 것은?","o":["d/dx g(h(x)) = (dg/dx)(x) · (dh/dx)(x)","d/dx g(h(x)) = (dg/dh)(x) + (dh/dx)(x)","d/dx g(h(x)) = (dg/dh)(h(x)) · (dh/dx)(x)","d/dx g(h(x)) = g(h(x)) · (dh/dx)(x)"],"a":2,"e":"합성 함수의 미분인 연쇄 법칙은 바깥 함수를 안쪽 함수 값 h(x)에서 미분한 값과 안쪽 함수의 도함수를 곱한 형태이다."},{"w":2,"id":62,"sec":"2.5","d":"중급","x":null,"q":"2계 도함수(second derivative)의 정의로 옳은 것은?","o":["1계 도함수를 다시 미분한 것으로 d^2f/dx^2 = (d/dx)(df/dx) 이다","1계 도함수를 제곱한 것으로 d^2f/dx^2 = (df/dx)^2 이다","1계 도함수를 적분한 것이다","두 변수에 대해 각각 한 번씩 편미분한 것이다"],"a":0,"e":"함수 f(x)의 1계 도함수를 다시 미분한 것이 2계 도함수이며, d^2f/dx^2 = (d/dx)(df/dx) 로 표기한다."},{"w":2,"id":63,"sec":"2.5","d":"중급","x":"강의자료 내용 필요","q":"2차 미분(2계 도함수)의 물리적 의미에 대한 강의자료의 설명으로 옳은 것은?","o":["함수가 물체의 변위를 설명할 때 2차 도함수는 물체의 변위 자체를 제공한다","2차 도함수는 언제나 0이 되어 물리적 의미가 없다","함수가 물체의 속도를 설명할 때 2차 도함수는 물체의 위치를 제공한다","함수가 물체의 변위를 설명할 때 1차 도함수는 속도, 2차 도함수는 가속도를 제공한다"],"a":3,"e":"2차 미분은 f(x)의 변화율의 변화 정도를 수치화한다. 함수가 변위를 나타내면 1차 도함수는 속도(위치의 변화율), 2차 도함수는 가속도(속도의 변화율)이다."},{"w":2,"id":64,"sec":"2.5","d":"초급","x":null,"q":"다변량 함수(Multivariate functions)에 대한 설명으로 옳은 것은?","o":["출력이 벡터이고 입력이 스칼라인 함수이다","여러 개의 변수가 정의역을 구성하는 함수로, 입력은 n차원 벡터이고 출력은 스칼라이다(f: R^n → R)","정의역이 항상 2차원으로 제한된 함수이다","입력과 출력이 모두 행렬인 함수이다"],"a":1,"e":"여러 개의 변수가 정의역을 구성하는 함수를 다변량 함수라고 하며, y = f(x) = f(x1, ..., xn) 의 입력은 n차원 벡터이고 출력은 스칼라 y 이다."},{"w":2,"id":65,"sec":"2.5","d":"중급","x":null,"q":"i번째 매개변수 xi 에 대한 y의 편미분(Partial derivative) 정의로 옳은 것은?","o":["∂y/∂xi = lim(h→0) [f(x1, ..., xn) - f(h, ..., h)] / h","∂y/∂xi = lim(h→0) [f(x1+h, ..., xn+h) - f(x1, ..., xn)] / h","∂y/∂xi = lim(h→0) h / [f(x1, ..., xi+h, ..., xn) - f(x1, ..., xi, ..., xn)]","∂y/∂xi = lim(h→0) [f(x1, ..., xi+h, ..., xn) - f(x1, ..., xi, ..., xn)] / h"],"a":3,"e":"편미분은 i번째 변수 xi 에만 h를 더해 변화시킨 함수값의 차이를 h로 나눈 극한이다. 모든 변수를 동시에 변화시키는 것이 아니다.","s":["편미분·기울기"]},{"w":2,"id":66,"sec":"2.5","d":"초급","x":null,"q":"편미분 ∂y/∂xi 를 실제로 계산하는 방법으로 옳은 것은?","o":["모든 변수를 동시에 미분한 뒤 그 합을 구한다","모든 변수를 상수로 취급하여 미분한다","xi 를 제외한 나머지 변수를 상수로 취급하고 xi 에 대해서만 y의 도함수를 계산한다","xi 를 상수로 취급하고 나머지 변수에 대해 도함수를 계산한다"],"a":2,"e":"편미분은 x1, ..., x(i-1), x(i+1), ..., xn 을 상수로 취급하고 xi 에 대해서만 y의 도함수를 계산한다."},{"w":2,"id":67,"sec":"2.5","d":"중급","x":null,"q":"n차원 입력 벡터 x에 대한 다변량 함수 f(x)의 기울기(Gradient) 정의로 옳은 것은?","o":["각 변수에 대한 편미분 결과를 성분으로 갖는 벡터 [∂f/∂x1, ∂f/∂x2, ..., ∂f/∂xn]^T","모든 편미분 값을 더한 하나의 스칼라 값","2계 편미분들을 모아 만든 n × n 행렬","f(x)의 최대값과 최소값의 차이"],"a":0,"e":"기울기는 각 변수에 대한 편미분 결과로 구성된 벡터로 정의되며, ∇x f(x) = [∂f(x)/∂x1, ..., ∂f(x)/∂xn]^T 이다.","s":["편미분·기울기"]},{"w":2,"id":68,"sec":"2.5","d":"초급","x":null,"q":"기울기 표기와 기계학습에서의 역할에 대한 설명으로 옳은 것은?","o":["기울기의 표기에는 그리스 문자 Σ(\"시그마\")를 사용하며 데이터 개수를 세는 데 쓰인다","기울기의 표기에는 기호 ∇(\"nabla/del\"로 발음)를 사용하며, 기계학습에서 모델의 인자를 갱신하는 과정에 중요하게 활용된다","기울기는 ∂로 표기하며 훈련 데이터를 정규화하는 데 사용된다","기울기는 행렬을 전치하는 연산자이며 학습과는 무관하다"],"a":1,"e":"그레디언트는 기호 ∇(\"nabla/del\")로 표기하며, ∇x f(x)는 \"벡터 x에 대한 f의 기울기\"라고 부른다. 기계학습에서는 모델의 인자를 갱신하는 과정에서 중요하게 활용된다."},{"w":2,"id":69,"sec":"2.5","d":"중급","x":null,"q":"기계학습에서의 목적함수(Objective function)와 비용 함수(cost function)에 대한 설명으로 옳은 것은?","o":["학습 과정에서 부여되는 목표를 정량적으로 표현한 것이 목적함수이고, 최소화 문제에서 목적 함수는 종종 비용 함수·손실 함수·오류 함수라고 불린다","목적함수는 항상 최대화 대상이며 비용 함수와는 전혀 다른 개념이다","비용 함수는 모델의 학습 시간을 측정하는 함수이다","목적함수는 훈련 데이터의 개수를 세는 함수이다"],"a":0,"e":"학습 과정에서 부여되는 목표를 정량적으로 표현한 것이 목적함수이며, 최소화 문제에서는 이를 비용 함수(cost function), 손실 함수(loss function), 오류 함수(error function)라고도 부른다.","s":["목적함수·최적화"]},{"w":2,"id":70,"sec":"2.5","d":"초급","x":"강의자료 내용 필요","q":"경사하강법(Gradient descent)에 대한 강의자료의 설명으로 옳은 것은?","o":["훈련 데이터를 무작위로 섞는 방법이다","행렬의 역행렬을 빠르게 구하는 방법이다","벡터의 노름을 1로 정규화하는 방법이다","기울기(Gradient)를 이용하여 모델의 인자 값을 탐색하는 방법이다"],"a":3,"e":"경사하강법은 기울기를 이용하여 목적함수를 달성하는 모델의 인자 값을 탐색하는 최적화 방법이다."},{"w":2,"id":71,"sec":"2.5","d":"중급","x":null,"q":"한 변수 함수 f(x)의 임계점(stationary point)과 그 종류에 대한 설명으로 옳은 것은?","o":["임계점은 f(x) = 0 인 점이며, 최소값·최대값·변곡점으로 나뉜다","임계점은 도함수가 0인 점 f'(x) = 0 이며, 최소값은 도함수가 음수에서 양수로, 최대값은 양수에서 음수로 변하는 지점이고, 안장점은 도함수가 점 양쪽에서 모두 양수이거나 모두 음수인 지점이다","임계점은 2계 도함수가 0인 점만을 의미한다","임계점은 함수가 정의되지 않는 점을 말한다"],"a":1,"e":"임계점은 도함수가 0인 점이며, 최소값·최대값·안장점으로 구분된다. 최소점과 최대점을 총칭하여 극점이라고 한다."},{"w":2,"id":72,"sec":"2.5","d":"심화","x":null,"q":"임계점의 특성을 2차 도함수로 판정하는 방법으로 옳은 것은?","o":["f''(x) > 0 이면 최대값, f''(x) < 0 이면 최소값, f''(x) = 0 이면 반드시 안장점이다","f''(x)의 부호와 임계점의 종류는 아무 관계가 없다","f''(x) > 0 이면 최소값, f''(x) < 0 이면 최대값, f''(x) = 0 이면 안장점이 될 수도 있지만 그렇지 않을 수도 있다","f''(x) = 0 인 경우에만 극점이 되며, 부호가 있으면 극점이 아니다"],"a":2,"e":"2차 도함수가 양수이면 그 점은 최소값, 음수이면 최대값이며, 0인 경우에는 안장점일 수도 있고 아닐 수도 있어 미정이다. 동일한 개념이 다변량 함수의 그래디언트에도 적용된다."},{"w":2,"id":73,"sec":"2.5","d":"중급","x":null,"q":"전역 최소값(Global minimum)과 지역 최소값(Local minimum)에 대한 설명으로 옳은 것은?","o":["전역 최소값은 x 주변의 아주 작은 범위에서만 가장 작은 값이다","기계학습의 목적 함수에는 지역 최소값이 언제나 하나만 존재한다","정의역의 모든 원소에 대하여 목적 함수 값이 최소가 되는 값이 전역 최소값이고, x 주변의 아주 작은 범위의 다른 지점보다 작은 목적 함수 값이 지역 최소값이다","지역 최소값에 도달하면 항상 쉽게 전역 최소값으로 이동할 수 있다"],"a":2,"e":"전역 최소값은 정의역 전체에서 목적 함수가 최소가 되는 값이고, 지역 최소값은 주변의 아주 작은 범위에서만 최소인 값이다. 기계학습의 목적 함수에는 여러 개의 지역 최소값이 존재하며, 한 지역 최소값에 도달하면 다른 인자 값을 탐색하기 어렵다."},{"w":2,"id":74,"sec":"2.6","d":"초급","x":null,"q":"확률 변수(Random variable)의 정의로 옳은 것은?","o":["사건이 발생할 가능성을 0과 1 사이의 값으로 나타낸 상수","사건의 표본 공간(시행에서 가능한 모든 결과의 모임)을 정의역으로 하는 함수","증명 없이 옳다고 간주되는 명제","확률 변수가 특정한 값을 가질 확률을 나타내는 함수"],"a":1,"e":"확률 변수는 사건의 표본 공간을 정의역으로 하는 함수이다. 확률 변수가 특정한 값을 가질 확률을 나타내는 함수는 확률 분포이고, 증명 없이 옳다고 간주되는 명제는 공리이다."},{"w":2,"id":75,"sec":"2.6","d":"중급","x":"강의자료 내용 필요","q":"정상적인 주사위를 던져 앞 면의 수를 확률 변수 X로 표현할 때, 강의자료의 설명으로 옳지 않은 것은?","o":["X의 정의역은 S = {1, 2, 3, 4, 5, 6} 이다","5가 나오는 사건은 {X = 5} 또는 X = 5 로 표시한다","해당 사건의 확률은 P({X = 5}) 또는 P(X = 5)로 표시한다","X는 연속 확률 변수이므로 확률을 적분으로 계산해야 한다"],"a":3,"e":"주사위의 눈은 값이 유한하므로 X는 이산형 확률 변수이며 확률 질량 함수(PMF)로 확률을 표시한다. 적분으로 계산하는 것은 연속 확률 변수의 경우이다."},{"w":2,"id":76,"sec":"2.6","d":"초급","x":null,"q":"확률 분포(probability distribution)와 표기법 X ~ P(·) 의 의미로 옳은 것은?","o":["확률 분포는 확률 변수가 특정한 값을 가질 확률을 나타내는 함수이며, X ~ P(·)는 확률 변수 X가 임의의 확률 분포 P(·)를 따른다는 의미이다","확률 분포는 표본 공간을 정의역으로 하는 함수이며, X ~ P(·)는 X와 P가 서로 독립임을 뜻한다","확률 분포는 확률 변수의 평균값이며, X ~ P(·)는 X의 기대값이 P라는 의미이다","확률 분포는 확률 변수의 정의역 크기이며, X ~ P(·)는 X의 분산을 나타낸다"],"a":0,"e":"확률 분포는 확률 변수가 특정한 값을 가질 확률을 나타내는 함수이며, X ~ P(·) 표기법은 확률 변수 X가 임의의 확률 분포 P(·)를 따른다는 의미이다.","s":["확률 분포 표기"]},{"w":2,"id":77,"sec":"2.6","d":"초급","x":null,"q":"이산형 확률 변수(Discrete random variables)에 해당하는 예로 옳은 것은?","o":["아날로그 시계의 시침과 분침이 이루는 각도","한 개의 동전을 던졌을 때 나올 수 있는 경우의 수, 또는 2의 눈이 나올 때까지 주사위를 던지는 횟수","20대 남성의 키","두 지점 사이를 이동하는 데 걸린 실제 시간"],"a":1,"e":"이산형 확률 변수는 부여될 수 있는 값이 유한하거나 셀 수 있는 경우이다. 동전 던지기의 경우의 수나 주사위를 던지는 횟수(1, 2, 3, ...)가 이에 해당한다. 각도, 키, 시간은 연속 확률 변수의 예이다."},{"w":2,"id":78,"sec":"2.6","d":"중급","x":null,"q":"연속 확률 변수(Continuous random variables)에 대한 설명으로 옳은 것은?","o":["확률 변수에 부여될 수 있는 값이 항상 정수로 제한된다","확률 변수에 부여될 수 있는 값의 개수가 유한하다","값이 셀 수 있는 경우에만 연속 확률 변수라고 한다","확률 변수에 부여될 수 있는 값에 끊김이 없는 확률 변수이며, 아날로그 시계의 시침과 분침이 이루는 각도가 그 예이다"],"a":3,"e":"연속 확률 변수는 부여될 수 있는 값에 끊김이 없는 확률 변수이며, 강의자료는 그 예로 아날로그 시계의 시침과 분침이 이루는 각도를 든다."},{"w":2,"id":79,"sec":"2.6","d":"심화","x":"강의자료 내용 필요","q":"확률의 공리(Axioms of probability)로 강의자료가 제시한 것이 아닌 것은?","o":["서로소가 아닌 임의의 두 사건 A1, A2에 대하여 P(A1 ∪ A2) = P(A1) + P(A2)","P(S) = 1 (S는 표본 공간)","모든 A ⊆ S 에 대하여 P(A) ≥ 0","A1 ∩ A2 = ∅ 인 모든 A1, A2 ⊆ S 에 대하여 P(A1 ∪ A2) = P(A1) + P(A2)"],"a":0,"e":"확률의 덧셈 공리는 두 사건의 교집합이 공집합(서로소)인 경우에만 성립한다. 교집합이 있는 경우에는 그대로 더할 수 없으므로 첫 번째 보기는 공리가 아니다."},{"w":2,"id":80,"sec":"2.6","d":"초급","x":null,"q":"확률 질량 함수(Probability mass function, PMF)에 대한 설명으로 옳은 것은?","o":["연속 확률 변수의 확률을 표시하는 함수이다","확률 변수의 기대값을 계산하는 함수이다","이산형 확률 변수의 확률을 표시하는 함수이며, 두 주사위의 합을 X로 표시할 때 P(X = x), x ∈ {2, 3, ..., 12} 가 그 예이다","확률 변수의 분산을 표시하는 함수이다"],"a":2,"e":"이산형 확률 변수의 확률을 표시하는 함수를 확률 질량 함수(PMF)라고 하며, 두 주사위의 합을 확률 변수 X로 나타낼 때 P(X = x), x ∈ {2, 3, ..., 12} 가 대표적인 예이다."},{"w":2,"id":81,"sec":"2.6","d":"중급","x":null,"q":"연속 확률 변수가 구간 [a, b]에 속하는 값을 가질 확률을 계산하는 방법으로 옳은 것은?","o":["확률 밀도 함수(PDF)를 구간 [a, b]에 대하여 적분한다","확률 밀도 함수의 값을 구간의 양 끝에서 더한다","확률 질량 함수를 구간 [a, b]에 대하여 미분한다","구간 [a, b]의 길이를 표본 공간의 크기로 나눈다"],"a":0,"e":"연속 확률 변수의 확률을 표시하는 함수를 확률 밀도 함수(PDF)라고 하며, 구간에 속할 확률은 P(X ∈ [a, b]) = ∫(a에서 b까지) P(X) dX 로 계산한다."},{"w":2,"id":82,"sec":"2.6","d":"중급","x":null,"q":"확률 변수 X가 P(X)를 따를 때, X의 함수 f(X)에 대한 기대값의 정의를 옳게 짝지은 것은?","o":["이산형: ∫ P(X) f(X) dX / 연속형: 합 X P(X) f(X)","이산형: 합 X f(X) / 연속형: ∫ f(X) dX","이산형: 합 X P(X) / 연속형: ∫ P(X) dX","이산형: 합 X P(X) f(X) / 연속형: ∫ P(X) f(X) dX"],"a":3,"e":"이산형 확률 변수의 기대값은 확률과 함수값의 곱의 합, 연속형 확률 변수의 기대값은 확률 밀도와 함수값의 곱의 적분으로 정의된다."},{"w":2,"id":83,"sec":"2.6","d":"중급","x":null,"q":"분산(Variance)의 정의로 옳은 것은?","o":["Var(f(X)) = E[f(X)]","Var(f(X)) = E[f(X)] - f(X)","Var(f(X)) = E[(f(X) - E[f(X)])^2]","Var(f(X)) = (E[f(X)])^2"],"a":2,"e":"분산은 f(X)의 값과 그 기대값 E[f(X)]의 차이를 제곱한 값의 기대값이며, 일반적으로 σ^2 으로 표시한다. 분산이 작으면 반복 측정 시 f(X) 값이 기대값 주변에서 측정된다."},{"w":2,"id":84,"sec":"2.6","d":"초급","x":null,"q":"표준 편차(standard deviation)에 대한 설명으로 옳은 것은?","o":["분산의 제곱으로 σ = Var(X)^2 로 표기된다","분산의 제곱근으로 σ = √Var(X) 로 표기된다","기대값과 같은 값이다","분산의 역수로 σ = 1/Var(X) 로 표기된다"],"a":1,"e":"분산의 제곱근이 표준 편차이며 σ = √Var(X) 로 표기된다."},{"w":2,"id":85,"sec":"2.6","d":"중급","x":null,"q":"다변량 확률 변수(multivariate random variable)와 확률 벡터(Random vector)에 대한 설명으로 옳은 것은?","o":["하나의 확률 변수를 여러 번 반복 관측한 것을 다변량 확률 변수라고 한다","다변량 확률 변수는 반드시 두 개의 확률 변수로만 구성된다","여러 확률 변수의 리스트를 다변량 확률 변수라고 하며, 이를 벡터 형태로 표현한 경우를 확률 벡터라고 한다","확률 벡터는 확률 값들을 크기 순으로 정렬한 벡터를 의미한다"],"a":2,"e":"여러 확률 변수의 리스트를 다변량 확률 변수라 하고, 벡터 형태로 표현할 경우 확률 벡터라고 한다. 예로 자동차를 가격·배기량·연비·생산연도의 네 확률 변수 집합으로 표현할 수 있다."},{"w":2,"id":86,"sec":"2.6","d":"중급","x":null,"q":"두 이산 확률 변수 X, Y에 대한 결합 확률 함수 p(x, y) = P(X = x, Y = y)가 만족해야 하는 조건으로 옳은 것은?","o":["모든 x, y에 대하여 p(x, y) ≥ 0 이고, 모든 x, y에 대한 합이 1이다","모든 x, y에 대하여 p(x, y) > 1 이고, 모든 x, y에 대한 합이 0이다","p(x, y) = P(X = x) - P(Y = y) 이고, 그 합이 1이다","p(x, y)는 음수가 될 수 있으며 합에는 제약이 없다"],"a":0,"e":"결합 확률 함수는 확률 변수 X와 Y가 동시에 x, y 값을 가질 확률을 나타내며, 모든 x, y에 대해 p(x, y) ≥ 0 이고 전체 합이 1이어야 한다."},{"w":2,"id":87,"sec":"2.6","d":"중급","x":null,"q":"주변 확률 분포(Marginal probability distribution)와 주변화(Marginalization)에 대한 설명으로 옳은 것은?","o":["결합 확률 분포를 두 확률 변수의 곱으로 분해하는 과정이다","단일 변수의 확률 분포이며, 결합 확률 분포를 기반으로 P(X = x) = 합 y P(X = x, Y = y) 로 계산하는 과정을 주변화라고 한다","확률 변수 Y가 y로 고정된 상황에서 X에 대한 확률 분포를 뜻한다","결합 확률 분포에서 가장 큰 확률 값을 선택하는 과정이다"],"a":1,"e":"주변 확률 분포는 단일 변수의 확률 분포로 결합 확률 분포를 기반으로 계산되며, 다른 변수에 대해 모두 더하는(연속인 경우 적분하는) 이 과정을 주변화라고 한다."},{"w":2,"id":88,"sec":"2.6","d":"중급","x":null,"q":"조건부 확률 분포(Conditional probability distribution)의 계산식으로 옳은 것은?","o":["P(X = x | Y = y) = P(X = x) · P(Y = y)","P(X = x | Y = y) = P(Y = y) / P(X = x, Y = y)","P(X = x | Y = y) = P(X = x, Y = y) - P(Y = y)","P(X = x | Y = y) = P(X = x, Y = y) / P(Y = y)"],"a":3,"e":"조건부 확률 분포는 확률 변수 Y가 y로 고정된(발생된) 상황에서 X에 대한 확률 분포이며, 결합 확률을 조건이 되는 사건의 확률로 나누어 계산한다.","s":["조건부·베이즈"]},{"w":2,"id":89,"sec":"2.6","d":"심화","x":null,"q":"베이즈 정리(Bayes' theorem)와 그 유도에 사용되는 관계를 옳게 나타낸 것은?","o":["P(X|Y) = P(Y|X) · P(Y) / P(X), 곱셈 규칙 P(X, Y) = P(X|Y)P(X)","P(X|Y) = P(X) · P(Y), 곱셈 규칙 P(X, Y) = P(X) + P(Y)","P(X|Y) = P(Y) / [P(Y|X) P(X)], 곱셈 규칙 P(X, Y) = P(Y|X)P(Y)","P(X|Y) = P(Y|X) · P(X) / P(Y), 곱셈 규칙 P(X, Y) = P(Y|X)P(X)"],"a":3,"e":"베이즈 정리는 P(X|Y) = P(Y|X)P(X) / P(Y) 이며, 결합 분포에 대한 곱셈 규칙 P(X, Y) = P(Y|X)P(X) 가 사용된다. P(Y, X) = P(X|Y)P(Y) = P(Y|X)P(X) 로도 표현 가능하다.","s":["조건부·베이즈"]},{"w":2,"id":90,"sec":"2.6","d":"중급","x":null,"q":"베르누이 분포(Bernoulli distribution)에 대한 설명으로 옳은 것은?","o":["확률 변수가 가질 수 있는 모든 값의 가능성이 동일한 분포이다","한 개의 이진 확률 변수에 대한 확률 분포이며, x = 1일 확률이 p이면 x = 0일 확률은 1 - p 이고 P(X = x) = p^x (1-p)^(1-x) 로 쓸 수 있다","평균과 분산 두 개의 인자로 정의되는 연속 확률 분포이다","확률 변수가 1부터 n까지의 값을 각각 1/n의 확률로 갖는 분포이다"],"a":1,"e":"베르누이 분포는 한 개의 이진 확률 변수에 대한 확률 분포로, 시행 결과가 두 가지 값 중 하나로 관찰되며 X ~ Bernoulli(p) 로 표기한다. 나머지 보기는 균등 분포와 가우시안 분포의 설명이다."},{"w":2,"id":91,"sec":"2.6","d":"초급","x":null,"q":"균등 분포(Uniform distribution)에 대한 설명으로 옳은 것은?","o":["확률 변수가 가질 수 있는 모든 값을 취할 가능성이 동일한 분포이며, X가 1부터 n까지의 값을 취할 때 P(X = i) = 1/n 이고 X ~ U(n) 으로 표기한다","한 개의 이진 확률 변수에 대한 분포로 P(X = 1) = p 이다","평균 근처의 값이 가장 높은 확률을 갖는 종 모양의 분포이다","확률 변수의 값이 커질수록 확률이 지수적으로 감소하는 분포이다"],"a":0,"e":"균등 분포는 확률 변수가 가질 수 있는 모든 값을 취할 가능성이 동일한 경우의 확률 분포이며, 1부터 n까지 값을 동일 확률로 취하면 P(X = i) = 1/n, X ~ U(n) 으로 표기한다(예: n = 5, p = 0.2)."},{"w":2,"id":92,"sec":"2.6","d":"중급","x":null,"q":"가우시안 분포(Gaussian distribution) 혹은 정규 분포(Normal distribution)에 대한 설명으로 옳은 것은?","o":["최대값과 최소값 두 인자로 정의되며 X ~ U(a, b) 로 표기한다","성공 확률 p 하나로 정의되며 이산형 확률 변수만 다룬다","평균 μ 와 분산 σ^2 를 이용하여 정의되며 X ~ N(μ, σ^2) 로 표기하고, 확률 밀도 함수는 P_X(x) = 1/√(2πσ^2) · exp(-(x-μ)^2 / (2σ^2)) 이다","평균 μ 하나만으로 정의되며 확률 밀도 함수에 분산이 등장하지 않는다"],"a":2,"e":"가우시안 분포는 평균 μ와 분산 σ^2 두 인자로 정의되며 X ~ N(μ, σ^2) 로 표기하고, 확률 밀도 함수는 1/√(2πσ^2) · exp(-(x-μ)^2 / (2σ^2)) 이다."},{"w":2,"id":93,"sec":"2.7","d":"초급","x":null,"q":"Numpy 라이브러리를 불러오는 관례적인 코드와 그 의미로 옳은 것은?","o":["from numpy import * — numpy를 np라는 이름으로 부르기로 약속하는 것","import numpy as np — numpy 라이브러리를 np라는 이름으로 불러와 numpy.~~~ 를 np.~~~ 로 쓰기로 약속하는 것","import np as numpy — np 모듈을 numpy라는 별칭으로 부르는 것","include numpy — numpy의 소스 코드를 현재 파일에 복사해 넣는 것"],"a":1,"e":"실습 자료는 import numpy as np 로 라이브러리를 불러오며, 이는 numpy.~~~ 대신 np.~~~ 로 쓰기로 약속하는 것이다. numpy는 배열에 대한 다양한 수학 연산을 제공하는 라이브러리이다."},{"w":2,"id":94,"sec":"2.7","d":"초급","x":null,"q":"a = np.array(1.), b = np.array([1., 2., 3.]), c = np.array([[1., 2., 3.], [4., 5., 6.]]) 일 때 a.ndim, b.ndim, c.ndim 의 값을 순서대로 옳게 나열한 것은?","o":["1, 2, 3","1, 1, 2","0, 1, 2","0, 0, 1"],"a":2,"e":"ndim은 배열의 차원 수를 알려준다. 스칼라 값은 0차원 배열, 벡터는 1차원 배열, 행렬은 2차원 배열이므로 각각 0, 1, 2 이다."},{"w":2,"id":95,"sec":"2.7","d":"중급","x":null,"q":"c = np.array([[1., 2., 3.], [4., 5., 6.]]) 와 d = np.array([[1, 2, 3]]) 에 대하여 c.shape 와 d.shape 를 순서대로 옳게 구한 것은?","o":["(3, 2) 와 (3, 1)","(2, 3) 와 (3,)","(6,) 와 (3,)","(2, 3) 와 (1, 3)"],"a":3,"e":"shape는 각 차원에 존재하는 요소의 수를 알려준다. c는 행 2개, 열 3개이므로 (2, 3)이고, d는 대괄호가 두 겹이므로 1개의 행과 3개의 열을 갖는 (1, 3)이다. np.array([1,2,3]) 처럼 대괄호가 한 겹이면 (3,)이 된다.","s":["ndim·shape"]},{"w":2,"id":96,"sec":"2.7","d":"중급","x":null,"q":"Numpy 배열 생성 함수에 대한 설명으로 옳은 것은?","o":["np.zeros((2, 5))는 0으로 채워진 2 × 5 배열을, np.full((2, 5), 5)는 5로 채워진 2 × 5 배열을 만든다","np.ones(10)은 0으로 채워진 길이 10의 배열을 만든다","np.arange(10)은 1부터 10까지의 정수로 구성된 배열을 만든다","np.random.random((2, 3, 4))는 실행할 때마다 항상 동일한 값을 반환한다"],"a":0,"e":"np.zeros는 0으로, np.full은 지정한 값으로 배열을 채운다. np.ones는 1로 채우고, np.arange(10)은 0부터 9까지의 정수를 만들며(컴퓨터의 인덱스는 0부터 시작), np.random.random은 실행할 때마다 임의의 값을 반환한다."},{"w":2,"id":97,"sec":"2.7","d":"중급","x":null,"q":"np.arange(10).reshape((5, 2)) 와 a.reshape((6, -1)) 에서 reshape의 동작에 대한 설명으로 옳은 것은?","o":["reshape는 배열의 값을 정렬하는 함수이다","reshape((5, 2))는 원소 수가 맞지 않아 오류가 발생한다","reshape의 인자 -1은 항상 마지막 차원의 크기를 1로 만든다","reshape는 배열을 원하는 모양으로 바꾸는 기능이며, 인자로 -1이 주어지면 전체 원소의 개수와 나머지 인자 값으로부터 그 차원의 크기가 자동으로 추정된다"],"a":3,"e":"reshape는 배열을 원하는 모양으로 바꾼다. np.arange(10)의 원소는 10개이므로 (5, 2)로 변형 가능하다. -1이 주어지면 전체 원소 수와 나머지 인자로부터 해당 차원의 값이 추정된다."},{"w":2,"id":98,"sec":"2.7","d":"심화","x":null,"q":"a = np.arange(10) 일 때 슬라이싱 결과로 옳지 않은 것은?","o":["a[0:10:2] 는 [0 2 4 6 8]","a[::-1] 는 [9 8 7 6 5 4 3 2 1 0]","a[-4:] 는 [6 7 8 9]","a[:-8] 는 [2 3 4 5 6 7 8 9]"],"a":3,"e":"a[:-8]은 인덱스 0부터 (원소 수 - 8) 직전까지, 즉 [0 1] 이다. 나머지 세 보기는 각각 간격 2 슬라이싱, 음의 간격으로 뒤집기, 뒤에서 4개 가져오기의 올바른 결과이다."},{"w":2,"id":99,"sec":"2.7","d":"심화","x":null,"q":"동일한 크기의 Numpy 배열 a, b에 대한 a * b 와 a @ b (또는 np.matmul(a, b))의 차이로 옳은 것은?","o":["a * b 와 a @ b 는 완전히 동일한 연산이다","a * b 는 같은 위치의 원소끼리 곱하는 아다마르 곱(Hadamard product)이고, a @ b 와 np.matmul(a, b)는 강의 2장에서 배운 행렬 곱이다","a * b 는 행렬 곱이고, a @ b 는 원소별 곱이다","a * b 는 두 배열의 내적을 반환하는 스칼라 연산이다"],"a":1,"e":"\"*\"와 \"/\" 기호는 동일한 크기의 배열에 대해 A[i,j]와 B[i,j]를 원소별로 계산하는 아다마르 곱(및 나눗셈)이고, N×M 행렬과 M×K 행렬을 곱해 N×K를 얻는 행렬 곱은 matmul 함수 또는 \"@\" 연산자로 표현한다.","s":["* vs @"]},{"w":2,"id":100,"sec":"2.7","d":"심화","x":null,"q":"Numpy의 축(axis) 연산과 배열 조작에 대한 설명으로 옳지 않은 것은?","o":["a.sum(axis=0)은 첫 번째 축을 기준으로, a.sum(axis=1)은 두 번째 축을 기준으로 합을 구한다","np.vstack은 수직으로, np.hstack은 수평으로 배열을 쌓는다","np.transpose(a, [0, 2, 1])은 배열 a의 값을 오름차순으로 정렬한다","브로드캐스팅은 크기가 다른 배열 사이의 연산에서 자동으로 모양을 맞추어 연산을 수행하는 기능이다"],"a":2,"e":"np.transpose(a, [0, 2, 1])은 지정한 순서로 축을 바꾸는(여기서는 축 1과 2를 교환하는) 전치 연산이며 값을 정렬하지 않는다. 2차원 배열의 경우 a.T 와 같은 역할을 한다."},{"w":3,"id":1,"sec":"3.1","d":"초급","x":"강의자료 내용 필요","q":"이 강의자료의 CHAPTER 1이 다루는 주제는 무엇인가?","o":["선형 회귀(Linear Regression)","서포트 벡터 머신(SVM)","군집화(Clustering)","강화학습(Reinforcement Learning)"],"a":0,"e":"자료의 표지에 'CHAPTER 1 선형 회귀'라고 명시되어 있으며, 단순 선형 회귀부터 다중 선형 회귀까지를 다룬다."},{"w":3,"id":2,"sec":"3.1","d":"초급","x":null,"q":"다음 중 3주차 학습 목표로 제시되지 않은 것은?","o":["회귀의 주요 개념","단순 선형 회귀 및 손실함수","단순 선형 회귀의 학습 방법(경사하강법)","의사결정나무(Decision Tree)의 가지치기"],"a":3,"e":"학습 목표는 회귀의 주요 개념, 단순 선형 회귀 및 손실함수, 학습 방법(경사하강법), 다중 선형 회귀의 네 가지이며 의사결정나무는 포함되지 않는다."},{"w":3,"id":3,"sec":"3.1","d":"초급","x":"강의자료 내용 필요","q":"강의자료의 이미지 예시에서 '가까운 정도(거리)를 색깔로 표현하여 파란색이면 가까운 곳, 빨간색이면 먼 곳으로 나타내는 것'은 어떤 문제에 해당하는가?","o":["분류(Classification)","회귀(Regression)","군집화(Clustering)","차원 축소(Dimensionality Reduction)"],"a":1,"e":"거리라는 연속적인 값을 색으로 표현한 것이므로 회귀 문제의 예시이다. 분류는 물체 종류별로 다른 색을 칠한 쪽이다."},{"w":3,"id":4,"sec":"3.1","d":"중급","x":"강의자료 내용 필요","q":"강의자료에서 '물체의 종류별로 다른 색깔로 표현하며 각 픽셀별로 구분되는 것으로 세그멘테이션으로 볼 수 있다'고 설명한 문제 유형은 무엇인가?","o":["회귀","이상치 탐지","분류","강화학습"],"a":2,"e":"종류(범주)를 구분해 표현하므로 분류 문제이며, 픽셀 단위로 범주를 나눈 결과가 세그멘테이션이다."},{"w":3,"id":5,"sec":"3.1","d":"중급","x":null,"q":"회귀 문제와 분류 문제를 색깔 표현 예시로 비교할 때 두 문제의 가장 큰 차이는 무엇인가?","o":["회귀는 거리처럼 연속적인 정도를 값으로 나타내고, 분류는 물체의 종류를 구분해 나타낸다","회귀는 픽셀 단위 처리가 불가능하고 분류만 가능하다","회귀는 지도학습이 아니고 분류만 지도학습이다","회귀는 색깔로 표현할 수 없고 분류만 색깔로 표현할 수 있다"],"a":0,"e":"강의자료의 예시는 회귀가 거리(연속량)를, 분류가 물체 종류(범주)를 색으로 나타낸다는 차이를 보여준다.","s":["회귀 vs 분류"]},{"w":3,"id":6,"sec":"3.1","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 회귀 예시로 든 집값 예측 문제에서 제시한 두 가지 관심사는 무엇인가?","o":["분류(Classification)와 군집화(Clustering)","정규화(Normalization)와 표준화(Standardization)","관계(Relation)와 예측(Prediction)","탐색(Exploration)과 활용(Exploitation)"],"a":2,"e":"집값 예측 문제는 집 값과 집 크기의 관계(Relation), 그리고 새로운 크기에 대한 가격 예측(Prediction) 두 가지로 정리된다."},{"w":3,"id":7,"sec":"3.1","d":"중급","x":null,"q":"'집 값(Price)과 집 크기(Size)의 관계는 어떻게 되는가?'라는 물음은 집값 예측 문제의 어떤 측면인가?","o":["예측(Prediction)","관계(Relation)","분류(Classification)","정규화(Regularization)"],"a":1,"e":"두 변수 사이의 관계를 묻고 있으므로 관계(Relation) 측면이다. 특정 입력에 대한 값을 묻는 것이 예측 측면이다."},{"w":3,"id":8,"sec":"3.1","d":"중급","x":null,"q":"'집 크기가 1,202 일 때 예상되는 집 가격은 어떻게 되는가?'라는 물음은 어떤 측면에 해당하는가?","o":["관계(Relation)","군집화(Clustering)","해석(Interpretation)","예측(Prediction)"],"a":3,"e":"새로운 입력 값 1,202에 대한 출력 값을 구하는 것이므로 예측(Prediction) 측면이다."},{"w":3,"id":9,"sec":"3.1","d":"초급","x":"강의자료 내용 필요","q":"강의자료의 집값 데이터 표에서 크기(x)와 가격(y)의 단위는 각각 무엇인가?","o":["feet²와 1,000$","m²와 1,000$","feet²와 1$","m²와 1$"],"a":0,"e":"표의 머리글에 크기는 feet², 가격은 1,000$ 단위로 표기되어 있다."},{"w":3,"id":10,"sec":"3.1","d":"중급","x":"강의자료 내용 필요","q":"강의자료의 집값 데이터 표에서 크기가 2,104인 데이터의 가격(y)은 얼마인가?","o":["232","460","315","178"],"a":1,"e":"표의 첫 행이 크기 2,104에 가격 460(단위 1,000$)으로 대응된다."},{"w":3,"id":11,"sec":"3.1","d":"중급","x":null,"q":"집값 데이터 표에서 크기 1,416과 1,534에 대응하는 가격을 순서대로 바르게 짝지은 것은?","o":["460과 232","315와 232","232와 315","178과 315"],"a":2,"e":"표에 따르면 1,416 → 232, 1,534 → 315 이다."},{"w":3,"id":12,"sec":"3.1","d":"초급","x":"강의자료 내용 필요","q":"회귀(Regression)에 대한 설명으로 강의자료에 제시되지 않은 것은?","o":["독립 변수와 종속 변수 간의 관계를 분석하는 것","새로운 입력 값에 대한 출력 값을 예측하는 것","종속 변수에 대한 독립 변수의 효과를 이해하는 것","데이터를 미리 정해진 개수의 군집으로 나누는 것"],"a":3,"e":"군집으로 나누는 것은 군집화(비지도학습)의 설명이다. 나머지 세 가지가 강의자료의 회귀 정의이다."},{"w":3,"id":13,"sec":"3.1","d":"중급","x":null,"q":"회귀를 설명하는 그래프에서 y_i ∈ ℝ 로 표기된 축은 무엇을 의미하는가?","o":["출력(Output)","입력(Input)","파라미터(Parameter)","학습률(Learning rate)"],"a":0,"e":"그래프에서 y_i ∈ ℝ 는 'Output'으로, x_i ∈ ℝ^d 는 'Input'으로 표기되어 있다."},{"w":3,"id":14,"sec":"3.1","d":"심화","x":null,"q":"회귀 설명 그래프에서 입력은 x_i ∈ ℝ^d 로 표기되는데, 그 그래프에서 d의 값은 얼마로 표현되어 있는가?","o":["0","1","2","N"],"a":1,"e":"그래프는 입력 축이 하나인 2차원 산점도이므로 '이 그래프에서 d는 1로 표현'이라고 명시되어 있다."},{"w":3,"id":15,"sec":"3.2","d":"초급","x":"강의자료 내용 필요","q":"회귀에서 지도학습 데이터셋은 강의자료에서 어떤 형태로 표기되는가?","o":["{x_i}_{i=1}^N","{(w_0, w_1)}","{(x_i, y_i)}_{i=1}^N","{f_w(x_i)}_{i=1}^d"],"a":2,"e":"지도학습 데이터셋은 입력과 실제 값의 쌍 {(x_i, y_i)}_{i=1}^N 으로 표기된다."},{"w":3,"id":16,"sec":"3.2","d":"초급","x":null,"q":"데이터셋 표기 {(x_i, y_i)}_{i=1}^N 에서 N은 무엇을 의미하는가?","o":["전체 관측 값의 수(데이터셋의 크기)","특징 벡터의 차원","학습률의 크기","파라미터의 개수"],"a":0,"e":"N은 전체 관측 값의 수, 즉 데이터셋의 크기를 의미한다."},{"w":3,"id":17,"sec":"3.2","d":"중급","x":null,"q":"회귀 데이터셋 표기에서 d는 무엇을 의미하는가?","o":["훈련 데이터의 개수","관측 값을 구성하는 특징의 수, 즉 특징벡터의 차원","반복 학습의 횟수","손실함수의 최솟값"],"a":1,"e":"d는 관측 값을 구성하는 특징의 수이자 특징벡터 x_i의 차원이다. 데이터 개수는 N이다.","s":["표기(N·d)"]},{"w":3,"id":18,"sec":"3.2","d":"중급","x":null,"q":"x_i = [x_i1 x_i2 ... x_ij ... x_id]^T 에서 x_ij 가 의미하는 것은 무엇인가?","o":["i번째 데이터의 실제 출력 값","j번째 데이터의 특징 벡터 전체","전체 데이터의 j번째 평균값","i번째 관측 값의 j번째 특징(Feature) 값"],"a":3,"e":"첫 첨자 i는 몇 번째 관측 값인지를, 둘째 첨자 j는 그 관측 값 안에서 몇 번째 특징인지를 가리킨다."},{"w":3,"id":19,"sec":"3.2","d":"중급","x":"강의자료 내용 필요","q":"강의자료의 데이터셋 설명에서 출력 y_i 에 대한 서술로 옳은 것은?","o":["항상 0 또는 1의 값만 갖는다","반드시 d차원 벡터로 주어진다","이 챕터에서는 스칼라 값(y_i ∈ ℝ)으로 한정한다","파라미터 w와 같은 차원을 갖는다"],"a":2,"e":"자료는 벡터 형식의 다변량 출력도 가능하지만 이 챕터에서는 y_i를 스칼라 값으로 한정한다고 밝히고 있다."},{"w":3,"id":20,"sec":"3.2","d":"초급","x":"강의자료 내용 필요","q":"입력 변수(Input variable)를 부르는 다른 이름으로 강의자료가 제시한 것은?","o":["종속 변수(Dependent variable), 목표 값(Target)","특징(Features), 독립 변수(Independent variable)","가중치(Weight), 파라미터(Parameter)","잔차(Residual), 오차(Error)"],"a":1,"e":"입력 변수는 특징(Features) 또는 독립 변수(Independent variable)로도 표현된다."},{"w":3,"id":21,"sec":"3.2","d":"초급","x":"강의자료 내용 필요","q":"출력 변수(Output variable)를 부르는 다른 이름으로 강의자료가 제시한 것은?","o":["종속 변수(Dependent variable)","독립 변수(Independent variable)","특징 벡터(Feature vector)","학습률(Learning rate)"],"a":0,"e":"출력 변수는 종속 변수(Dependent variable)라고도 표현된다."},{"w":3,"id":22,"sec":"3.2","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 제시한 회귀의 두 가지 목적으로 옳게 짝지어진 것은?","o":["압축 측면과 복원 측면","분류 측면과 군집 측면","정규화 측면과 일반화 측면","예측 측면과 해석(관계) 측면"],"a":3,"e":"회귀의 목적은 새로운 입력에 대한 출력을 예측하는 측면과, 입력에 대한 출력의 변화를 이해하는 해석(관계) 측면 두 가지이다."},{"w":3,"id":23,"sec":"3.2","d":"중급","x":null,"q":"'키가 170cm 인 사람의 몸무게는 얼마인가?'라는 질문은 회귀의 어떤 목적에 해당하는가?","o":["예측 측면","해석(관계) 측면","분류 측면","군집 측면"],"a":0,"e":"구체적인 입력 값에 대한 출력 값을 묻고 있으므로 예측 측면의 예시이다."},{"w":3,"id":24,"sec":"3.2","d":"중급","x":null,"q":"'키가 큰 사람은 몸무게가 무거운가?'라는 질문은 회귀의 어떤 목적에 해당하는가?","o":["예측 측면","최적화 측면","해석 또는 관계 측면","차원 축소 측면"],"a":2,"e":"입력 값의 변화에 따라 출력 값이 어떻게 변하는지를 묻는 것이므로 해석(관계) 측면이다.","s":["예측 vs 해석"]},{"w":3,"id":25,"sec":"3.2","d":"중급","x":"강의자료 내용 필요","q":"강의자료에서 '회귀에서의 학습'을 무엇이라고 정의하는가?","o":["데이터를 여러 군집으로 나누는 과정","입력 값이 주어졌을 때 적합한 출력 값을 내는 함수(Function)를 찾는 과정","손실함수의 값을 최대로 만드는 과정","특징의 개수를 늘려 차원을 확장하는 과정"],"a":1,"e":"회귀에서의 학습은 적합한 출력을 내는 함수, 즉 독립변수와 종속변수의 관계를 표현하는 함수를 찾는 과정이다."},{"w":3,"id":26,"sec":"3.2","d":"중급","x":"강의자료의 그림 필요","q":"회귀에서의 학습 과정을 나타낸 도식에서 훈련데이터셋과 학습 과정을 거쳐 최종적으로 얻는 것은 무엇인가?","o":["학습률 α","손실함수의 최댓값","특징 벡터 x_i","입력 x_i를 받아 y_i ≈ f(x_i)를 내는 함수(Function)"],"a":3,"e":"도식은 훈련데이터셋 → 학습 과정 → 함수(Function)의 흐름을 보여주며, 그 함수가 x_i를 받아 y_i에 가까운 값을 출력한다."},{"w":3,"id":27,"sec":"3.2","d":"초급","x":"강의자료의 그림 필요","q":"회귀에서의 학습 도식에 표기된 관계식으로 옳은 것은?","o":["y_i ≈ f(x_i), for all i","y_i = w_0 for all i","x_i ≈ f(y_i), for all i","L(w) ≈ 0 for all w"],"a":0,"e":"모든 i에 대해 실제 값 y_i가 함수 값 f(x_i)에 근사하도록 함수를 찾는 것이 학습의 목표이다."},{"w":3,"id":28,"sec":"3.2","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 강조한 상관관계(correlation)와 인과관계의 관계로 옳은 것은?","o":["상관관계가 높으면 인과관계가 성립한다","인과관계와 상관관계는 동일한 개념이다","상관관계는 인과관계와 같지 않다","상관관계가 없으면 인과관계가 반드시 존재한다"],"a":2,"e":"'상관 관계는 인과관계와 같지 않음'이 해당 슬라이드의 제목이자 핵심 메시지이다."},{"w":3,"id":29,"sec":"3.2","d":"중급","x":"강의자료 내용 필요","q":"회귀 결과를 해석할 때 강의자료가 주의하라고 한 점은 무엇인가?","o":["예측 값은 반드시 정수로 반올림해야 한다","회귀는 상관관계를 찾는 것이므로 인과 관계로 해석해서는 안 된다","독립 변수의 개수는 항상 1개여야 한다","훈련 데이터는 반드시 정규분포를 따라야 한다"],"a":1,"e":"회귀가 찾는 것은 변수 간 상관관계이므로 이를 원인과 결과로 단정해 해석하면 안 된다."},{"w":3,"id":30,"sec":"3.2","d":"심화","x":"강의자료의 그림 필요","q":"지구 평균 기온과 해적의 수를 함께 그린 그래프를 강의자료가 예시로 든 이유는 무엇인가?","o":["두 변수의 인과관계를 증명하기 위해","회귀 모델의 학습률을 설명하기 위해","손실함수의 등고선을 설명하기 위해","상관관계가 있어 보여도 인과관계로 해석하면 안 됨을 보이기 위해"],"a":3,"e":"두 변수는 직선에 가까운 상관을 보이지만 서로 원인과 결과가 아니므로, 상관관계와 인과관계를 혼동하면 안 된다는 점을 보여주는 사례이다."},{"w":3,"id":31,"sec":"3.3","d":"초급","x":null,"q":"단순 선형 회귀(Simple Linear Regression)는 어떤 경우에 해당하는 모델인가?","o":["출력 값의 개수가 1개일 때","입력 값의 차원이 1개일 때","훈련 데이터가 1개일 때","파라미터가 1개일 때"],"a":1,"e":"강의자료는 '입력 값의 차원이 1개 일때'의 선형 모델을 단순 선형 회귀라고 정의한다."},{"w":3,"id":32,"sec":"3.3","d":"초급","x":null,"q":"단순 선형 회귀 모델의 식으로 옳은 것은?","o":["f_w(x_i) = w_0 + w_1 x_i","f_w(x_i) = w_0 x_i + w_1 x_i²","f_w(x_i) = w_1 / x_i","f_w(x_i) = w_0 · w_1 · x_i"],"a":0,"e":"단순 선형 회귀는 y_i ≈ f(x_i) = f_w(x_i) = w_0 + w_1 x_i 로 정의된다.","s":["단순 선형 회귀"]},{"w":3,"id":33,"sec":"3.3","d":"중급","x":null,"q":"단순 선형 회귀에서 파라미터 벡터 w의 표기와 파라미터 개수를 옳게 짝지은 것은?","o":["w = [w_1]^T, 1개","w = [w_0 w_1 w_2]^T, 3개","w = [w_0 w_1]^T, 2개","w = [w_0]^T, 1개"],"a":2,"e":"단순 선형 회귀의 파라미터 벡터는 w = [w_0 w_1]^T 이며 2개의 파라미터를 갖는다."},{"w":3,"id":34,"sec":"3.3","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 파라미터(매개변수)를 부르는 또 다른 말로 제시된 것은?","o":["잔차(Residual)","학습률(Learning rate)","특징(Feature)","가중치(Weight)"],"a":3,"e":"슬라이드에 '또 다른 말로 가중치라고 하기도 함'이라고 표기되어 있다."},{"w":3,"id":35,"sec":"3.3","d":"중급","x":null,"q":"단순 선형 회귀에서 입력을 x_i = [x_i1] = x_i ∈ ℝ 로 쓸 수 있는 이유는 무엇인가?","o":["특징 벡터의 차원 d가 1이기 때문","훈련 데이터 수 N이 1이기 때문","출력이 스칼라이기 때문","학습률 α가 1이기 때문"],"a":0,"e":"x_i ∈ ℝ^d 에서 d = 1인 경우이므로 성분이 하나뿐인 벡터를 스칼라로 볼 수 있다."},{"w":3,"id":36,"sec":"3.3","d":"중급","x":null,"q":"f_w(x_i) = w_0 + w_1 x_i 를 그래프로 나타냈을 때 w_0가 의미하는 것은?","o":["직선의 기울기","x_i = 0일 때의 함수 값, 즉 절편","손실함수의 최솟값","특징의 개수"],"a":1,"e":"그래프에서 w_0는 세로축과 만나는 절편으로 표시되어 있고, 기울기는 w_1이다."},{"w":3,"id":37,"sec":"3.3","d":"중급","x":null,"q":"단순 선형 회귀 그래프에서 x가 1만큼 증가할 때 함수 값이 변하는 양은 무엇으로 표현되는가?","o":["w_0","α","w_1","N"],"a":2,"e":"그래프에 밑변 1에 대한 높이 변화가 w_1로 표시되어 있으며, 이는 직선의 기울기이다."},{"w":3,"id":38,"sec":"3.3","d":"심화","x":"강의자료 내용 필요","q":"강의자료에서 f(x_i)를 대신하여 쓰기도 한다고 밝힌 표기는 무엇인가?","o":["L(x_i)","α_i","w_i","ŷ_i"],"a":3,"e":"'f(x_i)를 ŷ_i 으로 표기하기도 함'이라는 각주가 달려 있다. 예측 값이라는 뜻이다."},{"w":3,"id":39,"sec":"3.3","d":"중급","x":null,"q":"단순 선형 회귀 모델 f_w(x_i) = w_0 + w_1 x_i 가 그림으로 표현하는 것은 무엇인가?","o":["독립변수와 종속변수 간의 관계","입력 데이터의 분산","출력 값의 확률 분포","훈련 데이터의 개수"],"a":0,"e":"자료는 이 모델이 독립변수와 종속변수 간의 관계를 직선으로 표현한다고 설명한다."},{"w":3,"id":40,"sec":"3.3","d":"심화","x":"강의자료 내용 필요","q":"강의자료 예시처럼 w_0 = 50, w_1 = 0.06 일 때의 모델 식과 크기 x = 2000에 대한 예측 값을 옳게 짝지은 것은?","o":["f_w(x) = 50 + 0.06x, 예측 값 50","f_w(x) = 50 + 0.06x, 예측 값 170","f_w(x) = 0.06 + 50x, 예측 값 2050","f_w(x) = 50 − 0.06x, 예측 값 −70"],"a":1,"e":"슬라이드에 f_w(x) = 50 + 0.06x 가 제시되어 있고, x = 2000을 대입하면 50 + 120 = 170 이다."},{"w":3,"id":41,"sec":"3.3","d":"중급","x":null,"q":"w_0 = 0으로 두고 w_1 = 0.5 인 모델 f_{w1}(x) = w_1 x 에서 x = 2일 때 예측 값은 얼마인가?","o":["0.5","2","1","2.5"],"a":2,"e":"f(2) = 0.5 × 2 = 1 이다. 강의자료의 예시 그래프에서도 w_1 = 0.5인 직선이 사용된다."},{"w":3,"id":42,"sec":"3.3","d":"심화","x":null,"q":"단순 선형 회귀에서 입력의 차원 d가 1인데도 파라미터가 2개인 이유를 옳게 설명한 것은?","o":["출력이 2차원이기 때문","훈련 데이터를 두 그룹으로 나누기 때문","학습률과 기울기를 각각 두기 때문","기울기 w_1 외에 절편 역할을 하는 w_0가 추가로 필요하기 때문"],"a":3,"e":"직선은 기울기와 절편 두 값으로 결정되므로 w = [w_0 w_1]^T 처럼 파라미터가 2개가 된다.","s":["절편과 기울기"]},{"w":3,"id":43,"sec":"3.4","d":"초급","x":"강의자료 내용 필요","q":"손실 함수를 부르는 다른 이름으로 강의자료가 제시하지 않은 것은?","o":["활성화 함수(Activation function)","비용 함수(Cost function)","훈련 목적 함수","손실 함수(Loss function)"],"a":0,"e":"자료는 손실 함수를 비용 함수, 훈련 목적 함수 등으로도 부른다고 했으며 활성화 함수는 언급되지 않았다."},{"w":3,"id":44,"sec":"3.4","d":"초급","x":null,"q":"손실 함수는 무엇을 위해 사용되는가?","o":["입력 데이터의 차원을 줄이기 위해","모델의 파라미터 w = [w_0 w_1]^T 를 학습할 때 사용","훈련 데이터의 개수를 늘리기 위해","출력 값을 범주로 변환하기 위해"],"a":1,"e":"손실 함수는 모델의 파라미터를 학습할 때 사용하는 기준 함수이다."},{"w":3,"id":45,"sec":"3.4","d":"중급","x":null,"q":"손실함수 L(w)의 값이 작을수록 의미하는 것은 무엇인가?","o":["모델의 파라미터 개수가 적다","학습률이 크다","모델이 예측한 출력 값 f_w(x_i)가 실제 값 y_i와 유사하다","훈련 데이터의 수가 많다"],"a":2,"e":"손실함수를 작게 할수록 훈련 데이터에 대해 예측 값이 실제 값과 유사하다는 뜻이다."},{"w":3,"id":46,"sec":"3.4","d":"초급","x":"강의자료 내용 필요","q":"손실함수를 도입하는 핵심 아이디어로 강의자료가 제시한 것은?","o":["훈련 데이터를 무작위로 섞는 것","입력의 차원을 항상 1로 고정하는 것","출력 값을 0과 1 사이로 정규화하는 것","훈련 데이터 {(x_i, y_i)}를 이용해 f_w(x_i)가 y_i에 가깝도록 w = [w_0 w_1]^T 를 정하는 것"],"a":3,"e":"핵심 아이디어는 훈련 데이터를 이용해 예측 값이 실제 값에 가깝도록 파라미터를 정하는 것이다."},{"w":3,"id":47,"sec":"3.4","d":"중급","x":"강의자료 내용 필요","q":"강의자료에 제시된 단순 선형 회귀의 손실함수 L(w) 식으로 옳은 것은?","o":["L(w) = (1/N) Σ_{i=1}^N (f_w(x_i) − y_i)²","L(w) = Σ_{i=1}^N (f_w(x_i) − y_i)","L(w) = (1/N) Σ_{i=1}^N |f_w(x_i) + y_i|","L(w) = (1/N) Σ_{i=1}^N (f_w(x_i) · y_i)²"],"a":0,"e":"자료의 손실함수는 예측 값과 실제 값 차이의 제곱을 모두 더한 뒤 N으로 나눈 평균 제곱 오차이다."},{"w":3,"id":48,"sec":"3.4","d":"중급","x":null,"q":"손실함수 정의에서 앞에 1/N 을 곱하는 것은 어떤 의미인가?","o":["오차의 총합을 최대로 만들기 위해","제곱 오차의 합을 전체 데이터 수 N으로 나누어 평균을 취하기 위해","학습률을 자동으로 조절하기 위해","파라미터 개수를 반영하기 위해"],"a":1,"e":"1/N은 오차 제곱합을 데이터 수로 나눈 평균으로 만들어, 데이터 개수에 따라 값이 커지는 것을 막는다."},{"w":3,"id":49,"sec":"3.4","d":"중급","x":null,"q":"최적 파라미터 w*를 나타내는 식으로 옳은 것은?","o":["w* = argmax_w L(w)","w* = L(w)/N","w* = argmin_w L(w)","w* = Σ_w L(w)"],"a":2,"e":"손실함수를 최소로 만드는 파라미터를 찾는 것이 목표이므로 w* = argmin_w L(w) 이다.","s":["최적 파라미터"]},{"w":3,"id":50,"sec":"3.4","d":"초급","x":null,"q":"평균 제곱 오차(Mean square error, MSE)의 식으로 옳은 것은?","o":["(1/N) Σ |f_w(x_i) − y_i|","Σ (f_w(x_i) − y_i)²","(1/N) Σ (f_w(x_i) + y_i)²","(1/N) Σ (f_w(x_i) − y_i)²"],"a":3,"e":"MSE는 예측 값과 실제 값의 차이를 제곱하여 모두 더한 뒤 N으로 나눈 값이다.","s":["MSE vs MAE"]},{"w":3,"id":51,"sec":"3.4","d":"초급","x":null,"q":"평균 절대 오차(Mean absolute error, MAE)의 식으로 옳은 것은?","o":["(1/N) Σ |f_w(x_i) − y_i|","(1/N) Σ (f_w(x_i) − y_i)²","Σ |f_w(x_i) − y_i|²","(1/N) Σ (y_i − f_w(x_i))³"],"a":0,"e":"MAE는 예측 값과 실제 값 차이의 절댓값을 평균한 값이다."},{"w":3,"id":52,"sec":"3.4","d":"중급","x":null,"q":"MSE와 MAE의 차이를 옳게 설명한 것은?","o":["MSE는 오차의 합을 그대로 쓰고 MAE는 평균을 쓴다","MSE는 오차를 제곱해 평균하고, MAE는 오차의 절댓값을 평균한다","MSE는 파라미터 학습에 쓰이고 MAE는 데이터 전처리에만 쓰인다","MSE는 분류 문제에만, MAE는 회귀 문제에만 쓰인다"],"a":1,"e":"두 식 모두 1/N 을 곱한 평균이지만, 오차를 제곱하느냐 절댓값을 취하느냐가 다르다.","s":["MSE vs MAE"]},{"w":3,"id":53,"sec":"3.4","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 대표적인 손실함수로 제시한 두 가지는 무엇인가?","o":["교차 엔트로피와 힌지 손실","KL 발산과 코사인 유사도","MSE와 MAE","정확도와 재현율"],"a":2,"e":"자료는 다양한 손실함수가 있지만 대표적으로 MSE와 MAE가 있다고 밝히고 있다."},{"w":3,"id":54,"sec":"3.4","d":"심화","x":"강의자료 내용 필요","q":"손실함수에 관한 강의자료의 서술로 옳은 것은?","o":["회귀에서 쓸 수 있는 손실함수는 MSE 하나뿐이다","손실함수는 파라미터와 무관하게 결정된다","손실함수 값이 클수록 예측이 정확하다","MSE와 MAE 이외에도 다양한 손실함수가 존재한다"],"a":3,"e":"'이외에도 다양한 손실함수가 존재하지만 대표적으로 MSE, MAE가 있다'고 명시되어 있다."},{"w":3,"id":55,"sec":"3.4","d":"중급","x":null,"q":"w_0 = 0으로 고정한 경우의 모델과 손실함수를 옳게 짝지은 것은?","o":["f_{w1}(x) = w_1 x 이고 L(w_1) = (1/N) Σ (f_{w1}(x_i) − y_i)²","f_{w1}(x) = w_0 + w_1 x 이고 L(w_1) = Σ (f_w(x_i) − y_i)","f_{w1}(x) = w_1 이고 L(w_1) = (1/N) Σ |w_1 − y_i|","f_{w1}(x) = w_1 x 이고 L(w_1) = argmin_w L(w)"],"a":0,"e":"w_0 = 0이면 모델은 원점을 지나는 직선 w_1 x 가 되고, 손실함수는 파라미터 w_1 하나만의 함수인 평균 제곱 오차가 된다."},{"w":3,"id":56,"sec":"3.4","d":"중급","x":null,"q":"w_0 = 0으로 고정하여 파라미터가 w_1 하나뿐일 때의 목표(Goal)를 나타낸 식은?","o":["w_1* = argmax_{w_1} L(w_1)","w_1* = argmin_{w_1} L(w_1)","w* = argmin_w f_w(x)","w_1* = (1/N) Σ y_i"],"a":1,"e":"목표는 손실함수 L(w_1)을 최소로 만드는 w_1을 찾는 것이므로 argmin으로 표기된다."},{"w":3,"id":57,"sec":"3.4","d":"심화","x":null,"q":"훈련 데이터가 (1,1), (2,2), (3,3)이고 모델이 f(x) = w_1 x 이며 w_1 = 0.5 일 때 평균 제곱 오차 값은 얼마인가?","o":["0.5","1.0","약 1.17","3.5"],"a":2,"e":"예측은 0.5, 1, 1.5이고 오차 제곱은 0.25, 1, 2.25이므로 합 3.5를 N = 3으로 나누면 약 1.17이다."},{"w":3,"id":58,"sec":"3.4","d":"심화","x":null,"q":"훈련 데이터가 (1,1), (2,2), (3,3)이고 모델이 f(x) = w_1 x 일 때, w_1 = 1로 두면 평균 제곱 오차 값은 얼마인가?","o":["약 1.17","0.5","1.0","0"],"a":3,"e":"w_1 = 1이면 모든 점에서 예측 값과 실제 값이 일치하므로 오차 제곱의 합이 0이 되어 손실함수 값도 0이다."},{"w":3,"id":59,"sec":"3.4","d":"중급","x":null,"q":"f_w(x)를 그린 그래프와 L(w)를 그린 그래프의 차이를 옳게 설명한 것은?","o":["전자는 w를 고정한 채 x에 대한 함수이고, 후자는 매개변수 w에 대한 함수이다","전자는 매개변수의 함수이고 후자는 입력의 함수이다","두 그래프는 축만 다를 뿐 항상 같은 모양이다","전자는 항상 3차원이고 후자는 항상 2차원이다"],"a":0,"e":"슬라이드마다 f_w(x)는 'w가 고정된 경우, x의 함수', L(w)는 '매개변수 w의 함수'로 명시되어 있다.","s":["데이터·파라미터 공간"]},{"w":3,"id":60,"sec":"3.4","d":"중급","x":null,"q":"L(w)를 w_0, w_1 두 축에 대해 3차원으로 그린 그래프는 어떤 형태로 나타나는가?","o":["평평한 평면","아래로 볼록해 최솟값을 갖는 그릇 모양의 곡면","계단 모양의 불연속 함수","위로 볼록해 최댓값만 갖는 곡면"],"a":1,"e":"제곱 오차 손실함수는 아래로 볼록한 그릇 모양 곡면으로 그려지며 바닥이 최소 지점이 된다.","s":["손실 곡면"]},{"w":3,"id":61,"sec":"3.4","d":"중급","x":"강의자료의 그림 필요","q":"손실함수의 등고선(contour) 그림에서 안쪽 곡선에 가까울수록 무엇을 의미하는가?","o":["손실함수 값이 크다","파라미터가 발산한다","손실함수 값이 작다","학습률이 커진다"],"a":2,"e":"등고선 그림에 안쪽은 '작은 손실함수값', 바깥쪽은 '큰 손실함수값'으로 표시되어 있다."},{"w":3,"id":62,"sec":"3.4","d":"심화","x":"강의자료의 그림 필요","q":"손실함수 등고선 그림에서 Minimum으로 표시된 지점이 뜻하는 것은 무엇인가?","o":["훈련 데이터의 평균값","학습률이 0이 되는 지점","기울기가 최대가 되는 지점","손실함수를 최소로 만드는 w_0, w_1의 위치이며 이때 직선이 데이터를 가장 잘 설명한다"],"a":3,"e":"등고선의 가장 안쪽 중심이 손실 최소 지점이며, 그 파라미터를 쓴 직선이 훈련 데이터의 추세를 가장 잘 따라간다."},{"w":3,"id":63,"sec":"3.5","d":"초급","x":null,"q":"경사하강법(Gradient descent)의 목적을 옳게 서술한 것은?","o":["손실함수 L(w)를 최소화하는 파라미터 w* = [w_0* w_1*]^T 를 찾는 것","손실함수를 최대화하는 파라미터를 찾는 것","훈련 데이터의 개수를 최소화하는 것","특징의 차원을 늘리는 것"],"a":0,"e":"경사하강법은 모델의 학습 방법으로, 손실함수를 가장 최소화하는 파라미터를 찾는 절차이다."},{"w":3,"id":64,"sec":"3.5","d":"중급","x":"강의자료 내용 필요","q":"파라미터 후보 값을 몇 개 정해 두고 손실함수 값이 가장 작은 것을 고르는 방법의 문제점으로 강의자료가 지적한 것은?","o":["손실함수를 계산할 수 없다","후보 값을 정하는 것이 쉽지 않다","기울기를 계산할 수 없다","반드시 발산한다"],"a":1,"e":"가장 간단한 방법이지만 어떤 후보 값을 얼마나 촘촘히 둘지 정하기가 어렵다는 한계가 있다."},{"w":3,"id":65,"sec":"3.5","d":"초급","x":null,"q":"한 지점에서의 기울기(Gradient)는 무엇을 의미하는가?","o":["함수 값 자체","함수 값들의 평균","함수의 접선 기울기","함수의 최솟값"],"a":2,"e":"강의자료는 한 지점에서의 기울기를 그 점에서의 함수의 접선 기울기로 정의한다."},{"w":3,"id":66,"sec":"3.5","d":"중급","x":null,"q":"기울기가 나타내는 방향에 대한 설명으로 옳은 것은?","o":["함수를 가장 크게 감소시키는 방향","함수 값이 변하지 않는 방향","항상 가로축과 평행한 방향","함수를 가장 최대로 증가시키는 방향"],"a":3,"e":"기울기는 함수를 가장 최대로 증가시키는 방향을 나타내므로, 감소를 원하면 그 반대인 음의 기울기 방향으로 가야 한다."},{"w":3,"id":67,"sec":"3.5","d":"중급","x":null,"q":"현재 지점 w = [w_0 w_1]^T 에서 −∂L(w)/∂w 방향이 의미하는 것은 무엇인가?","o":["손실함수 L(w)를 최대로 감소시키는 방향이며 경사하강의 방향이다","손실함수를 최대로 증가시키는 방향이다","손실함수 값이 변하지 않는 방향이다","학습률의 크기를 결정하는 방향이다"],"a":0,"e":"음의 기울기 방향이 손실함수를 최대로 감소시키는 방향이며 이를 경사하강(gradient descent)의 방향이라고 부른다.","s":["경사하강 방향"]},{"w":3,"id":68,"sec":"3.5","d":"초급","x":null,"q":"경사하강법 절차의 첫 단계는 무엇인가?","o":["종료조건의 값을 먼저 계산한다","초기 값 w = [w_0 w_1]^T 에서 시작한다","손실함수의 최솟값을 미리 구한다","학습률을 0으로 놓는다"],"a":1,"e":"절차의 (1)단계는 파라미터의 초기 값을 정하고 그 지점에서 시작하는 것이다."},{"w":3,"id":69,"sec":"3.5","d":"중급","x":"강의자료 내용 필요","q":"강의자료가 경사하강법 절차에서 예로 든 초기 값은 무엇인가?","o":["w_0 = 1, w_1 = 1","w_0 = 1, w_1 = 0","w_0 = 0, w_1 = 1","w_0 = 0, w_1 = 0"],"a":2,"e":"절차 (1)에 '예를 들어 w_0 = 0, w_1 = 1'이라는 예시가 붙어 있다."},{"w":3,"id":70,"sec":"3.5","d":"중급","x":null,"q":"경사하강법 절차의 두 번째 단계를 옳게 설명한 것은?","o":["손실함수가 증가하는 방향으로 한 번만 업데이트한다","학습률을 매 단계마다 두 배로 늘린다","훈련 데이터를 새로 수집한다","종료조건을 만족할 때까지 L(w)를 감소하는 방향으로 w를 반복적으로 업데이트한다"],"a":3,"e":"(2)단계는 종료조건을 만족할 때까지 손실을 줄이는 방향으로 파라미터를 반복 갱신하는 것이다."},{"w":3,"id":71,"sec":"3.5","d":"초급","x":null,"q":"경사하강법을 '높은 산에서 가장 빨리 내려가는 방법'에 비유한 이유는 무엇인가?","o":["현재 위치에서 가장 가파르게 내려가는 방향으로 조금씩 이동하는 방식이기 때문","산의 정상을 찾아가는 방식이기 때문","무작위로 위치를 바꾸는 방식이기 때문","모든 위치의 높이를 전부 계산해 비교하는 방식이기 때문"],"a":0,"e":"손실함수 곡면을 지형으로 보면 경사하강법은 현재 위치의 가장 가파른 내리막 방향으로 한 걸음씩 내려가는 것과 같다."},{"w":3,"id":72,"sec":"3.5","d":"중급","x":null,"q":"경사하강법의 세 가지 핵심 질문 중 'w는 어디에서 시작하는가?'에 대응하는 개념은?","o":["기울기(Gradient)","초기화(Initialization)","학습률(Learning rate)","종료조건"],"a":1,"e":"Q1(어디에서 시작하는가)은 초기화(Initialization)에 해당한다."},{"w":3,"id":73,"sec":"3.5","d":"중급","x":null,"q":"경사하강법의 세 가지 핵심 질문 중 '어느 방향으로 w를 업데이트 하는가?'에 대응하는 개념은?","o":["초기화(Initialization)","학습률(Learning rate)","기울기(Gradient)","손실함수(Loss function)"],"a":2,"e":"Q2(어느 방향인가)는 기울기(Gradient)에 해당하며, 실제로는 음의 기울기 방향으로 이동한다."},{"w":3,"id":74,"sec":"3.5","d":"중급","x":null,"q":"경사하강법의 세 가지 핵심 질문 중 'w를 업데이트 할 때 얼마큼 움직이는가?'에 대응하는 개념은?","o":["기울기(Gradient)","초기화(Initialization)","특징 벡터(Feature vector)","학습률(Learning rate)"],"a":3,"e":"Q3(얼마큼 움직이는가)은 학습률(Learning rate) α에 해당한다."},{"w":3,"id":75,"sec":"3.5","d":"초급","x":null,"q":"경사하강법의 세 가지 질문과 대응 개념을 순서대로 바르게 나열한 것은?","o":["시작 위치 → 초기화, 업데이트 방향 → 기울기, 이동량 → 학습률","시작 위치 → 학습률, 업데이트 방향 → 초기화, 이동량 → 기울기","시작 위치 → 기울기, 업데이트 방향 → 학습률, 이동량 → 초기화","시작 위치 → 초기화, 업데이트 방향 → 학습률, 이동량 → 기울기"],"a":0,"e":"Q1은 초기화, Q2는 기울기, Q3은 학습률로 정리된다.","s":["GD 세 질문"]},{"w":3,"id":76,"sec":"3.5","d":"중급","x":"강의자료 내용 필요","q":"경사하강법에서 w의 최초 값에 대한 강의자료의 설명으로 옳은 것은?","o":["초기 값과 무관하게 항상 같은 결과에 도달한다","최초 값에 따라 탐색 결과가 달라질 수 있어 w의 초기 상태도 중요한 이슈이다","초기 값은 반드시 0으로 두어야 한다","초기 값이 클수록 항상 더 좋은 결과를 얻는다"],"a":1,"e":"자료는 'W의 최초 값에 따라 탐색 결과가 틀려 질 수 있다'며 초기 상태가 중요한 이슈임을 강조한다."},{"w":3,"id":77,"sec":"3.5","d":"초급","x":null,"q":"경사하강법 알고리즘에서 w_0의 갱신식으로 옳은 것은?","o":["w_0 ← w_0 + α ∂L(w_0, w_1)/∂w_0","w_0 ← w_0 − ∂L(w_0, w_1)/∂w_0","w_0 ← w_0 − α ∂L(w_0, w_1)/∂w_0","w_0 ← α w_0 − ∂L(w_0, w_1)/∂w_0"],"a":2,"e":"현재 값에서 학습률 α와 편미분 값의 곱을 빼는 형태이다. 부호가 +이면 손실이 커지는 방향으로 이동하게 된다.","s":["GD 갱신식"]},{"w":3,"id":78,"sec":"3.5","d":"초급","x":null,"q":"경사하강법 알고리즘에서 w_1의 갱신식으로 옳은 것은?","o":["w_1 ← w_1 + α ∂L(w_0, w_1)/∂w_1","w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_0","w_1 ← w_1 · α ∂L(w_0, w_1)/∂w_1","w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_1"],"a":3,"e":"w_1은 자기 자신에 대한 편미분 ∂L/∂w_1 을 사용해 갱신하며, 학습률을 곱한 값을 빼준다."},{"w":3,"id":79,"sec":"3.5","d":"중급","x":null,"q":"갱신식 w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_1 에서 α는 무엇을 가리키는가?","o":["학습률","기울기","손실함수 값","특징의 개수"],"a":0,"e":"슬라이드에서 α는 학습률(Learning rate)로, 편미분 항은 기울기로 표시되어 있다."},{"w":3,"id":80,"sec":"3.5","d":"중급","x":null,"q":"경사하강법 알고리즘에서 갱신 과정을 반복하는 조건으로 옳은 것은?","o":["손실함수가 증가할 때까지","종료조건을 만족할 때까지 (예: for loop, while loop)","전체 데이터를 한 번 보고 나면 즉시 중단","기울기가 최대가 될 때까지"],"a":1,"e":"알고리즘 상단에 '종료조건을 만족할 때까지 아래 과정을 반복한다'고 적혀 있고 예시로 for loop, while loop가 제시된다."},{"w":3,"id":81,"sec":"3.5","d":"심화","x":null,"q":"∂L/∂w_1 이 양수(positive number)일 때 갱신식 w_1 ← w_1 − α(양수)의 결과는 어떻게 되는가?","o":["w_1이 커진다","w_1이 변하지 않는다","w_1이 작아진다","w_1의 부호가 반대로 바뀐다"],"a":2,"e":"학습률 α는 양수이므로 양수를 빼게 되어 w_1은 감소한다. 즉 손실이 줄어드는 왼쪽 방향으로 이동한다.","s":["기울기 부호"]},{"w":3,"id":82,"sec":"3.5","d":"심화","x":null,"q":"∂L/∂w_1 이 음수(negative number)일 때 갱신식 w_1 ← w_1 − α(음수)의 결과는 어떻게 되는가?","o":["w_1이 작아진다","w_1이 0이 된다","w_1이 변하지 않는다","w_1이 커진다"],"a":3,"e":"음수를 빼면 값이 더해지는 것과 같으므로 w_1은 증가하며, 역시 손실이 줄어드는 방향으로 이동한다.","s":["기울기 부호"]},{"w":3,"id":83,"sec":"3.5","d":"중급","x":null,"q":"학습률 α가 너무 작을 때 나타나는 현상은 무엇인가?","o":["경사 하강이 천천히 발생한다","곧바로 발산한다","기울기가 0이 된다","손실함수가 최대가 된다"],"a":0,"e":"자료는 'α가 너무 작으면 경사 하강이 천천히 발생함'이라고 설명한다. 한 걸음의 폭이 작기 때문이다.","s":["학습률 크기"]},{"w":3,"id":84,"sec":"3.5","d":"중급","x":null,"q":"학습률 α가 너무 클 때 나타나는 현상은 무엇인가?","o":["학습이 매우 느려진다","수렴되지 않고 발산 등이 될 수 있다","항상 최솟값에 정확히 도달한다","기울기 계산이 불가능해진다"],"a":1,"e":"자료는 'α가 너무 크면, 수렴되지 않고 발산 등이 됨'이라고 밝히고 있다. 최소 지점을 지나쳐 진동하거나 튕겨 나가기 때문이다.","s":["학습률 크기"]},{"w":3,"id":85,"sec":"3.5","d":"심화","x":null,"q":"경사하강법의 한계점으로 제시된 상황, 즉 기울기가 0이 되어 w_1 ← w_1 − α(0) 이 되는 경우의 결과는?","o":["학습률이 자동으로 커진다","손실함수가 즉시 최솟값이 된다","w_1이 더 이상 갱신되지 않고 그 지점에 머무른다","w_1이 무한히 커진다"],"a":2,"e":"기울기가 0이면 빼줄 양이 0이므로 파라미터가 갱신되지 않는다. 그 지점이 전역 최솟값이 아니어도 멈추게 되는 것이 한계점이다.","s":["GD 한계점"]},{"w":3,"id":86,"sec":"3.5","d":" 2 x_i4 에 x_i1 = 1000, x_i2 = 200, x_i3 = 2, x_i4 = 40 을 대입하면 예측 값은 얼마인가?","o":["102","112","122","192"],"a":1,"e":"80 + 100 + 2 + 10 − 80 = 112 이다."},{"w":3,"id":94,"sec":"3.6","d":"중급","x":"강의자료 내용 필요","q":"다중 선형 회귀 식을 간편하게 표기하기 위해 강의자료가 도입한 약속은 무엇인가?","o":["w_0 = 0으로 둔다","α = 1로 둔다","x_i0 = 1로 정의한다","N = d로 둔다"],"a":2,"e":"x_i0 = 1로 정의하면 상수항 w_0도 w_0 x_i0 형태가 되어 전체 식을 하나의 내적으로 쓸 수 있다."},{"w":3,"id":95,"sec":"3.6","d":"중급","x":null,"q":"x_i0 = 1로 정의했을 때 x_i와 w는 각각 어느 공간의 벡터가 되는가?","o":["둘 다 ℝ^d","x_i는 ℝ^d, w는 ℝ^(d+1)","x_i는 ℝ^(d+1), w는 ℝ^d","둘 다 ℝ^(d+1)"],"a":3,"e":"x_i = [x_i0 x_i1 ... x_id]^T, w = [w_0 w_1 ... w_d]^T 로 성분이 하나씩 늘어 둘 다 (d+1)차원 벡터가 된다."},{"w":3,"id":96,"sec":"3.6","d":"초급","x":null,"q":"x_i0 = 1 약속을 사용하면 다중 선형 회귀의 매핑 함수는 어떻게 간단히 표현되는가?","o":["f_w(x_i) = w^T x_i","f_w(x_i) = w x_i^T x_i","f_w(x_i) = w_0 x_i","f_w(x_i) = (w − x_i)²"],"a":0,"e":"모든 항이 w_j x_ij 형태가 되므로 두 벡터의 내적 w^T x_i 하나로 쓸 수 있다.","s":["w^T x 표기"]},{"w":3,"id":97,"sec":"3.6","d":"중급","x":null,"q":"다중 선형 회귀의 손실함수 식으로 옳은 것은?","o":["L(w) = Σ |w^T x_i − y_i|","L(w) = (1/N) Σ_{i=1}^N (f_w(x_i) − y_i)²","L(w) = (1/N) Σ_{i=1}^N (w^T x_i + y_i)","L(w) = (1/N) Σ_{i=1}^N y_i²"],"a":1,"e":"단순 선형 회귀와 같은 평균 제곱 오차 형태이며, f_w(x_i) = w^T x_i 로 바뀐 점만 다르다."},{"w":3,"id":98,"sec":"3.6","d":"심화","x":null,"q":"다중 선형 회귀의 경사하강법에서 파라미터 w_j 의 일반 갱신식으로 옳은 것은?","o":["w_j ← w_j + α ∂L(w)/∂w_j","w_j ← w_j − α ∂L(w)/∂w_0","w_j ← w_j − α ∂L(w)/∂w_j","w_j ← α ∂L(w)/∂w_j"],"a":2,"e":"각 파라미터는 자기 자신에 대한 편미분을 사용해 w_j ← w_j − α ∂L(w)/∂w_j 로 갱신된다."},{"w":3,"id":99,"sec":"3.6","d":"심화","x":null,"q":"L(w) = (1/N) Σ (f_w(x_i) − y_i)² 를 w_j 로 편미분하여 정리한 다중 선형 회귀의 갱신식으로 옳은 것은?","o":["w_j ← w_j − α (1/N) Σ (f_w(x_i) − y_i)","w_j ← w_j − α (2/N) Σ (f_w(x_i) − y_i)","w_j ← w_j − α (1/N) Σ (f_w(x_i) − y_i) x_ij","w_j ← w_j − α (2/N) Σ_{i=1}^N (f_w(x_i) − y_i) x_ij"],"a":3,"e":"제곱을 미분하면 계수 2가 나오고 연쇄법칙으로 x_ij 가 곱해져 (2/N) Σ (f_w(x_i) − y_i) x_ij 가 된다.","s":["다중 회귀 갱신"]},{"w":3,"id":100,"sec":"3.6","d":"심화","x":null,"q":"단순 선형 회귀와 다중 선형 회귀의 경사하강법을 비교한 설명으로 옳은 것은?","o":["다중 선형 회귀에서는 기울기를 사용하지 않는다","단순 선형 회귀에서는 파라미터를 갱신하지 않는다","다중 선형 회귀에서는 학습률을 사용하지 않는다","단순 선형 회귀는 w_0, w_1 두 개를 갱신하고, 다중 선형 회귀는 w_0부터 w_d까지 각 w_j를 같은 형태로 갱신한다"],"a":3,"e":"두 경우 모두 Repeat 안에서 학습률과 편미분을 이용해 갱신하며, 차이는 갱신 대상 파라미터의 개수뿐이다.","s":["단순 vs 다중"]},{"w":4,"id":1,"sec":"4.1","d":"초급","x":null,"q":"단순 선형회귀에서 i번째 관측 값의 예측값 ŷᵢ를 나타내는 식으로 옳은 것은?","o":["ŷᵢ = w₀ + w₁xᵢ","ŷᵢ = w₀xᵢ + w₁xᵢ²","ŷᵢ = σ(w₀ + w₁xᵢ)","ŷᵢ = w₁ ÷ (w₀ + xᵢ)"],"a":0,"e":"단순 선형회귀는 하나의 실수 입력 xᵢ에 대하여 ŷᵢ = w₀ + w₁xᵢ 형태의 1차식으로 예측값을 계산한다."},{"w":4,"id":2,"sec":"4.1","d":"초급","x":null,"q":"단순 선형회귀 ŷᵢ = w₀ + w₁xᵢ에서 w₀와 w₁이 의미하는 것은?","o":["손실함수가 출력하는 값","학습 데이터의 개수","모델의 동작을 결정하는 인자(파라미터)","관측 값의 클래스 레이블"],"a":2,"e":"실수 xᵢ는 입력이고, w₀와 w₁은 모델의 동작을 결정하는 인자로서 학습을 통해 결정된다."},{"w":4,"id":3,"sec":"4.1","d":"초급","x":null,"q":"선형회귀 함수의 학습 목표를 손실함수 L(w)로 표현하면 무엇인가?","o":["L(w)의 값을 0으로 고정","주어진 학습 데이터를 이용하여 L(w)를 최소화하는 w를 탐색","L(w)의 미분값을 최대화하는 w를 탐색","L(w)를 최대화하는 w를 탐색"],"a":1,"e":"선형회귀의 목표는 주어진 학습 데이터를 이용하여 손실함수 L(w)를 최소화하는 인자 w를 찾는 것이다."},{"w":4,"id":4,"sec":"4.1","d":"중급","x":null,"q":"선형회귀의 손실함수 L(w) = (1/N)Σᵢ(ŷᵢ − yᵢ)²에 대한 설명으로 옳은 것은?","o":["예측 확률의 로그 값을 모두 더한 값이다","오드(odds)의 로그를 평균한 값이다","가중치 벡터의 크기를 제곱한 값이다","예측값과 실제값 차이의 제곱을 평균한 값이다"],"a":3,"e":"제시된 손실함수는 각 관측 값에 대한 (예측값 − 실제값)의 제곱을 N개에 대하여 평균한 형태이다."},{"w":4,"id":5,"sec":"4.1","d":"중급","x":null,"q":"경사하강법(Gradient Descent)으로 인자 w₀를 갱신하는 식으로 옳은 것은?","o":["w₀ ← w₀ + α·L(w)","w₀ ← w₀ − α·∂L(w)/∂w₀","w₀ ← α·∂L(w)/∂w₀","w₀ ← w₀ × ∂L(w)/∂w₀"],"a":1,"e":"경사하강법은 손실함수의 편미분에 학습률 α를 곱한 값을 현재 인자에서 빼는 방식으로 인자를 갱신한다.","s":["경사하강법"]},{"w":4,"id":6,"sec":"4.1","d":"중급","x":null,"q":"w* = argmin L(w)라는 표기와 경사하강법의 관계를 설명한 것으로 가장 적절한 것은?","o":["손실함수의 최댓값을 한 번에 구하는 해석적 공식이 경사하강법이다","학습 데이터를 무작위로 재배열하는 기법이 경사하강법이다","특징 벡터의 차원을 줄이는 기법이 경사하강법이다","손실함수를 최소로 만드는 w를 반복적인 갱신으로 탐색하는 방법이 경사하강법이다"],"a":3,"e":"강의자료는 경사하강법을 L(w)를 최소화하는 w(즉 w* = argmin L(w))를 탐색하는 방법으로 소개한다."},{"w":4,"id":7,"sec":"4.1","d":"중급","x":null,"q":"입력이 xᵢ = [xᵢ₁ … x_id]ᵀ인 다중 선형회귀의 예측식으로 옳은 것은?","o":["ŷᵢ = w₀ + w₁xᵢ₁ + … + w_d x_id","ŷᵢ = w₀ × xᵢ₁ × … × x_id","ŷᵢ = Σₖ (xᵢₖ)²","ŷᵢ = w₀ + w₁(xᵢ₁)²"],"a":0,"e":"다중 선형회귀는 d개의 특징 각각에 가중치를 곱하고 바이어스 w₀를 더한 형태로 예측값을 계산한다."},{"w":4,"id":8,"sec":"4.1","d":"심화","x":null,"q":"다중 선형회귀를 ŷᵢ = wᵀxᵢ라는 간결한 형태로 표기할 수 있는 이유로 옳은 것은?","o":["모든 가중치를 동일한 값으로 두기 때문","손실함수를 제곱합 대신 절댓값 합으로 바꾸기 때문","바이어스에 해당하는 특징 벡터의 성분을 1로 표기하기 때문","모든 입력 특징을 0과 1 사이로 정규화하기 때문"],"a":2,"e":"특징 벡터를 [1 xᵢ₁ … x_id]ᵀ로, 인자를 w = [w₀ … w_d]ᵀ로 표기하면 바이어스가 내적 안에 흡수되어 ŷᵢ = wᵀxᵢ로 쓸 수 있다."},{"w":4,"id":9,"sec":"4.1","d":"초급","x":null,"q":"분류(Classification)의 정의로 가장 적절한 것은?","o":["군집의 개수를 자동으로 결정하는 작업","연속적인 실수 값을 예측하는 작업","특성 값의 집합으로 설명되는 개체의 소속 클래스/카테고리를 예측하는 작업","데이터를 저차원 공간으로 사영하는 작업"],"a":2,"e":"분류는 특성 값의 집합으로 설명되는 개체가 어떤 클래스/카테고리에 속하는지를 예측하는 작업이다.","s":["분류 정의"]},{"w":4,"id":10,"sec":"4.1","d":"초급","x":null,"q":"분류 작업에서 전제하는 가정으로 옳은 것은?","o":["클래스/카테고리가 사전에 식별되며 모든 개체가 어느 한 클래스에 속한다고 가정한다","개체마다 서로 다른 특징의 집합으로 설명된다","클래스의 개수는 항상 2개로 제한된다","클래스는 학습 도중에 새롭게 생성된다"],"a":0,"e":"분류 작업에서는 클래스/카테고리가 사전에 식별되어 있고, 모든 개체가 어느 한 클래스에 속한다고 가정한다."},{"w":4,"id":11,"sec":"4.1","d":"중급","x":null,"q":"분류 문제의 학습 데이터 D = {(xᵢ, yᵢ)}ᵢ₌₁ᴺ에 대한 설명으로 옳지 않은 것은?","o":["xᵢ는 i번째 관측 값의 특징 벡터이다","yᵢ는 i번째 관측 값이 속한 클래스/카테고리의 레이블 정보이다","N은 관측 값의 개수를 의미한다","yᵢ는 실수 전체 범위의 임의의 값을 가진다"],"a":3,"e":"분류에서 yᵢ는 yᵢ ∈ {C₁, C₂, …, C_K}처럼 미리 정해진 클래스 레이블 중 하나이며 실수 전체 범위를 갖지 않는다."},{"w":4,"id":12,"sec":"4.1","d":"초급","x":null,"q":"yᵢ ∈ {C₁, C₂, …, C_K} 표기에서 K가 의미하는 것은?","o":["특징의 개수","클래스의 개수","학습 데이터의 개수","경사하강법의 반복 횟수"],"a":1,"e":"K는 분류 문제에서 사전에 식별된 클래스의 개수를 의미한다."},{"w":4,"id":13,"sec":"4.1","d":"중급","x":"강의자료 내용 필요","q":"메일을 “스팸메일”과 “스팸이 아닌 메일”로 분류할 때 강의자료가 설명한 레이블 표기 방식은?","o":["C₁과 C₂를 모두 1이라는 값으로 표기","클래스 레이블을 문자열 그대로 저장하여 사용","클래스 레이블을 −1과 +1로만 표기","“스팸메일”을 C₁, “스팸이 아닌 메일”을 C₂로 두고 실제 데이터에서는 각각 1과 0으로 표기"],"a":3,"e":"강의자료는 C₁을 “스팸메일”, C₂를 “스팸이 아닌 메일”로 두고, 실제 데이터 관리 시 C₁을 1, C₂를 0이라는 값으로 표기한다고 설명한다."},{"w":4,"id":14,"sec":"4.1","d":"심화","x":null,"q":"2개의 클래스가 존재하는 도메인에서 클래스 레이블을 1과 0이라는 숫자로 표기하는 이유로 가장 적절한 것은?","o":["확률 값을 그대로 저장하기 위해","학습 데이터를 표기하고 관리할 때 구체적인 숫자를 사용하는 것이 편리하기 때문","클래스의 개수를 줄이기 위해","특징 공간의 차원을 늘리기 위해"],"a":1,"e":"강의자료는 학습 데이터를 표기할 때 구체적인 숫자를 사용하는 것이 편리하므로 실제 데이터에서는 C₁을 1, C₂를 0으로 표기한다고 설명한다."},{"w":4,"id":15,"sec":"4.2","d":"초급","x":null,"q":"특징 벡터(feature vector)의 정의로 옳은 것은?","o":["모델의 가중치 값을 모아 놓은 벡터","손실함수의 기울기 성분을 모아 놓은 벡터","모든 개체를 동일한 특징으로 설명할 때 개별 관측 값을 표현하는 벡터","클래스 레이블만 모아 놓은 벡터"],"a":2,"e":"모든 개체를 동일한 특징으로 설명하면 개별 관측 값이 하나의 벡터로 표현되는데, 이러한 표현 형태를 특징 벡터라고 부른다."},{"w":4,"id":16,"sec":"4.2","d":"초급","x":null,"q":"학과를 인공지능학과=1, 기계공학과=2, 수학과=3, 물리학과=4로 표기할 때 “인공지능학과”에 재학 중이고 평점이 3.8인 “홍길동”의 특징 벡터는?","o":["[1 3.8]ᵀ","[3.8 1]ᵀ","[1 4.0]ᵀ","[3 3.8]ᵀ"],"a":0,"e":"학과가 인공지능학과이므로 첫 성분은 1, 평점이 3.8이므로 두 번째 성분은 3.8이 되어 [1 3.8]ᵀ로 표현된다."},{"w":4,"id":17,"sec":"4.2","d":"중급","x":null,"q":"같은 표기 규칙에서 “수학과”에 재학 중이고 평점이 4.0인 “성춘향”의 특징 벡터로 옳은 것은?","o":["[3 4.0]ᵀ","[1 4.0]ᵀ","[4 3.0]ᵀ","[2 4.0]ᵀ"],"a":0,"e":"수학과는 숫자 3으로 표기되고 평점이 4.0이므로 성춘향의 특징 벡터는 [3 4.0]ᵀ이다."},{"w":4,"id":18,"sec":"4.2","d":"중급","x":null,"q":"“학과”라는 클래스 정보를 1, 2, 3, 4와 같은 숫자로 바꾸어 표현하는 이유는?","o":["평점과 측정 단위를 일치시키기 위해","특징 벡터의 차원을 줄이기 위해","학과 사이의 우열을 표시하기 위해","컴퓨터의 동작 편의를 위하여"],"a":3,"e":"강의자료는 컴퓨터의 동작 편의를 위하여 “학과”라는 클래스 정보를 숫자로 표현한다고 설명한다."},{"w":4,"id":19,"sec":"4.2","d":"초급","x":null,"q":"특징 공간(feature space)에 대한 설명으로 옳은 것은?","o":["학습률이 변화하는 구간","손실함수의 값이 그려지는 공간","특징 벡터들이 표시되는 공간","클래스 레이블이 저장되는 표"],"a":2,"e":"특징 벡터들이 표시되는 공간을 특징 공간이라고 부른다."},{"w":4,"id":20,"sec":"4.2","d":"초급","x":null,"q":"관측 값이 d개의 성분으로 구성된 특징 벡터로 표시될 때 특징 공간의 차원은?","o":["항상 1차원","d차원","항상 2차원","관측 값의 개수 N차원"],"a":1,"e":"관측 값이 d개의 성분으로 구성된 특징 벡터로 표시되면 모든 특징 벡터를 d차원의 공간에 표시할 수 있다."},{"w":4,"id":21,"sec":"4.2","d":"초급","x":null,"q":"특징 벡터를 사용하면 개별 관측 값을 특징 공간에서 어떤 형태로 표시할 수 있는가?","o":["하나의 확률 분포","하나의 행렬","하나의 점(point)","하나의 직선"],"a":2,"e":"특징 벡터를 사용하면 개별 관측 값을 성분 개수와 동일한 차원의 공간에 존재하는 하나의 점으로 표시할 수 있다."},{"w":4,"id":22,"sec":"4.2","d":"중급","x":null,"q":"“대학생”을 “학과”와 “평점”으로 관측하는 예제에서 특징 공간의 두 좌표축에 해당하는 것은?","o":["학과와 학번","학과와 평점(학점)","평점과 수강 여부","학과와 클래스 레이블"],"a":1,"e":"두 개의 특징인 “학과”와 “평점(학점)”이 각각 하나의 좌표축이 되어 2차원 특징 공간을 구성한다."},{"w":4,"id":23,"sec":"4.2","d":"심화","x":null,"q":"동일한 개체를 “학과”, “평점”에 더해 “학년”까지 관측한다면 자료의 정의에 따라 특징 공간은 어떻게 되는가?","o":["3차원 공간이 된다","1차원으로 축소된다","특징 공간을 정의할 수 없다","여전히 2차원 공간이다"],"a":0,"e":"특징 공간의 차원은 특징 벡터의 성분 개수와 같으므로 특징이 3개가 되면 특징 공간도 3차원이 된다."},{"w":4,"id":24,"sec":"4.2","d":"중급","x":null,"q":"특징 벡터 표기에 대한 설명으로 옳지 않은 것은?","o":["모든 개체를 동일한 특징으로 설명해야 벡터 형태의 표현이 가능하다","특징 벡터의 성분 개수와 특징 공간의 차원은 동일하다","특징 벡터 하나는 관측 값 하나를 표현한다","특징 벡터의 성분은 반드시 0 또는 1의 값이어야 한다"],"a":3,"e":"평점 3.8처럼 특징 벡터의 성분은 임의의 실수 값을 가질 수 있으므로 0 또는 1로 제한되지 않는다."},{"w":4,"id":25,"sec":"4.2","d":"초급","x":null,"q":"관측된 특징 값들의 집합이 구성하는 것은 무엇인가?","o":["학습률","데이터","손실함수","가중치 벡터"],"a":1,"e":"강의자료는 관측된 특징 값들의 집합이 데이터를 구성한다고 설명한다."},{"w":4,"id":26,"sec":"4.2","d":"중급","x":null,"q":"홍길동 [1 3.8]ᵀ과 성춘향 [3 4.0]ᵀ이 특징 공간에서 서로 다른 위치의 점으로 표시되는 직접적인 이유는?","o":["두 개체의 특징 벡터 성분 값이 서로 다르기 때문","두 개체의 클래스 레이블이 서로 다르기 때문","두 개체의 특징 공간 차원이 서로 다르기 때문","두 개체에 적용된 학습률이 서로 다르기 때문"],"a":0,"e":"특징 벡터의 성분 값이 곧 특징 공간에서의 좌표이므로 성분 값이 다르면 서로 다른 점으로 표시된다."},{"w":4,"id":27,"sec":"4.2","d":"심화","x":null,"q":"특징 벡터와 특징 공간의 관계를 가장 정확하게 설명한 것은?","o":["특징 벡터는 특징 공간을 둘로 나누는 구분선을 의미한다","특징 공간은 클래스의 개수만큼의 차원을 가진다","특징 공간의 차원은 학습 데이터의 개수 N과 같다","특징 벡터는 특징 공간의 한 점이며, 공간의 차원은 벡터의 성분 개수와 같다"],"a":3,"e":"관측 값 하나는 특징 벡터로 표현되어 d차원 특징 공간의 한 점이 되며, 공간의 차원은 성분 개수 d와 같다."},{"w":4,"id":28,"sec":"4.3","d":"초급","x":null,"q":"“정수론” 수강 여부 예제에서 “인공지능학과” 재학생 3명의 특징 벡터로 제시된 것은?","o":["[1 2.2]ᵀ, [3 4.0]ᵀ, [1 3.9]ᵀ","[2 2.2]ᵀ, [2 3.8]ᵀ, [2 3.9]ᵀ","[1 2.2]ᵀ, [1 3.8]ᵀ, [1 3.9]ᵀ","[3 2.2]ᵀ, [3 4.0]ᵀ, [3 3.2]ᵀ"],"a":2,"e":"인공지능학과는 학과 값 1로 표기되므로 세 학생은 x₁ = [1 2.2]ᵀ, x₂ = [1 3.8]ᵀ, x₃ = [1 3.9]ᵀ이다."},{"w":4,"id":29,"sec":"4.3","d":"초급","x":null,"q":"“정수론” 예제에서 과목의 수강 여부를 숫자로 표현한 방식은?","o":["수강을 +1, 미수강을 −1로 표현","수강 여부를 0과 1 사이의 확률로 표현","수강을 0, 미수강을 1로 표현","수강을 1, 미수강을 0으로 표현"],"a":3,"e":"강의자료는 “정수론” 수강을 1, 미수강을 0의 값으로 표현하여 데이터를 구성한다."},{"w":4,"id":30,"sec":"4.3","d":"중급","x":null,"q":"“정수론” 예제에서 인공지능학과 재학생에게 부여되는 레이블 값은?","o":["정의되지 않는다","모두 1","모두 0","학생마다 서로 다르다"],"a":2,"e":"조사 결과 인공지능학과 재학생은 정수론을 수강하지 않으므로 미수강에 해당하는 0의 레이블을 갖는다."},{"w":4,"id":31,"sec":"4.3","d":"중급","x":null,"q":"“정수론” 예제에서 “수학과” 재학생 3명의 특징 벡터로 옳은 것은?","o":["[4 2.2]ᵀ, [4 4.0]ᵀ, [4 3.2]ᵀ","[3 2.2]ᵀ, [3 4.0]ᵀ, [3 3.2]ᵀ","[1 2.2]ᵀ, [1 4.0]ᵀ, [1 3.2]ᵀ","[3 2.2]ᵀ, [1 4.0]ᵀ, [3 3.2]ᵀ"],"a":1,"e":"수학과는 학과 값 3으로 표기되므로 x₄ = [3 2.2]ᵀ, x₅ = [3 4.0]ᵀ, x₆ = [3 3.2]ᵀ이다."},{"w":4,"id":32,"sec":"4.3","d":"중급","x":"강의자료의 그림 필요","q":"“정수론” 예제 그림에서 “구분선 1”과 “구분선 2”가 함께 제시된 이유로 가장 적절한 것은?","o":["수강생과 미수강생을 구분하는 선이 하나로 유일하지 않기 때문","한 선은 학과를, 다른 선은 평점을 담당하기 때문","두 선의 교점이 클래스의 중심을 의미하기 때문","구분선은 항상 두 개가 필요하기 때문"],"a":0,"e":"강의자료는 “구분선 1” 혹은 “구분선 2”를 이용하여 수강생과 미수강생을 구분할 수 있다고 설명하므로 구분선이 유일하지 않음을 보여준다."},{"w":4,"id":33,"sec":"4.3","d":"초급","x":"강의자료 내용 필요","q":"확률 분포를 활용한 분류의 예제로 강의자료가 제시한 두 클래스는?","o":["“체조 동아리 회원”과 “체조 동아리 비회원”","정수론 수강생과 미수강생","인공지능학과와 수학과","스팸메일과 정상메일"],"a":0,"e":"확률 분포를 활용한 분류 예제에서는 A대학교 “체조” 동아리 회원과 비회원을 두 클래스로 삼는다."},{"w":4,"id":34,"sec":"4.3","d":"초급","x":null,"q":"“체조 동아리 회원/비회원” 예제에서 분류의 근거로 사용한 관측 특징은?","o":["평점","키","몸무게","학과"],"a":2,"e":"이 예제는 동아리에 속한 학생과 속하지 않은 학생의 몸무게 분포 히스토그램을 이용한다."},{"w":4,"id":35,"sec":"4.3","d":"중급","x":null,"q":"사후 확률(Posterior probability) P(C₁|x)의 의미로 옳은 것은?","o":["클래스 C₁이 전체 데이터에서 차지하는 비율","x를 관찰하였을 때 x의 소속 클래스로 C₁이 가능할 정도를 수치로 표현한 값","클래스 C₁ 안에서 관측 값 x가 나타날 확률","x와 C₁이 동시에 발생할 결합 확률"],"a":1,"e":"사후 확률은 조건부 확률로서, x가 주어졌을 때 그 소속 클래스가 C₁일 정도를 수치로 표현한 값이다.","s":["사후 확률 규칙"]},{"w":4,"id":36,"sec":"4.3","d":"심화","x":null,"q":"베이즈 규칙에 의한 P(C₁|x)의 전개식으로 옳은 것은?","o":["P(C₁|x) = P(C₁, x) × P(x)","P(C₁|x) = P(x|C₁) / P(C₁)","P(C₁|x) = P(C₁) + P(x|C₁)","P(C₁|x) = P(x|C₁)P(C₁) / {P(x|C₁)P(C₁) + P(x|C₂)P(C₂)}"],"a":3,"e":"P(C₁|x) = P(C₁,x)/P(x)이고 P(x) = P(C₁,x) + P(C₂,x)이므로 우도와 사전확률의 곱으로 전개된다.","s":["베이즈 규칙"]},{"w":4,"id":37,"sec":"4.3","d":"초급","x":null,"q":"클래스가 C₁, C₂ 두 개뿐일 때 P(C₂|x)를 구하는 식은?","o":["P(C₂|x) = P(C₁|x)","P(C₂|x) = 1 − P(C₁|x)","P(C₂|x) = 1 ÷ P(C₁|x)","P(C₂|x) = P(C₁|x) − 1"],"a":1,"e":"두 클래스의 사후 확률의 합이 1이므로 P(C₂|x) = 1 − P(C₁|x)이다."},{"w":4,"id":38,"sec":"4.3","d":"중급","x":null,"q":"몸무게 52kg인 학생 x의 동아리 소속을 판단하는 분류 규칙으로 옳은 것은?","o":["P(x|C₁) > 0.5이면 C₁으로 결정","P(C₁) > P(C₂)이면 C₁으로 결정","P(C₁|x) < 0.5이면 C₁으로 결정","P(C₁|x) > P(C₂|x)이면 x의 동아리를 C₁으로 결정"],"a":3,"e":"강의자료의 분류 규칙은 두 사후 확률을 비교하여 P(C₁|x) > P(C₂|x)이면 C₁, 그 외의 경우에는 C₂로 결정하는 것이다.","s":["사후 확률 규칙"]},{"w":4,"id":39,"sec":"4.3","d":"중급","x":null,"q":"두 클래스 문제에서 P(C₁|x) > P(C₂|x)라는 조건과 동일한 조건은?","o":["P(C₁|x) > 0.5","P(C₁|x) > P(C₁)","P(C₁|x) > P(x|C₁)","P(C₁|x) > 1"],"a":0,"e":"P(C₂|x) = 1 − P(C₁|x)이므로 P(C₁|x) > 1 − P(C₁|x), 즉 P(C₁|x) > 0.5와 같은 조건이다.","s":["사후 확률 규칙"]},{"w":4,"id":40,"sec":"4.3","d":"심화","x":"강의자료 내용 필요","q":"사후 확률을 비교하기 위해 필요한 정보로 강의자료가 제시한 것이 아닌 것은?","o":["P(C₂)","P(x|C₁)","학습률 α","P(C₁)"],"a":2,"e":"강의자료는 사후 확률 비교를 위해 P(C₁), P(C₂), P(x|C₁), P(x|C₂)의 정보가 필요하다고 설명한다. 학습률은 경사하강법의 요소이다."},{"w":4,"id":41,"sec":"4.3","d":"심화","x":null,"q":"P(C₁|x) = P(C₁, x)/P(x)에서 분모 P(x)를 두 클래스로 전개한 형태로 옳은 것은?","o":["P(x) = P(C₁|x) + P(C₂|x)","P(x) = P(x|C₁) − P(x|C₂)","P(x) = P(C₁, x) + P(C₂, x)","P(x) = P(C₁, x) × P(C₂, x)"],"a":2,"e":"모든 개체가 C₁ 또는 C₂에 속하므로 x의 주변확률은 두 결합확률의 합으로 전개된다."},{"w":4,"id":42,"sec":"4.3","d":"초급","x":null,"q":"“체조 동아리” 예제에서 제시한 히스토그램이 보여주는 것은?","o":["동아리 소속 학생과 미소속 학생의 몸무게 구간별 비율 분포","학생들의 학점 분포","시간에 따른 동아리 회원 수 변화","경사하강법에 따른 손실의 감소 곡선"],"a":0,"e":"히스토그램은 “체조부소속”과 “체조부미소속” 학생들의 몸무게 구간별 비율 분포를 나타낸다."},{"w":4,"id":43,"sec":"4.4","d":"초급","x":null,"q":"분류를 위한 선형 판별 함수 g(x)의 정의로 옳은 것은?","o":["g(x) = σ(x)","g(x) = ‖w − x‖","g(x) = ln{x/(1 − x)}","g(x) = w · x = wᵀx"],"a":3,"e":"분류를 위한 선형 판별 함수는 가중치 벡터와 특징 벡터의 내적, 즉 g(x) = w·x = wᵀx로 정의된다.","s":["선형 판별 함수"]},{"w":4,"id":44,"sec":"4.4","d":"중급","x":null,"q":"선형 판별 함수 g(x) = wᵀx에서 x와 w를 구성하는 성분의 개수는?","o":["둘 다 d개","둘 다 d + 1개","x는 d개, w는 d + 1개","x는 d + 1개, w는 d개"],"a":1,"e":"바이어스 성분을 포함하므로 특징 벡터 x와 가중치 벡터 w는 모두 d + 1개의 성분으로 구성된다."},{"w":4,"id":45,"sec"
