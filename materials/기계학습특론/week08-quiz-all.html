<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>기계학습특론 중간고사 700제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; sticky filter bar on top, questions grouped under week headings */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --line:#d9dfe6;
  --ink:#17212b; --muted:#5d6b79; --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1b7a4c; --ok-soft:#e2f3ea; --no:#b8323e; --no-soft:#fbe8ea;
  --lv1:#2f7d5b; --lv1-soft:#e1f1e8; --lv2:#9a6a12; --lv2-soft:#f8eed8; --lv3:#a33a52; --lv3-soft:#f8e3e8;
  --ex:#5a4f8f; --ex-soft:#ebe8f6; --star:#c47a00; --star-soft:#fff2d6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#202a35; --line:#2c3845;
  --ink:#e4eaf0; --muted:#97a5b4; --accent:#7db6e0; --accent-soft:#1c3446;
  --ok:#5fcf98; --ok-soft:#153526; --no:#ff8a94; --no-soft:#3a1c21;
  --lv1:#6fd0a3; --lv1-soft:#16352a; --lv2:#e2b55c; --lv2-soft:#3a2e15; --lv3:#f08ca2; --lv3-soft:#3c1d27;
  --ex:#b4a9f0; --ex-soft:#2a2645; --star:#ffc24d; --star-soft:#3a2d10; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#202a35; --line:#2c3845;
  --ink:#e4eaf0; --muted:#97a5b4; --accent:#7db6e0; --accent-soft:#1c3446;
  --ok:#5fcf98; --ok-soft:#153526; --no:#ff8a94; --no-soft:#3a1c21;
  --lv1:#6fd0a3; --lv1-soft:#16352a; --lv2:#e2b55c; --lv2-soft:#3a2e15; --lv3:#f08ca2; --lv3-soft:#3c1d27;
  --ex:#b4a9f0; --ex-soft:#2a2645; --star:#ffc24d; --star-soft:#3a2d10; color-scheme:dark;
}
*{box-sizing:border-box}
body{overflow-anchor:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-size:26px;line-height:1.3;margin:0;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:14px}

/* filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rows{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:12px;font-weight:700;color:var(--muted);width:40px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:4px 11px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.chip.lv[data-k="초급"][aria-pressed="true"]{background:var(--lv1);border-color:var(--lv1)}
.chip.lv[data-k="중급"][aria-pressed="true"]{background:var(--lv2);border-color:var(--lv2)}
.chip.lv[data-k="심화"][aria-pressed="true"]{background:var(--lv3);border-color:var(--lv3)}
.chip.lv[data-k="제외"][aria-pressed="true"]{background:var(--ex);border-color:var(--ex)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font:inherit;font-size:13.5px;color:var(--ink)}
.tool{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.tool:hover{color:var(--ink);border-color:var(--ink)}
.tool[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.tool.danger{color:var(--no);border-color:var(--no)}

.status{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.status b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.status .ok b{color:var(--ok)} .status .no b{color:var(--no)}
.meter{flex:1 1 120px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-no{background:var(--no)}

/* week heading */
.week{margin-top:30px;display:grid;gap:2px;scroll-margin-top:170px}
.week .wk{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.week h2{margin:0;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.week .wmeta{font-size:12.5px;color:var(--muted)}

/* question card */
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px}
.q.is-ex{border-style:dashed;border-color:var(--ex)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.num{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.sec{font-size:12px;color:var(--muted)}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.b-초급{background:var(--lv1-soft);color:var(--lv1)}
.b-중급{background:var(--lv2-soft);color:var(--lv2)}
.b-심화{background:var(--lv3-soft);color:var(--lv3)}
.b-제외{background:var(--ex);color:var(--surface)}
.why{font-size:12px;color:var(--ex)}
.res{font-size:12px;font-weight:700}
.res.ok{color:var(--ok)} .res.no{color:var(--no)}
.qt{margin:0 0 12px;font-size:16px;font-weight:600;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-size:14.5px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-family:var(--f-mono);font-size:12px;font-weight:600;margin-top:1px}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .n{background:var(--no);color:var(--surface)}
.exp{margin-top:10px;padding:10px 13px;border-radius:9px;background:var(--sunk);font-size:14px}
.exp{border-left:3px solid var(--accent);background:var(--accent-soft)}
.exp h4{margin:0 0 4px;font-size:13px;letter-spacing:.02em;color:var(--accent)}
.exp p{margin:0}
.exp .ref{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.concept{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.concept h5{margin:0 0 4px;font-size:12.5px;color:var(--accent);letter-spacing:.02em}
.concept p{margin:4px 0 0;font-size:13.5px;line-height:1.65}
.concept p b{display:inline-block;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:4px;padding:0 6px;margin-right:2px}
.exp a.ref{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.exp.ok{border-left-color:var(--ok);background:var(--ok-soft)} .exp.ok h4{color:var(--ok)}
.exp.no{border-left-color:var(--no);background:var(--no-soft)} .exp.no h4{color:var(--no)}
.opt .mark{margin-left:auto;flex:none;padding-left:8px;font-size:12.5px;font-weight:700}
.opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}
.qfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.link{background:none;border:none;padding:2px 4px;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--accent)}

.star{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--star-soft);color:var(--star)}
.q.is-star{border-left:3px solid var(--star)}
.bm{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.bm svg{width:15px;height:15px}
.bm:hover{border-color:var(--accent);color:var(--accent)}
.bm[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.bm[aria-pressed="true"] svg path{fill:currentColor}
.tool.t-star[aria-pressed="true"]{color:var(--star);border-color:var(--star);background:var(--star-soft)}
.imp{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;height:28px;padding:0 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.imp + .bm{margin-left:0}
.imp:hover{border-color:var(--no);color:var(--no)}
.imp[aria-pressed="true"]{color:var(--surface);background:var(--no);border-color:var(--no)}
.q.is-imp{box-shadow:inset 3px 0 0 var(--no)}
.tool.t-imp[aria-pressed="true"]{color:var(--no);border-color:var(--no);background:var(--no-soft)}
.sync{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync a{color:var(--accent)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--no)}
.views{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.view{border:none;background:none;padding:9px 14px 10px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.view:hover{color:var(--ink)}
.view[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.view .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.bar .mini{display:none;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.bar .mini span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .mini b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.bar .fold{justify-self:end}
.bar.is-collapsed{padding-block:7px}
.bar.is-collapsed .rows{display:none}
.bar.is-collapsed .mini{display:flex}
.memo-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.memo-head p{margin:0;flex:1 1 220px;font-size:13px;color:var(--muted)}
.btn-new{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:9px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-new:hover{filter:brightness(1.08)}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;gap:6px}
.memo textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.6;padding:9px 11px}
.memo-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.memo-foot .sp{flex:1}
.memo-ref{font-size:12px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:999px;padding:2px 9px;cursor:pointer;justify-self:start}
.qmemo{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted);cursor:pointer}
.qmemo:hover{color:var(--accent);border-color:var(--accent)}
.q.flash{box-shadow:0 0 0 3px var(--accent-soft)}
.empty{margin-top:40px;text-align:center;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--no)}
.totop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:16px;color:var(--muted)}
@media (max-width:520px){ h1{font-size:22px} .qt{font-size:15.5px} .q{padding:14px} .lbl{width:100%} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow"><a href="../../courses/machine-learning-week08.html" style="color:inherit">← 기계학습특론 8주차</a> · 중간고사 대비</div>
    <h1>1–7주차 문제 은행 700제</h1>
    <p class="lede">주차별 100문제씩 7주 분량입니다. 강의자료·표·그림가 있어야 풀 수 있는 문제는 <b>제외</b>로 분류했고, 정답과 해설을 미리 펼쳐 두었습니다.</p>
    <div class="sync" id="sync"><i></i><span>기록 저장소 연결 중…</span></div>
  </header>

  <nav class="views" role="tablist" aria-label="화면 전환">
    <button class="view" id="vQuiz" role="tab" aria-selected="true">문제 풀기</button>
    <button class="view" id="vMemo" role="tab" aria-selected="false">메모장 <span class="c" id="memoN"></span></button>
  </nav>

  <div class="bar" id="bar">
    <div class="mini" id="mini"><span id="miniTxt"></span><button class="tool" id="expand" aria-label="필터 펼치기">필터 ▾</button></div>
    <div class="rows">
      <div class="row" id="weekRow"><span class="lbl">주차</span></div>
      <div class="row" id="lvRow"><span class="lbl">분류</span></div>
      <div class="row">
        <span class="lbl">보기</span>
        <button class="tool t-star" id="fStar" aria-pressed="false">★ 중요</button>
        <button class="tool" id="fBm" aria-pressed="false">북마크</button>
        <button class="tool" id="fWrong" aria-pressed="false">틀린 문제만</button>
        <button class="tool" id="fTodo" aria-pressed="false">안 푼 문제만</button>
        <button class="tool" id="fReveal" aria-pressed="false">정답 모두 보기</button>
        <input class="search" id="q" type="search" placeholder="문제·보기 검색" aria-label="문제 검색">
      </div>
      <div class="status" id="status"></div>
      <button class="tool fold" id="collapse" aria-label="필터 접기" hidden>필터 접기 ▴</button>
    </div>
  </div>

  <main id="list"></main>
  <section id="memoView" hidden>
    <button class="memo-ref" id="memoBack" hidden>← 풀던 문제로 돌아가기</button>
    <div class="memo-head">
      <p>공부하다 떠오른 것을 적어 두세요. 입력하는 대로 저장되고, 문제 카드의 &lsquo;메모&rsquo; 버튼으로 그 문제에 대한 메모를 바로 시작할 수 있습니다.</p>
      <button class="btn-new" id="memoAdd">새 메모</button>
    </div>
    <div id="memoList"></div>
  </section>
</div>

<script>

og'로 이어지며, 입력 이미지가 어느 범주인지 가려내는 역할을 한다."},{"w":1,"id":3,"sec":"1.1","d":"초급","x":"강의자료의 그림 필요","q":"'판별 vs 생성' 그림에서 생성 모델의 입력으로 그려진 것은 무엇인가?","o":["고양이 사진과 개 사진","cat/dog 레이블","랜덤 노이즈(random noise)에 해당하는 잡음 패턴","학습 데이터의 평균 이미지"],"a":2,"e":"생성 모델 쪽에는 회색 잡음 이미지가 입력으로 그려져 있고, 이는 무작위 노이즈를 뜻한다."},{"w":1,"id":4,"sec":"1.1","d":"초급","x":"강의자료의 그림 필요","q":"'판별 vs 생성' 그림에서 생성 모델의 출력으로 그려진 것은 무엇인가?","o":["cat 또는 dog 레이블","0.83이라는 확률 값","입력 이미지의 경계선(edge) 지도","새로운 고양이 이미지"],"a":3,"e":"Generative Model의 화살표 끝에는 학습 데이터에 있던 것이 아닌 새 고양이 이미지가 놓여 있다."},{"w":1,"id":5,"sec":"1.1","d":"중급","x":null,"q":"판별 모델과 생성 모델의 입출력 방향 차이를 가장 잘 요약한 것은?","o":["판별은 이미지→레이블, 생성은 노이즈→이미지","판별은 노이즈→이미지, 생성은 이미지→레이블","둘 다 이미지→이미지 변환이다","둘 다 레이블→이미지 변환이다"],"a":0,"e":"판별 모델은 관측(이미지)을 받아 범주·확률을 내놓고, 생성 모델은 무작위 노이즈를 받아 이미지를 만들어 낸다.","s":["판별 vs 생성"]},{"w":1,"id":6,"sec":"1.1","d":"중급","x":"강의자료 내용 필요","q":"학습정리 슬라이드에서 '생성형 AI(이미지)란?'을 한 문장으로 표현한 말은 무엇인가?","o":["정답을 정확히 맞히는 모델","가상의 세계를 흉내내는 모델","데이터를 압축하는 모델","레이블을 자동으로 붙이는 모델"],"a":1,"e":"학습정리 1번 항목에 '가상의 세계를 흉내내는 모델'이라고 정리되어 있다."},{"w":1,"id":7,"sec":"1.1","d":"중급","x":null,"q":"'가상의 세계를 흉내내는 모델'이라는 표현이 강조하는 능력은 무엇인가?","o":["관측을 정확한 범주로 나누는 능력","학습 속도를 높이는 최적화 능력","실제 데이터가 있을 법한 세계를 모사해 새 데이터를 만들어내는 능력","학습 데이터를 그대로 저장해 재생하는 능력"],"a":2,"e":"흉내낸다는 것은 실제 데이터가 따르는 분포를 모사한다는 뜻이며, 그 결과로 그럴듯한 새 이미지를 만들어 낸다."},{"w":1,"id":8,"sec":"1.1","d":"중급","x":null,"q":"판별 모델에 대한 설명으로 옳지 않은 것은?","o":["입력 관측으로부터 정답이 나올 확률을 예측한다","학습에 정답 레이블이 필요하다","고양이와 개를 구분하는 문제가 대표적인 예다","랜덤 노이즈에서 새 이미지를 샘플링한다"],"a":3,"e":"노이즈에서 이미지를 샘플링하는 것은 생성 모델의 동작이며, 판별 모델은 관측을 받아 확률을 예측한다.","s":["판별 vs 생성"]},{"w":1,"id":9,"sec":"1.1","d":"중급","x":null,"q":"생성 모델에 대한 설명으로 옳지 않은 것은?","o":["출력이 항상 하나의 클래스 레이블이다","랜덤 노이즈를 이용해 샘플을 만든다","관측 데이터로부터 확률 분포를 학습한다","학습 데이터에 없던 새로운 이미지를 만들 수 있다"],"a":0,"e":"클래스 레이블을 출력하는 것은 판별 모델이고, 생성 모델의 출력은 새로 만들어진 샘플(이미지)이다.","s":["판별 vs 생성"]},{"w":1,"id":10,"sec":"1.1","d":"초급","x":"강의자료의 그림 필요","q":"그림에서 판별 모델의 출력으로 표시된 'cat | dog'가 의미하는 것은?","o":["고양이와 개를 합성한 새 이미지","입력이 고양이인지 개인지 가려낸 판정 결과","학습에 쓸 두 장의 데이터","고양이와 개의 평균 특징 벡터"],"a":1,"e":"cat과 dog는 판별 모델이 선택해야 하는 후보 범주이며, 출력은 그중 어느 쪽인지에 대한 판정이다."},{"w":1,"id":11,"sec":"1.1","d":"심화","x":null,"q":"같은 고양이 사진 데이터셋으로 학습해도 판별 모델과 생성 모델이 서로 다른 산출물을 내는 근본적인 이유는?","o":["판별 모델이 항상 더 많은 파라미터를 쓰기 때문","생성 모델이 반드시 레이블을 필요로 하기 때문","판별 모델은 정답 확률(경계)을, 생성 모델은 데이터의 분포 자체를 학습하기 때문","생성 모델은 학습 과정을 거치지 않기 때문"],"a":2,"e":"학습 목표가 다르다. 판별 모델은 x가 주어졌을 때 y의 확률을, 생성 모델은 관측 x가 이루는 분포를 배워 그 분포에서 샘플링한다.","s":["판별 vs 생성"]},{"w":1,"id":12,"sec":"1.1","d":"중급","x":null,"q":"자율주행차가 카메라 영상 속 물체가 보행자인지 아닌지를 판단하는 과제는 어느 쪽에 가까운가?","o":["노이즈에서 이미지를 만드는 생성 모델","확률 분포에서의 샘플링","image-to-image 변환","관측으로부터 정답 확률을 예측하는 판별 모델"],"a":3,"e":"주어진 관측을 보고 정답 범주의 확률을 예측하는 문제이므로 판별 모델의 전형적인 사례다."},{"w":1,"id":13,"sec":"1.1","d":"중급","x":null,"q":"텍스트 설명만 주고 실제로 존재하지 않는 풍경 사진을 만들어 내는 과제는 어느 쪽에 해당하는가?","o":["생성 모델","판별 모델","분류기(classifier)","레이블링 도구"],"a":0,"e":"학습 데이터에 없던 새 이미지를 만들어 내는 일이므로 생성 모델의 역할이다."},{"w":1,"id":14,"sec":"1.1","d":"심화","x":"강의자료의 그림 필요","q":"판별 모델 그림과 생성 모델 그림을 학습 데이터 표기 관점에서 비교한 설명으로 가장 적절한 것은?","o":["두 그림 모두 반드시 (관측, 레이블) 쌍으로 표시되어 있다","판별 모델 그림에는 관측에 레이블이 붙어 있지만, 생성 모델 그림에는 관측만 표시되어 있다","생성 모델 그림에서만 레이블이 붙어 있다","두 그림 모두 레이블 표기가 없다"],"a":1,"e":"판별 모델 그림에는 각 그림 옆에 1과 0 레이블이 붙어 있으나, 생성 모델 그림에는 'An observation' 표시만 있고 레이블 숫자가 없다."},{"w":1,"id":15,"sec":"1.1","d":"초급","x":null,"q":"'판별 vs 생성' 개념도의 참조 출처로 표시된 사이트는 어디인가?","o":["arXiv","O'Reilly","Semantic Scholar","GitHub"],"a":2,"e":"해당 슬라이드 하단에는 semanticscholar.org의 논문 그림 페이지가 참조 출처로 표기되어 있다."},{"w":1,"id":16,"sec":"1.1","d":"심화","x":null,"q":"생성형 AI(이미지)를 다루면서 판별/생성 구분을 가장 먼저 설명하는 이유로 가장 타당한 것은?","o":["판별 모델의 성능이 생성 모델보다 항상 우수하기 때문","두 모델의 학습 알고리즘이 동일하기 때문","생성 모델이 판별 모델의 한 종류이기 때문","'무엇을 맞히는가'와 '무엇을 만들어내는가'라는 목표 차이가 이후의 응용 전체를 가르기 때문"],"a":3,"e":"이 목표 차이가 이후 다루는 image-to-image, text-to-image, 영상 생성 등 모든 응용의 출발점이 된다."},{"w":1,"id":17,"sec":"1.2","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 정의한 판별 모델의 역할은 무엇인가?","o":["주어진 몇몇 관측 x를 통해 정답 y가 나올 확률을 예측한다","관측 x로부터 확률 분포를 만들고 거기서 샘플링한다","노이즈를 이미지로 바꾼다","이미지의 화질을 자동으로 개선한다"],"a":0,"e":"판별 모델 슬라이드의 본문은 '주어진 몇몇 관측 x를 통해 정답 y가 나올 확률을 예측'이라고 적고 있다."},{"w":1,"id":18,"sec":"1.2","d":"초급","x":"강의자료의 그림 필요","q":"판별 모델 그림의 학습 데이터에서 각 그림 옆에 붙은 1과 0은 무엇을 뜻하는가?","o":["픽셀 값","레이블(a label)","확률 분포","학습률"],"a":1,"e":"그림에는 'A lable(레이블)'이라는 화살표가 숫자 쪽을 가리키고 있어, 1과 0이 정답 레이블임을 보여 준다."},{"w":1,"id":19,"sec":"1.2","d":"초급","x":"강의자료의 그림 필요","q":"판별 모델 그림에서 'An observation'이 가리키는 대상은 무엇인가?","o":["모델이 내놓은 예측 확률 값","레이블로 붙은 숫자","학습에 쓰이는 한 장의 그림(관측)","모델 내부의 파라미터"],"a":2,"e":"An observation 화살표는 레이블 옆의 그림 자체를 가리키며, 이는 하나의 관측 데이터를 뜻한다."},{"w":1,"id":20,"sec":"1.2","d":"초급","x":null,"q":"판별 모델 예시가 새로운 그림에 대해 최종적으로 출력한 예측 값은 얼마인가?","o":["0.38","0.53","0.63","0.83"],"a":3,"e":"그림 오른쪽에 'Prediction 0.83 likely to be Van Gogh'라고 표시되어 있다."},{"w":1,"id":21,"sec":"1.2","d":"중급","x":null,"q":"예측 값 0.83이 의미하는 바로 가장 적절한 것은?","o":["입력한 그림이 반 고흐의 작품일 가능성이 83% 정도라는 뜻","학습에 83장의 그림을 사용했다는 뜻","모델의 전체 정확도가 83%라는 뜻","학습이 83번째 에폭에 도달했다는 뜻"],"a":0,"e":"0.83은 'likely to be Van Gogh'라는 설명과 함께 표시된 확률 값으로, 해당 입력이 반 고흐 작품일 확률을 뜻한다.","s":["판별 모델"]},{"w":1,"id":22,"sec":"1.2","d":"중급","x":"강의자료의 그림 필요","q":"판별 모델 그림에서 레이블 1이 붙은 그림들의 공통점은 무엇인가?","o":["모나리자 계열의 초상화다","반 고흐 화풍의 작품이다","사진으로 촬영한 실물이다","AI가 생성한 이미지다"],"a":1,"e":"별이 빛나는 밤, 해바라기 등 반 고흐의 작품에 1이 붙고, 다른 화가의 그림에는 0이 붙어 있다."},{"w":1,"id":23,"sec":"1.2","d":"중급","x":null,"q":"판별 모델 학습에서 레이블 0이 붙은 데이터가 하는 역할은 무엇인가?","o":["모델이 예측을 하지 못하도록 막는다","모든 예측 확률을 1로 만든다","반 고흐가 아닌 사례를 알려 주어 구분 기준을 잡게 한다","학습 속도를 직접적으로 높인다"],"a":2,"e":"부정 사례(0)가 있어야 모델이 '무엇이 반 고흐가 아닌지'를 배워 경계를 세울 수 있다."},{"w":1,"id":24,"sec":"1.2","d":"중급","x":"강의자료의 그림 필요","q":"판별 모델 그림이 보여 주는 파이프라인의 순서로 옳은 것은?","o":["예측 → 학습 → 데이터 수집","랜덤 노이즈 → 샘플링 → 이미지","레이블링 → 샘플링 → 확률 분포","레이블이 붙은 학습 데이터 → 학습(Training) → 새 관측에 대한 예측(Prediction)"],"a":3,"e":"그림은 Training data에서 Training 화살표로 모델로, 다시 Prediction 화살표로 0.83이라는 결과로 이어진다."},{"w":1,"id":25,"sec":"1.2","d":"심화","x":null,"q":"학습이 끝난 판별 모델에 처음 보는 그림 한 장을 넣었을 때 모델이 수행하는 일은 무엇인가?","o":["학습된 기준에 따라 그 그림이 반 고흐 작품일 확률을 계산한다","그 그림과 비슷한 새 그림을 그려 준다","그 그림을 학습 데이터에 자동으로 추가한다","그 그림에 섞인 노이즈를 제거한다"],"a":0,"e":"그림의 Prediction 단계가 바로 이 과정으로, 새 관측에 대해 정답일 확률을 출력한다."},{"w":1,"id":26,"sec":"1.2","d":"중급","x":null,"q":"판별 모델을 학습시킬 때 레이블이 전혀 없다면 어떤 문제가 생기는가?","o":["관측 자체를 모델에 입력할 수 없다","정답과 비교할 기준이 없어 확률 예측을 학습할 수 없다","예측 확률이 항상 1로 고정된다","랜덤 노이즈를 만들 수 없다"],"a":1,"e":"판별 모델은 관측 x에 대한 정답 y가 있어야 예측과 정답의 차이를 줄이는 방향으로 학습할 수 있다.","s":["판별 모델"]},{"w":1,"id":27,"sec":"1.2","d":"심화","x":null,"q":"예측 값이 0.83으로 나왔다는 사실에서 내릴 수 있는 결론으로 가장 적절한 것은?","o":["모델이 정답을 반드시 맞혔다는 뜻이다","모델이 새 그림을 그려 냈다는 뜻이다","모델은 확정된 답이 아니라 정도(확률)로 답한다는 뜻이다","레이블 0인 데이터가 필요 없었다는 뜻이다"],"a":2,"e":"판별 모델의 출력은 확신의 정도를 나타내는 확률이므로, 1이 아닌 0.83은 불확실성이 남아 있음을 뜻한다."},{"w":1,"id":28,"sec":"1.2","d":"중급","x":"강의자료의 그림 필요","q":"판별 모델 그림에서 'Training'이라고 표시된 화살표가 연결하는 두 요소는 무엇인가?","o":["Prediction과 Generated Samples","Random noise와 Generative Model","Prediction과 An observation","Training data와 Discriminative Model"],"a":3,"e":"레이블이 붙은 Training data가 Training 화살표를 따라 Discriminative Model로 들어가는 구조다."},{"w":1,"id":29,"sec":"1.2","d":"초급","x":null,"q":"판별 모델과 생성 모델 개념도 두 장이 공통으로 인용한 참조 문헌은 무엇인가?","o":["O'Reilly의 Generative Deep Learning","MIT Press의 Deep Learning","Pattern Recognition and Machine Learning","Hands-On Machine Learning"],"a":0,"e":"두 슬라이드 모두 oreilly.com의 generative-deep-learning 1장 페이지를 참조 출처로 표기하고 있다."},{"w":1,"id":30,"sec":"1.2","d":"중급","x":null,"q":"판별 모델 설명에 쓰인 기호 x와 y는 각각 무엇을 가리키는가?","o":["x는 정답, y는 관측","x는 관측, y는 정답","x는 노이즈, y는 생성 이미지","x는 확률, y는 레이블 개수"],"a":1,"e":"'주어진 몇몇 관측 x를 통해 정답 y가 나올 확률을 예측'이라는 문장에서 x는 관측, y는 정답이다.","s":["판별 모델"]},{"w":1,"id":31,"sec":"1.2","d":"심화","x":null,"q":"어떤 그림에 대해 반 고흐일 확률이 0.83으로 나왔다면, 반 고흐가 아닐 확률은 얼마로 보는 것이 자연스러운가? (두 범주만 있는 경우로 가정)","o":["0.83","0.50","0.17","0.00"],"a":2,"e":"두 범주만 존재한다면 확률의 합이 1이므로 1에서 0.83을 뺀 0.17이 된다."},{"w":1,"id":32,"sec":"1.2","d":"심화","x":null,"q":"판별 모델을 그림의 진위 감정에 활용할 때 예상되는 한계로 가장 타당한 것은?","o":["레이블이 없는 데이터도 아무 문제 없이 그대로 학습에 쓸 수 있다","확률 대신 새 그림을 만들어 버린다","입력 이미지를 아예 처리하지 못한다","학습 데이터에 없던 화풍에 대해서는 신뢰하기 어려운 확률을 낸다"],"a":3,"e":"판별 모델은 학습에서 본 사례를 기준으로 경계를 세우므로, 학습 분포를 벗어난 입력에 대한 확률은 신뢰도가 떨어진다."},{"w":1,"id":33,"sec":"1.3","d":"초급","x":"강의자료 내용 필요","q":"강의자료가 정의한 생성 모델의 동작 방식은 무엇인가?","o":["관측된 데이터 x를 토대로 확률 분포를 만들고 그 분포에서 샘플링한다","관측 x로부터 정답 y의 확률을 예측한다","이미지를 클래스별로 정렬해 저장한다","사람이 직접 레이블을 붙여 데이터를 정리한다"],"a":0,"e":"생성 모델 슬라이드의 본문은 '관측된 데이터 x를 토대로 확률 분포 만들고 확률 분포에서 샘플링'이라고 적고 있다."},{"w":1,"id":34,"sec":"1.3","d":"초급","x":"강의자료의 그림 필요","q":"생성 모델 그림에서 학습 데이터로 사용된 이미지의 소재는 무엇인가?","o":["고양이 사진","말 사진","명화 작품","사람 얼굴 사진"],"a":1,"e":"Training data 상자 안에는 여러 장의 말 사진이 들어 있고, 생성 결과도 말 이미지다."},{"w":1,"id":35,"sec":"1.3","d":"초급","x":"강의자료의 그림 필요","q":"생성 모델 그림에서 샘플링(Sampling) 단계에 함께 들어가는 요소는 무엇인가?","o":["레이블 1과 0","예측 확률 0.83","랜덤 노이즈(Random noise)","Canny edge 지도"],"a":2,"e":"Sampling 화살표 아래에 Random noise 상자가 연결되어 있어, 노이즈가 샘플링의 재료로 쓰임을 보여 준다."},{"w":1,"id":36,"sec":"1.3","d":"초급","x":"강의자료의 그림 필요","q":"생성 모델 그림의 오른쪽에 표시된 결과물의 이름은 무엇인가?","o":["Training data","Prediction","An observation","Generated Samples"],"a":3,"e":"오른쪽 상자에는 Generated Samples라는 제목과 함께 새로 만들어진 말 이미지들이 놓여 있다."},{"w":1,"id":37,"sec":"1.3","d":"중급","x":null,"q":"생성 모델이 샘플을 만들 때 랜덤 노이즈를 사용하는 이유로 가장 적절한 것은?","o":["같은 모델에서도 매번 서로 다른 샘플이 나오게 하기 위해","학습 데이터를 지우기 위해","레이블을 자동으로 만들기 위해","예측 확률을 1로 고정하기 위해"],"a":0,"e":"무작위 노이즈가 출발점이 되므로 같은 모델이라도 다양한 결과를 뽑아낼 수 있고, 이것이 분포에서의 샘플링을 구현한다.","s":["생성 모델 샘플링"]},{"w":1,"id":38,"sec":"1.3","d":"중급","x":"강의자료의 그림 필요","q":"생성 모델 그림이 보여 주는 파이프라인의 순서로 옳은 것은?","o":["랜덤 노이즈 → 학습 → 레이블링","학습 데이터 → 학습(Training) → 샘플링(Sampling) → 생성 샘플","예측 → 샘플링 → 학습","레이블 → 확률 → 관측"],"a":1,"e":"Training data가 Training을 거쳐 Generative Model이 되고, 랜덤 노이즈와 함께 Sampling을 거쳐 Generated Samples가 나온다."},{"w":1,"id":39,"sec":"1.3","d":"중급","x":"강의자료의 그림 필요","q":"생성 모델 그림의 학습 데이터에 레이블 숫자가 표시되지 않은 이유로 가장 적절한 설명은?","o":["레이블을 그림에서 생략했을 뿐 실제로는 반드시 필요하다","말 사진에는 레이블을 붙일 수 없기 때문","목표가 정답 맞히기가 아니라 데이터 분포 자체를 익히는 것이기 때문","레이블이 있으면 노이즈를 만들 수 없기 때문"],"a":2,"e":"생성 모델은 관측 x가 이루는 분포를 배우는 것이 목적이므로, 판별 모델처럼 정답 레이블이 필수적이지 않다."},{"w":1,"id":40,"sec":"1.3","d":"중급","x":null,"q":"생성된 말 이미지들이 학습 데이터의 말 사진과 완전히 같지 않은 이유는 무엇인가?","o":["해상도가 낮게 저장되기 때문","학습 데이터를 절반만 사용했기 때문","레이블이 잘못 붙었기 때문","학습한 확률 분포에서 새로 샘플링한 결과이기 때문"],"a":3,"e":"생성 모델은 원본을 복사하는 것이 아니라 분포에서 새 점을 뽑아내므로, 그럴듯하지만 원본과는 다른 이미지가 나온다.","s":["생성 모델 샘플링"]},{"w":1,"id":41,"sec":"1.3","d":"심화","x":null,"q":"'확률 분포에서 샘플링한다'는 표현이 생성 결과에 대해 함의하는 바는 무엇인가?","o":["출력이 하나로 정해지지 않고 매번 달라질 수 있다","출력이 언제나 동일하게 고정된다","출력이 학습 데이터 중 하나로 반드시 복사된다","출력이 0과 1 사이의 레이블 값이다"],"a":0,"e":"샘플링은 확률적 선택이므로 동일한 모델에서도 여러 가지 결과가 나올 수 있다.","s":["생성 모델 샘플링"]},{"w":1,"id":42,"sec":"1.3","d":"중급","x":null,"q":"판별 모델과 생성 모델의 대표적인 '출력'을 옳게 짝지은 것은?","o":["판별-생성 샘플, 생성-정답 확률","판별-정답 확률, 생성-생성 샘플","판별-랜덤 노이즈, 생성-레이블","판별-레이블, 생성-출력 없음"],"a":1,"e":"판별 모델은 0.83 같은 정답 확률을, 생성 모델은 Generated Samples를 출력한다.","s":["판별 vs 생성"]},{"w":1,"id":43,"sec":"1.3","d":"심화","x":null,"q":"생성 모델이 학습 데이터를 사실상 그대로 외워 버린다면 어떤 점이 문제가 되는가?","o":["샘플링 속도가 크게 느려진다","정답 레이블이 새로 필요해진다","독창적인 새 콘텐츠를 만든다는 목적에 어긋난다","확률 분포를 아예 만들 수 없게 된다"],"a":2,"e":"강의자료는 생성형 AI를 '독창적인 콘텐츠를 생성'하는 분야로 정의하므로, 원본 복제는 그 목적에 반한다."},{"w":1,"id":44,"sec":"1.3","d":"중급","x":"강의자료의 그림 필요","q":"생성 모델 그림에서 'An observation' 화살표가 가리키는 대상은 무엇인가?","o":["생성된 말 이미지 한 장","랜덤 노이즈 한 덩어리","모델의 파라미터","학습 데이터 안의 말 사진 한 장"],"a":3,"e":"화살표는 Training data 상자 안의 개별 사진을 가리키며, 이것이 하나의 관측이다."},{"w":1,"id":45,"sec":"1.3","d":"초급","x":null,"q":"다음 중 생성 모델의 산출물에 해당하는 것은?","o":["학습 데이터에 없던 새로운 말 이미지","입력 이미지가 말일 확률","말과 개를 구분하는 결정 경계","학습에 쓰인 말 사진의 개수"],"a":0,"e":"생성 모델의 출력은 Generated Samples, 즉 새로 만들어진 이미지다."},{"w":1,"id":46,"sec":"1.3","d":"심화","x":null,"q":"동일한 랜덤 노이즈를 같은 생성 모델에 두 번 넣었을 때 기대할 수 있는 결과는?","o":["언제나 학습 데이터와 똑같은 사진이 나온다","조건이 같다면 같은 샘플이 나오는 것이 자연스럽다","반드시 서로 다른 샘플이 나온다","레이블 값이 출력된다"],"a":1,"e":"샘플의 다양성은 노이즈의 무작위성에서 나오므로, 노이즈가 같으면 같은 결과가 나오는 것이 자연스럽다."},{"w":1,"id":47,"sec":"1.3","d":"중급","x":null,"q":"생성 모델을 데이터 증강(data augmentation)에 활용할 수 있는 이유는 무엇인가?","o":["관측을 레이블로 바꾸어 주기 때문
