분에 로지스틱 회귀의 출력을 확률로 해석할 수 있다."},{"w":7,"id":82,"sec":"7.6","d":"초급","x":"강의자료 내용 필요","q":"강의자료에서 '설명 가능성이 낮은 알고리즘'으로 다뤄진 것끼리 묶인 것은?","o":["의사결정트리와 규칙 기반","선형회귀와 로지스틱 회귀","XGBoost와 MLP","kNN과 선형회귀"],"a":2,"e":"설명 가능성이 낮은 알고리즘으로 XGBoost(부스팅 계열)와 MLP(다층 퍼셉트론)가 제시된다."},{"w":7,"id":83,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.8> '앙상블 학습 모델의 대표적 차이'에서 부스팅(Boosting)의 특징으로 옳은 것은?","o":["여러 샘플로 만든 예측을 독립적으로 만들어 한 번에 취합한다","앞선 모델의 예측 오류를 정정해 나가며 순차적으로 모델을 쌓아 최종 예측을 만든다","단일 트리만 사용하므로 해석이 매우 쉽다","학습 데이터를 사용하지 않고 규칙만으로 예측한다"],"a":1,"e":"그림에서 배깅은 여러 샘플의 예측을 병렬로 취합하는 반면, 부스팅은 예측 → 오류 정정 → 다음 모델 학습을 반복해 최종 예측을 만든다. 이런 구조 때문에 XGBoost는 설명 가능성이 낮다."},{"w":7,"id":84,"sec":"7.6","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.9> 퍼셉트론의 구조에 대한 설명으로 옳은 것은?","o":["입력에 가중치를 곱해 합한 z = Σw_i x_i 를 활성화 함수 g에 통과시켜 y = g(z)를 출력한다","입력을 그대로 출력으로 내보내며 가중치가 없다","입력 간 거리를 계산해 가장 가까운 입력을 출력한다","출력값을 입력으로 되돌려 순환 구조를 만든다"],"a":0,"e":"퍼셉트론은 z = Σw_i x_i 를 구한 뒤 시그모이드·Tanh·ReLU 등의 활성화 함수 g를 적용해 y = g(z)를 출력하며, 이러한 퍼셉트론이 다층으로 쌓인 것이 MLP이다."},{"w":7,"id":85,"sec":"7.6","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.10> 'MLP 해석의 어려움'에 대한 설명으로 옳은 것은?","o":["입력에 가까운 층일수록 해석이 어렵고 출력에 가까운 층일수록 쉽다","입력에 가까운 층은 구체적인 입력에 가중치를 부여해 집계하므로 알기 쉬우나, 출력에 가까운 층은 복잡하게 가중치가 부여된 입력을 받아 해석하기 힘들다","모든 층의 해석 난이도가 동일하다","층의 개수와 무관하게 MLP는 해석이 쉽다"],"a":1,"e":"입력에 가까운 층은 구체적인 입력에 가중치를 부여한 후 집계하므로 평가하여 알기 쉬운 반면, 출력에 가까운 층은 이미 복잡하게 가공된 입력을 받으므로 해석이 어렵다."},{"w":7,"id":86,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.11> 여신 심사의 업무 프로세스 순서로 옳은 것은?","o":["본심사 → 가심사 → 변제 확인 → 계약/융자","가심사 → 본심사 → 계약/융자 → 변제 확인","계약/융자 → 가심사 → 본심사 → 변제 확인","가심사 → 계약/융자 → 본심사 → 변제 확인"],"a":1,"e":"여신 심사는 가심사 → 본심사 → 계약/융자 → 변제 확인의 순서로 진행되며, 변제 확인 단계에서 심사 오류를 확인한다."},{"w":7,"id":87,"sec":"7.7","d":"중급","x":"강의자료의 그림 필요","q":"<그림 1.11>에서 '본심사' 단계가 심사하는 항목으로 제시된 것은?","o":["담보 물건의 시세와 감가상각","심사 담당자의 근속 연수","신청자의 학력과 경력","지불 능력의 유무와 계속성 유무"],"a":3,"e":"본심사에서는 '지불 능력의 유무'와 '계속성 유무'를 심사한다고 표시되어 있다."},{"w":7,"id":88,"sec":"7.7","d":"심화","x":"강의자료의 그림 필요","q":"<그림 1.11>에서 신청 내용   if (Array.isArray(v.weeks)) st.weeks = new Set(v.weeks);
  if (Array.isArray(v.lv)) st.lv = new Set(v.lv);
  VIEW_KEYS.forEach(k=>{ if (k in v) st[k] = !!v[k]; });
}

/* ---------- storage: this browser (cache) + account store (all devices) ---------- */
try{
  const s = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (s.ans) st.ans = s.ans;
  if (s.bm) st.bm = s.bm;
  if (Array.isArray(s.memos)) st.memos = s.memos;
  if (s.weeks) st.weeks = new Set(s.weeks);
  if (s.lv) st.lv = new Set(s.lv);
  if (s.imp) st.imp = s.imp;
  if (s.view){ applyView(s.view); st.viewAt = s.viewAt || 0; }
}catch(e){}
let viewSig = JSON.stringify(viewObj());

let cloud = null, cloudReady = false, writing = false, dirty = false, wt, localAt = 0;
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, weeks:[...st.weeks], lv:[...st.lv], view:viewObj(), viewAt:st.viewAt})); }catch(e){}
}
function syncMsg(cl, txt){ const s=$("#sync"); s.className="sync "+cl; s.lastElementChild.textContent=txt; }
async function flush(){
  if (!cloud || !cloudReady || writing) return;
  writing = true; dirty = false;
  try{ await cloud.set({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, view:viewObj(), viewAt:st.viewAt, at:localAt||Date.now()}); syncMsg("on","계정에 저장됨 · 다른 기기에서도 이어서 풀 수 있어요"); }
  catch(e){ syncMsg("err","계정 저장 실패 · 이 브라우저에는 저장됨"); }
  writing = false;
  if (dirty) flush();
}
function saveProgress(){
  localAt = Date.now();
  saveLocal();
  if (!cloud || !cloudReady) return;
  dirty = true; syncMsg("","저장 중…");
  clearTimeout(wt); wt = setTimeout(flush, 700);
}
function mergeMemos(a,b){
  const m = {}; [...a,...b].forEach(x=>{ if (!m[x.id] || (x.at||0) > (m[x.id].at||0)) m[x.id]=x; });
  return Object.values(m).sort((x,y)=>(y.at||0)-(x.at||0));
}
function same(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
async function initCloud(){
  try{
    const c = window.claude && await window.claude.use("db");
    const u = window.claude && await window.claude.use("user");
    const id = u && await u.id();
    if (!c || !id){ syncMsg("","이 브라우저에 저장됩니다"); const a=document.createElement("a"); a.href="https://claude.ai/artifact/32zV9aVcowEyFDMuzEp2KQ"; a.target="_blank"; a.rel="noopener"; a.textContent="기기 간 동기화 버전(Claude) 열기 ↗"; $("#sync").append(" · ",a); return; }
    cloud = c.doc("data/users/"+id+"/progress");
    const snap = await cloud.get();
    if (snap.exists){
      const d = snap.data() || {};
      // 계정 기록에 이 브라우저에서만 푼 기록을 합침
      st.ans = Object.assign({}, st.ans, d.ans||{});
      st.bm = Object.assign({}, st.bm, d.bm||{});
      st.imp = Object.assign({}, st.imp, d.imp||{});
      st.memos = mergeMemos(st.memos, d.memos||[]);
      if (d.view && (d.viewAt||0) > (st.viewAt||0)){ applyView(d.view); st.viewAt = d.viewAt; }
      viewSig = JSON.stringify(viewObj());
    }
    localAt = Math.max(localAt, (snap.data()||{}).at||0, Date.now());
    cloudReady = true;
    const sd = snap.data() || {};
    if (!snap.exists || !same({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, view:viewObj()},{ans:sd.ans||{}, bm:sd.bm||{}, imp:sd.imp||{}, memos:sd.memos||[], view:sd.view||null})) { dirty = true; flush(); }
    else syncMsg("on","계정에 저장됨 · 다른 기기에서도 이어서 풀 수 있어요");
    saveLocal(); update();
    cloud.onSnapshot(s=>{
      if (!s.exists || s.metadata?.hasPendingWrites || writing || dirty) return;
      const d = s.data() || {};
      if ((d.at||0) <= localAt) return;   // 내 기록보다 오래된 스냅샷은 무시
      localAt = d.at;
      if (same(d.ans||{}, st.ans) && same(d.bm||{}, st.bm) && same(d.imp||{}, st.imp) && same(d.memos||[], st.memos)) return;
      st.ans = d.ans || {}; st.bm = d.bm || {}; st.imp = d.imp || {}; st.memos = d.memos || [];
      saveLocal(); if (document.activeElement?.tagName !== "TEXTAREA") update();
    }, ()=>{});
  }catch(e){ syncMsg("err","계정 저장소에 연결하지 못함 · 이 브라우저에는 저장됨"); }
}

const $ = s => document.querySelector(s);
function el(tag, cl, txt){ const e=document.createElement(tag); if(cl) e.className=cl; if(txt!=null) e.textContent=txt; return e; }

/* ---------- chips ---------- */
function chip(label, count, pressed, onclick, extra){
  const b = el("button","chip"+(extra?" "+extra:""));
  b.append(label); if(count!=null){ const c=el("span","c",count); b.append(c); }
  b.setAttribute("aria-pressed", pressed); b.onclick = onclick; return b;
}
function renderChips(){
  const wr = $("#weekRow"); wr.querySelectorAll(".chip").forEach(c=>c.remove());
  wr.append(chip("전체", null, st.weeks.size===0, ()=>{ st.weeks.clear(); update(); }));
  DATA.weeks.forEach(w=>{
    wr.append(chip(w.w+"주차", null, st.weeks.has(w.w), ()=>{ toggle(st.weeks,w.w); update(); }));
  });
  const lr = $("#lvRow"); lr.querySelectorAll(".chip").forEach(c=>c.remove());
  const base = DATA.qs.filter(q => st.weeks.size===0 || st.weeks.has(q.w));
  lr.append(chip("전체", base.length, st.lv.size===0, ()=>{ st.lv.clear(); update(); }));
  LV.forEach(k=>{
    const b = chip(k, base.filter(q=>cls(q)===k).length, st.lv.has(k), ()=>{ toggle(st.lv,k); update(); }, "lv");
    b.dataset.k = k; lr.append(b);
  });
  const bmN = Object.keys(st.bm).length;
  $("#fStar").hidden = STAR_N===0;
  $("#fStar").textContent = "★ 중요 "+base.filter(q=>q.s).length;
  $("#fBm").textContent = "북마크 "+bmN;
  [["#fStar","star"],["#fBm","bmOnly"],["#fWrong","wrong"],["#fTodo","todo"],["#fReveal","reveal"]]
    .forEach(([id,k])=>$(id).setAttribute("aria-pressed", st[k]));
}
function toggle(set,v){ set.has(v) ? set.delete(v) : set.add(v); }

/* ---------- filtering ---------- */
function visible(){
  const t = st.text.trim().toLowerCase();
  return DATA.qs.filter(q=>{
    if (st.weeks.size && !st.weeks.has(q.w)) return false;
    if (st.lv.size && !st.lv.has(cls(q))) return false;
    if (st.star && !q.s) return false;
    if (st.bmOnly && !st.bm[qkey(q)]) return false;
    const a = st.ans[qkey(q)];
    if (st.wrong && !(a!=null && a!==q.a)) return false;
    if (st.todo && (q.x || a!=null)) return false;
    if (t && !(q.q+" "+q.o.join(" ")+" "+q.e+" "+(q.s||[]).join(" ")).toLowerCase().includes(t)) return false;
    return true;
  });
}

/* ---------- status ---------- */
let confirmReset = false;
function renderStatus(list){
  const s = $("#status"); s.innerHTML = "";
  const solvable = list.filter(q=>!q.x);
  let ok=0, no=0;
  solvable.forEach(q=>{ const a=st.ans[qkey(q)]; if(a==null) return; a===q.a?ok++:no++; });
  const done = ok+no;
  const add = (cl, label, val) => { const sp=el("span",cl); sp.append(label+" "); sp.append(el("b",null,val)); s.append(sp); };
  add("", "표시", list.length+"문제");
  add("", "풀이", done+" / "+solvable.length);
  add("ok", "정답", ok);
  add("no", "오답", no);
  if (done) add("", "정답률", Math.round(ok/done*100)+"%");
  const m = el("div","meter"); const n = solvable.length || 1;
  const a = el("i","m-ok"); a.style.width = (ok/n*100)+"%";
  const b = el("i","m-no"); b.style.width = (no/n*100)+"%";
  m.append(a,b); s.append(m);
  if (!confirmReset){
    const r = el("button","tool","풀이 기록 초기화"); r.onclick=()=>{ confirmReset=true; renderStatus(list); }; s.append(r);
  } else {
    const box = el("span","confirm","모든 풀이 기록을 지울까요? (북마크는 남아요)");
    const y = el("button","tool danger","지우기"); y.onclick=()=>{ st.ans={}; confirmReset=false; saveProgress(); update(); };
    const c = el("button","tool","취소"); c.onclick=()=>{ confirmReset=false; renderStatus(list); };
    box.append(y,c); s.append(box);
  }
}

/* ---------- cards ---------- */
const N = ["1","2","3","4","5"];
const BM_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11l-4-2.8-4 2.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function refresh(c,q){ c.replaceWith(card(q)); const l=visible(); renderStatus(l); renderMini(l); }
function card(q){
  const k = qkey(q), a = st.ans[k], ex = !!q.x;
  const shown = ex || a!=null || st.reveal;
  const c = el("article","q"+(ex?" is-ex":"")+(q.s?" is-star":"")); c.id = "q"+k;
  const meta = el("div","meta");
  meta.append(el("span","num", q.w+"주차 · "+q.id+"번"));
  meta.append(el("span","badge b-"+cls(q), cls(q)));
  if (q.s) meta.append(el("span","star", "★ "+q.s.join(" · ")));
  if (ex){ meta.append(el("span","badge b-"+q.d, q.d)); meta.append(el("span","why", q.x)); }
  const w = DATA.weeks[q.w-1];
  meta.append(el("span","sec", q.sec+" "+(w.secs[q.sec]||"")));
  if (!ex && a!=null) meta.append(el("span","res "+(a===q.a?"ok":"no"), a===q.a?"정답":"오답"));
  const bm = el("button","bm"); bm.type="button"; bm.innerHTML = BM_SVG;
  const on = !!st.bm[k];
  bm.setAttribute("aria-pressed", on); bm.setAttribute("aria-label", on?"북마크 해제":"북마크");
  bm.title = on ? "북마크 해제" : "북마크";
  bm.onclick = ()=>{ if (st.bm[k]) delete st.bm[k]; else st.bm[k]=1; saveProgress(); renderChips(); refresh(c,q); };
  meta.append(bm);
  c.append(meta);
  c.append(el("p","qt", q.q));
  const opts = el("div","opts");
  q.o.forEach((t,i)=>{
    const b = el("button","opt"); b.type="button";
    b.append(el("span","n",N[i])); b.append(el("span","t",t));
    if (shown){
      b.disabled = true;
      if (i===q.a){ b.classList.add("correct"); b.append(el("span","mark","정답")); }
      else if (a===i){ b.classList.add("wrong"); b.append(el("span","mark","내 선택")); }
    } else {
      b.onclick = ()=>{ st.ans[k]=i; saveProgress(); refresh(c,q); };
    }
    opts.append(b);
  });
  c.append(opts);
  if (shown){
    const e = el("div","exp");
    const graded = !ex && a!=null, good = a===q.a;
    const h = el("h4",null, graded ? (good ? "✓ 정답입니다" : "✕ 다시 확인해 보세요 · 정답 "+N[q.a]+"번") : "해설 · 정답 "+N[q.a]+"번");
    if (graded) e.classList.add(good ? "ok" : "no");
    e.append(h, el("p",null,q.e));
    const w = DATA.weeks[q.w-1];
    const cx = CONCEPTS[qkey(q)];
    if (cx){
      const box = el("div","concept");
      box.append(el("h5",null,"📘 개념 다시 보기"));
      cx.split("\n").forEach(line=>{
        const m = line.match(/^(\S+) · (.*)$/), pp = el("p");
        if (m){ pp.append(el("b",null,m[1])); pp.append(" "+m[2]); } else pp.textContent = line;
        box.append(pp);
      });
      e.append(box);
    }
    const href = LINKS[q.w+"|"+q.sec] || LINKS[q.w+"|"];
    if (href){
      const r = el("a","ref","관련 단원 · "+q.sec+" "+(w.secs[q.sec]||"")+" — 개념 정리 보기 ↗");
      r.href = LINK_BASE + href; r.target = "_blank"; r.rel = "noopener"; e.append(r);
    } else e.append(el("span","ref","관련 단원 · "+q.sec+" "+(w.secs[q.sec]||"")));
    c.append(e);
  }
  const f = el("div","qfoot");
  const mb = el("button","qmemo","메모"); mb.type="button"; mb.onclick=()=>newMemo(q);
  f.append(mb);
  if (!ex && a!=null){
    const r = el("button","link","다시 풀기"); r.onclick=()=>{ delete st.ans[k]; saveProgress(); refresh(c,q); };
    f.append(r);
  }
  c.append(f);
  return c;
}

function renderList(list){
  const root = $("#list"); root.innerHTML = "";
  if (!list.length){
    root.append(el("p","empty", st.bmOnly && !Object.keys(st.bm).length
      ? "아직 북마크한 문제가 없습니다. 문제 오른쪽 위의 책갈피 버튼을 눌러 추가하세요."
      : "조건에 맞는 문제가 없습니다. 분류나 주차 선택을 바꿔 보세요."));
    return;
  }
  const frag = document.createDocumentFragment();
  let cur = 0;
  list.forEach(q=>{
    if (q.w!==cur){
      cur = q.w; const w = DATA.weeks[cur-1];
      const h = el("section","week"); h.id = "week"+cur;
      h.append(el("div","wk","WEEK "+String(cur).padStart(2,"0")));
      h.append(el("h2",null, cur+"주차 · "+w.t));
      const inWeek = list.filter(x=>x.w===cur);
      const counts = LV.map(k=>[k,inWeek.filter(x=>cls(x)===k).length]).filter(x=>x[1]).map(x=>x[0]+" "+x[1]).join(" · ");
      const sn = inWeek.filter(x=>x.s).length;
      h.append(el("div","wmeta", inWeek.length+"문제 — "+counts+(sn?" · ★ "+sn:"")));
      frag.append(h);
    }
    frag.append(card(q));
  });
  root.append(frag);
}

function update(){
  const vs = JSON.stringify(viewObj());
  if (vs !== viewSig){ viewSig = vs; st.viewAt = Date.now(); saveProgress(); }
  saveLocal(); renderChips(); const list=visible(); renderStatus(list); renderList(list); renderMini(list);
  renderMemos();
}

/* ---------- collapsing filter bar ---------- */
function renderMini(list){
  const parts = [];
  parts.push(st.weeks.size ? [...st.weeks].sort((a,b)=>a-b).join("·")+"주차" : "전체 주차");
  if (st.lv.size) parts.push([...st.lv].join("·"));
  if (st.star) parts.push("★ 중요"); if (st.bmOnly) parts.push("북마크");
  if (st.reveal) parts.push("정답 보기");
  if (st.wrong) parts.push("틀린 문제"); if (st.todo) parts.push("안 푼 문제");
  const solv = list.filter(q=>!q.x), done = solv.filter(q=>st.ans[qkey(q)]!=null).length;
  const t = $("#miniTxt"); t.textContent = parts.join(" · ")+" — ";
  const b = el("b",null,list.length+"문제"); t.append(b, " · 풀이 "+done+"/"+solv.length);
}
const bar = $("#bar"); let lastY = window.scrollY, pinOpen = false, anchorY = 0;
function setCollapsed(on){ bar.classList.toggle("is-collapsed", on); $("#collapse").hidden = on || !pinOpen; }
window.addEventListener("scroll", ()=>{
  const y = window.scrollY, top = $(".views").offsetTop + $(".views").offsetHeight + 80;
  if (Date.now() < quietUntil){ anchorY = lastY = y; return; }
  if (st.view!=="quiz" || y < top){ pinOpen=false; setCollapsed(false); lastY=y; return; }
  if (pinOpen){ if (y - anchorY > 60){ pinOpen=false; setCollapsed(true); } }
  else if (y > lastY + 6) setCollapsed(true);
  lastY = y;
}, {passive:true});
let quietUntil = 0;
$("#expand").onclick = ()=>{
  pinOpen = true; setCollapsed(false); quietUntil = Date.now()+400;
  requestAnimationFrame(()=>{ anchorY = lastY = window.scrollY; });
};
$("#collapse").onclick = ()=>{
  pinOpen = false; setCollapsed(true); quietUntil = Date.now()+400;
  requestAnimationFrame(()=>{ anchorY = lastY = window.scrollY; });
};

/* ---------- memo pad ---------- */
const fmt = t => { const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function setView(v){
  st.view = v;
  $("#vQuiz").setAttribute("aria-selected", v==="quiz"); $("#vMemo").setAttribute("aria-selected", v==="memo");
  $("#bar").hidden = v!=="quiz"; $("#list").hidden = v!=="quiz"; $("#memoView").hidden = v!=="memo";
  setCollapsed(false);
}
let backTo = null;   // {y, key} 메모로 넘어가기 전 문제 화면 위치
function rememberQuiz(q){ if (st.view==="quiz") backTo = {y:window.scrollY, key:q?qkey(q):null}; }
function backToQuiz(){
  setView("quiz");
  const b = backTo; backTo = null; renderBack();
  if (!b) return;
  const c = b.key && document.getElementById("q"+b.key);
  if (c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1600); }
  else window.scrollTo({top:b.y});
}
function renderBack(){ $("#memoBack").hidden = !backTo; }
function goMemo(q){
  rememberQuiz(q);
  try{ history.pushState({memo:1}, ""); }catch(e){}
  setView("memo"); renderBack(); window.scrollTo({top:0});
}
window.addEventListener("popstate", ()=>{ if (st.view==="memo") backToQuiz(); });
function newMemo(q){
  const m = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), t:"", at:Date.now()};
  if (q){ m.ref = qkey(q); m.t = "["+q.w+"주차 "+q.id+"번] "; }
  st.memos.unshift(m); saveProgress();
  if (st.view==="quiz") goMemo(q);
  renderMemos();
  const ta = $("#memoList textarea"); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
let confirmDel = null;
function renderMemos(){
  $("#memoN").textContent = st.memos.length || "";
  const root = $("#memoList");
  if ($("#memoView").hidden) return;
  const ae = document.activeElement;
  if (ae && ae.tagName==="TEXTAREA" && root.contains(ae)) return;
  root.innerHTML = "";
  if (!st.memos.length){ root.append(el("p","empty","아직 메모가 없습니다. ‘새 메모’를 눌러 시작하세요.")); return; }
  st.memos.forEach(m=>{
    const box = el("div","memo");
    if (m.ref){
      const [w,id] = m.ref.split("-").map(Number); const q = DATA.qs.find(x=>x.w===w && x.id===id);
      if (q){ const r = el("button","memo-ref", w+"주차 "+id+"번 문제로 이동"); r.type="button"; r.onclick=()=>gotoQ(q); box.append(r); }
    }
    const ta = el("textarea"); ta.value = m.t; ta.id = "memo-"+m.id; ta.setAttribute("aria-label","메모 내용");
    ta.placeholder = "메모를 입력하세요";
    const foot = el("div","memo-foot");
    const when = el("span",null,"수정 "+fmt(m.at));
    ta.oninput = ()=>{ m.t = ta.value; m.at = Date.now(); when.textContent = "수정 "+fmt(m.at); saveProgress(); };
    ta.onblur = ()=>{ if (!m.t.trim()){ st.memos = st.memos.filter(x=>x!==m); saveProgress(); setTimeout(renderMemos); } };
    foot.append(when, el("span","sp"));
    if (confirmDel===m.id){
      const y = el("button","tool danger","삭제"); y.onclick=()=>{ st.memos = st.memos.filter(x=>x!==m); confirmDel=null; saveProgress(); renderMemos(); };
      const n = el("button","tool","취소"); n.onclick=()=>{ confirmDel=null; renderMemos(); };
      foot.append(el("span",null,"이 메모를 지울까요?"), y, n);
    } else {
      const d = el("button","tool","삭제"); d.onclick=()=>{ confirmDel=m.id; renderMemos(); };
      foot.append(d);
    }
    box.append(ta, foot); root.append(box);
  });
}
function gotoQ(q){
  backTo = {y:0, key:qkey(q)};
  if (!document.getElementById("q"+qkey(q))){   // 지금 필터에 안 보이는 문제면 필터를 풀어서 보여 줌
    st.weeks.clear(); st.lv.clear(); st.star=st.bmOnly=st.wrong=st.todo=false; st.text=""; $("#q").value=""; update();
  }
  if (history.state && history.state.memo){ try{ history.back(); return; }catch(e){} }
  backToQuiz();
}
$("#vQuiz").onclick=()=>{ if (st.view==="memo"){ if (history.state && history.state.memo){ try{ history.back(); return; }catch(e){} } backToQuiz(); } };
$("#vMemo").onclick=()=>{ if (st.view!=="memo"){ goMemo(null); renderMemos(); } };
$("#memoBack").onclick=()=>$("#vQuiz").onclick();
$("#memoAdd").onclick=()=>newMemo(null);

$("#fStar").onclick=()=>{ st.star=!st.star; update(); };
$("#fBm").onclick=()=>{ st.bmOnly=!st.bmOnly; update(); };
$("#fWrong").onclick=()=>{ st.wrong=!st.wrong; if(st.wrong) st.todo=false; update(); };
$("#fTodo").onclick=()=>{ st.todo=!st.todo; if(st.todo) st.wrong=false; update(); };
$("#fReveal").onclick=()=>{ st.reveal=!st.reveal; update(); };
let tm; $("#q").oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>{ st.text=e.target.value; update(); },180); };
$("#totop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

update();
initCloud();
</script>
