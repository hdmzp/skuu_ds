 정리하면 P(C₁|x) = e^(wᵀx)/(1 + e^(wᵀx)) = σ(wᵀx)다. 로그 오드를 선형으로 두는 것과 확률을 σ(wᵀx)로 두는 것은 같은 말이다.\n함정 · 4번 1 − σ(wᵀx)는 P(C₂|x)이고, 3번은 로그 오드를 확률로 착각한 것이다.","4-85":"핵심 · 두 클래스뿐이므로 P(C₂|x) = 1 − P(C₁|x) = 1 − σ(wᵀx)이고, 정리하면 e^(−wᵀx)/(1 + e^(−wᵀx))다. 이 값은 σ(−wᵀx)와도 같다.\n함정 · 4번은 C₁의 확률이고, 1번·2번은 각각 음수와 1을 넘는 값이 나와 확률이 될 수 없다.","4-86":"핵심 · 베르누이 분포는 0/1 두 값만 갖는 변수의 분포로 p^x(1 − p)^(1−x)라고 쓴다. x = 1이면 p, x = 0이면 1 − p만 남는 '스위치' 구조라 레이블 1/0 표기와 딱 맞는다.\n함정 · 3번은 지수를 뒤집어 x = 1일 때 1 − p가 나오고, 4번은 곱이 아닌 합이라 확률이 1을 넘을 수 있다.","4-87":"핵심 · 베르누이 분포의 p 자리에 P(C₁|xᵢ) = σ(wᵀxᵢ)를 넣으면 P(yᵢ|xᵢ) = σ^yᵢ(1 − σ)^(1−yᵢ)가 된다. yᵢ = 1이면 σ, yᵢ = 0이면 1 − σ만 남아 '정답 클래스에 매긴 확률'이 된다.\n함정 · 2번은 지수를 바꿔 넣어 오답 클래스의 확률을 계산하고, 3번·4번은 확률 분포 형태가 아니다.","4-88":"핵심 · 관측들이 서로 독립이라고 보면 학습 데이터 전체가 나올 확률, 즉 우도는 각 P(yᵢ|xᵢ)의 곱 ∏P(yᵢ|xᵢ)다. 로그를 취하면 이 곱이 합으로 바뀌어 손실함수로 다루기 쉬워진다.\n함정 · 1번은 로그를 취하기 전인데 합으로 썼고, 2번은 레이블 없이 입력의 확률만 곱했다.","4-89":"핵심 · P(yᵢ|xᵢ)는 현재 인자로 계산한 사후 확률이 xᵢ의 실제 클래스를 얼마나 잘 맞히는지를 나타낸다. yᵢ = 1이면 σ, yᵢ = 0이면 1 − σ로 정답 쪽 확률을 고른다.\n함정 · 3번 xᵢ의 사전확률이나 4번 제곱오차는 다른 개념이고, 1번 가중치 크기와도 관계없다.","4-90":"핵심 · 우도는 정답을 맞힐 확률의 곱이라 클수록 좋은 모델이다. 로그는 증가 함수이고 앞에 음수를 붙였으므로 −ln ℓ은 거꾸로 작을수록 좋다.\n함정 · 2번은 방향을 둘 다 뒤집었고, 3번·4번은 음수 부호가 방향을 바꾼다는 점을 놓쳤다.","4-91":"핵심 · ln은 증가 함수라 우도를 키우는 w가 ln ℓ도 키우고, 음수를 붙이면 −ln ℓ은 작아진다. 그래서 우도 최대화와 NLL(−ln ℓ) 최소화는 같은 w*를 찾는 같은 목표다.\n함정 · 1번은 NLL을 최대화한다고 해서 방향이 반대이고, 3번도 우도를 최소화한다고 해 틀렸다.","4-92":"핵심 · 로지스틱 회귀의 손실은 NLL을 관측 수 N으로 나눈 −(1/N)ln ℓ이다. 평균을 내면 데이터 개수와 상관없이 비교할 수 있고, 이 값이 곧 평균 크로스 엔트로피다.\n함정 · 2번 평균제곱오차는 선형회귀의 손실이고, 4번은 음수 부호가 없어 최소화하면 우도도 작아진다.","4-93":"핵심 · σ^yᵢ(1 − σ)^(1−yᵢ)에 로그를 취하면 지수가 앞으로 내려와 yᵢ ln σ + (1 − yᵢ) ln(1 − σ)가 된다. 여기에 −(1/N)Σ를 붙인 것이 손실이며, 바이너리 크로스 엔트로피의 평균과 같다.\n함정 · 2번은 제곱오차 꼴이고, 1번·3번은 로그와 두 항 구조가 빠졌다.","4-94":"핵심 · 로지스틱 손실의 기울기는 '정답 − 예측' 오차 yᵢ − σ에 해당 입력을 곱한 꼴이다. w₀에 곱해지는 입력은 x₀ = 1이라서 ∂L/∂w₀ = −(1/N)Σ(yᵢ − σ)가 된다.\n함정 · 1번은 xᵢ가 곱해진 w₁의 편미분이고, 4번은 오차를 제곱해 MSE 형태가 되었다.","4-95":"핵심 · w₁로 미분하면 연쇄법칙에 의해 σ 안의 w₁xᵢ에서 xᵢ가 튀어나와 −(1/N)Σxᵢ(yᵢ − σ)가 된다. σ' = σ(1 − σ)가 CE의 미분과 상쇄되어 이렇게 깔끔한 꼴이 나온다.\n함정 · 3번은 xᵢ가 빠진 w₀의 편미분이고, 1번·4번은 오차 항 yᵢ − σ가 없다.","4-96":"핵심 · 바이너리 크로스 엔트로피는 −yᵢ ln P(C₁|xᵢ) − (1 − yᵢ)ln(1 − P(C₁|xᵢ))로, 정답 클래스에 매긴 확률의 −ln이다. 정답 확률이 1에 가까우면 0, 0에 가까우면 한없이 커진다.\n함정 · 2번 제곱오차와 3번 절댓값 오차는 회귀용 손실이고, 4번은 예측값이 빠져 손실이 될 수 없다.","4-97":"핵심 · 일반화하면 학습 목표는 평균 CE를 최소로 만드는 w*, 즉 argmin_w (1/N)ΣCE를 경사하강법으로 찾는 것이다. 이는 우도 최대화와 같은 목표를 손실 최소화 형태로 쓴 것이다.\n함정 · 2번은 손실을 최대화하는 반대 방향이고, 3번은 가중치 크기만, 4번은 판별 함수값만 본다.","4-98":"핵심 · 평균 CE를 wₖ로 미분하면 −(1/N)Σ(yᵢ − σ(wᵀxᵢ))xᵢₖ다. 오차(정답 − 예측)에 그 가중치가 곱해지는 입력 성분 xᵢₖ를 곱한 꼴이며, k = 0이면 xᵢ₀ = 1이라 오차 합만 남는다.\n함정 · 2번은 MSE식 제곱이고, 1번은 오차 항이 빠졌으며, 4번은 입력 성분과 음수 부호가 빠졌다.","4-99":"핵심 · 적용 I은 w를 임의값으로 초기화한 뒤 모든 성분을 wₖ ← wₖ − α·(기울기)로 갱신한다. 기울기에 음수가 붙어 있으므로 빼면 wₖ + (α/N)Σ(yᵢ − σ)xᵢₖ처럼 더하기 꼴이 된다.\n함정 · 1번은 α = 0이면 전혀 움직이지 않고, 4번은 로지스틱 회귀에 닫힌 해가 없다는 점을 놓쳤다.","4-100":"핵심 · 적용 I은 N개 관측 전체의 평균 CE로 한 번 갱신하는 배치 방식이고, 적용 II는 관측 하나의 CE로 바로 갱신하는 확률적(SGD) 방식이다. 그래서 II의 갱신식에는 1/N과 Σ가 없다.\n함정 · 1번·3번처럼 학습률이나 초기화를 빼는 것이 아니며, 2번처럼 손실을 제곱오차로 바꾸지도 않는다.","5-1":"핵심 · 이진 분류는 모든 개체가 두 클래스 C1, C2 중 하나에 속하고, 새 개체가 어느 쪽인지 정하는 문제다. 목표값이 범주인지 연속값인지, 레이블이 있는지 없는지로 분류·회귀·비지도 학습이 갈린다.\n함정 · 4번의 연속 실수 목표값은 회귀, 1번의 레이블 없음은 비지도 학습, 3번은 다중 레이블 상황이다.","5-2":"핵심 · 이진 분류를 푸는 길은 두 가지다. 접근법 1은 두 클래스를 가르는 경계로 특징 공간을 나누고, 접근법 2는 사후 확률 P(C1|x)와 P(C2|x)를 구해 큰 쪽을 고른다. 로지스틱 회귀는 접근법 2를 σ(wᵀx)로 구현한 것이다.\n함정 · 4번은 두 접근법의 순서를 뒤바꿨고, 1·3번의 손실 최소화나 가중치 초기화는 학습 절차이지 접근법이 아니다.","5-3":"핵심 · 선형 판별 함수 g(x)=wᵀx는 특징 성분에 가중치를 곱해 더한 값으로, g(x)의 부호로 클래스를 정한다. g(x)=0이 곧 결정 경계(직선·초평면)이며, 퍼셉트론의 가중합 z와 같은 식이다.\n함정 · 2번은 시그모이드로 가중합을 확률로 바꾸는 활성화 함수이지 판별 함수 자체가 아니다. 4번 xᵀx는 가중치가 없는 노름 제곱이다.","5-4":"핵심 · wᵀx = w0 + w1x1 + … + wdxd는 성분마다 가중치를 곱해 더한 가중합이다. 가중치는 각 성분이 판정에 얼마나 기여하는지를 나타내고, 결과가 선형이므로 결정 경계도 직선(초평면)이 된다.\n함정 · 1번의 성분 간 곱셈은 선형식에 없다. 3번의 확률 변환은 시그모이드가 하는 일이고, 4번의 차원 축소와도 관계없다.","5-5":"핵심 · 로지스틱 회귀는 가중합 wᵀx를 시그모이드 σ에 넣어 0~1 사이의 사후 확률 P(C1|x)를 얻고, 이 확률로 클래스를 정한다. 퍼셉트론에서 활성화 함수를 시그모이드로 고른 경우와 같은 모델이다.\n함정 · 1번 wᵀx는 범위 제한이 없어 확률이 될 수 없고, 2번 exp(wᵀx)는 1을 넘을 수 있다. 3번 ln은 음수 입력에서 정의되지 않는다.","5-6":"핵심 · 로지스틱 회귀는 C1 사후 확률의 로그 오즈 ln{P/(1−P)}를 근사 대상으로 삼는다. 로그 오즈가 선형식으로 표현된다고 보고 이를 P에 대해 풀면 P(C1|x)=σ(wᵀx)라는 시그모이드 형태가 나온다.\n함정 · 1번 공분산은 가우시안 생성 모델에서, 2번 MSE는 회귀 손실에서 쓰는 양이고, 4번은 사후 확률이 아니라 사전 확률이다.","5-7":"핵심 · 교안은 사후 확률의 로그 오즈를 exp(wᵀx) 형태로 근사한다고 적었다. 오즈 P/(1−P)=exp(wᵀx)로 두고 P에 대해 풀면 P=1/(1+exp(−wᵀx))=σ(wᵀx)가 되어, 로지스틱 회귀의 식과 이어진다.\n함정 · 4번 ln(wᵀx)는 로그 오즈를 ln 형태로 쓴다는 연상에서 오는 오답이다. 1·2번은 이 유도에 등장하지 않는다.","5-8":"핵심 · 퍼셉트론은 인공신경망의 기본 정보처리 유닛이다. 입력 성분의 가중합에 활성화 함수를 붙인 단위로, 이를 여러 개 쌓고 연결하면 다층 신경망(MLP)이 된다.\n함정 · 2번은 경사하강법 같은 최적화 알고리즘, 4번은 커널 기법을 설명한다. 퍼셉트론은 알고리즘이나 자료 구조가 아니라 모델의 구성 단위다.","5-9":"핵심 · 5주차 목표는 로지스틱 회귀 복습에서 출발해 퍼셉트론의 구조, 순전파, 학습, 논리게이트 표현까지 이어진다. 한 줄로 줄이면 가중합과 활성화로 이루어진 단위가 어떻게 동작하고 학습하며 어디서 한계를 보이는지다.\n함정 · 1·3·4번은 모두 이번 주 목표에 들어 있다. 합성곱 신경망은 이후 계보(퍼셉트론→MLP→CNN)에서 다룬다.","5-10":"핵심 · 교안의 학습 중점은 네 가지다. 퍼셉트론 구조를 그림으로 그리기, 노드·에지·가중치·바이어스의 역할 이해, 순전파 과정 이해, 학습 규칙 이해다. 모두 구조→동작→학습 흐름을 따른다.\n함정 · 1·3·4번은 교안에 나오는 중점이다. 2번의 하이퍼파라미터 자동 탐색은 이번 주에 다루지 않는다.","5-11":"핵심 · 퍼셉트론이 중요한 이유는 다층 신경망의 기본 구성 단위이기 때문이다. MLP의 은닉 뉴런, 트랜스포머 FFN의 뉴런 하나하나가 모두 '가중합+활성화'라는 퍼셉트론 구조다.\n함정 · 2번은 틀렸다. 단층 퍼셉트론은 XOR조차 풀지 못한다. 3번과 달리 가중치를 학습하며, 4번과 달리 생성 모델이 아니다.","5-12":"핵심 · 퍼셉트론은 가중합 z=wᵀx에 활성화 f를 씌운 모델이고, 어떤 f를 고르느냐에 따라 이름이 달라진다. f가 시그모이드면 로지스틱 회귀, 항등 함수면 선형 회귀, 부호 함수면 Rosenblatt 퍼셉트론이다.\n함정 · 1번은 시그모이드 출력이 곧 확률이라는 점을 놓쳤다. 4번은 반대로, 로지스틱 회귀야말로 시그모이드를 활성화로 쓴다.","5-13":"핵심 · 퍼셉트론은 '가중합 + 활성화 함수' 두 부분으로 이루어진다. 먼저 z=Σwkxk를 계산하고, 그 결과를 f에 통과시켜 ŷ=f(z)를 낸다. 활성화가 없으면 단순한 선형식에 그친다.\n함정 · 2번은 곱만 있고 덧셈(가중합)이 없다. 3·4번의 중앙값 계산이나 복사는 퍼셉트론 연산과 무관하다.","5-14":"핵심 · 학습 데이터 D={(xi, yi)}는 입력 특징 벡터 xi와 그에 대응하는 정답(목표값) yi의 쌍 N개로 이루어진다. 학습은 예측 ŷi가 yi에 가까워지도록 가중치를 조정하는 과정이다.\n함정 · 2번 가중치와 3번 학습률은 데이터가 아니라 모델·학습 설정에 속한다. 4번의 차원은 d로 따로 표기한다.","5-15":"핵심 · 표기 규칙은 xi=[xi1 … xid]ᵀ다. 첫 번째 첨자 i는 몇 번째 샘플인지, 두 번째 첨자 j는 그 벡터의 몇 번째 성분인지를 가리킨다. 그래서 가중합을 샘플별로 쓰면 zi = w0 + w1xi1 + … + wdxid가 된다.\n함정 · 1·3번은 첨자를 에폭이나 클래스로 읽은 것이고, 2번은 x를 가중치로 혼동했다.","5-16":"핵심 · 퍼셉트론 그림은 노드와 에지의 결합이다. 노드(원)는 값을 담는 자리이고, 에지(화살표)는 정보가 흐르는 방향을 나타내며 그 위에 가중치가 붙는다.\n함정 · 4번은 노드와 에지의 기호를 뒤바꿨다. 2·3번의 사각형·삼각형은 교안에서 쓰지 않는 기호다.","5-17":"핵심 · 에지는 노드 사이의 정보 흐름이다. 입력 노드 값이 에지를 따라 출력 노드로 전달되고, 그 과정에서 에지의 가중치가 곱해진다. 그래서 '어느 입력이 얼마나 중요한가'가 에지 위에 표현된다.\n함정 · 2번의 활성화 함수는 출력 노드 안에서 적용되지 에지에 표시되지 않는다. 1·3번은 에지에 흐름의 의미가 있다는 점을 무시했다.","5-18":"핵심 · 가중치 wk는 입력 xk가 출력에 얼마나 기여하는지를 나타낸다. 절댓값이 크면 영향이 크고, 부호가 음수면 출력을 낮추는 쪽으로 작용한다. 학습이란 결국 이 기여도를 데이터에 맞게 조정하는 일이다.\n함정 · 1번 에지 길이는 그림상의 요소일 뿐이다. 3번처럼 활성화 여부를 강제로 정하는 것은 가중합과 활성화 함수가 함께 하는 일이다.","5-19":"핵심 · x0는 값이 항상 1인 바이어스 노드다. 여기에 붙은 가중치 w0가 곱해져 상수항 w0×1=w0가 되므로, 바이어스를 다른 가중치와 똑같이 wᵀx 안에서 다루고 함께 학습할 수 있다.\n함정 · 1번은 값을 0으로 잘못 알았다. 0이면 w0가 곱해져도 사라진다. 3번처럼 값이 변하지 않으며, 2번처럼 활성화를 담는 곳은 출력 노드다.","5-20":"핵심 · 입력층은 특징 성분 d개에 바이어스 노드 x0=1 하나를 더해 d+1개의 노드로 이루어진다. 가중치도 w0부터 wd까지 d+1개다. 그래서 2개 성분 예제의 입력 노드는 3개가 된다.\n함정 · 2번은 바이어스 노드를 빠뜨렸고, 3번은 바이어스를 빼는 방향으로 착각했다. 1번처럼 두 배가 될 근거는 없다.","5-21":"핵심 · 입력 노드 수는 특징 성분 수에 바이어스 노드 1개를 더한 값이다. x=[x1, x2]ᵀ면 x0, x1, x2의 3개이고, 가중합은 z = w0 + w1x1 + w2x2가 된다.\n함정 · 4번 2개는 바이어스 노드 x0를 빠뜨린 답이다. 바이어스가 없으면 결정 경계가 늘 원점을 지나야 해서 AND·OR 같은 게이트를 표현할 수 없다.","5-22":"핵심 · 출력 노드는 가중합에 활성화 함수를 적용한 결과, 즉 퍼셉트론의 최종 출력 ŷ을 내는 노드다. 학습할 때는 이 ŷ과 정답 y의 차이가 손실이 되어 가중치 갱신의 근거가 된다.\n함정 · 2번처럼 가중치는 노드가 아니라 에지에 붙는다. 3번의 학습률 α는 사람이 정하는 하이퍼파라미터이고, 1번처럼 입력을 되돌려 주는 노드는 없다.","5-23":"핵심 · 입력 노드 하나는 특징 벡터의 성분 하나다. 성분이 d개면 입력 노드도 d개(바이어스를 넣으면 d+1개)이며, 샘플 개수 N과는 관계없다. 샘플은 같은 입력 노드들에 차례로 들어간다.\n함정 · 1번은 샘플 수 N을 노드 수로 착각했고, 3번은 벡터 전체를 노드 하나로 봤다. 2번 클래스 레이블은 입력이 아니라 정답 y다.","5-24":"핵심 · 바이어스를 포함한 가중합은 z = wᵀx = w0x0 + w1x1 + w2x2이고, x0=1이므로 z = w0 + w1x1 + w2x2가 된다. 성분별로 가중치를 곱해 더하고 상수항 w0을 붙이는 꼴이다.\n함정 · 2번은 바이어스 w0이 빠졌다. 1번의 (w1+w2)(x1+x2)는 교차항 w1x2가 생겨 가중합이 아니다.","5-25":"핵심 · 노드·에지·가중치·바이어스·입력층·출력층 같은 용어는 다층 퍼셉트론과 그 이후의 신경망에서도 그대로 쓰인다. 단층 그림을 정확히 읽어야 은닉층이 추가된 구조도 해석할 수 있다.\n함정 · 1·2·4번은 그림을 학습률, 데이터 수, 손실 함수와 억지로 연결했다. 그림은 모델의 구조를 나타낼 뿐이다.","5-26":"핵심 · wk는 k번째 가중치이며 특징 성분 xk와 짝을 이루어 wkxk로 곱해진다. 첨자 k가 같아야 짝이므로, w0는 바이어스 노드 x0=1과, w1은 x1과 연결된다.\n함정 · 1번 목표값은 yi, 2번 활성화 출력은 ŷ으로 표기한다. 3번의 손실값은 L(w)로 따로 쓴다.","5-27":"핵심 · 퍼셉트론의 입력은 개체를 관측한 값인 특징 벡터 x이고, 출력은 풀어야 할 임무(분류 레이블이나 회귀값)에 해당하는 값이다. 입력은 관측, 출력은 목표라는 구분을 기억하면 된다.\n함정 · 1번은 출력의 정의다. 3번의 활성화 함수를 통과한 값도 출력 ŷ이며, 4번의 편미분은 학습 단계의 양이다.","5-28":"핵심 · 퍼셉트론의 내부 동작은 두 단계다. 먼저 성분의 가중합 z=wᵀx를 구하고, 그 결과를 활성화 함수 f에 통과시켜 ŷ=f(z)를 결정한다. 이 순서가 그대로 순전파다.\n함정 · 1번은 가중치를 곱하지 않고 더했다. 3번 최댓값과 4번 평균은 퍼셉트론 연산이 아니며, 어느 보기에도 활성화 단계가 없다.","5-29":"핵심 · 바이어스를 가중치처럼 다루기 위해 특징 벡터 맨 앞에 1을 붙여 x=[1 x1 … xd]ᵀ로 만든다. 그러면 z=Σ(k=0..d) wkxk 하나로 상수항까지 표현되고, w0도 다른 가중치와 같은 갱신식으로 학습된다.\n함정 · 4번처럼 0을 붙이면 w0가 곱해져도 사라진다. 2번은 위치와 값을 모두 잘못 썼다.","5-30":"핵심 · 교안의 활성화 함수 예는 부호(sgn), 계단(step), 시그모이드, 항등 함수 네 가지다. 이진 출력이 필요하면 부호·계단, 확률이 필요하면 시그모이드, 실수 회귀면 항등 함수를 쓴다.\n함정 · 2·3·4번은 모두 교안에 나온다. 1번 소프트맥스는 다중 클래스 출력에 쓰는 함수로, 이번 교안의 예에는 없다.","5-31":"핵심 · 부호 함수는 z의 부호만 남긴다. 양수면 1, 0이면 0, 음수면 −1이다. 출력이 {−1, +1}이므로 Rosenblatt 퍼셉트론처럼 레이블을 ±1로 두는 학습 규칙과 함께 쓰인다.\n함정 · 3번은 계단 함수와 혼동한 정의이고, 4번은 z=0에서 0을 낸다는 점을 놓쳤다. 1번은 음수 출력이 −1이 아니라 0이라 틀렸다.","5-32":"핵심 · 계단 함수는 z≥0이면 1, z<0이면 0이다. 출력이 {0, 1}이므로 논리 게이트처럼 참·거짓을 1·0으로 내는 데 쓰고, z=0인 경계에서 1을 준다는 점이 정의의 일부다.\n함정 · 2번은 z=0을 0으로 보냈다. 4번은 음수에서 −1을 내는 부호 함수 쪽 정의이고, 1번의 0.5는 교안 정의에 없다.","5-33":"핵심 · 부호 함수와 계단 함수의 차이는 두 곳에서 드러난다. 음수 입력에서 sgn은 −1, step은 0을 내고, z=0에서는 sgn이 0, step이 1을 낸다. 출력 집합이 {−1,0,1}과 {0,1}로 다르다.\n함정 · 2번은 z=0의 값을 서로 바꿔 썼다. 1번처럼 둘 다 z=0에서 불연속이라 미분할 수 없고, 4번 (0,1) 범위는 시그모이드다.","5-34":"핵심 · 시그모이드 σ(z)=1/(1+e^(−z))는 실수 전체를 (0,1)로 눌러 확률로 해석할 수 있게 한다. σ(0)=0.5이고 z가 크면 1, 작으면 0에 가깝다. 미분은 σ(1−σ)로 간단하다.\n함정 · 4번 max(0,z)는 ReLU다. 2번은 분모 부호가 틀려 범위가 (0,1)을 벗어나고, 3번은 시그모이드 꼴이 아니다.","5-35":"핵심 · 항등 함수 f(z)=z는 가중합을 그대로 출력한다. 출력 범위에 제한이 없어 실수 목표값을 맞히는 회귀에 맞고, 항등 함수와 MSE를 함께 쓰면 선형 회귀가 된다.\n함정 · 2·4번은 상수 함수이고, 3번 |z|는 절댓값 함수다. '항등'은 입력과 출력이 같다는 뜻이다.","5-36":"핵심 · 퍼셉트론 동작 예제는 두 단계로 진행된다. (1) 바이어스 x0=1을 포함한 가중합 z=wᵀx를 계산하고, (2) z를 활성화 함수(예제에서는 시그모이드)에 통과시켜 ŷ을 낸다. 이것이 순전파다.\n함정 · 2번은 순서를 뒤집었다. 4번의 손실 계산과 갱신은 순전파 뒤의 학습 단계이고, 1번은 동작 과정이 아니다.","5-37":"핵심 · i번째 샘플을 밝혀 쓸 때는 xi=[1 xi1 … xid]ᵀ에 대해 zi = wᵀxi = w0 + w1xi1 + … + wdxid로 적는다. 가중치 w는 모든 샘플이 공유하고, 샘플마다 달라지는 것은 입력 xi다.\n함정 · 2번 yi−ŷi는 오차, 3번은 갱신량이다. 1번 xᵀxi에는 가중치가 없다.","5-38":"핵심 · 순전파는 입력 특징 벡터가 가중합과 활성화를 거쳐 출력 ŷ으로 바뀌는 과정이다. 정보가 입력에서 출력 쪽으로 한 방향으로 흐른다. 학습은 이 ŷ과 정답을 비교한 뒤 가중치를 고치는 별도 단계다.\n함정 · 3번은 역전파, 1번은 기울기 계산으로 둘 다 학습 단계다. 2번 셔플은 데이터 전처리에 속한다.","5-39":"핵심 · 순전파의 일반식은 ŷ = f(wᵀx) = f(Σ(k=0..d) wkxk)다. 활성화 f는 가중합 전체에 한 번 씌우며, k=0부터 더하므로 바이어스 항이 함께 들어간다.\n함정 · 1번은 f를 가중치마다 따로 씌웠다. 2번은 w와 x를 곱하지 않았고, 3번은 곱 대신 빼기를 썼다.","5-40":"핵심 · 활성화가 시그모이드면 ŷ=σ(wᵀx)=1/(1+exp(−wᵀx))다. 출력이 (0,1) 사이 값이므로 P(C1|x)로 읽을 수 있고, 이는 로지스틱 회귀와 같은 식이다.\n함정 · 3번은 항등 함수를 썼을 때의 출력이다. 1번 e^(−z)/(1+e^(−z))는 1−σ(z)로 C2의 확률에 해당한다.","5-41":"핵심 · 'Σwkxk > θ이면 1'인 임계값 조건은 Σwkxk − θ > 0으로 옮겨 쓸 수 있다. 따라서 바이어스 가중치는 w0 = −θ가 된다. 임계값을 이항하면 부호가 바뀐다는 점이 핵심이다.\n함정 · 1번 0.5는 이항하면서 부호를 바꾸지 않은 답이다. 2번 1.7은 x3의 계수를 바이어스로 착각했다.","5-42":"핵심 · 조건식의 각 계수가 곧 그 입력의 가중치다. x3의 계수가 −1.7이므로 w3=−1.7이고, 출력이 1 아니면 0이므로 계단 함수를 쓴다. 출력이 ±1이었다면 부호 함수를 골라야 한다.\n함정 · 3번은 부호를 빠뜨렸고 시그모이드는 0/1이 아닌 실수를 낸다. 2번 −0.5는 w0의 값이다.","5-43":"핵심 · 퍼셉트론에서 학습되는 것은 가중치 w0, w1, …, wd뿐이다. 바이어스 w0도 x0=1 덕분에 다른 가중치와 똑같이 학습된다. 활성화 함수는 설계 단계에서 사람이 고른다.\n함정 · 1번 활성화 함수는 미리 정하는 설계 요소다. 2번 입력과 4번 데이터 수는 주어진 값이지 학습 대상이 아니다.","5-44":"핵심 · 가중치 갱신은 두 단계다. 1단계에서 정해진 구간의 임의의 수로 가중치를 초기화하고, 2단계에서 손실의 기울기를 이용해 각 가중치를 반복해서 갱신한다.\n함정 · 2번처럼 이차 미분은 쓰지 않는다. 경사하강법은 일차 미분만 쓴다. 3·4번은 절차에 없는 단계다.","5-45":"핵심 · 경사하강법 갱신식 wk ← wk − α·∂L/∂wk는 손실이 줄어드는 방향, 즉 기울기의 반대 방향으로 학습률 α만큼 이동한다. 기울기가 양수면 wk를 줄이고 음수면 늘린다.\n함정 · 4번은 기울기가 아니라 손실 값 자체를 더했다. 2번은 곱셈, 3번은 α를 엉뚱한 항에 곱했다. 빼기와 기울기를 꼭 기억한다.","5-46":"핵심 · 학습률 α는 한 번에 얼마나 이동할지를 정하며, 교안은 0 < α < 1로 둔다. 너무 크면 최솟값을 지나쳐 발산할 수 있고, 너무 작으면 수렴이 느리다.\n함정 · 3번처럼 음수면 기울기 방향으로 올라가 손실이 커진다. 1번 α>1은 교안의 범위를 벗어나며, 4번은 상한과 0 제외 조건을 무시했다.","5-47":"핵심 · L(w)는 예측과 정답의 차이를 수치로 나타낸 손실 함수이며, 학습의 목표는 이를 최소화하는 것이다. 그래서 갱신식에서 기울기를 빼 손실이 줄어드는 쪽으로 이동한다.\n함정 · 3번처럼 최대화하는 보상이라면 기울기를 더해야 한다. 1번 정규화 항은 손실에 덧붙이는 일부일 뿐이고, 2번 분산과는 무관하다.","5-48":"핵심 · 이진 분류 예제는 시그모이드 활성화와 교차 엔트로피 손실을 짝지었다. 시그모이드가 확률 ŷ을 내면 CE가 정답 확률의 로그값으로 오차를 재며, 이 조합이 곧 로지스틱 회귀다.\n함정 · 4번 항등+MSE는 회귀 예제의 조합이다. 2·3번의 계단·부호 함수는 미분이 0이거나 정의되지 않아 경사하강법을 쓸 수 없다.","5-49":"핵심 · 이진 교차 엔트로피는 L(w) = −(1/N)Σ{yi ln ŷi + (1−yi) ln(1−ŷi)}, ŷi=σ(wᵀxi)다. yi=1이면 ln ŷi만, yi=0이면 ln(1−ŷi)만 남아 정답 확률이 작을수록 손실이 커진다.\n함정 · 3번은 MSE, 4번은 MAE다. 2번은 정답 yi가 없어 손실이 될 수 없다.","5-50":"핵심 · 편미분의 구체적인 꼴은 활성화 함수와 손실 함수의 조합에 따라 달라진다. 시그모이드+CE는 −(1/N)Σ(y−ŷ)x, 항등+MSE는 (2/N)Σ(ŷ−y)x로 상수와 부호는 다르지만 둘 다 '오차×입력' 꼴이다.\n함정 · 1번은 형태가 언제나 같다고 했지만 상수·부호가 다르다. 4번의 학습률은 기울기를 구한 뒤에 곱하는 값이다.","5-51":"핵심 · 시그모이드의 미분은 σ'(x)=σ(x)(1−σ(x))로, 자기 자신으로 표현된다. 교차 엔트로피를 미분할 때 이 인수가 분모와 상쇄되어 기울기가 (y−ŷ)x라는 간단한 꼴로 정리된다.\n함정 · 2번 1−σ²는 tanh의 미분 꼴과 혼동한 것이다. 4번처럼 미분이 자기 자신인 함수는 e^x다.","5-52":"핵심 · CE를 wk로 미분하면 σ'=σ(1−σ)가 상쇄되어 ∂L/∂wk = −(1/N)Σ(yi−ŷi)xik가 된다. w0는 짝이 되는 입력이 x0=1이라 xik 자리에 1이 들어가 −(1/N)Σ(yi−σ(wᵀxi))만 남는다.\n함정 · 2번은 x_i1이 곱해진 w1용 식이고 부호도 틀렸다. 3번 (2/N)Σ(ŷ−y)는 MSE 회귀의 w0 기울기다.","5-53":"핵심 · 기울기 ∂L/∂w1 = −(1/N)Σ(yi−ŷi)xi1에 −α를 곱하면 음수끼리 만나 덧셈이 된다. 그래서 w1 ← w1 + (α/N)Σ(yi−σ(wᵀxi))xi1이다. 예측이 정답보다 작으면 w1이 xi1 방향으로 커진다.\n함정 · 4번은 기울기의 음수 부호를 반영하지 않았다. 2번 (2α/N)(ŷ−y)는 MSE 회귀식에서 부호까지 섞은 오답이다.","5-54":"핵심 · 회귀 예제는 출력이 실수이므로 항등 함수 ŷ=wᵀx를 쓰고, 손실로 MSE를 쓴다. 이 조합이 곧 선형 회귀다. 확률 출력이 필요한 분류는 시그모이드+CE와 짝을 이룬다.\n함정 · 3번 시그모이드는 출력을 (0,1)로 제한해 일반 실수를 맞힐 수 없다. 1·4번의 CE는 확률 출력용 손실이다.","5-55":"핵심 · MSE는 L(w) = (1/N)Σ(ŷi−yi)²로, 오차를 제곱해 평균한다. 제곱 때문에 큰 오차에 더 무거운 벌점이 붙고, 미분하면 2(ŷ−y)가 나와 갱신식에 2/N이 생긴다.\n함정 · 2번은 절댓값을 쓰는 MAE다. 3번은 1/N로 나누지 않은 SSE, 1번 1/2은 교안의 정의가 아니다.","5-56":"핵심 · MSE를 w0로 미분하면 ∂L/∂w0 = (2/N)Σ(ŷi−yi)·1이다(x0=1). 이를 빼 주면 w0 ← w0 − (2α/N)Σ(ŷi−yi)가 된다. 예측이 크면 w0를 줄이는, 오차를 줄이는 방향이다.\n함정 · 3번은 x_i1이 곱해진 w1용 식이다. 4번은 부호를 +로 바꿔 손실을 키우는 쪽으로 움직이며, 2번은 2가 빠지고 오차 순서도 틀렸다.","5-57":"핵심 · 배치 모드는 전체 N개 샘플의 오차를 모두 계산해 합(평균)한 뒤 가중치를 한 번 갱신한다. 기울기가 안정적이지만, 데이터가 크면 한 번 갱신하는 데 드는 계산이 많다.\n함정 · 1번은 샘플 하나마다 갱신하는 온라인(확률적) 방식이다. 3번의 학습률 스케줄은 갱신 단위와 별개 문제다.","5-58":"핵심 · 온라인 모드는 특징 벡터 하나를 볼 때마다 그 샘플의 오차로 즉시 갱신한다. 갱신이 자주 일어나 빠르게 반응하지만 기울기에 잡음이 많다. Rosenblatt 퍼셉트론 규칙이 이 방식을 쓴다.\n함정 · 4번은 오히려 배치 쪽 설명에 가깝다. 2·3번처럼 갱신하지 않거나 손실 없이 갱신하면 학습이라 할 수 없다.","5-59":"핵심 · AND·OR·XOR 게이트는 두 성분 [x1, x2]를 입력받아 값 하나를 내는 함수다. 그래서 퍼셉트론으로는 입력 노드 2개에 바이어스 1개, 출력 노드 1개인 구조로 표현한다.\n함정 · 1번처럼 입력이 3개인 게이트는 다루지 않았다. 2·3번처럼 출력이 둘인 것도 아니다. 바이어스 노드는 입력 성분 수에 들어가지 않는다.","5-60":"핵심 · 논리값은 원래 불린 값이지만 퍼셉트론 계산을 위해 True=1, False=0으로 둔다. 다만 Rosenblatt 학습 규칙은 레이블을 ±1로 가정하므로 학습할 때는 0을 −1로 바꿔야 한다.\n함정 · 1번 ±1은 학습 레이블 표현이지 교안의 입출력 표현이 아니다. 3번은 값을 반대로 뒀고, 2번의 확률값은 시그모이드 출력이다.","5-61":"핵심 · (1,0)처럼 입력이 하나만 1일 때 AND는 둘 다 1이 아니라 0, OR은 하나라도 1이라 1, XOR은 서로 달라서 1이다. XOR은 '두 입력이 다를 때만 1'로 기억하면 된다.\n함정 · 1번은 AND를 1로 봤다. 2번은 OR을 0으로, 4번은 AND와 OR을 뒤바꿨다.","5-62":"핵심 · XOR은 두 입력이 다를 때만 1이므로 (0,0)과 (1,1)은 0, (0,1)과 (1,0)은 1이다. 같은 출력이 대각선에 놓여 있어 직선 하나로 나눌 수 없다.\n함정 · 4번 1은 OR과 혼동한 답이다. 1번 −1은 이번 진리표에 쓰지 않는 값이고, 출력이 0으로 분명히 정의되어 있어 2번도 틀렸다.","5-63":"핵심 · AND는 두 입력이 모두 1일 때만 z>0이 되어야 한다. w1=w2=1, w0=−1.5면 합이 2일 때만 0.5로 양수가 되고 합이 1 이하면 음수가 된다. 바이어스가 임계값 역할을 한다.\n함정 · 1번 w0=−0.5는 하나만 1이어도 통과시키는 OR이다. 4번 w0=0은 (0,0)에서 z=0이라 계단 함수로 1이 나올 수 있다.","5-64":"핵심 · OR은 하나만 1이어도 z>0이 되어야 하므로 z = x1 + x2 − 0.5다. 합이 0일 때만 −0.5로 음수가 된다. AND와 가중치는 같고 바이어스만 다르다(−1.5 대 −0.5).\n함정 · 4번 −1.5는 AND의 식이다. 3번은 곱 x1x2를 써서 가중합이 아니며, 1번은 x2의 부호가 틀렸다.","5-65":"핵심 · z = 1 + 1 − 1.5 = 0.5로 양수이므로 출력은 1이다. AND 퍼셉트론에서 z가 양수가 되는 입력은 (1,1)뿐이고, 나머지는 −1.5 또는 −0.5로 음수라 0이 된다.\n함정 · 3번 −0.5는 입력 하나만 1일 때의 값이다. 1·2번은 바이어스를 더하거나 빼는 계산을 틀렸다.","5-66":"핵심 · z = x1 + x2 − 0.5에 넣으면 (0,0)은 −0.5, (0,1)과 (1,0)은 0.5, (1,1)은 1.5다. 첫 입력만 음수라 출력이 0, 1, 1, 1이 되어 OR의 진리표와 일치한다.\n함정 · 3번은 (0,1)의 값을 −0.5로 잘못 계산했다. 4번은 AND 식 z = x1 + x2 − 1.5의 값이고, 2번은 바이어스 부호를 뒤집었다.","5-67":"핵심 · σ(z)는 z=0일 때 정확히 1/2이고 단조 증가하므로 'z>0'과 'σ(z)>1/2'는 같은 조건이다. 결국 시그모이드를 써도 판정은 가중합의 부호로 결정되고, 경계는 z=0인 직선이다.\n함정 · 2번은 반대 조건으로 출력 0에 해당한다. 1번 σ(z)<0은 시그모이드 값이 항상 양수라 일어나지 않는다.","5-68":"핵심 · z = w0 + w1x1 + w2x2 = 0은 (x1, x2) 평면 위의 직선이다. 이 직선을 기준으로 z>0인 쪽은 1, z<0인 쪽은 0으로 나뉘므로 퍼셉트론의 결정 경계가 된다. 선형 분류기라 부르는 까닭이다.\n함정 · 4번 손실 최소점은 가중치 공간에서 말하는 개념으로, 입력 공간의 경계와 다르다. 1·2번은 z=0과 무관하다.","5-69":"핵심 · 단일 퍼셉트론의 결정 경계는 z=0인 직선 하나뿐이다. XOR은 (0,1)·(1,0)과 (0,0)·(1,1)이 대각선으로 엇갈려 있어 두 개의 구분선이 있어야 나뉜다. 선형 분리가 불가능하다는 뜻이다.\n함정 · 1번 활성화 함수는 XOR에서도 쓸 수 있고, 2번 XOR도 입력은 2개다. 4번처럼 XOR도 불린 값을 다룬다.","5-70":"핵심 · 직선 하나로 풀리지 않는 XOR은 퍼셉트론 여러 개를 층으로 쌓아 해결한다. 은닉층이 입력을 직선으로 나눌 수 있는 새 좌표로 옮기면 출력층 퍼셉트론 하나로 분류된다. 은닉층 하나면 충분하다.\n함정 · 2번처럼 활성화를 바꿔도 경계는 여전히 직선이고, 3번의 학습률은 표현력과 관계없다. 1번 차원 축소로는 대각선 배치가 풀리지 않는다.","5-71":"핵심 · LLM은 대규모 텍스트로 학습해 요약, 번역, 질의응답 같은 다양한 언어 작업을 하는 모델이다. 근본 원리는 앞 문맥을 보고 다음에 올 단어의 확률을 예측하는 것이다.\n함정 · 1번은 CNN 이미지 모델, 3번은 음성 신호 처리다. 2번과 달리 LLM은 규칙이 아니라 방대한 데이터에서 통계적 패턴을 배운다.","5-72":"핵심 · LLM은 문맥 '오늘 날씨가 정말' 뒤에 올 후보(맑다, 덥다, 좋다 등)의 확률을 계산해 가장 높은 단어를 고른다. 교안 예시에서는 '좋다'가 선택되어 '오늘 날씨가 정말 좋다'가 된다.\n함정 · 1·2번도 후보이긴 하지만 가장 확률이 높은 단어는 아니다. 4번 '왔다'는 정답이 아니어서 파라미터 수정을 일으키는 예다.","5-73":"핵심 · LLM은 문맥을 분석해 다음 단어 후보마다 확률을 매기고, 그중 가장 높은 확률의 단어를 출력한다. 학습이란 이 확률 분포가 실제 텍스트의 다음 단어를 높게 평가하도록 조정하는 일이다.\n함정 · 1번 철자 유사성이나 2번 빈도 반복은 문맥을 보지 않는다. 4번 완전 무작위 선택은 교안 예시의 기준이 아니다.","5-74":"핵심 · LLM도 입력과 정답의 쌍으로 학습한다. 예측한 다음 단어가 정답과 다르면 오차를 계산해 내부 파라미터를 수정한다. 퍼셉트론이 오차로 가중치를 갱신하는 것과 같은 원리다.\n함정 · 2번처럼 데이터를 지우지 않으며, 3번처럼 학습 중에 파라미터가 고정되어 있지도 않다. 4번 무작위 초기화는 학습 시작 때만 한다.","5-75":"핵심 · 그림 4-3의 메시지는 LLM도 입력과 정답(라벨)으로 학습된다는 것이다. 지도 학습과 같은 틀이지만, 정답이 텍스트의 다음 단어라서 따로 사람이 라벨을 붙일 필요가 없다.\n함정 · 2번 규칙 기반과 4번 사전만으로 만드는 방식은 학습이 아니다. 3번처럼 데이터를 저장해 두었다 검색하는 것은 RAG에 가까운 별개 개념이다.","5-76":"핵심 · LLM은 다음 단어 후보 각각에 확률을 부여한다. 교안 예시는 toast 0.30, bagel 0.20, hamburger 0.10, sandwich 0.10이며, 가장 높은 toast를 고른다. 학습은 정답 단어의 확률을 높이도록 진행된다.\n함정 · 1번은 확률이 모두 같아 고를 근거가 없다. 2·4번은 교안에 나온 수치가 아니다.","5-77":"핵심 · 예측 단어가 정답과 다르면 그 오차를 근거로 LLM 내부 파라미터를 수정한다. 같은 문맥에서 정답 단어의 확률이 오르도록 가중치를 조정하는 것으로, 손실을 줄이는 경사하강과 같은 원리다.\n함정 · 2번처럼 출력만 버리면 아무것도 배우지 못한다. 1번 입력 교정이나 3번 데이터 폐기는 학습 과정에 없다.","5-78":"핵심 · LLM 학습 데이터는 문장 앞부분을 입력, 바로 다음 단어를 정답으로 두는 쌍으로 만든다. 'My favorite breakfast is'→toast, '…is toast'→with처럼 문맥을 한 단어씩 늘려 가며 쌓는다.\n함정 · 1번처럼 문장 전체를 출력으로 두지 않는다. 4번과 달리 정답이 텍스트 안에 이미 있어 사람의 라벨링이 필요 없다.","5-79":"핵심 · LLM은 예측을 정답과 비교해 오차를 구하고, 오차 역전파로 각 파라미터의 기울기를 계산해 갱신한다. 퍼셉트론의 경사하강 갱신을 여러 층으로 확장한 것이 역전파다.\n함정 · 1번 가지치기는 결정 트리, 3번 유전 알고리즘은 진화 계산, 4번 최근접 이웃은 학습이 필요 없는 방식이라 LLM 학습과 무관하다.","5-80":"핵심 · 그림 4-5는 많은 텍스트 데이터로 LLM을 훈련하는 장면을 교사와 챗봇의 문답으로 비유했다. 문제(문맥)를 내고 답(다음 단어)을 맞히게 한 뒤 틀리면 고치는 과정을 반복한다는 뜻이다.\n함정 · 1번은 비유를 거꾸로 읽었다. 배우는 쪽이 챗봇이다. 3번 검색 호출은 RAG·도구 사용, 4번은 멀티모달 모델의 이야기다.","5-81":"핵심 · 수많은 텍스트로 사전 학습해 얻은 범용 모델을 파운데이션 모델이라 한다. 여기에 라벨이 붙은 소규모 데이터로 미세조정을 하면 특정 작업에 맞춘 모델이 된다. 순서는 사전학습 → 파운데이션 → 미세조정이다.\n함정 · 2번 미세조정된 모델은 그다음 단계의 결과물이다. 4번 보상 모델은 RLHF에서, 1번 검색기는 RAG에서 쓴다.","5-82":"핵심 · 입출력 표는 문맥을 한 단어씩 늘려 가며 바로 다음 단어를 정답으로 둔다. 'My favorite breakfast is'의 정답이 toast였으므로, toast까지 붙은 문맥의 정답은 그 다음 단어 with다.\n함정 · 4번 toast는 한 단계 앞 입력의 정답이다. 1·2번은 표에 나온 다음 단어가 아니다.","5-83":"핵심 · 그림 4-8은 여러 LLM을 원으로 나타냈고, 원의 크기는 파라미터 수에 비례한다. 파라미터는 학습되는 가중치의 총수이며, 퍼셉트론의 w가 수십억~수천억 개로 늘어난 것이다.\n함정 · 1번 정확도와 4번 학습 시간은 그림이 나타내는 양이 아니다. 3번 언어 수와도 관계없다.","5-84":"핵심 · LLM 사전 학습에는 라벨이 없는 대규모 텍스트를 쓴다. 텍스트 자체에서 '문맥→다음 단어' 쌍이 만들어지므로 사람이 정답을 달 필요가 없고, 그 결과가 파운데이션 모델이다.\n함정 · 3번 소수의 규칙은 기호주의 접근이고, 4번 이미지 데이터는 LLM의 훈련 자료가 아니다. 1번 클릭 로그도 교안에 없다.","5-85":"핵심 · 다음 단어 맞히기는 텍스트의 다음 단어가 곧 정답이 되므로 라벨 없이도 학습 쌍을 대량으로 만들 수 있다. 덕분에 사전 학습을 거대한 무라벨 데이터로 진행할 수 있다(자기지도 학습).\n함정 · 1번과 달리 파라미터 수는 오히려 매우 크다. 3번처럼 역전파가 필요 없어지지 않으며, 4번 환각은 이 방식에서도 생긴다.","5-86":"핵심 · 사전 학습은 라벨 없는 대규모 텍스트로 일반적인 언어 패턴을 배우고, 미세 조정은 라벨이 붙은 소규모 데이터로 특정 작업에 맞춘다. '대규모·무라벨 → 소규모·라벨'의 순서와 대비가 핵심이다.\n함정 · 2번은 두 단계의 데이터 성격을 맞바꿨다. 3·4번은 두 단계가 라벨 유무와 규모에서 다르다는 점을 지웠다.","5-87":"핵심 · 흐름은 대규모 텍스트 → 사전 학습 → 파운데이션 모델 → 미세 조정 → 미세조정된 모델이다. 파운데이션 모델은 범용 출발점이고, 미세 조정을 거치면 특정 용도에 맞춘 LLM이 된다.\n함정 · 4번 사전학습된 LLM은 파운데이션 모델 자체다. 1번 보상 모델은 RLHF의 구성 요소이고, 3번 검색기는 RAG의 부품이다.","5-88":"핵심 · ChatGPT는 대규모 텍스트로 사전학습해 텍스트 패턴을 익히고, 명령어 튜닝으로 지시에 응답하는 법을 배워 챗봇이 된다. 데이터 → 사전학습 → 명령어 튜닝 → 챗봇 순서다.\n함정 · 3번은 명령어 튜닝을 사전학습보다 앞에 두었다. 1·4번은 데이터와 학습 단계의 순서를 뒤섞었다.","5-89":"핵심 · 사전학습은 대량의 텍스트에서 다음 단어 예측으로 텍스트 패턴(언어 지식)을 익히는 단계이고, 명령어 튜닝은 '지시→응답' 쌍으로 명령에 맞게 답하는 능력을 익히는 단계다. 아는 것과 따르는 것을 나눠 배운다.\n함정 · 2번은 두 능력을 맞바꿨다. 1번 출처 검증·지식 근거화는 환각 대책, 4번 보상 예측은 RLHF의 몫이다.","5-90":"핵심 · 명령어 튜닝 데이터는 '지시문 → 바람직한 응답' 쌍이다. 교안 예시는 텍스트 요약, 리뷰 평가, 한국의 수도 질문처럼 모두 텍스트 기반 언어 작업이다.\n함정 · 2·3·4번은 교안에 있는 예시다. 1번 이미지 분류는 텍스트 언어 모델의 명령어 튜닝 예로 나오지 않는다.","5-91":"핵심 · 명령어 튜닝은 다양한 지시 유형에 응답하는 법을 일반화해야 하므로 '지시-응답' 샘플이 많이 필요하다. 사전학습보다는 작지만 라벨이 붙은 데이터를 상당량 준비해야 한다.\n함정 · 4번처럼 한 개의 예시로는 일반화되지 않는다. 3번처럼 라벨이 없어도 되는 것은 사전학습이고, 1번 강화 학습은 RLHF 단계의 방법이다.","5-92":"핵심 · RLHF는 초기 모델 생성 → 초기 답변 데이터 생성 → 인간 피드백 제공 → 보상 모델 학습 → 강화 학습 적용 순서다. 사람의 평가를 보상 모델로 학습해 두고, 그 보상을 최대화하도록 모델을 강화 학습으로 다듬는다.\n함정 · 2·3번은 인간 피드백이나 보상 모델을 초기 모델보다 앞에 두었다. 평가할 답변이 먼저 있어야 피드백을 줄 수 있다.","5-93":"핵심 · 사람이 답변을 평가해 피드백을 주면, 그 평가를 흉내 내는 보상 모델을 학습한다. 보상 모델이 있어야 사람이 매번 개입하지 않고도 강화 학습에서 답변마다 보상을 매길 수 있다.\n함정 · 4번 강화 학습은 보상 모델이 만들어진 뒤의 마지막 단계다. 1·3번은 인간 피드백보다 앞에 오는 단계다.","5-94":"핵심 · 환각은 LLM이 사실이 아닌 내용을 그럴듯하게 지어내는 현상이다. 알렉산더 대왕이 미국으로 탐험을 떠났다는 답은 전제부터 틀린 질문에 허구를 덧붙인 대표 사례다. 다음 단어를 확률로 고르는 구조라 생긴다.\n함정 · 1번은 사실인 답이고, 3·4번은 학습 원리를 설명하는 예시로 쓰인 문장이다.","5-95":"핵심 · 교안은 환각을 세 유형으로 나눈다. 사실을 틀리게 말하는 사실 왜곡, 없는 것을 지어내는 허구의 창조, 잘못된 근거로 결론을 내는 오류로 인한 추론이다.\n함정 · 1·2·4번은 교안의 세 유형이다. 3번 결측은 데이터 전처리 용어로, 모델 출력의 환각 유형이 아니다.","5-96":"핵심 · 환각 대책으로는 RLHF(사람 피드백), Knowledge Grounding(외부 지식에 근거), 모델 업데이트, 출처 검증이 제시된다. 모두 답이 사실과 근거에 맞도록 하는 방법이며, RAG가 그 구체적인 예다.\n함정 · 1·2·3번은 교안에 있는 대책이다. 4번 학습률 감소는 최적화 설정일 뿐 사실성 문제를 직접 다루지 않는다.","5-97":"핵심 · RAG는 '검색 후 생성'이다. 질문이 들어오면 검색기가 지식 베이스에서 관련 문서를 찾고, 질문과 문서를 함께 LLM 생성기에 넣어 출처가 분명한 답을 만든다. 외부 지식에 근거를 두어 환각을 줄인다.\n함정 · 1번은 생성과 검색의 순서가 거꾸로다. 2번은 RLHF, 3번은 학습 단계의 흐름이다.","5-98":"핵심 · AI 에이전트는 LLM이 지시하면 에이전트가 환경에 행동을 가하고, 그 수행 결과와 피드백이 다시 LLM으로 돌아오는 순환 구조다. 지각 → 추론·결정 → 행동이 반복되는 루프로 이해하면 된다.\n함정 · 1번은 순환을 끊었고, 2번은 환경이 파라미터를 돌려준다고 했다. 4번 명령어 튜닝 데이터 공급은 학습 단계의 이야기다.","5-99":"핵심 · AI 에이전트는 환경을 받아들이는 지각, 상황을 판단하는 추론 및 의사결정, 실제로 실행하는 행동의 세 요소로 이루어진다. LLM은 이 중 추론의 두뇌 역할을 맡는다.\n함정 · 2·3·4번은 교안의 구성 요소다. 1번 사전 학습은 LLM을 만드는 학습 단계이지 에이전트가 동작하는 구성 요소가 아니다.","5-100":"핵심 · 도구 호출 시스템은 입력 → LLM → 출력의 흐름에 검색, 계산기 같은 여러 도구가 연결된 구조다. LLM이 필요한 도구를 골라 호출하고 그 결과를 받아 답을 만든다. 모델 혼자 못 하는 일을 도구로 보완한다.\n함정 · 1번은 RAG 쪽 구조에 가깝다. 2번은 학습 단계, 4번은 RLHF 흐름이다.","6-1":"핵심 · 퍼셉트론은 데이터 D = {(x_i, y_i)}에서 특징 벡터 x_i를 받아 출력 ŷ_i를 계산하는 모델이다. 입력에서 출력으로 가는 한 방향 계산이고, 학습은 이 ŷ_i가 실제값 y_i에 가까워지도록 가중치를 고치는 일이다.\n함정 · 1번은 방향이 거꾸로고, 2번은 군집화, 4번은 데이터 생성 모델에 대한 설명이다.","6-2":"핵심 · 퍼셉트론의 계산은 두 단계다. 먼저 특징 성분과 가중치를 곱해 더한 가중합 z_i를 만들고, 이것을 활성화 함수 f에 넣어 ŷ_i를 얻는다. 이 '가중합 → 활성화' 순서는 MLP의 모든 노드에서 그대로 반복된다.\n함정 · 1번은 순서가 뒤집혔고, 3·4번처럼 최댓값이나 평균을 고르는 단계는 없다.","6-3":"핵심 · 바이어스는 인덱스 0번 입력 x_0으로 둔다. x_0 = 1로 고정하면 w_0·x_0 = w_0가 되어 가중합에 상수항이 붙는다. 상수항이 있어야 결정 경계가 원점을 지나지 않고 평행 이동할 수 있다.\n함정 · 1·2번은 실제 특징 성분이고, 3번 z_i는 입력 노드가 아니라 가중합 결과다.","6-4":"핵심 · x_0 = 1은 바이어스 가중치 w_0를 다른 가중치와 같은 '입력 × 가중치' 꼴로 다루기 위한 장치다. 1을 곱하면 w_0가 그대로 더해지므로 Σ_{j=0}^{d} w_j x_ij 한 식으로 상수항까지 표현된다.\n함정 · 2번 입력 정규화나 3번 기울기 조절과는 무관하고, 4번처럼 출력이 1로 고정되지도 않는다.","6-5":"핵심 · 가중합은 각 성분에 가중치를 곱한 뒤 모두 더한 값이다: z_i = w_0 + w_1x_i1 + … + w_dx_id. 맨 앞 w_0는 x_0 = 1에 곱해진 바이어스 항이다. 활성화 함수는 이 합 전체에 한 번 적용된다.\n함정 · 1번은 곱을 곱한 것이고, 3번은 f를 항마다 먼저 씌워 순서가 틀렸으며, 4번은 곱이 아니라 차이다.","6-6":"핵심 · 합을 j = 0부터 시작하는 것은 바이어스를 같은 합 안에 넣기 위해서다. j = 0 항은 w_0·x_0 = w_0가 되어 상수항 역할을 하고, j = 1…d는 실제 특징 d개에 대응한다. 그래서 입력 노드는 특징 수 + 1개가 된다.\n함정 · 1번처럼 특징을 중복해 더하는 것이 아니고, 2·4번은 인덱스와 무관한 설명이다.","6-7":"핵심 · 단층 퍼셉트론은 직선(초평면) 하나로 공간을 둘로 가른다. AND·OR·NAND는 직선 하나로 0과 1이 나뉘므로 구현되지만, XOR은 대각선 위치의 점끼리 같은 클래스라 직선 하나로는 나눌 수 없다.\n함정 · 2·3·4번처럼 XOR이 들어간 선택지는 모두 틀렸다. XOR(XNOR)은 은닉층이 있어야 구현된다.","6-8":"핵심 · AND는 두 입력이 모두 1일 때만 1이어야 하므로, 합 x_1 + x_2가 2일 때만 양수가 되도록 임계값을 1과 2 사이인 1.5로 둔다: z = x_1 + x_2 − 1.5. 합이 1 이하면 z ≤ 0이라 출력이 0이다.\n함정 · 1번 −0.5는 하나만 1이어도 통과하는 OR의 식이다.","6-9":"핵심 · OR는 입력 중 하나라도 1이면 1이어야 하므로 합이 1 이상일 때 양수가 되도록 임계값을 0과 1 사이인 0.5로 둔다: z = x_1 + x_2 − 0.5. (0,0)만 z = −0.5로 0이 된다.\n함정 · 1번 −1.5는 AND의 식이고, 3번 −1.0은 (1,0)에서 z = 0이 되어 계단 함수가 0을 내므로 OR가 되지 않는다.","6-10":"핵심 · 논리 게이트에 쓴 계단 함수는 z > 0이면 1, z ≤ 0이면 0을 낸다. 경계값 z = 0이 0 쪽에 포함된다는 점이 중요하다. 이 경계 때문에 AND·OR 식의 임계값을 1.5, 0.5처럼 정수 사이에 둔다.\n함정 · 1번은 z = 0을 1로 보내 경계가 달라지고, 2번은 출력이 뒤집혔으며, 4번은 기준이 0이 아니다.","6-11":"핵심 · 게이트 문제는 식에 입력을 대입해 z를 구하고 부호로 출력을 정하면 된다. (1,0)이면 z = 1 + 0 − 1.5 = −0.5 ≤ 0이므로 ŷ = 0이다. AND는 (1,1)에서만 z = 0.5 > 0이 되어 1을 낸다.\n함정 · 1번 0.5는 (1,1)의 값이고, 4번은 z가 음수인데 1을 냈으므로 계단 함수 정의와 모순이다.","6-12":"핵심 · OR 식 z = x_1 + x_2 − 0.5에 (0,1)을 넣으면 0.5 > 0이므로 ŷ = 1이다. OR는 (0,0)에서만 z = −0.5로 0을 내고, 나머지 세 입력은 모두 양수가 된다.\n함정 · 3번은 z가 양수인데 0을 내서 계단 함수와 맞지 않고, 2번 −0.5는 (0,0)의 값이다.","6-13":"핵심 · 신경 세포를 본뜬 단층 퍼셉트론은 경계선을 하나만 그을 수 있다. XOR은 두 개 이상의 선이나 곡선이 있어야 나뉘므로 단층으로는 풀 수 없고, 은닉층을 쌓아 경계를 여러 개 조합해야 한다.\n함정 · 1번 미분 가능성, 3번 입력 개수, 4번 바이어스는 XOR 한계의 원인이 아니다.","6-14":"핵심 · 민스키와 페퍼트는 저서 『Perceptrons』에서 단층 퍼셉트론이 XOR을 풀 수 없음을 지적했고, 동시에 층을 쌓으면 가능하다는 점도 보였다. 이 지적이 은닉층을 가진 다층 퍼셉트론으로 이어지는 출발점이다.\n함정 · 2번 로젠블랫은 퍼셉트론을 제안한 쪽이고, 3번 루멜하트 등은 이후 역전파를 보급한 연구자다.","6-15":"핵심 · XOR은 NAND와 OR의 출력 h_1, h_2를 다시 AND로 묶으면 만들어진다. NAND와 OR가 각각 직선 하나씩을 긋고, AND가 두 영역의 교집합을 고르는 셈이다. 이것이 '은닉층 = 경계선 여러 개의 조합'이라는 직관이다.\n함정 · 2번은 (0,0)에서 AND·OR가 모두 0이라 NAND가 1을 내 XOR과 어긋나고, 3·4번도 진리표가 XOR과 맞지 않는다.","6-16":"핵심 · (1,1)을 넣으면 NAND는 둘 다 1이므로 h_1 = 0, OR는 h_2 = 1이다. 이를 AND에 넣으면 0과 1이라 ŷ = 0이 되어 XOR(1,1) = 0과 일치한다. (0,1)·(1,0)에서는 h_1 = h_2 = 1이라 ŷ = 1이 된다.\n함정 · 1번은 NAND 값을 잘못 넣은 것이고, 2번은 OR(1,1)을 0으로 잘못 계산했다.","6-17":"핵심 · 퍼셉트론을 여러 개 쌓아 은닉층을 만들면 복잡한 함수를 표현할 수 있어, 직선 하나로는 나뉘지 않는 데이터를 비선형 결정 경계로 가를 수 있다. 은닉층이 늘어나는 목적은 표현력이다.\n함정 · 1번 속도, 2번 차원 축소, 4번 과적합 방지는 은닉층을 두는 이유로 자료가 든 것이 아니다.","6-18":"핵심 · 은닉층의 역할은 의사 결정 경계(Decision Boundary)를 만드는 것이다. 은닉 노드 하나하나가 경계선 하나씩을 담당하고, 이를 조합해 비선형 분리가 가능한 경계가 생긴다.\n함정 · 1번 손실 함수, 3번 혼동 행렬, 4번 학습률은 학습·평가 단계의 도구일 뿐 은닉층이 만들어 내는 것이 아니다.","6-19":"핵심 · playground.tensorflow.org는 은닉층과 노드 수를 바꿔 가며 결정 경계가 어떻게 휘는지 바로 보여 주는 실습 사이트다. 단층은 직선 경계, 은닉층을 늘릴수록 더 복잡한 곡선 경계가 생기는 것을 확인할 수 있다.\n함정 · 1번 Colab은 노트북 실행 환경이고, 2·3번은 라이브러리·대회 사이트라 결정 경계 시각화용이 아니다.","6-20":"핵심 · 다층 퍼셉트론(MLP)은 퍼셉트론 구조의 입력층과 출력층 사이에 은닉층을 하나 이상 넣은 모델이다. '다층'은 층이 쌓였다는 뜻이고, 같은 퍼셉트론을 여러 번 학습한다는 뜻이 아니다.\n함정 · 2번은 반복 학습, 3번은 활성화 함수를 뺀 선형 모델, 4번은 출력 노드 수에 관한 말이라 정의가 아니다.","6-21":"핵심 · 완전 연결 계층은 한 층의 각 노드가 인접한 층의 모든 노드와 엣지로 이어진 구조다. 그래서 층 사이 가중치는 (다음 층 노드 수) × (이전 층 노드 수 + 바이어스) 크기의 행렬로 정리된다.\n함정 · 1번 노드 수가 같을 필요는 없고, 3번처럼 층을 건너뛰지 않으며, 4번처럼 가중치를 공유하지도 않는다.","6-22":"핵심 · 순전파 네트워크는 입력층에서 출력층 방향으로 한 층씩 차례로 계산해 최종 출력을 내는 구조이고, MLP가 그 대표다. 순환 연결 없이 정보가 한 방향으로만 흐른다.\n함정 · 1번은 역전파의 설명이고, 2번은 순환 신경망(RNN), 4번은 가중치가 없는 네트워크라 MLP와 다르다.","6-23":"핵심 · 위첨자 (k)는 몇 번째 은닉층인지, 아래첨자 j는 그 층의 몇 번째 노드인지를 뜻한다. h는 활성화 함수를 통과한 출력, z는 그 직전의 가중합이다. 즉 h_j^(k) = f(z_j^(k))다.\n함정 · 3번은 z_j^(k)의 뜻이고, 2번 가중치는 w로 쓰며, 4번 샘플의 특징은 x_ij로 쓴다.","6-24":"핵심 · 노드 하나를 반으로 나눠 보면 왼쪽이 가중합 z, 오른쪽이 활성화 출력 h다. 이전 층 출력과 가중치로 z를 만든 뒤 h = f(z)를 다음 층에 넘긴다. 역전파에서도 ∂h/∂z가 이 두 값 사이의 국소 기울기다.\n함정 · 1번은 둘을 뒤바꿨고, 2번은 활성화를 거치면 값이 달라지므로 틀리며, 3번은 가중치·바이어스와 혼동했다.","6-25":"핵심 · 은닉층 1개 MLP의 순전파는 안쪽부터 읽는다. 입력 x에 W_0^T를 곱하고 bias^(0)를 더해 f_1(은닉층 활성화)에 넣고, 그 결과에 W_1^T를 곱하고 bias^(1)을 더해 f_2(출력층 활성화)에 넣는다. 행렬곱과 활성화가 번갈아 나온다.\n함정 · 1·4번은 첨자나 활성화 순서가 뒤집혔고, 3번은 출력층 활성화 f_2가 빠졌다.","6-26":"핵심 · 순전파 식은 안쪽이 앞쪽 층이다. 가장 안쪽 W_0^T x + bias^(0)가 입력층 → 은닉층 구간이고, 그 바깥 W_1^T(…) + bias^(1)이 은닉층 → 출력층 구간이다. 가중치 첨자 0, 1도 이 순서를 따른다.\n함정 · 1번은 바깥쪽 W_1 구간이고, 2·4번처럼 손실이나 역방향 계산은 순전파 식에 들어 있지 않다.","6-27":"핵심 · 층마다 활성화 함수가 다를 수 있어 번호로 구분한다. f_1은 은닉층의 활성화 함수(주로 ReLU), f_2는 출력층의 활성화 함수(분류에서 Softmax 또는 Sigmoid)다. 식에서도 f_1이 안쪽, f_2가 바깥쪽에 있다.\n함정 · 2번은 둘을 뒤바꿨고, 3번은 손실 함수와 혼동했으며, 4번 입력층에는 활성화 함수가 없다.","6-28":"핵심 · 활성화 함수는 벡터 전체를 하나로 합치지 않고 성분마다 따로 적용된다. 그래서 f_1([z_1; z_2]) = [f_1(z_1); f_1(z_2)] = [h_1; h_2]가 되어 은닉 노드 수만큼의 출력 벡터가 나온다.\n함정 · 1번은 활성화를 생략했고, 2번은 성분을 먼저 더해 버렸으며, 3번은 성분끼리 곱해 벡터가 아니게 된다.","6-29":"핵심 · 행렬-벡터 곱의 i번째 성분은 행렬 i번째 행과 벡터의 내적이다. w_ji에서 j는 도착 노드, i는 출발 입력이므로 첫 성분은 w_11x_1 + w_12x_2이고, 첫 은닉 노드의 바이어스 w_10이 더해진다.\n함정 · 1번은 열 방향으로 읽어 첨자가 뒤섞였고, 2번은 두 번째 성분, 4번은 두 번째 노드의 바이어스 w_20을 붙였다.","6-30":"핵심 · 출력층 노드도 은닉 노드와 같은 계산을 한다. 은닉 출력 h_1, h_2에 가중치 w^(1)을 곱해 더하고 바이어스 w_10^(1)을 붙인 뒤, 출력층 활성화 f_2를 씌운 값이 ŷ_1이다.\n함정 · 1번은 f_2가 빠졌고, 3번은 은닉층용 f_1을 쓰고 바이어스를 뺐으며, 4번은 입력 x와 W^(0)를 써서 은닉층 계산과 섞였다.","6-31":"핵심 · 은닉층을 늘려도 계산 방식은 같다. '이전 층 출력 × 가중치 행렬 + 바이어스 → 활성화'를 층 수만큼 반복해 합성할 뿐이라, 은닉층 1개 식을 이해하면 깊은 MLP도 같은 틀로 읽힌다.\n함정 · 2번처럼 층 수에 따라 공식이 바뀌지 않고, 3번 스칼라 곱으로 바뀌거나 4번 활성화 함수를 빼는 일도 없다.","6-32":"핵심 · k−1번째 층의 모든 노드가 k번째 층의 모든 노드와 이어진 상태를 완전 연결(Fully Connected)이라고 한다. MLP의 층은 모두 이런 완전 연결 계층이다.\n함정 · 1·4번 희소·부분 연결은 일부 노드만 이어진 구조이고, 3번 순환 연결은 출력이 다시 입력으로 돌아오는 RNN의 구조다.","6-33":"핵심 · 흑백 이미지의 픽셀은 0~255의 밝기 값이고, 값이 클수록 밝다. 그래서 0은 흑색, 255는 백색이다. 4×4 MNIST 예시는 이 16개 밝기 값을 펼쳐 특징 벡터로 쓴다.\n함정 · 1번은 흑백을 거꾸로 적었고, 4번처럼 0~1로 정규화한 값은 원본 색상 코드가 아니다.","6-34":"핵심 · MNIST는 0~9 손글씨 숫자의 흑백 이미지로, 학습용 60,000장과 테스트용 10,000장, 10개 클래스로 이루어진다. 흑백이라 픽셀마다 밝기 값 하나만 있다.\n함정 · 4번 RGB 3채널은 컬러 이미지의 구조라 MNIST와 맞지 않는다. 1~3번은 모두 MNIST의 올바른 설명이다.","6-35":"핵심 · 분류의 실제값은 원-핫 벡터로 쓴다. MNIST는 클래스가 0~9의 10개이므로 10차원 벡터가 되고, 숫자 1은 0부터 세어 두 번째 자리이므로 두 번째 성분만 1이다.\n함정 · 1번은 출력 ŷ(확률 벡터)의 형태이고, 3번은 입력 x의 형태이며, 4번 스칼라 표현은 원-핫 인코딩이 아니다.","6-36":"핵심 · MLP의 입력층은 퍼셉트론과 같다. 특징 벡터의 성분마다 노드가 하나씩 있고, 여기에 값이 1인 바이어스 노드가 하나 더 붙는다. 입력층 노드는 값을 받아 넘길 뿐 활성화를 하지 않는다.\n함정 · 2번 은닉 노드는 은닉층의 구성이고, 3번 클래스 수는 출력층의 크기이며, 4번 활성화는 은닉층부터 일어난다.","6-37":"핵심 · 입력층 노드 수 = x_i의 성분 개수 + 1(바이어스)이다. 예컨대 28×28 이미지라면 784 + 1 = 785개다. 반면 출력층 노드 수는 y_i의 성분 개수, 즉 클래스 수로 정해진다.\n함정 · 1번은 바이어스를 빠뜨렸고, 2번은 출력층의 기준이며, 4번처럼 입력과 출력 크기를 더하지 않는다.","6-38":"핵심 · MLP의 입력층은 퍼셉트론의 입력층과 똑같다. 특징 성분 노드와 바이어스 노드로 이루어지고, MLP가 퍼셉트론과 달라지는 부분은 그 뒤에 은닉층이 붙는다는 점이다.\n함정 · 1번 MLP 입력층에도 바이어스가 있고, 2번 입력층은 활성화 함수가 없으며, 3번 노드 수는 은닉층과 무관하다.","6-39":"핵심 · 은닉 노드는 이전 층 노드들의 출력(x나 h)과 엣지 가중치 w를 입력으로 받아 가중합 z를 만들고, 활성화 함수 f(z)를 출력한다. 퍼셉트론 하나와 같은 계산이 노드마다 일어난다.\n함정 · 2번은 역전파·갱신 단계, 3번은 출력층의 입출력, 4번은 순서가 거꾸로 된 오차 전달에 대한 설명이다.","6-40":"핵심 · 바이어스 노드는 입력층뿐 아니라 각 은닉층에도 하나씩(h_0 = 1) 붙는다. 그래서 다음 층으로 가는 가중합마다 상수항이 들어가고, 층 사이 가중치 행렬에 바이어스 열이 하나 더 생긴다.\n함정 · 1번 출력 노드는 은닉층에 없고, 3·4번 드롭아웃·정규화는 이번 주 MLP 구조에 들어 있지 않다.","6-41":"핵심 · 은닉층 활성화 함수로는 주로 ReLU를 쓴다. 양수 구간에서 기울기가 1이라 역전파 계산이 간단하고 기울기가 잘 전달되기 때문이다. 출력층은 목적에 맞춰 Softmax(다중)나 Sigmoid(이진)를 쓴다.\n함정 · 1번 Softmax는 출력층용이고, 3번 계단 함수는 미분이 0이라 학습에 쓰기 어려우며, 2번 Sigmoid는 이진 분류 출력층용이다.","6-42":"핵심 · ReLU는 f(z) = max(0, z)다. 양수는 그대로 통과시키고 음수는 0으로 자른다. 그래서 미분은 z > 0에서 1, z < 0에서 0이다.\n함정 · 1번은 Sigmoid, 4번은 Softmax의 식이고, 2번 min(0, z)는 양수를 0으로 자르는 반대 동작이 된다.","6-43":"핵심 · ReLU는 양수 구간에서는 항등 함수처럼 입력을 그대로 내보내고, 음수 구간에서는 0을 낸다. 출력 범위에 위쪽 제한이 없다는 점이 0~1로 눌러 주는 Sigmoid와 다르다.\n함정 · 2번은 Sigmoid의 성질이고, 3번 부호 반전이나 4번 절댓값은 음수를 0으로 만드는 ReLU와 다르다.","6-44":"핵심 · ReLU는 원소마다 max(0, z)를 계산한다. 음수 −2.0은 0, 경계값 0.0은 0, 양수 3.5는 그대로 3.5가 되어 [0, 0, 3.5]다.\n함정 · 1번은 절댓값을 취했고, 3번은 활성화를 적용하지 않았으며, 4번은 0을 1로 바꿔 ReLU 정의와 맞지 않는다.","6-45":"핵심 · 출력층 노드 수는 y_i의 성분 개수와 같고, 분류에서는 곧 클래스 수다. MNIST처럼 10개 클래스면 출력 노드가 10개이고, 각 노드가 해당 클래스의 확률을 낸다.\n함정 · 1번 은닉 노드 수는 설계자가 정하는 값이고, 2번은 입력층의 기준이며, 4번 샘플 수 N은 노드 수와 무관하다.","6-46":"핵심 · 분류 문제의 출력층에는 Softmax를 쓴다. 출력 노드의 가중합들을 0~1 사이이면서 합이 1인 확률로 바꿔 주므로, 가장 큰 확률의 클래스를 예측값으로 고를 수 있다.\n함정 · 1번 ReLU는 은닉층용이고, 2번 항등 함수는 확률을 만들지 못하며, 3번 계단 함수는 논리 게이트 예시에서만 썼다.","6-47":"핵심 · 출력층 함수는 클래스 수로 정한다. 이진 분류는 Sigmoid로 양성일 확률 하나를 내고, 다중 분류는 Softmax로 클래스별 확률을 낸다. 손실 함수도 이에 맞춰 이진은 BCE, 다중은 CCE를 쓴다.\n함정 · 1번은 둘을 뒤바꿨고, 3·4번 ReLU는 확률을 만들지 않으므로 출력층 분류 함수가 아니다.","6-48":"핵심 · 소프트맥스는 σ(z_i) = e^(z_i) / Σ_j e^(z_j)다. 지수를 취해 모두 양수로 만든 뒤 전체 합으로 나누므로 출력은 0~1이고 합이 1이다. z가 클수록 지수적으로 큰 확률을 받는다.\n함정 · 2번은 음수 z에서 확률이 음수가 될 수 있고, 3번 로그 비율은 정의가 아니며, 4번은 Sigmoid 식이다.","6-49":"핵심 · 원-핫 인코딩은 클래스 수만큼의 성분 중 정답 위치 하나만 1이고 나머지는 0인 벡터다. 클래스 번호를 크기 관계 없이 표현할 수 있고, CCE에서 정답 클래스 항만 남게 해 준다.\n함정 · 1번은 소프트맥스 출력(확률 벡터)의 모양이고, 2번 이진수 표현이나 4번 합이 0인 표준화는 원-핫이 아니다.","6-50":"핵심 · 소프트맥스 출력에서 가장 큰 확률의 위치를 1로 두고 나머지를 0으로 바꿔 예측 원-핫 벡터를 만든다. 0.8이 두 번째 성분이고 클래스가 0부터 시작하므로 숫자 1로 분류한다.\n함정 · 1번은 첫 번째(0.1), 2번은 마지막(0.07)을 고른 것이고, 3번처럼 확률이 낮다고 보류하는 규칙은 없다.","6-51":"핵심 · 소프트맥스는 순서를 보존하므로 z가 가장 큰 성분이 가장 큰 확률을 갖는다. 마지막 성분 8.2가 최대라 σ(z_10) ≈ 0.64이고, 10번째 클래스인 숫자 9로 분류된다.\n함정 · 2번은 가장 작은 성분을 골랐고, 3번처럼 값이 고르게 나오지 않으며, 4번 8.2는 확률이 아니라 z 자체다.","6-52":"핵심 · 소프트맥스 식 Σ_{j=1}^{C}에서 C는 클래스의 총 개수다. 분모가 모든 클래스의 e^(z_j)를 더하므로 C개 출력의 합이 1이 된다. 출력 노드 수도 C와 같다.\n함정 · 1번 은닉층 수, 3번 샘플 수 N, 4번 특징 차원 d는 소프트맥스 합의 범위와 무관하다.","6-53":"핵심 · MLP 학습은 학습 데이터, 손실 함수, 오차 역전파의 세 항목으로 설명된다. 데이터로 예측을 만들고, 손실로 틀린 정도를 재고, 역전파로 가중치를 고친다.\n함정 · 3번 정규화 항은 과적합을 막는 기법으로, 이번 주 학습 항목에는 포함되지 않았다.","6-54":"핵심 · 학습 데이터의 x_i는 문제를 풀기 위해 주어진 관측 값들의 특징 벡터이고, y_i는 맞혀야 할 실제값이다. 모델은 x_i를 받아 ŷ_i를 내고 이를 y_i와 비교한다.\n함정 · 2번은 ŷ_i, 3번은 역전파에서 쓰는 기울기, 4번은 소프트맥스 출력이라 x_i가 아니다.","6-55":"핵심 · 실제값이 하나의 값이면 y_i로, 클래스별 값을 모은 벡터(원-핫 등)면 볼드체 𝕪_i로 쓴다. 다중 클래스 분류의 정답이 볼드체 벡터가 되는 이유다.\n함정 · 1번 회귀처럼 실제값이 실수 하나면 일반 y_i로 쓰고, 3·4번 특징 차원이나 샘플 수는 표기와 무관하다.","6-56":"핵심 · 회귀 예시는 특정일의 코스피 지수 y_i를 PMI 지수 x_i1과 VIX 지수 x_i2로 설명한다. 맞힐 대상이 y, 설명에 쓰는 값이 x라는 구분이 핵심이다.\n함정 · 1·2번은 맞힐 대상인 코스피를 특징에 넣었고, 3번 환율은 예시에 없는 변수다.","6-57":"핵심 · 주가 예시는 300일 동안 모은 데이터라 N = 300이다. 맞힐 코스피 지수는 연속형이므로 y_i ∈ R이고, 이것이 회귀 문제가 되는 이유다. 회귀의 손실은 MSE를 쓴다.\n함정 · 1번 {0,1}은 이진 분류의 레이블이고, 4번 60,000과 원-핫은 MNIST 계열 분류의 설정이다.","6-58":"핵심 · 이미지를 MLP에 넣을 때는 픽셀을 한 줄로 펼쳐 특징 벡터로 쓴다. 그래서 특징 차원 = 가로 × 세로 픽셀 수이고, 600×800이면 480,000이다. 입력층 노드는 여기에 바이어스 하나를 더한다.\n함정 · 3번 784는 28×28의 경우이고, 4번 600은 한 변의 길이일 뿐이다.","6-59":"핵심 · 이진 분류의 실제값은 두 범주를 0과 1로 둔 레이블이다. 고양이·개 예시에서는 0이 고양이, 1이 개이고, 출력층은 Sigmoid로 개일 확률을 낸다. 손실은 BCE를 쓴다.\n함정 · 1번 실수는 회귀, 3번 10차원 원-핫은 다중 분류의 레이블이며, 4번은 클래스가 10개일 때의 표기다.","6-60":"핵심 · Fashion-MNIST 예시는 28×28 사진 60,000장, 10개 클래스로 된 다중 분류다. 픽셀을 펼치면 28 × 28 = 784차원 특징 벡터가 되고, 레이블은 10차원 원-핫 벡터다.\n함정 · 1번은 장 수와 클래스 수가 틀렸고, 2번 600×800은 고양이·개 예시, 4번 4×4는 MNIST 설명용 예시다.","6-61":"핵심 · 원-핫 벡터에서 1이 있는 위치가 클래스 번호다. 10번째 성분이 1이면 Fashion-MNIST의 레이블 10, 즉 Ankle boot다. 순서는 1번째 T-shirt/top부터 차례로 매겨진다.\n함정 · 1번 T-shirt/top은 첫 번째 성분이 1일 때이고, 2·3번은 마지막 직전 순번의 클래스다.","6-62":"핵심 · 손실 함수는 모델의 예측값 ŷ과 실제값 y의 차이를 하나의 숫자로 나타내 모델이 얼마나 틀렸는지 재는 지표다. 학습은 이 값을 줄이는 방향으로 가중치를 고치는 과정이다.\n함정 · 1번 가중치 개수, 3번 데이터 분산, 4번 기울기는 손실 함수의 정의가 아니다. 기울기는 손실을 미분해 얻는 값이다.","6-63":"핵심 · 실제값은 정답, Label, Ground Truth라고도 부른다. 모두 데이터가 원래 가진 참값 y_i를 가리키며, 모델이 낸 ŷ_i(예측값)와 짝을 이룬다.\n함정 · 1번 예측값은 모델의 출력 ŷ_i로, 손실 함수에서 실제값과 비교되는 반대편 값이다.","6-64":"핵심 · 손실 함수는 실제값의 형태로 고른다. y가 연속형인 회귀는 MSE, 0/1인 이진 분류는 BCE, 3개 이상 클래스의 다중 분류는 CCE를 쓴다. 회귀에는 확률이 없으니 오차 제곱으로 거리를 잰다.\n함정 · 1·2번 BCE·CCE는 분류용 손실이고, 4번 Softmax는 손실이 아니라 출력층 활성화 함수다.","6-65":"핵심 · MSE는 샘플마다 오차 (y_i − ŷ_i)를 제곱해 모두 더한 뒤 N으로 나눈 평균이다. 제곱 때문에 부호가 상쇄되지 않고 큰 오차일수록 크게 벌점을 받는다.\n함정 · 1번은 절댓값 평균인 MAE이고, 2번은 N으로 나누지 않은 제곱합이며, 3번은 교차 엔트로피 꼴이다.","6-66":"핵심 · 이진 분류는 출력층에서 Sigmoid로 양성일 확률 ŷ = 1/(1+e^(−z))를 내고, 이를 BCE로 평가한다. 다중 분류는 Softmax와 CCE가 짝이다. 출력 함수와 손실은 함께 묶어 외운다.\n함정 · 2번 CCE와 3번 Softmax는 다중 분류의 짝이고, 4번 MSE는 회귀 손실이다.","6-67":"핵심 · BCE는 y_i 값에 따라 한 항만 남는다. y_i = 1이면 (1 − y_i) = 0이 되어 ln ŷ_i 항만, y_i = 0이면 ln(1 − ŷ_i) 항만 살아남는다. 그래서 정답 쪽 확률이 1에 가까울수록 손실이 0에 가까워진다.\n함정 · 1번은 y_i = 0일 때 남는 항이고, 3번은 두 항이 동시에 남지 않으며, 4번은 제곱 오차 꼴이다.","6-68":"핵심 · CCE는 실제값이 이산형이고 클래스가 일반적으로 3개 이상인 다중 클래스 분류에 쓴다. 출력층은 Softmax로 클래스별 확률을 내고, 정답은 원-핫 벡터다.\n함정 · 1번 연속형은 MSE, 2번 0/1 두 값은 BCE의 상황이고, 3번 특징 차원은 손실 선택 기준이 아니다.","6-69":"핵심 · CCE에서 y_ik는 i번째 샘플의 k번째 클래스 정답(원-핫 성분), ŷ_ik는 모델이 낸 그 클래스의 확률이다. 원-핫이라 정답 k에서만 y_ik = 1이어서 −ln ŷ_ik 한 항만 남는다.\n함정 · 2번은 y_ik의 뜻이고, 1번 특징 값은 x, 4번 가중치는 w로 쓴다.","6-70":"핵심 · 배치 모드는 N개 샘플 각각의 클래스 합 −Σ_k y_ik ln ŷ_ik를 구해 평균 1/N을 취하고, 온라인 모드는 샘플 하나에 대해 클래스 합만 계산한다. 차이는 샘플 평균을 취하느냐뿐이다.\n함정 · 1번 온라인 모드도 클래스 합은 남기고, 3번 정확도로 바꾸지 않으며, 4번 배치 모드도 로그를 쓴다.","6-71":"핵심 · 원-핫 정답과 CCE를 쓰면 정답 클래스의 −ln ŷ만 남는다. 정답이 두 번째 클래스이므로 L = −ln(0.90) ≈ 0.105다. 정답 확률이 1에 가까울수록 손실은 0에 가까워진다.\n함정 · 2번은 다른 클래스의 확률을 썼고, 3번은 1 − ŷ 오차라 CCE가 아니며, 4번은 부호가 빠져 손실이 음수가 됐다.","6-72":"핵심 · 역전파는 손실을 줄이기 위해 출력층에서 입력층 방향으로 거슬러 가며 모든 가중치를 갱신하는 과정이다. 순전파가 예측을 만들면, 역전파는 그 오차를 뒤로 보내 각 가중치의 책임만큼 고친다.\n함정 · 1번은 순전파의 설명이고, 2번 배치 구성이나 4번 활성화 함수 선택은 역전파와 무관하다.","6-73":"핵심 · 역전파에서 가중치를 갱신하는 대표적인 방법은 경사하강법이다. 손실을 각 가중치로 미분한 기울기를 구하고 그 반대 방향으로 조금씩 이동해 손실을 줄인다.\n함정 · 1번 정규방정식은 선형 회귀의 닫힌 해법이고, 2번 유전 알고리즘과 3번 그리드 서치는 기울기를 쓰지 않는 탐색 방법이다.","6-74":"핵심 · 경사하강법은 w ← w − α·∂L/∂w로 갱신한다. 기울기는 손실이 커지는 방향이므로 빼야 손실이 줄고, 학습률 α가 한 번에 움직이는 보폭을 정한다.\n함정 · 1번은 더해서 손실이 커지는 경사상승이 되고, 3번은 w에 α를 곱해 식 구조가 틀렸으며, 4번은 α로 미분했다.","6-75":"핵심 · α는 학습률(learning rate)로, 기울기 방향으로 한 번에 얼마나 움직일지 정하는 보폭이다. 너무 크면 최솟값을 지나쳐 발산하고, 너무 작으면 학습이 느리다.\n함정 · 2번 손실 값은 L, 3번 초기값은 학습 전 설정이고, 4번 은닉층 개수는 구조 설정이라 갱신식의 α가 아니다.","6-76":"핵심 · w_ji^(k)는 k번째 층의 i번째 노드에서 k+1번째 층의 j번째 노드로 가는 엣지의 가중치다. 첨자는 '도착 j, 출발 i' 순서로 쓴다는 점이 헷갈리기 쉽다.\n함정 · 1번 바이어스는 w_j0으로 쓰고, 2번 노드 출력은 h, 4번 레이블은 y로 쓴다.","6-77":"핵심 · MLP 학습의 목표는 손실 L(y, ŷ)을 가장 작게 만드는 가중치 행렬 W_(0)^T, W_(1)^T를 찾는 것, 즉 argmin 문제다. 경사하강법과 역전파가 이 최소화를 수행한다.\n함정 · 1·2번은 손실을 키우는 방향이고, 3번처럼 손실을 0으로 고정하는 것은 목표가 아니라 불가능한 제약이다.","6-78":"핵심 · 역전파 흐름도에서 H^(1)은 은닉층 출력, H^(2)는 출력층 출력이다. H^(2) = [f_2(z_1^(2)); f_2(z_2^(2))]가 곧 예측값 ŷ이고, 손실 L은 이 H^(2)와 실제값으로 계산된다.\n함정 · 2번은 H^(1), 3번은 입력 x이며, 4번 손실은 H^(2)를 받아 계산하는 다음 단계다.","6-79":"핵심 · 연쇄법칙으로 뒤쪽 층의 기울기 ∂L/∂H^(2)에 국소 기울기 ∂H^(2)/∂H^(1)을 곱하면 앞쪽 층의 기울기 ∂L/∂H^(1)이 나온다. 출력층부터 이렇게 곱해 나가는 것이 역전파다.\n함정 · 1·3번은 분모의 변수가 x로 엇갈려 연쇄가 이어지지 않고, 4번은 W를 H로 미분해 국소 기울기가 틀렸다.","6-80":"핵심 · 역전파는 편미분의 연쇄법칙에 기반한다. 각 층에서 출력을 입력으로 미분한 국소 기울기(Local Gradient)를 구해 뒤쪽 기울기에 곱해 나가면 모든 가중치의 기울기를 얻는다.\n함정 · 1번 라그랑주 승수법은 제약 최적화, 2번 테일러 전개는 근사, 3번 베이즈 정리는 확률 갱신에 쓰는 원리다.","6-81":"핵심 · 은닉 노드 하나는 이전 층 출력과 가중치로 가중합 z_1^(1)을 만들고, 활성화 함수 f_1을 통과시켜 출력 h_1^(1)을 내보낸다. 이 '가중합 → 활성화 → 출력' 순서는 모든 노드에서 같다.\n함정 · 1·2번은 순서가 뒤바뀌었고, 4번 손실 계산은 노드 내부가 아니라 출력층 뒤에서 한 번 일어난다.","6-82":"핵심 · 출력층 가중치의 기울기는 '오차 × 그 엣지의 입력'이다. Softmax와 CCE를 함께 미분하면 ∂L/∂z = ŷ − y로 간단해지고, z를 w_11^(1)로 미분하면 엣지 입력 h_1^(1)이 나온다.\n함정 · 2번 x_1은 한 층 앞 가중치의 입력이고, 3번 가중치 자신이나 4번 z는 이 엣지의 입력이 아니다.","6-83":"핵심 · 한 층 앞 가중치는 연쇄법칙을 한 번 더 늘린다. 출력 오차 (ŷ_1 − y_1)에 거쳐 온 엣지 가중치 w_11^(1), ReLU의 국소 기울기 1, 그 엣지의 입력 x_1을 차례로 곱한다.\n함정 · 1번은 h를 곱해 국소 기울기 자리를 잘못 채웠고, 3번은 갱신 대상 가중치 자신을 곱했으며, 4번은 x를 두 번 곱했다.","6-84":"핵심 · h_1^(1) = ReLU(z_1^(1))이고 ReLU는 양수 구간에서 항등 함수라 미분값이 1이다. 그래서 은닉 노드를 지날 때 곱해지는 국소 기울기가 1이 되어 계산이 간단해진다. 음수 구간이면 0이 된다.\n함정 · 1번 Softmax는 출력층 함수이고, 2번 초기값이나 4번 바이어스 출력 1은 이 편미분과 무관하다.","6-85":"핵심 · 출력층 활성화로 Softmax를 쓰므로 ŷ_1 = h_1^(2) = Softmax(z_1^(2))다. 출력 노드의 가중합 z^(2)에 Softmax를 적용한 값이 예측 확률이 되고, 이것이 CCE 손실로 들어간다.\n함정 · 1번 ReLU는 은닉층 함수이고, 2번은 활성화를 생략했으며, 3번 Sigmoid는 이진 분류 출력층에서 쓴다.","6-86":"핵심 · 모델이 깊어지고 노드가 많아지면 앞단 가중치까지 가는 경로가 늘어 연쇄법칙으로 곱해야 할 편미분 항이 폭발적으로 많아진다. 그래서 국소 기울기를 재사용하는 역전파 방식이 필요하다.\n함정 · 1번 학습률은 자동으로 변하지 않고, 3번 출력층 가중치도 계속 갱신하며, 4번 연쇄법칙은 여전히 필요하다.","6-87":"핵심 · ReLU는 양수 구간 기울기가 1, 음수 구간이 0이라 은닉 노드를 지날 때의 편미분이 아주 간단하다. 역전파의 계산 부담을 줄이는 것이 은닉층에 ReLU를 쓰는 이유다.\n함정 · 2번 확률 합을 1로 만드는 것은 Softmax의 역할이고, 3번 가중치 초기화나 4번 손실의 볼록성은 ReLU와 무관하다.","6-88":"핵심 · 행렬 단위 갱신도 원리는 같다. 각 가중치 행렬 W에서 학습률 α와 손실의 기울기 ∂L/∂W를 곱한 만큼 뺀다: W ← W − α·∂L/∂W. W_(0)^T와 W_(1)^T 모두 이렇게 갱신한다.\n함정 · 1번은 더하면서 다른 행렬의 기울기를 썼고, 2번은 α를 W에 곱했으며, 4번은 미분의 분모·분자가 뒤바뀌었다.","6-89":"핵심 · 학습 1단계 순전파는 입력 데이터에 층마다 가중합과 활성화 함수를 차례로 적용해 예측값 ŷ을 내는 단계다. 이 예측값이 있어야 2단계에서 손실을 계산할 수 있다.\n함정 · 1번은 3단계 역전파의 일이고, 2번 초기화는 학습 시작 전 준비이며, 3번 평가 지표는 학습이 끝난 뒤에 계산한다.","6-90":"핵심 · 학습 2단계는 순전파로 얻은 예측값과 실제값의 차이를 손실 함수(분류면 CCE 등)로 계산하는 단계다. 이 손실값이 3단계 역전파의 출발점이 된다.\n함정 · 2번 학습률 조정이나 3번 은닉층 추가는 학습 절차 단계가 아니고, 4번 혼동 행렬은 학습이 끝난 뒤 평가에서 쓴다.","6-91":"핵심 · 학습 3단계 역전파는 손실을 출발점으로 미분의 연쇄법칙을 적용해 각 가중치의 기울기를 구하고 경사하강법으로 갱신한다. 순전파 → 손실 → 역전파가 한 바퀴다.\n함정 · 1번 예측값 계산은 1단계 순전파이고, 3번 데이터 수집이나 4번 활성화 함수 교체는 학습 반복 안에서 일어나지 않는다.","6-92":"핵심 · 학습은 순전파 → 손실 → 역전파를 반복하다가 오차가 허용범위보다 작아지면 끝난다. 즉 종료 기준은 오차(Error)이고, 그 뒤 성능 평가 지표를 산출한다.\n함정 · 1번 가중치가 0이 되면 모델이 무의미해지고, 2·3번 은닉층 수나 학습률은 학습 중 종료 조건으로 쓰는 값이 아니다.","6-93":"핵심 · 오차가 허용범위보다 크면(No) 역전파로 가중치를 갱신하고 다시 순전파부터 반복한다. 오차가 허용범위 안에 들 때(Yes)에야 학습을 끝내고 성능 평가로 넘어간다.\n함정 · 1번 종료와 2번 평가 지표 산출은 Yes 경로의 일이고, 4번 활성화 함수 제거는 흐름도에 없다.","6-94":"핵심 · 학습 흐름은 순전파 → 손실 → 역전파 반복 → 오차가 허용범위에 들면 종료 → 모델 성능 평가 지표 산출 순이다. 평가는 학습이 끝난 모델이 얼마나 잘 맞히는지 확인하는 마지막 단계다.\n함정 · 2번 손실 재정의, 3번 데이터 재수집, 4번 원-핫 인코딩은 학습 전 준비 단계이거나 흐름도에 없는 일이다.","6-95":"핵심 · 회귀 모델은 결정계수 R² 같은 지표로 평가한다. R²는 예측이 실제값의 변동을 얼마나 설명하는지 나타내며 1에 가까울수록 좋다. 분류 모델은 혼동 행렬로 평가한다.\n함정 · 1번 혼동 행렬은 분류 지표이고, 3번 CCE는 학습용 손실 함수이며, 4번은 자료에 없는 용어다.","6-96":"핵심 · 분류 모델은 혼동 행렬(Confusion Matrix)로 평가한다. 실제값과 예측값의 Positive/Negative 조합을 TP·FP·FN·TN으로 세어 어떤 클래스를 어떻게 틀렸는지 보여 준다.\n함정 · 1번 R²와 4번 SST는 회귀 평가용이고, 2번 MSE는 회귀의 손실 함수다.","6-97":"핵심 · R² = 1 − SSR/SST에서 SSR은 잔차 제곱합(Residual Sum of Squares, 실제값과 예측값 차이의 제곱합), SST는 총 제곱합(Total Sum of Squares, 실제값과 평균 차이의 제곱합)이다. 잔차가 작을수록 R²가 1에 가깝다.\n함정 · 1~3번은 Ratio·Sample 같은 엉뚱한 단어로 약자를 풀어 잔차·총합의 의미가 사라졌다.","6-98":"핵심 · R² 식에서 ȳ는 실제값 y_i의 평균, ŷ_i는 예측값이다. SST는 실제값이 평균에서 얼마나 퍼졌는지, SSR은 예측이 실제값에서 얼마나 벗어났는지를 잰다.\n함정 · 1번 예측값은 ŷ_i로 따로 쓰고, 3번 잔차 표준편차나 4번 가중치 평균은 R² 식에 나오지 않는다.","6-99":"핵심 · 혼동 행렬은 실제값과 예측값의 Positive/Negative 조합으로 네 칸을 만든다: TP(양성을 양성으로), FP(음성을 양성으로), FN(양성을 음성으로), TN(음성을 음성으로).\n함정 · 2~4번은 R², SSR, SST 같은 회귀 지표나 Precision·Recall 같은 파생 지표를 섞었다. 네 칸 자체는 TP·FP·FN·TN뿐이다.","6-100":"핵심 · 혼동 행렬의 행은 실제값(True label), 열은 예측값(Predicted label)이다. 대각선은 둘이 같은 칸이므로 올바르게 분류한 샘플 수이고, 대각선 밖이 오분류다. 대각선에 값이 몰릴수록 좋은 모델이다.\n함정 · 1번 오분류는 대각선 밖의 값이고, 2번 학습률이나 4번 손실 값은 혼동 행렬에 담기지 않는다.","7-1":"핵심 · K-NN 교안은 두 갈래로 시작한다. 먼저 학습 방식을 모델 기반과 사례 기반으로 나누고, 그다음 사례 기반의 대표인 kNN을 원리·거리측도·분류·회귀·k 선택 순으로 다룬다.\n함정 · 1번 군집화는 9주차, 3번 CNN·RNN은 딥러닝, 4번 선형회귀·정규화는 앞선 주차의 주제다.","7-2":"핵심 · 모델 기반 학습은 훈련 단계에서 손실을 줄이도록 파라미터를 최적화해 함수 f*를 미리 만들어 두는 방식이다. 이후 예측은 f*에 입력을 넣어 계산하기만 하면 된다.\n함정 · 2번(데이터를 저장해 두고 매번 비교)과 4번(거리·다수결)은 사례 기반 kNN의 설명이고, 3번처럼 테스트 라벨로 파라미터를 고치는 일은 어느 방식에도 없다.","7-3":"핵심 · 모델 기반 학습은 비용이 훈련 단계에 몰려 있다. f*가 완성되면 훈련 데이터 없이 f*(x′) 한 번 계산으로 예측하므로 예측이 빠르다. 사례 기반은 반대로 예측할 때마다 비용이 든다.\n함정 · 1번과 4번은 kNN의 예측 절차이고, 2번처럼 테스트 데이터로 다시 최적화하면 테스트의 의미가 사라진다.","7-4":"핵심 · 선형회귀·로지스틱회귀·퍼셉트론·MLP는 모두 가중치를 학습해 함수 f*를 만드는 모델 기반 학습이다. kNN은 학습 단계 없이 훈련 데이터를 그대로 들고 있다가 비교하는 사례 기반 학습의 대표다.\n함정 · 1~3번은 3~6주차에 배운 가중치 학습 모델이므로 모두 모델 기반에 속한다.","7-5":"핵심 · 사례 기반 학습은 함수를 따로 만들지 않고 훈련 사례 자체를 저장해 두었다가, 새 데이터가 오면 그 사례들과 비교해 답을 낸다. 학습은 사실상 '저장'뿐이고 계산은 예측 시점으로 미뤄진다(게으른 학습).\n함정 · 1·2번은 모델 기반의 최적화 과정이고, 3번은 정반대다. 사례 기반은 오히려 훈련 데이터를 전부 보관해야 한다.","7-6":"핵심 · 사례 기반 학습은 미리 계산해 둔 것이 없으므로 테스트 데이터가 들어올 때마다 훈련 데이터 전체와 비교해 예측값을 새로 연산한다. 그래서 데이터가 많을수록 예측이 느려진다.\n함정 · 1·2번은 학습이 한 번에 끝나는 모델 기반의 관점이고, 4번처럼 k를 정해도 예측 연산 자체는 매번 다시 일어난다.","7-7":"핵심 · kNN은 학습 단계 없이 훈련 데이터를 저장해 두고, 새 관측치와 가장 가까운 k개의 라벨로 답을 정하므로 사례 기반 학습의 대표로 꼽힌다.\n함정 · 2~4번 퍼셉트론·로지스틱회귀·선형회귀는 모두 가중치를 최적화해 f*를 만드는 모델 기반 학습이다.","7-8":"핵심 · 모델 기반 학습은 두 단계로 나뉜다. 학습 단계에서 함수 f를 정하고 파라미터를 최적화해 f*를 얻고, 테스트 단계에서는 f*(x′ᵢ)를 실제 라벨 y′ᵢ와 비교해 일치율(성능)을 잰다.\n함정 · 1번과 4번은 학습 단계의 일이고, 3번처럼 두 데이터셋을 합치면 성능을 공정하게 평가할 수 없다.","7-9":"핵심 · 인스턴스 기반 학습에는 f를 고르거나 최적화하는 단계가 없다. 훈련 데이터와 테스트 특징벡터 x′ᵢ를 함께 넣어 곧바로 ŷ′ᵢ를 계산하고, 이를 y′ᵢ와 비교해 성능을 잰다.\n함정 · 1번과 3번은 f*를 만드는 모델 기반의 흐름이고, 2번은 훈련과 테스트의 역할을 뒤바꾼 설명이다.","7-10":"핵심 · 두 방식은 계산하는 시점이 다르다. 모델 기반은 훈련 때 f*를 만들어 두고 예측 때는 f*만 쓴다. 사례 기반은 모델 없이 예측할 때마다 저장된 훈련 데이터와 비교하므로 훈련 데이터를 계속 보관해야 한다.\n함정 · 3번은 사례 기반을 모델 기반처럼 설명한 문장이라 틀렸다. 1·2·4번은 모두 맞는 설명이다.","7-11":"핵심 · kNN의 K는 새 관측치 주변에서 '몇 개의 이웃에게 물어볼지'를 정하는 숫자다. 가까운 순으로 K개를 골라 그 라벨로 다수결(분류)이나 평균(회귀)을 낸다. K는 사람이 직접 정하는 초매개변수다.\n함정 · 1번 반복 횟수, 2번 특징 수(p), 4번 클래스 수는 kNN에서 K와 다른 개념이다.","7-12":"핵심 · k=1이면 투표할 이웃이 하나뿐이다. 새 관측치와 거리가 가장 가까운 훈련 데이터 한 개를 찾아 그 라벨을 그대로 복사한다. 그래서 잡음 하나에도 결과가 쉽게 흔들린다.\n함정 · 2번 전체 최빈값과 3번 평균은 이웃을 보지 않는 방법이고, 4번처럼 가장 먼 데이터는 kNN의 '근접' 원리와 정반대다.","7-13":"핵심 · k=1 분류는 새 점에서 가장 가까운 점 하나의 색(라벨)만 본다. <그림3>에서 1번 이웃이 초록(정상)이므로 결과는 정상이다. k가 바뀌면 같은 점도 결과가 달라질 수 있다.\n함정 · 3번 비만은 k=3으로 이웃을 넓혔을 때의 결과다. 4번 동률은 이웃이 하나뿐인 k=1에서는 생길 수 없다.","7-14":"핵심 · k=3에서는 가까운 세 점의 라벨로 다수결을 한다. <그림3>의 이웃은 비만(파랑) 2개와 정상(초록) 1개이므로 다수인 비만으로 분류된다.\n함정 · 2번 정상은 k=1의 결과다. 4번 동률은 셋 중 두 표가 한쪽에 몰렸으니 성립하지 않는다.","7-15":"핵심 · k≥2인 kNN 분류에서는 가까운 k개 이웃의 라벨을 세어 가장 많은 라벨을 새 관측치에 붙인다. 이진 분류에서 k를 홀수로 잡으면 동률을 피할 수 있다.\n함정 · 2번처럼 거리를 평균내는 것은 라벨 결정과 무관하다. 회귀에서도 평균내는 대상은 거리가 아니라 이웃의 y값이다. 3번 임의 선택과 1번 가장 먼 점은 kNN 규칙이 아니다.","7-16":"핵심 · kNN은 학습하는 단계가 없으므로 k를 바꾸면 '누구에게 투표권을 주는지'만 달라진다. k=1은 가장 가까운 정상 1개만 보지만, k=3에서는 비만 2개가 더 들어와 다수결이 뒤집힌다.\n함정 · 1번 거리측도는 바꾸지 않았고, 3번 재학습은 kNN에 없는 과정이며, 4번 평균은 회귀에서나 쓰는 방식이다.","7-17":"핵심 · <그림3>은 키·몸무게를 특징으로 비만 여부를 분류하는 예제다. 라벨 yᵢ는 저체중(빨강)·정상(초록)·비만(파랑) 세 범주이고, 이렇게 라벨이 범주형이면 kNN은 다수결 분류를 한다.\n함정 · 2~4번은 그림의 범례에 없는 범주다.","7-18":"핵심 · <그림3>은 가로축이 몸무게(xᵢ₁), 세로축이 키(xᵢ₂)인 산점도다. 특징 두 개가 각 관측치를 좌표평면의 한 점으로 만들고, 그 점들 사이의 거리로 이웃을 찾는다.\n함정 · 1번은 나이를 넣었고, 2번 시험 점수는 회귀 예제(<그림4>)의 특징이며, 4번 유전자는 코로나 예제(<표2>)의 특징이다.","7-19":"핵심 · kNN의 '가깝다'는 숫자로 정의해야 한다. 테이블의 각 행을 특징벡터로 보고 두 벡터 사이의 거리측도(유클리디안·맨하탄 등)를 계산하면 이웃을 순서대로 고를 수 있다.\n함정 · 1번 활성화 함수, 3번 손실함수, 4번 규제항은 가중치를 학습하는 모델 기반 학습의 도구라 kNN에는 필요 없다.","7-20":"핵심 · 표기를 하나씩 읽으면 된다. i=1~7은 관측치(행) 7개, xᵢ=[xᵢ₁ xᵢ₂]ᵀ는 특징 2개(열), yᵢ∈{0,1}은 라벨이 두 범주(이진)라는 뜻이다. 첨자 i는 관측치를, j는 특징을 가리킨다.\n함정 · 1번은 관측치 수와 특징 수를 뒤바꿨고, 2·3번은 이진 라벨을 7가지나 연속형으로 잘못 읽었다.","7-21":"핵심 · 사례 기반 학습은 미리 만들어 둔 모델이 없으므로 새 데이터가 들어온 뒤에야 저장된 사례와 비교해 클래스를 예측한다. 계산을 예측 시점까지 미루기 때문에 '게으른 학습'이라고도 부른다.\n함정 · 2번 모델 기반은 예측 전에 f*를 완성해 둔다. 3번 강화학습과 4번 비지도 학습은 학습 방식을 나누는 다른 기준이다.","7-22":"핵심 · 테이블의 한 행은 특징 값을 늘어놓은 벡터이므로 좌표 공간의 한 점으로 볼 수 있다. 점이 되면 두 점 사이의 거리를 계산할 수 있고, kNN은 그 거리로 이웃을 고른다.\n함정 · 1번처럼 별도의 모델은 필요 없다. 2번처럼 라벨 종류는 좌표 표현과 무관하며, 4번과 달리 특징이 3개 이상이어도 거리 공식은 그대로 확장된다.","7-23":"핵심 · 라벨의 형태가 kNN의 출력 방식을 정한다. 라벨이 0/1 같은 범주형이면 분류이므로 이웃 라벨의 다수결로 정하고, 연속형이면 회귀이므로 이웃 값의 평균을 낸다.\n함정 · 1번 평균은 회귀에서 쓰는 방식이다. 2번은 라벨이 두 종류라는 사실과 어긋나고, 3번처럼 거리측도는 라벨 형태와 상관없이 쓸 수 있다.","7-24":"핵심 · 유클리디안 거리는 두 점을 잇는 직선의 길이로, 피타고라스 정리를 특징 p개로 넓힌 것이다. kNN에서 가장 흔히 쓰는 기본 거리측도다.\n함정 · 2번 격자 이동과 4번 절댓값 합은 맨하탄 거리의 설명이다. 3번 내적은 코사인 유사도처럼 각도를 재는 다른 측도다.","7-25":"핵심 · 유클리디안 거리는 √(Σⱼ(x₁ⱼ−x₂ⱼ)²)다. 같은 성분끼리 빼고, 각각 제곱해 더한 뒤 제곱근을 씌운다. 제곱하므로 부호가 사라지고 차이가 큰 성분이 더 크게 반영된다.\n함정 · 1번은 맨하탄 거리다. 2번처럼 차이를 먼저 더하면 +와 −가 상쇄되고, 4번 성분 곱의 합은 내적이다.","7-26":"핵심 · 성분별 차이를 구해 제곱하고 더한 뒤 루트를 씌운다. 몸무게 차 9−3=6, 키 차 2−3=−1이므로 √(36+1)=√37≈6.08이다. 부호는 제곱하면 사라진다.\n함정 · 4번 7.00은 절댓값을 더한 맨하탄 거리다. 1번 √13이나 3번 √45는 성분 차를 잘못 계산했을 때 나오는 값이다.","7-27":"핵심 · 유클리디안 거리 공식 √(Σⱼ₌₁ᵖ(x₁ⱼ−x₂ⱼ)²)에서 합의 범위 p는 특징벡터의 성분(특징) 수다. 몸무게·키 두 특징이면 p=2이고, 특징이 늘어나면 제곱하는 항만 늘어난다.\n함정 · 1번 관측치 수(n), 2번 이웃 수(k), 3번 클래스 수는 공식의 p와 다른 개념이다.","7-28":"핵심 · 맨하탄 거리는 Σⱼ|x₁ⱼ−x₂ⱼ|로, 각 축을 따라 이동한 거리를 그대로 더한다. 제곱하지 않으므로 큰 차이 하나가 거리를 지나치게 키우지 않는다.\n함정 · 2번은 유클리디안 거리이고, 3번 최댓값은 체비셰프 거리다. 4번 제곱의 평균은 MSE와 같은 오차 지표다.","7-29":"핵심 · 맨하탄 거리는 성분별 차이의 절댓값을 더한다. |9−3|+|2−3|=6+1=7이다. 같은 두 점의 유클리디안 거리 √37≈6.08보다 크다.\n함정 · 2번 6은 몸무게 차이만 셌다. 1번 5와 4번 9는 절댓값을 빼먹거나 성분을 잘못 짝지었을 때 나오기 쉬운 값이다.","7-30":"핵심 · 맨하탄 거리는 일상에서 '거리'라고 하면 떠올리는 직선거리가 아니다. 그래서 일상에서는 드물게 쓰지만, 머신러닝이나 프로그래밍에서는 계산이 단순하고 이상치에 덜 민감해 쓰이는 경우가 있다.\n함정 · 1번은 유클리디안 거리의 설명이다. 2번과 달리 특징 수에 제한이 없고, 3번과 달리 kNN의 거리측도로 쓸 수 있다.","7-31":"핵심 · 맨하탄처럼 도로가 바둑판인 도시에서는 건물을 가로지를 수 없어 가로·세로로만 걸어야 한다. 그 이동 거리가 성분 차이의 절댓값 합이라서 '맨하탄 거리'라는 이름이 붙었다.\n함정 · 1~3번 항로·빛의 경로·대원은 모두 막힘없이 가는 최단 경로라 직선거리(유클리디안) 쪽의 비유다.","7-32":"핵심 · 같은 두 점이라도 어떤 거리측도를 쓰느냐에 따라 거리 값이 달라지고, 이웃의 순서와 kNN의 예측 결과까지 바뀔 수 있다. 그래서 거리측도는 k와 함께 kNN의 초매개변수다.\n함정 · 2번처럼 늘 같지는 않다. 3번은 거꾸로다. 맨하탄은 유클리디안보다 항상 크거나 같다. 4번과 달리 유클리디안 거리는 √37처럼 무리수가 될 수 있다.","7-33":"핵심 · 두 점의 성분별 차이는 1−6=−5, 0−5=−5다. 제곱하면 25+25=50이고, 제곱근을 씌우면 √50≈7.07이다. 차이가 음수여도 제곱하면 부호가 사라진다.\n함정 · 2번 5.00은 한 축의 차이만 쓴 값이다. 1번 √10과 4번 √61은 성분을 잘못 대입했을 때 나오는 값이다.","7-34":"핵심 · 맨하탄 거리는 |1−6|+|0−5|=5+5=10이다. 같은 쌍의 유클리디안 거리 √50≈7.07보다 크다. 두 축의 차이가 비슷할수록 두 측도의 차이도 커진다.\n함정 · 1번 5는 한 축만 셌고, 3번 25는 제곱을 섞었으며, 4번 7은 유클리디안 값 7.07과 혼동하기 쉬운 숫자다.","7-35":"핵심 · 성분별 차이는 몸무게 2−5=−3, 키 1−2=−1이다. 제곱해 더하면 9+1=10이므로 거리는 √10≈3.16이다. 같은 쌍의 맨하탄 거리는 3+1=4다.\n함정 · 2번 √8≈2.83은 신입생도와 생도4 사이의 거리와 헷갈리기 쉬운 값이고, 1번과 3번은 성분 차를 잘못 계산한 값이다.","7-36":"핵심 · 두 측도 모두 같은 성분끼리 차이를 구하는 데서 시작한다. 유클리디안은 차이를 제곱해 더한 뒤 루트를 씌우고(직선거리), 맨하탄은 차이의 절댓값을 그냥 더한다(축을 따라 걷는 거리). 둘 다 kNN에 쓸 수 있다.\n함정 · 3번은 맨하탄 거리에 유클리디안의 계산법을 붙였으므로 틀렸다. 1·2·4번은 맞는 설명이다.","7-37":"핵심 · kNN 분류는 세 단계다. Step1 새 관측치가 들어오고, Step2 거리측도로 가까운 k개를 찾고, Step3 그 k개의 다수결로 클래스를 정한다. 출발점은 언제나 새 관측치다.\n함정 · 1번은 Step3이고, 3번 파라미터 최적화는 kNN에 없는 과정이다. 4번과 달리 거리측도는 학습하지 않고 사람이 정하는 초매개변수다.","7-38":"핵심 · Step2에서는 새 관측치와 모든 훈련 데이터 사이의 거리를 계산하고, 가까운 순으로 정렬해 상위 k개를 고른다. 이 탐색 때문에 kNN은 데이터가 많을수록 예측이 느려진다.\n함정 · 1번은 Step3이고, 2번 평균은 회귀에서 쓰는 방식이다. 3번 모델 함수 선정은 모델 기반 학습의 단계다.","7-39":"핵심 · Step3에서는 Step2에서 찾은 k개 이웃의 라벨을 세어 가장 많은 라벨을 새 관측치의 클래스로 정한다. 회귀라면 같은 자리에서 다수결 대신 평균을 낸다.\n함정 · 2번은 Step1, 3번은 Step2다. 4번 재학습은 kNN에 없는 과정이다.","7-40":"핵심 · kNN 분류는 '새 관측치 유입 → 거리측도로 가까운 k개 탐색 → k개의 다수결로 클래스 정의' 순서다. 회귀도 순서는 같고 마지막 단계만 평균으로 바뀐다.\n함정 · 1·2·4번은 순서를 뒤섞었다. 관측치가 있어야 거리를 잴 수 있고, 이웃을 찾아야 투표를 할 수 있다.","7-41":"핵심 · 신입생도 (3,4)에서 생도3 (3,3)까지의 거리는 몸무게 차 0, 키 차 1이므로 √(0+1)=1.00으로 가장 가깝다. 이렇게 거리를 모두 계산해 작은 순으로 줄 세우는 것이 Step2다.\n함정 · 1번 생도5(2.00)는 2nd, 3번 생도4(2.82)는 3rd 이웃이다. 4번 3.16은 다른 쌍에서 나온 거리다.","7-42":"핵심 · k=3이면 거리가 짧은 순으로 세 명을 고른다. 생도3(1.00), 생도5(2.00), 생도4(2.82)가 1~3위다. 이 세 명의 라벨이 Step3 다수결에 들어간다.\n함정 · 1·2·3번에는 거리가 더 먼 생도1·2·6·7이 섞여 있다. 거리 순위를 정확히 세는 것이 먼저다.","7-43":"핵심 · 세 이웃의 라벨은 생도3=0, 생도5=1, 생도4=1이므로 다수결에 따라 y′₁=1(비만)이다. 가장 가까운 이웃이 0이어도 k=3에서는 한 표일 뿐이다.\n함정 · 2번은 k=1의 논리이고, 3번처럼 거리 평균으로 라벨을 정하지 않는다. 4번은 라벨 개수를 거꾸로 셌다.","7-44":"핵심 · k=1이면 최근접 이웃 한 명의 라벨을 그대로 쓴다. 생도3(거리 1.00)의 라벨이 0이므로 예측은 0이다. k=3일 때의 1과 다르니, k가 결과를 바꾸는 초매개변수임을 보여 준다.\n함정 · 1번 생도5는 2nd 이웃이다. 2번과 달리 k=1은 한 표로 바로 결정된다. 4번 전체 최빈값은 이웃을 보지 않는 방법이다.","7-45":"핵심 · 거리를 모두 비교하면 B 0.76, D 0.78, E 1.28, F 1.31, A 1.54, C 2.00 순이다. 1위는 생도B다. 특징이 유전자 값으로 바뀌어도 '거리 계산 → 정렬'이라는 절차는 같다.\n함정 · 1번 D(0.78)는 2위로 차이가 아주 작고, 3번 E는 3위, 4번 A는 5위다.","7-46":"핵심 · k=1에서는 가장 가까운 생도B(0.76) 한 명의 라벨을 그대로 쓴다. 생도B가 정상이므로 예측도 정상이다.\n함정 · 1번 확진은 k=3의 결과다. 2번 판정 보류는 kNN에 없는 선택지이고, 3번 생도C는 거리 2.00으로 가장 먼 데이터다.","7-47":"핵심 · k=3 이웃은 B(0.76, 정상), D(0.78, 확진), E(1.28, 확진)다. 확진 2표, 정상 1표이므로 다수결로 확진이다. 홀수 k에서 이진 라벨이면 동률이 생기지 않는다.\n함정 · 2번 정상은 k=1의 결과다. 3번 동률은 성립하지 않고, 4번 확률 유보는 kNN 다수결 규칙이 아니다.","7-48":"핵심 · 두 예측 모두 거리측도는 유클리디안으로 같고 k만 다르다. k=1은 정상인 B만 보지만, k=3에서는 확진인 D·E가 더 들어와 2:1로 결과가 뒤집힌다. 키·몸무게 예제와 같은 구조다.\n함정 · 1번처럼 거리측도를 바꾸지 않았고, 2번 평균은 회귀 방식이며, 4번 생도C는 3위 안에 들지 않는다.","7-49":"핵심 · kNN이 분류를 할지 회귀를 할지는 라벨 yᵢ의 형태로 정해진다. 범주형(정상·비만 등)이면 다수결 분류를, 점수처럼 연속형이면 평균을 내는 회귀를 한다.\n함정 · 1번 특징 개수, 2번 k의 홀짝, 3번 거리측도는 분류인지 회귀인지와 상관이 없다.","7-50":"핵심 · kNN 회귀는 분류와 같은 절차로 가까운 k개를 찾고, 마지막에 다수결 대신 그 k개 y값의 평균을 예측값으로 낸다. 연속값은 투표로 정할 수 없기 때문이다.\n함정 · 3번 다수결은 분류의 방식이다. 2번 최댓값과 4번 가장 먼 값은 kNN의 규칙이 아니다.","7-51":"핵심 · kNN 회귀의 예측값은 이웃 값의 산술평균이다. (72+87+69)/3=228/3=76이므로 76점이다. 평균은 이웃 값의 최솟값과 최댓값 사이에 놓인다.\n함정 · 1번 69는 최솟값, 4번 87은 최댓값이다. 3번 80은 계산이 틀린 값이다.","7-52":"핵심 · 단순 평균은 가까운 이웃과 먼 이웃을 똑같이 센다. 거리 가중 방식은 가까운 이웃일수록 큰 가중치(보통 거리의 역수)를 준다. 교안은 '거리에 비례'라고 적었지만 실제로는 가까울수록 더 크게 반영된다.\n함정 · 1번 최빈값은 분류의 다수결이고, 2번 재추출과 3번 정규화 후 최댓값은 교안에 없는 방법이다.","7-53":"핵심 · 회귀 예제도 거리 계산과 정렬부터 한다. F 1.12, E 1.87, C 2.12, B 2.40, D 2.65, A 3.28 순이므로 생도F가 가장 가깝다. 이 순위대로 k개를 잘라 평균을 낸다.\n함정 · 2번 E는 2위, 3번 C는 3위, 4번 B는 4위다.","7-54":"핵심 · k=1 회귀는 최근접 이웃 한 명의 값을 그대로 예측값으로 쓴다. 생도F의 점수가 9.0이므로 예측은 9.0이다. 이웃이 하나면 평균도 그 값 자체다.\n함정 · 4번 9.17은 k=3의 평균이다. 1번 8.5는 생도C, 2번 10.0은 생도E의 점수다.","7-55":"핵심 · k=3이면 거리 1~3위를 고른다. F(1.12), E(1.87), C(2.12)가 이웃이다. 회귀든 분류든 '가까운 k개 선택'은 똑같고, 그다음 처리만 평균과 다수결로 나뉜다.\n함정 · 1·2·3번은 거리 순위가 높은 생도와 낮은 생도를 섞었다. B(2.40)는 4위라 빠진다.","7-56":"핵심 · 세 이웃의 점수 9.0, 10.0, 8.5를 평균내면 27.5/3≈9.17이다. k=1의 9.0과 다르니 회귀에서도 k가 예측값을 바꾼다.\n함정 · 2번 9.00은 k=1의 결과다. 1번 8.50은 생도C 한 명의 점수이고, 3번 8.83은 이웃을 잘못 골랐거나 계산이 틀린 값이다.","7-57":"핵심 · 매개변수는 가중치처럼 학습 과정에서 데이터로 자동 결정되는 값이고, 초매개변수는 학습 전에 사람이 직접 정해 주는 설정값이다. kNN에서는 k와 거리측도가 초매개변수다.\n함정 · 1번은 일반 매개변수(가중치)의 설명이다. 2번 라벨은 데이터 자체이고, 4번은 정의와 관계없다.","7-58":"핵심 · kNN은 학습할 가중치가 없으므로 사람이 정하는 두 가지가 성능을 좌우한다. 이웃을 몇 개 볼지(k)와 거리를 어떻게 잴지(거리측도)다.\n함정 · 2번 학습률·배치 크기와 3번 은닉층·활성화 함수는 경사하강법으로 학습하는 신경망의 초매개변수이고, 4번은 규제가 있는 모델의 설정이다.","7-59":"핵심 · k가 작으면 바로 옆의 점 몇 개에만 의존하므로 잡음이나 이상치까지 그대로 따라가 결정 경계가 들쭉날쭉해진다. 훈련 데이터에는 잘 맞지만 새 데이터에는 약한 과대적합이다. k=1의 훈련 오차는 늘 0이다.\n함정 · 1번은 k가 클 때 생기는 과소적합이다. 3번 거리 계산과 4번 회귀 전환은 k의 크기와 상관이 없다.","7-60":"핵심 · k가 크면 멀리 있는 다른 범주의 점까지 투표에 들어와 지역적 특징이 묻히고, 극단적으로는 전체 다수 클래스만 답하게 된다. 이것이 과소적합이다. 적절한 k는 두 극단 사이에서 찾는다.\n함정 · 1번 들쭉날쭉한 경계는 k가 작을 때의 과대적합 증상이다. 2번과 4번은 k가 커도 일어나지 않는다.","7-61":"핵심 · k는 일정 범위(예: 1~15)에서 바꿔 보며 새 데이터에 대한 성능이 가장 좋은 값을 고른다. 훈련 오차는 k=1에서 0이 되므로 기준이 될 수 없다. 엄밀히는 검증 데이터나 교차검증으로 고른다.\n함정 · 3번처럼 학습 데이터 결과로 고르면 늘 k=1이 뽑혀 과대적합된다. 1·2·4번은 교안 내용과 맞다.","7-62":"핵심 · <그림 1.1>은 AI가 얼마나 결정을 대신하는지(AI 기여도)와 잘못되면 얼마나 큰 피해가 나는지(사고 심각도)를 두 축으로 둔다. 두 값이 모두 클수록 AI 판단에 높은 신뢰성과 설명이 요구된다.\n함정 · 2~4번은 모델의 성능이나 규모를 나타내는 지표라 활용 영역을 나누는 축이 아니다.","7-63":"핵심 · AI 기여도가 높고 사고가 운영이나 인명에 영향을 주는 영역일수록 높은 신뢰성이 필요하다. 자동 운전, 의료 진단, 자동거래·융자 심사, 인프라 보수가 여기에 묶인다.\n함정 · 4번 광고는 틀려도 피해가 경미한 영역이라 높은 신뢰성 영역 밖에 놓인다. 1~3번은 모두 생명이나 돈이 걸린 영역이다.","7-64":"핵심 · 사고 심각도 축은 '영향도 경미 → 운영에 영향 → 인명에 영향' 순으로 오른쪽으로 갈수록 커진다. 사람의 생명이 걸릴수록 AI 판단을 설명하고 책임질 필요도 커진다.\n함정 · 1번은 왼쪽 끝, 2번은 중간 단계다. 4번 '비용에 영향'은 축에 없는 표현이다.","7-65":"핵심 · AI가 퍼지면서 악용과 차별, 테스트 부족으로 인한 사고, 학습 데이터의 편향·부족으로 인한 오작동 같은 문제가 드러났다. 성능이 높아져 쓰임새가 넓어진 것도 배경이다. 그래서 정확도만이 아니라 더 넓은 시점이 요구되었다.\n함정 · 4번 연구 인력 감소는 교안에 없는 내용이다. 1~3번은 모두 제시된 배경이다.","7-66":"핵심 · AI에 요구되는 시점은 안쪽에서 바깥쪽으로 넓어졌다. 정확도를 보는 기계학습적 시점에서 시작해, 시스템적 시점(가용성·보안), 사회적 시점(공평성·책임성·투명성), 윤리적 시점으로 확대된다.\n함정 · 1번은 순서를 거꾸로 적었고, 3·4번은 중간 순서를 뒤섞었다. 출발점은 늘 '정확도'다.","7-67":"핵심 · 기계학습적 시점은 모델 자체의 성능, 즉 정확도만 본다. 여기서 시스템(운영), 사회(공평성), 윤리로 관점을 넓혀 가는 것이 <그림 1.2>의 구조다.\n함정 · 1번 보안과 4번 운용·보수성은 시스템적 시점, 3번 공평성은 사회적 시점의 항목이다.","7-68":"핵심 · 시스템적 시점은 AI를 실제 서비스로 운영할 때의 요건을 본다. 가용성, 운용·보수성, 성능·확장성, 보안이 그 항목이다. 모델이 정확해도 운영이 불안하면 쓸 수 없다는 관점이다.\n함정 · 1번은 사회적 시점, 2번은 기계학습적 시점의 성능 지표다. 4번은 교안의 시점 구분에 없는 묶음이다.","7-69":"핵심 · 사회적 시점은 AI가 사람과 사회에 미치는 영향을 본다. 공평성(차별 없음), 책임성(Accountability, 결과를 책임짐), 투명성(Transparency, 판단 과정이 드러남) 세 가지가 핵심이다.\n함정 · 2번은 시스템적 시점, 3번은 성능·운영 지표다. 4번 재현성·이식성은 교안에 없는 묶음이다.","7-70":"핵심 · 바이어스는 단계마다 쌓인다. 현실 데이터의 역사적·샘플링 바이어스가 학습 데이터를 가공할 때의 가공 바이어스로 이어지고, AI의 학습 바이어스를 거쳐 불공평한 예측으로 나타난다.\n함정 · 1번과 3번은 단계 순서가 틀렸다. 4번처럼 원인이 하나뿐인 것도 아니다. 흐름은 현실 데이터에서 출발한다.","7-71":"핵심 · 책임성(Accountability)은 AI의 판단과 결과를 누가 어떻게 책임지고 설명할지에 관한 것이고, 투명성(Transparency)은 판단 과정과 근거가 밖에서 보이는지에 관한 것이다. 공평성(Fairness)과 함께 사회적 시점을 이룬다.\n함정 · 1번은 두 단어를 맞바꿨다. 2·3번의 Reliability(신뢰성)와 Fairness(공평성)는 다른 개념이다.","7-72":"핵심 · <그림 1.4>는 설명하기 쉬운 알고리즘일수록 다룰 수 있는 문제의 복잡성이 낮다는 트레이드오프를 보여 준다. 가로축이 설명 가능성, 세로축이 대응 가능한 문제의 복잡성이다.\n함정 · 1번 속도, 3번 데이터·파라미터, 4번 훈련·검증 오차는 이 그림의 축이 아니다. 4번은 과적합을 진단할 때 보는 축이다.","7-73":"핵심 · 규칙 기반은 'if 조건이면 결과'처럼 사람이 쓴 규칙이 그대로 모델이므로 판단 근거를 가장 명확하게 설명할 수 있다. 대신 복잡한 문제에는 대응하기 어렵다.\n함정 · 1번 딥러닝은 반대쪽 끝이다. 2번 부스팅과 3번 의사결정 나무는 그 사이에 놓인다.","7-74":"핵심 · 딥러닝은 층을 깊게 쌓아 이미지·언어처럼 복잡한 문제까지 다루지만, 가중치가 겹겹이 얽혀 판단 근거를 설명하기는 가장 어렵다. 트레이드오프 곡선의 반대쪽 끝에 놓인다.\n함정 · 2~4번 회귀, 나무, 규칙 기반은 설명하기 쉬운 대신 다룰 수 있는 문제의 복잡성이 낮다.","7-75":"핵심 · 설명 가능성 순서는 딥러닝 < 부스팅 < 의사결정 나무 < 선형/로지스틱 회귀 < 규칙 기반이다. 문제 대응력은 정확히 그 반대 순서다. 한쪽 끝만 외워 두면 다른 쪽은 뒤집기만 하면 된다.\n함정 · 1번은 '높은 것부터' 순서다. 3·4번은 중간을 뒤섞었다.","7-76":"핵심 · 의사결정트리는 분기 조건을 따라가면 예측 근거가 그대로 드러나고, 로지스틱 회귀는 각 특징의 계수 크기와 부호로 영향력을 읽을 수 있다. 그래서 둘 다 설명 가능성이 높다.\n함정 · 2번 XGBoost·MLP와 3번 딥러닝·부스팅은 설명 가능성이 낮은 쪽이다. 4번 랜덤 포레스트·SVM은 교안의 비교 대상이 아니다.","7-77":"핵심 · 알고리즘의 설명 가능성은 두 질문으로 따진다. 전체적으로 어떤 항목이 예측에 중요한지, 그리고 개별 입력 하나에 대해 왜 그렇게 예측했는지다. 앞은 전역 설명, 뒤는 국소 설명에 해당한다.\n함정 · 1·3·4번의 속도·비용·구조 크기는 설명 가능성을 평가하는 관점이 아니다.","7-78":"핵심 · 의사결정 트리는 루트에서 전체 데이터를 가장 잘 가르는 조건으로 처음 분기한다. <그림 1.5>에서는 '평균 이용금액 > 30,000원'이 루트이고, 위쪽 분기일수록 대체로 예측에 중요한 항목으로 읽는다.\n함정 · 2번 쿠폰 사용 여부와 1·4번 월 점포 방문 횟수는 루트 아래에서 갈라지는 하위 조건이다.","7-79":"핵심 · 트리가 얕으면 예측 근거가 조건 몇 개의 짧은 경로라 이해하기 쉽다. 깊어질수록 경로가 길어지고 갈래가 많아져 해석하기 어려워진다. 같은 알고리즘 안에서도 복잡성과 설명 가능성은 트레이드오프다.\n함정 · 2·4번은 반대이거나 관계를 부정한다. 3번과 달리 얕은 트리도 분기 경로로 예측 근거를 보여 준다.","7-80":"핵심 · 로지스틱 회귀는 선형 결합 z=a₁x₁+…+aₙxₙ+β를 시그모이드 1/(1+e^(−z))에 넣어 0과 1 사이의 확률로 바꾼다. 계수 aᵢ의 부호와 크기로 각 특징의 영향을 읽을 수 있어 설명하기 쉽다.\n함정 · 1번은 시그모이드를 거치지 않은 선형회귀 식이다. 3번은 분모가 빠졌고, 4번 절댓값 합은 맨하탄 거리와 비슷한 꼴일 뿐이다.","7-81":"핵심 · 시그모이드는 입력이 커질수록 출력이 0에서 1로 S자를 그리며 증가하고, 결코 0과 1을 넘지 않는다. 그래서 출력을 확률로 읽을 수 있다. 기울기 a가 크면 곡선이 가팔라진다.\n함정 · 1번 −1~1은 tanh의 범위이고, 2번 직선은 선형회귀다. 4번 계단 함수는 a가 무한히 클 때의 극한일 뿐 시그모이드 자체는 아니다.","7-82":"핵심 · XGBoost는 트리 수백 개를 순차적으로 더한 앙상블이고, MLP는 가중치가 겹겹이 얽힌 다층 신경망이다. 둘 다 정확도는 높지만 '왜 그렇게 예측했는지'를 한눈에 보여 주기 어렵다.\n함정 · 1번과 2번은 설명하기 쉬운 쪽이다. 4번 kNN은 이 비교에서 다루지 않았다.","7-83":"핵심 · 배깅은 여러 표본으로 모델을 독립적으로 만들어 병렬로 결과를 모으고, 부스팅은 앞 모델의 오류를 다음 모델이 고치도록 순차적으로 쌓는다. 모델이 수없이 겹치므로 XGBoost 같은 부스팅은 해석하기 어렵다.\n함정 · 1번은 배깅의 설명이다. 3번 단일 트리와 4번 규칙 기반은 앙상블이 아니다.","7-84":"핵심 · 퍼셉트론은 입력에 가중치를 곱해 더한 z=Σwᵢxᵢ를 활성화 함수 g(시그모이드·tanh·ReLU 등)에 통과시켜 y=g(z)를 낸다. 이 퍼셉트론을 여러 층 쌓은 것이 MLP다.\n함정 · 2번은 가중치를 부정했고, 3번 거리 계산은 kNN의 방식이다. 4번 순환 구조는 RNN의 특징이다.","7-85":"핵심 · MLP의 첫 층은 원래 입력에 가중치를 곱해 더하므로 무엇을 중요하게 보는지 비교적 읽을 수 있다. 층을 지날수록 이미 섞이고 가공된 값을 다시 섞으므로, 출력에 가까운 층은 의미를 해석하기 어렵다.\n함정 · 1번은 방향을 거꾸로 적었다. 3·4번은 층이 깊어질수록 해석이 어려워진다는 점을 부정한다.","7-86":"핵심 · 여신 심사는 '가심사 → 본심사 → 계약/융자 → 변제 확인' 순서다. 마지막 변제 확인에서야 심사가 맞았는지가 드러나므로, AI가 심사하면 그 판단 근거를 사후에 설명할 수 있어야 한다.\n함정 · 1·3·4번은 순서를 뒤섞었다. 계약 전에 두 번의 심사가 먼저 이뤄진다.","7-87":"핵심 · 본심사는 돈을 빌려줘도 되는지를 본격적으로 판단하는 단계로, 지불 능력이 있는지와 그 능력이 계속될지를 심사한다. AI가 이 판단을 맡으면 거절 사유를 설명할 책임이 생긴다.\n함정 · 1번 담보 시세, 2번 담당자 근속, 3번 학력·경력은 그림에 제시된 본심사 항목이 아니다.","7-88":"핵심 · 여신 심사의 정보는 둘로 나뉜다. 차입 용도·수입처럼 신청자가 직접 낸 '신청 시의 정보'와, 외부보증회사의 심사 결과·거래 이력 같은 '신청 내용 이외의 정보'다.\n함정 · 1번은 신청 시의 정보다. 3번 SNS 기록과 4번 주관적 인상은 그림에 없는 정보다.","7-89":"핵심 · <그림 12.1>은 실수를 얼마나 허용하는지와 얼마나 자동화하는지를 두 축으로 AI 활용 상황을 네 칸으로 나눈다. 실수가 허용되지 않고 전자동일수록 난이도와 설명 요구가 커진다.\n함정 · 2·3번은 모델의 규모나 속도 지표이고, 4번 정확도·설명 가능성은 <그림 1.4>의 트레이드오프와 헷갈리기 쉬운 조합이다.","7-90":"핵심 · 사람이 보정해 주지 않는 전자동인데 작은 실수도 허용되지 않는 칸이 가장 어렵다. 그곳이 제1사분면(★★★)이다. 자율 주행 레벨 5나 완전 자동 의료 판단이 이런 상황이다.\n함정 · 2·4번 사분면은 두 조건 중 하나만 엄격해 ★★☆이고, 3번 제3사분면은 둘 다 느슨해 ★☆☆이다.","7-91":"핵심 · 사람이 결과를 보정하고 다소의 오차도 허용되는 상황은 AI를 도입하기 가장 쉽다. 그것이 제3사분면(★☆☆)이다. 엄격한 조건이 하나씩 늘 때마다 별이 하나씩 늘어난다고 보면 된다.\n함정 · 1번 제1사분면은 ★★★, 2·4번은 ★★☆이다.","7-92":"핵심 · 자율 주행은 0 비자율, 1 주행 지원, 2 부분 자동화, 3 조건부 자동화, 4 고속 자동화, 5 완전 자동화 순이다. 레벨 3은 정해진 조건 안에서는 시스템이 운전한다는 뜻의 '조건부'다.\n함정 · 1번 부분 자동화는 레벨 2, 3번 고속 자동화는 레벨 4, 4번 완전 자동화는 레벨 5다.","7-93":"핵심 · 레벨 0~2는 시스템이 돕더라도 운전 책임이 운전자에게 있고, 레벨 3부터는 주체가 자동차(자율 주행 시스템)로 넘어간다. 책임이 시스템으로 넘어가는 경계가 레벨 2와 3 사이다.\n함정 · 2번은 레벨 3을 운전자 쪽에 넣었다. 3번은 자동차가 주체인 레벨이고, 4번은 두 구간을 섞었다.","7-94":"핵심 · 레벨 3 '조건부 주행 자동화'부터 운전 주체가 자동차(자율 주행 시스템)가 된다. 이때부터 사고가 나면 AI가 왜 그렇게 판단했는지 설명할 책임이 시스템 쪽에 생긴다.\n함정 · 1번 레벨 2는 아직 운전자가 주체다. 3·4번 레벨 4·5도 자동차가 주체이지만, 주체가 바뀌기 '시작'하는 레벨은 아니다.","7-95":"핵심 · 설명이 필요한 비즈니스 상황은 법적 소송을 가정할 때, 중대한 의사결정을 할 때, 클러스터링으로 만든 카테고리 라벨을 설명할 때, 처음부터 정형화된 설명 내용으로 결정할 때다. 모두 사람을 설득해야 하는 상황이다.\n함정 · 4번 학습 속도 단축은 엔지니어링 문제라 열거되지 않았다. 1~3번은 모두 교안의 목록에 있다.","7-96":"핵심 · 설명은 듣는 사람에 따라 목적이 달라진다. 모델 개발자에게 설명은 모델이 어떻게 동작하는지 알고 개선하기 위한 것이므로 XAI 기법이 주된 도구다. 최종 사용자에게는 설명 책임, 의사결정자에게는 판단 근거가 목적이 된다.\n함정 · 2번 설명 책임은 최종 사용자 사회에 대한 목적이다. 3·4번은 다른 대상자의 목적이다.","7-97":"핵심 · 최종 사용자와 사회에 대한 설명은 결과에 책임지는 것(설명 책임)이 목적이다. 그래서 내부 알고리즘보다 실험·정밀도 리포트를 보여 주고, 처음 상정한 내용과 문제가 생겼을 때의 차이를 제시하는 방법을 쓴다.\n함정 · 1번은 모델 개발자의 목적과 방법이다. 2·4번은 다른 대상자의 목적과 방법을 섞은 조합이다.","7-98":"핵심 · 정밀도가 높은 모델은 복잡한 현상을 다루므로 그 판단을 설명하는 것도 본질적으로 복잡하다. XAI는 근거를 일부 보여 줄 뿐 복잡한 모델을 단순하게 만들어 주지는 못하므로 과도한 기대는 금물이다.\n함정 · 2번은 이 단원이 경고하는 '과도한 기대'다. 3·4번은 정밀도와 설명 능력이 함께 움직인다고 봐서 트레이드오프를 부정한다.","7-99":"핵심 · 새 기술에 불안을 느끼는 사람이 모두 내부 구조를 알고 싶어 하지는 않는다. XAI는 '이해하고 싶으면서 불안한' 사람에게만 효과가 있으므로, 나머지에게는 성능 공유나 실적 쌓기 같은 다른 설득 방법이 필요하다.\n함정 · 1번과 3번은 모든 사람을 한 부류로 본 과장이다. 4번처럼 불안한 사람을 제외하는 것은 설득의 목적과 반대다.","7-100":"핵심 · 설득 방법은 상대가 무엇을 원하는지에 맞춘다. 내부 구조를 알고 싶은 사람에게는 알고리즘 동작을, 기능·효과를 알고 싶은 사람에게는 정밀도의 정량 평가와 최악의 경우를, 그 밖의 사람에게는 실적과 소개를 제공한다.\n함정 · 1번은 내부 구조를 원하는 사람용이고, 3번은 그 외의 사람용이다. 4번 소스코드 공개는 표에 없다."}};
const LV = ["초급","중급","심화","제외"];
const LINKS = DATA.links || {};
const CONCEPTS = DATA.concepts || {};
const LINK_BASE = "../../courses/";
const KEY = "ml-mid-bank-v1";
const cls = q => q.x ? "제외" : q.d;
const qkey = q => q.w + "-" + q.id;
const STAR_N = DATA.qs.filter(q=>q.s).length;

const st = { weeks:new Set(), lv:new Set(), star:false, bmOnly:false, wrong:false, todo:false, reveal:false, text:"", ans:{}, bm:{}, imp:{}, memos:[], view:"quiz", viewAt:0 };
/* 필터 상태(주차 · 분류 · 보기 버튼 · 정답 모두 보기)도 저장해 다시 열어도 그대로 */
const VIEW_KEYS = ["star","bmOnly","wrong","todo","reveal"];
function viewObj(){ const v = {weeks:[...st.weeks], lv:[...st.lv]}; VIEW_KEYS.forEach(k=>v[k]=!!st[k]); return v; }
function applyView(v){
  if (!v) return;
  if (Array.isArray(v.weeks)) st.weeks = new Set(v.weeks);
  if (Array.isArray(v.lv)) st.lv = new Set(v.lv);
  VIEW_KEYS.forEach(k=>{ if (k in v) st[k] = !!v[k]; });
}

/* ---------- storage: this browser (cache) + account store (all devices) ---------- */
try{
  const s = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (s.ans) st.ans = s.ans;
  if (s.bm) st.bm = s.bm;
  if (Array.isArray(s.memos)) st.memos = s.memos;
  if (s.weeks) st.weeks = new Set(s.weeks);
  if (s.lv) st.lv = new Set(s.lv);
  if (s.imp) st.imp = s.imp;
  if (s.view){ applyView(s.view); st.viewAt = s.viewAt || 0; }
}catch(e){}
let viewSig = JSON.stringify(viewObj());

let cloud = null, cloudReady = false, writing = false, dirty = false, wt, localAt = 0;
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, weeks:[...st.weeks], lv:[...st.lv], view:viewObj(), viewAt:st.viewAt})); }catch(e){}
}
function syncMsg(cl, txt){ const s=$("#sync"); s.className="sync "+cl; s.lastElementChild.textContent=txt; }
async function flush(){
  if (!cloud || !cloudReady || writing) return;
  writing = true; dirty = false;
  try{ await cloud.set({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, view:viewObj(), viewAt:st.viewAt, at:localAt||Date.now()}); syncMsg("on","계정에 저장됨 · 다른 기기에서도 이어서 풀 수 있어요"); }
  catch(e){ syncMsg("err","계정 저장 실패 · 이 브라우저에는 저장됨"); }
  writing = false;
  if (dirty) flush();
}
function saveProgress(){
  localAt = Date.now();
  saveLocal();
  if (!cloud || !cloudReady) return;
  dirty = true; syncMsg("","저장 중…");
  clearTimeout(wt); wt = setTimeout(flush, 700);
}
function mergeMemos(a,b){
  const m = {}; [...a,...b].forEach(x=>{ if (!m[x.id] || (x.at||0) > (m[x.id].at||0)) m[x.id]=x; });
  return Object.values(m).sort((x,y)=>(y.at||0)-(x.at||0));
}
function same(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
async function initCloud(){
  try{
    const c = window.claude && await window.claude.use("db");
    const u = window.claude && await window.claude.use("user");
    const id = u && await u.id();
    if (!c || !id){ syncMsg("","이 브라우저에 저장됩니다"); const a=document.createElement("a"); a.href="https://claude.ai/artifact/32zV9aVcowEyFDMuzEp2KQ"; a.target="_blank"; a.rel="noopener"; a.textContent="기기 간 동기화 버전(Claude) 열기 ↗"; $("#sync").append(" · ",a); return; }
    cloud = c.doc("data/users/"+id+"/progress");
    const snap = await cloud.get();
    if (snap.exists){
      const d = snap.data() || {};
      // 계정 기록에 이 브라우저에서만 푼 기록을 합침
      st.ans = Object.assign({}, st.ans, d.ans||{});
      st.bm = Object.assign({}, st.bm, d.bm||{});
      st.imp = Object.assign({}, st.imp, d.imp||{});
      st.memos = mergeMemos(st.memos, d.memos||[]);
      if (d.view && (d.viewAt||0) > (st.viewAt||0)){ applyView(d.view); st.viewAt = d.viewAt; }
      viewSig = JSON.stringify(viewObj());
    }
    localAt = Math.max(localAt, (snap.data()||{}).at||0, Date.now());
    cloudReady = true;
    const sd = snap.data() || {};
    if (!snap.exists || !same({ans:st.ans, bm:st.bm, imp:st.imp, memos:st.memos, view:viewObj()},{ans:sd.ans||{}, bm:sd.bm||{}, imp:sd.imp||{}, memos:sd.memos||[], view:sd.view||null})) { dirty = true; flush(); }
    else syncMsg("on","계정에 저장됨 · 다른 기기에서도 이어서 풀 수 있어요");
    saveLocal(); update();
    cloud.onSnapshot(s=>{
      if (!s.exists || s.metadata?.hasPendingWrites || writing || dirty) return;
      const d = s.data() || {};
      if ((d.at||0) <= localAt) return;   // 내 기록보다 오래된 스냅샷은 무시
      localAt = d.at;
      if (same(d.ans||{}, st.ans) && same(d.bm||{}, st.bm) && same(d.imp||{}, st.imp) && same(d.memos||[], st.memos)) return;
      st.ans = d.ans || {}; st.bm = d.bm || {}; st.imp = d.imp || {}; st.memos = d.memos || [];
      saveLocal(); if (document.activeElement?.tagName !== "TEXTAREA") update();
    }, ()=>{});
  }catch(e){ syncMsg("err","계정 저장소에 연결하지 못함 · 이 브라우저에는 저장됨"); }
}

const $ = s => document.querySelector(s);
function el(tag, cl, txt){ const e=document.createElement(tag); if(cl) e.className=cl; if(txt!=null) e.textContent=txt; return e; }

/* ---------- chips ---------- */
function chip(label, count, pressed, onclick, extra){
  const b = el("button","chip"+(extra?" "+extra:""));
  b.append(label); if(count!=null){ const c=el("span","c",count); b.append(c); }
  b.setAttribute("aria-pressed", pressed); b.onclick = onclick; return b;
}
function renderChips(){
  const wr = $("#weekRow"); wr.querySelectorAll(".chip").forEach(c=>c.remove());
  wr.append(chip("전체", null, st.weeks.size===0, ()=>{ st.weeks.clear(); update(); }));
  DATA.weeks.forEach(w=>{
    wr.append(chip(w.w+"주차", null, st.weeks.has(w.w), ()=>{ toggle(st.weeks,w.w); update(); }));
  });
  const lr = $("#lvRow"); lr.querySelectorAll(".chip").forEach(c=>c.remove());
  const base = DATA.qs.filter(q => st.weeks.size===0 || st.weeks.has(q.w));
  lr.append(chip("전체", base.length, st.lv.size===0, ()=>{ st.lv.clear(); update(); }));
  LV.forEach(k=>{
    const b = chip(k, base.filter(q=>cls(q)===k).length, st.lv.has(k), ()=>{ toggle(st.lv,k); update(); }, "lv");
    b.dataset.k = k; lr.append(b);
  });
  const bmN = Object.keys(st.bm).length;
  $("#fStar").hidden = STAR_N===0;
  $("#fStar").textContent = "★ 중요 "+base.filter(q=>q.s).length;
  $("#fBm").textContent = "북마크 "+bmN;
  [["#fStar","star"],["#fBm","bmOnly"],["#fWrong","wrong"],["#fTodo","todo"],["#fReveal","reveal"]]
    .forEach(([id,k])=>$(id).setAttribute("aria-pressed", st[k]));
}
function toggle(set,v){ set.has(v) ? set.delete(v) : set.add(v); }

/* ---------- filtering ---------- */
function visible(){
  const t = st.text.trim().toLowerCase();
  return DATA.qs.filter(q=>{
    if (st.weeks.size && !st.weeks.has(q.w)) return false;
    if (st.lv.size && !st.lv.has(cls(q))) return false;
    if (st.star && !q.s) return false;
    if (st.bmOnly && !st.bm[qkey(q)]) return false;
    const a = st.ans[qkey(q)];
    if (st.wrong && !(a!=null && a!==q.a)) return false;
    if (st.todo && (q.x || a!=null)) return false;
    if (t && !(q.q+" "+q.o.join(" ")+" "+q.e+" "+(q.s||[]).join(" ")).toLowerCase().includes(t)) return false;
    return true;
  });
}

/* ---------- status ---------- */
let confirmReset = false;
function renderStatus(list){
  const s = $("#status"); s.innerHTML = "";
  const solvable = list.filter(q=>!q.x);
  let ok=0, no=0;
  solvable.forEach(q=>{ const a=st.ans[qkey(q)]; if(a==null) return; a===q.a?ok++:no++; });
  const done = ok+no;
  const add = (cl, label, val) => { const sp=el("span",cl); sp.append(label+" "); sp.append(el("b",null,val)); s.append(sp); };
  add("", "표시", list.length+"문제");
  add("", "풀이", done+" / "+solvable.length);
  add("ok", "정답", ok);
  add("no", "오답", no);
  if (done) add("", "정답률", Math.round(ok/done*100)+"%");
  const m = el("div","meter"); const n = solvable.length || 1;
  const a = el("i","m-ok"); a.style.width = (ok/n*100)+"%";
  const b = el("i","m-no"); b.style.width = (no/n*100)+"%";
  m.append(a,b); s.append(m);
  if (!confirmReset){
    const r = el("button","tool","풀이 기록 초기화"); r.onclick=()=>{ confirmReset=true; renderStatus(list); }; s.append(r);
  } else {
    const box = el("span","confirm","모든 풀이 기록을 지울까요? (북마크는 남아요)");
    const y = el("button","tool danger","지우기"); y.onclick=()=>{ st.ans={}; confirmReset=false; saveProgress(); update(); };
    const c = el("button","tool","취소"); c.onclick=()=>{ confirmReset=false; renderStatus(list); };
    box.append(y,c); s.append(box);
  }
}

/* ---------- cards ---------- */
const N = ["1","2","3","4","5"];
const BM_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h8v11l-4-2.8-4 2.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function refresh(c,q){ c.replaceWith(card(q)); const l=visible(); renderStatus(l); renderMini(l); }
function card(q){
  const k = qkey(q), a = st.ans[k], ex = !!q.x;
  const shown = ex || a!=null || st.reveal;
  const c = el("article","q"+(ex?" is-ex":"")+(q.s?" is-star":"")); c.id = "q"+k;
  const meta = el("div","meta");
  meta.append(el("span","num", q.w+"주차 · "+q.id+"번"));
  meta.append(el("span","badge b-"+cls(q), cls(q)));
  if (q.s) meta.append(el("span","star", "★ "+q.s.join(" · ")));
  if (ex){ meta.append(el("span","badge b-"+q.d, q.d)); meta.append(el("span","why", q.x)); }
  const w = DATA.weeks[q.w-1];
  meta.append(el("span","sec", q.sec+" "+(w.secs[q.sec]||"")));
  if (!ex && a!=null) meta.append(el("span","res "+(a===q.a?"ok":"no"), a===q.a?"정답":"오답"));
  const bm = el("button","bm"); bm.type="button"; bm.innerHTML = BM_SVG;
  const on = !!st.bm[k];
  bm.setAttribute("aria-pressed", on); bm.setAttribute("aria-label", on?"북마크 해제":"북마크");
  bm.title = on ? "북마크 해제" : "북마크";
  bm.onclick = ()=>{ if (st.bm[k]) delete st.bm[k]; else st.bm[k]=1; saveProgress(); renderChips(); refresh(c,q); };
  meta.append(bm);
  c.append(meta);
  c.append(el("p","qt", q.q));
  const opts = el("div","opts");
  q.o.forEach((t,i)=>{
    const b = el("button","opt"); b.type="button";
    b.append(el("span","n",N[i])); b.append(el("span","t",t));
    if (shown){
      b.disabled = true;
      if (i===q.a){ b.classList.add("correct"); b.append(el("span","mark","정답")); }
      else if (a===i){ b.classList.add("wrong"); b.append(el("span","mark","내 선택")); }
    } else {
      b.onclick = ()=>{ st.ans[k]=i; saveProgress(); refresh(c,q); };
    }
    opts.append(b);
  });
  c.append(opts);
  if (shown){
    const e = el("div","exp");
    const graded = !ex && a!=null, good = a===q.a;
    const h = el("h4",null, graded ? (good ? "✓ 정답입니다" : "✕ 다시 확인해 보세요 · 정답 "+N[q.a]+"번") : "해설 · 정답 "+N[q.a]+"번");
    if (graded) e.classList.add(good ? "ok" : "no");
    e.append(h, el("p",null,q.e));
    const w = DATA.weeks[q.w-1];
    const cx = CONCEPTS[qkey(q)];
    if (cx){
      const box = el("div","concept");
      box.append(el("h5",null,"📘 개념 다시 보기"));
      cx.split("\n").forEach(line=>{
        const m = line.match(/^(\S+) · (.*)$/), pp = el("p");
        if (m){ pp.append(el("b",null,m[1])); pp.append(" "+m[2]); } else pp.textContent = line;
        box.append(pp);
      });
      e.append(box);
    }
    const href = LINKS[q.w+"|"+q.sec] || LINKS[q.w+"|"];
    if (href){
      const r = el("a","ref","관련 단원 · "+q.sec+" "+(w.secs[q.sec]||"")+" — 개념 정리 보기 ↗");
      r.href = LINK_BASE + href; r.target = "_blank"; r.rel = "noopener"; e.append(r);
    } else e.append(el("span","ref","관련 단원 · "+q.sec+" "+(w.secs[q.sec]||"")));
    c.append(e);
  }
  const f = el("div","qfoot");
  const mb = el("button","qmemo","메모"); mb.type="button"; mb.onclick=()=>newMemo(q);
  f.append(mb);
  if (!ex && a!=null){
    const r = el("button","link","다시 풀기"); r.onclick=()=>{ delete st.ans[k]; saveProgress(); refresh(c,q); };
    f.append(r);
  }
  c.append(f);
  return c;
}

function renderList(list){
  const root = $("#list"); root.innerHTML = "";
  if (!list.length){
    root.append(el("p","empty", st.bmOnly && !Object.keys(st.bm).length
      ? "아직 북마크한 문제가 없습니다. 문제 오른쪽 위의 책갈피 버튼을 눌러 추가하세요."
      : "조건에 맞는 문제가 없습니다. 분류나 주차 선택을 바꿔 보세요."));
    return;
  }
  const frag = document.createDocumentFragment();
  let cur = 0;
  list.forEach(q=>{
    if (q.w!==cur){
      cur = q.w; const w = DATA.weeks[cur-1];
      const h = el("section","week"); h.id = "week"+cur;
      h.append(el("div","wk","WEEK "+String(cur).padStart(2,"0")));
      h.append(el("h2",null, cur+"주차 · "+w.t));
      const inWeek = list.filter(x=>x.w===cur);
      const counts = LV.map(k=>[k,inWeek.filter(x=>cls(x)===k).length]).filter(x=>x[1]).map(x=>x[0]+" "+x[1]).join(" · ");
      const sn = inWeek.filter(x=>x.s).length;
      h.append(el("div","wmeta", inWeek.length+"문제 — "+counts+(sn?" · ★ "+sn:"")));
      frag.append(h);
    }
    frag.append(card(q));
  });
  root.append(frag);
}

function update(){
  const vs = JSON.stringify(viewObj());
  if (vs !== viewSig){ viewSig = vs; st.viewAt = Date.now(); saveProgress(); }
  saveLocal(); renderChips(); const list=visible(); renderStatus(list); renderList(list); renderMini(list);
  renderMemos();
}

/* ---------- collapsing filter bar ---------- */
function renderMini(list){
  const parts = [];
  parts.push(st.weeks.size ? [...st.weeks].sort((a,b)=>a-b).join("·")+"주차" : "전체 주차");
  if (st.lv.size) parts.push([...st.lv].join("·"));
  if (st.star) parts.push("★ 중요"); if (st.bmOnly) parts.push("북마크");
  if (st.reveal) parts.push("정답 보기");
  if (st.wrong) parts.push("틀린 문제"); if (st.todo) parts.push("안 푼 문제");
  const solv = list.filter(q=>!q.x), done = solv.filter(q=>st.ans[qkey(q)]!=null).length;
  const t = $("#miniTxt"); t.textContent = parts.join(" · ")+" — ";
  const b = el("b",null,list.length+"문제"); t.append(b, " · 풀이 "+done+"/"+solv.length);
}
const bar = $("#bar"); let lastY = window.scrollY, pinOpen = false, anchorY = 0;
function setCollapsed(on){ bar.classList.toggle("is-collapsed", on); $("#collapse").hidden = on || !pinOpen; }
window.addEventListener("scroll", ()=>{
  const y = window.scrollY, top = $(".views").offsetTop + $(".views").offsetHeight + 80;
  if (Date.now() < quietUntil){ anchorY = lastY = y; return; }
  if (st.view!=="quiz" || y < top){ pinOpen=false; setCollapsed(false); lastY=y; return; }
  if (pinOpen){ if (y - anchorY > 60){ pinOpen=false; setCollapsed(true); } }
  else if (y > lastY + 6) setCollapsed(true);
  lastY = y;
}, {passive:true});
let quietUntil = 0;
$("#expand").onclick = ()=>{
  pinOpen = true; setCollapsed(false); quietUntil = Date.now()+400;
  requestAnimationFrame(()=>{ anchorY = lastY = window.scrollY; });
};
$("#collapse").onclick = ()=>{
  pinOpen = false; setCollapsed(true); quietUntil = Date.now()+400;
  requestAnimationFrame(()=>{ anchorY = lastY = window.scrollY; });
};

/* ---------- memo pad ---------- */
const fmt = t => { const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function setView(v){
  st.view = v;
  $("#vQuiz").setAttribute("aria-selected", v==="quiz"); $("#vMemo").setAttribute("aria-selected", v==="memo");
  $("#bar").hidden = v!=="quiz"; $("#list").hidden = v!=="quiz"; $("#memoView").hidden = v!=="memo";
  setCollapsed(false);
}
let backTo = null;   // {y, key} 메모로 넘어가기 전 문제 화면 위치
function rememberQuiz(q){ if (st.view==="quiz") backTo = {y:window.scrollY, key:q?qkey(q):null}; }
function backToQuiz(){
  setView("quiz");
  const b = backTo; backTo = null; renderBack();
  if (!b) return;
  const c = b.key && document.getElementById("q"+b.key);
  if (c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); setTimeout(()=>c.classList.remove("flash"),1600); }
  else window.scrollTo({top:b.y});
}
function renderBack(){ $("#memoBack").hidden = !backTo; }
function goMemo(q){
  rememberQuiz(q);
  try{ history.pushState({memo:1}, ""); }catch(e){}
  setView("memo"); renderBack(); window.scrollTo({top:0});
}
window.addEventListener("popstate", ()=>{ if (st.view==="memo") backToQuiz(); });
function newMemo(q){
  const m = {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), t:"", at:Date.now()};
  if (q){ m.ref = qkey(q); m.t = "["+q.w+"주차 "+q.id+"번] "; }
  st.memos.unshift(m); saveProgress();
  if (st.view==="quiz") goMemo(q);
  renderMemos();
  const ta = $("#memoList textarea"); if (ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
let confirmDel = null;
function renderMemos(){
  $("#memoN").textContent = st.memos.length || "";
  const root = $("#memoList");
  if ($("#memoView").hidden) return;
  const ae = document.activeElement;
  if (ae && ae.tagName==="TEXTAREA" && root.contains(ae)) return;
  root.innerHTML = "";
  if (!st.memos.length){ root.append(el("p","empty","아직 메모가 없습니다. ‘새 메모’를 눌러 시작하세요.")); return; }
  st.memos.forEach(m=>{
    const box = el("div","memo");
    if (m.ref){
      const [w,id] = m.ref.split("-").map(Number); const q = DATA.qs.find(x=>x.w===w && x.id===id);
      if (q){ const r = el("button","memo-ref", w+"주차 "+id+"번 문제로 이동"); r.type="button"; r.onclick=()=>gotoQ(q); box.append(r); }
    }
    const ta = el("textarea"); ta.value = m.t; ta.id = "memo-"+m.id; ta.setAttribute("aria-label","메모 내용");
    ta.placeholder = "메모를 입력하세요";
    const foot = el("div","memo-foot");
    const when = el("span",null,"수정 "+fmt(m.at));
    ta.oninput = ()=>{ m.t = ta.value; m.at = Date.now(); when.textContent = "수정 "+fmt(m.at); saveProgress(); };
    ta.onblur = ()=>{ if (!m.t.trim()){ st.memos = st.memos.filter(x=>x!==m); saveProgress(); setTimeout(renderMemos); } };
    foot.append(when, el("span","sp"));
    if (confirmDel===m.id){
      const y = el("button","tool danger","삭제"); y.onclick=()=>{ st.memos = st.memos.filter(x=>x!==m); confirmDel=null; saveProgress(); renderMemos(); };
      const n = el("button","tool","취소"); n.onclick=()=>{ confirmDel=null; renderMemos(); };
      foot.append(el("span",null,"이 메모를 지울까요?"), y, n);
    } else {
      const d = el("button","tool","삭제"); d.onclick=()=>{ confirmDel=m.id; renderMemos(); };
      foot.append(d);
    }
    box.append(ta, foot); root.append(box);
  });
}
function gotoQ(q){
  backTo = {y:0, key:qkey(q)};
  if (!document.getElementById("q"+qkey(q))){   // 지금 필터에 안 보이는 문제면 필터를 풀어서 보여 줌
    st.weeks.clear(); st.lv.clear(); st.star=st.bmOnly=st.wrong=st.todo=false; st.text=""; $("#q").value=""; update();
  }
  if (history.state && history.state.memo){ try{ history.back(); return; }catch(e){} }
  backToQuiz();
}
$("#vQuiz").onclick=()=>{ if (st.view==="memo"){ if (history.state && history.state.memo){ try{ history.back(); return; }catch(e){} } backToQuiz(); } };
$("#vMemo").onclick=()=>{ if (st.view!=="memo"){ goMemo(null); renderMemos(); } };
$("#memoBack").onclick=()=>$("#vQuiz").onclick();
$("#memoAdd").onclick=()=>newMemo(null);

$("#fStar").onclick=()=>{ st.star=!st.star; update(); };
$("#fBm").onclick=()=>{ st.bmOnly=!st.bmOnly; update(); };
$("#fWrong").onclick=()=>{ st.wrong=!st.wrong; if(st.wrong) st.todo=false; update(); };
$("#fTodo").onclick=()=>{ st.todo=!st.todo; if(st.todo) st.wrong=false; update(); };
$("#fReveal").onclick=()=>{ st.reveal=!st.reveal; update(); };
let tm; $("#q").oninput=e=>{ clearTimeout(tm); tm=setTimeout(()=>{ st.text=e.target.value; update(); },180); };
$("#totop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

update();
initCloud();
</script>
