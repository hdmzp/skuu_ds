<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7주차 · K-최근접 이웃(K-NN)과 설명 가능한 인공지능(XAI) 100문제</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 7 · K-최근접 이웃(K-NN) &amp; 설명 가능한 인공지능(XAI)</div>
    <h1>7주차 &middot; K-최근접 이웃(K-NN)과 설명 가능한 인공지능(XAI) — 100문제</h1>
    <p class="sub">강의자료 7.1~7.7절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    7주차 강의자료(K 최근접 이웃 / XAI) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "7.1", "diff": "기초", "q": "7주차 강의자료가 제시한 학습 목표 두 가지로 옳은 것은?", "opts": ["군집화(Clustering)와 차원 축소(Dimensionality Reduction)", "모델 기반 학습과 사례 기반 학습, 그리고 K 최근접 이웃(kNN)", "합성곱 신경망(CNN)과 순환 신경망(RNN)", "선형회귀(Linear Regression)와 정규화(Regularization) 기법"], "a": 1, "exp": "학습 목표 슬라이드에는 '모델 기반 학습과 사례 기반 학습'과 'K 최근접 이웃(kNN)' 두 항목만 제시되어 있다."}, {"id": 2, "sec": "7.1", "diff": "기초", "q": "모델 기반 학습(Model-based Learning)에 대한 설명으로 가장 적절한 것은?", "opts": ["훈련 데이터로부터 모델 f의 파라미터를 최적화하여 최적의 함수 f*를 생성한다", "훈련 데이터를 그대로 저장해 두었다가 예측 때마다 전부 비교한다", "테스트 데이터의 라벨을 이용해 파라미터를 반복 갱신한다", "거리 측도로 이웃을 탐색해 다수결로 라벨을 정한다"], "a": 0, "exp": "모델 기반 학습은 훈련 데이터로 모델 f의 파라미터를 최적화해 최적 함수 f*를 만드는 방식이다. 나머지 보기는 사례 기반 학습(kNN)의 설명에 가깝다."}, {"id": 3, "sec": "7.1", "diff": "중급", "q": "모델 기반 학습에서 모델 생성을 한 번 완료한 뒤, 테스트 데이터를 처리하는 방식으로 옳은 것은?", "opts": ["테스트 데이터마다 훈련 데이터 전체와의 거리를 다시 계산한다", "테스트 데이터를 이용해 파라미터를 다시 최적화한다", "단순하게 함수 f*의 연산만으로 예측값을 도출한다", "이웃 k개를 뽑아 다수결로 라벨을 결정한다"], "a": 2, "exp": "강의자료는 '한 번 모델 생성을 완료하면 테스트 데이터에 대해서는 단순하게 함수 f*의 연산으로 예측값을 도출'한다고 설명한다."}, {"id": 4, "sec": "7.1", "diff": "기초", "q": "강의자료에서 모델 기반 학습 방법의 예로 열거된 것이 아닌 것은?", "opts": ["선형회귀", "로지스틱회귀", "다층 퍼셉트론(MLP)", "k 최근접 이웃(kNN)"], "a": 3, "exp": "선형회귀·로지스틱회귀·퍼셉트론·다층 퍼셉트론이 모델 기반 학습의 예로 제시되었고, kNN은 사례 기반 학습의 대표 방법이다."}, {"id": 5, "sec": "7.1", "diff": "기초", "q": "사례 기반 학습(Instance-based Learning)의 가장 큰 특징은 무엇인가?", "opts": ["학습 단계에서 손실함수를 최소화해 파라미터를 구한다", "경사하강법으로 최적 함수를 탐색한다", "훈련 데이터를 버리고 함수만 남겨 저장 공간을 절약한다", "별도의 모델을 생성하지 않는 방식이다"], "a": 3, "exp": "사례 기반 학습은 '별도의 모델을 생성하지 않는 방식'으로 정의되며, 예측 시점마다 학습 데이터를 직접 사용한다."}, {"id": 6, "sec": "7.1", "diff": "중급", "q": "사례 기반 학습에서 예측값 연산이 이루어지는 시점은 언제인가?", "opts": ["훈련 데이터를 모두 읽어들인 직후 한 번만", "모델의 파라미터가 수렴했을 때", "테스트 데이터가 들어올 때마다 학습 데이터를 기반으로", "검증 데이터로 초매개변수를 확정한 직후 한 번만"], "a": 2, "exp": "사례 기반 학습은 테스트 데이터가 들어올 때마다 학습 데이터를 기반으로 예측값을 연산한다."}, {"id": 7, "sec": "7.1", "diff": "기초", "q": "강의자료가 사례 기반 학습의 대표적인 방법으로 제시한 알고리즘은?", "opts": ["k 최근접 이웃(kNN)", "퍼셉트론", "로지스틱회귀", "선형회귀"], "a": 0, "exp": "'k 최근접 이웃이 대표적인 사례 기반 학습 방법임'이라고 명시되어 있다."}, {"id": 8, "sec": "7.1", "diff": "중급", "q": "<그림1> 모델 기반 학습 예시에서 '테스트단계'가 수행하는 일은 무엇인가?", "opts": ["파라미터를 최적화하여 f*를 생성한다", "f*(x'_i)와 y'_i의 일치율을 비교한다", "훈련 데이터셋과 테스트 데이터셋을 하나로 병합한다", "적절한 함수 f를 새로 선정한다"], "a": 1, "exp": "<그림1>의 테스트단계는 f*(x'_i)와 실제 라벨 y'_i의 일치율을 비교하는 단계이다. 파라미터 최적화와 f* 생성은 학습(훈련)단계의 일이다."}, {"id": 9, "sec": "7.1", "diff": "중급", "q": "<그림2> 인스턴스 기반 학습 예시의 처리 흐름으로 옳은 것은?", "opts": ["모델 f를 먼저 선정한 뒤 파라미터를 최적화한다", "테스트 데이터로 f를 만든 뒤 훈련 데이터에 적용한다", "훈련 데이터로 f*를 만들고 테스트 데이터로 f*를 갱신한다", "훈련 데이터로 특징벡터 x'_i에 대한 ŷ'_i를 연산한 뒤 y'_i와 일치율을 비교한다"], "a": 3, "exp": "<그림2>는 훈련 데이터셋과 테스트 데이터셋이 함께 들어가 ŷ'_i를 연산하고, 이를 실제 y'_i와 비교하는 구조로 그려져 있다. 모델 f를 만드는 단계 자체가 없다."}, {"id": 10, "sec": "7.1", "diff": "심화", "q": "모델 기반 학습과 사례 기반 학습을 비교한 설명으로 옳지 않은 것은?", "opts": ["모델 기반 학습은 학습(훈련)단계에서 최적의 함수 f*를 미리 만들어 둔다", "사례 기반 학습은 별도의 모델 생성 단계를 두지 않는다", "사례 기반 학습은 예측 시점에 훈련 데이터가 더 이상 필요하지 않다", "kNN은 사례 기반 학습에 속하고 로지스틱회귀는 모델 기반 학습에 속한다"], "a": 2, "exp": "사례 기반 학습은 테스트 데이터가 들어올 때마다 학습 데이터를 기반으로 연산하므로, 예측 시점에도 훈련 데이터가 반드시 필요하다."}, {"id": 11, "sec": "7.2", "diff": "기초", "q": "k 최근접 이웃(k-Nearest Neighbor)에서 K가 의미하는 것은?", "opts": ["학습을 반복하는 횟수", "특징벡터 성분의 수", "근접해 있는 데이터 중 몇 개를 확인할 것인지", "전체 클래스(라벨)의 개수"], "a": 2, "exp": "강의자료는 'K는 근접해 있는 데이터 중 몇 개를 확인할 것인지를 의미한다'고 정의한다."}, {"id": 12, "sec": "7.2", "diff": "기초", "q": "1 최근접 이웃(k=1)에서 새로운 관측치의 라벨은 어떻게 정해지는가?", "opts": ["기존 데이터 중 가장 유사한 데이터와 동일한 라벨로 설정한다", "전체 데이터의 최빈 라벨로 설정한다", "전체 데이터 라벨의 평균값으로 설정한다", "가장 멀리 있는 데이터의 라벨로 설정한다"], "a": 0, "exp": "k=1은 '새로운 관측치와 가장 유사한(가까운) 데이터와 동일한 라벨로 설정'하는 방식이다."}, {"id": 13, "sec": "7.2", "diff": "기초", "q": "<그림3>의 키-몸무게 데이터에서 k=1로 New Data를 분류한 결과는?", "opts": ["저체중", "정상", "비만", "동률이라 분류 불가"], "a": 1, "exp": "k=1에서는 가장 가까운 1번 이웃이 초록색(정상)이므로 New Data는 '정상'으로 분류된다."}, {"id": 14, "sec": "7.2", "diff": "중급", "q": "<그림3>에서 동일한 New Data를 k=3으로 분류했을 때의 결과는?", "opts": ["저체중", "정상", "비만", "저체중과 정상의 동률"], "a": 2, "exp": "k=3에서는 이웃 3개 중 파란색(비만)이 2개, 초록색(정상)이 1개이므로 다수결에 의해 '비만'으로 분류된다."}, {"id": 15, "sec": "7.2", "diff": "기초", "q": "k=3일 때 새로운 관측치의 라벨을 결정하는 규칙은 무엇인가?", "opts": ["가장 먼 데이터의 라벨을 따른다", "이웃까지의 거리 평균값을 라벨로 삼는다", "세 이웃 중 임의로 하나를 골라 그 라벨을 쓴다", "주변 데이터의 라벨에 따라 다수결로 결정한다"], "a": 3, "exp": "강의자료는 'k=3일 때 주변 데이터의 라벨에 따라 다수결로 새로운 라벨을 결정한다'고 설명한다."}, {"id": 16, "sec": "7.2", "diff": "심화", "q": "<그림3>에서 같은 관측치인데도 k=1과 k=3의 분류 결과가 달라진 이유로 가장 적절한 것은?", "opts": ["거리 측도를 유클리디안에서 맨하탄으로 바꾸었기 때문", "k=1은 가장 가까운 '정상' 1개만 보지만, k=3에서는 '비만' 2개가 추가로 포함되어 다수결이 뒤바뀌기 때문", "k=3에서는 훈련 데이터를 다시 학습해 모델이 바뀌기 때문", "k가 커지면 라벨을 평균내어 회귀값으로 바꾸기 때문"], "a": 1, "exp": "탐색 반경이 넓어지면서 2·3번째 이웃인 비만 데이터 2개가 포함되어 다수결 결과가 정상에서 비만으로 바뀐다. kNN은 학습 과정이 없으므로 재학습은 일어나지 않는다."}, {"id": 17, "sec": "7.2", "diff": "기초", "q": "<그림3>에서 라벨 y_i로 사용된 세 가지 범주는?", "opts": ["저체중, 정상, 비만", "저체중, 과체중, 고도비만", "정상, 확진, 의심", "미달, 적정, 초과"], "a": 0, "exp": "<그림3>의 범례는 저체중(빨강), 정상(초록), 비만(파랑) 세 가지 라벨 y_i를 나타낸다."}, {"id": 18, "sec": "7.2", "diff": "기초", "q": "<그림3>의 두 좌표축에 사용된 특징(feature)은 무엇인가?", "opts": ["나이(x_i1)와 몸무게(x_i2)", "중간고사 점수와 수시 점수", "몸무게(x_i1)와 키(x_i2)", "유전자1과 유전자2"], "a": 2, "exp": "<그림3>은 가로축이 몸무게(x_i1), 세로축이 키(x_i2)인 산점도로 비만 여부를 판단하는 분류 데이터이다."}, {"id": 19, "sec": "7.2", "diff": "중급", "q": "테이블 데이터에서 '근접한 관측치'를 계산하기 위해 필요한 것은?", "opts": ["활성화 함수", "거리측도", "손실함수", "규제(regularization) 항"], "a": 1, "exp": "강의자료는 '테이블 데이터에서는 근접한 관측치를 어떻게 계산할까? → 거리측도'라고 답한다."}, {"id": 20, "sec": "7.2", "diff": "중급", "q": "표기 D={(x_i, y_i)} (i=1~7), x_i=[x_i1 x_i2]^T, y_i∈{0,1}이 뜻하는 바로 옳은 것은?", "opts": ["관측치가 2개이고 특징이 7개이다", "관측치가 7개이고 라벨의 종류가 7가지이다", "특징이 7개이고 라벨이 연속형이다", "관측치가 7개, 특징벡터 성분이 2개, 라벨은 0 또는 1이다"], "a": 3, "exp": "i가 1부터 7까지이므로 관측치는 7개, x_i가 2개 성분을 가지므로 특징은 2개, y_i∈{0,1}이므로 이진 라벨이다."}, {"id": 21, "sec": "7.2", "diff": "중급", "q": "'새로운 데이터가 발생한 이후에 클래스 예측이 수행된다'는 성질은 무엇의 특징인가?", "opts": ["사례(인스턴스) 기반 학습", "모델 기반 학습", "강화학습", "비지도 학습"], "a": 0, "exp": "강의자료는 이 성질을 '사례(인스턴스) 기반 학습의 특징'으로 명시한다."}, {"id": 22, "sec": "7.2", "diff": "심화", "q": "<그림3>과 같은 산점도 표현이 테이블 데이터에 kNN을 적용할 때 갖는 의미로 가장 적절한 것은?", "opts": ["테이블 데이터는 산점도로 표현할 수 없어 별도의 모델이 필요하다는 뜻", "라벨이 연속형일 때만 좌표 표현이 가능하다는 뜻", "테이블 데이터의 특징 벡터를 좌표 공간에 표현할 수 있으므로 거리 계산이 가능하다는 뜻", "특징이 2개를 넘으면 거리 계산이 불가능하다는 뜻"], "a": 2, "exp": "'<그림3>처럼 테이블 데이터의 특징 벡터를 좌표 공간에 표현할 수 있음을 기억'하라는 설명대로, 좌표 표현이 가능해야 거리측도로 근접성을 계산할 수 있다."}, {"id": 23, "sec": "7.2", "diff": "중급", "q": "<표1>의 라벨 y_i가 0과 1 두 값만 갖는다는 사실로부터 알 수 있는 것은?", "opts": ["회귀 문제이므로 이웃 값의 평균을 구해야 한다", "라벨이 세 종류이므로 다수결이 성립하지 않는다", "거리 측도를 사용할 수 없다", "이진 분류 문제이므로 이웃들의 다수결로 클래스를 결정할 수 있다"], "a": 3, "exp": "y_i∈{0,1}은 비만 여부를 나타내는 범주형 이진 라벨이므로 kNN 분류(다수결)를 적용한다. 평균을 취하는 것은 y가 연속형인 회귀 문제의 방식이다."}, {"id": 24, "sec": "7.3", "diff": "기초", "q": "유클리디안 거리(Euclidean Distance)에 대한 설명으로 옳은 것은?", "opts": ["가장 많이 사용하는 거리측도로, 고등수학 과정의 직선거리(점과 점 사이의 거리)에 해당한다", "격자 형태의 이동만 허용하는 측도이다", "두 벡터의 내적으로 유사도를 구하는 측도이다", "대응 성분 차이의 절댓값을 모두 더한 값이다"], "a": 0, "exp": "강의자료는 유클리디안 거리를 '가장 많이 사용하는 거리측도 → 고등수학 과정의 직선거리, 점과 점 사이의 거리'로 소개한다. 절댓값 합은 맨하탄 거리이다."}, {"id": 25, "sec": "7.3", "diff": "기초", "q": "유클리디안 거리의 계산 방법을 올바르게 서술한 것은?", "opts": ["대응되는 특징벡터 성분 차이의 절댓값 합", "대응되는 특징벡터 성분 차이 합의 제곱", "대응되는 관측치의 특징벡터 간 차이 제곱 합의 제곱근", "대응되는 특징벡터 성분 곱의 합"], "a": 2, "exp": "유클리디안 거리는 '대응되는 관측치의 특징벡터 간 차이 제곱 합의 제곱근'으로 정의된다."}, {"id": 26, "sec": "7.3", "diff": "중급", "q": "<표1>에서 생도7(몸무게 9, 키 2)과 생도3(몸무게 3, 키 3)의 유클리디안 거리는 얼마인가?", "opts": ["√13 ≈ 3.61", "√37 ≈ 6.08", "√45 ≈ 6.71", "7.00"], "a": 1, "exp": "√((9−3)² + (2−3)²) = √(36+1) = √37 ≈ 6.08 이다. 7.00은 같은 두 점의 맨하탄 거리이다."}, {"id": 27, "sec": "7.3", "diff": "중급", "q": "유클리디안 거리 수식에서 p가 의미하는 것은?", "opts": ["관측치(데이터)의 개수", "탐색할 이웃의 개수", "클래스의 개수", "특징벡터 성분의 수"], "a": 3, "exp": "수식에 'p는 특징벡터 성분의 수'라고 명시되어 있으며, <표1>에서는 몸무게와 키 두 개이므로 p=2이다."}, {"id": 28, "sec": "7.3", "diff": "기초", "q": "맨하탄 거리(Manhattan Distance)의 계산식으로 옳은 것은?", "opts": ["대응되는 성분 차이의 절댓값을 모두 더한 값", "성분 차이 제곱 합의 제곱근", "성분 차이 중 최댓값", "성분 차이 제곱의 평균"], "a": 0, "exp": "맨하탄 거리는 Σ|x_1j − x_2j| 로, 각 성분 차이의 절댓값을 모두 더해 구한다."}, {"id": 29, "sec": "7.3", "diff": "중급", "q": "<표1>에서 생도7(9,2)과 생도3(3,3)의 맨하탄 거리는 얼마인가?", "opts": ["5", "6", "7", "9"], "a": 2, "exp": "|9−3| + |2−3| = 6 + 1 = 7 이다."}, {"id": 30, "sec": "7.3", "diff": "기초", "q": "강의자료가 설명한 맨하탄 거리의 활용에 대한 서술로 옳은 것은?", "opts": ["일상생활에서 가장 널리 쓰이는 대표적 거리 개념이다", "특징이 2개일 때만 정의할 수 있다", "머신러닝에서는 사용할 수 없는 거리이다", "일상생활에서는 잘 사용하지 않으나 머신러닝 혹은 프로그래밍에서 사용되는 경우가 있다"], "a": 3, "exp": "'일상생활에서는 잘 사용하지 않으나, 머신러닝 혹은 프로그래밍에서 사용되는 경우도 있음'이라고 설명되어 있다."}, {"id": 31, "sec": "7.3", "diff": "중급", "q": "맨하탄 거리를 직관적으로 설명하기 위해 강의자료가 든 예시는?", "opts": ["비행기가 두 도시를 직선으로 잇는 항로", "빛이 진공에서 최단 경로로 진행하는 경로", "지구본 위 두 점을 잇는 대원(great circle)", "실제 뉴욕의 맨하탄과 같은 구획에서 이동할 때의 경로"], "a": 3, "exp": "'실제 뉴욕의 맨하탄과 같은 구획에서 이동할 때는 맨하탄 거리처럼 이동해야 함'이라는 예시가 제시된다."}, {"id": 32, "sec": "7.3", "diff": "심화", "q": "생도7과 생도3에 대해 유클리디안 거리(≈6.08)와 맨하탄 거리(7)를 비교한 설명으로 옳은 것은?", "opts": ["같은 두 점이라도 사용하는 거리측도에 따라 거리 값이 달라진다", "두 측도는 언제나 동일한 값을 준다", "맨하탄 거리는 항상 유클리디안 거리보다 작다", "유클리디안 거리는 정수 값만 가질 수 있다"], "a": 0, "exp": "동일한 두 점에 대해 유클리디안 6.08과 맨하탄 7이 나온 것처럼, 거리측도 선택에 따라 값이 달라지므로 거리측도는 kNN의 중요한 선택 사항이다."}, {"id": 33, "sec": "7.3", "diff": "심화", "q": "<표1>에서 생도1(1,0)과 생도6(6,5)의 유클리디안 거리는?", "opts": ["√10 ≈ 3.16", "√25 = 5.00", "√50 ≈ 7.07", "√61 ≈ 7.81"], "a": 2, "exp": "√((1−6)² + (0−5)²) = √(25+25) = √50 ≈ 7.07 이다."}, {"id": 34, "sec": "7.3", "diff": "심화", "q": "<표1>에서 생도1(1,0)과 생도6(6,5)의 맨하탄 거리는?", "opts": ["5", "10", "25", "7"], "a": 1, "exp": "|1−6| + |0−5| = 5 + 5 = 10 이다. 같은 쌍의 유클리디안 거리 √50 ≈ 7.07보다 크다."}, {"id": 35, "sec": "7.3", "diff": "중급", "q": "<표1>에서 생도2(2,1)와 생도4(5,2)의 유클리디안 거리는?", "opts": ["√4 = 2.00", "√8 ≈ 2.83", "√13 ≈ 3.61", "√10 ≈ 3.16"], "a": 3, "exp": "√((2−5)² + (1−2)²) = √(9+1) = √10 ≈ 3.16 이다."}, {"id": 36, "sec": "7.3", "diff": "심화", "q": "유클리디안 거리와 맨하탄 거리에 대한 설명으로 옳지 않은 것은?", "opts": ["둘 다 대응되는 특징벡터 성분끼리 비교하여 계산한다", "유클리디안 거리는 고등수학 과정의 직선거리 개념에 해당한다", "맨하탄 거리는 성분 차이를 제곱해 더한 뒤 제곱근을 취해 구한다", "두 측도 모두 kNN의 거리 측도로 사용할 수 있다"], "a": 2, "exp": "제곱 후 제곱근을 취하는 것은 유클리디안 거리이며, 맨하탄 거리는 성분 차이의 절댓값을 단순히 합산한다."}, {"id": 37, "sec": "7.4", "diff": "기초", "q": "kNN 분류 알고리즘의 Step1에 해당하는 것은?", "opts": ["k개의 이웃을 다수결로 집계한다", "새로운 관측치가 들어온다", "훈련 데이터로 파라미터를 최적화한다", "거리 측도를 학습을 통해 결정한다"], "a": 1, "exp": "Step1은 '새로운 관측치가 들어옴'이다. kNN에는 파라미터 최적화 단계가 없다."}, {"id": 38, "sec": "7.4", "diff": "기초", "q": "kNN 분류 알고리즘의 Step2에 해당하는 것은?", "opts": ["새 관측치의 클래스를 다수결로 정의한다", "훈련 데이터의 라벨을 모두 평균낸다", "적절한 모델 함수 f를 선정한다", "관측치로부터 인접한 k개의 학습 데이터를 거리측도로 탐색한다"], "a": 3, "exp": "Step2는 '관측치로부터 인접한 k개의 학습 데이터를 탐색(거리측도)'하는 단계이다."}, {"id": 39, "sec": "7.4", "diff": "기초", "q": "kNN 분류 알고리즘의 Step3에 해당하는 것은?", "opts": ["탐색된 k개 학습 데이터의 다수결로 새 관측치의 클래스를 정의한다", "새로운 관측치가 들어온다", "거리를 계산해 인접 데이터를 탐색한다", "테스트 데이터로 모델을 재학습한다"], "a": 0, "exp": "Step3은 '탐색된 k개의 학습 데이터로 새 관측치의 클래스를 정의(k개의 데이터 다수결)'하는 단계이다."}, {"id": 40, "sec": "7.4", "diff": "기초", "q": "kNN 분류 알고리즘의 세 단계를 순서대로 바르게 나열한 것은?", "opts": ["이웃 탐색 → 새 관측치 유입 → 다수결", "다수결 → 이웃 탐색 → 새 관측치 유입", "새 관측치 유입 → 인접 k개 탐색 → 다수결로 클래스 정의", "새 관측치 유입 → 다수결 → 인접 k개 탐색"], "a": 2, "exp": "Step1 새 관측치 유입, Step2 거리측도로 인접 k개 탐색, Step3 다수결로 클래스 정의 순서이다."}, {"id": 41, "sec": "7.4", "diff": "중급", "q": "<표1>에서 신입생도(몸무게 3, 키 4)와 가장 가까운(1st) 데이터와 그 거리는?", "opts": ["생도5, 2.00", "생도3, 1.00", "생도4, 2.82", "생도2, 3.16"], "a": 1, "exp": "생도3(3,3)까지의 거리는 √((3−3)²+(4−3)²)=1.00으로 가장 가깝고, 강의자료의 표에서도 1st로 표시되어 있다."}, {"id": 42, "sec": "7.4", "diff": "중급", "q": "<표1>에서 k=3일 때 신입생도의 이웃으로 선택되는 세 데이터는?", "opts": ["생도1, 생도2, 생도3", "생도2, 생도3, 생도6", "생도4, 생도6, 생도7", "생도3, 생도5, 생도4"], "a": 3, "exp": "거리 순서는 생도3(1.00, 1st), 생도5(2.00, 2nd), 생도4(2.82, 3rd)이므로 이 세 데이터가 k=3의 이웃이다."}, {"id": 43, "sec": "7.4", "diff": "심화", "q": "<표1>에서 k=3일 때 신입생도의 예측 라벨 y'_1과 그 근거로 옳은 것은?", "opts": ["1(비만) — 이웃 3개 중 생도4·생도5의 라벨이 1이어서 다수이기 때문", "0 — 가장 가까운 생도3의 라벨이 0이기 때문", "1 — 세 이웃까지의 거리 평균이 2보다 작기 때문", "0 — 이웃 3개 중 라벨 0이 2개이기 때문"], "a": 0, "exp": "이웃 3개의 라벨은 생도3=0, 생도5=1, 생도4=1이므로 다수결 결과 y'_1 = 1(비만)이 된다. kNN 분류는 거리 평균이 아니라 라벨의 다수결로 결정한다."}, {"id": 44, "sec": "7.4", "diff": "중급", "q": "<표1>에서 만약 k=1로 예측한다면 신입생도의 라벨은 어떻게 되는가?", "opts": ["1(비만) — 가장 가까운 생도5의 라벨이 1이므로", "예측 불가 — 이웃이 하나면 다수결이 성립하지 않으므로", "0 — 가장 가까운 생도3(거리 1.00)의 라벨이 0이므로", "1 — 데이터 전체에서 라벨 1이 더 많으므로"], "a": 2, "exp": "k=1이면 최근접 이웃인 생도3의 라벨 0을 그대로 따르므로, k=3의 결과(1)와 달라진다."}, {"id": 45, "sec": "7.4", "diff": "중급", "q": "<표2> 유전자 정보에 따른 코로나 확진 여부 예제에서 신입생도와 가장 가까운 데이터는?", "opts": ["생도D (0.78)", "생도B (0.76)", "생도E (1.28)", "생도A (1.54)"], "a": 1, "exp": "거리 값은 A 1.54, B 0.76, C 2.00, D 0.78, E 1.28, F 1.31 이므로 생도B(0.76)가 가장 가깝다."}, {"id": 46, "sec": "7.4", "diff": "중급", "q": "<표2>에서 k=1로 예측한 신입생도의 코로나 확진 여부는?", "opts": ["확진", "판정 보류", "생도C와 동일한 값", "정상"], "a": 3, "exp": "최근접 이웃인 생도B(0.76)의 라벨이 '정상'이므로 k=1의 예측 결과는 정상이다."}, {"id": 47, "sec": "7.4", "diff": "중급", "q": "<표2>에서 k=3으로 예측한 신입생도의 코로나 확진 여부는?", "opts": ["확진", "정상", "동률이므로 판정 불가", "확률 0.5로 유보"], "a": 0, "exp": "가까운 3개는 생도B(0.76, 정상), 생도D(0.78, 확진), 생도E(1.28, 확진)이므로 다수결 결과는 '확진'이다."}, {"id": 48, "sec": "7.4", "diff": "심화", "q": "<표2>에서 k=1과 k=3의 예측 결과가 서로 다르게 나타난 이유로 가장 적절한 것은?", "opts": ["k=3에서는 맨하탄 거리를 사용했기 때문", "k=3에서는 거리의 평균값을 라벨로 사용했기 때문", "가장 가까운 생도B는 정상이지만 2·3번째 이웃인 생도D·생도E가 모두 확진이어서 다수결이 뒤집히기 때문", "생도C가 이웃에 포함되면서 정상이 2표가 되기 때문"], "a": 2, "exp": "두 예측 모두 유클리디안 거리를 사용하며, k가 커지면서 확진 라벨의 이웃 2개가 추가되어 다수결 결과가 정상에서 확진으로 바뀐다."}, {"id": 49, "sec": "7.5", "diff": "기초", "q": "kNN을 회귀(regression) 문제에 적용하는 경우는 언제인가?", "opts": ["특징의 개수가 2개일 때", "이웃의 수 k가 홀수일 때", "거리 측도로 맨하탄 거리를 쓸 때", "y_i의 값이 범주형 데이터가 아니라 연속형 데이터일 때"], "a": 3, "exp": "'y_i의 값이 범주형 데이터가 아닌 연속형 데이터일 경우에는 회귀를 수행'한다고 설명되어 있다."}, {"id": 50, "sec": "7.5", "diff": "기초", "q": "kNN 회귀에서 예측값을 구하는 기본 방법으로 옳은 것은?", "opts": ["탐색된 k개 데이터 값의 평균을 회귀값으로 반환한다", "탐색된 k개 데이터 값의 최댓값을 반환한다", "탐색된 k개 데이터의 다수결 라벨을 반환한다", "가장 먼 데이터의 값을 반환한다"], "a": 0, "exp": "알고리즘의 동작은 분류와 동일하나, k개 데이터 값의 평균을 회귀값으로 반환한다는 점만 다르다."}, {"id": 51, "sec": "7.5", "diff": "중급", "q": "<그림4>에서 New Data의 이웃 값이 72, 87, 69일 때 kNN 회귀로 예측되는 기말고사 점수는?", "opts": ["69점", "76점", "80점", "87점"], "a": 1, "exp": "(72 + 87 + 69) / 3 = 76 이므로 76점으로 예측된다."}, {"id": 52, "sec": "7.5", "diff": "중급", "q": "kNN 회귀에서 이웃 값의 단순 평균 대신 사용할 수 있다고 언급된 방법은?", "opts": ["이웃 라벨의 최빈값을 사용하는 방법", "이웃을 무작위로 재추출하여 평균내는 방법", "이웃의 값을 정규화한 뒤 최댓값을 취하는 방법", "거리에 비례하여 가중치를 주는 방법"], "a": 3, "exp": "강의자료는 '거리에 비례하여 가중치를 주는 방법도 존재'한다고 덧붙인다."}, {"id": 53, "sec": "7.5", "diff": "중급", "q": "<표3> 타과목 점수에 따른 인공지능 입문 점수 예제에서 신입생도와 가장 가까운 데이터와 그 거리는?", "opts": ["생도F, 1.12", "생도E, 1.87", "생도C, 2.12", "생도B, 2.40"], "a": 0, "exp": "거리 값은 A 3.28, B 2.40, C 2.12, D 2.65, E 1.87, F 1.12 이므로 생도F(1.12)가 가장 가깝다."}, {"id": 54, "sec": "7.5", "diff": "중급", "q": "<표3>에서 k=1로 예측한 신입생도의 인공지능 입문 점수는?", "opts": ["8.5", "10.0", "9.0", "9.17"], "a": 2, "exp": "최근접 이웃인 생도F의 인공지능 입문 점수가 9.0이므로 k=1의 예측값은 9.0이다."}, {"id": 55, "sec": "7.5", "diff": "심화", "q": "<표3>에서 k=3일 때 이웃으로 선택되는 세 명은 누구인가?", "opts": ["생도A, 생도B, 생도C", "생도D, 생도E, 생도F", "생도B, 생도C, 생도D", "생도F, 생도E, 생도C"], "a": 3, "exp": "거리 순으로 생도F(1.12), 생도E(1.87), 생도C(2.12)가 가장 가까운 3개이다."}, {"id": 56, "sec": "7.5", "diff": "심화", "q": "<표3>에서 k=3으로 예측한 신입생도의 인공지능 입문 점수는?", "opts": ["8.50", "9.00", "8.83", "9.17"], "a": 3, "exp": "이웃 3명의 점수는 생도F 9.0, 생도E 10.0, 생도C 8.5이므로 (9.0 + 10.0 + 8.5) / 3 = 9.17 이다."}, {"id": 57, "sec": "7.5", "diff": "기초", "q": "강의자료가 정의한 초매개변수(하이퍼파라미터)란 무엇인가?", "opts": ["학습 과정에서 손실을 최소화하며 자동으로 결정되는 값", "훈련 데이터의 라벨을 가리키는 값", "자동으로 결정되는 매개변수가 아니라 직접 입력해주는 매개변수", "테스트 단계에서만 사용하는 임계값"], "a": 2, "exp": "'초매개변수란? 자동으로 결정되는 매개변수가 아닌 직접 입력해주는 매개변수'라고 정의되어 있다."}, {"id": 58, "sec": "7.5", "diff": "기초", "q": "강의자료가 제시한 k 최근접 이웃의 초매개변수 두 가지는?", "opts": ["k와 거리 측도", "학습률과 배치 크기", "은닉층 수와 활성화 함수", "규제 계수와 반복 횟수"], "a": 0, "exp": "kNN의 초매개변수는 '인접한 학습 데이터를 몇 개까지 탐색할 것인가(k)'와 '데이터 간 거리를 어떻게 측정할 것인가(거리 측도)'이다."}, {"id": 59, "sec": "7.5", "diff": "중급", "q": "k가 매우 작을 경우 발생하는 문제로 옳은 것은?", "opts": ["다른 범주의 개체를 너무 많이 포함하여 과소적합이 발생한다", "데이터의 지역적 특성을 지나치게 반영하여 과대적합이 발생한다", "거리 계산이 불가능해진다", "회귀 문제로 자동 전환된다"], "a": 1, "exp": "'k가 매우 작을 경우: 데이터의 지역적 특성을 지나치게 반영함(과대적합)'이라고 설명되어 있다."}, {"id": 60, "sec": "7.5", "diff": "중급", "q": "k가 매우 클 경우 발생하는 문제로 옳은 것은?", "opts": ["결정 경계가 지나치게 들쭉날쭉해진다", "이웃을 찾지 못해 예측이 중단된다", "다른 범주의 개체를 너무 많이 포함하여 잘못 예측할 위험이 커진다(과소적합)", "거리 측도를 바꿔야만 계산이 가능해진다"], "a": 2, "exp": "'k가 매우 클 경우: 다른 범주의 개체를 너무 많이 포함하여 잘못 예측할 위험(과소적합)'이라고 설명되어 있다. 경계가 들쭉날쭉해지는 것은 k가 작을 때(1-nearest neighbor)의 현상이다."}, {"id": 61, "sec": "7.5", "diff": "심화", "q": "강의자료가 제시한 k 선택 방법에 대한 설명으로 옳지 않은 것은?", "opts": ["일정 범위 내에서 k를 조정하여 가장 좋은 예측 결과를 보이는 k를 선정한다", "k를 1부터 15까지 실험해보며 성능이 가장 좋을 때의 값을 설정한다", "학습 데이터에 대한 결과가 가장 좋은 k를 최종 k로 선택한다", "제시된 Classification result 그래프에서는 k=5가 Best k로 표시되었다"], "a": 2, "exp": "'학습 데이터를 기준으로 설정하는 것이 아니라, 테스트 데이터(새로운 관측치)에 대한 결과가 중요'하다고 명시되어 있다. 실제로 train error는 k=1에서 0%에 가깝지만 이는 과대적합이다."}, {"id": 62, "sec": "7.6", "diff": "기초", "q": "<그림 1.1> 'AI 활용 영역의 확대'에서 사용된 두 축은 무엇인가?", "opts": ["AI 기여도와 사고 심각도", "학습 시간과 데이터 양", "모델 복잡도와 파라미터 수", "정확도와 재현율"], "a": 0, "exp": "세로축은 AI 기여도(의사결정 지원 ↔ 완전 자동화), 가로축은 사고 심각도(영향도 경미 ↔ 인명에 영향)로 구성되어 있다."}, {"id": 63, "sec": "7.6", "diff": "중급", "q": "<그림 1.1>에서 'AI의 판단에 높은 신뢰성이 필요한 영역'으로 묶인 것에 해당하지 않는 것은?", "opts": ["자동 운전", "의료 진단", "자동거래·융자 심사", "광고"], "a": 3, "exp": "높은 신뢰성이 필요한 영역에는 자동 운전, 자동거래·융자 심사, 인프라 보수, 의료 진단이 묶여 있고, 광고는 그 바깥에 위치한다."}, {"id": 64, "sec": "7.6", "diff": "중급", "q": "<그림 1.1>의 가로축(사고 심각도)에서 가장 오른쪽 끝에 해당하는 수준은?", "opts": ["영향도 경미", "운영에 영향", "인명에 영향", "비용에 영향"], "a": 2, "exp": "가로축은 '영향도 경미 → 운영에 영향 → 인명에 영향' 순으로 사고 심각도가 커지며, 인명에 영향을 주는 영역일수록 높은 신뢰성이 요구된다."}, {"id": 65, "sec": "7.6", "diff": "중급", "q": "<그림 1.2>에서 AI 활용에 새로운 시점을 요구하게 된 '사회적 배경'으로 제시되지 않은 것은?", "opts": ["AI 악용과 AI에 의한 차별", "AI의 테스트 부족으로 인한 사고", "학습용 데이터의 편향이나 부족에 의한 AI 오작동", "AI 연구 인력의 급격한 감소"], "a": 3, "exp": "사회적 배경으로는 AI 악용, AI에 의한 차별, AI의 테스트 부족으로 인한 사고, 학습용 데이터의 편향·부족에 의한 오작동, AI의 성능 향상이 제시된다."}, {"id": 66, "sec": "7.6", "diff": "심화", "q": "<그림 1.2>에서 AI 활용에 요구되는 시점이 확대되어 온 순서로 옳은 것은?", "opts": ["윤리적 시점 → 사회적 시점 → 시스템적 시점 → 기계학습적 시점", "기계학습적 시점 → 시스템적 시점 → 사회적 시점 → 윤리적 시점", "사회적 시점 → 기계학습적 시점 → 윤리적 시점 → 시스템적 시점", "시스템적 시점 → 기계학습적 시점 → 윤리적 시점 → 사회적 시점"], "a": 1, "exp": "정확도를 다루는 기계학습적 시점에서 출발해 시스템적 시점, 사회적 시점, 윤리적 시점으로 요구되는 시점이 확대된다."}, {"id": 67, "sec": "7.6", "diff": "기초", "q": "<그림 1.2>에서 '기계학습적 시점'이 다루는 핵심 지표로 제시된 것은?", "opts": ["보안", "정확도", "공평성", "운용·보수성"], "a": 1, "exp": "기계학습적 시점은 괄호로 '(정확도)'가 명시되어 있으며, 보안·운용보수성은 시스템적 시점, 공평성은 사회적 시점에 해당한다."}, {"id": 68, "sec": "7.6", "diff": "중급", "q": "<그림 1.2>의 '시스템적 시점'에 포함된 항목들로 옳은 것은?", "opts": ["공평성, 책임성, 투명성", "정확도, 재현율, 정밀도", "가용성, 운용·보수성, 성능·확장성, 보안", "해석 가능성, 설명 책임, 윤리성"], "a": 2, "exp": "시스템적 시점에는 가용성, 운용·보수성, 성능·확장성, 보안이 열거되어 있다."}, {"id": 69, "sec": "7.6", "diff": "기초", "q": "<그림 1.2>에서 '사회적 시점'으로 제시된 세 가지 요소는?", "opts": ["공평성, 책임성, 투명성", "가용성, 보안, 확장성", "정확도, 속도, 비용", "재현성, 이식성, 확장성"], "a": 0, "exp": "사회적 시점은 공평성, 책임성, 투명성으로 구성되며 강의의 별도 슬라이드에서도 이 세 가지를 다룬다."}, {"id": 70, "sec": "7.6", "diff": "심화", "q": "<그림 1.3> '불공평한 예측 결과를 초래하는 바이어스의 예'에서 바이어스가 개입하는 흐름으로 옳은 것은?", "opts": ["학습 바이어스 → 샘플링 바이어스 → 가공 바이어스 → 공평한 예측", "역사적·샘플링 바이어스 → 학습 데이터의 가공 바이어스 → AI의 학습 바이어스 → 불공평한 예측", "가공 바이어스 → 역사적 바이어스 → 샘플링 바이어스 → 불공평한 예측", "샘플링 바이어스만이 유일하게 불공평한 예측을 초래한다"], "a": 1, "exp": "실제 데이터 단계의 역사적·샘플링 바이어스가 학습 데이터의 가공 바이어스로, 다시 AI의 학습 바이어스로 이어져 최종적으로 불공평한 예측을 낳는다."}, {"id": 71, "sec": "7.6", "diff": "기초", "q": "AI의 '책임성'과 '투명성'에 각각 대응하는 영어 표현을 바르게 짝지은 것은?", "opts": ["책임성 - Transparency, 투명성 - Accountability", "책임성 - Reliability, 투명성 - Fairness", "책임성 - Fairness, 투명성 - Accountability", "책임성 - Accountability, 투명성 - Transparency"], "a": 3, "exp": "강의자료는 'AI의 책임성 (Accountability)', 'AI의 투명성 (Transparency)'으로 표기하고 있다."}, {"id": 72, "sec": "7.6", "diff": "중급", "q": "<그림 1.4>가 나타내는 트레이드오프의 두 축은 무엇인가?", "opts": ["학습 속도와 예측 속도", "알고리즘 설명 가능성과 대응 가능한 문제의 복잡성", "데이터 양과 파라미터 수", "훈련 오차와 검증 오차"], "a": 1, "exp": "<그림 1.4>는 가로축을 '알고리즘 설명 가능성', 세로축을 '대응 가능한 문제의 복잡성'으로 두고 둘 사이의 트레이드오프를 보여준다."}, {"id": 73, "sec": "7.6", "diff": "중급", "q": "<그림 1.4>에서 알고리즘 설명 가능성이 가장 높은 쪽에 위치한 것은?", "opts": ["딥러닝", "부스팅 모델", "의사결정 나무", "규칙 기반"], "a": 3, "exp": "곡선의 오른쪽 끝(설명 가능성 최고, 복잡성 대응 최저)에는 규칙 기반이 위치한다."}, {"id": 74, "sec": "7.6", "diff": "중급", "q": "<그림 1.4>에서 대응 가능한 문제의 복잡성이 가장 높은 것은?", "opts": ["딥러닝", "선형/로지스틱 회귀", "의사결정 나무", "규칙 기반"], "a": 0, "exp": "딥러닝이 가장 복잡한 문제에 대응할 수 있지만 그만큼 알고리즘 설명 가능성은 가장 낮다."}, {"id": 75, "sec": "7.6", "diff": "심화", "q": "<그림 1.4>의 알고리즘들을 설명 가능성이 낮은 것부터 높은 순서로 바르게 나열한 것은?", "opts": ["규칙 기반 → 선형/로지스틱 회귀 → 의사결정 나무 → 부스팅 모델 → 딥러닝", "딥러닝 → 부스팅 모델 → 의사결정 나무 → 선형/로지스틱 회귀 → 규칙 기반", "의사결정 나무 → 딥러닝 → 규칙 기반 → 부스팅 모델 → 선형/로지스틱 회귀", "선형/로지스틱 회귀 → 규칙 기반 → 딥러닝 → 의사결정 나무 → 부스팅 모델"], "a": 1, "exp": "곡선을 따라 딥러닝, 부스팅 모델, 의사결정 나무, 선형/로지스틱 회귀, 규칙 기반 순으로 설명 가능성이 높아지고 대응 가능한 문제의 복잡성은 낮아진다."}, {"id": 76, "sec": "7.6", "diff": "기초", "q": "강의자료가 '설명 가능성이 높은 알고리즘'으로 함께 제시한 두 가지는?", "opts": ["의사결정트리와 로지스틱 회귀", "XGBoost와 MLP", "딥러닝과 부스팅 모델", "랜덤 포레스트와 SVM"], "a": 0, "exp": "설명 가능성이 높은 알고리즘으로 의사결정트리와 로지스틱 회귀가, 낮은 알고리즘으로 XGBoost와 MLP가 제시된다."}, {"id": 77, "sec": "7.6", "diff": "중급", "q": "강의자료가 알고리즘의 설명 가능성을 살펴볼 때 공통적으로 사용한 두 가지 관점은?", "opts": ["학습 속도와 메모리 사용량", "1. 예측에서 중요한 항목, 2. 각 입력에 대한 예측 근거", "1. 데이터 수집 비용, 2. 라벨링 난이도", "1. 하이퍼파라미터 수, 2. 층의 깊이"], "a": 1, "exp": "의사결정트리, 로지스틱 회귀, XGBoost 모두 '예측에서 중요한 항목'과 '각 입력에 대한 예측 근거'라는 두 관점으로 설명 가능성을 검토한다."}, {"id": 78, "sec": "7.6", "diff": "중급", "q": "<그림 1.5> 의사결정 트리의 사례에서 최상위(루트) 분기 조건으로 사용된 항목은?", "opts": ["월 점포 방문 횟수 > 10회", "쿠폰 사용 여부", "평균 이용금액 > 30,000원", "월 점포 방문 횟수 > 5회"], "a": 2, "exp": "루트 노드는 '평균 이용금액 > 30,000원'이며, 이후 쿠폰 사용 여부나 월 점포 방문 횟수로 가지가 갈라져 회원일 확률을 보여준다."}, {"id": 79, "sec": "7.6", "diff": "심화", "q": "<그림 1.6> '의사결정 트리 복잡성과 해석 복잡성의 관계'가 시사하는 바로 가장 적절한 것은?", "opts": ["트리는 깊어질수록 각 예측의 근거 경로가 길고 복잡해져 해석이 어려워진다", "트리는 깊어질수록 항상 해석이 쉬워진다", "얕은 트리는 예측 근거를 전혀 제시하지 못한다", "트리의 깊이는 해석 가능성과 무관하다"], "a": 0, "exp": "얕은 트리와 깊은 트리를 나란히 비교해, 트리 구조가 복잡해질수록 해석 복잡성도 함께 커진다는 점을 보여준다."}, {"id": 80, "sec": "7.6", "diff": "중급", "q": "<그림 1.7>과 함께 제시된 로지스틱 회귀의 확률 식으로 옳은 것은?", "opts": ["P(y='yes') = a₁x₁ + a₂x₂ + ... + aₙxₙ + β", "P(y='yes') = 1 / (1 + e^-(a₁x₁ + a₂x₂ + ... + aₙxₙ + β))", "P(y='yes') = e^(a₁x₁ + ... + aₙxₙ)", "P(y='yes') = Σ|a_i x_i| + β"], "a": 1, "exp": "로지스틱 회귀는 선형 결합 a₁x₁+…+aₙxₙ+β를 시그모이드 함수에 넣어 확률로 변환한다."}, {"id": 81, "sec": "7.6", "diff": "중급", "q": "<그림 1.7>에서 입력이 1차원이고 a=10일 때 시그모이드 함수의 입출력 관계를 바르게 설명한 것은?", "opts": ["출력이 -1에서 1 사이를 진동한다", "출력이 입력에 정비례하는 직선이다", "출력이 0과 1 사이에서 S자 곡선을 그리며 완만하게 증가한다", "출력이 계단처럼 0에서 1로 순간적으로만 바뀐다"], "a": 2, "exp": "그래프는 0에서 1 사이 값을 갖는 S자(시그모이드) 곡선을 보여주며, 이 덕분에 로지스틱 회귀의 출력을 확률로 해석할 수 있다."}, {"id": 82, "sec": "7.6", "diff": "기초", "q": "강의자료에서 '설명 가능성이 낮은 알고리즘'으로 다뤄진 것끼리 묶인 것은?", "opts": ["의사결정트리와 규칙 기반", "선형회귀와 로지스틱 회귀", "XGBoost와 MLP", "kNN과 선형회귀"], "a": 2, "exp": "설명 가능성이 낮은 알고리즘으로 XGBoost(부스팅 계열)와 MLP(다층 퍼셉트론)가 제시된다."}, {"id": 83, "sec": "7.6", "diff": "심화", "q": "<그림 1.8> '앙상블 학습 모델의 대표적 차이'에서 부스팅(Boosting)의 특징으로 옳은 것은?", "opts": ["여러 샘플로 만든 예측을 독립적으로 만들어 한 번에 취합한다", "앞선 모델의 예측 오류를 정정해 나가며 순차적으로 모델을 쌓아 최종 예측을 만든다", "단일 트리만 사용하므로 해석이 매우 쉽다", "학습 데이터를 사용하지 않고 규칙만으로 예측한다"], "a": 1, "exp": "그림에서 배깅은 여러 샘플의 예측을 병렬로 취합하는 반면, 부스팅은 예측 → 오류 정정 → 다음 모델 학습을 반복해 최종 예측을 만든다. 이런 구조 때문에 XGBoost는 설명 가능성이 낮다."}, {"id": 84, "sec": "7.6", "diff": "중급", "q": "<그림 1.9> 퍼셉트론의 구조에 대한 설명으로 옳은 것은?", "opts": ["입력에 가중치를 곱해 합한 z = Σw_i x_i 를 활성화 함수 g에 통과시켜 y = g(z)를 출력한다", "입력을 그대로 출력으로 내보내며 가중치가 없다", "입력 간 거리를 계산해 가장 가까운 입력을 출력한다", "출력값을 입력으로 되돌려 순환 구조를 만든다"], "a": 0, "exp": "퍼셉트론은 z = Σw_i x_i 를 구한 뒤 시그모이드·Tanh·ReLU 등의 활성화 함수 g를 적용해 y = g(z)를 출력하며, 이러한 퍼셉트론이 다층으로 쌓인 것이 MLP이다."}, {"id": 85, "sec": "7.6", "diff": "심화", "q": "<그림 1.10> 'MLP 해석의 어려움'에 대한 설명으로 옳은 것은?", "opts": ["입력에 가까운 층일수록 해석이 어렵고 출력에 가까운 층일수록 쉽다", "입력에 가까운 층은 구체적인 입력에 가중치를 부여해 집계하므로 알기 쉬우나, 출력에 가까운 층은 복잡하게 가중치가 부여된 입력을 받아 해석하기 힘들다", "모든 층의 해석 난이도가 동일하다", "층의 개수와 무관하게 MLP는 해석이 쉽다"], "a": 1, "exp": "입력에 가까운 층은 구체적인 입력에 가중치를 부여한 후 집계하므로 평가하여 알기 쉬운 반면, 출력에 가까운 층은 이미 복잡하게 가공된 입력을 받으므로 해석이 어렵다."}, {"id": 86, "sec": "7.7", "diff": "중급", "q": "<그림 1.11> 여신 심사의 업무 프로세스 순서로 옳은 것은?", "opts": ["본심사 → 가심사 → 변제 확인 → 계약/융자", "가심사 → 본심사 → 계약/융자 → 변제 확인", "계약/융자 → 가심사 → 본심사 → 변제 확인", "가심사 → 계약/융자 → 본심사 → 변제 확인"], "a": 1, "exp": "여신 심사는 가심사 → 본심사 → 계약/융자 → 변제 확인의 순서로 진행되며, 변제 const KEY = "mlx_week7_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
