<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2주차 · 인공지능 기초 수학 100문제</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 2 · 인공지능 기초 수학</div>
    <h1>2주차 &middot; 인공지능 기초 수학 — 100문제</h1>
    <p class="sub">강의자료 2.1~2.7절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    2주차 강의자료(인공지능 기초 수학 · 벡터/행렬/미분/확률 + Numpy) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "2.1", "diff": "기초", "q": "강의자료에서 컴퓨터 과학의 관점으로 정의한 벡터(Vector)는 무엇인가?", "opts": ["행과 열의 형태로 수나 식을 배열한 것", "크기와 방향을 동시에 가지는 물리량", "실수 값을 갖는 성분으로 구성된 1차원 배열", "스칼라를 성분으로 갖는 n차원 배열"], "a": 2, "exp": "컴퓨터 과학에서는 벡터를 실수 값을 갖는 성분으로 구성된 1차원 배열로 정의한다. 크기와 방향은 물리 관점의 정의이고, 행과 열의 배열은 행렬, n차원 배열은 텐서의 정의이다."}, {"id": 2, "sec": "2.1", "diff": "기초", "q": "물리 관점에서 벡터를 설명한 강의자료의 내용으로 옳은 것은?", "opts": ["크기와 방향을 가진 값이며, 방향은 화살표로 크기는 수치 값으로 표현한다", "방향만 가지며 크기는 정의되지 않는다", "크기만 가지며 방향은 좌표축의 이름으로만 구분한다", "순서가 없는 값들의 모임으로 표현된다"], "a": 0, "exp": "물리에서 벡터는 크기와 방향을 가진 값으로, 방향은 화살표로 표기하고 크기는 수치 값으로 표현한다."}, {"id": 3, "sec": "2.1", "diff": "중급", "q": "벡터를 \"값의 모임\"으로 볼 때, 일반적인 집합과 구별되는 벡터의 중요한 성질은 무엇인가?", "opts": ["구성하는 값이 모두 서로 달라야 한다", "구성하는 값의 개수가 항상 3개로 제한된다", "구성하는 값이 반드시 정수여야 한다", "벡터를 구성하는 값에는 순서가 존재한다"], "a": 3, "exp": "강의자료는 벡터가 값의 모임이지만 그 값들에는 순서가 존재한다는 점을 명시하고 있다. 성분의 중복이나 개수, 자료형에는 제약이 없다."}, {"id": 4, "sec": "2.1", "diff": "기초", "q": "벡터 x에 대한 전치(Transpose) 연산 x^T의 역할로 옳은 것은?", "opts": ["벡터의 모든 성분의 부호를 반대로 바꾼다", "열벡터를 행벡터로, 행벡터를 열벡터로 변환한다", "벡터의 크기를 1로 정규화한다", "벡터를 하나의 스칼라 값으로 변환한다"], "a": 1, "exp": "전치 연산은 열벡터(column vector)를 행벡터(row vector)로, 또는 행벡터를 열벡터로 변환한다."}, {"id": 5, "sec": "2.1", "diff": "기초", "q": "n개의 성분을 갖는 \"n벡터\" x가 존재하는 공간을 옳게 표현한 것은?", "opts": ["x ∈ R^(n×n)", "x ∈ R^n (R은 실수를 의미)", "x ∈ N^n (N은 자연수를 의미)", "x ∈ R^(n-1)"], "a": 1, "exp": "N개의 성분이 있는 일반 형식의 벡터는 n차원 공간 x ∈ R^n 에 존재하며, 여기서 R은 실수를 의미한다."}, {"id": 6, "sec": "2.1", "diff": "중급", "q": "강의자료가 제시한 벡터의 표현 방식에 대한 설명으로 옳지 않은 것은?", "opts": ["x = (x1, x2, x3) 와 같은 형태로 표현하기도 한다", "x = < x1, x2, x3 > 와 같은 형태로 표현하기도 한다", "행렬과 함께 다루어질 때는 성분을 세로로 쌓은 열벡터 형태로 표현한다", "벡터는 굵은 영문 대문자로 표기하는 것이 원칙이다"], "a": 3, "exp": "강의자료는 벡터를 굵은 소문자로, 행렬을 굵은 영문 대문자로 표기한다고 명시한다. 나머지 세 가지는 모두 자료에 제시된 벡터의 표현 방식이다."}, {"id": 7, "sec": "2.1", "diff": "기초", "q": "벡터의 첫 번째 기하학적 해석에 해당하는 것은?", "opts": ["n차원 공간의 점으로 벡터를 표시하는 것", "벡터를 스칼라 값으로 매핑하는 함수로 보는 것", "벡터를 행렬의 행으로 분해하는 것", "벡터를 확률 분포의 매개변수로 보는 것"], "a": 0, "exp": "벡터의 첫 번째 해석은 \"공간의 점\"으로, n차원 공간의 점으로 n벡터를 표시하는 것이다. 두 번째 해석은 \"공간에서의 방향\"이다."}, {"id": 8, "sec": "2.1", "diff": "중급", "q": "강의자료에서 벡터 v = [3  2]^T 의 방향을 설명한 내용으로 옳은 것은?", "opts": ["왼쪽 3단계, 아래로 2단계", "오른쪽 2단계, 위로 3단계", "위로 3단계, 오른쪽 2단계", "오른쪽 3단계, 위로 2단계"], "a": 3, "exp": "첫 번째 성분 3은 가로 방향(오른쪽 3단계), 두 번째 성분 2는 세로 방향(위로 2단계)을 의미한다."}, {"id": 9, "sec": "2.1", "diff": "중급", "q": "두 벡터 x1 = [x11  x12]^T, x2 = [x21  x22]^T 의 합과 n벡터 x에 대한 실수 a의 스칼라 곱을 옳게 표현한 것은?", "opts": ["x1 + x2 = [x11·x21  x12·x22]^T, ax = [a+x1  ...  a+xn]^T", "x1 + x2 = [x11+x12  x21+x22]^T, ax = [ax1  ...  axn]^T", "x1 + x2 = [x11+x21  x12+x22]^T, ax = [ax1  ...  axn]^T", "x1 + x2 = x11x21 + x12x22 (스칼라), ax = a(x1 + ... + xn)"], "a": 2, "exp": "벡터 덧셈은 같은 위치의 성분끼리 더하고, 스칼라 곱은 모든 성분에 실수 a를 곱한다. 성분끼리 곱해 스칼라를 만드는 것은 내적이다."}, {"id": 10, "sec": "2.1", "diff": "심화", "q": "R^3의 벡터 x = [1  2  3]^T, y = [-2  3  6]^T 에 대한 연산 결과로 옳지 않은 것은?", "opts": ["x + y = [-1  5  9]^T", "x - y = [-1  5  9]^T", "(-3)x = [-3  -6  -9]^T", "y - x = [-3  1  3]^T"], "a": 1, "exp": "x - y = [1-(-2), 2-3, 3-6] = [3  -1  -3]^T 이다. [-1  5  9]^T 는 x + y 의 결과이므로 두 번째 보기가 옳지 않다."}, {"id": 11, "sec": "2.2", "diff": "기초", "q": "강의자료에서 정의한 훈련 데이터(training data)는 무엇인가?", "opts": ["학습이 끝난 모델의 성능을 측정하기 위해 따로 떼어 둔 데이터", "모델의 인자를 무작위로 초기화하기 위해 생성하는 난수의 모임", "확률 분포로부터 이론적으로 유도한 가상의 데이터", "모델이 해결해야 하는 해당 임무에 대하여 수집한 데이터"], "a": 3, "exp": "원하는 임무를 잘 해결하는 모델을 찾으려면 그 임무에 대한 데이터가 확보되어야 하는데, 해당 임무에 대하여 수집한 데이터를 훈련 데이터라고 한다."}, {"id": 12, "sec": "2.2", "diff": "중급", "q": "훈련 데이터 표기 D = {(xi, yi)}(i=1..N) 이 의미하는 바로 옳은 것은?", "opts": ["N개의 관측 값으로 구성된 샘플이며, i번째 관측 값이 (xi, yi)로 구성된다", "i개의 관측 값이 각각 N개의 특징으로 표현된다", "동일한 관측 값 (xi, yi)를 N번 반복하여 측정한다", "N개의 서로 다른 모델을 동시에 학습시킨다"], "a": 0, "exp": "이 표기는 모델에게 주어진 훈련 데이터가 N개의 관측 값으로 구성된 샘플이고, i번째 관측 값이 (xi, yi)로 구성됨을 의미한다."}, {"id": 13, "sec": "2.2", "diff": "기초", "q": "훈련 데이터의 관측 값 (xi, yi)에서 xi와 yi를 부르는 이름을 옳게 짝지은 것은?", "opts": ["xi: 특징벡터 / yi: 참값, 레이블, 목표 값", "xi: 레이블 / yi: 특징벡터", "xi: 목적함수 / yi: 기울기", "xi: 가중치 / yi: 오프셋"], "a": 0, "exp": "xi는 특징벡터라고 부르고, yi는 참값·레이블·목표 값 등으로 호칭한다."}, {"id": 14, "sec": "2.2", "diff": "중급", "q": "강의자료의 학생 분류 예시에서, 관측 값을 \"나이\", \"성별\", \"이름\", \"학교코드\"로 설명하고 레이블은 이진분류로 부여할 때 옳은 설명은?", "opts": ["특징벡터는 2개 성분, 레이블은 5개 카테고리를 갖는다", "특징벡터는 5개 성분, 레이블은 4개 카테고리를 갖는다", "특징벡터는 4개 성분이고 레이블도 4개 값 중 하나를 갖는다", "특징벡터 xi는 4개의 성분으로 표시되고, 레이블 yi에는 \"학생\" 또는 \"학생 아님\"이 부여된다"], "a": 3, "exp": "관측 값을 설명하는 특징이 4개이므로 특징벡터는 4개 성분을 갖고, 이진분류이므로 레이블에는 \"학생\" 또는 \"학생 아님\" 두 값 중 하나가 부여된다."}, {"id": 15, "sec": "2.2", "diff": "기초", "q": "벡터 노름(Norm)에 대한 설명으로 옳은 것은?", "opts": ["두 벡터 사이의 각도를 계산하여 반환하는 함수이다", "벡터를 스칼라 값으로 매핑하는 함수이며 벡터 크기의 척도이다", "벡터의 성분 순서를 뒤집는 연산이다", "벡터를 다른 벡터로 회전시키는 선형 변환이다"], "a": 1, "exp": "노름은 벡터를 스칼라 값으로 매핑하는 함수이며, 벡터 크기의 척도로 사용된다."}, {"id": 16, "sec": "2.2", "diff": "심화", "q": "노름 f 가 충족해야 하는 속성으로 강의자료가 제시한 것이 아닌 것은?", "opts": ["스케일링(Scaling): f(ax) = |a|f(x) (a는 임의의 실수)", "삼각 부등식(Triangle inequality): f(x + y) ≤ f(x) + f(y)", "선형성: 모든 x, y에 대하여 f(x + y) = f(x) + f(y) 가 항상 성립", "양의 함수: f(x) ≥ 0"], "a": 2, "exp": "강의자료가 제시한 노름의 속성은 스케일링, 삼각 부등식, 양의 함수 세 가지이다. 덧셈에 대한 등식(선형성)은 요구되지 않으며, 실제로는 부등식 형태의 삼각 부등식만 성립한다."}, {"id": 17, "sec": "2.2", "diff": "중급", "q": "벡터 x의 일반적인 lp 노름 ||x||_p 를 옳게 표현한 것은? (p는 실수)", "opts": ["(1/p)·(합 i |xi|)", "(합 i=1..n |xi|^p)^(1/p)", "(합 i=1..n xi)^(1/p)", "p · max{|x1|, ..., |xn|}"], "a": 1, "exp": "lp 노름은 각 성분의 절대값을 p제곱하여 모두 더한 뒤 1/p 제곱을 취한 값으로 정의된다."}, {"id": 18, "sec": "2.2", "diff": "중급", "q": "l∞ 노름 ||x||_∞ 의 정의로 옳은 것은?", "opts": ["벡터 x를 구성하는 성분의 절대값 중 가장 큰 값", "벡터를 구성하는 모든 성분의 절대값의 합", "벡터 성분의 제곱합의 제곱근", "벡터 성분 중 0이 아닌 값의 개수"], "a": 0, "exp": "||x||_∞ = max{|x1|, ..., |xn|} 이며, 벡터 x를 구성하는 성분의 절대값 중 가장 큰 값이다. 절대값의 합은 l1, 제곱합의 제곱근은 l2 노름이다."}, {"id": 19, "sec": "2.2", "diff": "중급", "q": "x = [1  2  3]^T 일 때 ||x||_1 과 ||x||_∞ 의 값을 순서대로 옳게 구한 것은?", "opts": ["3, 6", "√14, 3", "6, 3", "6, √14"], "a": 2, "exp": "||x||_1 = |1|+|2|+|3| = 6 이고, ||x||_∞ = max{1, 2, 3} = 3 이다. 참고로 ||x||_2 = √14 이다."}, {"id": 20, "sec": "2.2", "diff": "심화", "q": "y = [-2  3  6]^T 에 대하여 ||y||_2 의 값은?", "opts": ["11", "√11", "6", "7"], "a": 3, "exp": "||y||_2 = √((-2)^2 + 3^2 + 6^2) = √(4+9+36) = √49 = 7 이다. 절대값의 합인 11은 ||y||_1 에 해당한다."}, {"id": 21, "sec": "2.3", "diff": "기초", "q": "두 벡터 u, v의 내적을 성분으로 표현한 식으로 옳은 것은?", "opts": ["u · v = u^T v = 합 i (ui · vi)", "u · v = [u1v1, ..., unvn]^T", "u · v = 합 i (ui + vi)", "u · v = u v^T"], "a": 0, "exp": "내적은 두 벡터의 같은 위치 성분끼리 곱한 값을 모두 더한 스칼라이며, u^T v 로도 표기하고 <u, v> 로도 종종 표시한다."}, {"id": 22, "sec": "2.3", "diff": "중급", "q": "내적을 u · v = ||u|| ||v|| cos(θ) 로 표현할 때, 사용되는 노름과 θ의 의미로 옳은 것은?", "opts": ["l1 노름을 사용하며, θ는 u가 좌표축과 이루는 각이다", "l2 노름을 사용하며, θ는 u벡터와 v벡터의 사잇각이다", "l∞ 노름을 사용하며, θ는 항상 90도이다", "노름의 종류와 무관하며, θ는 두 벡터 크기의 비를 의미한다"], "a": 1, "exp": "내적은 L2 노름을 사용하므로 ||u|| = ||u||_2, ||v|| = ||v||_2 이며, θ는 두 벡터의 사잇각이다."}, {"id": 23, "sec": "2.3", "diff": "기초", "q": "내적 연산이 대칭 연산임을 나타내는 식으로 옳은 것은?", "opts": ["u · v = -(v · u)", "u · v = ||u|| + ||v||", "u · v = u v^T = v u^T", "u · v = u^T v = v^T u = v · u"], "a": 3, "exp": "내적은 대칭 연산이므로 계산 순서를 바꾸어도 값이 같다. 즉 u · v = u^T v = v^T u = v · u 이다."}, {"id": 24, "sec": "2.3", "diff": "중급", "q": "내적의 정의로부터 유도되는 cos(θ)의 계산식으로 옳은 것은?", "opts": ["cos(θ) = (||u|| ||v||) / (u · v)", "cos(θ) = (u · v) / (||u|| + ||v||)", "cos(θ) = (u · v) / (||u|| ||v||)", "cos(θ) = (u + v) / (||u|| ||v||)"], "a": 2, "exp": "u · v = ||u|| ||v|| cos(θ) 의 양변을 ||u|| ||v|| 로 나누면 cos(θ) = (u · v) / (||u|| ||v||) 를 얻는다."}, {"id": 25, "sec": "2.3", "diff": "기초", "q": "두 벡터 u, v가 서로 \"직교\"한다는 것의 의미로 옳은 것은?", "opts": ["두 벡터의 크기(노름)가 서로 같다", "두 벡터가 완전히 같은 방향을 가리킨다", "두 벡터의 합이 영벡터가 된다", "사잇각이 90도를 이루며, 이때 u · v = 0 이다"], "a": 3, "exp": "사잇각이 90도를 이루는 두 벡터를 서로 직교한다고 하며, u와 v가 직교하면 내적 u · v = 0 이 된다."}, {"id": 26, "sec": "2.3", "diff": "중급", "q": "기계학습에서 코사인 유사성(Cosine similarity)을 사용하는 목적으로 옳은 것은?", "opts": ["벡터의 성분 개수 차이를 계산하기 위해", "벡터 형태로 표현된 두 관측값 사이의 cos(θ) 값으로 두 관측값의 유사 정도를 수치화하기 위해", "벡터의 노름을 l1에서 l2로 변환하기 위해", "훈련 데이터의 레이블을 자동으로 부여하기 위해"], "a": 1, "exp": "기계학습에서는 관측값을 벡터로 표현하므로, 두 벡터의 cos(θ) 값을 이용하여 두 관측값의 유사 정도를 수치화할 수 있다."}, {"id": 27, "sec": "2.3", "diff": "중급", "q": "x = [1  2  3]^T, y = [-2  3  6]^T 일 때 내적 x · y 의 값은?", "opts": ["-22", "7", "22", "26"], "a": 2, "exp": "x · y = 1·(-2) + 2·3 + 3·6 = -2 + 6 + 18 = 22 이다."}, {"id": 28, "sec": "2.3", "diff": "심화", "q": "x = [1  2  3]^T 에 대하여 y = [-2  3  6]^T 와 z = [1  2  4]^T 중 코사인 유사도가 더 큰 벡터와 그 근거로 옳은 것은?", "opts": ["z — cos값이 17/(√14·√21) ≈ 0.99 로 y의 22/(√14·7) ≈ 0.84 보다 크기 때문", "y — 내적이 22로 x · z = 17 보다 크기 때문", "y — ||y||_2 = 7 이 ||z||_2 = √21 보다 크기 때문", "두 벡터의 코사인 유사도가 완전히 동일하여 판단할 수 없음"], "a": 0, "exp": "코사인 유사도는 내적을 두 벡터의 L2 노름의 곱으로 나눈 값이므로 내적 크기만으로 비교하면 안 된다. z의 값 약 0.99가 y의 약 0.84보다 크므로 x는 z와 더 가깝다."}, {"id": 29, "sec": "2.3", "diff": "기초", "q": "초평면(hyperplane)의 정의로 옳은 것은?", "opts": ["차원이 주변 공간과 항상 동일한 부분 공간", "차원이 주변 공간보다 하나 작은 부분 공간", "차원이 주변 공간보다 하나 큰 부분 공간", "차원이 항상 2로 고정된 부분 공간"], "a": 1, "exp": "초평면은 차원이 주변 공간보다 하나 작은 부분 공간이며, n차원 벡터 공간에서 n-1 차원을 가지고 공간을 두 개의 절반 공간으로 나눈다."}, {"id": 30, "sec": "2.3", "diff": "중급", "q": "공간의 차원과 그 공간에서의 초평면을 옳게 짝지은 것은?", "opts": ["2차원 공간 → 평면 / 3차원 공간 → 직선", "2차원 공간 → 점 / 3차원 공간 → 직선", "n차원 공간 → n차원 / 3차원 공간 → 3차원 입체", "2차원 공간 → 직선 / 3차원 공간 → 평면 / n차원 공간 → n-1 차원"], "a": 3, "exp": "이차원 공간에서 초평면은 직선(일차원), 3차원 공간에서는 평면(이차원)이며, 일반적으로 n차원 공간에서는 n-1 차원을 갖는다."}, {"id": 31, "sec": "2.3", "diff": "중급", "q": "이진 분류 문제에서 초평면 w · x + b = 0 이 하는 역할로 옳은 것은?", "opts": ["두 클래스를 구분하는 결정 경계이며, w · x + b > 0 인지 여부를 검사하여 관측 값의 소속 클래스를 결정한다", "관측 값의 노름을 항상 1로 정규화하는 역할을 한다", "훈련 데이터의 개수 N을 결정하는 역할을 한다", "특징벡터의 차원을 하나 늘려주는 역할을 한다"], "a": 0, "exp": "머신러닝에서 초평면은 선형 분류에 사용되는 결정 경계(decision boundary)이며, w · x + b > 0 인지 검사하여 클래스 레이블을 모르는 관측 값의 소속 클래스를 결정한다. w와 b의 값은 학습 데이터에 기반하여 결정된다."}, {"id": 32, "sec": "2.3", "diff": "심화", "q": "w = [2  1]^T, x0 = [1  -1]^T 로 정의되는 초평면을 w · (x - x0) = 0 으로부터 구한 식과, 원점에서 초평면까지의 거리 표현을 옳게 짝지은 것은?", "opts": ["2x1 + x2 + 1 = 0 / 거리 = ||w|| / |b|", "x1 + 2x2 - 1 = 0 / 거리 = |b| · ||w||", "2x1 + x2 - 1 = 0 / 거리 = |b| / ||w||", "2x1 - x2 - 1 = 0 / 거리 = ||w|| · |b|"], "a": 2, "exp": "w^T(x - x0) = 2(x1 - 1) + 1·(x2 + 1) = 2x1 + x2 - 1 = 0 이며, 이는 오프셋 b = -1 인 w · x + b = 0 과 같다. 원점에서 초평면까지의 거리는 |b| / ||w|| 이다."}, {"id": 33, "sec": "2.4", "diff": "기초", "q": "강의자료에서 정의한 행렬(Matrix)은 무엇인가?", "opts": ["실수 값을 갖는 성분으로 구성된 1차원 배열", "두 벡터의 내적으로 정의되는 하나의 스칼라 값", "m개의 가로 행과 n개의 세로 열의 형태로 수나 식을 배열한 것", "차원이 주변 공간보다 하나 작은 부분 공간"], "a": 2, "exp": "행렬은 m개의 가로 행과 n개의 세로 열의 형태로 수나 식을 배열한 것이며, 크기는 m × n 또는 (m, n)으로 표기하고 굵은 영문 대문자로 표시한다."}, {"id": 34, "sec": "2.4", "diff": "중급", "q": "행렬 덧셈 [[1, 3, 1], [1, 0, 0]] + [[0, 0, 5], [7, 5, 0]] 의 결과로 옳은 것은?", "opts": ["[[0, 0, 5], [7, 0, 0]]", "[[1, 3, 6], [7, 5, 0]]", "[[1, 3, 1], [8, 5, 0]]", "[[1, 3, 6], [8, 5, 0]]"], "a": 3, "exp": "행렬의 덧셈은 (A ± B)ij = Aij ± Bij 로 같은 위치의 성분끼리 더한다. 따라서 [[1+0, 3+0, 1+5], [1+7, 0+5, 0+0]] = [[1, 3, 6], [8, 5, 0]] 이다."}, {"id": 35, "sec": "2.4", "diff": "기초", "q": "두 행렬의 곱 AB가 정의되기 위한 조건으로 옳은 것은?", "opts": ["두 행렬의 행의 수와 열의 수가 각각 서로 같아야 한다", "왼쪽 행렬의 열 수가 오른쪽 행렬의 행 수와 같아야 한다", "왼쪽 행렬의 행 수가 오른쪽 행렬의 열 수와 같아야 한다", "두 행렬이 모두 정방 행렬이어야 한다"], "a": 1, "exp": "행렬 곱셈은 왼쪽 행렬의 열 수가 오른쪽 행렬의 행 수와 같은 경우에만 정의된다."}, {"id": 36, "sec": "2.4", "diff": "중급", "q": "행렬 곱셈의 교환 법칙에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["일반적으로 AB ≠ BA 이다", "항상 AB = BA 가 성립한다", "A와 B가 정방 행렬이면 항상 AB = BA 가 성립한다", "AB는 A와 B의 같은 위치 성분끼리 곱한 결과이므로 AB = BA 이다"], "a": 0, "exp": "행렬 곱셈은 일반적으로 교환 법칙이 성립하지 않아 AB ≠ BA 이다. 성분별 곱셈은 행렬 곱셈이 아니라 아다마르 곱에 해당한다."}, {"id": 37, "sec": "2.4", "diff": "심화", "q": "[[2, 3, 4], [1, 0, 0]] · [[0, 1000], [1, 100], [0, 10]] 의 결과로 옳은 것은?", "opts": ["[[3, 1110], [0, 1000]]", "[[2340, 3], [1000, 0]]", "[[3, 2340], [1, 1000]]", "[[3, 2340], [0, 1000]]"], "a": 3, "exp": "(AB)11 = 2·0 + 3·1 + 4·0 = 3, (AB)12 = 2·1000 + 3·100 + 4·10 = 2340, (AB)21 = 1·0 + 0 + 0 = 0, (AB)22 = 1·1000 + 0 + 0 = 1000 이다."}, {"id": 38, "sec": "2.4", "diff": "기초", "q": "행렬의 전치(Transpose) 연산을 정의하는 식으로 옳은 것은?", "opts": ["(A^T)ij = -Aij", "(A^T)ij = Aji", "(A^T)ij = Aij", "(A^T)ij = 1 / Aij"], "a": 1, "exp": "전치는 행렬 A의 행과 열을 교환하는 연산이므로 (A^T)ij = Aji 이다. 예를 들어 [[1,2,3],[0,-6,7]]의 전치는 [[1,0],[2,-6],[3,7]] 이 된다."}, {"id": 39, "sec": "2.4", "diff": "심화", "q": "강의자료가 제시한 행렬의 중요 속성 중 옳지 않은 것은?", "opts": ["(AB)^T = A^T B^T", "(A + B)^T = A^T + B^T", "(A^T)^T = A", "A(BC) = (AB)C"], "a": 0, "exp": "곱의 전치는 순서가 뒤바뀌어 (AB)^T = B^T A^T 가 된다. 나머지 세 가지는 모두 강의자료가 제시한 옳은 속성이다."}, {"id": 40, "sec": "2.4", "diff": "기초", "q": "정방 행렬(Square matrix)의 정의로 옳은 것은?", "opts": ["모든 원소가 1인 행렬", "역행렬이 전치행렬과 같은 행렬", "행과 열의 수가 동일한 행렬", "대각 원소를 제외한 모든 원소가 0인 행렬"], "a": 2, "exp": "정방 행렬은 행과 열의 수가 동일한 행렬이다. 역행렬이 전치행렬과 같은 것은 직교 행렬의 정의이다."}, {"id": 41, "sec": "2.4", "diff": "중급", "q": "항등행렬 I_n 에 대한 설명으로 옳은 것은?", "opts": ["모든 원소가 1인 n × n 행렬이다", "n × n 정방 행렬 중 aii = 1 (1 ≤ i ≤ n)이고 그 외 원소는 모두 0인 행렬이다", "첫 번째 행만 1이고 나머지 원소는 0인 행렬이다", "대각 원소가 0이고 나머지 원소가 1인 행렬이다"], "a": 1, "exp": "항등행렬은 n × n 정방 행렬 중 대각 성분 aii가 1이고 그 외 원소는 0인 행렬이다. 예를 들어 I3 = [[1,0,0],[0,1,0],[0,0,1]] 이다."}, {"id": 42, "sec": "2.4", "diff": "중급", "q": "행렬 A ∈ R^(m×n) 를 행 벡터의 모음으로 표시할 때, 행렬-벡터 곱 Ax (x ∈ R^n)에 대한 설명으로 옳은 것은?", "opts": ["Ax는 길이 n의 행벡터이며 i번째 요소는 ai + x 이다", "Ax는 길이 n의 열벡터이며 i번째 요소는 ||ai|| ||x|| 이다", "Ax는 m × n 행렬이며 각 요소는 aij · xj 이다", "Ax는 길이 m의 열벡터이며 i번째 요소는 내적 ai^T x 이다"], "a": 3, "exp": "행렬-벡터 곱은 길이 m의 열벡터이며 i번째 요소는 A의 i번째 행 벡터와 x의 내적 ai^T x 이다. 크기로 보면 A(m × n) · x(n × 1) = Ax(m × 1) 이다."}, {"id": 43, "sec": "2.4", "diff": "중급", "q": "A ∈ R^(n×k), B ∈ R^(k×m) 일 때 C = AB 의 크기와 성분의 의미로 옳은 것은?", "opts": ["C는 k × k 이며, Cij 는 A의 i번째 열과 B의 j번째 행의 합이다", "C는 n × k 이며, Cij 는 A와 B의 같은 위치 성분의 곱이다", "C는 n × m 이며, Cij 는 A의 i번째 행과 B의 j번째 열의 내적이다", "C는 m × n 이며, Cij 는 B의 i번째 행과 A의 j번째 열의 내적이다"], "a": 2, "exp": "행렬-행렬 곱은 A(n × k) · B(k × m) = C(n × m) 이며, C의 (i, j) 성분은 A의 i번째 행 벡터와 B의 j번째 열 벡터의 내적 ai^T bj 이다."}, {"id": 44, "sec": "2.4", "diff": "중급", "q": "A = [[1, 2, 3], [3, 1, 4]], B = [[5, 2, 2], [-1, 3, 3]] 일 때 A + B 는?", "opts": ["[[6, 4, 5], [2, 4, 7]]", "[[6, 4, 5], [2, 4, 6]]", "[[-4, 0, 1], [4, -2, 1]]", "[[5, 4, 6], [-3, 3, 12]]"], "a": 0, "exp": "같은 위치의 성분끼리 더하면 [[1+5, 2+2, 3+2], [3+(-1), 1+3, 4+3]] = [[6, 4, 5], [2, 4, 7]] 이다."}, {"id": 45, "sec": "2.4", "diff": "심화", "q": "A = [[1, 2, 3], [3, 1, 4]], B = [[2, 5], [6, 1], [-1, 2]] 일 때 AB 는?", "opts": ["[[11, 13], [8, 24]]", "[[11, 13], [8, 20]]", "[[13, 11], [24, 8]]", "크기가 맞지 않아 정의되지 않는다"], "a": 0, "exp": "A는 2 × 3, B는 3 × 2 이므로 AB는 2 × 2 이다. (AB)11 = 1·2+2·6+3·(-1) = 11, (AB)12 = 1·5+2·1+3·2 = 13, (AB)21 = 3·2+1·6+4·(-1) = 8, (AB)22 = 3·5+1·1+4·2 = 24 이다."}, {"id": 46, "sec": "2.4", "diff": "기초", "q": "정방 행렬 A의 역행렬 A^(-1) 을 정의하는 식으로 옳은 것은?", "opts": ["A^(-1) + A = I", "A^(-1) A = 0", "A^(-1) A = A A^(-1) = I", "A^(-1) = A^T 가 모든 정방 행렬에 대해 성립"], "a": 2, "exp": "정방 행렬 A에 대하여 곱하였을 때 항등행렬을 만드는 행렬을 역행렬이라 하며 A^(-1) A = A A^(-1) = I 로 정의된다."}, {"id": 47, "sec": "2.4", "diff": "중급", "q": "역행렬의 특성으로 강의자료가 제시한 것을 옳게 나열한 것은?", "opts": ["(A^(-1))^(-1) = A^(-1), (AB)^(-1) = A^(-1) B^(-1)", "(A^(-1))^(-1) = A^T, (AB)^(-1) = AB", "(A^(-1))^(-1) = I, (AB)^(-1) = B^(-1) A", "(A^(-1))^(-1) = A, (AB)^(-1) = B^(-1) A^(-1)"], "a": 3, "exp": "역행렬을 두 번 취하면 원래 행렬로 돌아오고, 곱의 역행렬은 전치와 마찬가지로 순서가 뒤바뀌어 (AB)^(-1) = B^(-1) A^(-1) 이 된다."}, {"id": 48, "sec": "2.4", "diff": "중급", "q": "큰 행렬의 역행렬을 구하는 것에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["행렬의 크기와 무관하게 계산 비용이 항상 일정하다", "계산 비용이 많이 들며 수치적 불안정성을 초래할 수 있다", "계산이 매우 빠르며 언제나 수치적으로 안정적이다", "전치 연산으로 언제나 대체할 수 있어 별도의 비용이 들지 않는다"], "a": 1, "exp": "강의자료는 큰 행렬의 역행렬을 찾는 것은 계산 비용이 많이 들고 수치적 불안정성을 초래할 수 있다고 설명한다. 전치로 대체할 수 있는 것은 직교 행렬에 한정된다."}, {"id": 49, "sec": "2.4", "diff": "중급", "q": "직교 행렬(orthogonal matrix)의 정의로 옳은 것은?", "opts": ["모든 원소가 0 또는 1로만 구성된 행렬", "역행렬이 존재하지 않는 행렬", "역행렬이 전치행렬과 같은 행렬, 즉 A^(-1) = A^T 인 행렬", "행과 열의 수가 서로 다른 행렬"], "a": 2, "exp": "행렬의 역행렬이 전치행렬과 같으면 직교 행렬이라고 하며, 이때 A^T A = A A^T = I 가 성립한다."}, {"id": 50, "sec": "2.4", "diff": "기초", "q": "텐서(tensor)와 그 차수에 대한 설명으로 옳은 것은?", "opts": ["텐서는 스칼라의 n차원 배열이며, 벡터는 1차 텐서, 행렬은 2차 텐서이다", "텐서는 항상 3차원 배열만을 의미한다", "벡터는 2차 텐서이고 행렬은 3차 텐서이다", "텐서는 정방 행렬만을 가리키는 용어이다"], "a": 0, "exp": "텐서는 스칼라의 n차원 배열이며 벡터 v ∈ R^n 은 1차 텐서, 행렬 A ∈ R^(m×n) 은 2차 텐서이다. 4차 텐서는 T ∈ R^(n1×n2×n3×n4) 로 표기한다."}, {"id": 51, "sec": "2.4", "diff": "중급", "q": "RGB 이미지를 텐서로 표현할 때에 대한 설명으로 옳은 것은?", "opts": ["1차 텐서이며 축은 픽셀 인덱스 하나뿐이다", "2차 텐서이며 축은 너비와 높이이다", "4차 텐서이며 축은 너비, 높이, 채널, 시간이다", "3차 텐서이며 축은 너비, 높이, 채널이다(예: 224 × 224 × 3)"], "a": 3, "exp": "RGB 이미지는 3차원 배열이므로 3차 텐서이며, 3개의 축은 너비, 높이, 채널에 해당한다. 채널 축은 빨간색·녹색·파란색의 색상 채널을 의미한다."}, {"id": 52, "sec": "2.4", "diff": "기초", "q": "벡터 b1, b2 와 실수 a1, a2 에 대하여 a1·b1 + a2·b2 를 무엇이라고 하는가?", "opts": ["b1 과 b2 의 내적", "b1 과 b2 의 선형 결합(Linear combination)", "b1 과 b2 의 아다마르 곱", "b1 과 b2 의 노름"], "a": 1, "exp": "벡터에 실수를 곱하여 더한 형태 a1·b1 + a2·b2 를 두 벡터의 선형 결합(Linear combination)이라고 한다."}, {"id": 53, "sec": "2.4", "diff": "중급", "q": "벡터들 v1, ..., vk 가 선형 독립이라는 것의 정의로 옳은 것은?", "opts": ["a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 조합이 하나라도 존재할 때", "a1·v1 + ... + ak·vk = 0 이 a1 = ... = ak = 0 일 때만 성립할 때", "모든 벡터쌍의 내적이 0일 때", "모든 벡터의 노름이 1로 같을 때"], "a": 1, "exp": "선형 독립은 a1·v1 + ... + ak·vk = 0 이라는 관계가 모든 계수가 0일 때만 성립하는 경우를 뜻한다. 모든 벡터쌍의 내적이 0인 것은 직교로, 선형 독립의 정의와는 다르다."}, {"id": 54, "sec": "2.4", "diff": "심화", "q": "벡터들의 집합 v1, ..., vk 가 선형 종속(Linearly dependent) 관계에 있다는 것의 정의로 옳은 것은?", "opts": ["a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 a1, ..., ak 가 존재한다", "a1·v1 + ... + ak·vk = 0 이 모든 계수가 0일 때만 성립한다", "벡터들의 개수 k가 벡터의 차원 n보다 작다", "모든 벡터가 서로 직교한다"], "a": 0, "exp": "선형 종속은 모든 계수가 0인 자명한 경우 외에도 a1·v1 + ... + ak·vk = 0 을 만족하는 0이 아닌 실수 계수가 존재하는 경우를 말한다. 모든 계수가 0일 때만 성립하면 선형 독립이다."}, {"id": 55, "sec": "2.5", "diff": "기초", "q": "함수 f: R → R 에 대한 도함수(derivative) f'(x)의 정의로 옳은 것은?", "opts": ["f'(x) = lim(h→0) [f(x) - f(h)] / x", "f'(x) = lim(h→0) [f(x + h) + f(x)] / h", "f'(x) = lim(h→0) [f(x + h) - f(x)] / h", "f'(x) = lim(h→0) h / [f(x + h) - f(x)]"], "a": 2, "exp": "도함수는 x가 h만큼 변할 때의 함수값 변화량을 h로 나눈 값의 h → 0 극한으로 정의되며, x에 대한 f(x)의 순간 변화율로 해석할 수 있다."}, {"id": 56, "sec": "2.5", "diff": "중급", "q": "미분 가능성에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["f'(a)가 존재하지 않아도 f는 a에서 미분 가능하다", "f가 구간 [a, b]의 어느 한 점에서만 미분 가능하면 그 구간 전체에서 미분 가능하다", "f가 연속이면 항상 미분 가능하다고 강의자료에 정의되어 있다", "f'(a)가 극한 값으로 존재하면 f는 a에서 미분 가능하며, f'(c)가 모든 c ∈ [a, b]에 대해 존재하면 그 구간에서 미분 가능하다"], "a": 3, "exp": "강의자료는 f'(a)가 극한 값으로 존재할 때 f가 a에서 미분 가능하고, f'(c)가 구간 [a, b]의 모든 c에 대해 존재하면 그 구간에서 미분 가능하다고 정의한다."}, {"id": 57, "sec": "2.5", "diff": "기초", "q": "명시적 함수의 도함수 계산 규칙 중 옳은 것을 짝지은 것은?", "opts": ["상수의 미분: d/dx (c) = 0, 선형 함수의 미분: d/dx (ax) = a", "상수의 미분: d/dx (c) = c, 선형 함수의 미분: d/dx (ax) = ax", "상수의 미분: d/dx (c) = 1, 선형 함수의 미분: d/dx (ax) = x", "상수의 미분: d/dx (c) = 0, 선형 함수의 미분: d/dx (ax) = 0"], "a": 0, "exp": "상수의 도함수는 0이고, 선형 함수 ax의 도함수는 계수 a가 된다."}, {"id": 58, "sec": "2.5", "diff": "기초", "q": "거듭제곱 규칙(Power rule)을 옳게 표현한 것은?", "opts": ["d/dx (x^n) = x^(n-1)", "d/dx (x^n) = n·x^(n+1)", "d/dx (x^n) = n·x^(n-1)", "d/dx (x^n) = (1/n)·x^n"], "a": 2, "exp": "거듭제곱 규칙은 d/dx (x^n) = n·x^(n-1) 이다."}, {"id": 59, "sec": "2.5", "diff": "중급", "q": "지수 함수와 로그 함수의 미분 규칙을 옳게 짝지은 것은?", "opts": ["d/dx (e^x) = x·e^(x-1), d/dx log(x) = log(x)/x", "d/dx (e^x) = e^x, d/dx log(x) = 1/x", "d/dx (e^x) = 1/e^x, d/dx log(x) = x", "d/dx (e^x) = e^(x-1), d/dx log(x) = -1/x"], "a": 1, "exp": "지수 함수 e^x 는 미분해도 그대로 e^x 이고, 로그 함수 log(x)의 도함수는 1/x 이다."}, {"id": 60, "sec": "2.5", "diff": "중급", "q": "곱의 규칙(Product rule)을 옳게 표현한 것은?", "opts": ["d/dx [g(x)·h(x)] = (dg/dx)(x) · (dh/dx)(x)", "d/dx [g(x)·h(x)] = g(x)·h(x) + (dg/dx)(x)·(dh/dx)(x)", "d/dx [g(x)·h(x)] = (dg/dx)(x) + (dh/dx)(x)", "d/dx [g(x)·h(x)] = g(x)·(dh/dx)(x) + (dg/dx)(x)·h(x)"], "a": 3, "exp": "곱의 규칙은 앞의 함수를 그대로 두고 뒤를 미분한 항과, 앞을 미분하고 뒤를 그대로 둔 항의 합이다. 도함수끼리 곱하는 형태는 성립하지 않는다."}, {"id": 61, "sec": "2.5", "diff": "심화", "q": "연쇄 법칙(Chain rule)을 옳게 표현한 것은?", "opts": ["d/dx g(h(x)) = (dg/dx)(x) · (dh/dx)(x)", "d/dx g(h(x)) = (dg/dh)(x) + (dh/dx)(x)", "d/dx g(h(x)) = (dg/dh)(h(x)) · (dh/dx)(x)", "d/dx g(h(x)) = g(h(x)) · (dh/dx)(x)"], "a": 2, "exp": "합성 함수의 미분인 연쇄 법칙은 바깥 함수를 안쪽 함수 값 h(x)에서 미분한 값과 안쪽 함수의 도함수를 곱한 형태이다."}, {"id": 62, "sec": "2.5", "diff": "중급", "q": "2계 도함수(second derivative)의 정의로 옳은 것은?", "opts": ["1계 도함수를 다시 미분한 것으로 d^2f/dx^2 = (d/dx)(df/dx) 이다", "1계 도함수를 제곱한 것으로 d^2f/dx^2 = (df/dx)^2 이다", "1계 도함수를 적분한 것이다", "두 변수에 대해 각각 한 번씩 편미분한 것이다"], "a": 0, "exp": "함수 f(x)의 1계 도함수를 다시 미분한 것이 2계 도함수이며, d^2f/dx^2 = (d/dx)(df/dx) 로 표기한다."}, {"id": 63, "sec": "2.5", "diff": "중급", "q": "2차 미분(2계 도함수)의 물리적 의미에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["함수가 물체의 변위를 설명할 때 2차 도함수는 물체의 변위 자체를 제공한다", "2차 도함수는 언제나 0이 되어 물리적 의미가 없다", "함수가 물체의 속도를 설명할 때 2차 도함수는 물체의 위치를 제공한다", "함수가 물체의 변위를 설명할 때 1차 도함수는 속도, 2차 도함수는 가속도를 제공한다"], "a": 3, "exp": "2차 미분은 f(x)의 변화율의 변화 정도를 수치화한다. 함수가 변위를 나타내면 1차 도함수는 속도(위치의 변화율), 2차 도함수는 가속도(속도의 변화율)이다."}, {"id": 64, "sec": "2.5", "diff": "기초", "q": "다변량 함수(Multivariate functions)에 대한 설명으로 옳은 것은?", "opts": ["출력이 벡터이고 입력이 스칼라인 함수이다", "여러 개의 변수가 정의역을 구성하는 함수로, 입력은 n차원 벡터이고 출력은 스칼라이다(f: R^n → R)", "정의역이 항상 2차원으로 제한된 함수이다", "입력과 출력이 모두 행렬인 함수이다"], "a": 1, "exp": "여러 개의 변수가 정의역을 구성하는 함수를 다변량 함수라고 하며, y = f(x) = f(x1, ..., xn) 의 입력은 n차원 벡터이고 출력은 스칼라 y 이다."}, {"id": 65, "sec": "2.5", "diff": "중급", "q": "i번째 매개변수 xi 에 대한 y의 편미분(Partial derivative) 정의로 옳은 것은?", "opts": ["∂y/∂xi = lim(h→0) [f(x1, ..., xn) - f(h, ..., h)] / h", "∂y/∂xi = lim(h→0) [f(x1+h, ..., xn+h) - f(x1, ..., xn)] / h", "∂y/∂xi = lim(h→0) h / [f(x1, ..., xi+h, ..., xn) - f(x1, ..., xi, ..., xn)]", "∂y/∂xi = lim(h→0) [f(x1, ..., xi+h, ..., xn) - f(x1, ..., xi, ..., xn)] / h"], "a": 3, "exp": "편미분은 i번째 변수 xi 에만 h를 더해 변화시킨 함수값의 차이를 h로 나눈 극한이다. 모든 변수를 동시에 변화시키는 것이 아니다."}, {"id": 66, "sec": "2.5", "diff": "기초", "q": "편미분 ∂y/∂xi 를 실제로 계산하는 방법으로 옳은 것은?", "opts": ["모든 변수를 동시에 미분한 뒤 그 합을 구한다", "모든 변수를 상수로 취급하여 미분한다", "xi 를 제외한 나머지 변수를 상수로 취급하고 xi 에 대해서만 y의 도함수를 계산한다", "xi 를 상수로 취급하고 나머지 변수에 대해 도함수를 계산한다"], "a": 2, "exp": "편미분은 x1, ..., x(i-1), x(i+1), ..., xn 을 상수로 취급하고 xi 에 대해서만 y의 도함수를 계산한다."}, {"id": 67, "sec": "2.5", "diff": "중급", "q": "n차원 입력 벡터 x에 대한 다변량 함수 f(x)의 기울기(Gradient) 정의로 옳은 것은?", "opts": ["각 변수에 대한 편미분 결과를 성분으로 갖는 벡터 [∂f/∂x1, ∂f/∂x2, ..., ∂f/∂xn]^T", "모든 편미분 값을 더한 하나의 스칼라 값", "2계 편미분들을 모아 만든 n × n 행렬", "f(x)의 최대값과 최소값의 차이"], "a": 0, "exp": "기울기는 각 변수에 대한 편미분 결과로 구성된 벡터로 정의되며, ∇x f(x) = [∂f(x)/∂x1, ..., ∂f(x)/∂xn]^T 이다."}, {"id": 68, "sec": "2.5", "diff": "기초", "q": "기울기 표기와 기계학습에서의 역할에 대한 설명으로 옳은 것은?", "opts": ["기울기의 표기에는 그리스 문자 Σ(\"시그마\")를 사용하며 데이터 개수를 세는 데 쓰인다", "기울기의 표기에는 기호 ∇(\"nabla/del\"로 발음)를 사용하며, 기계학습에서 모델의 인자를 갱신하는 과정에 중요하게 활용된다", "기울기는 ∂로 표기하며 훈련 데이터를 정규화하는 데 사용된다", "기울기는 행렬을 전치하는 연산자이며 학습과는 무관하다"], "a": 1, "exp": "그레디언트는 기호 ∇(\"nabla/del\")로 표기하며, ∇x f(x)는 \"벡터 x에 대한 f의 기울기\"라고 부른다. 기계학습에서는 모델의 인자를 갱신하는 과정에서 중요하게 활용된다."}, {"id": 69, "sec": "2.5", "diff": "중급", "q": "기계학습에서의 목적함수(Objective function)와 비용 함수(cost function)에 대한 설명으로 옳은 것은?", "opts": ["학습 과정에서 부여되는 목표를 정량적으로 표현한 것이 목적함수이고, 최소화 문제에서 목적 함수는 종종 비용 함수·손실 함수·오류 함수라고 불린다", "목적함수는 항상 최대화 대상이며 비용 함수와는 전혀 다른 개념이다", "비용 함수는 모델의 학습 시간을 측정하는 함수이다", "목적함수는 훈련 데이터의 개수를 세는 함수이다"], "a": 0, "exp": "학습 과정에서 부여되는 목표를 정량적으로 표현한 것이 목적함수이며, 최소화 문제에서는 이를 비용 함수(cost function), 손실 함수(loss function), 오류 함수(error function)라고도 부른다."}, {"id": 70, "sec": "2.5", "diff": "기초", "q": "경사하강법(Gradient descent)에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["훈련 데이터를 무작위로 섞는 방법이다", "행렬의 역행렬을 빠르게 구하는 방법이다", "벡터의 노름을 1로 정규화하는 방법이다", "기울기(Gradient)를 이용하여 모델의 인자 값을 탐색하는 방법이다"], "a": 3, "exp": "경사하강법은 기울기를 이용하여 목적함수를 달성하는 모델의 인자 값을 탐색하는 최적화 방법이다."}, {"id": 71, "sec": "2.5", "diff": "중급", "q": "한 변수 함수 f(x)의 임계점(stationary point)과 그 종류에 대한 설명으로 옳은 것은?", "opts": ["임계점은 f(x) = 0 인 점이며, 최소값·최대값·변곡점으로 나뉜다", "임계점은 도함수가 0인 점 f'(x) = 0 이며, 최소값은 도함수가 음수에서 양수로, 최대값은 양수에서 음수로 변하는 지점이고, 안장점은 도함수가 점 양쪽에서 모두 양수이거나 모두 음수인 지점이다", "임계점은 2계 도함수가 0인 점만을 의미한다", "임계점은 함수가 정의되지 않는 점을 말한다"], "a": 1, "exp": "임계점은 도함수가 0인 점이며, 최소값·최대값·안장점으로 구분된다. 최소점과 최대점을 총칭하여 극점이라고 한다."}, {"id": 72, "sec": "2.5", "diff": "심화", "q": "임계점의 특성을 2차 도함수로 판정하는 방법으로 옳은 것은?", "opts": ["f''(x) > 0 이면 최대값, f''(x) < 0 이면 최소값, f''(x) = 0 이면 반드시 안장점이다", "f''(x)의 부호와 임계점의 종류는 아무 관계가 없다", "f''(x) > 0 이면 최소값, f''(x) < 0 이면 최대값, f''(x) = 0 이면 안장점이 될 수도 있지만 그렇지 않을 수도 있다", "f''(x) = 0 인 경우에만 극점이 되며, 부호가 있으면 극점이 아니다"], "a": 2, "exp": "2차 도함수가 양수이면 그 점은 최소값, 음수이면 최대값이며, 0인 경우에는 안장점일 수도 있고 아닐 수도 있어 미정이다. 동일한 개념이 다변량 함수의 그래디언트에도 적용된다."}, {"id": 73, "sec": "2.5", "diff": "중급", "q": "전역 최소값(Global minimum)과 지역 최소값(Local minimum)에 대한 설명으로 옳은 것은?", "opts": ["전역 최소값은 x 주변의 아주 작은 범위에서만 가장 작은 값이다", "기계학습의 목적 함수에는 지역 최소값이 언제나 하나만 존재한다", "정의역의 모든 원소에 대하여 목적 함수 값이 최소가 되는 값이 전역 최소값이고, x 주변의 아주 작은 범위의 다른 지점보다 작은 목적 함수 값이 지역 최소값이다", "지역 최소값에 도달하면 항상 쉽게 전역 최소값으로 이동할 수 있다"], "a": 2, "exp": "전역 최소값은 정의역 전체에서 목적 함수가 최소가 되는 값이고, 지역 최소값은 주변의 아주 작은 범위에서만 최소인 값이다. 기계학습의 목적 함수에는 여러 개의 지역 최소값이 존재하며, 한 지역 최소값에 도달하면 다른 인자 값을 탐색하기 어렵다."}, {"id": 74, "sec": "2.6", "diff": "기초", "q": "확률 변수(Random variable)의 정의로 옳은 것은?", "opts": ["사건이 발생할 가능성을 0과 1 사이의 값으로 나타낸 상수", "사건의 표본 공간(시행에서 가능한 모든 결과의 모임)을 정의역으로 하는 함수", "증명 없이 옳다고 간주되는 명제", "확률 변수가 특정한 값을 가질 확률을 나타내는 함수"], "a": 1, "exp": "확률 변수는 사건의 표본 공간을 정의역으로 하는 함수이다. 확률 변수가 특정한 값을 가질 확률을 나타내는 함수는 확률 분포이고, 증명 없이 옳다고 간주되는 명제는 공리이다."}, {"id": 75, "sec": "2.6", "diff": "중급", "q": "정상적인 주사위를 던져 앞 면의 수를 확률 변수 X로 표현할 때, 강의자료의 설명으로 옳지 않은 것은?", "opts": ["X의 정의역은 S = {1, 2, 3, 4, 5, 6} 이다", "5가 나오는 사건은 {X = 5} 또는 X = 5 로 표시한다", "해당 사건의 확률은 P({X = 5}) 또는 P(X = 5)로 표시한다", "X는 연속 확률 변수이므로 확률을 적분으로 계산해야 한다"], "a": 3, "exp": "주사위의 눈은 값이 유한하므로 X는 이산형 확률 변수이며 확률 질량 함수(PMF)로 확률을 표시한다. 적분으로 계산하는 것은 연속 확률 변수의 경우이다."}, {"id": 76, "sec": "2.6", "diff": "기초", "q": "확률 분포(probability distribution)와 표기법 X ~ P(·) 의 의미로 옳은 것은?", "opts": ["확률 분포는 확률 변수가 특정한 값을 가질 확률을 나타내는 함수이며, X ~ P(·)는 확률 변수 X가 임의의 확률 분포 P(·)를 따른다는 의미이다", "확률 분포는 표본 공간을 정의역으로 하는 함수이며, X ~ P(·)는 X와 P가 서로 독립임을 뜻한다", "확률 분포는 확률 변수의 평균값이며, X ~ P(·)는 X의 기대값이 P라는 의미이다", "확률 분포는 확률 변수의 정의역 크기이며, X ~ P(·)는 X의 분산을 나타낸다"], "a": 0, "exp": "확률 분포는 확률 변수가 특정한 값을 가질 확률을 나타내는 함수이며, X ~ P(·) 표기법은 확률 변수 X가 임의의 확률 분포 P(·)를 따른다는 의미이다."}, {"id": 77, "sec": "2.6", "diff": "기초", "q": "이산형 확률 변수(Discrete random variables)에 해당하는 예로 옳은 것은?", "opts": ["아날로그 시계의 시침과 분침이 이루는 각도", "한 개의 동전을 던졌을 때 나올 수 있는 경우의 수, 또는 2의 눈이 나올 때까지 주사위를 던지는 횟수", "20대 남성의 키", "두 지점 사이를 이동하는 데 걸린 실제 시간"], "a": 1, "exp": "이산형 확률 변수는 부여될 수 있는 값이 유한하거나 셀 수 있는 경우이다. 동전 던지기의 경우의 수나 주사위를 던지는 횟수(1, 2, 3, ...)가 이에 해당한다. 각도, 키, 시간은 연속 확률 변수의 예이다."}, {"id": 78, "sec": "2.6", "diff": "중급", "q": "연속 확률 변수(Continuous random variables)에 대한 설명으로 옳은 것은?", "opts": ["확률 변수에 부여될 수 있는 값이 항상 정수로 제한된다", "확률 변수에 부여될 수 있는 값의 개수가 유한하다", "값이 셀 수 있는 경우에만 연속 확률 변수라고 한다", "확률 변수에 부여될 수 있는 값에 끊김이 없는 확률 변수이며, 아날로그 시계의 시침과 분침이 이루는 각도가 그 예이다"], "a": 3, "exp": "연속 확률 변수는 부여될 수 있는 값에 끊김이 없는 확률 변수이며, 강의자료는 그 예로 아날로그 시계의 시침과 분침이 이루는 각도를 든다."}, {"id": 79, "sec": "2.6", "diff": "심화", "q": "확률의 공리(Axioms of probability)로 강의자료가 제시한 것이 아닌 것은?", "opts": ["서로소가 아닌 임의의 두 사건 A1, A2에 대하여 P(A1 ∪ A2) = P(A1) + P(A2)", "P(S) = 1 (S는 표본 공간)", "모든 A ⊆ S 에 대하여 P(A) ≥ 0", "A1 ∩ A2 = ∅ 인 모든 A1, A2 ⊆ S 에 대하여 P(A1 ∪ A2) = P(A1) + P(A2)"], "a": 0, "exp": "확률의 덧셈 공리는 두 사건의 교집합이 공집합(서로소)인 경우에만 성립한다. 교집합이 있는 경우에는 그대로 더할 수 없으므로 첫 번째 보기는 공리가 아니다."}, {"id": 80, "sec": "2.6", "diff": "기초", "q": "확률 질량 함수(Probability mass function, PMF)에 대한 설명으로 옳은 것은?", "opts": ["연속 확률 변수의 확률을 표시하는 함수이다", "확률 변수의 기대값을 계산하는 함수이다", "이산형 확률 변수의 확률을 표시하는 함수이며, 두 주사위의 합을 X로 표시할 때 P(X = x), x ∈ {2, 3, ..., 12} 가 그 예이다", "확률 변수의 분산을 표시하는 함수이다"], "a": 2, "exp": "이산형 확률 변수의 확률을 표시하는 함수를 확률 질량 함수(PMF)라고 하며, 두 주사위의 합을 확률 변수 X로 나타낼 때 P(X = x), x ∈ {2, 3, ..., 12} 가 대표적인 예이다."}, {"id": 81, "sec": "2.6", "diff": "중급", "q": "연속 확률 변수가 구간 [a, b]에 속하는 값을 가질 확률을 계산하는 방법으로 옳은 것은?", "opts": ["확률 밀도 함수(PDF)를 구간 [a, b]에 대하여 적분한다", "확률 밀도 함수의 값을 구간의 양 끝에서 더한다", "확률 질량 함수를 구간 [a, b]에 대하여 미분한다", "구간 [a, b]의 길이를 표본 공간의 크기로 나눈다"], "a": 0, "exp": "연속 확률 변수의 확률을 표시하는 함수를 확률 밀도 함수(PDF)라고 하며, 구간에 속할 확률은 P(X ∈ [a, b]) = ∫(a에서 b까지) P(X) dX 로 계산한다."}, {"id": 82, "sec": "2.6", "diff": "중급", "q": "확률 변수 X가 P(X)를 따를 때, X의 함수 f(X)에 대한 기대값의 정의를 옳게 짝지은 것은?", "opts": ["이산형: ∫ P(X) f(X) dX / 연속형: 합 X P(X) f(X)", "이산형: 합 X f(X) / 연속형: ∫ f(X) dX", "이산형: 합 X P(X) / 연속형: ∫ P(X) dX", "이산형: 합 X P(X) f(X) / 연속형: ∫ P(X) f(X) dX"], "a": 3, "exp": "이산형 확률 변수의 기대값은 확률과 함수값의 곱의 합, 연속형 확률 변수의 기대값은 확률 밀도와 함수값의 곱의 적분으로 정의된다."}, {"id": 83, "sec": "2.6", "diff": "중급", "q": "분산(Variance)의 정의로 옳은 것은?", "opts": ["Var(f(X)) = E[f(X)]", "Var(f(X)) = E[f(X)] - f(X)", "Var(f(X)) = E[(f(X) - E[f(X)])^2]", "Var(f(X)) = (E[f(X)])^2"], "a": 2, "exp": "분산은 f(X)의 값과 그 기대값 E[f(X)]의 차이를 제곱한 값의 기대값이며, 일반적으로 σ^2 으로 표시한다. 분산이 작으면 반복 측정 시 f(X) 값이 기대값 주변에서 측정된다."}, {"id": 84, "sec": "2.6", "diff": "기초", "q": "표준 편차(standard deviation)에 대한 설명으로 옳은 것은?", "opts": ["분산의 제곱으로 σ = Var(X)^2 로 표기된다", "분산의 제곱근으로 σ = √Var(X) 로 표기된다", "기대값과 같은 값이다", "분산의 역수로 σ = 1/Var(X) 로 표기된다"], "a": 1, "exp": "분산의 제곱근이 표준 편차이며 σ = √Var(X) 로 표기된다."}, {"id": 85, "sec": "2.6", "diff": "중급", "q": "다변량 확률 변수(multivariate random variable)와 확률 벡터(Random vector)에 대한 설명으로 옳은 것은?", "opts": ["하나의 확률 변수를 여러 번 반복 관측한 것을 다변량 확률 변수라고 한다", "다변량 확률 변수는 반드시 두 개의 확률 변수로만 구성된다", "여러 확률 변수의 리스트를 다변량 확률 변수라고 하며, 이를 벡터 형태로 표현한 경우를 확률 벡터라고 한다", "확률 벡터는 확률 값들을 크기 순으로 정렬한 벡터를 의미한다"], "a": 2, "exp": "여러 확률 변수의 리스트를 다변량 확률 변수라 하고, 벡터 형태로 표현할 경우 확률 벡터라고 한다. 예로 자동차를 가격·배기량·연비·생산연도의 네 확률 변수 집합으로 표현할 수 있다."}, {"id": 86, "sec": "2.6", "diff": "중급", "q": "두 이산 확률 변수 X, Y에 대한 결합 확률 함수 p(x, y) = P(X = x, Y = y)가 만족해야 하는 조건으로 옳은 것은?", "opts": ["모든 x, y에 대하여 p(x, y) ≥ 0 이고, 모든 x, y에 대한 합이 1이다", "모든 x, y에 대하여 p(x, y) > 1 이고, 모든 x, y에 대한 합이 0이다", "p(x, y) = P(X = x) - P(Y = y) 이고, 그 합이 1이다", "p(x, y)는 음수가 될 수 있으며 합에는 제약이 없다"], "a": 0, "exp": "결합 확률 함수는 확률 변수 X와 Y가 동시에 x, y 값을 가질 확률을 나타내며, 모든 x, y에 대해 p(x, y) ≥ 0 이고 전체 합이 1이어야 한다."}, {"id": 87, "sec": "2.6", "diff": "중급", "q": "주변 확률 분포(Marginal probability distribution)와 주변화(Marginalization)에 대한 설명으로 옳은 것은?", "opts": ["결합 확률 분포를 두 확률 변수의 곱으로 분해하는 과정이다", "단일 변수의 확률 분포이며, 결합 확률 분포를 기반으로 P(X = x) = 합 y P(X = x, Y = y) 로 계산하는 과정을 주변화라고 한다", "확률 변수 Y가 y로 고정된 상황에서 X에 대한 확률 분포를 뜻한다", "결합 확률 분포에서 가장 큰 확률 값을 선택하는 과정이다"], "a": 1, "exp": "주변 확률 분포는 단일 변수의 확률 분포로 결합 확률 분포를 기반으로 계산되며, 다른 변수에 대해 모두 더하는(연속인 경우 적분하는) 이 과정을 주변화라고 한다."}, {"id": 88, "sec": "2.6", "diff": "중급", "q": "조건부 확률 분포(Conditional probability distribution)의 계산식으로 옳은 것은?", "opts": ["P(X = x | Y = y) = P(X = x) · P(Y = y)", "P(X = x | Y = y) = P(Y = y) / P(X = x, Y = y)", "P(X = x | Y = y) = P(X = x, Y = y) - P(Y = y)", "P(X = x | Y = y) = P(X = x, Y = y) / P(Y = y)"], "a": 3, "exp": "조건부 확률 분포는 확률 변수 Y가 y로 고정된(발생된) 상황에서 X에 대한 확률 분포이며, 결합 확률을 조건이 되는 사건의 확률로 나누어 계산한다."}, {"id": 89, "sec": "2.6", "diff": "심화", "q": "베이즈 정리(Bayes' theorem)와 그 유도에 사용되는 관계를 옳게 나타낸 것은?", "opts": ["P(X|Y) = P(Y|X) · P(Y) / P(X), 곱셈 규칙 P(X, Y) = P(X|Y)P(X)", "P(X|Y) = P(X) · P(Y), 곱셈 규칙 P(X, Y) = P(X) + P(Y)", "P(X|Y) = P(Y) / [P(Y|X) P(X)], 곱셈 규칙 P(X, Y) = P(Y|X)P(Y)", "P(X|Y) = P(Y|X) · P(X) / P(Y), 곱셈 규칙 P(X, Y) = P(Y|X)P(X)"], "a": 3, "exp": "베이즈 정리는 P(X|Y) = P(Y|X)P(X) / P(Y) 이며, 결합 분포에 대한 곱셈 규칙 P(X, Y) = P(Y|X)P(X) 가 사용된다. P(Y, X) = P(X|Y)P(Y) = P(Y|X)P(X) 로도 표현 가능하다."}, {"id": 90, "sec": "2.6", "diff": "중급", "q": "베르누이 분포(Bernoulli distribution)에 대한 설명으로 옳은 것은?", "opts": ["확률 변수가 가질 수 있는 모든 값의 가능성이 동일한 분포이다", "한 개의 이진 확률 변수에 대한 확률 분포이며, x = 1일 확률이 p이면 x = 0일 확률은 1 - p 이고 P(X = x) = p^x (1-p)^(1-x) 로 쓸 수 있다", "평균과 분산 두 개의 인자로 정의되는 연속 확률 분포이다", "확률 변수가 1부터 n까지의 값을 각각 1/n의 확률로 갖는 분포이다"], "a": 1, "exp": "베르누이 분포는 한 개의 이진 확률 변수에 대한 확률 분포로, 시행 결과가 두 가지 값 중 하나로 관찰되며 X ~ Bernoulli(p) 로 표기한다. 나머지 보기는 균등 분포와 가우시안 분포의 설명이다."}, {"id": 91, "sec": "2.6", "diff": "기초", "q": "균등 분포(Uniform distribution)에 대한 설명으로 옳은 것은?", "opts": ["확률 변수가 가질 수 있는 모든 값을 취할 가능성이 동일한 분포이며, X가 1부터 n까지의 값을 취할 때 P(X = i) = 1/n 이고 X ~ U(n) 으로 표기한다", "한 개의 이진 확률 변수에 대한 분포로 P(X = 1) = p 이다", "평균 근처의 값이 가장 높은 확률을 갖는 종 모양의 분포이다", "확률 변수의 값이 커질수록 확률이 지수적으로 감소하는 분포이다"], "a": 0, "exp": "균등 분포는 확률 변수가 가질 수 있는 모든 값을 취할 가능성이 동일한 경우의 확률 분포이며, 1부터 n까지 값을 동일 확률로 취하면 P(X = i) = 1/n, X ~ U(n) 으로 표기한다(예: n = 5, p = 0.2)."}, {"id": 92, "sec": "2.6", "diff": "중급", "q": "가우시안 분포(Gaussian distribution) 혹은 정규 분포(Normal distribution)에 대한 설명으로 옳은 것은?", "opts": ["최대값과 최소값 두 인자로 정의되며 X ~ U(a, b) 로 표기한다", "성공 확률 p 하나로 정의되며 이산형 확률 변수만 다룬다", "평균 μ 와 분산 σ^2 를 이용하여 정의되며 X ~ N(μ, σ^2) 로 표기하고, 확률 밀도 함수는 P_X(x) = 1/√(2πσ^2) · exp(-(x-μ)^2 / (2σ^2)) 이다", "평균 μ 하나만으로 정의되며 확률 밀도 함수에 분산이 등장하지 않는다"], "a": 2, "exp": "가우시안 분포는 평균 μ와 분산 σ^2 두 인자로 정의되며 X ~ N(μ, σ^2) 로 표기하고, 확률 밀도 함수는 1/√(2πσ^2) · exp(-(x-μ)^2 / (2σ^2)) 이다."}, {"id": 93, "sec": "2.7", "diff": "기초", "q": "Numpy 라이브러리를 불러오는 관례적인 코드와 그 의미로 옳은 것은?", "opts": ["from numpy import * — numpy를 np라는 이름으로 부르기로 약속하는 것", "import numpy as np — numpy 라이브러리를 np라는 이름으로 불러와 numpy.~~~ 를 np.~~~ 로 쓰기로 약속하는 것", "import np as numpy — np 모듈을 numpy라는 별칭으로 부르는 것", "include numpy — numpy의 소스 코드를 현재 파일에 복사해 넣는 것"], "a": 1, "exp": "실습 자료는 import numpy as np 로 라이브러리를 불러오며, 이는 numpy.~~~ 대신 np.~~~ 로 쓰기로 약속하는 것이다. numpy는 배열에 대한 다양한 수학 연산을 제공하는 라이브러리이다."}, {"id": 94, "sec": "2.7", "diff": "기초", "q": "a = np.array(1.), b = np.array([1., 2., 3.]), c = np.array([[1., 2., 3.], [4., 5., 6.]]) 일 때 a.ndim, b.ndim, c.ndim 의 값을 순서대로 옳게 나열한 것은?", "opts": ["1, 2, 3", "1, 1, 2", "0, 1, 2", "0, 0, 1"], "a": 2, "exp": "ndim은 배열의 차원 수를 알려준다. 스칼라 값은 0차원 배열, 벡터는 1차원 배열, 행렬은 2차원 배열이므로 각각 0, 1, 2 이다."}, {"id": 95, "sec": "2.7", "diff": "중급", "q": "c = np.array([[1., 2., 3.], [4., 5., 6.]]) 와 d = np.array([[1, 2, 3]]) 에 대하여 c.shape 와 d.shape 를 순서대로 옳게 구한 것은?", "opts": ["(3, 2) 와 (3, 1)", "(2, 3) 와 (3,)", "(6,) 와 (3,)", "(2, 3) 와 (1, 3)"], "a": 3, "exp": "shape는 각 차원에 존재하는 요소의 수를 알려준다. c는 행 2개, 열 3개이므로 (2, 3)이고, d는 대괄호가 두 겹이므로 1개의 행과 3개의 열을 갖는 (1, 3)이다. np.array([1,2,3]) 처럼 대괄호가 한 겹이면 (3,)이 된다."}, {"id": 96, "sec": "2.7", "diff": "중급", "q": "Numpy 배열 생성 함수에 대한 설명으로 옳은 것은?", "opts": ["np.zeros((2, 5))는 0으로 채워진 2 × 5 배열을, np.full((2, 5), 5)는 5로 채워진 2 × 5 배열을 만든다", "np.ones(10)은 0으로 채워진 길이 10의 배열을 만든다", "np.arange(10)은 1부터 10까지의 정수로 구성된 배열을 만든다", "np.random.random((2, 3, 4))는 실행할 때마다 항상 동일한 값을 반환한다"], "a": 0, "exp": "np.zeros는 0으로, np.full은 지정한 값으로 배열을 채운다. np.ones는 1로 채우고, np.arange(10)은 0부터 9까지의 정수를 만들며(컴퓨터의 인덱스는 0부터 시작), np.random.random은 실행할 때마다 임의의 값을 반환한다."}, {"id": 97, "sec": "2.7", "diff": "중급", "q": "np.arange(10).reshape((5, 2)) 와 a.reshape((6, -1)) 에서 reshape의 동작에 대한 설명으로 옳은 것은?", "opts": ["reshape는 배열의 값을 정렬하는 함수이다", "reshape((5, 2))는 원소 수가 맞지 않아 오류가 발생한다", "reshape의 인자 -1은 항상 마지막 차원의 크기를 1로 만든다", "reshape는 배열을 원하는 모양으로 바꾸는 기능이며, 인자로 -1이 주어지면 전체 원소의 개수와 나머지 인자 값으로부터 그 차원의 크기가 자동으로 추정된다"], "a": 3, "exp": "reshape는 배열을 원하는 모양으로 바꾼다. np.arange(10)의 원소는 10개이므로 (5, 2)로 변형 가능하다. -1이 주어지면 전체 원소 수와 나머지 인자로부터 해당 차원의 값이 추정된다."}, {"id": 98, "sec": "2.7", "diff": "심화", "q": "a = np.arange(10) 일 때 슬라이싱 결과로 옳지 않은 것은?", "opts": ["a[0:10:2] 는 [0 2 4 6 8]", "a[::-1] 는 [9 8 7 6 5 4 3 2 1 0]", "a[-4:] 는 [6 7 8 9]", "a[:-8] 는 [2 3 4 5 6 7 8 9]"], "a": 3, "exp": "a[:-8]은 인덱스 0부터 (원소 수 - 8) 직전까지, 즉 [0 1] 이다. 나머지 세 보기는 각각 간격 2 슬라이싱, 음의 간격으로 뒤집기, 뒤에서 4개 가져오기의 올바른 결과이다."}, {"id": 99, "sec": "2.7", "diff": "심화", "q": "동일한 크기의 Numpy 배열 a, b에 대한 a * b 와 a @ b (또는 np.matmul(a, b))의 차이로 옳은 것은?", "opts": ["a * b 와 a @ b 는 완전히 동일한 연산이다", "a * b 는 같은 위치의 원소끼리 곱하는 아다마르 곱(Hadamard product)이고, a @ b 와 np.matmul(a, b)는 강의 2장에서 배운 행렬 곱이다", "a * b 는 행렬 곱이고, a @ b 는 원소별 곱이다", "a * b 는 두 배열의 내적을 반환하는 스칼라 연산이다"], "a": 1, "exp": "\"*\"와 \"/\" 기호는 동일한 크기의 배열에 대해 A[i,j]와 B[i,j]를 원소별로 계산하는 아다마르 곱(및 나눗셈)이고, N×M 행렬과 M×K 행렬을 곱해 N×K를 얻는 행렬 곱은 matmul 함수 또는 \"@\" 연산자로 표현한다."}, {"id": 100, "sec": "2.7", "diff": "심화", "q": "Numpy의 축(axis) 연산과 배열 조작에 대한 설명으로 옳지 않은 것은?", "opts": ["a.sum(axis=0)은 첫 번째 축을 기준으로, a.sum(axis=1)은 두 번째 축을 기준으로 합을 구한다", "np.vstack은 수직으로, np.hstack은 수평으로 배열을 쌓는다", "np.transpose(a, [0, 2, 1])은 배열 a의 값을 오름차순으로 정렬한다", "브로드캐스팅은 크기가 다른 배열 사이의 연산에서 자동으로 모양을 맞추어 연산을 수행하는 기능이다"], "a": 2, "exp": "np.transpose(a, [0, 2, 1])은 지정한 순서로 축을 바꾸는(여기서는 축 1과 2를 교환하는) 전치 연산이며 값을 정렬하지 않는다. 2차원 배열의 경우 a.T 와 같은 역할을 한다."}];

const SECTIONS = {
  "2.1": "벡터의 정의와 기하학적 표현",
  "2.2": "훈련 데이터와 벡터 노름",
  "2.3": "벡터 내적·코사인 유사도·초평면",
  "2.4": "행렬·역행렬·텐서·선형 독립",
  "2.5": "미분·편미분·기울기와 최적화",
  "2.6": "확률과 확률 분포",
  "2.7": "Numpy 라이브러리 활용"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "mlx_week2_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
