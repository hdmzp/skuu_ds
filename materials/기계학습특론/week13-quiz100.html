<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13주차 딥러닝 생성모델 100문제</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 13 · 딥러닝 생성모델 (GAN)</div>
    <h1>13주차 &middot; 딥러닝 생성모델(GAN) — 100문제</h1>
    <p class="sub">강의자료 13.1~13.6절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    13주차 강의자료(딥러닝 생성모델 · 생성적 적대 신경망) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "13.1", "diff": "기초", "q": "강의자료에서 기존의 딥 러닝과 신경망이 주로 배우도록 소개된 과업은 무엇인가?", "opts": ["존재하지 않던 새로운 이미지를 만들어 내는 과업", "두 분포 사이의 프레셰 거리를 계산하는 과업", "사물 탐지와 같은 결정론적인 과업", "무작위 노이즈를 원본과 비슷하게 변환하는 과업"], "a": 2, "exp": "자료는 기존의 딥 러닝과 신경망이 이미지의 시각적 특징을 이해하고 사물 탐지와 같은 결정론적인 과업을 수행하도록 하는 방법을 배웠다고 설명한다. 새로운 콘텐츠 생성은 이번 주차에서 다루는 생성모델의 역할이다."}, {"id": 2, "sec": "13.1", "diff": "기초", "q": "자료가 제시한 생성모델(generative model)의 정의로 가장 알맞은 것은?", "opts": ["입력 이미지를 여러 클래스로 분류하는 신경망 모델", "이미지에서 객체의 위치를 찾아내는 신경망 모델", "기존에 존재하지 않았던 새로운 콘텐츠를 생성하는 능력을 가진 신경망 모델", "고차원 데이터를 저차원으로 압축해 저장하는 신경망 모델"], "a": 2, "exp": "생성 모델은 기존에 존재하지 않았던 새로운 콘텐츠를 생성하는 능력을 가진 신경망 모델이라고 정의되어 있다."}, {"id": 3, "sec": "13.1", "diff": "기초", "q": "자료에서 생성모델이 실제와 매우 흡사하게 생성할 수 있다고 언급한 콘텐츠가 아닌 것은?", "opts": ["이미지", "음악", "텍스트", "3차원 프린터용 설계 도면"], "a": 3, "exp": "자료는 실제와 매우 흡사한 이미지, 영상, 음악, 텍스트를 생성할 수 있다고 언급한다. 설계 도면은 언급되지 않았다."}, {"id": 4, "sec": "13.1", "diff": "기초", "q": "생성적 적대 신경망(GAN)이 기반으로 하는 핵심 개념은 무엇인가?", "opts": ["전이 학습(transfer learning)", "강화 학습(reinforcement learning)", "앙상블 학습(ensemble learning)", "적대적 훈련(adversarial training)"], "a": 3, "exp": "GAN은 Adversarial training(적대적 훈련)이라는 개념을 기반으로 하며, 서로 경쟁하는 두 신경망으로 구성된다."}, {"id": 5, "sec": "13.1", "diff": "기초", "q": "GAN을 구성하는 신경망의 개수와 그 관계를 옳게 설명한 것은?", "opts": ["서로 경쟁하는 2개의 신경망", "서로 협력하는 3개의 신경망", "가중치를 완전히 공유하는 2개의 신경망", "직렬로만 연결된 4개의 신경망"], "a": 0, "exp": "GAN은 서로 경쟁하는 2개의 신경망, 즉 생성자와 판별자로 구성된다."}, {"id": 6, "sec": "13.1", "diff": "기초", "q": "GAN의 생성자(generator)에 대한 자료의 설명으로 옳은 것은?", "opts": ["입력된 관찰이 진짜인지 가짜인지 예측한다", "무작위 노이즈를 원래의 데이터셋에서 본 표본과 비슷하도록 변환한다", "이미지의 해상도를 낮춰 특징만 추출한다", "레이블이 달린 데이터로 분류만 수행한다"], "a": 1, "exp": "생성자는 무작위 노이즈를 원래의 데이터셋에서 본 표본과 비슷하도록 변환하는 모델이다. 진위 예측은 판별자의 역할이다."}, {"id": 7, "sec": "13.1", "diff": "기초", "q": "GAN의 판별자(discriminator)가 수행하는 일은 무엇인가?", "opts": ["무작위 노이즈로부터 이미지를 합성한다", "입력된 관찰이 생성자가 만든 가짜인지 원래 데이터셋의 일부인 진짜인지 예측한다", "생성자의 가중치를 무작위로 초기화한다", "이미지를 여러 해상도로 나누어 저장한다"], "a": 1, "exp": "판별자는 입력된 관찰이 생성자가 만든 가짜인지 원래 데이터셋의 일부인 진짜인지 예측하는 모델이다."}, {"id": 8, "sec": "13.1", "diff": "중급", "q": "자료의 비유에서 생성자와 판별자에 각각 대응되는 것을 바르게 짝지은 것은?", "opts": ["생성자 - 경찰, 판별자 - 위조지폐범", "생성자 - 위조지폐범, 판별자 - 경찰", "생성자 - 위조지폐, 판별자 - 경찰", "생성자 - 경찰, 판별자 - 위조지폐"], "a": 1, "exp": "자료는 생성자를 위조 지폐범, 판별자를 경찰에 비유하여 두 모델의 경쟁 관계를 설명한다."}, {"id": 9, "sec": "13.1", "diff": "중급", "q": "위조지폐범과 경찰 비유가 설명하려는 GAN 학습의 특징으로 가장 알맞은 것은?", "opts": ["두 모델이 동일한 손실 함수를 공유하여 함께 감소시킨다", "한 번 학습된 판별자는 더 이상 갱신되지 않는다", "상대의 기술이 향상되면서 서로의 학습 목표도 변화하며 끝없이 경쟁한다", "생성자가 완성되면 판별자가 대신 이미지를 만들어 낸다"], "a": 2, "exp": "자료는 상대로 기술이 향상되면서 서로의 학습 목표도 변화하고, 상대방의 기술을 깨는 방법을 끝없이 학습하는 과정이라고 설명한다."}, {"id": 10, "sec": "13.1", "diff": "중급", "q": "13주차 강의자료가 제시한 학습 목표는 무엇인가?", "opts": ["생성적 적대 신경망에 대해서 알아본다", "합성곱 신경망의 역전파 공식을 유도한다", "순환 신경망으로 시계열을 예측한다", "군집화 알고리즘의 성능을 비교한다"], "a": 0, "exp": "자료의 학습 목표 슬라이드에는 '생성적 적대 신경망에 대해서 알아봅시다'라고 제시되어 있다."}, {"id": 11, "sec": "13.1", "diff": "중급", "q": "자료의 설명에 따를 때 생성모델이 컴퓨터 비전 분야에서 '딥 러닝을 응용하는 새로운 영역'으로 소개된 까닭으로 가장 알맞은 것은?", "opts": ["기존 신경망보다 학습 속도가 훨씬 빠르기 때문", "레이블이 전혀 필요 없는 유일한 모델이기 때문", "합성곱 연산을 전혀 사용하지 않는 구조이기 때문", "결정론적인 판별 과업이 아니라 새로운 콘텐츠를 만들어 내는 과업을 다루기 때문"], "a": 3, "exp": "자료는 사물 탐지 같은 결정론적 과업과 대비하여, 새로운 콘텐츠를 만들어 내는 생성모델을 컴퓨터 비전의 새로운 응용 영역으로 소개한다."}, {"id": 12, "sec": "13.1", "diff": "중급", "q": "GAN에서 생성자가 입력으로 받는 것은 무엇인가?", "opts": ["레이블이 부착된 훈련 이미지", "판별자의 마지막 층 특징 맵", "무작위 노이즈(무작위 숫자)", "실제 이미지와 가짜 이미지의 차이"], "a": 2, "exp": "생성자는 무작위 노이즈(무작위 숫자)를 입력받아 이미지를 반환한다."}, {"id": 13, "sec": "13.1", "diff": "심화", "q": "생성적 적대 신경망에 대한 설명 중 자료의 내용과 다른 것은?", "opts": ["서로 경쟁하는 두 개의 신경망으로 구성된다", "생성자는 데이터셋의 표본과 비슷한 결과를 만들려 한다", "판별자는 진짜와 가짜를 구분하려 한다", "두 신경망은 동일한 목표를 공유하며 같은 방향으로 학습한다"], "a": 3, "exp": "GAN의 두 신경망은 목표가 서로 반대이며 경쟁 관계에 있다. 손실 함수가 서로 달라 가중치 수정 방향도 서로 다르다."}, {"id": 14, "sec": "13.1", "diff": "심화", "q": "'생성적 적대 신경망'이라는 이름에서 '적대(adversarial)'가 뜻하는 바로 가장 알맞은 것은?", "opts": ["두 모델이 서로의 목표를 방해하며 경쟁적으로 학습한다는 뜻", "학습 데이터에 적대적 잡음을 섞어 넣는다는 뜻", "판별자가 사용자 입력을 거부한다는 뜻", "두 모델이 서로 다른 데이터셋을 사용한다는 뜻"], "a": 0, "exp": "GAN은 adversarial training 개념을 기반으로 하며, 위조지폐범과 경찰처럼 두 모델이 서로의 목표를 깨뜨리며 경쟁적으로 학습한다."}, {"id": 15, "sec": "13.2", "diff": "기초", "q": "자료에 따르면 GAN의 판별자 신경망은 어떤 구조인가?", "opts": ["출력이 1차원이 될 때까지 합성 곱층의 크기가 작아지는 일반적인 CNN", "1차원 벡터를 입력받아 크기가 점점 커지는 CNN", "시간에 따라 상태를 전달하는 순환 신경망", "완전 연결층만으로 이루어진 다층 퍼셉트론"], "a": 0, "exp": "판별자 신경망은 출력이 1차원이 될 때까지 합성 곱층의 크기가 작아지는 일반적인 CNN이다."}, {"id": 16, "sec": "13.2", "diff": "기초", "q": "자료에 따르면 생성자 신경망의 구조는 판별자와 어떤 관계인가?", "opts": ["판별자와 완전히 동일한 층 배치를 가진다", "판별자의 앞쪽 절반만 떼어 낸 구조이다", "합성곱 대신 순환층만 사용하는 구조이다", "CNN 층 배치를 반대로 바꾼 구조로, 1차원 벡터를 입력받아 크기가 점점 커진다"], "a": 3, "exp": "생성자 신경망은 CNN 층 배치를 반대로 바꾼 구조로, 1차원 벡터를 입력받아 합성 곱의 크기가 입력 이미지의 크기까지 점점 커진다."}, {"id": 17, "sec": "13.2", "diff": "기초", "q": "GAN의 동작 과정에서 판별자가 반환하는 값의 의미로 옳은 것은?", "opts": ["이미지가 속한 클래스 번호", "각 이미지가 실제 존재하는 이미지일 확률", "생성자가 사용한 노이즈 벡터", "이미지의 해상도 배율"], "a": 1, "exp": "판별자는 각 이미지가 실제 존재하는 이미지일 확률을 반환한다."}, {"id": 18, "sec": "13.2", "diff": "기초", "q": "판별자의 출력이 0이라는 것은 무엇을 의미하는가?", "opts": ["입력이 진짜 이미지라고 판단했다", "판별자가 아직 학습되지 않았다", "입력 이미지의 해상도가 낮다", "입력이 가짜 이미지라고 판단했다"], "a": 3, "exp": "자료는 0이면 가짜, 1이면 실제 이미지를 반환한다고 설명한다."}, {"id": 19, "sec": "13.2", "diff": "중급", "q": "GAN의 동작 과정을 순서대로 바르게 나열한 것은?", "opts": ["판별자가 확률 반환 → 생성자가 이미지 반환 → 실제 이미지 입력", "실제 이미지를 생성자에 입력 → 판별자가 노이즈 생성 → 확률 반환", "생성자가 무작위 숫자를 입력받아 이미지 반환 → 생성 이미지와 실제 이미지를 함께 판별자에 입력 → 판별자가 각 이미지가 실제일 확률 반환", "판별자가 노이즈를 만들고 생성자가 이를 분류한다"], "a": 2, "exp": "자료가 제시한 GAN의 동작 순서는 생성자의 이미지 반환, 실제 이미지와 함께 판별자 입력, 판별자의 확률 반환이다."}, {"id": 20, "sec": "13.2", "diff": "중급", "q": "판별자 모델의 목표를 자료의 표현대로 옳게 서술한 것은?", "opts": ["훈련 데이터와 완벽히 비슷한 이미지를 만들어 내는 것", "입력받은 이미지가 생성자가 생성한 가짜 이미지인지 진짜 이미지인지 예측하는 것", "노이즈 벡터의 차원을 줄이는 것", "생성자의 학습률을 자동으로 조절하는 것"], "a": 1, "exp": "판별자의 목표는 입력받은 이미지가 생성자가 생성한 가짜 이미지인지 진짜 이미지인지 예측하는 것이다."}, {"id": 21, "sec": "13.2", "diff": "중급", "q": "생성자 모델의 목표를 자료의 표현대로 옳게 서술한 것은?", "opts": ["판별자 모델이 진짜라고 판정할 만큼 훈련 데이터와 완벽하게 비슷한 이미지를 만들어 내는 것", "판별자 모델의 분류 정확도를 최대로 높이는 것", "훈련 데이터를 그대로 복사해 저장하는 것", "이미지의 클래스 레이블을 정확히 맞히는 것"], "a": 0, "exp": "생성자 모델의 목표는 판별자 모델이 진짜라고 판정할 만큼 훈련 데이터와 완벽하게 비슷한 이미지를 만들어 내는 것이다."}, {"id": 22, "sec": "13.2", "diff": "기초", "q": "자료에서 정의한 다운 샘플링(down sampling)은 무엇인가?", "opts": ["입력 픽셀을 반복해 이미지를 키우는 것", "풀링 층을 이용하여 입력 이미지를 줄이는 것", "이미지를 회전시켜 데이터를 늘리는 것", "채널 수를 늘려 특징을 다양화하는 것"], "a": 1, "exp": "자료는 다운 샘플링을 풀링 층을 이용하여 입력 이미지를 줄이는 것으로 정의한다."}, {"id": 23, "sec": "13.2", "diff": "기초", "q": "자료에서 정의한 업샘플링(up sampling) 층의 동작은 무엇인가?", "opts": ["풀링으로 이미지 크기를 줄인다", "가중치를 학습해 픽셀 값을 새로 예측한다", "입력 픽셀을 반복하는 형태로 이미지 크기를 늘린다", "픽셀 값을 모두 0으로 채워 넣는다"], "a": 2, "exp": "업샘플링 층은 입력 픽셀을 반복하는 형태로 늘리는 층이라고 정의되어 있다."}, {"id": 24, "sec": "13.2", "diff": "중급", "q": "자료의 업샘플링 코드 keras.layers.UpSampling2D(size=(2, 2))를 입력 [[1, 2], [3, 4]]에 적용한 결과로 옳은 것은?", "opts": ["2×2 크기가 그대로 유지된 [[1, 2], [3, 4]]", "각 값이 가로세로로 두 번씩 반복된 4×4 배열", "값이 모두 평균으로 대체된 4×4 배열", "가로 방향만 두 배로 늘어난 2×4 배열"], "a": 1, "exp": "자료의 예시에서 입력 1,2 / 3,4는 출력에서 각 값이 가로세로로 두 번씩 반복되어 4×4 배열이 된다."}, {"id": 25, "sec": "13.2", "diff": "중급", "q": "업샘플링에서 size를 (3, 3)으로 지정하면 2×2 입력의 출력 크기는 얼마가 되는가?", "opts": ["4×4", "5×5", "6×6", "9×9"], "a": 2, "exp": "자료의 3,3 적용 예시는 각 값이 가로세로로 세 번씩 반복되어 6×6 배열이 된 결과를 보여 준다."}, {"id": 26, "sec": "13.2", "diff": "중급", "q": "판별자 신경망에서 합성 곱층을 거치며 특징 맵의 크기가 점점 작아지는 이유로 가장 알맞은 것은?", "opts": ["노이즈 벡터를 이미지 크기로 키우기 위해", "학습률을 자동으로 줄이기 위해", "출력이 1차원의 진짜/가짜 확률 하나로 모이도록 하기 위해", "이미지의 색을 흑백으로 만들기 위해"], "a": 2, "exp": "판별자는 출력이 1차원이 될 때까지 합성 곱층의 크기가 작아지는 CNN이며, 최종적으로 진짜일 확률 하나를 출력한다."}, {"id": 27, "sec": "13.2", "diff": "중급", "q": "생성자 신경망이 1차원 벡터에서 이미지로 나아가는 과정을 옳게 설명한 것은?", "opts": ["합성 곱의 크기가 입력 이미지의 크기까지 점점 커진다", "풀링을 반복해 크기를 계속 줄인다", "완전 연결층만으로 픽셀을 하나씩 예측한다", "판별자의 출력 확률을 그대로 이미지로 변환한다"], "a": 0, "exp": "생성자는 1차원 벡터를 입력받아 합성 곱의 크기가 입력 이미지의 크기까지 점점 커지는 구조를 갖는다."}, {"id": 28, "sec": "13.2", "diff": "심화", "q": "판별자와 생성자의 구조를 비교한 설명 중 옳지 않은 것은?", "opts": ["판별자는 출력이 1차원이 될 때까지 크기를 줄여 나간다", "생성자는 판별자와 층 배치가 반대이다", "생성자는 다운 샘플링을 반복해서 이미지를 완성한다", "생성자는 업샘플링을 이용해 이미지 크기를 늘린다"], "a": 2, "exp": "생성자는 다운 샘플링이 아니라 업샘플링을 반복해 1차원 입력을 원하는 이미지 크기까지 키운다."}, {"id": 29, "sec": "13.2", "diff": "심화", "q": "GAN의 동작 과정에서 판별자에 입력되는 데이터의 구성으로 옳은 것은?", "opts": ["생성자가 만든 가짜 이미지만 입력된다", "데이터셋의 실제 이미지만 입력된다", "노이즈 벡터와 레이블만 입력된다", "생성된 가짜 이미지와 데이터셋의 실제 이미지가 함께 입력된다"], "a": 3, "exp": "생성된 이미지는 데이터셋에 실제 존재하는 이미지와 함께 판별자에 입력된다."}, {"id": 30, "sec": "13.2", "diff": "중급", "q": "자료의 판별자 모델 구현에서 마지막 층의 활성화 함수와 출력 뉴런 수로 옳은 것은?", "opts": ["소프트맥스, 10개", "ReLU, 1개", "tanh, 2개", "시그모이드, 1개"], "a": 3, "exp": "판별자는 Flatten 뒤에 Dense(1, activation='sigmoid')를 두어 이미지가 진짜일 확률 하나를 출력한다."}, {"id": 31, "sec": "13.2", "diff": "심화", "q": "자료의 판별자 구현 코드에서 합성 곱층 사이에 반복적으로 사용된 요소로 옳게 묶인 것은?", "opts": ["누설 ReLU(LeakyReLU)와 드롭아웃(Dropout)", "소프트맥스와 최대 풀링", "시그모이드와 업샘플링", "tanh와 평균 풀링"], "a": 0, "exp": "판별자 코드에서는 각 합성 곱층 뒤에 LeakyReLU(alpha=0.2)와 Dropout(0.25)이 반복해서 붙는다."}, {"id": 32, "sec": "13.2", "diff": "심화", "q": "생성자 구현에서 무작위 노이즈를 이미지 형태의 특징 맵으로 바꾸기 위해 가장 먼저 사용하는 층 구성은?", "opts": ["업샘플링 층을 먼저 적용한 뒤 합성 곱층을 쌓는다", "완전 연결(Dense) 층으로 크기를 키운 뒤 Reshape로 특징 맵 형태로 바꾼다", "풀링 층으로 노이즈를 압축한다", "판별자의 출력층을 그대로 재사용한다"], "a": 1, "exp": "생성자 코드는 Dense(128*7*7)로 벡터를 키운 뒤 Reshape((7, 7, 128))로 특징 맵 형태를 만들고, 그다음부터 업샘플링과 합성 곱을 반복한다."}, {"id": 33, "sec": "13.3", "diff": "기초", "q": "판별자 모델의 학습 과정은 어떤 학습 방식에 해당하는가?", "opts": ["비지도 군집화 과정", "강화 학습의 보상 기반 과정", "일반적인 지도 학습 모델의 학습 과정", "차원 축소 과정"], "a": 2, "exp": "자료는 판별자 모델 학습이 레이블을 함께 입력하는 일반적인 지도 학습 모델의 학습 과정이라고 설명한다."}, {"id": 34, "sec": "13.3", "diff": "기초", "q": "판별자 모델을 학습시킬 때 입력하는 데이터로 옳은 것은?", "opts": ["실제 이미지만 레이블 없이 입력한다", "생성자 모델이 만든 가짜 이미지와 훈련 데이터에서 뽑은 진짜 이미지를 레이블과 함께 입력한다", "노이즈 벡터만 입력한다", "판별자가 이전에 출력한 확률만 입력한다"], "a": 1, "exp": "판별자 학습에서는 생성자가 만든 가짜 이미지와 훈련 데이터에서 뽑은 진짜 이미지를 레이블과 함께 입력한다."}, {"id": 35, "sec": "13.3", "diff": "기초", "q": "판별자가 이미지의 진위 여부를 확률 값으로 예측할 때 사용하는 함수는 무엇인가?", "opts": ["소프트맥스 함수", "ReLU 함수", "시그모이드 함수", "항등 함수"], "a": 2, "exp": "자료는 이미지가 진짜인지 여부를 시그모이드 함수를 통해 확률 값으로 예측한다고 설명한다."}, {"id": 36, "sec": "13.3", "diff": "기초", "q": "생성자 모델의 학습을 진행하기 위해 반드시 필요한 것은 무엇인가?", "opts": ["모델이 만든 가짜 이미지가 얼마나 진짜 같았는지 알려 줄 판별자 모델", "추가로 수집한 레이블 데이터", "생성해야 할 정답 픽셀 값", "사람이 미리 매겨 둔 품질 점수표"], "a": 0, "exp": "생성자 학습에는 가짜 이미지가 얼마나 진짜 같았는지 알려 줄 판별자 모델이 필요하며, 이 때문에 통합 신경망을 구성한다."}, {"id": 37, "sec": "13.3", "diff": "기초", "q": "생성자 모델을 학습시키기 위해 자료가 제시한 방법은 무엇인가?", "opts": ["생성자만 단독으로 컴파일해 학습한다", "판별자를 삭제한 뒤 학습한다", "두 모델의 가중치를 평균 내어 갱신한다", "판별자 모델과 생성자 모델을 합친 통합 신경망을 만들어 학습한다"], "a": 3, "exp": "자료는 판별자 모델과 생성자 모델을 합친 통합 신경망을 만들어 생성자 모델의 학습을 진행한다고 설명한다."}, {"id": 38, "sec": "13.3", "diff": "중급", "q": "통합 신경망을 학습할 때 판별자 모델의 가중치를 고정해야 하는 이유로 옳은 것은?", "opts": ["판별자의 파라미터 수가 너무 많아 메모리가 부족하기 때문", "판별자가 이미 최적해에 도달했기 때문", "생성자 모델과 판별자 모델의 손실 함수가 서로 달라 가중치 수정 방향도 서로 다르기 때문", "판별자는 학습이 필요 없는 고정된 규칙이기 때문"], "a": 2, "exp": "두 모델의 손실 함수가 서로 다르기 때문에 가중치 수정 방향도 달라, 통합 신경망 학습 시 판별자의 가중치를 고정해야 한다."}, {"id": 39, "sec": "13.3", "diff": "중급", "q": "통합 신경망 학습 시 판별자 모델의 가중치를 고정하지 않으면 어떤 문제가 생기는가?", "opts": ["생성자가 아예 학습되지 않는다", "판별자가 가짜 이미지를 진짜로 판정하는 경향을 보이게 된다", "판별자의 출력이 항상 0으로 고정된다", "학습 속도는 빨라지지만 이미지 해상도가 낮아진다"], "a": 1, "exp": "판별자의 가중치를 고정하지 않으면 생성자의 손실 함수가 이끄는 방향으로 판별자가 수정되면서 가짜 이미지를 진짜로 판정하는 경향을 보이게 된다."}, {"id": 40, "sec": "13.3", "diff": "중급", "q": "GAN의 병렬 학습에서 오차의 역전파 대상을 바르게 짝지은 것은?", "opts": ["판별자 오차 → 생성자 가중치 수정, 통합 신경망 오차 → 판별자 가중치 수정", "두 오차 모두 판별자의 가중치만 수정", "판별자 오차 → 판별자 가중치 수정, 통합 신경망 오차 → 생성자 가중치 수정", "두 오차 모두 생성자의 가중치만 수정"], "a": 2, "exp": "판별자 모델의 오차는 역전파로 판별자의 가중치를 수정하고, 통합 신경망의 오차는 역전파로 생성자 모델의 가중치를 수정한다."}, {"id": 41, "sec": "13.3", "diff": "기초", "q": "판별자 모델을 컴파일할 때 자료가 사용한 손실 함수는 무엇인가?", "opts": ["평균 제곱 오차(MSE)", "이진 교차 엔트로피(binary_crossentropy)", "범주형 교차 엔트로피(categorical_crossentropy)", "힌지 손실(hinge loss)"], "a": 1, "exp": "판별자는 진짜/가짜 두 가지를 구분하므로 binary_crossentropy를 손실 함수로 사용한다."}, {"id": 42, "sec": "13.3", "diff": "기초", "q": "자료에서 판별자 모델의 최적화 알고리즘으로 사용한 것은 무엇인가?", "opts": ["SGD", "RMSprop", "Adam", "Adagrad"], "a": 2, "exp": "자료는 판별자 모델의 최적화 알고리즘으로 Adam을 사용한다고 명시한다."}, {"id": 43, "sec": "13.3", "diff": "중급", "q": "GAN의 병렬 학습 과정에 대한 설명으로 옳지 않은 것은?", "opts": ["순방향 계산을 통해 예측을 수행한다", "오차를 계산해 역전파 계산으로 가중치를 수정한다", "판별자 모델과 통합 신경망을 교대로 학습한다", "통합 신경망을 학습할 때는 생성자 모델의 가중치를 고정한다"], "a": 3, "exp": "통합 신경망을 학습할 때 고정하는 것은 판별자 모델의 가중치이며, 수정되는 것은 생성자 모델의 가중치이다."}, {"id": 44, "sec": "13.3", "diff": "중급", "q": "자료의 결론에서 정리한 GAN의 학습 방식으로 옳은 것은?", "opts": ["생성자만 반복 학습한 뒤 마지막에 판별자를 한 번 학습한다", "두 모델을 하나의 손실 함수로 동시에 학습한다", "판별자를 먼저 완전히 수렴시킨 뒤 생성자를 학습한다", "판별자 모델과 통합 신경망을 교대로 학습한다"], "a": 3, "exp": "자료의 결론은 GAN의 학습 과정이 판별자 모델과 통합 신경망을 교대로 학습하는 방식이라고 정리한다."}, {"id": 45, "sec": "13.3", "diff": "중급", "q": "배치 1개로 학습하는 자료의 코드에서 노이즈로부터 가짜 이미지를 만드는 단계에 해당하는 것은?", "opts": ["discriminator.train_on_batch(imgs, valid)", "gen_imgs = generator.predict(noise)", "discriminator.compile(loss='binary_crossentropy')", "combined.train_on_batch(noise, valid)"], "a": 1, "exp": "generator.predict(noise)로 노이즈 데이터를 넣어 새로운 이미지 한 배치를 생성한다."}, {"id": 46, "sec": "13.3", "diff": "중급", "q": "자료의 코드에서 판별자를 진짜 이미지와 가짜 이미지에 대해 각각 학습시키는 두 줄은 무엇을 얻기 위한 것인가?", "opts": ["인셉션 점수와 FID", "생성자의 손실 g_loss", "판별자의 진짜/가짜 각각에 대한 손실 d_loss_real과 d_loss_fake", "노이즈 벡터의 분산"], "a": 2, "exp": "discriminator.train_on_batch(imgs, valid)와 train_on_batch(gen_imgs, fake)는 각각 진짜와 가짜에 대한 판별자 손실 d_loss_real, d_loss_fake를 계산한다."}, {"id": 47, "sec": "13.3", "diff": "심화", "q": "통합 신경망을 만드는 코드에서 discriminator.trainable = False가 하는 역할은 무엇인가?", "opts": ["판별자를 모델에서 완전히 제거한다", "판별자 모델의 가중치를 고정해 생성자만 수정되도록 한다", "판별자의 학습률을 절반으로 낮춘다", "판별자의 출력을 항상 1로 만든다"], "a": 1, "exp": "통합 신경망에서는 판별자의 가중치를 고정(trainable=False)해 생성자 모델의 가중치만 수정되도록 한다."}, {"id": 48, "sec": "13.3", "diff": "심화", "q": "통합 신경망을 학습시킬 때 입력과 정답 레이블의 조합으로 옳은 것은?", "opts": ["노이즈를 입력하고 '가짜(0)' 레이블을 정답으로 준다", "진짜 이미지를 입력하고 '진짜(1)' 레이블을 정답으로 준다", "노이즈를 입력하고 '진짜(1)' 레이블을 정답으로 준다", "가짜 이미지를 입력하고 '가짜(0)' 레이블을 정답으로 준다"], "a": 2, "exp": "combined.train_on_batch(noise, valid)처럼 노이즈를 입력하고 진짜(1) 레이블을 주어, 판별자가 진짜라고 속을수록 손실이 줄도록 생성자를 학습시킨다."}, {"id": 49, "sec": "13.3", "diff": "심화", "q": "통합 신경망을 컴파일할 때 사용한 손실 함수와 실제 학습되는 대상을 옳게 설명한 것은?", "opts": ["이진 교차 엔트로피를 사용하며 생성자 모델의 가중치만 수정된다", "평균 제곱 오차를 사용하며 판별자 모델의 가중치만 수정된다", "이진 교차 엔트로피를 사용하며 두 모델의 가중치가 모두 수정된다", "범주형 교차 엔트로피를 사용하며 생성자만 수정된다"], "a": 0, "exp": "통합 신경망도 binary_crossentropy로 컴파일하지만 판별자는 고정되어 있어 생성자 모델의 가중치만 수정된다."}, {"id": 50, "sec": "13.3", "diff": "중급", "q": "GAN 학습에서 통합 신경망이 필요한 근본적인 이유는 무엇인가?", "opts": ["생성자가 만든 이미지에 대한 판별자의 평가를 손실로 삼아 생성자까지 역전파해야 하기 때문", "판별자의 정확도를 계산할 다른 방법이 없기 때문", "두 모델의 파라미터 수를 같게 맞추기 위해서", "생성자와 판별자가 반드시 같은 데이터를 사용해야 하기 때문"], "a": 0, "exp": "생성자에는 직접적인 정답 이미지가 없으므로, 판별자의 판정 결과를 손실로 삼아 생성자까지 오차를 전달할 통합 신경망이 필요하다."}, {"id": 51, "sec": "13.3", "diff": "중급", "q": "판별자 학습과 생성자 학습을 비교한 설명 중 옳지 않은 것은?", "opts": ["판별자 학습은 레이블이 있는 지도 학습의 형태로 진행된다", "생성자 학습에는 판별자의 판정 결과가 피드백으로 필요하다", "두 모델은 서로 다른 손실 함수가 이끄는 방향으로 학습한다", "생성자를 학습할 때 판별자의 가중치도 함께 갱신된다"], "a": 3, "exp": "생성자를 학습할 때는 판별자의 가중치를 고정해야 하며, 고정하지 않으면 판별자가 가짜를 진짜로 판정하게 된다."}, {"id": 52, "sec": "13.3", "diff": "중급", "q": "판별자 학습 코드에서 진짜 이미지 배치와 가짜 이미지 배치에 각각 부여하는 레이블은 무엇인가?", "opts": ["둘 다 1", "진짜는 0, 가짜는 1", "진짜는 1, 가짜는 0", "둘 다 0"], "a": 2, "exp": "코드에서 valid는 1로 채운 배열, fake는 0으로 채운 배열이며 각각 진짜 이미지와 가짜 이미지의 정답 레이블로 쓰인다."}, {"id": 53, "sec": "13.4", "diff": "기초", "q": "자료는 GAN의 학습을 어떤 상황에 더 가깝다고 설명하는가?", "opts": ["단순한 최적화 문제", "무작위 탐색 문제", "지도 학습 회귀 문제", "제로섬 게임"], "a": 3, "exp": "자료는 GAN의 학습이 최적화 문제보다는 제로섬 게임에 가깝다고 설명한다."}, {"id": 54, "sec": "13.4", "diff": "기초", "q": "제로섬 게임에 대한 자료의 설명으로 옳은 것은?", "opts": ["참가자 모두가 동시에 이득을 볼 수 있다", "게임이 진행될수록 점수의 총합이 계속 늘어난다", "참가자가 세 명 이상이어야 성립한다", "총합이 정해진 점수를 나눠 가지므로 한 참가자의 득점이 다른 참가자의 실점이 된다"], "a": 3, "exp": "제로섬 게임에서는 참가자들이 총합이 정해진 점수를 나눠 가지므로 어느 한 참가자의 득점이 다른 참가자의 실점이 된다."}, {"id": 55, "sec": "13.4", "diff": "기초", "q": "GAN의 경쟁 구도를 인공지능 분야에서 부르는 이름은 무엇인가?", "opts": ["몬테카를로 트리 탐색", "베이즈 최적화", "미니맥스 게임 이론(mini-max game theory)", "동적 계획법"], "a": 2, "exp": "자료는 GAN의 제로섬 성격을 인공지능 분야에서 미니맥스 게임 이론(mini-max game theory)이라고 부른다고 설명한다."}, {"id": 56, "sec": "13.4", "diff": "기초", "q": "미니맥스 알고리즘에 대한 자료의 설명으로 옳은 것은?", "opts": ["여러 참가자가 동시에 무작위로 행동하는 게임에 쓰인다", "참가자가 한 명인 최적화 문제에만 쓰인다", "확률 없이 데이터를 정렬하는 알고리즘이다", "두 명의 참가자가 순서대로 행동하는 게임의 의사 결정에 주로 사용된다"], "a": 3, "exp": "미니맥스는 의사 결정 알고리즘의 한 종류로, 두 명의 참가자가 순서대로 행동하는 게임의 의사 결정에 주로 사용된다."}, {"id": 57, "sec": "13.4", "diff": "중급", "q": "미니맥스 알고리즘에서 최대화 참가자(maximizer)와 최소화 참가자(minimizer)의 역할을 옳게 설명한 것은?", "opts": ["두 참가자 모두 자기 점수를 최대로 만든다", "최대화 참가자는 점수를 최소로, 최소화 참가자는 최대로 만든다", "최대화 참가자는 점수가 최대가 되게 하고, 최소화 참가자는 상대의 수에 대응하면서 점수가 최소가 되게 한다", "두 참가자 모두 점수를 최소로 만든다"], "a": 2, "exp": "미니맥스에서 한 참가자(maximizer)의 점수는 최대가 되게 하고, 다른 참가자(minimizer)는 최대화 참가자의 수에 대응하면서 점수가 최소가 되도록 한다."}, {"id": 58, "sec": "13.4", "diff": "중급", "q": "GAN의 미니맥스 관점에서 판별자 모델(D)의 목표는 무엇인가?", "opts": ["이미지 레이블을 정확히 예측할 확률을 최대가 되게 하는 것", "생성 이미지의 다양성을 최대로 하는 것", "노이즈 벡터의 차원을 최소로 하는 것", "가짜 이미지의 해상도를 최대로 하는 것"], "a": 0, "exp": "판별자 모델(D)의 목표는 이미지 레이블을 정확히 예측할 확률을 최대가 되게 하는 것이다."}, {"id": 59, "sec": "13.4", "diff": "중급", "q": "GAN의 미니맥스 관점에서 생성자 모델(G)의 목표는 무엇인가?", "opts": ["생성한 이미지의 레이블이 정확히 예측될 확률을 최소가 되게 하는 것", "판별자 모델의 분류 정확도를 최대가 되게 하는 것", "훈련 데이터의 개수를 늘리는 것", "판별자 모델의 층 수를 줄이는 것"], "a": 0, "exp": "생성자 모델(G)의 목표는 생성한 이미지의 레이블이 정확히 예측될 확률을 최소가 되게 하는 것이다."}, {"id": 60, "sec": "13.4", "diff": "중급", "q": "가치 함수 V(D, G)에 대한 자료의 설명으로 옳은 것은?", "opts": ["D와 G가 협력해 V를 함께 최대화한다", "V는 생성자 모델의 파라미터 수를 뜻한다", "V는 학습률을 자동으로 조절하는 함수이다", "D와 G가 V(D, G)를 따르는 2인 미니맥스 게임을 하는 것과 유사하다"], "a": 3, "exp": "자료는 D와 G가 가치 함수 V(D, G)를 따르는 2인 미니맥스 게임을 하는 것과 유사하다고 설명한다."}, {"id": 61, "sec": "13.4", "diff": "중급", "q": "GAN의 미니맥스 수식에서 기호 z가 뜻하는 것은 무엇인가?", "opts": ["실제 데이터에서 뽑은 이미지", "판별자 모델의 출력 확률", "생성자 모델(G)에 입력되는 무작위 노이즈", "가치 함수 V(D, G)의 최댓값"], "a": 2, "exp": "기호 표에서 z는 생성자 모델(G)에 입력되는 무작위 노이즈로 정의되어 있다."}, {"id": 62, "sec": "13.4", "diff": "중급", "q": "미니맥스 수식에서 D(G(z))가 의미하는 것은 무엇인가?", "opts": ["실제 이미지에 대한 판별자 모델의 예측 결과", "생성자가 만든 이미지의 픽셀 평균값", "판별자 모델의 손실 값", "생성자 모델이 생성한 이미지에 대한 판별자 모델의 예측 결과"], "a": 3, "exp": "G(z)는 생성자가 노이즈 z로 만든 이미지이고, D(G(z))는 그 이미지에 대한 판별자 모델의 예측 결과이다."}, {"id": 63, "sec": "13.4", "diff": "중급", "q": "미니맥스 수식에서 log D(x)가 나타내는 것은 무엇인가?", "opts": ["가짜 이미지에 대한 판별자의 예측 결과", "생성자 모델의 학습률", "실제 데이터의 이미지 x에 대한 판별자 모델(D)의 예측 결과", "노이즈 벡터의 분산"], "a": 2, "exp": "학습 데이터에서 뽑은 진짜 이미지 x에 대한 판별자 모델의 예측 결과는 log D(x)로 나타낸다."}, {"id": 64, "sec": "13.4", "diff": "심화", "q": "판별자 모델의 단독 학습 관점에서 실제 데이터 항 E[log D(x)]는 어떻게 되도록 학습하는가?", "opts": ["함숫값이 가능한 한 1에 가까워지도록 해서 미니맥스 함숫값이 최대가 되게 한다", "함숫값이 0에 가까워지도록 해서 미니맥스 함숫값이 최소가 되게 한다", "함숫값을 학습 내내 일정하게 고정한다", "함숫값의 부호를 반대로 바꾼다"], "a": 0, "exp": "판별자 모델의 단독 학습은 해당 함숫값이 가능한 한 1에 가까워지도록 해서 미니맥스 함숫값이 최대가 되게 하는 것이다."}, {"id": 65, "sec": "13.4", "diff": "심화", "q": "생성자 모델의 학습 관점에서 log(1 - D(G(z))) 항은 어떻게 되도록 학습하는가?", "opts": ["함숫값이 1에 가까워지도록 해서 최대가 되게 한다", "함숫값이 0에 가까워지도록 해서 미니맥스 함숫값이 최소가 되게 한다", "함숫값을 무한대로 발산시킨다", "함숫값을 학습률과 같은 값으로 맞춘다"], "a": 1, "exp": "생성자 모델의 학습은 해당 함숫값이 0에 가까워지도록 해서 미니맥스 함숫값이 최소가 되도록 하는 것이다."}, {"id": 66, "sec": "13.4", "diff": "심화", "q": "GAN의 가치 함수에 로그(log)를 씌운 이유로 자료가 제시한 것은?", "opts": ["계산 속도를 높이기 위해", "원하는 값과 차이가 날수록 벌점이 커지도록 하기 위해", "출력 값을 항상 양수로 만들기 위해", "확률의 합을 1로 맞추기 위해"], "a": 1, "exp": "자료는 로그를 씌운 이유가 원하는 값과 차이가 날수록 벌점이 커지도록 하기 위해서라고 설명한다."}, {"id": 67, "sec": "13.4", "diff": "심화", "q": "미니맥스 수식을 두 부분으로 나누어 볼 때의 설명으로 옳은 것은?", "opts": ["판별자 모델의 학습 부분과 생성자 모델의 학습 부분은 서로 다른 오차 함수를 사용한다", "두 부분은 완전히 동일한 오차 함수를 사용한다", "두 부분 모두 판별자 모델의 가중치만 수정한다", "두 부분은 각각 다른 데이터셋을 필요로 한다"], "a": 0, "exp": "자료는 미니맥스 수식을 판별자 모델의 학습 함수와 생성자 모델 부분으로 나누어 볼 수 있고, 두 부분이 서로 다른 오차 함수를 사용한다고 설명한다."}, {"id": 68, "sec": "13.4", "diff": "심화", "q": "GAN 미니맥스 학습의 최종 목표를 자료의 결론대로 요약한 것은?", "opts": ["진짜 데이터에 대한 D(x)를 최소로, 가짜 데이터에 대한 D를 최대로 만드는 것", "D(x)와 D(G(z))를 모두 최대로 만드는 것", "D(x)와 D(G(z))를 모두 0으로 만드는 것", "진짜 데이터에 대한 D(x)를 최대로, 가짜 데이터에 대한 D를 최소로 만드는 것"], "a": 3, "exp": "자료는 결론적으로 진짜 데이터에 대한 D(x)가 최대가 되게 하고, 가짜 데이터에 대한 D가 최소가 되게 하는 것이라고 정리한다."}, {"id": 69, "sec": "13.5", "diff": "기초", "q": "자료가 제시한 GAN 모델의 평가 방법 두 가지는 무엇인가?", "opts": ["정확도와 재현율", "인셉션 점수와 프레셰 인셉션 거리(FID)", "BLEU 점수와 퍼플렉시티", "평균 제곱 오차와 결정 계수"], "a": 1, "exp": "자료는 GAN 모델의 평가 방법으로 인셉션 점수와 Frechet inception distance(FID)를 제시한다."}, {"id": 70, "sec": "13.5", "diff": "기초", "q": "인셉션 점수는 무엇을 이용해 생성된 이미지를 평가하는가?", "opts": ["새로 학습시킨 판별자", "사람이 직접 매긴 순위표", "이미지의 픽셀 히스토그램", "사전학습한 인셉션 신경망"], "a": 3, "exp": "인셉션 점수는 실제 이미지를 사전학습한 인셉션 신경망을 이용하여 생성 이미지를 평가하는 방법이다."}, {"id": 71, "sec": "13.5", "diff": "중급", "q": "인셉션 점수의 두 가지 평가 기준으로 옳게 묶인 것은?", "opts": ["생성 속도가 빠를 것, 모델 크기가 작을 것", "판별자의 손실이 낮을 것, 생성자의 손실이 낮을 것", "생성된 이미지의 예측 점수가 높을 것, 생성된 이미지의 다양성이 높을 것", "해상도가 높을 것, 색상이 선명할 것"], "a": 2, "exp": "인셉션 점수의 두 평가 기준은 생성된 이미지의 예측 점수가 높을 것과 생성된 이미지의 다양성이 높을 것이다."}, {"id": 72, "sec": "13.5", "diff": "중급", "q": "인셉션 점수에서 '예측 점수가 높을 것'이라는 기준을 옳게 설명한 것은?", "opts": ["생성 이미지의 픽셀 값 평균이 클수록 좋다", "사전 학습된 인셉션 모델의 분류 결과가 생성한 이미지와 어긋나지 않으면 그 확신도를 예측 점수로 삼는다", "판별자가 생성 이미지를 모두 가짜로 판정해야 한다", "생성 이미지의 파일 크기가 클수록 좋다"], "a": 1, "exp": "생성 이미지를 사전 학습된 인셉션 모델에 입력해 분류 결과가 생성한 이미지와 어긋나지 않으면 그 확신도를 이미지의 예측 점수로 삼는다."}, {"id": 73, "sec": "13.5", "diff": "중급", "q": "인셉션 점수의 '다양성' 기준이 뜻하는 바로 옳은 것은?", "opts": ["생성된 이미지가 특정 클래스에 치우쳐서는 안 된다", "생성된 이미지가 한 클래스에 집중될수록 좋다", "이미지마다 해상도가 서로 달라야 한다", "이미지에 사용된 색상 수가 많아야 한다"], "a": 0, "exp": "다양성 기준은 생성된 이미지가 특정 클래스에 치우쳐서는 안 된다는 것이다."}, {"id": 74, "sec": "13.5", "diff": "중급", "q": "프레셰 인셉션 거리(FID)의 계산 과정을 옳게 설명한 것은?", "opts": ["생성 이미지만 인셉션 모델에 넣어 분류 확신도를 평균한다", "실제 이미지와 생성된 이미지를 인셉션 모델에 입력해 얻은 출력으로 다변량 가우시안 분포를 구한 뒤 두 분포 사이의 프레셰 거리를 계산한다", "두 이미지의 픽셀 차이를 직접 제곱해 평균한다", "판별자의 정확도와 생성자의 손실을 곱해서 구한다"], "a": 1, "exp": "FID는 실제 이미지와 생성된 이미지를 인셉션 모델에 입력하고 그 출력을 모아 다변량 가우시안 분포를 구한 뒤, 두 분포 사이의 프레셰 거리를 계산한다."}, {"id": 75, "sec": "13.5", "diff": "심화", "q": "인셉션 점수와 FID를 비교한 설명으로 가장 알맞은 것은?", "opts": ["인셉션 점수는 생성 이미지의 분류 확신도와 다양성을 보고, FID는 실제 이미지와 생성 이미지 분포 사이의 거리를 본다", "두 방법 모두 실제 이미지를 전혀 사용하지 않는다", "인셉션 점수는 두 분포 사이의 거리를, FID는 분류 확신도를 본다", "두 방법 모두 판별자의 손실 값만으로 계산된다"], "a": 0, "exp": "인셉션 점수는 생성 이미지의 예측 점수와 다양성을 보고, FID는 실제 이미지와 생성 이미지의 출력 분포 사이의 프레셰 거리를 본다."}, {"id": 76, "sec": "13.5", "diff": "기초", "q": "자료가 소개한 GAN의 주요 응용 분야가 아닌 것은?", "opts": ["문장으로부터 이미지 생성하기", "이미지 - 이미지 번역", "초해상도 이미지 생성", "음성 인식용 음소 정렬"], "a": 3, "exp": "자료는 주요 응용 분야로 문장으로부터 이미지 생성하기, 이미지-이미지 번역, 초해상도 이미지를 든다."}, {"id": 77, "sec": "13.5", "diff": "중급", "q": "StackGAN의 1단계에서 생성하는 것은 무엇인가?", "opts": ["주어진 문장의 내용에 따라 대략적인 형태와 색을 포함하는 저해상도 이미지", "곧바로 완성된 고해상도 이미지", "이미지를 설명하는 문장", "이미지의 클래스 레이블"], "a": 0, "exp": "StackGAN의 1단계는 주어진 문장의 내용에 따라 대략적인 형태와 색을 포함하는 저해상도 이미지를 생성한다."}, {"id": 78, "sec": "13.5", "diff": "중급", "q": "StackGAN의 2단계가 입력받는 것과 수행하는 일을 옳게 설명한 것은?", "opts": ["노이즈만 받아 새 이미지를 처음부터 다시 만든다", "고해상도 이미지를 저해상도로 줄인다", "문장을 다른 언어로 번역한다", "1단계에서 출력한 이미지와 원래 문장을 입력받아 결함과 세부 사항을 채운 고해상도 이미지를 생성한다"], "a": 3, "exp": "2단계는 1단계 출력 이미지와 원래 문장을 입력받아 1단계 이미지의 결함과 미처 넣지 못한 세부 사항을 채워 실제와 같은 고해상도 이미지를 만든다."}, {"id": 79, "sec": "13.5", "diff": "기초", "q": "이미지 - 이미지 번역(Image-to-Image translation)이란 무엇인가?", "opts": ["이미지에 담긴 글자를 다른 언어로 옮기는 것", "어떠한 장면에 대한 표현을 다른 이미지로 만드는 것", "이미지를 텍스트 설명으로 바꾸는 것", "이미지의 파일 형식을 변환하는 것"], "a": 1, "exp": "자료는 이미지-이미지 번역을 어떠한 장면에 대한 표현을 다른 이미지로 만드는 것이라고 설명한다."}, {"id": 80, "sec": "13.5", "diff": "기초", "q": "초해상도 이미지 GAN이 수행하는 변환은 무엇인가?", "opts": ["컬러 이미지를 흑백 이미지로 변환", "저해상도 이미지를 고해상도 이미지로 변환", "고해상도 이미지를 저해상도로 압축", "비트맵 이미지를 벡터 그래픽으로 변환"], "a": 1, "exp": "초해상도 이미지 GAN은 GAN 모델을 이용해 저해상도 이미지를 고해상도 이미지로 변환한다."}, {"id": 81, "sec": "13.5", "diff": "심화", "q": "문장으로부터 이미지를 생성하는 과제에서 StackGAN이 두 단계로 나뉘어 있는 이유로 가장 알맞은 것은?", "opts": ["1단계에서 잡은 대략적인 형태와 색 위에 2단계가 세부 사항과 결함을 보완해 고품질 이미지를 얻기 위해", "1단계와 2단계가 서로 다른 문장을 처리해야 하기 때문", "판별자를 두 번 학습시키기 위해", "노이즈 벡터의 차원을 두 배로 늘리기 위해"], "a": 0, "exp": "1단계는 저해상도의 대략적 형태와 색을, 2단계는 그 결과와 원래 문장을 함께 받아 결함과 세부 사항을 채운 고해상도 이미지를 만든다."}, {"id": 82, "sec": "13.5", "diff": "심화", "q": "GAN의 성능 평가에 대한 자료 결론의 설명으로 옳은 것은?", "opts": ["오직 인셉션 점수만으로 자동 평가한다", "주로 생성한 이미지의 품질을 사람이 직접 평가하며, 인셉션 점수와 인셉션 거리를 함께 사용한다", "판별자의 손실 값이 낮을수록 항상 좋은 모델이다", "훈련 데이터에 대한 분류 정확도로 평가한다"], "a": 1, "exp": "자료의 결론은 GAN의 성능 평가가 주로 생성한 이미지의 품질을 사람이 직접 평가하는 방식이며, 인셉션 점수와 인셉션 거리를 사용한다고 정리한다."}, {"id": 83, "sec": "13.5", "diff": "중급", "q": "생성된 이미지가 모두 비슷한 한 종류로만 나온다면 인셉션 점수의 기준에서 어떤 평가를 받게 되는가?", "opts": ["예측 점수 기준은 만족할 수 있으나 다양성 기준에서 낮은 평가를 받는다", "두 기준을 모두 만족한다", "다양성 기준만 만족한다", "인셉션 점수와는 무관한 현상이다"], "a": 0, "exp": "인셉션 점수는 생성 이미지가 특정 클래스에 치우치지 않을 것을 요구하므로, 한 종류로만 생성되면 다양성 기준에서 불리하다."}, {"id": 84, "sec": "13.5", "diff": "심화", "q": "자료의 결론에서 GAN이 만들어 내는 이미지의 성질을 옳게 설명한 것은?", "opts": ["훈련 데이터를 그대로 복사한 이미지", "훈련 데이터와 전혀 무관한 무작위 잡음", "훈련 데이터를 모두 평균 낸 하나의 이미지", "데이터의 패턴을 학습해 훈련 데이터와 비슷한 분포를 지닌 새로운 이미지"], "a": 3, "exp": "자료의 결론은 GAN이 데이터의 패턴을 학습해서 훈련 데이터와 비슷한 분포를 지닌 새로운 이미지를 만들어 낸다고 정리한다."}, {"id": 85, "sec": "13.6", "diff": "기초", "q": "자료의 GAN 구현 프로젝트에서 1단계에 해당하는 작업은 무엇인가?", "opts": ["라이브러리 임포트하기", "생성자 모델 구성하기", "데이터셋 내려받기 및 이미지 확인하기", "학습 및 학습 결과 관찰"], "a": 0, "exp": "프로젝트의 1단계는 라이브러리 임포트하기이다."}, {"id": 86, "sec": "13.6", "diff": "중급", "q": "GAN 구현 프로젝트의 7단계를 순서대로 바르게 나열한 것은?", "opts": ["생성자 구성 → 판별자 구성 → 라이브러리 임포트 → 통합 신경망 구성 → 데이터셋 내려받기 → 학습 함수 구현 → 결과 관찰", "라이브러리 임포트 → 데이터셋 내려받기 → 생성자 구성 → 판별자 구성 → 통합 신경망 구성 → 학습 함수 구현 → 학습 및 결과 관찰", "데이터셋 내려받기 → 통합 신경망 구성 → 생성자 구성 → 판별자 구성 → 라이브러리 임포트 → 학습 함수 구현 → 결과 관찰", "학습 함수 구현 → 라이브러리 임포트 → 데이터셋 내려받기 → 생성자 구성 → 판별자 구성 → 통합 신경망 구성 → 결과 관찰"], "a": 1, "exp": "자료가 제시한 순서는 라이브러리 임포트, 데이터셋 내려받기, 생성자 구성, 판별자 구성, 통합 신경망 구성, 학습 함수 구현, 학습 및 결과 관찰이다."}, {"id": 87, "sec": "13.6", "diff": "기초", "q": "프로젝트에서 내려받아 사용한 데이터셋은 무엇인가?", "opts": ["CIFAR-10", "ImageNet", "패션 MNIST(fashion_mnist)", "보스턴 주택 가격 데이터"], "a": 2, "exp": "프로젝트 코드는 keras.datasets의 fashion_mnist를 불러와 사용한다."}, {"id": 88, "sec": "13.6", "diff": "중급", "q": "프로젝트 2단계에서 X_train = training_data / 127.5 - 1 과 같이 처리하는 목적은 무엇인가?", "opts": ["이미지를 흑백으로 바꾸기 위해", "이미지 크기를 절반으로 줄이기 위해", "픽셀 값의 범위를 [-1, 1]로 조정하기 위해", "레이블을 원-핫 인코딩하기 위해"], "a": 2, "exp": "0~255 픽셀 값을 127.5로 나누고 1을 빼면 범위가 [-1, 1]이 되며, 자료에도 픽셀 값의 범위가 [-1, 1]이 되도록 조정한다고 표시되어 있다."}, {"id": 89, "sec": "13.6", "diff": "중급", "q": "2단계에서 np.expand_dims(X_train, axis=3)을 적용하는 이유로 가장 알맞은 것은?", "opts": ["학습 속도를 높이기 위해", "데이터 개수를 세 배로 늘리기 위해", "픽셀 값을 다시 정규화하기 위해", "이미지에 채널 축을 추가해 (28, 28, 1) 형태로 만들기 위해"], "a": 3, "exp": "합성곱 신경망의 입력 형태인 (28, 28, 1)을 맞추기 위해 마지막에 채널 축을 하나 추가한다."}, {"id": 90, "sec": "13.6", "diff": "심화", "q": "프로젝트 3단계 생성자 구성에서 노이즈 벡터의 차원과 첫 Dense 층 출력을 Reshape한 형태를 옳게 짝지은 것은?", "opts": ["차원 10, 형태 (14, 14, 64)", "차원 100, 형태 (7, 7, 128)", "차원 256, 형태 (28, 28, 1)", "차원 784, 형태 (7, 7, 64)"], "a": 1, "exp": "생성자는 input_dim=100인 Dense(128×7×7) 층의 출력을 Reshape((7, 7, 128))로 바꾸어 특징 맵을 만든다."}, {"id": 91, "sec": "13.6", "diff": "심화", "q": "생성자에서 특징 맵의 가로세로 크기가 변해 가는 순서로 옳은 것은?", "opts": ["7×7 → 14×14 → 28×28", "28×28 → 14×14 → 7×7", "14×14 → 7×7 → 28×28", "28×28 → 7×7 → 14×14"], "a": 0, "exp": "자료의 생성자 구조 그림은 7×7×128에서 업샘플링을 거쳐 14×14×128, 28×28×64를 지나 최종 28×28×1 이미지가 되는 과정을 보여 준다."}, {"id": 92, "sec": "13.6", "diff": "심화", "q": "프로젝트 4단계 판별자 구성에서 특징 맵이 변해 가는 방향으로 옳은 것은?", "opts": ["28×28×1에서 시작해 크기는 줄고 채널은 늘어나다가 마지막에 값 1개를 출력한다", "28×28에서 시작해 크기가 계속 커진다", "100차원 벡터에서 시작해 28×28로 커진다", "크기는 변하지 않고 채널 수만 계속 늘어난다"], "a": 0, "exp": "판별자 구조 그림은 28×28×1에서 14×14×32, 8×8×64, 4×4×128, 4×4×256을 거쳐 완전 연결층을 지나 1개의 값을 출력하는 흐름을 보여 준다."}, {"id": 93, "sec": "13.6", "diff": "중급", "q": "5단계 통합 신경망 구성 코드에서 사용한 최적화 알고리즘 설정으로 옳은 것은?", "opts": ["SGD(learning_rate=0.01)", "Adam(learning_rate=0.0002, beta_1=0.5)", "RMSprop(learning_rate=0.001)", "Adam(learning_rate=0.1, beta_1=0.9)"], "a": 1, "exp": "자료의 5단계 코드는 optimizer = Adam(learning_rate=0.0002, beta_1=0.5)로 최적화 알고리즘을 준비한다."}, {"id": 94, "sec": "13.6", "diff": "중급", "q": "5단계에서 통합 신경망을 만드는 코드의 흐름으로 옳은 것은?", "opts": ["z를 입력으로 받아 생성자가 이미지를 만들고, 그 이미지를 판별자에 넣어 유효성(valid)을 출력하는 모델을 만든다", "실제 이미지를 입력으로 받아 판별자만 통과시키는 모델을 만든다", "판별자의 출력을 다시 생성자에 입력하는 순환 모델을 만든다", "생성자와 판별자를 나란히 두고 두 출력을 평균 내는 모델을 만든다"], "a": 0, "exp": "코드는 z = Input(shape=(100,)), img = generator(z), valid = discriminator(img), combined = Model(inputs=z, outputs=valid)의 순서로 통합 신경망을 구성한다."}, {"id": 95, "sec": "13.6", "diff": "심화", "q": "6단계 학습 함수에서 valid = np.ones((batch_size, 1))와 fake = np.zeros((batch_size, 1))가 의미하는 것은?", "opts": ["생성자와 판별자의 학습률", "이미지 픽셀의 최댓값과 최솟값", "배치에 사용할 인덱스 목록", "진짜와 가짜를 나타내는 정답 레이블"], "a": 3, "exp": "1로 채운 valid는 진짜, 0으로 채운 fake는 가짜를 뜻하는 정답 데이터로 판별자와 통합 신경망 학습에 사용된다."}, {"id": 96, "sec": "13.6", "diff": "중급", "q": "6단계 학습 함수에서 훈련 데이터로부터 한 배치를 뽑을 때 사용하는 방법은 무엇인가?", "opts": ["항상 데이터 앞쪽에서부터 순서대로 잘라 쓴다", "np.random.randint로 무작위 인덱스를 뽑아 해당 이미지를 선택한다", "이미지를 밝기 순으로 정렬해 앞에서부터 선택한다", "판별자의 손실이 큰 이미지만 골라서 선택한다"], "a": 1, "exp": "코드는 idx = np.random.randint(0, X_train.shape[0], batch_size)로 무작위 인덱스를 뽑아 imgs = X_train[idx]로 배치를 만든다."}, {"id": 97, "sec": "13.6", "diff": "심화", "q": "6단계에서 d_loss = 0.5 * np.add(d_loss_real, d_loss_fake)가 하는 일은 무엇인가?", "opts": ["진짜와 가짜에 대한 판별자 손실의 평균을 구해 판별자의 최종 손실로 삼는다", "생성자의 손실을 절반으로 줄인다", "판별자의 학습률을 절반으로 낮춘다", "두 손실 중 큰 값을 선택한다"], "a": 0, "exp": "두 손실을 더한 뒤 0.5를 곱하므로 진짜 배치와 가짜 배치에 대한 판별자 손실의 평균이 된다."}, {"id": 98, "sec": "13.6", "diff": "중급", "q": "6단계의 g_loss = combined.train_on_batch(noise, valid)에 대한 설명으로 옳은 것은?", "opts": ["판별자가 노이즈를 진짜로 분류하도록 판별자를 학습시킨다", "노이즈 벡터 자체를 갱신해 더 좋은 벡터를 찾는다", "판별자와 생성자를 동시에 갱신한다", "판별자 모델이 가짜 이미지를 진짜(valid)로 판정하도록 생성자를 학습시킨다"], "a": 3, "exp": "통합 신경망에서는 판별자가 고정되어 있으므로, 노이즈를 넣고 valid를 정답으로 주는 학습은 생성자가 판별자를 속이도록 만드는 학습이 된다."}, {"id": 99, "sec": "13.6", "diff": "중급", "q": "7단계에서 실행하는 train(epochs=1000, batch_size=32, save_interval=50)의 인자 의미로 옳은 것은?", "opts": ["에포크 1000회, 배치 크기 32, 50 에포크마다 생성 이미지 저장", "에포크 32회, 배치 크기 1000, 이미지 50장 저장", "학습률 1000, 배치 크기 32, 50회 반복", "에포크 50회, 배치 크기 1000, 이미지 32장 저장"], "a": 0, "exp": "epochs는 학습 반복 횟수 1000, batch_size는 한 번에 처리할 이미지 수 32, save_interval은 50 에포크마다 생성 이미지를 저장하라는 뜻이다."}, {"id": 100, "sec": "13.6", "diff": "심화", "q": "7단계 학습 결과 관찰에서 에포크가 진행됨에 따라 나타나는 변화로 자료가 보여 준 것은?", "opts": ["생성된 이미지가 점점 노이즈에 가까워진다", "판별자의 손실이 처음부터 0으로 고정된다", "에포크가 늘어날수록 생성 이미지가 훈련 데이터의 형태에 점점 가까워진다", "생성 이미지의 해상도가 에포크마다 점점 커진다"], "a": 2, "exp": "자료의 에포크별 결과 그림은 0 에포크의 잡음에서 시작해 50, 1,000, 10,000 에포크로 갈수록 훈련 데이터(패션 MNIST)의 형태에 가까운 이미지가 생성됨을 보여 준다."}];

const SECTIONS = {
  "13.1": "생성모델 개요와 GAN의 기본 개념",
  "13.2": "GAN의 구조와 동작 원리",
  "13.3": "GAN의 학습 과정과 통합 신경망",
  "13.4": "미니맥스 게임과 가치 함수",
  "13.5": "GAN의 평가 방법과 응용 분야",
  "13.6": "GAN 모델 구현 프로젝트"
};
const DIFFS = ["기초","중급","심화"];
const DIFFCLS = {"기초":"d1","중급":"d2","심화":"d3"};
const KEY = "mlx_week13_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
