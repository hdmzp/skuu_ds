<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3주차 선형 회귀 100문제 · 기계학습특론</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 3 · 선형 회귀</div>
    <h1>3주차 &middot; 선형 회귀 — 100문제</h1>
    <p class="sub">강의자료 3.1~3.6절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    3주차 강의자료(단순선형회귀의 개념 · 회귀모델의 손실함수 · 학습방법) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "3.1", "diff": "기초", "q": "이 강의자료의 CHAPTER 1이 다루는 주제는 무엇인가?", "opts": ["선형 회귀(Linear Regression)", "서포트 벡터 머신(SVM)", "군집화(Clustering)", "강화학습(Reinforcement Learning)"], "a": 0, "exp": "자료의 표지에 'CHAPTER 1 선형 회귀'라고 명시되어 있으며, 단순 선형 회귀부터 다중 선형 회귀까지를 다룬다."}, {"id": 2, "sec": "3.1", "diff": "기초", "q": "다음 중 3주차 학습 목표로 제시되지 않은 것은?", "opts": ["회귀의 주요 개념", "단순 선형 회귀 및 손실함수", "단순 선형 회귀의 학습 방법(경사하강법)", "의사결정나무(Decision Tree)의 가지치기"], "a": 3, "exp": "학습 목표는 회귀의 주요 개념, 단순 선형 회귀 및 손실함수, 학습 방법(경사하강법), 다중 선형 회귀의 네 가지이며 의사결정나무는 포함되지 않는다."}, {"id": 3, "sec": "3.1", "diff": "기초", "q": "강의자료의 이미지 예시에서 '가까운 정도(거리)를 색깔로 표현하여 파란색이면 가까운 곳, 빨간색이면 먼 곳으로 나타내는 것'은 어떤 문제에 해당하는가?", "opts": ["분류(Classification)", "회귀(Regression)", "군집화(Clustering)", "차원 축소(Dimensionality Reduction)"], "a": 1, "exp": "거리라는 연속적인 값을 색으로 표현한 것이므로 회귀 문제의 예시이다. 분류는 물체 종류별로 다른 색을 칠한 쪽이다."}, {"id": 4, "sec": "3.1", "diff": "중급", "q": "강의자료에서 '물체의 종류별로 다른 색깔로 표현하며 각 픽셀별로 구분되는 것으로 세그멘테이션으로 볼 수 있다'고 설명한 문제 유형은 무엇인가?", "opts": ["회귀", "이상치 탐지", "분류", "강화학습"], "a": 2, "exp": "종류(범주)를 구분해 표현하므로 분류 문제이며, 픽셀 단위로 범주를 나눈 결과가 세그멘테이션이다."}, {"id": 5, "sec": "3.1", "diff": "중급", "q": "회귀 문제와 분류 문제를 색깔 표현 예시로 비교할 때 두 문제의 가장 큰 차이는 무엇인가?", "opts": ["회귀는 거리처럼 연속적인 정도를 값으로 나타내고, 분류는 물체의 종류를 구분해 나타낸다", "회귀는 픽셀 단위 처리가 불가능하고 분류만 가능하다", "회귀는 지도학습이 아니고 분류만 지도학습이다", "회귀는 색깔로 표현할 수 없고 분류만 색깔로 표현할 수 있다"], "a": 0, "exp": "강의자료의 예시는 회귀가 거리(연속량)를, 분류가 물체 종류(범주)를 색으로 나타낸다는 차이를 보여준다."}, {"id": 6, "sec": "3.1", "diff": "기초", "q": "강의자료가 회귀 예시로 든 집값 예측 문제에서 제시한 두 가지 관심사는 무엇인가?", "opts": ["분류(Classification)와 군집화(Clustering)", "정규화(Normalization)와 표준화(Standardization)", "관계(Relation)와 예측(Prediction)", "탐색(Exploration)과 활용(Exploitation)"], "a": 2, "exp": "집값 예측 문제는 집 값과 집 크기의 관계(Relation), 그리고 새로운 크기에 대한 가격 예측(Prediction) 두 가지로 정리된다."}, {"id": 7, "sec": "3.1", "diff": "중급", "q": "'집 값(Price)과 집 크기(Size)의 관계는 어떻게 되는가?'라는 물음은 집값 예측 문제의 어떤 측면인가?", "opts": ["예측(Prediction)", "관계(Relation)", "분류(Classification)", "정규화(Regularization)"], "a": 1, "exp": "두 변수 사이의 관계를 묻고 있으므로 관계(Relation) 측면이다. 특정 입력에 대한 값을 묻는 것이 예측 측면이다."}, {"id": 8, "sec": "3.1", "diff": "중급", "q": "'집 크기가 1,202 일 때 예상되는 집 가격은 어떻게 되는가?'라는 물음은 어떤 측면에 해당하는가?", "opts": ["관계(Relation)", "군집화(Clustering)", "해석(Interpretation)", "예측(Prediction)"], "a": 3, "exp": "새로운 입력 값 1,202에 대한 출력 값을 구하는 것이므로 예측(Prediction) 측면이다."}, {"id": 9, "sec": "3.1", "diff": "기초", "q": "강의자료의 집값 데이터 표에서 크기(x)와 가격(y)의 단위는 각각 무엇인가?", "opts": ["feet²와 1,000$", "m²와 1,000$", "feet²와 1$", "m²와 1$"], "a": 0, "exp": "표의 머리글에 크기는 feet², 가격은 1,000$ 단위로 표기되어 있다."}, {"id": 10, "sec": "3.1", "diff": "중급", "q": "강의자료의 집값 데이터 표에서 크기가 2,104인 데이터의 가격(y)은 얼마인가?", "opts": ["232", "460", "315", "178"], "a": 1, "exp": "표의 첫 행이 크기 2,104에 가격 460(단위 1,000$)으로 대응된다."}, {"id": 11, "sec": "3.1", "diff": "중급", "q": "집값 데이터 표에서 크기 1,416과 1,534에 대응하는 가격을 순서대로 바르게 짝지은 것은?", "opts": ["460과 232", "315와 232", "232와 315", "178과 315"], "a": 2, "exp": "표에 따르면 1,416 → 232, 1,534 → 315 이다."}, {"id": 12, "sec": "3.1", "diff": "기초", "q": "회귀(Regression)에 대한 설명으로 강의자료에 제시되지 않은 것은?", "opts": ["독립 변수와 종속 변수 간의 관계를 분석하는 것", "새로운 입력 값에 대한 출력 값을 예측하는 것", "종속 변수에 대한 독립 변수의 효과를 이해하는 것", "데이터를 미리 정해진 개수의 군집으로 나누는 것"], "a": 3, "exp": "군집으로 나누는 것은 군집화(비지도학습)의 설명이다. 나머지 세 가지가 강의자료의 회귀 정의이다."}, {"id": 13, "sec": "3.1", "diff": "중급", "q": "회귀를 설명하는 그래프에서 y_i ∈ ℝ 로 표기된 축은 무엇을 의미하는가?", "opts": ["출력(Output)", "입력(Input)", "파라미터(Parameter)", "학습률(Learning rate)"], "a": 0, "exp": "그래프에서 y_i ∈ ℝ 는 'Output'으로, x_i ∈ ℝ^d 는 'Input'으로 표기되어 있다."}, {"id": 14, "sec": "3.1", "diff": "심화", "q": "회귀 설명 그래프에서 입력은 x_i ∈ ℝ^d 로 표기되는데, 그 그래프에서 d의 값은 얼마로 표현되어 있는가?", "opts": ["0", "1", "2", "N"], "a": 1, "exp": "그래프는 입력 축이 하나인 2차원 산점도이므로 '이 그래프에서 d는 1로 표현'이라고 명시되어 있다."}, {"id": 15, "sec": "3.2", "diff": "기초", "q": "회귀에서 지도학습 데이터셋은 강의자료에서 어떤 형태로 표기되는가?", "opts": ["{x_i}_{i=1}^N", "{(w_0, w_1)}", "{(x_i, y_i)}_{i=1}^N", "{f_w(x_i)}_{i=1}^d"], "a": 2, "exp": "지도학습 데이터셋은 입력과 실제 값의 쌍 {(x_i, y_i)}_{i=1}^N 으로 표기된다."}, {"id": 16, "sec": "3.2", "diff": "기초", "q": "데이터셋 표기 {(x_i, y_i)}_{i=1}^N 에서 N은 무엇을 의미하는가?", "opts": ["전체 관측 값의 수(데이터셋의 크기)", "특징 벡터의 차원", "학습률의 크기", "파라미터의 개수"], "a": 0, "exp": "N은 전체 관측 값의 수, 즉 데이터셋의 크기를 의미한다."}, {"id": 17, "sec": "3.2", "diff": "중급", "q": "회귀 데이터셋 표기에서 d는 무엇을 의미하는가?", "opts": ["훈련 데이터의 개수", "관측 값을 구성하는 특징의 수, 즉 특징벡터의 차원", "반복 학습의 횟수", "손실함수의 최솟값"], "a": 1, "exp": "d는 관측 값을 구성하는 특징의 수이자 특징벡터 x_i의 차원이다. 데이터 개수는 N이다."}, {"id": 18, "sec": "3.2", "diff": "중급", "q": "x_i = [x_i1 x_i2 ... x_ij ... x_id]^T 에서 x_ij 가 의미하는 것은 무엇인가?", "opts": ["i번째 데이터의 실제 출력 값", "j번째 데이터의 특징 벡터 전체", "전체 데이터의 j번째 평균값", "i번째 관측 값의 j번째 특징(Feature) 값"], "a": 3, "exp": "첫 첨자 i는 몇 번째 관측 값인지를, 둘째 첨자 j는 그 관측 값 안에서 몇 번째 특징인지를 가리킨다."}, {"id": 19, "sec": "3.2", "diff": "중급", "q": "강의자료의 데이터셋 설명에서 출력 y_i 에 대한 서술로 옳은 것은?", "opts": ["항상 0 또는 1의 값만 갖는다", "반드시 d차원 벡터로 주어진다", "이 챕터에서는 스칼라 값(y_i ∈ ℝ)으로 한정한다", "파라미터 w와 같은 차원을 갖는다"], "a": 2, "exp": "자료는 벡터 형식의 다변량 출력도 가능하지만 이 챕터에서는 y_i를 스칼라 값으로 한정한다고 밝히고 있다."}, {"id": 20, "sec": "3.2", "diff": "기초", "q": "입력 변수(Input variable)를 부르는 다른 이름으로 강의자료가 제시한 것은?", "opts": ["종속 변수(Dependent variable), 목표 값(Target)", "특징(Features), 독립 변수(Independent variable)", "가중치(Weight), 파라미터(Parameter)", "잔차(Residual), 오차(Error)"], "a": 1, "exp": "입력 변수는 특징(Features) 또는 독립 변수(Independent variable)로도 표현된다."}, {"id": 21, "sec": "3.2", "diff": "기초", "q": "출력 변수(Output variable)를 부르는 다른 이름으로 강의자료가 제시한 것은?", "opts": ["종속 변수(Dependent variable)", "독립 변수(Independent variable)", "특징 벡터(Feature vector)", "학습률(Learning rate)"], "a": 0, "exp": "출력 변수는 종속 변수(Dependent variable)라고도 표현된다."}, {"id": 22, "sec": "3.2", "diff": "기초", "q": "강의자료가 제시한 회귀의 두 가지 목적으로 옳게 짝지어진 것은?", "opts": ["압축 측면과 복원 측면", "분류 측면과 군집 측면", "정규화 측면과 일반화 측면", "예측 측면과 해석(관계) 측면"], "a": 3, "exp": "회귀의 목적은 새로운 입력에 대한 출력을 예측하는 측면과, 입력에 대한 출력의 변화를 이해하는 해석(관계) 측면 두 가지이다."}, {"id": 23, "sec": "3.2", "diff": "중급", "q": "'키가 170cm 인 사람의 몸무게는 얼마인가?'라는 질문은 회귀의 어떤 목적에 해당하는가?", "opts": ["예측 측면", "해석(관계) 측면", "분류 측면", "군집 측면"], "a": 0, "exp": "구체적인 입력 값에 대한 출력 값을 묻고 있으므로 예측 측면의 예시이다."}, {"id": 24, "sec": "3.2", "diff": "중급", "q": "'키가 큰 사람은 몸무게가 무거운가?'라는 질문은 회귀의 어떤 목적에 해당하는가?", "opts": ["예측 측면", "최적화 측면", "해석 또는 관계 측면", "차원 축소 측면"], "a": 2, "exp": "입력 값의 변화에 따라 출력 값이 어떻게 변하는지를 묻는 것이므로 해석(관계) 측면이다."}, {"id": 25, "sec": "3.2", "diff": "중급", "q": "강의자료에서 '회귀에서의 학습'을 무엇이라고 정의하는가?", "opts": ["데이터를 여러 군집으로 나누는 과정", "입력 값이 주어졌을 때 적합한 출력 값을 내는 함수(Function)를 찾는 과정", "손실함수의 값을 최대로 만드는 과정", "특징의 개수를 늘려 차원을 확장하는 과정"], "a": 1, "exp": "회귀에서의 학습은 적합한 출력을 내는 함수, 즉 독립변수와 종속변수의 관계를 표현하는 함수를 찾는 과정이다."}, {"id": 26, "sec": "3.2", "diff": "중급", "q": "회귀에서의 학습 과정을 나타낸 도식에서 훈련데이터셋과 학습 과정을 거쳐 최종적으로 얻는 것은 무엇인가?", "opts": ["학습률 α", "손실함수의 최댓값", "특징 벡터 x_i", "입력 x_i를 받아 y_i ≈ f(x_i)를 내는 함수(Function)"], "a": 3, "exp": "도식은 훈련데이터셋 → 학습 과정 → 함수(Function)의 흐름을 보여주며, 그 함수가 x_i를 받아 y_i에 가까운 값을 출력한다."}, {"id": 27, "sec": "3.2", "diff": "기초", "q": "회귀에서의 학습 도식에 표기된 관계식으로 옳은 것은?", "opts": ["y_i ≈ f(x_i), for all i", "y_i = w_0 for all i", "x_i ≈ f(y_i), for all i", "L(w) ≈ 0 for all w"], "a": 0, "exp": "모든 i에 대해 실제 값 y_i가 함수 값 f(x_i)에 근사하도록 함수를 찾는 것이 학습의 목표이다."}, {"id": 28, "sec": "3.2", "diff": "기초", "q": "강의자료가 강조한 상관관계(correlation)와 인과관계의 관계로 옳은 것은?", "opts": ["상관관계가 높으면 인과관계가 성립한다", "인과관계와 상관관계는 동일한 개념이다", "상관관계는 인과관계와 같지 않다", "상관관계가 없으면 인과관계가 반드시 존재한다"], "a": 2, "exp": "'상관 관계는 인과관계와 같지 않음'이 해당 슬라이드의 제목이자 핵심 메시지이다."}, {"id": 29, "sec": "3.2", "diff": "중급", "q": "회귀 결과를 해석할 때 강의자료가 주의하라고 한 점은 무엇인가?", "opts": ["예측 값은 반드시 정수로 반올림해야 한다", "회귀는 상관관계를 찾는 것이므로 인과 관계로 해석해서는 안 된다", "독립 변수의 개수는 항상 1개여야 한다", "훈련 데이터는 반드시 정규분포를 따라야 한다"], "a": 1, "exp": "회귀가 찾는 것은 변수 간 상관관계이므로 이를 원인과 결과로 단정해 해석하면 안 된다."}, {"id": 30, "sec": "3.2", "diff": "심화", "q": "지구 평균 기온과 해적의 수를 함께 그린 그래프를 강의자료가 예시로 든 이유는 무엇인가?", "opts": ["두 변수의 인과관계를 증명하기 위해", "회귀 모델의 학습률을 설명하기 위해", "손실함수의 등고선을 설명하기 위해", "상관관계가 있어 보여도 인과관계로 해석하면 안 됨을 보이기 위해"], "a": 3, "exp": "두 변수는 직선에 가까운 상관을 보이지만 서로 원인과 결과가 아니므로, 상관관계와 인과관계를 혼동하면 안 된다는 점을 보여주는 사례이다."}, {"id": 31, "sec": "3.3", "diff": "기초", "q": "단순 선형 회귀(Simple Linear Regression)는 어떤 경우에 해당하는 모델인가?", "opts": ["출력 값의 개수가 1개일 때", "입력 값의 차원이 1개일 때", "훈련 데이터가 1개일 때", "파라미터가 1개일 때"], "a": 1, "exp": "강의자료는 '입력 값의 차원이 1개 일때'의 선형 모델을 단순 선형 회귀라고 정의한다."}, {"id": 32, "sec": "3.3", "diff": "기초", "q": "단순 선형 회귀 모델의 식으로 옳은 것은?", "opts": ["f_w(x_i) = w_0 + w_1 x_i", "f_w(x_i) = w_0 x_i + w_1 x_i²", "f_w(x_i) = w_1 / x_i", "f_w(x_i) = w_0 · w_1 · x_i"], "a": 0, "exp": "단순 선형 회귀는 y_i ≈ f(x_i) = f_w(x_i) = w_0 + w_1 x_i 로 정의된다."}, {"id": 33, "sec": "3.3", "diff": "중급", "q": "단순 선형 회귀에서 파라미터 벡터 w의 표기와 파라미터 개수를 옳게 짝지은 것은?", "opts": ["w = [w_1]^T, 1개", "w = [w_0 w_1 w_2]^T, 3개", "w = [w_0 w_1]^T, 2개", "w = [w_0]^T, 1개"], "a": 2, "exp": "단순 선형 회귀의 파라미터 벡터는 w = [w_0 w_1]^T 이며 2개의 파라미터를 갖는다."}, {"id": 34, "sec": "3.3", "diff": "기초", "q": "강의자료에서 파라미터(매개변수)를 부르는 또 다른 말로 제시된 것은?", "opts": ["잔차(Residual)", "학습률(Learning rate)", "특징(Feature)", "가중치(Weight)"], "a": 3, "exp": "슬라이드에 '또 다른 말로 가중치라고 하기도 함'이라고 표기되어 있다."}, {"id": 35, "sec": "3.3", "diff": "중급", "q": "단순 선형 회귀에서 입력을 x_i = [x_i1] = x_i ∈ ℝ 로 쓸 수 있는 이유는 무엇인가?", "opts": ["특징 벡터의 차원 d가 1이기 때문", "훈련 데이터 수 N이 1이기 때문", "출력이 스칼라이기 때문", "학습률 α가 1이기 때문"], "a": 0, "exp": "x_i ∈ ℝ^d 에서 d = 1인 경우이므로 성분이 하나뿐인 벡터를 스칼라로 볼 수 있다."}, {"id": 36, "sec": "3.3", "diff": "중급", "q": "f_w(x_i) = w_0 + w_1 x_i 를 그래프로 나타냈을 때 w_0가 의미하는 것은?", "opts": ["직선의 기울기", "x_i = 0일 때의 함수 값, 즉 절편", "손실함수의 최솟값", "특징의 개수"], "a": 1, "exp": "그래프에서 w_0는 세로축과 만나는 절편으로 표시되어 있고, 기울기는 w_1이다."}, {"id": 37, "sec": "3.3", "diff": "중급", "q": "단순 선형 회귀 그래프에서 x가 1만큼 증가할 때 함수 값이 변하는 양은 무엇으로 표현되는가?", "opts": ["w_0", "α", "w_1", "N"], "a": 2, "exp": "그래프에 밑변 1에 대한 높이 변화가 w_1로 표시되어 있으며, 이는 직선의 기울기이다."}, {"id": 38, "sec": "3.3", "diff": "심화", "q": "강의자료에서 f(x_i)를 대신하여 쓰기도 한다고 밝힌 표기는 무엇인가?", "opts": ["L(x_i)", "α_i", "w_i", "ŷ_i"], "a": 3, "exp": "'f(x_i)를 ŷ_i 으로 표기하기도 함'이라는 각주가 달려 있다. 예측 값이라는 뜻이다."}, {"id": 39, "sec": "3.3", "diff": "중급", "q": "단순 선형 회귀 모델 f_w(x_i) = w_0 + w_1 x_i 가 그림으로 표현하는 것은 무엇인가?", "opts": ["독립변수와 종속변수 간의 관계", "입력 데이터의 분산", "출력 값의 확률 분포", "훈련 데이터의 개수"], "a": 0, "exp": "자료는 이 모델이 독립변수와 종속변수 간의 관계를 직선으로 표현한다고 설명한다."}, {"id": 40, "sec": "3.3", "diff": "심화", "q": "강의자료 예시처럼 w_0 = 50, w_1 = 0.06 일 때의 모델 식과 크기 x = 2000에 대한 예측 값을 옳게 짝지은 것은?", "opts": ["f_w(x) = 50 + 0.06x, 예측 값 50", "f_w(x) = 50 + 0.06x, 예측 값 170", "f_w(x) = 0.06 + 50x, 예측 값 2050", "f_w(x) = 50 − 0.06x, 예측 값 −70"], "a": 1, "exp": "슬라이드에 f_w(x) = 50 + 0.06x 가 제시되어 있고, x = 2000을 대입하면 50 + 120 = 170 이다."}, {"id": 41, "sec": "3.3", "diff": "중급", "q": "w_0 = 0으로 두고 w_1 = 0.5 인 모델 f_{w1}(x) = w_1 x 에서 x = 2일 때 예측 값은 얼마인가?", "opts": ["0.5", "2", "1", "2.5"], "a": 2, "exp": "f(2) = 0.5 × 2 = 1 이다. 강의자료의 예시 그래프에서도 w_1 = 0.5인 직선이 사용된다."}, {"id": 42, "sec": "3.3", "diff": "심화", "q": "단순 선형 회귀에서 입력의 차원 d가 1인데도 파라미터가 2개인 이유를 옳게 설명한 것은?", "opts": ["출력이 2차원이기 때문", "훈련 데이터를 두 그룹으로 나누기 때문", "학습률과 기울기를 각각 두기 때문", "기울기 w_1 외에 절편 역할을 하는 w_0가 추가로 필요하기 때문"], "a": 3, "exp": "직선은 기울기와 절편 두 값으로 결정되므로 w = [w_0 w_1]^T 처럼 파라미터가 2개가 된다."}, {"id": 43, "sec": "3.4", "diff": "기초", "q": "손실 함수를 부르는 다른 이름으로 강의자료가 제시하지 않은 것은?", "opts": ["활성화 함수(Activation function)", "비용 함수(Cost function)", "훈련 목적 함수", "손실 함수(Loss function)"], "a": 0, "exp": "자료는 손실 함수를 비용 함수, 훈련 목적 함수 등으로도 부른다고 했으며 활성화 함수는 언급되지 않았다."}, {"id": 44, "sec": "3.4", "diff": "기초", "q": "손실 함수는 무엇을 위해 사용되는가?", "opts": ["입력 데이터의 차원을 줄이기 위해", "모델의 파라미터 w = [w_0 w_1]^T 를 학습할 때 사용", "훈련 데이터의 개수를 늘리기 위해", "출력 값을 범주로 변환하기 위해"], "a": 1, "exp": "손실 함수는 모델의 파라미터를 학습할 때 사용하는 기준 함수이다."}, {"id": 45, "sec": "3.4", "diff": "중급", "q": "손실함수 L(w)의 값이 작을수록 의미하는 것은 무엇인가?", "opts": ["모델의 파라미터 개수가 적다", "학습률이 크다", "모델이 예측한 출력 값 f_w(x_i)가 실제 값 y_i와 유사하다", "훈련 데이터의 수가 많다"], "a": 2, "exp": "손실함수를 작게 할수록 훈련 데이터에 대해 예측 값이 실제 값과 유사하다는 뜻이다."}, {"id": 46, "sec": "3.4", "diff": "기초", "q": "손실함수를 도입하는 핵심 아이디어로 강의자료가 제시한 것은?", "opts": ["훈련 데이터를 무작위로 섞는 것", "입력의 차원을 항상 1로 고정하는 것", "출력 값을 0과 1 사이로 정규화하는 것", "훈련 데이터 {(x_i, y_i)}를 이용해 f_w(x_i)가 y_i에 가깝도록 w = [w_0 w_1]^T 를 정하는 것"], "a": 3, "exp": "핵심 아이디어는 훈련 데이터를 이용해 예측 값이 실제 값에 가깝도록 파라미터를 정하는 것이다."}, {"id": 47, "sec": "3.4", "diff": "중급", "q": "강의자료에 제시된 단순 선형 회귀의 손실함수 L(w) 식으로 옳은 것은?", "opts": ["L(w) = (1/N) Σ_{i=1}^N (f_w(x_i) − y_i)²", "L(w) = Σ_{i=1}^N (f_w(x_i) − y_i)", "L(w) = (1/N) Σ_{i=1}^N |f_w(x_i) + y_i|", "L(w) = (1/N) Σ_{i=1}^N (f_w(x_i) · y_i)²"], "a": 0, "exp": "자료의 손실함수는 예측 값과 실제 값 차이의 제곱을 모두 더한 뒤 N으로 나눈 평균 제곱 오차이다."}, {"id": 48, "sec": "3.4", "diff": "중급", "q": "손실함수 정의에서 앞에 1/N 을 곱하는 것은 어떤 의미인가?", "opts": ["오차의 총합을 최대로 만들기 위해", "제곱 오차의 합을 전체 데이터 수 N으로 나누어 평균을 취하기 위해", "학습률을 자동으로 조절하기 위해", "파라미터 개수를 반영하기 위해"], "a": 1, "exp": "1/N은 오차 제곱합을 데이터 수로 나눈 평균으로 만들어, 데이터 개수에 따라 값이 커지는 것을 막는다."}, {"id": 49, "sec": "3.4", "diff": "중급", "q": "최적 파라미터 w*를 나타내는 식으로 옳은 것은?", "opts": ["w* = argmax_w L(w)", "w* = L(w)/N", "w* = argmin_w L(w)", "w* = Σ_w L(w)"], "a": 2, "exp": "손실함수를 최소로 만드는 파라미터를 찾는 것이 목표이므로 w* = argmin_w L(w) 이다."}, {"id": 50, "sec": "3.4", "diff": "기초", "q": "평균 제곱 오차(Mean square error, MSE)의 식으로 옳은 것은?", "opts": ["(1/N) Σ |f_w(x_i) − y_i|", "Σ (f_w(x_i) − y_i)²", "(1/N) Σ (f_w(x_i) + y_i)²", "(1/N) Σ (f_w(x_i) − y_i)²"], "a": 3, "exp": "MSE는 예측 값과 실제 값의 차이를 제곱하여 모두 더한 뒤 N으로 나눈 값이다."}, {"id": 51, "sec": "3.4", "diff": "기초", "q": "평균 절대 오차(Mean absolute error, MAE)의 식으로 옳은 것은?", "opts": ["(1/N) Σ |f_w(x_i) − y_i|", "(1/N) Σ (f_w(x_i) − y_i)²", "Σ |f_w(x_i) − y_i|²", "(1/N) Σ (y_i − f_w(x_i))³"], "a": 0, "exp": "MAE는 예측 값과 실제 값 차이의 절댓값을 평균한 값이다."}, {"id": 52, "sec": "3.4", "diff": "중급", "q": "MSE와 MAE의 차이를 옳게 설명한 것은?", "opts": ["MSE는 오차의 합을 그대로 쓰고 MAE는 평균을 쓴다", "MSE는 오차를 제곱해 평균하고, MAE는 오차의 절댓값을 평균한다", "MSE는 파라미터 학습에 쓰이고 MAE는 데이터 전처리에만 쓰인다", "MSE는 분류 문제에만, MAE는 회귀 문제에만 쓰인다"], "a": 1, "exp": "두 식 모두 1/N 을 곱한 평균이지만, 오차를 제곱하느냐 절댓값을 취하느냐가 다르다."}, {"id": 53, "sec": "3.4", "diff": "기초", "q": "강의자료가 대표적인 손실함수로 제시한 두 가지는 무엇인가?", "opts": ["교차 엔트로피와 힌지 손실", "KL 발산과 코사인 유사도", "MSE와 MAE", "정확도와 재현율"], "a": 2, "exp": "자료는 다양한 손실함수가 있지만 대표적으로 MSE와 MAE가 있다고 밝히고 있다."}, {"id": 54, "sec": "3.4", "diff": "심화", "q": "손실함수에 관한 강의자료의 서술로 옳은 것은?", "opts": ["회귀에서 쓸 수 있는 손실함수는 MSE 하나뿐이다", "손실함수는 파라미터와 무관하게 결정된다", "손실함수 값이 클수록 예측이 정확하다", "MSE와 MAE 이외에도 다양한 손실함수가 존재한다"], "a": 3, "exp": "'이외에도 다양한 손실함수가 존재하지만 대표적으로 MSE, MAE가 있다'고 명시되어 있다."}, {"id": 55, "sec": "3.4", "diff": "중급", "q": "w_0 = 0으로 고정한 경우의 모델과 손실함수를 옳게 짝지은 것은?", "opts": ["f_{w1}(x) = w_1 x 이고 L(w_1) = (1/N) Σ (f_{w1}(x_i) − y_i)²", "f_{w1}(x) = w_0 + w_1 x 이고 L(w_1) = Σ (f_w(x_i) − y_i)", "f_{w1}(x) = w_1 이고 L(w_1) = (1/N) Σ |w_1 − y_i|", "f_{w1}(x) = w_1 x 이고 L(w_1) = argmin_w L(w)"], "a": 0, "exp": "w_0 = 0이면 모델은 원점을 지나는 직선 w_1 x 가 되고, 손실함수는 파라미터 w_1 하나만의 함수인 평균 제곱 오차가 된다."}, {"id": 56, "sec": "3.4", "diff": "중급", "q": "w_0 = 0으로 고정하여 파라미터가 w_1 하나뿐일 때의 목표(Goal)를 나타낸 식은?", "opts": ["w_1* = argmax_{w_1} L(w_1)", "w_1* = argmin_{w_1} L(w_1)", "w* = argmin_w f_w(x)", "w_1* = (1/N) Σ y_i"], "a": 1, "exp": "목표는 손실함수 L(w_1)을 최소로 만드는 w_1을 찾는 것이므로 argmin으로 표기된다."}, {"id": 57, "sec": "3.4", "diff": "심화", "q": "훈련 데이터가 (1,1), (2,2), (3,3)이고 모델이 f(x) = w_1 x 이며 w_1 = 0.5 일 때 평균 제곱 오차 값은 얼마인가?", "opts": ["0.5", "1.0", "약 1.17", "3.5"], "a": 2, "exp": "예측은 0.5, 1, 1.5이고 오차 제곱은 0.25, 1, 2.25이므로 합 3.5를 N = 3으로 나누면 약 1.17이다."}, {"id": 58, "sec": "3.4", "diff": "심화", "q": "훈련 데이터가 (1,1), (2,2), (3,3)이고 모델이 f(x) = w_1 x 일 때, w_1 = 1로 두면 평균 제곱 오차 값은 얼마인가?", "opts": ["약 1.17", "0.5", "1.0", "0"], "a": 3, "exp": "w_1 = 1이면 모든 점에서 예측 값과 실제 값이 일치하므로 오차 제곱의 합이 0이 되어 손실함수 값도 0이다."}, {"id": 59, "sec": "3.4", "diff": "중급", "q": "f_w(x)를 그린 그래프와 L(w)를 그린 그래프의 차이를 옳게 설명한 것은?", "opts": ["전자는 w를 고정한 채 x에 대한 함수이고, 후자는 매개변수 w에 대한 함수이다", "전자는 매개변수의 함수이고 후자는 입력의 함수이다", "두 그래프는 축만 다를 뿐 항상 같은 모양이다", "전자는 항상 3차원이고 후자는 항상 2차원이다"], "a": 0, "exp": "슬라이드마다 f_w(x)는 'w가 고정된 경우, x의 함수', L(w)는 '매개변수 w의 함수'로 명시되어 있다."}, {"id": 60, "sec": "3.4", "diff": "중급", "q": "L(w)를 w_0, w_1 두 축에 대해 3차원으로 그린 그래프는 어떤 형태로 나타나는가?", "opts": ["평평한 평면", "아래로 볼록해 최솟값을 갖는 그릇 모양의 곡면", "계단 모양의 불연속 함수", "위로 볼록해 최댓값만 갖는 곡면"], "a": 1, "exp": "제곱 오차 손실함수는 아래로 볼록한 그릇 모양 곡면으로 그려지며 바닥이 최소 지점이 된다."}, {"id": 61, "sec": "3.4", "diff": "중급", "q": "손실함수의 등고선(contour) 그림에서 안쪽 곡선에 가까울수록 무엇을 의미하는가?", "opts": ["손실함수 값이 크다", "파라미터가 발산한다", "손실함수 값이 작다", "학습률이 커진다"], "a": 2, "exp": "등고선 그림에 안쪽은 '작은 손실함수값', 바깥쪽은 '큰 손실함수값'으로 표시되어 있다."}, {"id": 62, "sec": "3.4", "diff": "심화", "q": "손실함수 등고선 그림에서 Minimum으로 표시된 지점이 뜻하는 것은 무엇인가?", "opts": ["훈련 데이터의 평균값", "학습률이 0이 되는 지점", "기울기가 최대가 되는 지점", "손실함수를 최소로 만드는 w_0, w_1의 위치이며 이때 직선이 데이터를 가장 잘 설명한다"], "a": 3, "exp": "등고선의 가장 안쪽 중심이 손실 최소 지점이며, 그 파라미터를 쓴 직선이 훈련 데이터의 추세를 가장 잘 따라간다."}, {"id": 63, "sec": "3.5", "diff": "기초", "q": "경사하강법(Gradient descent)의 목적을 옳게 서술한 것은?", "opts": ["손실함수 L(w)를 최소화하는 파라미터 w* = [w_0* w_1*]^T 를 찾는 것", "손실함수를 최대화하는 파라미터를 찾는 것", "훈련 데이터의 개수를 최소화하는 것", "특징의 차원을 늘리는 것"], "a": 0, "exp": "경사하강법은 모델의 학습 방법으로, 손실함수를 가장 최소화하는 파라미터를 찾는 절차이다."}, {"id": 64, "sec": "3.5", "diff": "중급", "q": "파라미터 후보 값을 몇 개 정해 두고 손실함수 값이 가장 작은 것을 고르는 방법의 문제점으로 강의자료가 지적한 것은?", "opts": ["손실함수를 계산할 수 없다", "후보 값을 정하는 것이 쉽지 않다", "기울기를 계산할 수 없다", "반드시 발산한다"], "a": 1, "exp": "가장 간단한 방법이지만 어떤 후보 값을 얼마나 촘촘히 둘지 정하기가 어렵다는 한계가 있다."}, {"id": 65, "sec": "3.5", "diff": "기초", "q": "한 지점에서의 기울기(Gradient)는 무엇을 의미하는가?", "opts": ["함수 값 자체", "함수 값들의 평균", "함수의 접선 기울기", "함수의 최솟값"], "a": 2, "exp": "강의자료는 한 지점에서의 기울기를 그 점에서의 함수의 접선 기울기로 정의한다."}, {"id": 66, "sec": "3.5", "diff": "중급", "q": "기울기가 나타내는 방향에 대한 설명으로 옳은 것은?", "opts": ["함수를 가장 크게 감소시키는 방향", "함수 값이 변하지 않는 방향", "항상 가로축과 평행한 방향", "함수를 가장 최대로 증가시키는 방향"], "a": 3, "exp": "기울기는 함수를 가장 최대로 증가시키는 방향을 나타내므로, 감소를 원하면 그 반대인 음의 기울기 방향으로 가야 한다."}, {"id": 67, "sec": "3.5", "diff": "중급", "q": "현재 지점 w = [w_0 w_1]^T 에서 −∂L(w)/∂w 방향이 의미하는 것은 무엇인가?", "opts": ["손실함수 L(w)를 최대로 감소시키는 방향이며 경사하강의 방향이다", "손실함수를 최대로 증가시키는 방향이다", "손실함수 값이 변하지 않는 방향이다", "학습률의 크기를 결정하는 방향이다"], "a": 0, "exp": "음의 기울기 방향이 손실함수를 최대로 감소시키는 방향이며 이를 경사하강(gradient descent)의 방향이라고 부른다."}, {"id": 68, "sec": "3.5", "diff": "기초", "q": "경사하강법 절차의 첫 단계는 무엇인가?", "opts": ["종료조건의 값을 먼저 계산한다", "초기 값 w = [w_0 w_1]^T 에서 시작한다", "손실함수의 최솟값을 미리 구한다", "학습률을 0으로 놓는다"], "a": 1, "exp": "절차의 (1)단계는 파라미터의 초기 값을 정하고 그 지점에서 시작하는 것이다."}, {"id": 69, "sec": "3.5", "diff": "중급", "q": "강의자료가 경사하강법 절차에서 예로 든 초기 값은 무엇인가?", "opts": ["w_0 = 1, w_1 = 1", "w_0 = 1, w_1 = 0", "w_0 = 0, w_1 = 1", "w_0 = 0, w_1 = 0"], "a": 2, "exp": "절차 (1)에 '예를 들어 w_0 = 0, w_1 = 1'이라는 예시가 붙어 있다."}, {"id": 70, "sec": "3.5", "diff": "중급", "q": "경사하강법 절차의 두 번째 단계를 옳게 설명한 것은?", "opts": ["손실함수가 증가하는 방향으로 한 번만 업데이트한다", "학습률을 매 단계마다 두 배로 늘린다", "훈련 데이터를 새로 수집한다", "종료조건을 만족할 때까지 L(w)를 감소하는 방향으로 w를 반복적으로 업데이트한다"], "a": 3, "exp": "(2)단계는 종료조건을 만족할 때까지 손실을 줄이는 방향으로 파라미터를 반복 갱신하는 것이다."}, {"id": 71, "sec": "3.5", "diff": "기초", "q": "경사하강법을 '높은 산에서 가장 빨리 내려가는 방법'에 비유한 이유는 무엇인가?", "opts": ["현재 위치에서 가장 가파르게 내려가는 방향으로 조금씩 이동하는 방식이기 때문", "산의 정상을 찾아가는 방식이기 때문", "무작위로 위치를 바꾸는 방식이기 때문", "모든 위치의 높이를 전부 계산해 비교하는 방식이기 때문"], "a": 0, "exp": "손실함수 곡면을 지형으로 보면 경사하강법은 현재 위치의 가장 가파른 내리막 방향으로 한 걸음씩 내려가는 것과 같다."}, {"id": 72, "sec": "3.5", "diff": "중급", "q": "경사하강법의 세 가지 핵심 질문 중 'w는 어디에서 시작하는가?'에 대응하는 개념은?", "opts": ["기울기(Gradient)", "초기화(Initialization)", "학습률(Learning rate)", "종료조건"], "a": 1, "exp": "Q1(어디에서 시작하는가)은 초기화(Initialization)에 해당한다."}, {"id": 73, "sec": "3.5", "diff": "중급", "q": "경사하강법의 세 가지 핵심 질문 중 '어느 방향으로 w를 업데이트 하는가?'에 대응하는 개념은?", "opts": ["초기화(Initialization)", "학습률(Learning rate)", "기울기(Gradient)", "손실함수(Loss function)"], "a": 2, "exp": "Q2(어느 방향인가)는 기울기(Gradient)에 해당하며, 실제로는 음의 기울기 방향으로 이동한다."}, {"id": 74, "sec": "3.5", "diff": "중급", "q": "경사하강법의 세 가지 핵심 질문 중 'w를 업데이트 할 때 얼마큼 움직이는가?'에 대응하는 개념은?", "opts": ["기울기(Gradient)", "초기화(Initialization)", "특징 벡터(Feature vector)", "학습률(Learning rate)"], "a": 3, "exp": "Q3(얼마큼 움직이는가)은 학습률(Learning rate) α에 해당한다."}, {"id": 75, "sec": "3.5", "diff": "기초", "q": "경사하강법의 세 가지 질문과 대응 개념을 순서대로 바르게 나열한 것은?", "opts": ["시작 위치 → 초기화, 업데이트 방향 → 기울기, 이동량 → 학습률", "시작 위치 → 학습률, 업데이트 방향 → 초기화, 이동량 → 기울기", "시작 위치 → 기울기, 업데이트 방향 → 학습률, 이동량 → 초기화", "시작 위치 → 초기화, 업데이트 방향 → 학습률, 이동량 → 기울기"], "a": 0, "exp": "Q1은 초기화, Q2는 기울기, Q3은 학습률로 정리된다."}, {"id": 76, "sec": "3.5", "diff": "중급", "q": "경사하강법에서 w의 최초 값에 대한 강의자료의 설명으로 옳은 것은?", "opts": ["초기 값과 무관하게 항상 같은 결과에 도달한다", "최초 값에 따라 탐색 결과가 달라질 수 있어 w의 초기 상태도 중요한 이슈이다", "초기 값은 반드시 0으로 두어야 한다", "초기 값이 클수록 항상 더 좋은 결과를 얻는다"], "a": 1, "exp": "자료는 'W의 최초 값에 따라 탐색 결과가 틀려 질 수 있다'며 초기 상태가 중요한 이슈임을 강조한다."}, {"id": 77, "sec": "3.5", "diff": "기초", "q": "경사하강법 알고리즘에서 w_0의 갱신식으로 옳은 것은?", "opts": ["w_0 ← w_0 + α ∂L(w_0, w_1)/∂w_0", "w_0 ← w_0 − ∂L(w_0, w_1)/∂w_0", "w_0 ← w_0 − α ∂L(w_0, w_1)/∂w_0", "w_0 ← α w_0 − ∂L(w_0, w_1)/∂w_0"], "a": 2, "exp": "현재 값에서 학습률 α와 편미분 값의 곱을 빼는 형태이다. 부호가 +이면 손실이 커지는 방향으로 이동하게 된다."}, {"id": 78, "sec": "3.5", "diff": "기초", "q": "경사하강법 알고리즘에서 w_1의 갱신식으로 옳은 것은?", "opts": ["w_1 ← w_1 + α ∂L(w_0, w_1)/∂w_1", "w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_0", "w_1 ← w_1 · α ∂L(w_0, w_1)/∂w_1", "w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_1"], "a": 3, "exp": "w_1은 자기 자신에 대한 편미분 ∂L/∂w_1 을 사용해 갱신하며, 학습률을 곱한 값을 빼준다."}, {"id": 79, "sec": "3.5", "diff": "중급", "q": "갱신식 w_1 ← w_1 − α ∂L(w_0, w_1)/∂w_1 에서 α는 무엇을 가리키는가?", "opts": ["학습률", "기울기", "손실함수 값", "특징의 개수"], "a": 0, "exp": "슬라이드에서 α는 학습률(Learning rate)로, 편미분 항은 기울기로 표시되어 있다."}, {"id": 80, "sec": "3.5", "diff": "중급", "q": "경사하강법 알고리즘에서 갱신 과정을 반복하는 조건으로 옳은 것은?", "opts": ["손실함수가 증가할 때까지", "종료조건을 만족할 때까지 (예: for loop, while loop)", "전체 데이터를 한 번 보고 나면 즉시 중단", "기울기가 최대가 될 때까지"], "a": 1, "exp": "알고리즘 상단에 '종료조건을 만족할 때까지 아래 과정을 반복한다'고 적혀 있고 예시로 for loop, while loop가 제시된다."}, {"id": 81, "sec": "3.5", "diff": "심화", "q": "∂L/∂w_1 이 양수(positive number)일 때 갱신식 w_1 ← w_1 − α(양수)의 결과는 어떻게 되는가?", "opts": ["w_1이 커진다", "w_1이 변하지 않는다", "w_1이 작아진다", "w_1의 부호가 반대로 바뀐다"], "a": 2, "exp": "학습률 α는 양수이므로 양수를 빼게 되어 w_1은 감소한다. 즉 손실이 줄어드는 왼쪽 방향으로 이동한다."}, {"id": 82, "sec": "3.5", "diff": "심화", "q": "∂L/∂w_1 이 음수(negative number)일 때 갱신식 w_1 ← w_1 − α(음수)의 결과는 어떻게 되는가?", "opts": ["w_1이 작아진다", "w_1이 0이 된다", "w_1이 변하지 않는다", "w_1이 커진다"], "a": 3, "exp": "음수를 빼면 값이 더해지는 것과 같으므로 w_1은 증가하며, 역시 손실이 줄어드는 방향으로 이동한다."}, {"id": 83, "sec": "3.5", "diff": "중급", "q": "학습률 α가 너무 작을 때 나타나는 현상은 무엇인가?", "opts": ["경사 하강이 천천히 발생한다", "곧바로 발산한다", "기울기가 0이 된다", "손실함수가 최대가 된다"], "a": 0, "exp": "자료는 'α가 너무 작으면 경사 하강이 천천히 발생함'이라고 설명한다. 한 걸음의 폭이 작기 때문이다."}, {"id": 84, "sec": "3.5", "diff": "중급", "q": "학습률 α가 너무 클 때 나타나는 현상은 무엇인가?", "opts": ["학습이 매우 느려진다", "수렴되지 않고 발산 등이 될 수 있다", "항상 최솟값에 정확히 도달한다", "기울기 계산이 불가능해진다"], "a": 1, "exp": "자료는 'α가 너무 크면, 수렴되지 않고 발산 등이 됨'이라고 밝히고 있다. 최소 지점을 지나쳐 진동하거나 튕겨 나가기 때문이다."}, {"id": 85, "sec": "3.5", "diff": "심화", "q": "경사하강법의 한계점으로 제시된 상황, 즉 기울기가 0이 되어 w_1 ← w_1 − α(0) 이 되는 경우의 결과는?", "opts": ["학습률이 자동으로 커진다", "손실함수가 즉시 최솟값이 된다", "w_1이 더 이상 갱신되지 않고 그 지점에 머무른다", "w_1이 무한히 커진다"], "a": 2, "exp": "기울기가 0이면 빼줄 양이 0이므로 파라미터가 갱신되지 않는다. 그 지점이 전역 최솟값이 아니어도 멈추게 되는 것이 한계점이다."}, {"id": 86, "sec": "3.5", "diff": "심화", "q": "기울기 계산(Computing Gradients)에 대한 강의자료의 도식과 설명으로 옳은 것은?", "opts": ["기울기는 함수 값 f(x) 자체이다", "기울기는 Δx의 크기만으로 결정된다", "기울기는 두 점의 함수 값의 평균이다", "기울기는 미분 df(x)/dx 로 계산하며, Δf/Δx 가 나타내는 접선의 기울기이다"], "a": 3, "exp": "도식은 y = f(x) 위의 한 점에서 Δf/Δx 로 접선 y = df(x)/dx 를 구하는 고등학교 미분 개념을 보여준다."}, {"id": 87, "sec": "3.6", "diff": "기초", "q": "다중 선형 회귀(Multiple linear regression) 예시 표에서 집 가격을 예측하기 위해 사용된 특징이 아닌 것은?", "opts": ["크기(단위: feet²)", "방의 수", "소유자의 나이", "집 연식(단위: year)"], "a": 2, "exp": "표의 특징은 크기, 방의 수, 층 수, 집 연식 네 가지이며 가격이 출력 값이다."}, {"id": 88, "sec": "3.6", "diff": "기초", "q": "다중 선형 회귀 예시 표에서 크기 2,104, 방의 수 5, 층 수 1, 집 연식 45인 데이터의 가격은 얼마인가?", "opts": ["460", "232", "315", "178"], "a": 0, "exp": "표의 첫 행에 해당하며 가격은 460(단위 $1000)이다."}, {"id": 89, "sec": "3.6", "diff": "중급", "q": "다중 선형 회귀 예시 표에서 크기가 852인 데이터의 방의 수와 가격을 바르게 짝지은 것은?", "opts": ["3개, 315", "2개, 178", "5개, 460", "3개, 232"], "a": 1, "exp": "표의 네 번째 행은 크기 852, 방의 수 2, 층 수 1, 집 연식 36, 가격 178이다."}, {"id": 90, "sec": "3.6", "diff": "중급", "q": "다중 선형 회귀에서 x_i 와 x_ij 의 의미를 옳게 설명한 것은?", "opts": ["x_i는 i번째 출력 값이고 x_ij는 j번째 파라미터이다", "x_i는 특징의 개수이고 x_ij는 데이터의 개수이다", "x_i는 i번째 훈련데이터의 입력 값(특징 벡터)이고, x_ij는 그 입력 값의 j번째 특징 값이다", "x_i는 학습률이고 x_ij는 기울기이다"], "a": 2, "exp": "표의 한 행 전체가 x_i이고, 그 행의 j번째 열 값이 x_ij 이다."}, {"i const SECTIONS = {
  "3.1": "회귀와 분류, 회귀 예시",
  "3.2": "회귀 데이터셋 · 목적 · 학습과 상관관계",

};

const KEY = "mlx_week3_quiz_v1";

/* ---------- state ---------- */
let state = {
  answers:{},           // id -> chosen original option index
  secFilter:"ALL",
  diffFilter:"ALL",
  shuffleQ:false,
  shuffleO:false,
  reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
