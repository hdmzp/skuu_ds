<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10주차 · 딥러닝 CNN(합성곱 신경망) 100문제</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --muted:#657189;
    --line:#e2e8f2; --brand:#1560d8; --brand-deep:#0b3b8c; --brand-soft:#eaf1fe;
    --ok:#0f8a5f; --ok-soft:#e6f6ef; --no:#d43c4a; --no-soft:#fdecee;
    --warn:#b7791f; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 24px rgba(16,32,64,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1420; --card:#161e2c; --ink:#e8edf6; --muted:#98a4bb;
      --line:#273246; --brand:#5b96ff; --brand-deep:#a8c6ff; --brand-soft:#1a2740;
      --ok:#48c99a; --ok-soft:#122c23; --no:#ff7b88; --no-soft:#33191e;
      --warn:#e0b25c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 80px}

  header.top{margin-bottom:18px}
  .eyebrow{color:var(--brand);font-weight:700;font-size:13px;letter-spacing:.04em}
  h1{font-size:25px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

  /* controls */
  .controls{padding:14px 16px;margin-bottom:14px}
  .ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .ctl-label{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.13s; white-space:nowrap;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip.ghost[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
  .spacer{flex:1}

  /* progress */
  .prog{padding:14px 16px;margin-bottom:14px}
  .prog-head{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;margin-bottom:9px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:var(--ok)} .stat.no b{color:var(--no)}
  .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:99px;transition:width .3s}

  /* question */
  .qcard{padding:20px 20px 18px;margin-bottom:14px}
  .qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .tag.num{background:var(--brand-deep);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.num{background:var(--brand-soft);color:var(--brand-deep)} }
  .tag.sec{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.d1{background:var(--ok-soft);color:var(--ok)}
  .tag.d2{background:#fff4e0;color:var(--warn)}
  .tag.d3{background:var(--no-soft);color:var(--no)}
  @media (prefers-color-scheme: dark){ .tag.d2{background:#3a2e14} }
  .qtext{font-size:17.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;line-height:1.55}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:11px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);
    transition:.13s;
  }
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
  .opt:disabled{cursor:default}
  .opt .n{
    flex:none;width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .n{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--no);background:var(--no-soft)}
  .opt.wrong .n{background:var(--no);color:#fff}
  .opt .mark{margin-left:auto;font-size:13px;font-weight:700;flex:none;padding-left:8px}
  .opt.correct .mark{color:var(--ok)} .opt.wrong .mark{color:var(--no)}

  .exp{margin-top:14px;padding:13px 15px;border-radius:11px;background:var(--brand-soft);border-left:3px solid var(--brand);font-size:14.5px}
  .exp h4{margin:0 0 5px;font-size:12.5px;letter-spacing:.03em;color:var(--brand-deep)}
  .exp p{margin:0}
  .exp .ref{display:block;margin-top:7px;font-size:12.5px;color:var(--muted)}

  .nav{display:flex;gap:8px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:10px;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--no);border-color:var(--no)}
  .btn.danger:hover{background:var(--no-soft)}

  /* palette */
  details.pal{padding:0;margin-bottom:14px;overflow:hidden}
  details.pal summary{padding:13px 16px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
  details.pal summary::-webkit-details-marker{display:none}
  details.pal summary::before{content:"▸";color:var(--muted);transition:.15s}
  details.pal[open] summary::before{transform:rotate(90deg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:0 16px 16px}
  .cell{
    aspect-ratio:1;border:1px solid var(--line);background:transparent;border-radius:8px;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    font-variant-numeric:tabular-nums;transition:.1s;
  }
  .cell:hover{border-color:var(--brand);color:var(--brand)}
  .cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .cell.x{background:var(--no-soft);border-color:var(--no);color:var(--no)}
  .cell.cur{outline:2px solid var(--brand);outline-offset:1px}

  /* result */
  .result{padding:26px 22px;text-align:center}
  .score{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
  .score small{font-size:20px;color:var(--muted);font-weight:600}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:20px 0 6px;text-align:left}
  .bd{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .bd .k{font-size:12px;color:var(--muted)}
  .bd .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:21px} .qtext{font-size:16.5px} .opt{font-size:14.5px;padding:11px 12px}
    .ctl-label{min-width:100%;margin-bottom:-3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CHAPTER 10 · 딥러닝 CNN(합성곱 신경망)</div>
    <h1>10주차 &middot; 딥러닝 CNN(합성곱 신경망) — 100문제</h1>
    <p class="sub">강의자료 10.1~10.7절 전 범위 · 4지선다 · 난이도 3단계</p>
  </header>

  <section class="panel controls">
    <div class="ctl-row">
      <span class="ctl-label">단원</span>
      <div id="secChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">난이도</span>
      <div id="diffChips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="ctl-row">
      <span class="ctl-label">설정</span>
      <button class="chip ghost" id="shuffleQ" aria-pressed="false">문제 순서 섞기</button>
      <button class="chip ghost" id="shuffleO" aria-pressed="false">보기 순서 섞기</button>
      <span class="spacer"></span>
      <button class="chip" id="reviewBtn">오답 다시 풀기 <b id="wrongCount">0</b></button>
      <button class="chip" id="resetBtn">처음부터</button>
    </div>
  </section>

  <section class="panel prog">
    <div class="prog-head">
      <span class="stat">진도 <b><span id="doneN">0</span> / <span id="totalN">0</span></b></span>
      <span class="stat ok">정답 <b id="okN">0</b></span>
      <span class="stat no">오답 <b id="noN">0</b></span>
      <span class="spacer"></span>
      <span class="stat">정답률 <b id="rate">—</b></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <details class="panel pal">
    <summary>문제 번호로 이동 <span style="color:var(--muted);font-weight:400">(초록 = 정답, 빨강 = 오답)</span></summary>
    <div class="grid" id="palette"></div>
  </details>

  <main id="stage"></main>

  <footer>
    10주차 강의자료(딥러닝 CNN · 합성곱 신경망) 기반 자율 학습용 문제 세트<br>
    풀이 기록은 이 브라우저에만 저장되며, '처음부터'를 누르면 초기화됩니다.
  </footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "sec": "10.1", "diff": "기초", "q": "이 강의자료(10주차)의 학습 목표로 제시되지 않은 것은?", "opts": ["다층 퍼셉트론을 이용하여 이미지 분류하기", "순환 신경망(RNN)을 이용하여 시계열 예측하기", "합성 곱 신경망 구조를 이용하여 이미지 분류하기", "컬러 이미지에 대한 합성 곱 이해하기"], "a": 1, "exp": "자료의 학습 목표는 MLP를 이용한 이미지 분류, 합성 곱 신경망 구조를 이용한 이미지 분류, 컬러 이미지에 대한 합성 곱 이해 세 가지이며 순환 신경망은 다루지 않는다."}, {"id": 2, "sec": "10.1", "diff": "기초", "q": "자료에서 신경망이 학습하고 파라미터를 최적화하는 기본 원리에 대해 설명한 내용으로 옳은 것은?", "opts": ["MLP에만 존재하고 CNN에는 없다", "CNN에만 존재하고 MLP에는 없다", "CNN과 MLP 모두 동일하다", "층의 수에 따라 원리 자체가 달라진다"], "a": 2, "exp": "자료는 기초 지식 첫머리에서 신경망이 학습하고 파라미터를 최적화하는 기본 원리는 CNN과 MLP 모두 동일하다고 명시한다."}, {"id": 3, "sec": "10.1", "diff": "기초", "q": "MLP와 CNN의 '신경망 구조' 측면에서의 공통점으로 자료가 제시한 것은?", "opts": ["뉴런층이 겹겹이 쌓인 구조로 구성된다", "반드시 2차원 행렬만 입력받는다", "가중치 없이 편향만으로 예측한다", "층이 하나뿐인 단층 구조를 이룬다"], "a": 0, "exp": "자료의 기초 지식 1번 항목에서 MLP와 CNN은 모두 뉴런층이 겹겹이 쌓인 구조로 구성된다고 설명한다."}, {"id": 4, "sec": "10.1", "diff": "중급", "q": "MLP와 CNN의 가중치와 편향에 대한 설명 중 자료의 내용과 일치하는 것은?", "opts": ["두 모델 모두 가중치를 0으로 고정한 뒤 편향만 학습한다", "가중치는 사용자가 직접 설계해 넣고 학습 중에는 바뀌지 않는다", "MLP만 편향을 가지며 CNN은 편향을 갖지 않는다", "두 모델 모두 무작위 값으로 초기화되는 가중치와 편향을 가지며, 학습 과정에서 이 값들이 학습된다"], "a": 3, "exp": "기초 지식 2번 항목은 MLP와 CNN의 예측이 동일한 방식으로 작동하며, 두 가지 모두 무작위 값으로 초기화되는 가중치와 편향을 갖고 학습 과정에서 이들 값이 학습된다고 설명한다."}, {"id": 5, "sec": "10.1", "diff": "중급", "q": "자료가 'CNN을 설계할 때도 MLP와 마찬가지로 결정해야 한다'고 밝힌 하이퍼파라미터 항목의 묶음은?", "opts": ["픽셀 값의 범위, 이미지 파일 형식, 저장 경로", "오차 함수, 활성화 함수, 최적화 알고리즘", "촬영 각도, 조명, 해상도", "행렬의 전치 여부, 정렬 순서, 인덱스 방식"], "a": 1, "exp": "기초 지식 3번 항목에서 CNN을 설계할 때도 MLP와 마찬가지로 오차 함수, 활성화 함수, 최적화 알고리즘 등을 결정해야 한다고 밝힌다."}, {"id": 6, "sec": "10.1", "diff": "중급", "q": "자료가 설명한 신경망 학습 과정의 순서로 옳은 것은?", "opts": ["손실 함수 계산 → 순방향 계산 → 경사 하강법으로 파라미터 최적화", "경사 하강법으로 파라미터 최적화 → 순방향 계산 → 손실 함수 계산", "순방향 계산 → 손실 함수 계산 → 경사 하강법으로 파라미터 최적화", "순방향 계산 → 경사 하강법으로 파라미터 최적화 → 손실 함수 계산"], "a": 2, "exp": "기초 지식 4번 항목은 먼저 순방향 계산을 하고, 예측 결과와 실제 레이블 값으로 손실 함수를 계산한 뒤, 마지막으로 경사 하강법을 이용해 파라미터를 최적화한다고 설명한다."}, {"id": 7, "sec": "10.1", "diff": "중급", "q": "자료에 따르면 손실 함수(loss function)는 무엇을 이용해 계산되는가?", "opts": ["예측 결과와 실제 레이블 값", "커널의 크기와 스트라이드 값", "입력 이미지의 가로세로 크기", "은닉층의 개수와 뉴런 수"], "a": 0, "exp": "자료는 순방향 계산 후 예측 결과와 실제 레이블 값을 통해 손실 함수를 계산한다고 서술한다."}, {"id": 8, "sec": "10.1", "diff": "기초", "q": "자료에서 경사 하강법(Gradient Descent)이 담당하는 역할로 옳은 것은?", "opts": ["2차원 이미지를 1차원 벡터로 변환한다", "특징 맵의 최대값을 골라낸다", "출력층의 노드 수를 자동으로 결정한다", "파라미터를 최적화한다"], "a": 3, "exp": "자료는 학습의 마지막 단계에서 경사 하강법을 이용해 파라미터를 최적화한다고 설명한다. 1차원 벡터 변환은 Flatten, 최대값 선택은 최대 풀링의 역할이다."}, {"id": 9, "sec": "10.1", "diff": "심화", "q": "MLP와 CNN의 기초 지식에 관한 설명 중 자료의 내용과 다른 것은?", "opts": ["두 모델 모두 뉴런층이 쌓인 구조를 갖는다", "두 모델의 학습 방식에는 근본적으로 큰 차이가 있어 최적화 원리도 서로 다르다", "두 모델 모두 설계 시 활성화 함수를 정해야 한다", "두 모델의 예측은 동일한 방식으로 작동한다"], "a": 1, "exp": "자료는 MLP와 CNN의 학습 방식에 큰 차이가 없으며 파라미터 최적화의 기본 원리도 동일하다고 명시하므로 2번 설명이 자료와 어긋난다."}, {"id": 10, "sec": "10.1", "diff": "기초", "q": "학습 목표 중 '컬러 이미지'와 관련해 자료가 제시한 항목은?", "opts": ["컬러 이미지의 압축 알고리즘 구현하기", "컬러 이미지를 흑백으로 변환하는 필터 설계하기", "컬러 이미지에 대한 합성 곱 이해하기", "컬러 이미지의 히스토그램 평활화 수행하기"], "a": 2, "exp": "학습 목표 세 번째 항목이 '컬러 이미지에 대한 합성 곱 이해하기'이다."}, {"id": 11, "sec": "10.2", "diff": "기초", "q": "자료가 설명한 다층 퍼셉트론(MLP)의 구조적 특징으로 옳은 것은?", "opts": ["뉴런이 층 모양으로 모여 있고 인접한 층과 층 사이의 모든 뉴런이 가중치가 있는 연결을 갖는다", "인접한 층의 일부 뉴런만 선택적으로 연결된다", "같은 층 안의 뉴런끼리 서로 연결된다", "층 사이의 연결에는 가중치가 없고 편향만 존재한다"], "a": 0, "exp": "자료는 MLP를 뉴런이 층 모양으로 모여 있고 인접한 층과 층 사이의 모든 뉴런이 가중치가 있는 연결을 갖는 구조로 정의한다."}, {"id": 12, "sec": "10.2", "diff": "기초", "q": "자료에 제시된 MLP 구조의 구성으로 옳은 것은?", "opts": ["입력층 2개, 은닉층 1개, 출력층 2개", "하나의 입력층과 하나 또는 그 이상의 은닉층, 하나의 출력층", "입력층 없이 은닉층과 출력층만으로 구성", "은닉층 없이 입력층과 출력층만으로 구성"], "a": 1, "exp": "자료는 MLP 구조가 하나의 입력층과 하나 또는 그 이상의 은닉층, 하나의 출력층으로 구성된다고 설명한다."}, {"id": 13, "sec": "10.2", "diff": "기초", "q": "자료에 따르면 28x28 크기의 이미지는 컴퓨터가 볼 때 무엇으로 구성되는가?", "opts": ["길이가 28인 1차원 벡터", "28개의 서로 다른 이미지 파일", "28x28 크기의 행렬", "784개의 독립적인 컬러 채널"], "a": 2, "exp": "자료는 28x28 크기의 이미지가 컴퓨터에게는 28x28 크기의 행렬로 구성된다고 설명한다."}, {"id": 14, "sec": "10.2", "diff": "기초", "q": "자료에 따르면 이미지 행렬의 요소 값이 가지는 범위는?", "opts": ["-1 ~ 1", "0 ~ 1", "0 ~ 127", "0 ~ 255"], "a": 3, "exp": "자료는 이미지 행렬의 요소 값이 0~255의 범위를 가진다고 명시한다."}, {"id": 15, "sec": "10.2", "diff": "중급", "q": "MLP가 입력으로 받을 수 있는 데이터의 모양은?", "opts": ["모양이 (1,n)인 1차원 벡터", "모양이 (x,y)인 2차원 행렬", "모양이 (height, width, channels)인 3차원 텐서", "모양에 관계없이 어떤 배열이든 가능"], "a": 0, "exp": "자료는 MLP가 모양이 (1,n)인 1차원 벡터만 입력받는다고 설명한다."}, {"id": 16, "sec": "10.2", "diff": "중급", "q": "모양이 (x,y)인 2차원 이미지 행렬을 MLP에 그대로 입력할 수 없는 이유로 옳은 것은?", "opts": ["픽셀 값의 범위가 0~255로 너무 크기 때문", "MLP는 모양이 (1,n)인 1차원 벡터만 입력받기 때문", "MLP는 은닉층을 하나만 가질 수 있기 때문", "MLP의 출력층 활성화 함수가 소프트맥스이기 때문"], "a": 1, "exp": "MLP는 (1,n) 모양의 1차원 벡터만 입력받으므로 (x,y) 모양의 2차원 이미지 행렬은 그대로 입력할 수 없다."}, {"id": 17, "sec": "10.2", "diff": "기초", "q": "행렬을 모양이 (1,n)인 벡터로 변환하는 과정을 부르는 이름은?", "opts": ["수용 영역(receptive field)", "다운 샘플링(down sampling)", "이미지 벡터 변환(image flattening)", "제로 패딩(zero-padding)"], "a": 2, "exp": "자료는 행렬을 (1,n) 모양의 벡터로 변환하는 과정을 이미지 벡터 변환(image flattening)이라고 부른다."}, {"id": 18, "sec": "10.2", "diff": "중급", "q": "28x28 크기의 이미지를 MLP에 입력하기 위해 변환했을 때 얻어지는 벡터의 모양은?", "opts": ["(1x28)", "(28x28)", "(1x256)", "(1x784)"], "a": 3, "exp": "픽셀의 총 수는 28x28 = 784이므로 (28x28) 행렬을 (1x784) 모양의 벡터로 변환해야 한다."}, {"id": 19, "sec": "10.2", "diff": "중급", "q": "자료가 제시한 28x28 이미지의 입력 벡터 구성 방식으로 옳은 것은?", "opts": ["x=[row1, row2, …, row28] 처럼 각 행을 차례로 이어 붙인다", "열을 무작위 순서로 뽑아 이어 붙인다", "각 행의 평균값 28개만 모아 벡터를 만든다", "픽셀 값을 큰 순서대로 정렬해 벡터를 만든다"], "a": 0, "exp": "자료는 입력 벡터가 x=[row1, row2, …, row28]와 같이 행을 차례로 이어 붙여 구성된다고 설명한다."}, {"id": 20, "sec": "10.2", "diff": "기초", "q": "28x28 이미지를 다루는 MLP의 입력층이 가지게 되는 노드 수는?", "opts": ["28개", "784개", "512개", "256개"], "a": 1, "exp": "28x28 = 784이므로 신경망의 입력층이 가지게 될 노드는 784개이다."}, {"id": 21, "sec": "10.2", "diff": "중급", "q": "케라스 코드에서 Flatten 층이 수행하는 일은?", "opts": ["특징 맵의 최대값을 뽑아 크기를 줄인다", "이미지 둘레에 값이 0인 픽셀을 덧붙인다", "2차원 이미지 행렬을 입력받아 1차원 벡터로 변환한다", "클래스별 확률을 계산해 출력한다"], "a": 2, "exp": "자료는 소스 코드 중 Flatten이 2차원 이미지 행렬을 입력받아 1차원 벡터로 변환하는 과정을 수행한다고 설명한다."}, {"id": 22, "sec": "10.2", "diff": "중급", "q": "케라스에서 Flatten 층을 만들 때 반드시 파라미터로 지정해야 한다고 자료가 강조한 것은?", "opts": ["은닉층의 뉴런 수", "출력층의 활성화 함수", "합성곱 필터의 개수", "입력 이미지의 크기(input_shape)"], "a": 3, "exp": "자료는 Flatten 층을 만들 때 입력 이미지의 크기를 반드시 파라미터로 지정해야 한다는 점을 주의사항으로 강조한다."}, {"id": 23, "sec": "10.2", "diff": "중급", "q": "MLP의 은닉층에 대한 자료의 설명으로 옳은 것은?", "opts": ["이론적으로는 원하는 수만큼 가질 수 있고, 각 층의 뉴런 수도 원하는 만큼 정할 수 있다", "은닉층은 반드시 1개만 둘 수 있다", "은닉층의 뉴런 수는 입력층 노드 수와 항상 같아야 한다", "은닉층은 파라미터를 전혀 갖지 않는다"], "a": 0, "exp": "자료는 신경망이 이론적으로 원하는 수만큼 은닉층을 가질 수 있고, 각 층의 뉴런 수도 원하는 만큼 정할 수 있다고 설명한다."}, {"id": 24, "sec": "10.2", "diff": "기초", "q": "분류 문제에서 MLP 출력층의 노드 수를 결정하는 기준은?", "opts": ["은닉층의 개수", "분류 대상 클래스 수", "입력 이미지의 픽셀 수", "학습 데이터의 개수"], "a": 1, "exp": "자료는 분류 문제의 출력층 노드 수가 분류 대상 클래스 수와 같다고 명시한다."}, {"id": 25, "sec": "10.2", "diff": "중급", "q": "0부터 9까지의 숫자를 분류하는 문제에서 자료가 제시한 출력층 구성은?", "opts": ["노드 1개를 갖는 Dense 층에 시그모이드 함수 사용", "노드 9개를 갖는 Dense 층에 ReLU 함수 사용", "노드 10개를 갖는 Dense 층에 소프트맥스 함수 사용", "노드 784개를 갖는 Dense 층에 소프트맥스 함수 사용"], "a": 2, "exp": "분류 대상이 0~9의 숫자 10개이므로 노드 10개를 갖는 Dense layer를 추가하며, 케라스 구현에서 activation='softmax'를 사용한다."}, {"id": 26, "sec": "10.3", "diff": "기초", "q": "케라스 model.summary() 출력에서 'Param #' 필드가 의미하는 것은?", "opts": ["해당 층이 처리한 이미지 수", "해당 층의 출력 이미지 크기", "해당 층의 활성화 함수 종류", "해당 층의 파라미터(가중치) 수"], "a": 3, "exp": "자료는 출력된 내용 중 Param # 필드가 해당 층의 파라미터(가중치) 수를 의미한다고 설명한다."}, {"id": 27, "sec": "10.3", "diff": "중급", "q": "MLP 모델 개요에서 Flatten 층의 파라미터 수가 0인 이유로 옳은 것은?", "opts": ["Flatten 층은 이미지를 나타내는 행렬을 벡터로 변환하는 역할만 하기 때문", "Flatten 층은 학습 중에만 가중치를 만들었다가 지우기 때문", "Flatten 층의 가중치가 다음 Dense 층에 합쳐져 표시되기 때문", "Flatten 층은 편향만 갖고 가중치를 갖지 않기 때문"], "a": 0, "exp": "자료는 Flatten층이 이미지를 나타내는 행렬을 벡터로 변환하는 역할만 하기 때문에 파라미터 수가 0이라고 설명한다."}, {"id": 28, "sec": "10.3", "diff": "중급", "q": "입력 노드 784개와 노드 512개인 dense_1 층을 잇는 파라미터 수 401,920은 어떻게 계산되는가?", "opts": ["784×512 = 401,408", "(784×512)+512 = 401,920", "(784+512)×512 = 663,552", "784×512×2 = 802,816"], "a": 1, "exp": "자료는 가중치 784×512에 편향 512개를 더해 (784*512)+512 = 401,920개가 된다고 계산한다."}, {"id": 29, "sec": "10.3", "diff": "기초", "q": "파라미터 수 계산식 (784*512)+512 에서 맨 앞의 784가 가리키는 것은?", "opts": ["dense_1층의 노드 수", "편향의 개수", "입력층의 노드 수", "출력층의 클래스 수"], "a": 2, "exp": "자료는 784가 입력층의 노드 수, 512가 dense_1층의 노드 수, 마지막 512가 편향 수라고 설명한다."}, {"id": 30, "sec": "10.3", "diff": "중급", "q": "파라미터 수 계산식 (784*512)+512 에서 뒤에 더해지는 512가 의미하는 것은?", "opts": ["입력층 노드 수", "출력층 노드 수", "은닉층의 개수", "편향(bias)의 수"], "a": 3, "exp": "자료는 곱셈 뒤에 더해지는 512를 편향 수라고 설명한다. 각 노드가 하나씩 편향을 갖기 때문이다."}, {"id": 31, "sec": "10.3", "diff": "중급", "q": "dense_2층과 dense_3층을 잇는 파라미터 수로 자료가 제시한 값과 그 계산식은?", "opts": ["(512×512)+512 = 262,656", "(512×512)+10 = 262,154", "(512×256)+512 = 131,584", "512×512 = 262,144"], "a": 0, "exp": "자료는 dense_2층과 dense_3층을 잇는 파라미터 수를 (512x512)+512 = 262,656개로 계산한다."}, {"id": 32, "sec": "10.3", "diff": "중급", "q": "노드 512개인 dense_3층과 노드 10개인 출력층을 잇는 파라미터 수는?", "opts": ["5,120개", "5,130개", "5,220개", "512개"], "a": 1, "exp": "(512x10)+10 = 5,130개이며, 마지막 10은 출력층 노드 10개에 대한 편향 수이다."}, {"id": 33, "sec": "10.3", "diff": "기초", "q": "자료의 MLP 예시에서 신경망 전체 파라미터 수는 몇 개인가?", "opts": ["401,920개", "262,656개", "669,706개", "220,234개"], "a": 2, "exp": "401,920 + 262,656 + 5,130 = 669,706개이다."}, {"id": 34, "sec": "10.3", "diff": "기초", "q": "자료에서 신경망의 '학습'을 무엇이라고 설명하는가?", "opts": ["입력 이미지를 정규화하는 과정", "층의 개수를 늘려 가는 과정", "출력층의 노드 수를 조정하는 과정", "가중치가 조정되는 과정"], "a": 3, "exp": "자료는 학습이 이들 가중치가 조정되는 과정이라고 설명한다."}, {"id": 35, "sec": "10.3", "diff": "중급", "q": "자료가 지적한 다층 퍼셉트론의 단점으로 옳은 것은?", "opts": ["신경망의 크기를 감안하면 파라미터 수가 너무 많다", "은닉층을 두 개 이상 쌓을 수 없다", "출력층에 소프트맥스 함수를 쓸 수 없다", "학습에 경사 하강법을 사용할 수 없다"], "a": 0, "exp": "자료는 크지 않은 신경망도 669,706개나 되는 파라미터를 학습해야 한다며, 신경망 크기를 감안하면 파라미터 수가 너무 많은 것이 MLP의 단점이라고 밝힌다."}, {"id": 36, "sec": "10.3", "diff": "중급", "q": "MLP로 이미지를 다룰 때 발생하는 '공간적 특징의 손실'이 일어나는 시점은?", "opts": ["출력층에서 소프트맥스를 적용할 때", "2차원 이미지를 1차원 벡터로 변형할 때", "손실 함수를 계산할 때", "가중치를 무작위로 초기화할 때"], "a": 1, "exp": "자료는 2차원 이미지를 1차원 벡터로 변형하면 이미지 내 공간적 특징이 손실된다고 설명한다."}, {"id": 37, "sec": "10.3", "diff": "중급", "q": "이미지를 1차원 벡터로 변형했을 때 정보 손실이 생기는 이유로 자료가 든 것은?", "opts": ["픽셀 값이 0~255에서 0~1로 바뀌기 때문", "벡터의 길이가 784로 줄어들기 때문", "서로 가까이 위치한 픽셀 간의 관계를 알 수 없게 되기 때문", "행렬의 대각 성분만 남기 때문"], "a": 2, "exp": "자료는 벡터로 펴면 서로 가까이 위치한 픽셀 간의 관계를 알 수 없기 때문에 정보의 손실이 발생한다고 설명한다."}, {"id": 38, "sec": "10.3", "diff": "기초", "q": "자료가 제시한, MLP의 공간적 특징 손실 문제를 해결할 수 있는 방법은?", "opts": ["은닉층의 뉴런 수를 512개로 늘리는 것", "Flatten 층을 두 번 적용하는 것", "출력층 노드를 클래스 수보다 많이 두는 것", "합성곱 신경망(Convolutional Neural Network)을 사용하는 것"], "a": 3, "exp": "자료는 공간적 특징 손실을 해결할 수 있는 방법이 Convolutional Neural Network라고 결론짓는다."}, {"id": 39, "sec": "10.3", "diff": "심화", "q": "자료의 파라미터 계산 방식을 그대로 적용할 때, 노드 512개인 은닉층과 클래스가 5개인 출력층을 잇는 파라미터 수는?", "opts": ["2,565개", "2,560개", "2,570개", "512개"], "a": 0, "exp": "자료의 계산 규칙 (앞 층 노드 수 × 뒤 층 노드 수) + 뒤 층 편향 수를 적용하면 (512×5)+5 = 2,565개이다."}, {"id": 40, "sec": "10.4", "diff": "중급", "q": "자료가 밝힌 CNN의 탄생 배경으로 옳은 것은?", "opts": ["합성곱 연산이 행렬 곱보다 계산이 빠르기 때문", "2차원 이미지를 1차원 벡터로 변환하면서 손실되는 정보와 전결합층의 계산 복잡도를 고려했기 때문", "이미지의 픽셀 값 범위를 0~1로 줄이기 위해서", "출력층에서 소프트맥스를 사용할 수 없었기 때문"], "a": 1, "exp": "자료는 2차원 행렬인 이미지를 1차원 벡터로 변환하면서 손실되는 정보와 Fully-connected layer의 계산 복잡도를 고려하여 CNN이 탄생했다고 설명한다."}, {"id": 41, "sec": "10.4", "diff": "기초", "q": "CNN이 픽셀 값에 숨어 있는 패턴을 이해할 수 있는 이유로 자료가 제시한 것은?", "opts": ["모든 픽셀을 0 또는 1로 이진화하기 때문", "은닉층 수가 MLP보다 훨씬 많기 때문", "2차원 이미지 행렬을 그대로 입력받을 수 있기 때문", "학습 데이터를 훨씬 많이 사용하기 때문"], "a": 2, "exp": "자료는 CNN이 2차원 이미지 행렬을 그대로 입력받을 수 있으므로 픽셀 값에 숨어 있는 패턴을 이해할 수 있다고 설명한다."}, {"id": 42, "sec": "10.4", "diff": "기초", "q": "CNN의 첫 번째 층에서 학습하는 특징의 예로 자료가 든 것은?", "opts": ["개의 수염", "자동차 바퀴", "얼굴의 일부", "모서리와 직선"], "a": 3, "exp": "자료는 첫 번째 층에서 모서리, 직선 같은 기본적인 특징을 학습한다고 설명하며, 나머지는 훨씬 깊은 층에서 학습되는 복잡한 패턴의 예이다."}, {"id": 43, "sec": "10.4", "diff": "중급", "q": "CNN에서 층이 깊어질수록 학습하는 패턴이 변하는 순서를 자료의 예시대로 나열한 것은?", "opts": ["모서리·직선 → 원·정사각형 → 얼굴의 일부·자동차 바퀴", "얼굴의 일부 → 원·정사각형 → 모서리·직선", "원·정사각형 → 모서리·직선 → 개의 수염", "모서리·직선 → 얼굴의 일부 → 원·정사각형"], "a": 0, "exp": "자료는 첫 번째 층에서 모서리·직선, 그 다음 층에서 원·정사각형, 이어지는 층에서 얼굴의 일부·자동차 바퀴·개의 수염 같은 훨씬 복잡한 패턴을 학습한다고 설명한다."}, {"id": 44, "sec": "10.4", "diff": "중급", "q": "자료가 CNN의 깊은 층에서 학습된다고 든 '훨씬 복잡한 패턴'의 예에 해당하지 않는 것은?", "opts": ["얼굴의 일부", "직선", "자동차 바퀴", "개의 수염"], "a": 1, "exp": "직선은 첫 번째 층에서 학습되는 기본적인 특징의 예이며, 얼굴의 일부·자동차 바퀴·개의 수염이 훨씬 복잡한 패턴의 예이다."}, {"id": 45, "sec": "10.4", "diff": "중급", "q": "CNN에서 합성곱층이 추출한 특징이 분류를 위해 거치는 과정으로 옳은 것은?", "opts": ["특징 맵을 그대로 출력층에 연결해 확률을 계산한다", "특징 맵의 평균값 하나만 남겨 출력층에 넘긴다", "Flatten을 통해 1차원 벡터로 만든 뒤 전결합층에 입력한다", "특징 맵을 다시 2차원 이미지로 복원한 뒤 출력층에 넘긴다"], "a": 2, "exp": "자료는 추출한 특징이 Flatten을 통해 1차원 벡터로 만들어지고, 그 특징이 Fully connected layer에 들어가 분류를 수행한다고 설명한다."}, {"id": 46, "sec": "10.4", "diff": "기초", "q": "자료가 제시한 CNN의 전체 구성 순서로 옳은 것은?", "opts": ["입력층 → 전결합층 → 합성곱층 → 예측 결과 출력", "합성곱층 → 입력층 → 전결합층 → 예측 결과 출력", "입력층 → 합성곱층 → 예측 결과 출력 → 전결합층", "입력층 → 특징 추출을 담당하는 합성곱층 → 분류를 담당하는 전결합층 → 예측 결과 출력"], "a": 3, "exp": "자료는 CNN 구조를 입력층 / 특징 추출을 담당하는 Convolution layer / 분류를 담당하는 Fully connected layer / 예측 결과 출력 순으로 제시한다."}, {"id": 47, "sec": "10.4", "diff": "기초", "q": "자료가 요약한 CNN의 구조를 세 단계로 표현하면?", "opts": ["특징 추출 / 분류 / 예측", "정규화 / 학습 / 저장", "입력 / 은닉 / 출력", "패딩 / 스트라이드 / 풀링"], "a": 0, "exp": "자료는 CNN이 특징 추출 / 분류 / 예측의 구조를 갖는다고 요약한다."}, {"id": 48, "sec": "10.4", "diff": "심화", "q": "자료가 숫자 3과 7을 분류하는 예로 설명한 CNN의 처리 단계를 순서대로 바르게 나열한 것은?", "opts": ["이미지 입력 → 1차원 특징 벡터 변환 → 특징 맵 추출 → 전결합층 분류 → 출력층 노드 발화", "이미지를 합성곱층에 입력 → 특징 맵 추출 → 1차원 특징 벡터로 변환 → 전결합층에서 분류 → 출력층 노드 발화", "이미지 입력 → 전결합층 분류 → 특징 맵 추출 → 출력층 노드 발화", "특징 맵 추출 → 이미지를 합성곱층에 입력 → 출력층 노드 발화 → 전결합층 분류"], "a": 1, "exp": "자료는 이미지를 합성곱층에 입력하고, 발견된 패턴이 특징 맵으로 추출된 뒤 1차원 특징 벡터로 변환되어 전결합층에 입력되고, 마지막으로 예측 결과에 해당하는 출력층 노드가 발화한다고 순서대로 설명한다."}, {"id": 49, "sec": "10.4", "diff": "기초", "q": "이미지가 합성곱층을 지날 때 발견된 패턴이 추출되어 만들어지는 것은?", "opts": ["수용 영역(receptive field)", "제로 패딩(zero-padding)", "특징 맵(feature map)", "손실 함수(loss function)"], "a": 2, "exp": "자료는 이미지가 합성 곱 층을 지나면 발견된 패턴이 Feature map(특징 맵)으로 추출된다고 설명한다."}, {"id": 50, "sec": "10.4", "diff": "중급", "q": "특징 추출이 진행되는 동안 이미지 크기와 특징 맵 수의 변화로 옳은 것은?", "opts": ["이미지 크기도 커지고 특징 맵 수도 늘어난다", "이미지 크기는 그대로이고 특징 맵 수만 줄어든다", "이미지 크기는 커지고 특징 맵 수는 줄어든다", "이미지 크기는 층을 지날 때마다 줄어들고 특징 맵 수는 늘어난다"], "a": 3, "exp": "자료는 특징 추출이 끝날 때까지 이미지의 크기가 각 층을 지날 때마다 줄어들고 특징 맵 수는 늘어난다고 설명한다."}, {"id": 51, "sec": "10.4", "diff": "중급", "q": "CNN의 예측 결과는 어떤 방식으로 나타난다고 자료는 설명하는가?", "opts": ["예측 결과에 해당하는 출력층의 노드가 발화한다", "합성곱 필터의 값이 0으로 수렴한다", "특징 맵의 크기가 1x1로 줄어든다", "입력 이미지가 원본 크기로 복원된다"], "a": 0, "exp": "자료는 예측 결과에 해당하는 출력층의 노드가 발화하며, 3과 7의 두 클래스 중 하나가 선택된다고 설명한다."}, {"id": 52, "sec": "10.4", "diff": "중급", "q": "자료가 설명한 CNN의 '특징 추출 단계'를 비유적으로 표현한 것으로 옳은 것은?", "opts": ["작은 이미지 여러 장을 이어 붙여 한 장의 큰 이미지를 만드는 과정", "큰 이미지를 여러 개의 작은 특징 맵으로 나눈 뒤 이를 쌓아 벡터로 만드는 과정", "이미지를 회전시켜 여러 각도의 사본을 만드는 과정", "이미지의 밝기를 조절해 대비를 높이는 과정"], "a": 1, "exp": "자료는 특징 추출 단계를 큰 이미지를 여러 개의 작은 특징 맵으로 나눈 뒤 이를 쌓아 벡터로 만드는 과정으로 설명한다."}, {"id": 53, "sec": "10.4", "diff": "중급", "q": "숫자 3이 쓰인 흑백 이미지가 입력되었을 때의 깊이와, 특징 가짓수를 네 가지로 볼 때의 깊이를 바르게 짝지은 것은?", "opts": ["입력 깊이 3, 특징 깊이 4", "입력 깊이 4, 특징 깊이 1", "입력 깊이 1, 특징 깊이 4", "입력 깊이 1, 특징 깊이 3"], "a": 2, "exp": "자료는 숫자 3이 쓰인 이미지가 입력되면 깊이 = 1이며, 특징 가지 수를 네 가지라고 하면 깊이는 4가 된다고 설명한다."}, {"id": 54, "sec": "10.4", "diff": "심화", "q": "CNN의 특징 추출에 대한 설명 중 자료의 내용과 가장 거리가 먼 것은?", "opts": ["이미지가 합성곱층을 차례로 통과하면 이미지 크기는 작아진다", "특징의 가짓수가 늘어나므로 깊이도 점점 깊어진다", "의미 있는 특징을 추출해 다른 특징과 함께 쌓아 둔다", "CNN은 입력 이미지를 실제로 여러 조각으로 잘라 각각을 따로 저장한다"], "a": 3, "exp": "자료는 CNN에서 실제로 이미지를 여러 조각으로 분할하지는 않고, 다른 사물이 찍힌 이미지와 구분되는 의미 있는 특징을 추출하여 다른 특징과 함께 쌓아 둔다고 강조한다."}, {"id": 55, "sec": "10.4", "diff": "심화", "q": "자료가 예로 든 전결합층의 판단 과정을 바르게 서술한 것은?", "opts": ["첫 번째 특징에서 모서리가 보이니 3, 7 또는 2일 것이고 두 번째 특징에서 곡선이 보이니 7은 아니라는 식으로 좁혀 3이라는 결론에 이른다", "특징 맵의 픽셀 값을 모두 더해 가장 큰 값을 가진 클래스를 고른다", "합성곱 필터의 크기를 바꿔 가며 가장 잘 맞는 클래스를 찾는다", "입력 이미지와 학습 이미지의 픽셀을 하나씩 비교해 동일한 이미지를 찾는다"], "a": 0, "exp": "자료는 전결합층이 첫 번째 특징에서 모서리를 보고 3, 7 또는 2로 좁히고, 두 번째 특징에서 곡선을 보고 7을 배제하는 식으로 숫자 3이라는 결론에 이른다고 설명한다."}, {"id": 56, "sec": "10.5", "diff": "기초", "q": "자료가 제시한 CNN의 기본 요소 세 가지를 바르게 묶은 것은?", "opts": ["합성곱층, 정규화층, 드롭아웃층", "합성곱층, 풀링층, 전결합층", "입력층, 은닉층, 출력층", "합성곱층, 순환층, 전결합층"], "a": 1, "exp": "자료는 CNN의 기본 요소로 합성곱층(convolution layer), 풀링층(pooling layer), 전결합층(fully connected layer)을 든다."}, {"id": 57, "sec": "10.5", "diff": "중급", "q": "합성곱 신경망의 기본 구성 요소를 두 가지로 구분할 때 각 요소가 담당하는 역할로 옳은 것은?", "opts": ["합성곱층은 분류, 전결합층은 특징 추출", "합성곱층은 정규화, 전결합층은 특징 추출", "합성곱층은 특징 추출, 전결합층은 분류", "합성곱층과 전결합층 모두 특징 추출만 담당"], "a": 2, "exp": "자료는 합성곱 신경망의 기본 구성 요소를 합성곱층과 전결합층으로 구분하며, 합성곱층은 특징 추출, 전결합층은 분류를 수행한다고 설명한다."}, {"id": 58, "sec": "10.5", "diff": "기초", "q": "자료가 합성곱층(convolution layer)을 무엇에 비유했는가?", "opts": ["이미지를 압축하는 지퍼", "픽셀을 지우는 지우개", "이미지를 정렬하는 저울", "이미지 위를 픽셀 단위로 오가며 특징을 찾는 확대경"], "a": 3, "exp": "자료는 합성곱층이 이미지 위를 픽셀 단위로 오가며 특징을 찾는 확대경과 같은 역할을 수행한다고 비유한다."}, {"id": 59, "sec": "10.5", "diff": "중급", "q": "수학에서 말하는 합성 곱(convolution)에 대한 자료의 설명으로 옳은 것은?", "opts": ["두 함수를 인수로 새로운 함수를 만들어 내는 연산", "하나의 함수를 미분해 기울기를 구하는 연산", "행렬의 행과 열을 맞바꾸는 연산", "여러 값 중 최대값을 고르는 연산"], "a": 0, "exp": "자료는 수학에서 말하는 합성 곱을 두 함수를 인수로 새로운 함수를 만들어 내는 연산이라고 정의한다."}, {"id": 60, "sec": "10.5", "diff": "중급", "q": "CNN 신경망에서 말하는 합성 곱의 첫 번째 인수와 두 번째 인수를 바르게 짝지은 것은?", "opts": ["첫 번째 인수는 합성 곱 필터, 두 번째 인수는 손실 함수", "첫 번째 인수는 입력 이미지, 두 번째 인수는 합성 곱 필터", "첫 번째 인수는 편향, 두 번째 인수는 입력 이미지", "첫 번째 인수는 특징 맵, 두 번째 인수는 출력층"], "a": 1, "exp": "자료는 CNN에서 말하는 합성 곱의 첫 번째 인수가 입력 이미지, 두 번째 인수가 합성 곱 필터에 해당한다고 설명한다."}, {"id": 61, "sec": "10.5", "diff": "기초", "q": "합성곱 연산 설명 그림에서 가운데 위치한 3x3 크기의 행렬을 무엇이라 부르는가?", "opts": ["수용 영역", "특징 맵", "합성곱 필터, 즉 커널(kernel)", "제로 패딩 영역"], "a": 2, "exp": "자료는 가운데 위치한 3x3 크기의 행렬이 합성곱 필터, 곧 커널(kernel)이라고 설명한다."}, {"id": 62, "sec": "10.5", "diff": "중급", "q": "수용 영역(receptive field)에 대한 자료의 정의로 옳은 것은?", "opts": ["합성곱 연산의 결과로 만들어진 새로운 이미지", "풀링 연산이 선택한 최대값의 위치", "출력층에서 발화하는 노드의 범위", "합성곱 연산이 한 번 수행되는, 필터가 위치한 입력 이미지 상의 범위"], "a": 3, "exp": "자료는 필터가 위치한 입력 이미지 상의 범위, 즉 합성곱 연산이 한 번 수행되는 입력 이미지 상의 범위를 수용 영역이라고 정의한다."}, {"id": 63, "sec": "10.5", "diff": "중급", "q": "자료에 따르면 합성곱 신경망에서 '커널 값'은 무엇에 해당하는가?", "opts": ["가중치", "편향", "학습률", "손실 값"], "a": 0, "exp": "자료는 합성 곱 신경망에서는 합성 곱 행렬이 바로 가중치라고 명시한다."}, {"id": 64, "sec": "10.5", "diff": "중급", "q": "합성 곱 행렬(커널)의 값이 정해지는 방식으로 옳은 것은?", "opts": ["설계자가 미리 정해 고정한 뒤 학습 중에도 바꾸지 않는다", "무작위 값으로 초기화된 뒤 신경망에 의해 학습된다", "입력 이미지의 평균 픽셀 값으로 초기화된다", "풀링층이 계산한 최대값으로 갱신된다"], "a": 1, "exp": "자료는 합성 곱 행렬이 무작위 값으로 초기화(randomly initialized)되며 신경망에 의해 학습된다고 설명한다."}, {"id": 65, "sec": "10.5", "diff": "중급", "q": "합성곱 연산에서 새로운 픽셀 값이 만들어지는 방식으로 옳은 것은?", "opts": ["수용 영역의 픽셀 값 중 최대값을 골라 그대로 사용한다", "수용 영역의 픽셀 값을 모두 평균 내어 사용한다", "수용 영역과 필터의 겹치는 픽셀 값을 각각 곱하고 그 결과를 합해 필터 중심에 해당하는 픽셀 값으로 삼는다", "수용 영역의 픽셀 값에서 필터 값을 각각 빼서 그 차이를 합한다"], "a": 2, "exp": "자료는 수용 영역과 합성곱 필터의 겹치는 픽셀 값을 각각 곱하고 그 결과를 합해서 필터 중심에 해당하는 픽셀의 픽셀 값을 계산한다고 설명한다. 최대값을 고르는 것은 최대 풀링의 방식이다."}, {"id": 66, "sec": "10.5", "diff": "중급", "q": "합성 곱 필터가 한 번 움직일 때마다 계산되는 가중합이 결정하는 것은?", "opts": ["다음 층의 은닉 뉴런 수", "출력층의 클래스 수", "입력 이미지의 픽셀 값 범위", "필터 중심에 해당하는 픽셀의 새로운 값"], "a": 3, "exp": "자료는 필터가 한 번 움직일 때마다 픽셀 단위로 가중합이 계산되어 필터 중심에 해당하는 픽셀의 새로운 값이 결정된다고 설명한다."}, {"id": 67, "sec": "10.5", "diff": "기초", "q": "합성곱 연산으로 만들어진 이미지를 부르는 두 가지 이름은?", "opts": ["특징 맵(feature map) 또는 활성화 맵(activation map)", "수용 영역 또는 커널", "스트라이드 또는 패딩", "전결합층 또는 소프트맥스층"], "a": 0, "exp": "자료는 이런 방법으로 만들어진 이미지를 특징 맵(feature map) 또는 활성화 맵(activation map)이라고 부른다고 설명한다."}, {"id": 68, "sec": "10.5", "diff": "기초", "q": "합성곱층이 가질 수 있는 합성곱 필터의 개수에 대한 설명으로 옳은 것은?", "opts": ["반드시 한 개만 가질 수 있다", "하나 또는 그 이상 가질 수 있다", "입력 이미지의 픽셀 수와 같아야 한다", "은닉층 수와 같아야 한다"], "a": 1, "exp": "자료는 합성곱층에 하나 또는 그 이상의 합성곱 필터가 있다고 설명한다."}, {"id": 69, "sec": "10.5", "diff": "중급", "q": "이전 합성곱층의 합성곱 필터 수가 결정하는 것은?", "opts": ["다음 층의 가로세로 크기", "스트라이드 값", "다음 층의 깊이", "출력층의 활성화 함수"], "a": 2, "exp": "자료는 이전 합성곱층의 필터 수만큼 특징 맵이 출력되기 때문에 이 필터 수가 다음 층의 깊이를 결정한다고 설명한다."}, {"id": 70, "sec": "10.5", "diff": "기초", "q": "케라스 Conv2D 층의 인수 중 '출력의 깊이를 결정한다'고 자료가 설명한 것은?", "opts": ["kernel_size", "strides", "padding", "filters"], "a": 3, "exp": "자료는 Filters가 합성곱 필터 수로 출력의 깊이를 결정하고, kernel_size는 커널의 크기, strides는 스트라이드, padding은 패딩을 지정한다고 정리한다."}, {"id": 71, "sec": "10.5", "diff": "심화", "q": "자료의 합성곱 연산 예시 (-1×3)+(0×0)+(1×1) + (-2×2)+(0×6)+(2×2) + (-1×2)+(0×4)+(1×1) 을 계산한 결과는?", "opts": ["-3", "3", "0", "-6"], "a": 0, "exp": "각 행을 계산하면 (-3+0+1) + (-4+0+4) + (-2+0+1) = -2 + 0 + (-1) = -3 이며, 자료의 그림에도 결과가 -3으로 표시되어 있다."}, {"id": 72, "sec": "10.6", "diff": "기초", "q": "자료에서 '커널 크기'가 의미하는 것은?", "opts": ["커널이 한 번에 이동하는 픽셀 수", "합성 곱 필터의 크기, 즉 필터의 너비x높이", "한 층이 갖는 커널의 개수", "커널이 갖는 가중치 값의 합"], "a": 1, "exp": "자료는 커널 크기가 합성 곱 필터 크기(너비x높이)를 의미한다고 설명한다. 한 번에 이동하는 픽셀 수는 스트라이드이다."}, {"id": 73, "sec": "10.6", "diff": "중급", "q": "커널에 대한 자료의 설명으로 옳은 것은?", "opts": ["픽셀 값을 그대로 복사해 다음 층에 전달하는 통로이다", "이미지 둘레에 0을 덧붙이는 규칙이다", "가중치가 담긴 행렬로, 입력 이미지 위를 이동하면서 특징을 추출하는 역할을 한다", "출력층에서 클래스별 확률을 계산하는 함수이다"], "a": 2, "exp": "자료는 커널이 가중치가 담긴 행렬로, 입력 이미지 위를 이동하면서 특징을 추출하는 역할을 한다고 설명한다."}, {"id": 74, "sec": "10.6", "diff": "중급", "q": "필터(커널)의 크기와 추출되는 특징의 관계에 대한 자료의 직관적 설명으로 옳은 것은?", "opts": ["필터 크기는 추출되는 특징의 세밀함과 아무 관계가 없다", "필터 크기가 클수록 이미지의 세세한 부분까지 더 잘 잡아낸다", "필터 크기가 작을수록 놓치는 세세한 부분이 많아진다", "필터 크기가 작을수록 이미지의 세세한 부분까지 잡아내고, 클수록 놓치는 세세한 부분이 많아진다"], "a": 3, "exp": "자료는 직관적으로 필터 크기가 작을수록 이미지의 세세한 부분까지 잡아낼 수 있고, 필터 크기가 클수록 놓치는 세세한 부분이 많아진다고 설명한다."}, {"id": 75, "sec": "10.6", "diff": "기초", "q": "스트라이드(stride)의 정의로 옳은 것은?", "opts": ["필터가 입력 이미지 위를 한 번에 이동하는 픽셀 수", "이미지 둘레에 덧붙이는 0 픽셀의 두께", "합성곱 필터의 개수", "풀링 윈도우 안에서 고르는 최대값"], "a": 0, "exp": "자료는 스트라이드를 필터가 입력 이미지 위를 한 번에 이동하는 픽셀 수로 정의한다."}, {"id": 76, "sec": "10.6", "diff": "중급", "q": "합성곱 필터가 입력 이미지 위를 한 번에 두 픽셀씩 이동한다면 스트라이드 값은?", "opts": ["1", "2", "4", "0"], "a": 1, "exp": "자료는 한 번에 한 픽셀씩 이동하면 스트라이드는 1, 한 번에 두 픽셀씩 이동하면 스트라이드는 2라고 설명한다."}, {"id": 77, "sec": "10.6", "diff": "심화", "q": "스트라이드에 대한 설명 중 자료의 내용과 일치하지 않는 것은?", "opts": ["한 번에 한 픽셀씩 이동하면 스트라이드 값은 1이다", "스트라이드는 필터가 한 번에 이동하는 폭을 나타낸다", "스트라이드는 합성곱 필터의 개수를 지정하는 값이다", "케라스 Conv2D 층에서는 strides 인수로 지정한다"], "a": 2, "exp": "필터의 개수를 지정하는 인수는 filters이며, strides는 필터가 한 번에 이동하는 픽셀 수를 지정한다."}, {"id": 78, "sec": "10.6", "diff": "기초", "q": "제로 패딩(zero-padding)에 대한 설명으로 옳은 것은?", "opts": ["이미지 안의 픽셀 값을 모두 0으로 바꾸는 것", "픽셀 값이 0인 이미지를 학습에서 제외하는 것", "특징 맵에서 값이 0인 픽셀을 지우는 것", "이미지 둘레에 픽셀 값이 0인 추가 픽셀을 덧붙이는 것"], "a": 3, "exp": "자료는 제로패딩을 이미지 둘레에 픽셀 값이 0인 추가 픽셀을 덧붙이는 것이라고 설명한다."}, {"id": 79, "sec": "10.6", "diff": "중급", "q": "자료가 밝힌 패딩(padding)의 주 목적은?", "opts": ["합성곱 연산을 거친 출력 이미지의 크기를 입력 이미지의 크기와 같게 유지하는 것", "파라미터 수를 줄여 계산 복잡도를 낮추는 것", "특징 맵의 깊이를 늘리는 것", "픽셀 값의 범위를 0~1로 정규화하는 것"], "a": 0, "exp": "자료는 패딩의 주 목적이 합성곱 연산을 거친 출력 이미지의 크기를 입력 이미지의 크기와 같게 유지하는 것이라고 밝힌다. 파라미터 수를 줄이는 것은 풀링층의 목적이다."}, {"id": 80, "sec": "10.6", "diff": "심화", "q": "패딩 값이 2일 때 이미지에 일어나는 변화로 옳은 것은?", "opts": ["이미지 둘레의 두 픽셀을 잘라낸다", "이미지 둘레에 두 픽셀 만큼의 패딩을 덧붙인다", "이미지의 가로세로 크기를 각각 2로 나눈다", "이미지를 세로로만 두 배 확대한다"], "a": 1, "exp": "자료는 패딩 값이 2이면 이미지 둘레에 두 픽셀 만큼의 패딩을 덧붙인다고 설명한다."}, {"id": 81, "sec": "10.6", "diff": "기초", "q": "풀링(pooling)의 목적으로 자료가 제시한 것은?", "opts": ["특징 맵의 깊이를 늘리는 것", "가중치를 무작위로 초기화하는 것", "다음 층으로 전달되는 파라미터 수를 감소시키는 것", "이미지의 색상 채널을 늘리는 것"], "a": 2, "exp": "자료는 풀링을 다음 층으로 전달되는 파라미터 수를 감소시키는 방법으로 정의한다."}, {"id": 82, "sec": "10.6", "diff": "중급", "q": "자료가 설명한 풀링 연산에 사용되는 통계 함수는?", "opts": ["미분과 적분", "행렬식과 역행렬", "표준편차와 분산", "최대 또는 평균"], "a": 3, "exp": "자료는 풀링 연산이 최대 또는 평균과 같은 통계 함수로 입력 크기를 축소한다고 설명한다."}, {"id": 83, "sec": "10.6", "diff": "중급", "q": "풀링층의 목적을 자료의 표현 그대로 서술한 것은?", "opts": ["합성곱층에서 만든 특징 맵을 다운 샘플링해서 파라미터 수를 줄여 계산 복잡도를 낮추는 것", "합성곱층이 놓친 특징을 새로 만들어 내는 것", "특징 맵을 1차원 벡터로 변환해 전결합층에 넘기는 것", "커널의 가중치를 직접 학습시키는 것"], "a": 0, "exp": "자료는 풀링층의 목적이 합성곱층에서 만든 특징 맵을 다운 샘플링해서 파라미터 수를 줄여 계산 복잡도를 낮추는 것이라고 명시한다."}, {"id": 84, "sec": "10.6", "diff": "기초", "q": "CNN 구조에서 풀링층은 일반적으로 어디에 배치되는가?", "opts": ["출력층 바로 뒤", "합성곱층 사이에 끼워 넣는 경우가 많다", "입력층 바로 앞", "전결합층과 전결합층 사이"], "a": 1, "exp": "자료는 CNN 구조가 일반적으로 합성 곱층 사이에 풀링 층을 끼워 넣는 경우가 많다고 설명한다."}, {"id": 85, "sec": "10.6", "diff": "심화", "q": "최대 풀링(max pooling)의 동작 방식으로 옳은 것은?", "opts": ["윈도우 내 픽셀 값의 평균을 구해 출력 픽셀 값으로 삼는다", "윈도우 내 픽셀 값을 모두 더해 출력 픽셀 값으로 삼는다", "앞의 합성곱층이 출력한 특징 맵을 입력받아 커널을 이동시키면서 윈도우 내 픽셀 값의 최대값을 출력 픽셀 값으로 삼는다", "윈도우 내 픽셀 값 중 최소값을 골라 출력 픽셀 값으로 삼는다"], "a": 2, "exp": "자료는 Max pooling이 자기 앞의 합성곱층에서 출력한 특징 맵을 입력받아 커널을 이동시키면서 윈도우 내 픽셀 값의 최대값을 찾아 출력 이미지의 픽셀 값으로 삼는다고 설명한다."}, {"id": 86, "sec": "10.6", "diff": "심화", "q": "스트라이드가 2인 2x2 크기의 최대 풀링을 4x4 크기의 특징 맵에 적용하면 출력 크기는 얼마가 되는가?", "opts": ["4x4", "3x3", "1x1", "2x2"], "a": 3, "exp": "자료는 스트라이드가 2인 2by2 크기의 풀링이 4x4 크기의 특징 맵을 2x2로 축소한다고 명시한다."}, {"id": 87, "sec": "10.7", "diff": "중급", "q": "28 by 28 입력 이미지가 필터 수 4, 스트라이드와 패딩이 1로 설정된 합성곱층을 통과했을 때의 출력으로 옳은 것은?", "opts": ["크기는 28x28로 입력과 동일하고 깊이는 4가 된다", "크기는 14x14로 줄고 깊이는 4가 된다", "크기는 28x28로 동일하고 깊이는 1로 유지된다", "크기는 24x24로 줄고 깊이는 1이 된다"], "a": 0, "exp": "자료는 28 by 28 입력 이미지가 필터 수 4, 스트라이드와 패딩이 1인 convolutional layer를 통과하면 출력 이미지의 크기는 입력과 동일하지만 깊이는 4가 된다고 설명한다."}, {"id": 88, "sec": "10.7", "diff": "중급", "q": "같은 28 by 28 입력 이미지가 커널 12개를 가진 합성곱층을 통과하면 출력 이미지의 깊이는?", "opts": ["4", "12", "28", "1"], "a": 1, "exp": "자료는 커널 12개를 통과하면 이미지 깊이는 12가 된다고 설명하며, 필터 수가 곧 출력의 깊이가 된다."}, {"id": 89, "sec": "10.7", "diff": "기초", "q": "풀링층을 통과한 출력의 변화로 옳은 것은?", "opts": ["깊이와 가로세로 크기가 모두 줄어든다", "깊이는 줄고 가로세로 크기는 유지된다", "깊이는 그대로 유지되지만 가로세로 크기는 줄어든다", "깊이와 가로세로 크기가 모두 그대로 유지된다"], "a": 2, "exp": "자료는 풀링층을 통과한 출력은 깊이는 그대로 유지되지만 가로세로 크기는 줄어든다고 설명한다."}, {"id": 90, "sec": "10.7", "diff": "중급", "q": "자료가 그림으로 제시한 CNN의 일반적인 층 배치 구성으로 옳은 것은?", "opts": ["전결합층과 풀링층을 번갈아 배치한다", "합성곱층만 여러 개 쌓고 풀링층은 쓰지 않는다", "풀링층 뒤에 항상 입력층을 다시 배치한다", "합성곱층과 풀링층을 번갈아 배치한다"], "a": 3, "exp": "자료는 합성곱층과 풀링층을 번갈아 배치한 구성을 제시하며, 이때 특징 맵은 점점 작아지고 깊어진다."}, {"id": 91, "sec": "10.7", "diff": "기초", "q": "CNN에서 전결합층(FC layer)을 사용하는 이유로 자료가 든 것은?", "opts": ["MLP는 분류에 효과적이기 때문", "MLP는 파라미터 수가 적기 때문", "MLP는 2차원 행렬을 그대로 받을 수 있기 때문", "MLP는 공간적 특징을 잘 보존하기 때문"], "a": 0, "exp": "자료는 FC-layer를 사용하는 이유로 MLP가 분류에 효과적이라는 점을 든다."}, {"id": 92, "sec": "10.7", "diff": "중급", "q": "전결합층의 구성에 대한 자료의 설명으로 옳지 않은 것은?", "opts": ["(1,n) 모양의 1차원 벡터로 변환해 입력해야 한다", "은닉층은 반드시 두 개 이상이어야 한다", "은닉층은 하나 이상의 층수를   reviewMode:false,
  order:[],             // array of question ids in display order
  optOrder:{},          // id -> array of original indices
  cursor:0
};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({
    answers:state.answers, shuffleQ:state.shuffleQ, shuffleO:state.shuffleO,
    secFilter:state.secFilter, diffFilter:state.diffFilter, optOrder:state.optOrder
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(d && typeof d==="object"){
      state.answers = d.answers||{};
      state.shuffleQ = !!d.shuffleQ; state.shuffleO = !!d.shuffleO;
      state.secFilter = d.secFilter||"ALL"; state.diffFilter = d.diffFilter||"ALL";
      state.optOrder = d.optOrder||{};
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function optOrderFor(q){
  if(!state.shuffleO) return [0,1,2,3];
  if(!state.optOrder[q.id]) { state.optOrder[q.id] = shuffled([0,1,2,3]); save(); }
  return state.optOrder[q.id];
}
function isWrong(q){ return q.id in state.answers && state.answers[q.id] !== q.a; }
function isRight(q){ return state.answers[q.id] === q.a; }

function buildOrder(keepCursor){
  let pool = QUESTIONS.filter(q =>
    (state.secFilter==="ALL" || q.sec===state.secFilter) &&
    (state.diffFilter==="ALL" || q.diff===state.diffFilter)
  );
  if(state.reviewMode && state.reviewIds && state.reviewIds.length)
    pool = state.reviewIds.map(id=>byId[id]);
  let ids = pool.map(q=>q.id);
  if(state.shuffleQ) ids = shuffled(ids);
  state.order = ids;
  if(!keepCursor) state.cursor = 0;
  if(state.cursor >= ids.length) state.cursor = Math.max(0, ids.length-1);
}

const byId = {}; QUESTIONS.forEach(q => byId[q.id]=q);

/* ---------- rendering ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage");

function renderChips(){
  const sc = $("#secChips"); sc.innerHTML="";
  const mk = (label,val,cur,handler)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label;
    b.setAttribute("aria-pressed", String(cur===val));
    b.onclick=()=>handler(val); return b;
  };
  sc.appendChild(mk("전체 "+QUESTIONS.length+"문항","ALL",state.secFilter,setSec));
  Object.keys(SECTIONS).forEach(k=>{
    const n = QUESTIONS.filter(q=>q.sec===k).length;
    sc.appendChild(mk(k+" "+SECTIONS[k]+" ("+n+")",k,state.secFilter,setSec));
  });
  const dc = $("#diffChips"); dc.innerHTML="";
  dc.appendChild(mk("전체","ALL",state.diffFilter,setDiff));
  DIFFS.forEach(d=>{
    const n = QUESTIONS.filter(q=>q.diff===d).length;
    dc.appendChild(mk(d+" ("+n+")",d,state.diffFilter,setDiff));
  });
  $("#shuffleQ").setAttribute("aria-pressed", String(state.shuffleQ));
  $("#shuffleO").setAttribute("aria-pressed", String(state.shuffleO));
  $("#reviewBtn").setAttribute("aria-pressed", String(state.reviewMode));
}

function setSec(v){ state.secFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }
function setDiff(v){ state.diffFilter=v; state.reviewMode=false; buildOrder(false); save(); renderAll(); }

function renderProgress(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const no = done - ok;
  $("#doneN").textContent = done;
  $("#totalN").textContent = ids.length;
  $("#okN").textContent = ok;
  $("#noN").textContent = no;
  $("#rate").textContent = done ? Math.round(ok/done*100)+"%" : "—";
  $("#barFill").style.width = ids.length ? (done/ids.length*100)+"%" : "0%";
  $("#wrongCount").textContent = QUESTIONS.filter(isWrong).length;
}

function renderPalette(){
  const p = $("#palette"); p.innerHTML="";
  state.order.forEach((id,i)=>{
    const q = byId[id];
    const b=document.createElement("button");
    b.className="cell" + (id in state.answers ? (isRight(q)?" o":" x") : "") + (i===state.cursor?" cur":"");
    b.textContent = q.id;
    b.title = q.sec+" · "+q.diff;
    b.onclick=()=>{ state.cursor=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    p.appendChild(b);
  });
}

function renderQuestion(){
  stage.innerHTML="";
  if(!state.order.length){
    const d=document.createElement("div"); d.className="panel empty";
    d.textContent = state.reviewMode ? "틀린 문제가 없습니다. 잘하셨어요!" : "조건에 맞는 문제가 없습니다. 필터를 바꿔 보세요.";
    stage.appendChild(d); return;
  }
  const idx = state.cursor;
  const q = byId[state.order[idx]];
  const answered = q.id in state.answers;
  const order = optOrderFor(q);

  const card=document.createElement("section"); card.className="panel qcard";

  const meta=document.createElement("div"); meta.className="qmeta";
  meta.innerHTML =
    '<span class="tag num">'+ (idx+1) +' / '+ state.order.length +'</span>' +
    '<span class="tag sec">'+ q.sec +' '+ SECTIONS[q.sec] +'</span>' +
    '<span class="tag '+ DIFFCLS[q.diff] +'">'+ q.diff +'</span>' +
    '<span style="margin-left:auto;font-size:12px;color:var(--muted)">문제 '+ q.id +'번</span>';
  card.appendChild(meta);

  const h=document.createElement("h2"); h.className="qtext"; h.textContent=q.q; card.appendChild(h);

  const wrap=document.createElement("div"); wrap.className="opts";
  order.forEach((orig,pos)=>{
    const b=document.createElement("button"); b.className="opt"; b.type="button";
    b.innerHTML = '<span class="n">'+(pos+1)+'</span><span class="t"></span>';
    b.querySelector(".t").textContent = q.opts[orig];
    if(answered){
      b.disabled = true;
      if(orig===q.a){ b.classList.add("correct"); b.insertAdjacentHTML("beforeend",'<span class="mark">정답</span>'); }
      else if(orig===state.answers[q.id]){ b.classList.add("wrong"); b.insertAdjacentHTML("beforeend",'<span class="mark">내 선택</span>'); }
    } else {
      b.onclick=()=>{ state.answers[q.id]=orig; save(); renderAll(); };
    }
    wrap.appendChild(b);
  });
  card.appendChild(wrap);

  if(answered){
    const e=document.createElement("div"); e.className="exp";
    const good = isRight(q);
    e.innerHTML = '<h4>'+(good?'✓ 정답입니다':'✕ 다시 확인해 보세요')+'</h4><p></p>'+
                  '<span class="ref">관련 단원 · '+q.sec+' '+SECTIONS[q.sec]+'</span>';
    e.querySelector("p").textContent = q.exp;
    if(!good){ e.style.background="var(--no-soft)"; e.style.borderLeftColor="var(--no)"; e.querySelector("h4").style.color="var(--no)"; }
    card.appendChild(e);
  }

  const nav=document.createElement("div"); nav.className="nav";
  const prev=document.createElement("button"); prev.className="btn"; prev.textContent="← 이전";
  prev.disabled = idx===0; prev.onclick=()=>{ state.cursor--; renderAll(); };
  const next=document.createElement("button"); next.className="btn primary";
  next.textContent = idx===state.order.length-1 ? "결과 보기 →" : "다음 →";
  next.onclick=()=>{
    if(idx===state.order.length-1){ showResult(); }
    else { state.cursor++; renderAll(); }
  };
  const redo=document.createElement("button"); redo.className="btn"; redo.textContent="이 문제 다시";
  redo.disabled = !answered;
  redo.onclick=()=>{ delete state.answers[q.id]; save(); renderAll(); };
  nav.appendChild(prev); nav.appendChild(redo);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(next);
  card.appendChild(nav);

  stage.appendChild(card);
}

function showResult(){
  const ids = state.order;
  const done = ids.filter(id=> id in state.answers).length;
  const ok = ids.filter(id=> isRight(byId[id])).length;
  const card=document.createElement("section"); card.className="panel result";
  const pct = done ? Math.round(ok/done*100) : 0;
  let msg = pct>=90?"완벽합니다. 1주차 내용을 확실히 이해했어요."
          : pct>=75?"좋습니다. 틀린 문제만 복습하면 충분해요."
          : pct>=50?"절반 이상 맞혔습니다. 오답 노트를 한 번 더 돌려 보세요."
          : "해설을 읽으며 오답부터 차근히 정리해 봅시다.";

  const per = {};
  Object.keys(SECTIONS).forEach(k=>{
    const sub = ids.map(i=>byId[i]).filter(q=>q.sec===k && (q.id in state.answers));
    if(sub.length) per[k] = [sub.filter(isRight).length, sub.length];
  });

  card.innerHTML =
    '<div class="eyebrow">결과</div>'+
    '<div class="score">'+ok+' <small>/ '+done+' 정답</small></div>'+
    '<div class="stat" style="font-size:15px">정답률 <b>'+pct+'%</b> · '+msg+'</div>'+
    '<div class="breakdown">'+ Object.keys(per).map(k=>
       '<div class="bd"><div class="k">'+k+' '+SECTIONS[k]+'</div><div class="v">'+per[k][0]+' / '+per[k][1]+'</div></div>'
     ).join('') +'</div>';

  const nav=document.createElement("div"); nav.className="nav";
  const back=document.createElement("button"); back.className="btn"; back.textContent="← 문제로 돌아가기";
  back.onclick=()=>renderAll();
  const rev=document.createElement("button"); rev.className="btn primary";
  const wn = QUESTIONS.filter(isWrong).length;
  rev.textContent="틀린 문제 "+wn+"개 다시 풀기"; rev.disabled = wn===0;
  rev.onclick=()=>enterReview();
  nav.appendChild(back);
  const sp=document.createElement("span"); sp.className="spacer"; nav.appendChild(sp);
  nav.appendChild(rev);
  card.appendChild(nav);

  stage.innerHTML=""; stage.appendChild(card);
  renderProgress(); renderPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}

function enterReview(){
  const wrongIds = QUESTIONS.filter(isWrong).map(q=>q.id);
  if(!wrongIds.length){
    state.reviewMode=false; buildOrder(false); renderAll();
    alert("틀린 문제가 없습니다.");
    return;
  }
  wrongIds.forEach(id=> delete state.answers[id]);
  state.reviewMode = true;
  state.reviewIds = wrongIds;
  state.order = state.shuffleQ ? shuffled(wrongIds) : wrongIds.slice();
  state.cursor = 0;
  save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderAll(){ renderChips(); renderProgress(); renderPalette(); renderQuestion(); }

/* ---------- events ---------- */
$("#shuffleQ").onclick=()=>{ state.shuffleQ=!state.shuffleQ; buildOrder(false); save(); renderAll(); };
$("#shuffleO").onclick=()=>{
  state.shuffleO=!state.shuffleO;
  if(!state.shuffleO) state.optOrder={};
  save(); renderAll();
};
$("#reviewBtn").onclick=()=>{
  if(state.reviewMode){ state.reviewMode=false; buildOrder(false); save(); renderAll(); }
  else enterReview();
};
$("#resetBtn").onclick=()=>{
  state.answers={}; state.optOrder={}; state.reviewMode=false;
  buildOrder(false); save(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});
};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight" && state.cursor < state.order.length-1){ state.cursor++; renderAll(); }
  if(e.key==="ArrowLeft" && state.cursor>0){ state.cursor--; renderAll(); }
  if(["1","2","3","4"].includes(e.key)){
    const btns = document.querySelectorAll(".opt:not(:disabled)");
    const b = btns[Number(e.key)-1]; if(b) b.click();
  }
});

/* ---------- init ---------- */
load();
buildOrder(false);
// resume at first unanswered
const firstUn = state.order.findIndex(id=> !(id in state.answers));
state.cursor = firstUn === -1 ? 0 : firstUn;
renderAll();
</script>
</body>
</html>
